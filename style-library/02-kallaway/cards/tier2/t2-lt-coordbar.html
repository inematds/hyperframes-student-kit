<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · COORDBAR
  A data/metadata readout bar in monospace — two or three metadata fields
  in Space Mono separated by glow-rule dividers, with the name above in
  display type. Reads like a terminal HUD or broadcast ticker overlay.
  Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), meta (two metadata strings, ~30 chars each, shown
         as "FIELD · VALUE" pairs in the mono bar).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-coord {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-coord .local-bloom {
        position: absolute;
        left: 50px; bottom: 70px;
        width: 700px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 42% 82%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 78%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer stack */
      #t2-lt-coord .stack {
        position: absolute;
        left: 80px; bottom: 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        z-index: 2;
      }

      /* Name row */
      #t2-lt-coord .name-wrap {
        padding: 18px 36px 18px 36px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        border: var(--stroke) solid var(--glass-border);
        border-bottom: none;
        box-shadow: inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      #t2-lt-coord .name-wrap::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 50%, transparent);
      }

      #t2-lt-coord .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        line-height: 1.0;
      }

      /* Mono data bar beneath the name */
      #t2-lt-coord .data-bar {
        display: flex;
        align-items: center;
        padding: 13px 36px;
        gap: 0;
        background: rgba(var(--accent-rgb), 0.07);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.40);
        border-top: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow:
          0 8px 30px rgba(0,0,0,0.45),
          0 0 18px rgba(var(--accent-rgb), 0.12),
          inset 0 -1px 0 rgba(255,255,255,0.06);
        min-width: 560px;
        overflow: hidden;
        position: relative;
      }

      /* Scan-line accent at bottom edge */
      #t2-lt-coord .data-bar::after {
        content: "";
        position: absolute;
        bottom: 0; left: 0;
        width: 0; height: 1.5px;
        background: linear-gradient(90deg,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.55) 70%,
          transparent 100%);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.60);
      }

      /* A single field in the bar */
      #t2-lt-coord .field {
        display: flex;
        align-items: center;
        gap: 0;
        flex-shrink: 0;
      }

      #t2-lt-coord .field-key {
        font-family: var(--font-mono);
        font-weight: var(--wt-reg);
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
        white-space: nowrap;
        margin-right: 8px;
      }

      #t2-lt-coord .field-val {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 18px;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        white-space: nowrap;
      }

      /* Divider between fields */
      #t2-lt-coord .field-sep {
        width: 1px;
        height: 28px;
        background: rgba(var(--accent-rgb), 0.35);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.30);
        margin: 0 22px;
        flex-shrink: 0;
      }

      /* Blinking cursor at end — finite */
      #t2-lt-coord .cursor {
        width: 10px; height: 20px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        border-radius: 1px;
        margin-left: 14px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-coord"
         data-composition-id="t2-lt-coord"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stack">
        <div class="name-wrap">
          <div class="name" data-slot="name">Dr. Kevin Park</div>
        </div>
        <div class="data-bar" data-slot="meta">
          <div class="field">
            <span class="field-key">Role</span>
            <span class="field-val">ML Research Lead</span>
          </div>
          <div class="field-sep"></div>
          <div class="field">
            <span class="field-key">Org</span>
            <span class="field-val">AIS Institute</span>
          </div>
          <div class="field-sep"></div>
          <div class="field">
            <span class="field-key">Session</span>
            <span class="field-val">Module 04</span>
          </div>
          <div class="cursor"></div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-coord";

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.62, duration: 1.1, ease: "power2.out" }, 0);

      /* name-wrap glides in from left */
      tl.from(`${C} .name-wrap`,
        { autoAlpha: 0, x: -52, filter: "blur(14px)",
          duration: 0.76, ease: "power4.out" }, 0.08);

      /* name text reveals */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -16, filter: "blur(8px)",
          duration: 0.58, ease: "power4.out" }, 0.44);

      /* data bar slides in from left */
      tl.from(`${C} .data-bar`,
        { autoAlpha: 0, x: -52, filter: "blur(10px)",
          duration: 0.68, ease: "power4.out" }, 0.60);

      /* fields typewrite in stagger */
      const fields = document.querySelectorAll(`${C} .field`);
      const seps = document.querySelectorAll(`${C} .field-sep`);
      fields.forEach(function(f, i) {
        tl.from(f, { autoAlpha: 0, x: 14, duration: 0.38, ease: "power3.out" },
          0.88 + i * 0.12);
      });
      seps.forEach(function(s, i) {
        tl.from(s, { scaleY: 0, transformOrigin: "top center",
          duration: 0.28, ease: "power2.out" },
          0.96 + i * 0.12);
      });

      /* cursor appears */
      tl.from(`${C} .cursor`,
        { autoAlpha: 0, scaleY: 0, transformOrigin: "bottom center",
          duration: 0.28, ease: "power2.out" }, 1.36);

      /* cursor blinks — finite */
      tl.to(`${C} .cursor`,
        { autoAlpha: 0, duration: 0.26, ease: "none",
          repeat: 7, yoyo: true }, 1.60);

      /* bottom scan-line draws */
      tl.to(`${C} .data-bar::after`,
        { width: 560, duration: 0.65, ease: "power3.out" }, 0.72);

      /* data-bar glow rim pulse — finite */
      tl.to(`${C} .data-bar`,
        { boxShadow: "0 8px 30px rgba(0,0,0,0.45), 0 0 32px rgba(55,189,248,0.26), inset 0 -1px 0 rgba(255,255,255,0.08)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-coord"] = tl;
    </script>
  </body>
</html>
