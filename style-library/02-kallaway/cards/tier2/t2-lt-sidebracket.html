<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · SIDEBRACKET
  A name card flanked by one big glowing L-bracket on its left that draws itself
  on — two strokes tracing top+left edges. The bracket glows blue; name and role
  sit inside the implied frame. Transparent overlay over live footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-sbrk {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow behind bracket */
      #t2-lt-sbrk .local-bloom {
        position: absolute;
        left: 50px; bottom: 90px;
        width: 520px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 78%);
        filter: blur(38px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer wrapper — bracket + text together */
      #t2-lt-sbrk .wrapper {
        position: absolute;
        left: 80px; bottom: 120px;
        z-index: 2;
      }

      /* SVG bracket drawn via stroke-dashoffset */
      #t2-lt-sbrk .bracket-svg {
        position: absolute;
        left: 0; top: 0;
        width: 36px; height: 106px;
        overflow: visible;
      }

      /* Text block sits to the right of the bracket */
      #t2-lt-sbrk .text-block {
        margin-left: 56px;
        padding: 14px 32px 14px 24px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius) var(--radius) 0;
        border-top: var(--stroke) solid var(--glass-border);
        border-right: var(--stroke) solid var(--glass-border);
        border-bottom: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        min-width: 380px;
      }

      #t2-lt-sbrk .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 6px;
        line-height: 1.1;
      }

      #t2-lt-sbrk .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-sbrk"
         data-composition-id="t2-lt-sbrk"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="wrapper">
        <!-- SVG bracket: vertical stroke + short horizontal stroke at top -->
        <svg class="bracket-svg" viewBox="0 0 36 106" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="brkGlow" x="-60%" y="-20%" width="220%" height="140%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <!-- vertical line -->
          <line id="sbrk-vert" x1="8" y1="4" x2="8" y2="102"
            stroke="#37BDF8" stroke-width="3" stroke-linecap="round"
            style="filter: drop-shadow(0 0 8px rgba(55,189,248,0.80)) drop-shadow(0 0 20px rgba(55,189,248,0.40));"
          />
          <!-- top horizontal arm -->
          <line id="sbrk-horiz" x1="8" y1="4" x2="34" y2="4"
            stroke="#37BDF8" stroke-width="3" stroke-linecap="round"
            style="filter: drop-shadow(0 0 8px rgba(55,189,248,0.80)) drop-shadow(0 0 20px rgba(55,189,248,0.40));"
          />
          <!-- bottom horizontal arm -->
          <line id="sbrk-bot" x1="8" y1="102" x2="34" y2="102"
            stroke="rgba(55,189,248,0.40)" stroke-width="1.5" stroke-linecap="round"
          />
        </svg>

        <div class="text-block">
          <div class="name" data-slot="name">Kallaway Osei</div>
          <div class="role" data-slot="role">AI Education Director, AIS</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-sbrk";

      /* Measure lines for dashoffset animation */
      const vertEl  = document.getElementById("sbrk-vert");
      const horizEl = document.getElementById("sbrk-horiz");
      const botEl   = document.getElementById("sbrk-bot");

      const vertLen  = 98;   /* y2 - y1 */
      const horizLen = 26;   /* x2 - x1 */
      const botLen   = 26;

      /* Init all lines hidden */
      vertEl.style.strokeDasharray  = vertLen;
      vertEl.style.strokeDashoffset = vertLen;
      horizEl.style.strokeDasharray  = horizLen;
      horizEl.style.strokeDashoffset = horizLen;
      botEl.style.strokeDasharray  = botLen;
      botEl.style.strokeDashoffset = botLen;

      /* bloom blooms */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.6, duration: 1.1, ease: "expo.out" }, 0);

      /* vertical stroke draws down */
      tl.to(vertEl, {
        strokeDashoffset: 0, duration: 0.55, ease: "power3.out" }, 0.18);

      /* top horiz draws right immediately after vert starts */
      tl.to(horizEl, {
        strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 0.20);

      /* bottom horiz fades in subtly */
      tl.to(botEl, {
        strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 0.58);

      /* text block slides in from left */
      tl.from(`${C} .text-block`,
        { autoAlpha: 0, x: -30, duration: 0.72, ease: "back.out(1.4)" }, 0.55);

      /* name */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -18, duration: 0.60, ease: "power4.out" }, 0.78);

      /* role */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -12, duration: 0.55, ease: "power3.out" }, 0.94);

      /* bracket glow pulse — finite */
      tl.to(vertEl,
        { attr: { "stroke-opacity": 0.40 }, duration: 1.0,
          ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-sbrk"] = tl;
    </script>
  </body>
</html>
