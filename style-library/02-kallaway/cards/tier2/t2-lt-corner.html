<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · CORNER
  L-shaped corner glass card hugging the lower-left corner, name/role inside,
  accent corner-glow. Transparent background — only the card paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-cor {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom at the corner */
      #t2-lt-cor .local-bloom {
        position: absolute;
        left: -20px; bottom: -20px;
        width: 480px; height: 360px;
        background: radial-gradient(ellipse at 20% 85%,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.10) 45%,
          transparent 70%);
        filter: blur(42px);
        pointer-events: none;
        z-index: 1;
      }

      /* L-shape: two overlapping glass panels */
      #t2-lt-cor .l-wrap {
        position: absolute;
        left: 0; bottom: 0;
        z-index: 2;
      }

      /* Vertical arm — left edge */
      #t2-lt-cor .arm-v {
        position: absolute;
        left: 0; bottom: 0;
        width: 8px;
        height: 320px;
        background: var(--accent);
        border-radius: 0 6px 6px 0;
        box-shadow:
          0 0 12px rgba(var(--accent-rgb), 0.90),
          0 0 34px rgba(var(--accent-rgb), 0.55),
          0 0 72px rgba(var(--accent-rgb), 0.28);
        transform-origin: bottom left;
      }

      /* Horizontal arm — bottom edge */
      #t2-lt-cor .arm-h {
        position: absolute;
        left: 0; bottom: 0;
        width: 520px;
        height: 8px;
        background: var(--accent);
        border-radius: 0 0 6px 0;
        box-shadow:
          0 0 12px rgba(var(--accent-rgb), 0.90),
          0 0 34px rgba(var(--accent-rgb), 0.55),
          0 0 72px rgba(var(--accent-rgb), 0.28);
        transform-origin: bottom left;
      }

      /* Corner dot at the junction */
      #t2-lt-cor .corner-dot {
        position: absolute;
        left: -3px; bottom: -3px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--white);
        box-shadow:
          0 0 10px rgba(var(--accent-rgb), 1.00),
          0 0 28px rgba(var(--accent-rgb), 0.70),
          0 0 56px rgba(var(--accent-rgb), 0.40);
        z-index: 3;
      }

      /* Glass card for text, inset from corner */
      #t2-lt-cor .card {
        position: absolute;
        left: 24px; bottom: 24px;
        padding: 24px 30px 22px 22px;
        min-width: 360px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius) var(--radius) 0;
        border: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
      }

      /* Top highlight */
      #t2-lt-cor .card::before {
        content: "";
        position: absolute; top: 0; left: 8px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.46) 40%, rgba(255,255,255,0.46) 60%, transparent);
      }

      #t2-lt-cor .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 8px;
        line-height: 1.1;
      }

      #t2-lt-cor .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-cor"
         data-composition-id="t2-lt-cor"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="l-wrap">
        <!-- L arms drawn in -->
        <div class="arm-v"></div>
        <div class="arm-h"></div>
        <div class="corner-dot"></div>

        <!-- Glass content card -->
        <div class="card">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom swells in */
      tl.from("#t2-lt-cor .local-bloom",
        { autoAlpha: 0, scale: 0.55, duration: 1.3, ease: "power2.out" }, 0);

      /* corner dot pops in first */
      tl.from("#t2-lt-cor .corner-dot",
        { autoAlpha: 0, scale: 0, duration: 0.35, ease: "back.out(2.5)" }, 0.12);

      /* vertical arm draws up from bottom */
      tl.from("#t2-lt-cor .arm-v",
        { scaleY: 0, autoAlpha: 0, duration: 0.55, ease: "power3.out",
          transformOrigin: "bottom left" }, 0.28);

      /* horizontal arm draws right from left */
      tl.from("#t2-lt-cor .arm-h",
        { scaleX: 0, autoAlpha: 0, duration: 0.55, ease: "power3.out",
          transformOrigin: "bottom left" }, 0.42);

      /* card springs in */
      tl.from("#t2-lt-cor .card",
        { autoAlpha: 0, x: -28, y: 20, scale: 0.94,
          filter: "blur(10px)", transformOrigin: "left bottom",
          duration: 0.78, ease: "back.out(1.4)" }, 0.60);

      /* name in */
      tl.from("#t2-lt-cor .name",
        { autoAlpha: 0, x: -16, filter: "blur(7px)",
          duration: 0.58, ease: "power4.out" }, 0.96);

      /* role in */
      tl.from("#t2-lt-cor .role",
        { autoAlpha: 0, x: -12, filter: "blur(5px)",
          duration: 0.54, ease: "power3.out" }, 1.12);

      /* corner glow pulse — finite */
      tl.to("#t2-lt-cor .corner-dot",
        { boxShadow:
            "0 0 16px rgba(55,189,248,1.00), 0 0 40px rgba(55,189,248,0.85), 0 0 80px rgba(55,189,248,0.50)",
          duration: 1.0, ease: "sine.inOut", repeat: 4, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-cor"] = tl;
    </script>
  </body>
</html>
