<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · TYPEDNAME
  The name types in character-by-character in Space Mono with a blinking cursor
  (cursor blink is FINITE: repeat 6, yoyo). After the name is fully typed, the
  role line fades in beneath. All on a minimal dark glass strip anchored lower-left.
  Slots: name (~24 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-typed {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-typed .local-bloom {
        position: absolute;
        left: 50px; bottom: 90px;
        width: 580px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 78%,
          rgba(var(--accent-rgb), 0.25) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Glass strip */
      #t2-lt-typed .card {
        position: absolute;
        left: 80px; bottom: 128px;
        padding: 24px 36px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.40),
          0 0 18px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
        min-width: 400px;
      }

      /* Hairline top highlight */
      #t2-lt-typed .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.52) 60%, transparent);
      }

      /* Name line — monospace typed text + inline cursor */
      #t2-lt-typed .name-row {
        display: flex;
        align-items: baseline;
        gap: 0;
        margin-bottom: 10px;
      }

      #t2-lt-typed .name {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: 0.03em;
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.0;
      }

      /* Blinking cursor — a thin vertical bar */
      #t2-lt-typed .cursor {
        display: inline-block;
        width: 3px;
        height: 38px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80), 0 0 20px rgba(var(--accent-rgb), 0.45);
        border-radius: 2px;
        margin-left: 3px;
        vertical-align: middle;
        transform: translateY(-1px);
        /* starts visible; GSAP handles finite blink */
      }

      /* Role line */
      #t2-lt-typed .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-typed"
         data-composition-id="t2-lt-typed"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="name-row">
          <span class="name" id="typed-name-el" data-slot="name"></span>
          <span class="cursor" id="typed-cursor"></span>
        </div>
        <div class="role" id="typed-role-el" data-slot="role">Head of AI Curriculum Design</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-typed";

      /* Full name string to type */
      const FULL_NAME = "Cameron Walsh";
      const nameEl   = document.getElementById("typed-name-el");
      const cursorEl = document.getElementById("typed-cursor");
      const roleEl   = document.getElementById("typed-role-el");

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.58, duration: 1.1, ease: "power2.out" }, 0);

      /* card fades/rises */
      tl.from(`${C} .card`,
        { autoAlpha: 0, y: 22, scale: 0.94,
          filter: "blur(10px)", transformOrigin: "left bottom",
          duration: 0.78, ease: "back.out(1.4)" }, 0.12);

      /* cursor appears before typing starts */
      tl.from(cursorEl, { autoAlpha: 0, duration: 0.20, ease: "none" }, 0.60);

      /* Type each character via proxy — one char per step, mono-spaced feel */
      const charCount = FULL_NAME.length;
      const typeDur   = charCount * 0.072;   /* ~72ms per char */
      tl.to({ ch: 0 }, {
        ch: charCount, duration: typeDur, ease: "none",
        onUpdate: function() {
          const n = Math.round(this.targets()[0].ch);
          if (nameEl) nameEl.textContent = FULL_NAME.slice(0, n);
        },
        onComplete: function() {
          if (nameEl) nameEl.textContent = FULL_NAME;
        }
      }, 0.72);

      /* Cursor blink after typing — FINITE: repeat 6, yoyo */
      const blinkStart = 0.72 + typeDur + 0.10;
      tl.to(cursorEl, {
        autoAlpha: 0, duration: 0.30, ease: "none",
        repeat: 6, yoyo: true
      }, blinkStart);

      /* Cursor fades out after blink sequence ends */
      const blinkEnd = blinkStart + 0.30 * 14;  /* 14 half-cycles */
      tl.to(cursorEl, { autoAlpha: 0, duration: 0.25, ease: "power2.out" }, blinkEnd + 0.05);

      /* Role fades in after name is fully typed */
      tl.from(roleEl, {
        autoAlpha: 0, y: 8, filter: "blur(6px)",
        duration: 0.52, ease: "power3.out"
      }, blinkStart);

      /* Card glow rim pulse — finite */
      tl.to(`${C} .card`, {
        boxShadow:
          "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.80), 0 0 28px rgba(55,189,248,0.45), inset 0 1px 0 rgba(255,255,255,0.22)",
        duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true
      }, blinkStart + 0.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-typed"] = tl;
    </script>
  </body>
</html>
