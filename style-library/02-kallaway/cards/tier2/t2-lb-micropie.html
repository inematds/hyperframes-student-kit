<!doctype html>
<!--
  KALLAWAY · tier2 · label · MICROPIE
  A small glowing donut/pie chart that fills to data-pct, with a percentage
  count-up at its center. A term label and detail line sit beside it. Anchored
  right side. Knob: data-pct on #t2-lb-mpie-svg (default 62).
  Slots: term (~28 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-mpie {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local bloom behind component */
      #t2-lb-mpie .local-glow {
        position: absolute; right: 100px; top: 360px;
        width: 520px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 0;
      }

      /* Outer positioning wrapper — right anchored */
      #t2-lb-mpie .wrapper {
        position: absolute; right: 140px; top: 400px;
        display: flex; flex-direction: row; align-items: center; gap: 30px;
        z-index: 2;
      }

      /* Donut container */
      #t2-lb-mpie .donut-wrap {
        position: relative;
        width: 130px; height: 130px;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }

      /* Outer glow halo */
      #t2-lb-mpie .donut-glow {
        position: absolute; inset: -18px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.22) 0%, transparent 68%);
        box-shadow: 0 0 50px 6px rgba(var(--accent-rgb), 0.22);
      }

      #t2-lb-mpie .donut-svg {
        width: 130px; height: 130px;
        position: relative; z-index: 2;
      }

      /* Percentage text inside donut */
      #t2-lb-mpie .donut-center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }

      #t2-lb-mpie .pct-text {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 28px;
        letter-spacing: -0.02em;
        color: var(--white);
        text-shadow: var(--textglow-accent);
      }

      /* Label column beside the donut */
      #t2-lb-mpie .label-col {
        display: flex; flex-direction: column; gap: 8px;
        max-width: 360px;
      }

      #t2-lb-mpie .term {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 30px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      #t2-lb-mpie .detail-wrap {
        padding: 9px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        position: relative; overflow: hidden;
      }

      #t2-lb-mpie .detail-wrap::before {
        content: "";
        position: absolute; top: 0; left: 8px; right: 8px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42) 50%, transparent);
      }

      #t2-lb-mpie .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 19px;
        line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-mpie"
         data-composition-id="t2-lb-mpie"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="donut-wrap">
          <div class="donut-glow"></div>

          <!-- data-pct drives fill (0–100). Default 62. -->
          <svg class="donut-svg" id="t2-lb-mpie-svg" data-pct="62"
               viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Track circle -->
            <circle cx="65" cy="65" r="50"
              stroke="rgba(255,255,255,0.08)"
              stroke-width="14" fill="none"
              stroke-linecap="round"/>
            <!-- Glowing fill arc — rotated to start at top -->
            <circle id="t2-lb-mpie-arc"
              cx="65" cy="65" r="50"
              stroke="url(#mpieGrad)"
              stroke-width="14" fill="none"
              stroke-linecap="round"
              transform="rotate(-90 65 65)"/>
            <defs>
              <linearGradient id="mpieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#37BDF8" stop-opacity="1"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.88"/>
              </linearGradient>
            </defs>
          </svg>

          <div class="donut-center">
            <div class="pct-text" id="t2-lb-mpie-num">0%</div>
          </div>
        </div>

        <div class="label-col">
          <div class="term" data-slot="term">Course Completion</div>
          <div class="detail-wrap">
            <div class="detail" data-slot="detail">Students who finish module 3 are 62% more likely to complete the full certification path.</div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-mpie";
      const svgEl = document.getElementById("t2-lb-mpie-svg");
      const pct   = parseFloat(svgEl.getAttribute("data-pct")) || 62;
      const r     = 50;
      const circ  = 2 * Math.PI * r;
      const arcEl = document.getElementById("t2-lb-mpie-arc");
      const numEl = document.getElementById("t2-lb-mpie-num");

      /* Init: arc fully hidden */
      arcEl.style.strokeDasharray  = circ;
      arcEl.style.strokeDashoffset = circ;

      /* Local glow blooms */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
          duration: 1.2, ease: "expo.out" }, 0)

        /* Donut glow halo expands */
        .from(`${C} .donut-glow`,
          { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%",
            duration: 1.0, ease: "expo.out" }, 0.22)

        /* Donut SVG pops in */
        .from(`${C} .donut-svg`,
          { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%",
            duration: 0.72, ease: "back.out(1.4)" }, 0.32)

        /* Arc fill + count-up — 3-arg .to on proxy */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.6, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            arcEl.style.strokeDashoffset = circ - (v / 100) * circ;
            numEl.textContent = Math.round(v) + "%";
          }
        }, 0.72)

        /* Term glides in */
        .from(`${C} .term`,
          { autoAlpha: 0, x: 18, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.55)

        /* Detail card glides in */
        .from(`${C} .detail-wrap`,
          { autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.60, ease: "power3.out" }, 0.80)

        /* Donut glow breathes — finite */
        .to(`${C} .donut-glow`,
          { opacity: 0.55, scale: 1.12, transformOrigin: "50% 50%",
            duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.50)

        .set({}, {}, 7);

      window.__timelines["t2-lb-mpie"] = tl;
    </script>
  </body>
</html>
