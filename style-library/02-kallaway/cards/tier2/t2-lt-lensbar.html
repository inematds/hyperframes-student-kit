<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · LENSBAR
  A horizontal lens-flare streak sweeps across once left-to-right, then the name
  resolves sharp on a faint glass underlay behind it. Role fades up below.
  The flare streak is a wide gradient bar with a bright hot core and soft wings.
  Transparent overlay over live speaker footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-lens {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized soft bloom behind the name zone */
      #t2-lt-lens .local-bloom {
        position: absolute;
        left: 40px; bottom: 90px;
        width: 680px; height: 220px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 38% 75%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(50px);
        pointer-events: none;
        z-index: 1;
      }

      /* Name zone container */
      #t2-lt-lens .name-zone {
        position: absolute;
        left: 80px; bottom: 148px;
        z-index: 3;
        overflow: visible;
      }

      /* Dark glass backing behind the name — thin horizontal slab */
      #t2-lt-lens .name-backing {
        position: absolute;
        left: -20px; top: -10px; right: -20px; bottom: -8px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 10px;
        border: var(--stroke) solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }

      #t2-lt-lens .name {
        position: relative;
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 42px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        z-index: 2;
        white-space: nowrap;
      }

      /* The sweeping flare streak — clipped to name zone width + overflow */
      #t2-lt-lens .flare-track {
        position: absolute;
        left: 80px; bottom: 132px;
        width: 700px; height: 86px;
        overflow: hidden;
        z-index: 4;
        pointer-events: none;
      }

      #t2-lt-lens .flare-bar {
        position: absolute;
        top: 0; left: -320px;
        width: 300px; height: 100%;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.08) 15%,
          rgba(var(--accent-rgb), 0.40) 35%,
          rgba(255, 255, 255, 0.82) 50%,
          rgba(var(--accent-rgb), 0.40) 65%,
          rgba(var(--accent-rgb), 0.08) 85%,
          transparent 100%);
        filter: blur(6px);
      }

      /* Bright hot core dot riding the center of the flare */
      #t2-lt-lens .flare-hot {
        position: absolute;
        top: 50%; left: -170px;
        transform: translateY(-50%);
        width: 12px; height: 12px;
        border-radius: 50%;
        background: var(--white);
        box-shadow:
          0 0 24px 8px rgba(255,255,255,0.60),
          0 0 60px 16px rgba(var(--accent-rgb), 0.55);
      }

      /* Role sits below */
      #t2-lt-lens .role-wrap {
        position: absolute;
        left: 80px; bottom: 100px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #t2-lt-lens .role-line {
        width: 36px; height: 1.5px;
        background: linear-gradient(90deg, var(--accent), transparent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.55);
      }

      #t2-lt-lens .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-lens"
         data-composition-id="t2-lt-lens"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <!-- name zone (backing + text) -->
      <div class="name-zone">
        <div class="name-backing"></div>
        <div class="name" data-slot="name">Kallaway Osei</div>
      </div>

      <!-- flare sweep — separate layer on top -->
      <div class="flare-track">
        <div class="flare-bar" id="lens-bar"></div>
        <div class="flare-hot" id="lens-hot"></div>
      </div>

      <!-- role below -->
      <div class="role-wrap">
        <div class="role-line"></div>
        <div class="role" data-slot="role">AI Education Director, AIS</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-lens";

      /* bloom appears */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.65, duration: 1.1, ease: "expo.out" }, 0);

      /* name backing fades in */
      tl.from(`${C} .name-backing`,
        { autoAlpha: 0, scaleX: 0.6, transformOrigin: "left center",
          duration: 0.50, ease: "power3.out" }, 0.10);

      /* name starts invisible — the flare reveals it */
      tl.set(`${C} .name`, { autoAlpha: 0 }, 0);

      /* FLARE sweeps left → right across the track (700px wide, bar starts at -320) */
      tl.to("#lens-bar",
        { left: 720, duration: 0.70, ease: "power2.inOut" }, 0.15);
      tl.to("#lens-hot",
        { left: 720, duration: 0.70, ease: "power2.inOut" }, 0.15);

      /* name resolves right as flare passes over — use autoAlpha + scale, no blur
         (avoid filter trap: name may have text-shadow) */
      tl.to(`${C} .name`,
        { autoAlpha: 1, scale: 1, duration: 0.40, ease: "power3.out" }, 0.42);

      /* role-line draws */
      tl.from(`${C} .role-line`,
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.35, ease: "power2.out" }, 0.80);

      /* role fades up */
      tl.from(`${C} .role`,
        { autoAlpha: 0, y: 10, duration: 0.55, ease: "power3.out" }, 0.88);

      /* subtle bloom breathe — finite */
      tl.to(`${C} .local-bloom`,
        { opacity: 0.55, scale: 1.12, duration: 1.6,
          ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-lens"] = tl;
    </script>
  </body>
</html>
