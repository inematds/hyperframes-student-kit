<!doctype html>
<!--
  KALLAWAY · tier2 · label · BYLINE
  A micro attribution / byline strip — "— Name, Role" format rendered as a
  slim horizontal glass bar with an em-dash accent and a faint divider. Anchored
  left-bottom. Narrow enough to never crowd the speaker.
  Slots: term (name ~22 chars), detail (role / affiliation ~38 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-byl {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized ambient glow behind bar */
      #t2-lb-byl .local-glow {
        position: absolute; left: 70px; bottom: 150px;
        width: 540px; height: 160px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 60%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 60%,
          transparent 82%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 0;
      }

      /* Wrapper — anchored lower-left, safe from face */
      #t2-lb-byl .byline-bar {
        position: absolute; left: 100px; bottom: 180px;
        display: inline-flex; align-items: center; gap: 0;
        height: 64px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: 999px;
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.18),
          0 0 20px rgba(var(--accent-rgb), 0.14),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
        position: absolute;
      }

      /* Left accent stripe */
      #t2-lb-byl .accent-stripe {
        width: 4px;
        height: 100%;
        flex-shrink: 0;
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.0) 0%,
          var(--accent) 40%,
          var(--accent) 60%,
          rgba(var(--accent-rgb), 0.0) 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.60);
      }

      /* Inner content */
      #t2-lb-byl .inner {
        display: flex; align-items: center; gap: 16px;
        padding: 0 30px 0 22px;
      }

      /* Em dash + name */
      #t2-lb-byl .dash {
        font-family: var(--font-display);
        font-weight: var(--wt-semi);
        font-size: 22px;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        letter-spacing: 0.04em;
        flex-shrink: 0;
      }

      #t2-lb-byl .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 24px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Thin vertical divider */
      #t2-lb-byl .divider {
        width: 1px;
        height: 28px;
        background: rgba(255, 255, 255, 0.16);
        flex-shrink: 0;
      }

      #t2-lb-byl .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 20px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        white-space: nowrap;
      }

      /* Small accent dot at end */
      #t2-lb-byl .end-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-byl"
         data-composition-id="t2-lb-byl"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="byline-bar">
        <div class="accent-stripe"></div>
        <div class="inner">
          <span class="dash" aria-hidden="true">&#8212;</span>
          <span class="name" data-slot="term">Dr. Maya Chen</span>
          <div class="divider"></div>
          <span class="role" data-slot="detail">Director of AI Research, EduScale</span>
          <div class="end-dot"></div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-byl";

      /* Glow blooms in softly */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
          duration: 1.2, ease: "power2.out" }, 0)

        /* Bar slides in from left + focus blur resolves */
        .from(`${C} .byline-bar`,
          { autoAlpha: 0, x: -52, filter: "blur(10px)",
            transformOrigin: "left center",
            duration: 0.80, ease: "power4.out" }, 0.20)

        /* Accent stripe draws height */
        .from(`${C} .accent-stripe`,
          { scaleY: 0, transformOrigin: "center center",
            duration: 0.50, ease: "power3.out" }, 0.55)

        /* Dash + name glide in together */
        .from(`${C} .dash`,
          { autoAlpha: 0, x: -14,
            duration: 0.45, ease: "power3.out" }, 0.65)

        .from(`${C} .name`,
          { autoAlpha: 0, x: -10,
            duration: 0.48, ease: "power3.out" }, 0.72)

        /* Divider fades */
        .from(`${C} .divider`,
          { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.85)

        /* Role fades in */
        .from(`${C} .role`,
          { autoAlpha: 0, x: -8,
            duration: 0.45, ease: "power3.out" }, 0.92)

        /* End dot pops */
        .from(`${C} .end-dot`,
          { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%",
            duration: 0.35, ease: "back.out(1.8)" }, 1.05)

        /* Accent stripe glow pulse — finite */
        .to(`${C} .accent-stripe`,
          { boxShadow: "0 0 22px rgba(55,189,248,0.90)",
            duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.50)

        /* End dot pulse */
        .to(`${C} .end-dot`,
          { boxShadow: "0 0 18px rgba(55,189,248,0.80)",
            duration: 0.9, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-byl"] = tl;
    </script>
  </body>
</html>
