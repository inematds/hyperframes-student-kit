<!doctype html>
<!--
  KALLAWAY · tier2 · label · RINGMARK
  A clean glowing ring draws on around an implied subject point (left side),
  then a label panel glides in beside it — term bold, detail beneath.
  The ring is drawn via animated stroke-dashoffset on two SVG circles.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-ring {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local glow centered on the ring */
      #t2-lb-ring .local-glow {
        position: absolute; left: 160px; top: 380px;
        width: 380px; height: 380px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.09) 50%,
          transparent 75%);
        filter: blur(50px);
        pointer-events: none;
      }

      /* SVG ring — anchored left side */
      #t2-lb-ring .ring-svg {
        position: absolute; left: 170px; top: 390px;
        width: 200px; height: 200px;
        overflow: visible;
      }

      /* Outer glow ring */
      #t2-lb-ring .ring-outer {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.30);
        stroke-width: 3px;
        filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.45));
      }

      /* Main accent ring */
      #t2-lb-ring .ring-main {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2px;
        stroke-linecap: round;
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.85))
                drop-shadow(0 0 20px rgba(var(--accent-rgb), 0.40));
      }

      /* Inner dot at center */
      #t2-lb-ring .ring-center {
        fill: var(--accent);
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.90));
      }

      /* Tiny tick marks at 0°, 90°, 180°, 270° */
      #t2-lb-ring .ring-tick {
        stroke: rgba(var(--accent-rgb), 0.65);
        stroke-width: 1.5px;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.60));
      }

      /* Label panel to the right of the ring */
      #t2-lb-ring .label-wrap {
        position: absolute; left: 400px; top: 440px;
        display: flex; flex-direction: column; gap: 10px;
      }

      /* Connector line from ring edge to label */
      #t2-lb-ring .connector-svg {
        position: absolute; left: 370px; top: 488px;
        width: 40px; height: 2px; overflow: visible;
      }

      #t2-lb-ring .conn-line {
        stroke: rgba(var(--accent-rgb), 0.55);
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.50));
      }

      /* Term header */
      #t2-lb-ring .term-head {
        display: flex; align-items: center; gap: 10px;
      }

      #t2-lb-ring .term-bar {
        width: 4px; height: 32px; border-radius: 2px;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      #t2-lb-ring .term-text {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Detail row */
      #t2-lb-ring .detail-wrap {
        padding: 9px 18px 9px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-left: 2px solid rgba(var(--accent-rgb), 0.50);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 480px;
      }

      #t2-lb-ring .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 22px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-ring" data-composition-id="t2-lb-ring" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <!-- Ring SVG: cx/cy = 100,100 in the 200×200 viewBox -->
      <svg class="ring-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer halo ring -->
        <circle id="t2-lb-ring-outer" class="ring-outer" cx="100" cy="100" r="88" />
        <!-- Main ring -->
        <circle id="t2-lb-ring-main"  class="ring-main"  cx="100" cy="100" r="72" />
        <!-- Tick marks at cardinal points -->
        <line class="ring-tick" x1="100" y1="16"  x2="100" y2="24" />
        <line class="ring-tick" x1="100" y1="176" x2="100" y2="184" />
        <line class="ring-tick" x1="16"  y1="100" x2="24"  y2="100" />
        <line class="ring-tick" x1="176" y1="100" x2="184" y2="100" />
        <!-- Center dot -->
        <circle class="ring-center" cx="100" cy="100" r="5" />
      </svg>

      <!-- Short connector line -->
      <svg class="connector-svg" viewBox="0 0 40 2" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line id="t2-lb-ring-conn" class="conn-line" x1="0" y1="1" x2="40" y2="1" />
      </svg>

      <div class="label-wrap">
        <div class="term-head">
          <div class="term-bar"></div>
          <div class="term-text" data-slot="term">Transformer Block</div>
        </div>
        <div class="detail-wrap">
          <div class="detail-text" data-slot="detail">Stacked self-attention + feed-forward layers that encode meaning at each depth.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-ring";

      /* Measure ring circumferences */
      const mainCirc  = 2 * Math.PI * 72;   /* r=72  → ~452px */
      const outerCirc = 2 * Math.PI * 88;   /* r=88  → ~553px */

      const mainEl  = document.getElementById("t2-lb-ring-main");
      const outerEl = document.getElementById("t2-lb-ring-outer");
      if (mainEl)  { mainEl.style.strokeDasharray  = mainCirc;  mainEl.style.strokeDashoffset  = mainCirc; }
      if (outerEl) { outerEl.style.strokeDasharray = outerCirc; outerEl.style.strokeDashoffset = outerCirc; }

      /* Local glow */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Outer ring draws on slightly before main */
        .to(`${COMP} #t2-lb-ring-outer`, {
            strokeDashoffset: 0, duration: 0.95, ease: "power3.out" }, 0.10)

        /* Main ring draws on */
        .to(`${COMP} #t2-lb-ring-main`, {
            strokeDashoffset: 0, duration: 1.0, ease: "power3.out" }, 0.25)

        /* Ticks pop in */
        .from(`${COMP} .ring-tick`, {
            autoAlpha: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 }, 0.90)

        /* Center dot pops */
        .from(`${COMP} .ring-center`, {
            autoAlpha: 0, scale: 0, transformOrigin: "100px 100px",
            duration: 0.35, ease: "back.out(2)" }, 1.10)

        /* Connector line draws */
        .from(`${COMP} .conn-line`, {
            autoAlpha: 0, scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.35, ease: "power2.out" }, 1.20)

        /* Term slides in */
        .from(`${COMP} .term-head`, {
            autoAlpha: 0, x: -20, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 1.35)

        /* Detail glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.62, ease: "power4.out" }, 1.58)

        /* Finite ring pulse */
        .to(`${COMP} #t2-lb-ring-main`, {
            opacity: 0.40, duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-ring"] = tl;
    </script>
  </body>
</html>
