<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · RATINGNAME
  A glass name/role block with a row of 5 glowing star chips that pop in
  staggered beneath the name. Stars are accent-blue neon outline stars that
  fill glow on entry. Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-rate {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-rate .local-bloom {
        position: absolute;
        left: 50px; bottom: 70px;
        width: 620px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 45% 85%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Main card */
      #t2-lt-rate .card {
        position: absolute;
        left: 80px; bottom: 100px;
        padding: 26px 38px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 20px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        min-width: 480px;
        position: absolute;
        overflow: hidden;
      }

      #t2-lt-rate .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.52) 60%, transparent);
      }

      #t2-lt-rate .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 6px;
        line-height: 1.1;
      }

      #t2-lt-rate .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
        margin-bottom: 18px;
      }

      /* Stars row */
      #t2-lt-rate .stars {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Individual star chip — uses inline SVG via background */
      #t2-lt-rate .star {
        width: 36px; height: 36px;
        flex-shrink: 0;
        position: relative;
      }

      #t2-lt-rate .star svg {
        width: 36px; height: 36px;
        display: block;
        filter: drop-shadow(0 0 6px rgba(55,189,248,0.80));
      }

      /* Rating label after stars */
      #t2-lt-rate .rating-label {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 20px;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-left: 6px;
        line-height: 1;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-rate"
         data-composition-id="t2-lt-rate"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="name" data-slot="name">Marcus Webb</div>
        <div class="role" data-slot="role">Senior AI Instructor &amp; Course Author</div>
        <div class="stars">
          <!-- 5 stars: filled blue neon SVG stars -->
          <div class="star">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,4 21.8,14 32,14 24,20.5 27,30.5 18,24.5 9,30.5 12,20.5 4,14 14.2,14"
                fill="rgba(55,189,248,0.30)" stroke="rgba(55,189,248,0.90)" stroke-width="1.5"
                stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="star">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,4 21.8,14 32,14 24,20.5 27,30.5 18,24.5 9,30.5 12,20.5 4,14 14.2,14"
                fill="rgba(55,189,248,0.30)" stroke="rgba(55,189,248,0.90)" stroke-width="1.5"
                stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="star">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,4 21.8,14 32,14 24,20.5 27,30.5 18,24.5 9,30.5 12,20.5 4,14 14.2,14"
                fill="rgba(55,189,248,0.30)" stroke="rgba(55,189,248,0.90)" stroke-width="1.5"
                stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="star">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,4 21.8,14 32,14 24,20.5 27,30.5 18,24.5 9,30.5 12,20.5 4,14 14.2,14"
                fill="rgba(55,189,248,0.30)" stroke="rgba(55,189,248,0.90)" stroke-width="1.5"
                stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="star">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,4 21.8,14 32,14 24,20.5 27,30.5 18,24.5 9,30.5 12,20.5 4,14 14.2,14"
                fill="rgba(55,189,248,0.30)" stroke="rgba(55,189,248,0.90)" stroke-width="1.5"
                stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="rating-label">4.9</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-rate";

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.1, ease: "power2.out" }, 0);

      /* card springs in */
      tl.from(`${C} .card`,
        { autoAlpha: 0, x: -44, y: 26, scale: 0.94,
          filter: "blur(14px)", transformOrigin: "left bottom",
          duration: 0.82, ease: "back.out(1.4)" }, 0.10);

      /* name */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -18, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.56);

      /* role */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.55, ease: "power3.out" }, 0.72);

      /* stars pop in staggered */
      const stars = document.querySelectorAll(`${C} .star`);
      stars.forEach(function(star, i) {
        tl.from(star,
          { autoAlpha: 0, scale: 0.30, y: 10,
            transformOrigin: "center center",
            duration: 0.42, ease: "back.out(2.0)" },
          0.92 + i * 0.09);
      });

      /* rating label follows last star */
      tl.from(`${C} .rating-label`,
        { autoAlpha: 0, x: 8, filter: "blur(6px)",
          duration: 0.40, ease: "power3.out" }, 1.38);

      /* star glow pulse — finite */
      tl.to(`${C} .star svg`,
        { filter: "drop-shadow(0 0 14px rgba(55,189,248,1.00))",
          duration: 0.90, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.70);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-rate"] = tl;
    </script>
  </body>
</html>
