<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · NAMEPLATE3D
  An extruded 3D glass nameplate rendered with CSS perspective tilt — the card
  leans back in space, revealing a thick glowing side-depth edge. The name sits
  on the face; role on a dimmer sub-ledge. Sits over live speaker footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-np3d {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized ambient bloom behind the card */
      #t2-lt-np3d .local-bloom {
        position: absolute;
        left: 40px; bottom: 80px;
        width: 600px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 80%,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.10) 48%,
          transparent 75%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 1;
      }

      /* Perspective stage */
      #t2-lt-np3d .stage {
        position: absolute;
        left: 80px; bottom: 130px;
        perspective: 900px;
        perspective-origin: 30% 60%;
        z-index: 2;
      }

      /* The 3D-tilted plate */
      #t2-lt-np3d .plate-3d {
        position: relative;
        width: 500px;
        transform-style: preserve-3d;
        transform: rotateX(10deg) rotateY(-7deg);
      }

      /* Face of the nameplate */
      #t2-lt-np3d .face {
        position: relative;
        padding: 30px 40px 26px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.55),
          0 0 28px rgba(var(--accent-rgb), 0.25),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
      }

      /* Top hairline shimmer */
      #t2-lt-np3d .face::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.60) 40%,
                                     rgba(255,255,255,0.60) 60%, transparent);
      }

      /* Simulated left depth-edge (the "extrusion") */
      #t2-lt-np3d .depth-edge {
        position: absolute;
        left: -10px; top: 6px; bottom: -6px;
        width: 10px;
        border-radius: 4px 0 0 4px;
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.60) 0%,
          rgba(var(--accent-rgb), 0.28) 50%,
          rgba(var(--accent-rgb), 0.08) 100%);
        box-shadow: -4px 0 18px rgba(var(--accent-rgb), 0.45);
      }

      /* Bottom depth-edge */
      #t2-lt-np3d .depth-bottom {
        position: absolute;
        bottom: -7px; left: 6px; right: -4px;
        height: 8px;
        border-radius: 0 0 4px 4px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.42) 0%,
          rgba(var(--accent-rgb), 0.10) 70%,
          transparent 100%);
        box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.28);
      }

      #t2-lt-np3d .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 8px;
        line-height: 1.1;
      }

      #t2-lt-np3d .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      #t2-lt-np3d .role::before {
        content: "";
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        margin-right: 10px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-np3d"
         data-composition-id="t2-lt-np3d"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stage">
        <div class="plate-3d" id="np3d-plate">
          <div class="face">
            <div class="depth-edge"></div>
            <div class="depth-bottom"></div>
            <div class="name" data-slot="name">Kallaway Osei</div>
            <div class="role" data-slot="role">AI Education Director, AIS</div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-np3d";

      /* bloom fades in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.6, duration: 1.2, ease: "expo.out" }, 0);

      /* plate rises up with a 3D tilt spring — start further back in Z + offset */
      tl.from(`${C} .plate-3d`,
        { autoAlpha: 0, y: 48, rotationX: 32, rotationY: -22, scale: 0.88,
          transformOrigin: "left bottom",
          duration: 1.0, ease: "back.out(1.4)" }, 0.15);

      /* depth edges draw in */
      tl.from(`${C} .depth-edge`,
        { autoAlpha: 0, scaleY: 0, transformOrigin: "top center",
          duration: 0.6, ease: "power3.out" }, 0.60);
      tl.from(`${C} .depth-bottom`,
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
          duration: 0.55, ease: "power3.out" }, 0.72);

      /* name glides in */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -22, duration: 0.65, ease: "power4.out" }, 0.80);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -16, duration: 0.60, ease: "power3.out" }, 0.96);

      /* finite rim-glow pulse on the face */
      tl.to(`${C} .face`, {
        boxShadow:
          "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.90), 0 0 42px rgba(55,189,248,0.40), inset 0 1px 0 rgba(255,255,255,0.22)",
        duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      /* subtle continuous tilt breathe */
      tl.to(`${C} .plate-3d`,
        { rotationX: 7, rotationY: -4, duration: 3.0, ease: "sine.inOut" }, 1.60);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-np3d"] = tl;
    </script>
  </body>
</html>
