<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · CORNERFRAME
  Four L-shaped neon corner brackets that draw around a name block. The brackets
  animate-draw inward from the outer corners toward the center. The name block
  starts invisible inside the bracket cage and snaps into focus as the last
  corner closes. Sits over live footage — only the brackets and text paint.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-cframe {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-cframe .local-bloom {
        position: absolute;
        left: 55px; bottom: 80px;
        width: 580px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 78%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 74%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 1;
      }

      /* Cage wrapper — positions the brackets + text block together */
      #t2-lt-cframe .cage {
        position: absolute;
        left: 80px; bottom: 108px;
        width: 480px; height: 140px;
        z-index: 2;
      }

      /* Text block inside the cage — dark glass */
      #t2-lt-cframe .text-block {
        position: absolute;
        inset: 16px;
        padding: 18px 28px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 rgba(255,255,255,0.14);
        z-index: 3;
      }

      #t2-lt-cframe .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 6px;
        line-height: 1.0;
      }

      #t2-lt-cframe .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.2;
      }

      /* SVG overlay for corner brackets — covers the full cage */
      #t2-lt-cframe .brackets-svg {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        overflow: visible;
        z-index: 4;
        pointer-events: none;
      }

      /* All bracket segments share these styles */
      #t2-lt-cframe .brackets-svg line,
      #t2-lt-cframe .brackets-svg polyline {
        stroke: #37BDF8;
        stroke-width: 2.5;
        stroke-linecap: square;
        fill: none;
        filter: url(#cframe-glow);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-cframe"
         data-composition-id="t2-lt-cframe"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="cage" id="cframe-cage">

        <!-- Text block — starts invisible, snaps in when brackets close -->
        <div class="text-block" id="cframe-textblock">
          <div class="name" data-slot="name">Kai Watanabe</div>
          <div class="role" data-slot="role">Founding Engineer, AIS Platform</div>
        </div>

        <!--
          Corner brackets SVG — cage is 480×140.
          Arm length = 36px per side.
          Corners:
            TL: x=0,y=0   TR: x=480,y=0   BL: x=0,y=140   BR: x=480,y=140
          Each corner is two polyline segments (H arm + V arm).
          We animate stroke-dashoffset on each segment.
          Arm length 36px → dasharray 36, dashoffset starts at 36 (hidden), animates to 0.
        -->
        <svg class="brackets-svg" viewBox="0 0 480 140">
          <defs>
            <filter id="cframe-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- TOP-LEFT: horizontal arm (left) -->
          <line id="cf-tl-h" x1="36" y1="0" x2="0" y2="0"
                stroke-dasharray="36" stroke-dashoffset="36" />
          <!-- TOP-LEFT: vertical arm (down) -->
          <line id="cf-tl-v" x1="0" y1="0" x2="0" y2="36"
                stroke-dasharray="36" stroke-dashoffset="36" />

          <!-- TOP-RIGHT: horizontal arm (right) -->
          <line id="cf-tr-h" x1="444" y1="0" x2="480" y2="0"
                stroke-dasharray="36" stroke-dashoffset="36" />
          <!-- TOP-RIGHT: vertical arm (down) -->
          <line id="cf-tr-v" x1="480" y1="0" x2="480" y2="36"
                stroke-dasharray="36" stroke-dashoffset="36" />

          <!-- BOTTOM-LEFT: horizontal arm (left) -->
          <line id="cf-bl-h" x1="36" y1="140" x2="0" y2="140"
                stroke-dasharray="36" stroke-dashoffset="36" />
          <!-- BOTTOM-LEFT: vertical arm (up) -->
          <line id="cf-bl-v" x1="0" y1="140" x2="0" y2="104"
                stroke-dasharray="36" stroke-dashoffset="36" />

          <!-- BOTTOM-RIGHT: horizontal arm (right) -->
          <line id="cf-br-h" x1="444" y1="140" x2="480" y2="140"
                stroke-dasharray="36" stroke-dashoffset="36" />
          <!-- BOTTOM-RIGHT: vertical arm (up) -->
          <line id="cf-br-v" x1="480" y1="140" x2="480" y2="104"
                stroke-dasharray="36" stroke-dashoffset="36" />
        </svg>

      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-cframe";

      /* Helper: animate a line's dashoffset 36→0 */
      function drawLine(id, pos) {
        const el = document.getElementById(id);
        if (!el) return;
        tl.to({ offset: 36 }, {
          offset: 0, duration: 0.28, ease: "power3.out",
          onUpdate: function() { el.setAttribute("stroke-dashoffset", this.targets()[0].offset); }
        }, pos);
      }

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.58, duration: 1.1, ease: "power2.out" }, 0);

      /* cage slides up */
      tl.from(`${C} .cage`,
        { autoAlpha: 0, y: 24, duration: 0.70, ease: "power4.out" }, 0.15);

      /* Text block hidden until brackets close */
      tl.set(`${C} .text-block`, { autoAlpha: 0 }, 0);

      /*
        Bracket draw sequence:
        All four corners start drawing simultaneously (0.25s).
        Each corner: H arm first, then V arm.
        Total draw time per corner: ~0.56s. All done by ~0.82s.
      */
      const B = 0.25;   /* bracket draw start */
      const STEP = 0.28; /* each segment draw duration */
      const GAP  = 0.08; /* tiny gap between H and V arm */

      /* TL */
      drawLine("cf-tl-h", B);
      drawLine("cf-tl-v", B + STEP - GAP);

      /* TR */
      drawLine("cf-tr-h", B);
      drawLine("cf-tr-v", B + STEP - GAP);

      /* BL */
      drawLine("cf-bl-h", B);
      drawLine("cf-bl-v", B + STEP - GAP);

      /* BR */
      drawLine("cf-br-h", B);
      drawLine("cf-br-v", B + STEP - GAP);

      /* Text block snaps in (autoAlpha) when brackets close */
      const bracketsDone = B + STEP + STEP;
      tl.to(`${C} .text-block`,
        { autoAlpha: 1, scale: 1, duration: 0.20, ease: "power2.out" },
        bracketsDone);

      /* name glides up */
      tl.from(`${C} .name`,
        { autoAlpha: 0, y: 10, filter: "blur(6px)",
          duration: 0.50, ease: "power4.out" },
        bracketsDone + 0.05);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, y: 7, filter: "blur(5px)",
          duration: 0.45, ease: "power3.out" },
        bracketsDone + 0.22);

      /* Corner bracket glow pulse — finite (animate SVG opacity) */
      tl.to(`${C} .brackets-svg`,
        { opacity: 0.50, duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true },
        bracketsDone + 0.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-cframe"] = tl;
    </script>
  </body>
</html>
