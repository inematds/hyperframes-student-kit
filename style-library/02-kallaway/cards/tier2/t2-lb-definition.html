<!doctype html>
<!--
  KALLAWAY · tier2 · label · DEFINITION
  A DEFINITION glass card: `term` in bold header + a glowing accent left-rule +
  `detail` as the definition body text.
  Anchored right side. Transparent overlay.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-def {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — right side */
      #t2-lb-def .local-glow {
        position: absolute; right: 55px; top: 300px;
        width: 580px; height: 400px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.16) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 80%);
        filter: blur(42px);
        pointer-events: none;
      }

      /* Card anchored right */
      #t2-lb-def .card {
        position: absolute; right: 80px; top: 330px;
        width: 480px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius);
        padding: 30px 32px;
        display: flex; gap: 0;
      }

      /* Glowing accent left-rule */
      #t2-lb-def .left-rule {
        width: 3px; flex-shrink: 0;
        border-radius: 2px;
        background: linear-gradient(180deg,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.30) 70%,
          transparent 100%);
        box-shadow: var(--glow-accent);
        margin-right: 24px;
        transform-origin: 50% 0%;
      }

      /* Content to right of rule */
      #t2-lb-def .content { flex: 1; }

      /* "def" kicker */
      #t2-lb-def .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: 14px; letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 8px;
      }

      /* Term — bold header */
      #t2-lb-def .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 40px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 16px;
      }

      /* Hairline separator */
      #t2-lb-def .sep {
        height: 1px; width: 100%;
        background: var(--glass-border);
        margin-bottom: 16px;
        transform-origin: left center;
      }

      /* Definition body */
      #t2-lb-def .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 24px; line-height: 1.55;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-def" data-composition-id="t2-lb-def" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <div class="left-rule"></div>
        <div class="content">
          <div class="kicker">Definition</div>
          <div class="term" data-slot="term">RAG Pipeline</div>
          <div class="sep"></div>
          <div class="detail" data-slot="detail">Retrieval-Augmented Generation — a method of grounding LLM responses in up-to-date or private documents at inference time.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-def";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.2, ease: "expo.out" }, 0)

        /* card glides in from right */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: 56, filter: "blur(14px)",
            duration: 0.85, ease: "back.out(1.4)" }, 0.18)

        /* left rule draws down */
        .from(`${COMP} .left-rule`, {
            scaleY: 0,
            duration: 0.60, ease: "power3.out" }, 0.55)

        /* kicker fades */
        .from(`${COMP} .kicker`, {
            autoAlpha: 0, y: 8,
            duration: 0.40, ease: "power2.out" }, 0.65)

        /* term glides + blur */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.60, ease: "power4.out" }, 0.80)

        /* separator draws */
        .from(`${COMP} .sep`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.45, ease: "power2.out" }, 1.05)

        /* definition fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.60, ease: "power3.out" }, 1.22)

        /* left rule glow pulse — finite */
        .to(`${COMP} .left-rule`, {
            boxShadow: "0 0 20px rgba(55,189,248,0.80), 0 0 50px rgba(55,189,248,0.40)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-def"] = tl;
    </script>
  </body>
</html>
