<!doctype html>
<!--
  KALLAWAY · tier2 · label · STATUS
  A status indicator: a pulsing dot (finite), a status-word badge, and a term
  below in frosted glass. Anchored left side. The dot pulses 3 times then holds.
  Slots: term (~28 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-status {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — left */
      #t2-lb-status .local-glow {
        position: absolute; left: 80px; top: 460px;
        width: 500px; height: 280px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 50%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.05) 58%,
          transparent 82%);
        filter: blur(48px);
        pointer-events: none;
      }

      /* Wrapper anchored left */
      #t2-lb-status .wrapper {
        position: absolute; left: 120px; top: 490px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
      }

      /* Status row: dot + badge */
      #t2-lb-status .status-row {
        display: flex; align-items: center; gap: 16px;
      }

      /* Pulse dot and its halo ring */
      #t2-lb-status .dot-wrap {
        position: relative; width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      #t2-lb-status .dot-ring {
        position: absolute; inset: -6px;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.45);
        /* ring uses opacity animation, not box-shadow filter, to avoid GSAP filter trap */
      }

      #t2-lb-status .dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.85), 0 0 24px rgba(var(--accent-rgb), 0.50);
        flex-shrink: 0;
      }

      /* Status word badge */
      #t2-lb-status .badge {
        display: inline-flex; align-items: center;
        padding: 7px 18px;
        border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1.5px solid rgba(var(--accent-rgb), 0.50);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.30),
                    inset 0 1px 0 rgba(255,255,255,0.14),
                    0 3px 14px rgba(0,0,0,0.42);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      #t2-lb-status .badge-text {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: 22px; letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Term + detail glass block */
      #t2-lb-status .text-block {
        padding: 14px 24px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.16);
        max-width: 460px;
        position: relative; overflow: hidden;
      }

      #t2-lb-status .text-block::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.36) 50%, transparent);
      }

      #t2-lb-status .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 26px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 4px;
      }

      #t2-lb-status .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.45; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-status" data-composition-id="t2-lb-status" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="status-row">
          <div class="dot-wrap">
            <div class="dot-ring"></div>
            <div class="dot"></div>
          </div>
          <div class="badge">
            <span class="badge-text">Live</span>
          </div>
        </div>

        <div class="text-block">
          <div class="term" data-slot="term">Course Enrollment</div>
          <div class="detail" data-slot="detail">Open access — new modules releasing weekly</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-status";

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "40% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* dot-wrap pops in */
        .from(`${COMP} .dot-wrap`, {
            autoAlpha: 0, scale: 0.4,
            duration: 0.52, ease: "back.out(2.0)" }, 0.18)

        /* badge springs in */
        .from(`${COMP} .badge`, {
            autoAlpha: 0, x: -22, filter: "blur(8px)",
            duration: 0.65, ease: "back.out(1.4)" }, 0.30)

        /* text block glides up */
        .from(`${COMP} .text-block`, {
            autoAlpha: 0, y: 18, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.56)

        /* dot ring pulse — finite 3 times */
        .to(`${COMP} .dot-ring`, {
            scale: 2.0, autoAlpha: 0,
            transformOrigin: "50% 50%",
            duration: 0.80, ease: "power2.out",
            repeat: 3, yoyo: false }, 0.80)

        /* dot itself breathes gently — finite */
        .to(`${COMP} .dot`, {
            boxShadow: "0 0 20px rgba(55,189,248,0.95), 0 0 48px rgba(55,189,248,0.60)",
            duration: 0.80, ease: "sine.inOut", repeat: 3, yoyo: true }, 0.80)

        /* badge glow pulse — finite */
        .to(`${COMP} .badge`, {
            boxShadow: "0 0 32px rgba(55,189,248,0.55), inset 0 1px 0 rgba(255,255,255,0.20), 0 3px 14px rgba(0,0,0,0.42)",
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-status"] = tl;
    </script>
  </body>
</html>
