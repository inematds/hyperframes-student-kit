<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · TRUST
  Glass card with an avatar-circle placeholder, a small chip above the card
  (e.g. "Trust accrued"), name, and role/quote. A short dashed connector line
  trails toward the speaker (right side). All anchored lower-left.
  Transparent background — only the card + chip + line paint.
  Slots: tag (~20 chars), name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-trust {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the card group */
      #t2-lt-trust .local-bloom {
        position: absolute;
        left: 48px; bottom: 90px;
        width: 580px; height: 340px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 35% 75%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 72%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Tag chip — floats above the card */
      #t2-lt-trust .tag-chip {
        position: absolute;
        left: 164px; bottom: 338px;
        padding: 7px 18px;
        background: rgba(var(--accent-rgb), 0.15);
        border: 1px solid rgba(var(--accent-rgb), 0.50);
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 17px;
        font-weight: var(--wt-reg);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: 0 0 12px rgba(var(--accent-rgb), 0.60);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.20);
        white-space: nowrap;
        z-index: 3;
      }

      /* Main card */
      #t2-lt-trust .card {
        position: absolute;
        left: 80px; bottom: 120px;
        width: 460px;
        padding: 22px 28px 24px;
        display: flex;
        align-items: flex-start;
        gap: 20px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.35),
          0 0 20px rgba(var(--accent-rgb), 0.15),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      #t2-lt-trust .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 45%, rgba(255,255,255,0.48) 55%, transparent);
      }

      /* Avatar circle */
      #t2-lt-trust .avatar {
        width: 68px; height: 68px;
        flex-shrink: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 32%,
          rgba(255,255,255,0.18) 0%,
          rgba(var(--accent-rgb), 0.22) 50%,
          rgba(var(--accent-rgb), 0.06) 100%);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.35);
        position: relative;
        overflow: hidden;
      }

      /* Silhouette hint inside avatar */
      #t2-lt-trust .avatar::after {
        content: "";
        position: absolute;
        left: 50%; bottom: 0;
        transform: translateX(-50%);
        width: 36px; height: 36px;
        border-radius: 50% 50% 0 0;
        background: rgba(var(--accent-rgb), 0.18);
      }

      #t2-lt-trust .text-block {
        display: flex; flex-direction: column; gap: 7px;
        flex: 1;
      }

      #t2-lt-trust .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
      }

      #t2-lt-trust .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        color: var(--text-dim);
        letter-spacing: 0.01em;
        line-height: 1.35;
      }

      /* Dashed connector line trailing from the right edge of the card */
      #t2-lt-trust .connector {
        position: absolute;
        left: 540px; bottom: 178px;   /* right edge of card + margin */
        width: 160px; height: 2px;
        overflow: visible;
        z-index: 2;
      }

      #t2-lt-trust .connector line {
        stroke: rgba(var(--accent-rgb), 0.55);
        stroke-width: 1.5;
        stroke-dasharray: 8 6;
        stroke-linecap: round;
        /* clip-path draw-in controlled by GSAP via width */
      }

      #t2-lt-trust .connector-dot {
        position: absolute;
        right: 0; top: 50%; transform: translateY(-50%);
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.80);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-trust"
         data-composition-id="t2-lt-trust"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="tag-chip" data-slot="tag">Trust Accrued</div>

      <div class="card">
        <div class="avatar"></div>
        <div class="text-block">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

      <!-- Dashed connector line pointing toward speaker -->
      <div class="connector">
        <svg width="160" height="4" style="overflow:visible; position:absolute; top:-1px; left:0;">
          <line x1="0" y1="2" x2="160" y2="2" />
        </svg>
        <div class="connector-dot"></div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom in */
      tl.from("#t2-lt-trust .local-bloom",
        { autoAlpha: 0, scale: 0.6, duration: 1.2, ease: "power2.out" }, 0);

      /* tag chip drops in from above */
      tl.from("#t2-lt-trust .tag-chip",
        { autoAlpha: 0, y: -16, filter: "blur(6px)",
          duration: 0.55, ease: "back.out(1.4)" }, 0.10);

      /* card springs in */
      tl.from("#t2-lt-trust .card",
        { autoAlpha: 0, x: -44, y: 24, scale: 0.92,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.85, ease: "back.out(1.4)" }, 0.22);

      /* avatar pops in */
      tl.from("#t2-lt-trust .avatar",
        { autoAlpha: 0, scale: 0.6,
          duration: 0.45, ease: "back.out(1.7)" }, 0.65);

      /* name */
      tl.from("#t2-lt-trust .name",
        { autoAlpha: 0, x: -14, filter: "blur(7px)",
          duration: 0.58, ease: "power4.out" }, 0.80);

      /* role */
      tl.from("#t2-lt-trust .role",
        { autoAlpha: 0, x: -10, filter: "blur(5px)",
          duration: 0.52, ease: "power3.out" }, 0.96);

      /* connector line draws in — animate scaleX from left */
      tl.from("#t2-lt-trust .connector",
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.60, ease: "power3.out" }, 1.10);
      tl.from("#t2-lt-trust .connector-dot",
        { autoAlpha: 0, scale: 0,
          duration: 0.25, ease: "back.out(2)" }, 1.65);

      /* tag glow pulse — finite */
      tl.to("#t2-lt-trust .tag-chip",
        { boxShadow: "0 0 24px rgba(55,189,248,0.40)",
          borderColor: "rgba(55,189,248,0.85)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-trust"] = tl;
    </script>
  </body>
</html>
