<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · CHIP
  Name and role in a compact glass chip with a glowing accent dot indicator.
  Tighter and more interface-like than the pill — the dot gives it a "live"
  signal feel. Transparent background.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-chip {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-chip .local-bloom {
        position: absolute;
        left: 54px; bottom: 120px;
        width: 480px; height: 160px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 35% 80%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.05) 58%,
          transparent 75%);
        filter: blur(28px);
        pointer-events: none;
        z-index: 1;
      }

      /* Chip */
      #t2-lt-chip .chip {
        position: absolute;
        left: 80px; bottom: 140px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 28px 16px 20px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      #t2-lt-chip .chip::before {
        content: "";
        position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.44) 45%, rgba(255,255,255,0.44) 55%, transparent);
      }

      /* Accent dot — the "live" indicator */
      #t2-lt-chip .dot {
        width: 12px; height: 12px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--accent);
        box-shadow:
          0 0 0 3px rgba(var(--accent-rgb), 0.22),
          0 0 12px rgba(var(--accent-rgb), 0.80),
          0 0 28px rgba(var(--accent-rgb), 0.40);
      }

      /* Text column */
      #t2-lt-chip .text-block {
        display: flex; flex-direction: column; gap: 5px;
      }

      #t2-lt-chip .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 32px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        line-height: 1.1;
      }

      #t2-lt-chip .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 20px;
        color: var(--text-dim);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-chip"
         data-composition-id="t2-lt-chip"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="chip">
        <div class="dot"></div>
        <div class="text-block">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom in */
      tl.from("#t2-lt-chip .local-bloom",
        { autoAlpha: 0, scale: 0.65, duration: 1.0, ease: "power2.out" }, 0);

      /* chip springs in */
      tl.from("#t2-lt-chip .chip",
        { autoAlpha: 0, x: -36, y: 20, scale: 0.90,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.78, ease: "back.out(1.4)" }, 0.08);

      /* dot pops on */
      tl.from("#t2-lt-chip .dot",
        { autoAlpha: 0, scale: 0,
          duration: 0.32, ease: "back.out(2.0)" }, 0.55);

      /* name */
      tl.from("#t2-lt-chip .name",
        { autoAlpha: 0, x: -12, filter: "blur(7px)",
          duration: 0.55, ease: "power4.out" }, 0.66);

      /* role */
      tl.from("#t2-lt-chip .role",
        { autoAlpha: 0, x: -10, filter: "blur(5px)",
          duration: 0.50, ease: "power3.out" }, 0.82);

      /* dot halo pulse — finite */
      tl.to("#t2-lt-chip .dot",
        { boxShadow:
            "0 0 0 5px rgba(55,189,248,0.28), 0 0 22px rgba(55,189,248,1.0), 0 0 50px rgba(55,189,248,0.55)",
          duration: 0.90, ease: "sine.inOut", repeat: 4, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-chip"] = tl;
    </script>
  </body>
</html>
