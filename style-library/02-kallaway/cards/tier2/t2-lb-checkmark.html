<!doctype html>
<!--
  KALLAWAY · tier2 · label · CHECKMARK
  A single glowing SVG check mark that draws on via stroke-dashoffset, followed
  by a term phrase and a detail line. Anchored left side. Transparent overlay —
  only the check + text paint over live footage.
  Slots: term (~28 chars), detail (~80 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-chk {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind component only */
      #t2-lb-chk .local-glow {
        position: absolute;
        left: 60px; top: 340px;
        width: 520px; height: 320px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
      }

      /* Outer wrapper — left side, mid-height */
      #t2-lb-chk .wrapper {
        position: absolute;
        left: 80px; top: 380px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      /* Row: check icon + term */
      #t2-lb-chk .top-row {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      /* Glowing circle that holds the check */
      #t2-lb-chk .check-circle {
        width: 68px; height: 68px;
        border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.10);
        border: 1.5px solid rgba(var(--accent-rgb), 0.50);
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.25),
          0 0 28px rgba(var(--accent-rgb), 0.36),
          inset 0 1px 0 rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      #t2-lb-chk .check-svg {
        width: 36px; height: 36px;
        overflow: visible;
      }

      #t2-lb-chk .term {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }

      /* Detail panel — slim frosted glass */
      #t2-lb-chk .detail-panel {
        padding: 12px 22px 12px 20px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 520px;
        /* shift right to align under term text (check-circle width + gap) */
        margin-left: 90px;
      }

      #t2-lb-chk .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 22px;
        line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-chk" data-composition-id="t2-lb-chk"
         data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="top-row">
          <div class="check-circle">
            <!-- SVG checkmark — stroke-dashoffset draws on -->
            <svg class="check-svg" id="t2-lb-chk-svg"
                 viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="chkGlow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
                  <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
              </defs>
              <!-- Check path: two-segment mark, total length ~38px -->
              <polyline id="t2-lb-chk-path"
                points="6,19 14,27 30,9"
                stroke="#37BDF8"
                stroke-width="3.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
                filter="url(#chkGlow)"
                style="stroke-dasharray: 46; stroke-dashoffset: 46;"
              />
            </svg>
          </div>
          <div class="term" data-slot="term">Content Retention</div>
        </div>
        <div class="detail-panel">
          <div class="detail" data-slot="detail">Learners who watch structured modules retain 3× more than passive viewers.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP  = "#t2-lb-chk";
      const pathEl = document.getElementById("t2-lb-chk-path");

      /* local bloom blooms in */
      tl.from(`${COMP} .local-glow`,
        { autoAlpha: 0, scale: 0.6, transformOrigin: "30% 50%",
          duration: 1.1, ease: "expo.out" }, 0)

      /* check-circle springs in */
        .from(`${COMP} .check-circle`,
          { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 0.65, ease: "back.out(1.4)" }, 0.20)

      /* stroke draws on — animate strokeDashoffset 46 → 0 */
        .to({ val: 46 }, {
          val: 0, duration: 0.55, ease: "power2.out",
          onUpdate: function() {
            pathEl.style.strokeDashoffset = this.targets()[0].val;
          }
        }, 0.60)

      /* term glides in from left */
        .from(`${COMP} .term`,
          { autoAlpha: 0, x: -24, filter: "blur(10px)",
            duration: 0.70, ease: "power4.out" }, 0.72)

      /* detail panel slides up */
        .from(`${COMP} .detail-panel`,
          { autoAlpha: 0, y: 16, filter: "blur(8px)",
            duration: 0.65, ease: "power3.out" }, 0.95)

      /* breathing glow pulse on circle — finite */
        .to(`${COMP} .check-circle`, {
          boxShadow:
            "0 0 0 1px rgba(55,189,248,0.40), 0 0 44px rgba(55,189,248,0.60), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.70)

        .set({}, {}, 7);

      window.__timelines["t2-lb-chk"] = tl;
    </script>
  </body>
</html>
