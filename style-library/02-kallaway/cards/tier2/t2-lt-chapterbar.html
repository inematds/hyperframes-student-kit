<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · CHAPTERBAR
  A "Chapter X" accent pill slides in first; then a full-width dark glass bar
  slides up below the pill and reveals the section title. The bar has a thin
  accent top-edge line that draws across. Functional chapter/section marker for
  educational video.
  Slots: chapter (~12 chars, e.g. "Chapter 03"), title (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-chbar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Bloom behind the bar */
      #t2-lt-chbar .local-bloom {
        position: absolute;
        left: -30px; bottom: 100px;
        width: 700px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(42px);
        pointer-events: none;
        z-index: 1;
      }

      /* Stack: pill → bar */
      #t2-lt-chbar .stack {
        position: absolute;
        left: 80px; bottom: 118px;
        display: flex; flex-direction: column;
        align-items: flex-start; gap: 8px;
        z-index: 2;
      }

      /* Chapter pill */
      #t2-lt-chbar .chapter-pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 8px 22px 8px 16px;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1.5px solid rgba(var(--accent-rgb), 0.58);
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.32),
                    inset 0 1px 0 rgba(255,255,255,0.16);
      }

      #t2-lt-chbar .chapter-num-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.85);
        flex-shrink: 0;
      }

      #t2-lt-chbar .chapter-num {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.12em;
        color: var(--accent);
        text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.65);
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Section title bar */
      #t2-lt-chbar .title-bar {
        width: 860px;
        position: relative;
        overflow: hidden;
      }

      /* Accent top-edge line (drawn by GSAP scaleX) */
      #t2-lt-chbar .edge-line {
        display: block;
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.90) 0%,
          rgba(var(--accent-rgb), 0.45) 40%,
          rgba(var(--accent-rgb), 0.08) 75%,
          transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.55);
        transform-origin: left center;
        transform: scaleX(0);
      }

      /* Dark glass fill below the line */
      #t2-lt-chbar .bar-inner {
        padding: 16px 60px 16px 24px;
        background: linear-gradient(90deg,
          rgba(10, 14, 20, 0.78) 0%,
          rgba(16, 22, 34, 0.60) 50%,
          rgba(16, 22, 34, 0.22) 82%,
          transparent 100%);
        backdrop-filter: blur(16px) saturate(120%);
        -webkit-backdrop-filter: blur(16px) saturate(120%);
        clip-path: inset(0 100% 0 0);
      }

      #t2-lt-chbar .title {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }

      #t2-lt-chbar .title em {
        font-style: normal;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-chbar"
         data-composition-id="t2-lt-chbar"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stack">

        <div class="chapter-pill">
          <div class="chapter-num-dot"></div>
          <div class="chapter-num" data-slot="chapter">Chapter 04</div>
        </div>

        <div class="title-bar">
          <span class="edge-line"></span>
          <div class="bar-inner">
            <div class="title" data-slot="title">Prompt Engineering for <em>Real Results</em></div>
          </div>
        </div>

      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom fades in */
      tl.from("#t2-lt-chbar .local-bloom",
        { autoAlpha: 0, scale: 0.72, duration: 1.1, ease: "power2.out" }, 0);

      /* chapter pill slides in from left */
      tl.from("#t2-lt-chbar .chapter-pill",
        { autoAlpha: 0, x: -30, filter: "blur(8px)",
          duration: 0.62, ease: "back.out(1.4)" }, 0.10);

      /* edge line draws left→right */
      tl.to("#t2-lt-chbar .edge-line",
        { scaleX: 1, duration: 0.65, ease: "power4.out" }, 0.45);

      /* bar wipes in */
      tl.to("#t2-lt-chbar .bar-inner",
        { clipPath: "inset(0 0% 0 0)", duration: 0.68, ease: "power3.out" }, 0.55);

      /* title glides */
      tl.from("#t2-lt-chbar .title",
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.62, ease: "power4.out" }, 0.88);

      /* chapter pill glow pulse — finite */
      tl.to("#t2-lt-chbar .chapter-pill",
        { boxShadow:
            "0 0 32px rgba(55,189,248,0.55), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.60);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-chbar"] = tl;
    </script>
  </body>
</html>
