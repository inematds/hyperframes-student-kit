<!doctype html>
<!--
  KALLAWAY · tier2 · label · LEADER
  A curved SVG leader line draws from the right edge toward the label — a glowing
  path with an animated stroke-dashoffset reveal + a small dot endpoint. The term
  pill snaps on; the detail row glides in beneath.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-lead {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow behind the component */
      #t2-lb-lead .local-glow {
        position: absolute; right: 100px; top: 320px;
        width: 520px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 55% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 82%);
        filter: blur(42px);
        pointer-events: none;
      }

      /* SVG leader canvas — absolutely positioned, right side */
      #t2-lb-lead .leader-svg {
        position: absolute; right: 80px; top: 300px;
        width: 540px; height: 220px;
        overflow: visible;
      }

      /* The curved leader path */
      #t2-lb-lead .leader-path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2px;
        stroke-linecap: round;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.80))
                drop-shadow(0 0 16px rgba(var(--accent-rgb), 0.40));
      }

      /* Endpoint dot */
      #t2-lb-lead .leader-dot {
        fill: var(--white);
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.90));
      }

      /* Ring around endpoint */
      #t2-lb-lead .leader-ring {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.55);
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.60));
      }

      /* Label block anchored right */
      #t2-lb-lead .label-wrap {
        position: absolute; right: 80px; top: 430px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      }

      /* Term pill */
      #t2-lb-lead .term-pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 9px 22px;
        border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.11);
        border: 1.5px solid rgba(var(--accent-rgb), 0.52);
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.32),
                    inset 0 1px 0 rgba(255,255,255,0.15),
                    0 4px 16px rgba(0,0,0,0.45);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      #t2-lb-lead .term-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      #t2-lb-lead .term-text {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 28px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Detail row */
      #t2-lb-lead .detail-wrap {
        padding: 8px 18px 8px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 460px;
      }

      #t2-lb-lead .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 22px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-lead" data-composition-id="t2-lb-lead" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <!-- Curved leader line drawn via SVG -->
      <svg class="leader-svg" viewBox="0 0 540 220" xmlns="http://www.w3.org/2000/svg">
        <!-- Curved path: starts top-right (endpoint), curves down-left to label -->
        <path id="t2-lb-lead-path" class="leader-path"
              d="M 480 40 C 380 40, 280 90, 180 130" />
        <!-- Endpoint dot + ring at top-right anchor -->
        <circle class="leader-ring" cx="480" cy="40" r="10" />
        <circle class="leader-dot" cx="480" cy="40" r="4" />
      </svg>

      <div class="label-wrap">
        <div class="term-pill">
          <div class="term-dot"></div>
          <div class="term-text" data-slot="term">Attention Mechanism</div>
        </div>
        <div class="detail-wrap">
          <div class="detail-text" data-slot="detail">Lets the model weigh which tokens matter most when generating each output.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-lead";

      /* Pre-measure path length for dashoffset animation */
      const pathEl = document.getElementById("t2-lb-lead-path");
      const pathLen = pathEl ? pathEl.getTotalLength() : 320;
      pathEl.style.strokeDasharray = pathLen;
      pathEl.style.strokeDashoffset = pathLen;

      /* Local glow blooms in */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "55% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Endpoint ring fades in */
        .from(`${COMP} .leader-ring`, {
            autoAlpha: 0, scale: 0, transformOrigin: "480px 40px",
            duration: 0.5, ease: "back.out(1.4)" }, 0.15)

        /* Endpoint dot pops */
        .from(`${COMP} .leader-dot`, {
            autoAlpha: 0, scale: 0, transformOrigin: "480px 40px",
            duration: 0.35, ease: "back.out(2)" }, 0.2)

        /* Leader line draws in — stroke-dashoffset from full to 0 */
        .to(`${COMP} #t2-lb-lead-path`, {
            strokeDashoffset: 0, duration: 0.9, ease: "power3.out" }, 0.3)

        /* Term pill springs in from right */
        .from(`${COMP} .term-pill`, {
            autoAlpha: 0, x: 30, filter: "blur(8px)",
            duration: 0.68, ease: "back.out(1.4)" }, 0.85)

        /* Detail glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 16, filter: "blur(7px)",
            duration: 0.65, ease: "power4.out" }, 1.10)

        /* Finite glow pulse on the pill */
        .to(`${COMP} .term-pill`, {
            boxShadow: "0 0 36px rgba(55,189,248,0.60), inset 0 1px 0 rgba(255,255,255,0.22), 0 4px 16px rgba(0,0,0,0.45)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.90)

        /* Gentle ring pulse */
        .to(`${COMP} .leader-ring`, {
            opacity: 0.25, duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-lead"] = tl;
    </script>
  </body>
</html>
