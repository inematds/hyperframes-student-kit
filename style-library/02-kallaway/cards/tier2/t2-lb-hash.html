<!doctype html>
<!--
  KALLAWAY · tier2 · label · HASH
  A glowing #hashtag chip — the hash glyph glows accent-blue as the icon, the
  tag name sits beside it in a pill, and a small detail glass strip beneath.
  Anchored right side. Clean tech/social feel without any hand-drawn elements.
  Slots: term (tag name ~20 chars, without #), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-hash {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local bloom */
      #t2-lb-hash .local-glow {
        position: absolute; right: 110px; top: 360px;
        width: 480px; height: 260px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(38px);
        pointer-events: none;
        z-index: 0;
      }

      /* Right-anchored wrapper */
      #t2-lb-hash .wrapper {
        position: absolute; right: 140px; top: 400px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 11px;
        z-index: 2;
      }

      /* The hashtag chip */
      #t2-lb-hash .chip {
        display: inline-flex; align-items: center; gap: 0;
        padding: 12px 30px 12px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.50);
        border-radius: 999px;
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.22),
          0 0 28px rgba(var(--accent-rgb), 0.30),
          inset 0 1px 0 var(--glass-hi);
        position: relative; overflow: hidden;
        white-space: nowrap;
      }

      #t2-lb-hash .chip::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 50%, transparent);
      }

      /* The glowing # glyph */
      #t2-lb-hash .hash-glyph {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 36px;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        letter-spacing: -0.04em;
        margin-right: 4px;
      }

      /* Tag name */
      #t2-lb-hash .tag-name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
      }

      /* Detail strip */
      #t2-lb-hash .detail-wrap {
        padding: 9px 20px 9px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 440px;
        position: relative; overflow: hidden;
      }

      #t2-lb-hash .detail-wrap::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.40) 50%, transparent);
      }

      #t2-lb-hash .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 20px;
        line-height: 1.45;
        color: var(--text-dim);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-hash"
         data-composition-id="t2-lb-hash"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="chip">
          <span class="hash-glyph" aria-hidden="true">#</span>
          <span class="tag-name" data-slot="term">PromptEngineering</span>
        </div>
        <div class="detail-wrap">
          <div class="detail" data-slot="detail">The craft of structuring inputs so a model consistently produces the outputs you actually want.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-hash";

      /* Bloom materializes */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
          duration: 1.2, ease: "expo.out" }, 0)

        /* Chip slides in from right with spring */
        .from(`${C} .chip`,
          { autoAlpha: 0, x: 48, scale: 0.90, filter: "blur(10px)",
            transformOrigin: "right center",
            duration: 0.75, ease: "back.out(1.4)" }, 0.22)

        /* Detail card glides down */
        .from(`${C} .detail-wrap`,
          { autoAlpha: 0, y: 16, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.55)

        /* Hash glyph glow pulses — finite */
        .to(`${C} .hash-glyph`,
          { textShadow: "0 0 30px rgba(55,189,248,1.0), 0 0 60px rgba(55,189,248,0.60)",
            duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.30)

        /* Chip border breathes */
        .to(`${C} .chip`,
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.45), 0 0 46px rgba(55,189,248,0.52), inset 0 1px 0 rgba(255,255,255,0.22)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-hash"] = tl;
    </script>
  </body>
</html>
