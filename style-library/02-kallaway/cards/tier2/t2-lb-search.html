<!doctype html>
<!--
  KALLAWAY · tier2 · label · SEARCH BAR
  A glowing rounded glass search-bar pill: magnifier icon + `term` with an
  accent-colored keyword; `detail` as a small caption beneath.
  Anchored left-of-center. Transparent overlay.
  Slots: term (~24 chars, the search query), detail (~70 chars, caption beneath).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-search {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — left-center, contained */
      #t2-lb-search .local-glow {
        position: absolute; left: 60px; top: 480px;
        width: 640px; height: 260px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(36px);
        pointer-events: none;
      }

      /* Wrapper left side */
      #t2-lb-search .wrap {
        position: absolute; left: 80px; top: 490px;
        width: 560px;
      }

      /* Search pill */
      #t2-lb-search .search-pill {
        display: flex; align-items: center; gap: 14px;
        padding: 16px 28px; border-radius: 999px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 24px rgba(var(--accent-rgb), 0.20);
        margin-bottom: 14px;
        overflow: hidden;
        position: relative;
      }

      /* Subtle scan line shimmer across pill */
      #t2-lb-search .search-pill::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(90deg,
          transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
        transform: translateX(-100%);
      }

      /* Magnifier SVG icon */
      #t2-lb-search .icon {
        flex-shrink: 0; width: 28px; height: 28px;
        opacity: 0.85;
      }
      #t2-lb-search .icon path {
        stroke: var(--accent);
        filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.70));
      }

      /* Blinking cursor in pill */
      #t2-lb-search .pill-text {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 28px; color: var(--text);
        flex: 1;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* accent keyword wrapper — slot drives the whole text, keyword is the full text in accent */
      #t2-lb-search .pill-text em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
        font-weight: var(--wt-semi);
      }

      #t2-lb-search .cursor {
        width: 2px; height: 26px; background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
        border-radius: 1px;
      }

      /* Caption beneath */
      #t2-lb-search .caption {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.5;
        color: var(--text-dim);
        padding-left: 6px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-search" data-composition-id="t2-lb-search" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="wrap">
        <div class="search-pill">
          <!-- magnifier icon as inline SVG -->
          <svg class="icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.5 21C17.1944 21 21 17.1944 21 12.5C21 7.80558 17.1944 4 12.5 4C7.80558 4 4 7.80558 4 12.5C4 17.1944 7.80558 21 12.5 21Z"
              stroke="#37BDF8" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 19L24 24" stroke="#37BDF8" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="pill-text">
            <span data-slot="term">AI <em>trust signals</em></span>
          </div>
          <div class="cursor"></div>
        </div>
        <div class="caption" data-slot="detail">Most users form their opinion in the first 4 interactions — before any feature tour.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-search";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* pill glides up from below + spring */
        .from(`${COMP} .search-pill`, {
            autoAlpha: 0, y: 32, filter: "blur(12px)",
            duration: 0.78, ease: "back.out(1.4)" }, 0.18)

        /* shimmer sweep after pill lands */
        .to(`${COMP} .search-pill::after`, {
            /* pure CSS animation handled via class toggle isn't possible here —
               instead animate the pill's background-position as a shimmer proxy */
            backgroundPosition: "200% 0",
            duration: 0.65, ease: "power2.out" }, 0.90)

        /* icon glows on */
        .from(`${COMP} .icon`, {
            autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%",
            duration: 0.45, ease: "back.out(1.7)" }, 0.55)

        /* cursor blink — finite */
        .to(`${COMP} .cursor`, {
            autoAlpha: 0,
            duration: 0.42, ease: "power1.inOut", repeat: 5, yoyo: true }, 1.1)

        /* caption fades up */
        .from(`${COMP} .caption`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.55, ease: "power3.out" }, 1.0)

        /* accent glow pulse on pill */
        .to(`${COMP} .search-pill`, {
            boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 36px rgba(55,189,248,0.38)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-search"] = tl;
    </script>
  </body>
</html>
