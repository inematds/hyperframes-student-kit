<!doctype html>
<!--
  KALLAWAY · tier2 · label · INFO
  A small glowing "i" chip (filled circle with italic i glyph) springs in,
  followed by a term and a detail line. Anchored right side. Transparent overlay.
  Slots: term (~28 chars), detail (~80 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-info {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized ambient glow — right side */
      #t2-lb-info .local-glow {
        position: absolute;
        right: 100px; top: 360px;
        width: 480px; height: 280px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 60% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(38px);
        pointer-events: none;
      }

      /* Wrapper anchored right */
      #t2-lb-info .wrapper {
        position: absolute;
        right: 120px; top: 390px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        max-width: 480px;
      }

      /* "i" chip header row */
      #t2-lb-info .header-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* Glowing "i" chip */
      #t2-lb-info .i-chip {
        width: 52px; height: 52px;
        border-radius: 50%;
        background: linear-gradient(145deg,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.10) 100%);
        border: 1.5px solid rgba(var(--accent-rgb), 0.60);
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.20),
          0 0 24px rgba(var(--accent-rgb), 0.42),
          inset 0 1px 0 rgba(255,255,255,0.24);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      #t2-lb-info .i-glyph {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: var(--wt-black);
        font-size: 28px;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
        user-select: none;
      }

      #t2-lb-info .term {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }

      /* Full-width frosted glass card for detail */
      #t2-lb-info .detail-card {
        padding: 14px 20px 14px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        /* Thin accent bar on the left edge */
        border-left: 3px solid rgba(var(--accent-rgb), 0.55);
        width: 100%;
        box-sizing: border-box;
      }

      /* Hairline top inner highlight */
      #t2-lb-info .detail-card::before {
        content: "";
        display: block;
        height: 1px; margin: 0 0 10px;
        background: linear-gradient(90deg,
          rgba(255,255,255,0.30) 0%,
          transparent 80%);
        border-radius: 1px;
      }

      #t2-lb-info .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 21px;
        line-height: 1.50;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-info" data-composition-id="t2-lb-info"
         data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="header-row">
          <div class="i-chip">
            <span class="i-glyph">i</span>
          </div>
          <div class="term" data-slot="term">Spaced Repetition</div>
        </div>
        <div class="detail-card">
          <div class="detail" data-slot="detail">Reviewing material at increasing intervals locks it into long-term memory faster than massed study.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-info";

      /* ambient glow blooms */
      tl.from(`${COMP} .local-glow`,
        { autoAlpha: 0, scale: 0.55, transformOrigin: "60% 50%",
          duration: 1.2, ease: "expo.out" }, 0)

      /* i-chip springs in */
        .from(`${COMP} .i-chip`,
          { autoAlpha: 0, scale: 0.35, rotation: -18, transformOrigin: "50% 50%",
            duration: 0.60, ease: "back.out(1.4)" }, 0.25)

      /* term glides in from right */
        .from(`${COMP} .term`,
          { autoAlpha: 0, x: 28, filter: "blur(10px)",
            duration: 0.68, ease: "power4.out" }, 0.52)

      /* detail card slides in from right */
        .from(`${COMP} .detail-card`,
          { autoAlpha: 0, x: 22, filter: "blur(7px)",
            duration: 0.65, ease: "power3.out" }, 0.78)

      /* pulse the i-chip glow — finite */
        .to(`${COMP} .i-chip`, {
          boxShadow:
            "0 0 0 1px rgba(55,189,248,0.35), 0 0 42px rgba(55,189,248,0.68), inset 0 1px 0 rgba(255,255,255,0.28)",
          duration: 1.05, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-info"] = tl;
    </script>
  </body>
</html>
