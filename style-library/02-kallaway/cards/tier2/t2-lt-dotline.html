<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · DOTLINE
  A glowing leader line draws from a fixed anchor node (left edge) to a small
  neon marker dot, then a name+role block fades in beside it. The connector is
  the visual hero — a dashed SVG path that animates-draws left-to-right. Sits
  over live footage; only the component paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-dotl {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow centered on the dotline assembly */
      #t2-lt-dotl .local-bloom {
        position: absolute;
        left: 40px; bottom: 105px;
        width: 680px; height: 190px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 42% 75%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 78%);
        filter: blur(38px);
        pointer-events: none;
        z-index: 1;
      }

      /* The whole assembly — anchored lower-left */
      #t2-lt-dotl .assembly {
        position: absolute;
        left: 80px; bottom: 148px;
        display: flex;
        align-items: center;
        gap: 0;
        z-index: 2;
      }

      /* SVG leader line container */
      #t2-lt-dotl .leader-svg {
        width: 220px; height: 40px;
        flex-shrink: 0;
        overflow: visible;
      }

      /* Terminal marker dot (CSS, not SVG) */
      #t2-lt-dotl .marker {
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow:
          0 0 0 3px rgba(var(--accent-rgb), 0.20),
          0 0 12px rgba(var(--accent-rgb), 0.80),
          0 0 28px rgba(var(--accent-rgb), 0.45);
        flex-shrink: 0;
        margin-right: 22px;
        position: relative;
        z-index: 3;
      }

      /* Pulsing ring around marker */
      #t2-lt-dotl .marker::after {
        content: "";
        position: absolute;
        top: 50%; left: 50%;
        width: 28px; height: 28px;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        transform: translate(-50%, -50%);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.35);
      }

      /* Text block beside the marker */
      #t2-lt-dotl .text-block {
        display: flex; flex-direction: column; gap: 6px;
      }

      #t2-lt-dotl .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.0;
        /* frosted underlay inline — no extra div */
        background: rgba(10, 14, 20, 0.50);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        padding: 6px 20px 6px 16px;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        border: var(--stroke) solid var(--glass-border);
        border-bottom: none;
      }

      #t2-lt-dotl .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.2;
        background: rgba(10, 14, 20, 0.50);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        padding: 4px 20px 8px 16px;
        border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        border-top: none;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-dotl"
         data-composition-id="t2-lt-dotl"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="assembly">
        <!-- Leader line: dashed, draws left-to-right via stroke-dashoffset -->
        <svg class="leader-svg" id="dotl-svg">
          <defs>
            <filter id="dotl-glow">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Horizontal dashed leader line, y centered at 20px -->
          <line id="dotl-line"
                x1="0" y1="20" x2="210" y2="20"
                stroke="#37BDF8"
                stroke-width="2"
                stroke-dasharray="6 5"
                filter="url(#dotl-glow)"
                stroke-dashoffset="220"
                opacity="0" />
        </svg>

        <!-- Terminal marker dot -->
        <div class="marker" id="dotl-marker"></div>

        <!-- Name + role text block -->
        <div class="text-block">
          <div class="name" data-slot="name">Dr. Sarah Chen</div>
          <div class="role" data-slot="role">AI Curriculum Director, AIS Academy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-dotl";

      /* bloom rises */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.55, duration: 1.1, ease: "power2.out" }, 0);

      /* line appears then draws via dashoffset: 220 → 0 */
      const lineEl = document.getElementById("dotl-line");
      tl.to(lineEl, { opacity: 1, duration: 0.18, ease: "none" }, 0.15);
      tl.to({ offset: 220 }, {
        offset: 0, duration: 0.75, ease: "power3.out",
        onUpdate: function() {
          if (lineEl) lineEl.setAttribute("stroke-dashoffset", this.targets()[0].offset);
        }
      }, 0.20);

      /* marker pops in with scale spring after line finishes */
      tl.from(`${C} .marker`,
        { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%",
          duration: 0.32, ease: "back.out(2.0)" }, 0.88);

      /* name block glides in from left */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -24, filter: "blur(8px)",
          duration: 0.62, ease: "power4.out" }, 1.0);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -16, filter: "blur(6px)",
          duration: 0.55, ease: "power3.out" }, 1.18);

      /* marker glow pulse — finite */
      tl.to(`${C} .marker`, {
        boxShadow: "0 0 0 4px rgba(55,189,248,0.22), 0 0 22px rgba(55,189,248,1.00), 0 0 44px rgba(55,189,248,0.55)",
        duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-dotl"] = tl;
    </script>
  </body>
</html>
