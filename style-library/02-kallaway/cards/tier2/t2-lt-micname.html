<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · MICNAME
  Podcast-vibe name card. A glowing microphone icon (SVG) lives on the left
  inside a small neon-rimmed circle; name + role float beside it on a frosted
  pill. The mic icon pulses with a neon bloom. Clean, broadcast-studio feeling.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-mic {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom — radiates from the mic icon */
      #t2-lt-mic .local-bloom {
        position: absolute;
        left: 50px; bottom: 95px;
        width: 420px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 20% 65%,
          rgba(var(--accent-rgb), 0.38) 0%,
          rgba(var(--accent-rgb), 0.10) 48%,
          transparent 72%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Row layout */
      #t2-lt-mic .row {
        position: absolute;
        left: 80px; bottom: 122px;
        display: flex; align-items: center; gap: 26px;
        z-index: 2;
      }

      /* Mic icon circle */
      #t2-lt-mic .mic-circle {
        flex-shrink: 0;
        width: 80px; height: 80px;
        border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.10);
        border: 2px solid rgba(var(--accent-rgb), 0.70);
        box-shadow:
          0 0 0 5px rgba(var(--accent-rgb), 0.10),
          0 0 22px rgba(var(--accent-rgb), 0.50),
          0 0 50px rgba(var(--accent-rgb), 0.22),
          inset 0 1px 0 rgba(255,255,255,0.20);
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      /* SVG mic icon inline */
      #t2-lt-mic .mic-icon {
        width: 36px; height: 36px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px rgba(55,189,248,0.80));
      }

      /* Glass name pill */
      #t2-lt-mic .pill {
        padding: 20px 36px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        /* hairline top shimmer */
        position: relative; overflow: hidden;
      }

      #t2-lt-mic .pill::before {
        content: "";
        position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      #t2-lt-mic .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 7px;
        white-space: nowrap;
      }

      #t2-lt-mic .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        white-space: nowrap;
      }

      /* "ON AIR" badge — upper-right corner of pill */
      #t2-lt-mic .on-air {
        position: absolute;
        top: -10px; right: 18px;
        padding: 4px 12px;
        background: rgba(255,59,48,0.18);
        border: 1.5px solid rgba(255,59,48,0.65);
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.14em;
        color: #ff5f58;
        text-shadow: 0 0 10px rgba(255,59,48,0.70);
        box-shadow: 0 0 12px rgba(255,59,48,0.30);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-mic"
         data-composition-id="t2-lt-mic"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="row">
        <div class="mic-circle">
          <!-- Microphone SVG (capsule body + stand + base) -->
          <svg class="mic-icon" viewBox="0 0 24 24">
            <rect x="9" y="2" width="6" height="11" rx="3"/>
            <path d="M5 10a7 7 0 0014 0"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
          </svg>
        </div>

        <div class="pill">
          <div class="on-air">ON AIR</div>
          <div class="name" data-slot="name">Jordan Reese</div>
          <div class="role" data-slot="role">Host · The AI Education Podcast</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom swells */
      tl.from("#t2-lt-mic .local-bloom",
        { autoAlpha: 0, scale: 0.60, duration: 1.2, ease: "power2.out" }, 0);

      /* mic circle pops in with spring */
      tl.from("#t2-lt-mic .mic-circle",
        { autoAlpha: 0, scale: 0.50, transformOrigin: "50% 50%",
          duration: 0.68, ease: "back.out(1.7)" }, 0.15);

      /* ON AIR badge drops from above */
      tl.from("#t2-lt-mic .on-air",
        { autoAlpha: 0, y: -12, duration: 0.45, ease: "back.out(1.4)" }, 0.50);

      /* pill slides in from left */
      tl.from("#t2-lt-mic .pill",
        { autoAlpha: 0, x: -28, filter: "blur(10px)",
          duration: 0.70, ease: "back.out(1.4)" }, 0.32);

      /* name reveals */
      tl.from("#t2-lt-mic .name",
        { autoAlpha: 0, x: -16, filter: "blur(7px)",
          duration: 0.60, ease: "power4.out" }, 0.72);

      /* role follows */
      tl.from("#t2-lt-mic .role",
        { autoAlpha: 0, x: -12, filter: "blur(5px)",
          duration: 0.55, ease: "power3.out" }, 0.88);

      /* mic circle glow pulse — finite */
      tl.to("#t2-lt-mic .mic-circle",
        { boxShadow:
            "0 0 0 8px rgba(55,189,248,0.14), 0 0 38px rgba(55,189,248,0.70), 0 0 80px rgba(55,189,248,0.34), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      /* ON AIR red flicker — finite */
      tl.to("#t2-lt-mic .on-air",
        { opacity: 0.45, duration: 0.55, ease: "none", repeat: 5, yoyo: true }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-mic"] = tl;
    </script>
  </body>
</html>
