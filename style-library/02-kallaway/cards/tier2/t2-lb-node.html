<!doctype html>
<!--
  KALLAWAY · tier2 · label · NODE
  A glowing node dot with a finite pulse ring expanding outward (3 repeats), then
  a term label glides in to the right of the node. A detail strip follows below.
  Anchored left side. Minimalist — the dot IS the visual center of gravity.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-node {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local glow centered on node */
      #t2-lb-node .local-glow {
        position: absolute; left: 140px; top: 400px;
        width: 400px; height: 400px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.09) 50%,
          transparent 76%);
        filter: blur(50px);
        pointer-events: none;
      }

      /* Node group — SVG */
      #t2-lb-node .node-svg {
        position: absolute; left: 140px; top: 430px;
        width: 120px; height: 120px;
        overflow: visible;
      }

      /* Pulse rings (expand outward) */
      #t2-lb-node .ring-pulse-1,
      #t2-lb-node .ring-pulse-2 {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.50);
        stroke-width: 1.5px;
      }

      /* Core node circle */
      #t2-lb-node .node-core {
        fill: var(--accent);
        filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.90))
                drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.50));
      }

      /* White highlight inside core */
      #t2-lb-node .node-hi {
        fill: rgba(255,255,255,0.80);
      }

      /* Inner glow ring */
      #t2-lb-node .node-inner-ring {
        fill: none;
        stroke: rgba(255,255,255,0.35);
        stroke-width: 1px;
      }

      /* Connector line from node to label */
      #t2-lb-node .conn-svg {
        position: absolute; left: 268px; top: 488px;
        width: 50px; height: 2px; overflow: visible;
      }

      #t2-lb-node .conn-line {
        stroke: rgba(var(--accent-rgb), 0.55);
        stroke-width: 1.5px;
        stroke-dasharray: 4 3;
        stroke-linecap: round;
        filter: drop-shadow(0 0 3px rgba(var(--accent-rgb), 0.55));
      }

      /* Label group beside node */
      #t2-lb-node .label-group {
        position: absolute; left: 330px; top: 446px;
        display: flex; flex-direction: column; gap: 10px;
      }

      /* Term — large and glowing */
      #t2-lb-node .term-wrap {
        display: flex; align-items: center; gap: 10px;
      }

      #t2-lb-node .term-text {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 34px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Tiny status badge inline */
      #t2-lb-node .status-badge {
        font-family: var(--font-mono); font-size: 11px;
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        padding: 3px 8px;
        border: 1px solid rgba(var(--accent-rgb), 0.40);
        border-radius: 4px;
        background: rgba(var(--accent-rgb), 0.08);
        white-space: nowrap;
      }

      /* Detail strip */
      #t2-lb-node .detail-wrap {
        padding: 8px 18px 8px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 500px;
      }

      #t2-lb-node .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 22px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-node" data-composition-id="t2-lb-node" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <!-- Node SVG: center at 60,60 in 120×120 viewBox -->
      <svg class="node-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Pulse rings (initially at r=16, will expand in JS) -->
        <circle id="t2-lb-node-pr1" class="ring-pulse-1" cx="60" cy="60" r="16" />
        <circle id="t2-lb-node-pr2" class="ring-pulse-2" cx="60" cy="60" r="16" />
        <!-- Inner ring -->
        <circle class="node-inner-ring" cx="60" cy="60" r="18" />
        <!-- Core dot -->
        <circle class="node-core" cx="60" cy="60" r="12" />
        <!-- Highlight specular -->
        <circle class="node-hi" cx="55" cy="55" r="3" />
      </svg>

      <!-- Dashed connector line -->
      <svg class="conn-svg" viewBox="0 0 50 2" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line id="t2-lb-node-conn" class="conn-line" x1="0" y1="1" x2="50" y2="1" />
      </svg>

      <div class="label-group">
        <div class="term-wrap">
          <div class="term-text" data-slot="term">Embedding Layer</div>
          <div class="status-badge">LIVE</div>
        </div>
        <div class="detail-wrap">
          <div class="detail-text" data-slot="detail">Maps each token to a high-dimensional vector — the first step of model comprehension.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-node";

      /* Local glow */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Core dot pops in */
        .from(`${COMP} .node-core`, {
            autoAlpha: 0, scale: 0, transformOrigin: "60px 60px",
            duration: 0.40, ease: "back.out(2.5)" }, 0.20)

        /* Highlight and inner ring */
        .from(`${COMP} .node-hi, ${COMP} .node-inner-ring`, {
            autoAlpha: 0, duration: 0.25, ease: "power2.out" }, 0.48)

        /* Pulse ring 1 — expands out and fades (3 repeats) */
        .fromTo(`${COMP} #t2-lb-node-pr1`,
            { attr: { r: 16 }, opacity: 0.80 },
            { attr: { r: 55 }, opacity: 0, duration: 1.0, ease: "power2.out", repeat: 2 }, 0.55)

        /* Pulse ring 2 — delayed, same motion */
        .fromTo(`${COMP} #t2-lb-node-pr2`,
            { attr: { r: 16 }, opacity: 0.55 },
            { attr: { r: 50 }, opacity: 0, duration: 1.0, ease: "power2.out", repeat: 2 }, 0.90)

        /* Connector draws */
        .from(`${COMP} #t2-lb-node-conn`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.35, ease: "power3.out" }, 0.58)

        /* Term glides in */
        .from(`${COMP} .term-wrap`, {
            autoAlpha: 0, x: -18, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.68)

        /* Status badge pops */
        .from(`${COMP} .status-badge`, {
            autoAlpha: 0, scale: 0.7, duration: 0.32, ease: "back.out(1.8)" }, 0.95)

        /* Detail glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.62, ease: "power4.out" }, 1.00)

        /* Core dot finite glow pulse */
        .to(`${COMP} .node-core`, {
            opacity: 0.55, duration: 0.90, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-node"] = tl;
    </script>
  </body>
</html>
