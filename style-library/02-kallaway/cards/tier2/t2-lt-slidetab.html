<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · SLIDETAB
  A glass tab nameplate that slides out from the left edge of frame. The tab has a
  visible left-edge "spine" (a 4px accent stripe) and the right side is a slightly
  rounded glass surface. Name and role live inside; the entire assembly enters from
  x: -full-width so it feels like it's being pulled out of the left wall of the screen.
  Mechanically unique: the entrance is a horizontal slide-reveal, not a fade-in.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-stab {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom that enters with the tab */
      #t2-lt-stab .local-bloom {
        position: absolute;
        left: -60px; bottom: 96px;
        width: 560px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 78%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Tab container — starts fully off-left, slides in */
      #t2-lt-stab .tab {
        position: absolute;
        left: 0; bottom: 118px;
        display: flex;
        align-items: stretch;
        z-index: 2;
        /* clipping to ensure the spine doesn't bleed during slide */
        border-radius: 0 var(--radius) var(--radius) 0;
        overflow: hidden;
        box-shadow: var(--glass-shadow), 0 0 32px rgba(var(--accent-rgb), 0.16);
      }

      /* Left spine — solid accent stripe */
      #t2-lt-stab .spine {
        width: 6px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.90) 0%,
          var(--accent) 20%,
          rgba(var(--accent-rgb), 0.50) 80%,
          transparent 100%);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.70);
        flex-shrink: 0;
        position: relative;
      }

      /* Glow smear from the spine */
      #t2-lt-stab .spine::after {
        content: "";
        position: absolute; top: 0; left: 6px; bottom: 0; width: 20px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.20), transparent);
        pointer-events: none;
      }

      /* Glass body of the tab */
      #t2-lt-stab .body {
        padding: 22px 40px 20px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-top: var(--stroke) solid var(--glass-border);
        border-right: var(--stroke) solid var(--glass-border);
        border-bottom: var(--stroke) solid var(--glass-border);
        position: relative;
        overflow: hidden;
      }

      /* Inner top-highlight */
      #t2-lt-stab .body::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 12px; height: 1px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.30), rgba(255,255,255,0.40) 40%, transparent);
      }

      #t2-lt-stab .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 7px;
        white-space: nowrap;
      }

      #t2-lt-stab .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
        white-space: nowrap;
      }

      /* Subtle dot before role */
      #t2-lt-stab .role::before {
        content: "";
        display: inline-block;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.80);
        margin-right: 9px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-stab"
         data-composition-id="t2-lt-stab"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="tab">
        <div class="spine"></div>
        <div class="body">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lt-stab";

      /* bloom enters with the tab */
      tl.from(`${COMP} .local-bloom`,
        { autoAlpha: 0, x: -200, duration: 1.1, ease: "power3.out" }, 0);

      /* tab slides out from left wall — starts at -500px, arrives at x:0 */
      tl.from(`${COMP} .tab`,
        { x: -520, duration: 0.78, ease: "power4.out" }, 0.08);

      /* spine brightness flares on arrival */
      tl.from(`${COMP} .spine`,
        { opacity: 0.2, duration: 0.30, ease: "power2.out" }, 0.68);

      /* name glides in from left within the tab */
      tl.from(`${COMP} .name`,
        { autoAlpha: 0, x: -30, filter: "blur(7px)",
          duration: 0.55, ease: "power4.out" }, 0.60);

      /* role follows */
      tl.from(`${COMP} .role`,
        { autoAlpha: 0, x: -20, filter: "blur(5px)",
          duration: 0.50, ease: "power3.out" }, 0.76);

      /* spine glow pulse — finite */
      tl.to(`${COMP} .spine`,
        { boxShadow: "0 0 24px rgba(55,189,248,0.90), 0 0 44px rgba(55,189,248,0.50)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.4);

      /* very gentle rightward drift during hold */
      tl.to(`${COMP} .tab`,
        { x: 6, duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-stab"] = tl;
    </script>
  </body>
</html>
