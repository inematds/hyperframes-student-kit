<!doctype html>
<!--
  KALLAWAY · tier2 · label · CATEGORY
  A CATEGORY-tagged term: a small category tag chip above + term heading + detail,
  on frosted dark glass. Anchored right side. Transparent overlay.
  Slots: term (~24 chars), detail (~70 chars).
  The category chip label is baked into the placeholder; swap in slot if needed.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-cat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — right side */
      #t2-lb-cat .local-glow {
        position: absolute; right: 50px; top: 270px;
        width: 580px; height: 440px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.16) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 78%);
        filter: blur(44px);
        pointer-events: none;
      }

      /* Glass card anchored right */
      #t2-lb-cat .card {
        position: absolute; right: 80px; top: 310px;
        width: 510px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.07);
        border-radius: var(--radius);
        padding: 28px 34px 32px;
        overflow: hidden;
      }

      /* Top neon rim */
      #t2-lb-cat .card::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.65) 38%,
          rgba(var(--accent-rgb), 0.65) 62%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.44);
      }

      /* Category chip */
      #t2-lb-cat .cat-chip {
        display: inline-flex; align-items: center; gap: 7px;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1.5px solid rgba(var(--accent-rgb), 0.36);
        border-radius: 999px;
        padding: 5px 16px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.22);
      }

      /* Dot indicator inside chip */
      #t2-lb-cat .cat-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.80);
        flex-shrink: 0;
      }

      #t2-lb-cat .cat-label {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: 14px; letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        line-height: 1;
      }

      /* Term heading */
      #t2-lb-cat .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 38px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.15; margin-bottom: 14px;
      }

      /* Thin accent rule */
      #t2-lb-cat .accent-rule {
        height: 2px; width: 100%;
        background: linear-gradient(90deg,
          var(--accent) 0%, rgba(var(--accent-rgb), 0.15) 100%);
        box-shadow: 0 0 7px rgba(var(--accent-rgb), 0.38);
        margin-bottom: 18px;
        transform-origin: left center;
      }

      /* Detail body */
      #t2-lb-cat .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 26px; line-height: 1.52;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-cat" data-composition-id="t2-lb-cat" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <div class="cat-chip">
          <div class="cat-dot"></div>
          <div class="cat-label" data-slot="category">Infrastructure</div>
        </div>
        <div class="term" data-slot="term">Vector Database</div>
        <div class="accent-rule"></div>
        <div class="detail" data-slot="detail">A store optimized for high-dimensional embedding search — the backbone of every production RAG system at scale.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP = "#t2-lb-cat";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* card glides in from right + blur */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: 58, filter: "blur(14px)",
            duration: 0.88, ease: "back.out(1.4)" }, 0.18)

        /* chip scales + fades */
        .from(`${COMP} .cat-chip`, {
            autoAlpha: 0, scale: 0.72, transformOrigin: "0% 50%",
            filter: "blur(5px)",
            duration: 0.50, ease: "back.out(1.7)" }, 0.52)

        /* dot glows on */
        .from(`${COMP} .cat-dot`, {
            autoAlpha: 0, scale: 0,
            duration: 0.35, ease: "back.out(2.5)" }, 0.72)

        /* term glides + blur */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.82)

        /* accent rule draws */
        .from(`${COMP} .accent-rule`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.50, ease: "power3.out" }, 1.06)

        /* detail fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.62, ease: "power3.out" }, 1.24)

        /* chip dot pulse — finite */
        .to(`${COMP} .cat-dot`, {
            boxShadow: "0 0 14px rgba(55,189,248,0.95), 0 0 32px rgba(55,189,248,0.50)",
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-cat"] = tl;
    </script>
  </body>
</html>
