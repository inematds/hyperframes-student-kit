<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · CAPSULE
  A wide pill/capsule shape with a sliding glow fill that sweeps left-to-right
  through its interior once, then settles. The name sits centered in the capsule
  and the role appears on a slim ledge below. Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-cap {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-cap .local-bloom {
        position: absolute;
        left: 40px; bottom: 80px;
        width: 640px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 38% 78%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(46px);
        pointer-events: none;
        z-index: 1;
      }

      /* Capsule wrapper */
      #t2-lt-cap .capsule-wrap {
        position: absolute;
        left: 80px; bottom: 148px;
        z-index: 2;
      }

      /* The pill shape */
      #t2-lt-cap .capsule {
        position: relative;
        width: 520px; height: 68px;
        border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.06);
        border: 1.5px solid rgba(var(--accent-rgb), 0.50);
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.20),
          0 0 28px rgba(var(--accent-rgb), 0.24),
          0 8px 36px rgba(0,0,0,0.50),
          inset 0 1px 0 rgba(255,255,255,0.12);
        overflow: hidden;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      /* The sliding glow fill — a gradient bar that sweeps through */
      #t2-lt-cap .sweep {
        position: absolute;
        top: 0; left: -560px;
        width: 520px; height: 100%;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.10) 20%,
          rgba(var(--accent-rgb), 0.45) 48%,
          rgba(255, 255, 255, 0.55) 55%,
          rgba(var(--accent-rgb), 0.45) 62%,
          rgba(var(--accent-rgb), 0.10) 80%,
          transparent 100%);
        border-radius: 999px;
        filter: blur(3px);
        pointer-events: none;
      }

      /* Name text centered in capsule */
      #t2-lt-cap .name {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 32px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        z-index: 2;
        white-space: nowrap;
      }

      /* Role ledge below capsule */
      #t2-lt-cap .role-ledge {
        margin-top: 10px;
        padding: 8px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        border-top: none;
        box-shadow: 0 12px 40px rgba(0,0,0,0.40);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #t2-lt-cap .role-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      #t2-lt-cap .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 20px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-cap"
         data-composition-id="t2-lt-cap"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="capsule-wrap">
        <div class="capsule">
          <div class="sweep" id="cap-sweep"></div>
          <div class="name" data-slot="name">Kallaway Osei</div>
        </div>
        <div class="role-ledge">
          <div class="role-dot"></div>
          <div class="role" data-slot="role">AI Education Director, AIS</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-cap";

      /* bloom */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.1, ease: "expo.out" }, 0);

      /* capsule border draws via scaleX + back spring */
      tl.from(`${C} .capsule`,
        { autoAlpha: 0, scaleX: 0.55, transformOrigin: "left center",
          duration: 0.72, ease: "back.out(1.4)" }, 0.14);

      /* glow SWEEP left → right — single pass */
      tl.to("#cap-sweep",
        { left: 560, duration: 0.68, ease: "power2.inOut" }, 0.30);

      /* name resolves as sweep passes midpoint */
      tl.from(`${C} .name`,
        { autoAlpha: 0, scale: 0.92, transformOrigin: "50% 50%",
          duration: 0.45, ease: "power3.out" }, 0.50);

      /* role ledge drops in */
      tl.from(`${C} .role-ledge`,
        { autoAlpha: 0, y: -14, duration: 0.55, ease: "power3.out" }, 0.82);

      /* capsule rim glow pulse — finite */
      tl.to(`${C} .capsule`, {
        boxShadow:
          "0 0 0 1px rgba(55,189,248,0.45), 0 0 48px rgba(55,189,248,0.42), 0 8px 36px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.18)",
        duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.60);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-cap"] = tl;
    </script>
  </body>
</html>
