<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · WAVEBAND
  An audio-waveform strip lower-left. 20 vertical bars of varying hardcoded heights
  animate up and down in a staggered finite pattern, suggesting a live EQ/spectrum.
  Name and role sit to the right of the waveform in a compact text block — no glass
  card surround, the waveform IS the visual anchor. A thin neon accent line underlines
  the whole unit. Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-wband {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Soft bloom under the unit */
      #t2-lt-wband .local-bloom {
        position: absolute;
        left: 52px; bottom: 100px;
        width: 560px; height: 150px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 25% 90%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 78%);
        filter: blur(28px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer unit container */
      #t2-lt-wband .unit {
        position: absolute;
        left: 80px; bottom: 130px;
        display: flex;
        align-items: center;
        gap: 28px;
        z-index: 2;
      }

      /* Waveform strip */
      #t2-lt-wband .wave-wrap {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 80px;
        padding: 0 4px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.35);
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.18),
          0 0 22px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi),
          var(--glass-shadow);
        overflow: hidden;
        position: relative;
      }

      #t2-lt-wband .wave-wrap::before {
        content: "";
        position: absolute; top: 0; left: 6px; right: 6px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.40) 50%, transparent);
      }

      /* Each bar */
      #t2-lt-wband .bar {
        width: 6px;
        border-radius: 3px 3px 0 0;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.95) 0%,
          var(--accent) 40%,
          rgba(var(--accent-rgb), 0.45) 100%);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.60);
        transform-origin: bottom center;
        will-change: transform;
        /* heights set inline */
      }

      /* Text side */
      #t2-lt-wband .text-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }

      #t2-lt-wband .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
      }

      #t2-lt-wband .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        color: var(--text-dim);
        letter-spacing: 0.01em;
        line-height: 1.3;
      }

      /* Bottom accent line that spans the full unit */
      #t2-lt-wband .accent-line {
        position: absolute;
        left: 80px; bottom: 124px;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg,
          var(--accent),
          rgba(var(--accent-rgb), 0.40) 60%,
          transparent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        border-radius: 1px;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-wband"
         data-composition-id="t2-lt-wband"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <!-- bar heights are hardcoded (deterministic); 20 bars -->
      <div class="unit">
        <div class="wave-wrap">
          <div class="bar" style="height:22px"></div>
          <div class="bar" style="height:44px"></div>
          <div class="bar" style="height:58px"></div>
          <div class="bar" style="height:36px"></div>
          <div class="bar" style="height:68px"></div>
          <div class="bar" style="height:52px"></div>
          <div class="bar" style="height:30px"></div>
          <div class="bar" style="height:62px"></div>
          <div class="bar" style="height:46px"></div>
          <div class="bar" style="height:70px"></div>
          <div class="bar" style="height:38px"></div>
          <div class="bar" style="height:56px"></div>
          <div class="bar" style="height:28px"></div>
          <div class="bar" style="height:64px"></div>
          <div class="bar" style="height:48px"></div>
          <div class="bar" style="height:34px"></div>
          <div class="bar" style="height:60px"></div>
          <div class="bar" style="height:42px"></div>
          <div class="bar" style="height:26px"></div>
          <div class="bar" style="height:50px"></div>
        </div>
        <div class="text-col">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">AI Strategy Instructor</div>
        </div>
      </div>

      <div class="accent-line"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lt-wband";

      /* bloom rises */
      tl.from(`${COMP} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.0, ease: "power2.out" }, 0);

      /* wave-wrap slides in from left */
      tl.from(`${COMP} .wave-wrap`,
        { autoAlpha: 0, x: -50, scaleX: 0.6, transformOrigin: "left center",
          filter: "blur(8px)", duration: 0.68, ease: "power4.out" }, 0.10);

      /* bars pop in staggered from shortest to tallest */
      tl.from(`${COMP} .bar`,
        { scaleY: 0, autoAlpha: 0, transformOrigin: "bottom center",
          duration: 0.40, ease: "back.out(1.6)",
          stagger: { amount: 0.45, from: "start" } }, 0.32);

      /* text glides in from right */
      tl.from(`${COMP} .name`,
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.62, ease: "power4.out" }, 0.52);

      tl.from(`${COMP} .role`,
        { autoAlpha: 0, x: -14, filter: "blur(5px)",
          duration: 0.55, ease: "power3.out" }, 0.68);

      /* accent line draws in */
      tl.to(`${COMP} .accent-line`,
        { width: 500, duration: 0.70, ease: "power3.out" }, 0.80);

      /* bars animate — 3 sets of finite up/down with hardcoded target heights,
         creating the illusion of live audio. All values hardcoded (deterministic). */
      const barTargetSets = [
        [55, 28, 70, 44, 36, 68, 58, 34, 62, 22, 64, 40, 70, 28, 52, 60, 30, 66, 44, 26],
        [30, 60, 40, 66, 24, 54, 34, 68, 42, 58, 28, 72, 38, 56, 44, 26, 64, 36, 56, 38],
        [44, 36, 60, 28, 64, 38, 56, 48, 32, 68, 50, 28, 60, 42, 70, 34, 48, 58, 30, 62],
      ];

      const bars = document.querySelectorAll(`${COMP} .bar`);

      barTargetSets.forEach((heights, si) => {
        bars.forEach((bar, i) => {
          tl.to(bar, {
            height: heights[i] + "px",
            duration: 0.55,
            ease: "sine.inOut"
          }, 1.2 + si * 0.60 + i * 0.028);
        });
      });

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-wband"] = tl;
    </script>
  </body>
</html>
