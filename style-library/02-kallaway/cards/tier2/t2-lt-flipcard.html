<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · FLIPCARD
  A glass card flips in on its Y-axis (rotateY 90→0) to reveal name + role.
  The front face is the dark glass card with text; the back is an accent-tinted
  opaque face that's visible for a split-second during the flip. perspective +
  preserve-3d container makes the 3D flip legible over footage. Unique mechanic
  in this set: only card using 3D CSS transform driven by GSAP.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-flip {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Bloom behind the card */
      #t2-lt-flip .local-bloom {
        position: absolute;
        left: 50px; bottom: 88px;
        width: 520px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 75%,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* 3D scene wrapper — sets perspective */
      #t2-lt-flip .scene {
        position: absolute;
        left: 80px; bottom: 118px;
        width: 480px;
        height: 124px;
        perspective: 900px;
        z-index: 2;
      }

      /* The card that flips — preserve-3d */
      #t2-lt-flip .flipper {
        width: 100%; height: 100%;
        position: relative;
        transform-style: preserve-3d;
        /* starts edge-on: rotateY(90deg), GSAP unwinds to 0 */
        transform: rotateY(90deg);
        transform-origin: left center;
      }

      /* Shared face styles */
      #t2-lt-flip .face {
        position: absolute; inset: 0;
        border-radius: var(--radius);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }

      /* Back face — accent tinted, shown during flip transition */
      #t2-lt-flip .face-back {
        background: rgba(var(--accent-rgb), 0.22);
        border: 1.5px solid rgba(var(--accent-rgb), 0.60);
        box-shadow: 0 0 28px rgba(var(--accent-rgb), 0.40);
        /* rotated 180 so it shows when flipper is around 90deg */
        transform: rotateY(180deg);
      }

      /* Front face — the readable card */
      #t2-lt-flip .face-front {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 24px rgba(var(--accent-rgb), 0.22),
          inset 0 1px 0 var(--glass-hi);
        padding: 24px 38px 22px;
        display: flex; flex-direction: column; justify-content: center;
      }

      /* hairline top shimmer */
      #t2-lt-flip .face-front::before {
        content: "";
        position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      #t2-lt-flip .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 8px;
        white-space: nowrap;
      }

      #t2-lt-flip .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
        white-space: nowrap;
        display: flex; align-items: center; gap: 9px;
      }

      #t2-lt-flip .role-dot {
        flex-shrink: 0;
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.85);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-flip"
         data-composition-id="t2-lt-flip"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="scene">
        <div class="flipper">
          <!-- back face (accent tint, shows during flip) -->
          <div class="face face-back"></div>
          <!-- front face (readable) -->
          <div class="face face-front">
            <div class="name" data-slot="name">Elena Vasquez</div>
            <div class="role">
              <span class="role-dot"></span>
              <span data-slot="role">Senior Instructional Designer</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom swells */
      tl.from("#t2-lt-flip .local-bloom",
        { autoAlpha: 0, scale: 0.62, duration: 1.1, ease: "power2.out" }, 0);

      /* flipper starts edge-on (rotateY 90) → unwinds to 0 */
      /* Use autoAlpha so it's not invisible before the flip */
      tl.set("#t2-lt-flip .flipper", { autoAlpha: 1 }, 0);
      tl.to("#t2-lt-flip .flipper",
        { rotateY: 0, duration: 0.82, ease: "back.out(1.2)",
          transformOrigin: "left center" }, 0.18);

      /* name glides in after card faces forward */
      tl.from("#t2-lt-flip .name",
        { autoAlpha: 0, x: -16, filter: "blur(8px)",
          duration: 0.58, ease: "power4.out" }, 0.75);

      /* role follows */
      tl.from("#t2-lt-flip .role",
        { autoAlpha: 0, x: -12, filter: "blur(6px)",
          duration: 0.52, ease: "power3.out" }, 0.90);

      /* card rim glow pulses — finite */
      tl.to("#t2-lt-flip .face-front",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.85), 0 0 40px rgba(55,189,248,0.40), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      /* role dot glow — finite */
      tl.to("#t2-lt-flip .role-dot",
        { boxShadow: "0 0 14px rgba(55,189,248,1.0), 0 0 28px rgba(55,189,248,0.60)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-flip"] = tl;
    </script>
  </body>
</html>
