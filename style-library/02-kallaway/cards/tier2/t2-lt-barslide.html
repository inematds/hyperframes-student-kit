<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · BARSLIDE
  A bold vertical accent bar shoots out from the left edge via clip-path, then
  the name and role cascade in beside it from behind the bar. The bar is thick
  and neon-lit; the glass pill housing the text appears as the bar reaches full
  height. Different mechanic from EDGEBAR: bar is wider/bolder, appears first as
  an independent element then the glass wraps around it — split-reveal feel.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-bslide {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Bloom behind entire component */
      #t2-lt-bslide .local-bloom {
        position: absolute;
        left: 40px; bottom: 90px;
        width: 560px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 10% 70%,
          rgba(var(--accent-rgb), 0.32) 0%,
          rgba(var(--accent-rgb), 0.09) 52%,
          transparent 76%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer anchor wrapper */
      #t2-lt-bslide .anchor {
        position: absolute;
        left: 80px; bottom: 120px;
        display: flex; align-items: stretch;
        gap: 0;
        z-index: 2;
      }

      /* The sliding bar — tall neon slab */
      #t2-lt-bslide .bar {
        flex-shrink: 0;
        width: 10px;
        min-height: 120px;
        border-radius: 5px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.95) 0%,
          var(--accent) 22%,
          rgba(var(--accent-rgb), 0.90) 78%,
          rgba(var(--accent-rgb), 0.30) 100%);
        box-shadow:
          0 0 12px rgba(var(--accent-rgb), 0.95),
          0 0 32px rgba(var(--accent-rgb), 0.60),
          0 0 72px rgba(var(--accent-rgb), 0.30);
        /* slides in from left: start off-screen */
        transform: translateX(-120px);
        opacity: 0;
      }

      /* Glass text panel — slides in from the right of the bar */
      #t2-lt-bslide .panel {
        padding: 22px 38px 20px 30px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        border: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        opacity: 0;
        transform: translateX(-30px);
      }

      #t2-lt-bslide .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 8px;
        white-space: nowrap;
      }

      #t2-lt-bslide .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
        white-space: nowrap;
      }

      /* Small accent pip on role */
      #t2-lt-bslide .role-pip {
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 9px rgba(var(--accent-rgb), 0.85);
        margin-right: 10px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-bslide"
         data-composition-id="t2-lt-bslide"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="anchor">
        <div class="bar"></div>
        <div class="panel">
          <div class="name" data-slot="name">Priya Nair</div>
          <div class="role">
            <span class="role-pip"></span>
            <span data-slot="role">AI Literacy Programme Director</span>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom blooms in */
      tl.from("#t2-lt-bslide .local-bloom",
        { autoAlpha: 0, scale: 0.65, duration: 1.1, ease: "power2.out" }, 0);

      /* bar slides in from left like a dart */
      tl.to("#t2-lt-bslide .bar",
        { x: 0, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 0.10);

      /* glass panel slides in tight behind the bar */
      tl.to("#t2-lt-bslide .panel",
        { x: 0, autoAlpha: 1, duration: 0.62, ease: "back.out(1.4)" }, 0.42);

      /* name reveals */
      tl.from("#t2-lt-bslide .name",
        { autoAlpha: 0, x: 20, filter: "blur(8px)",
          duration: 0.58, ease: "power4.out" }, 0.72);

      /* role reveals */
      tl.from("#t2-lt-bslide .role",
        { autoAlpha: 0, x: 14, filter: "blur(6px)",
          duration: 0.52, ease: "power3.out" }, 0.88);

      /* bar glow breathes — finite */
      tl.to("#t2-lt-bslide .bar",
        { boxShadow:
            "0 0 22px rgba(55,189,248,1.0), 0 0 55px rgba(55,189,248,0.70), 0 0 100px rgba(55,189,248,0.38)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.65);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-bslide"] = tl;
    </script>
  </body>
</html>
