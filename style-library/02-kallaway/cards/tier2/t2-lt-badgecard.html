<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · BADGECARD
  A circular avatar badge (initials inside a glowing ring) springs on first;
  a wide glass name card slides out to the right, revealing name and role.
  The initials glowing ring differentiates it from the photo-avatar card.
  Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-bcard {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-bcard .local-bloom {
        position: absolute;
        left: 40px; bottom: 80px;
        width: 580px; height: 230px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 35% 80%,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.10) 48%,
          transparent 72%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Row container */
      #t2-lt-bcard .row {
        position: absolute;
        left: 80px; bottom: 110px;
        display: flex;
        align-items: center;
        gap: 0;
        z-index: 2;
      }

      /* Circular badge with initials */
      #t2-lt-bcard .badge {
        width: 108px; height: 108px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
        z-index: 3;
        background: radial-gradient(circle at 38% 32%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(7, 18, 28, 0.88) 68%);
        box-shadow:
          0 0 0 2.5px var(--accent),
          0 0 22px rgba(var(--accent-rgb), 0.65),
          0 0 60px rgba(var(--accent-rgb), 0.30),
          inset 0 1px 0 rgba(255,255,255,0.18);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Top arc highlight on the badge */
      #t2-lt-bcard .badge::before {
        content: "";
        position: absolute;
        top: 6px; left: 6px; right: 6px;
        height: 34px;
        border-radius: 50% 50% 0 0;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.22) 0%,
          transparent 100%);
      }

      #t2-lt-bcard .initials {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 34px;
        letter-spacing: 0.02em;
        color: var(--white);
        text-shadow: var(--textglow-accent);
        line-height: 1;
        position: relative;
        z-index: 1;
      }

      /* Glass name/role card */
      #t2-lt-bcard .card {
        padding: 22px 38px 22px 44px;
        min-width: 360px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius) var(--radius) 0;
        border: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.45),
          0 0 18px rgba(var(--accent-rgb), 0.16),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      #t2-lt-bcard .card::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent 10%, rgba(255,255,255,0.50) 50%, transparent);
      }

      #t2-lt-bcard .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 7px;
        line-height: 1.1;
      }

      #t2-lt-bcard .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      /* Small accent line under name */
      #t2-lt-bcard .name-rule {
        width: 40px; height: 2px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.70);
        margin-bottom: 8px;
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-bcard"
         data-composition-id="t2-lt-bcard"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="row">
        <div class="badge">
          <div class="initials">JL</div>
        </div>
        <div class="card">
          <div class="name-rule"></div>
          <div class="name" data-slot="name">Jordan Lee</div>
          <div class="role" data-slot="role">Curriculum Director, AI Foundations</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-bcard";

      /* bloom swells in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.2, ease: "power2.out" }, 0);

      /* badge pops in with spring */
      tl.from(`${C} .badge`,
        { autoAlpha: 0, scale: 0.40, y: 24,
          transformOrigin: "center center",
          duration: 0.82, ease: "back.out(1.6)" }, 0.08);

      /* card slides out from behind badge */
      tl.from(`${C} .card`,
        { autoAlpha: 0, x: -60, filter: "blur(14px)",
          duration: 0.78, ease: "power4.out" }, 0.42);

      /* name-rule draws wide */
      tl.from(`${C} .name-rule`,
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.40, ease: "power3.out" }, 0.75);

      /* name glides in */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -16, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.82);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -12, filter: "blur(6px)",
          duration: 0.55, ease: "power3.out" }, 0.98);

      /* badge ring glow breathes — finite */
      tl.to(`${C} .badge`,
        { boxShadow:
            "0 0 0 2.5px rgba(55,189,248,1.00), 0 0 38px rgba(55,189,248,0.90), 0 0 88px rgba(55,189,248,0.48), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-bcard"] = tl;
    </script>
  </body>
</html>
