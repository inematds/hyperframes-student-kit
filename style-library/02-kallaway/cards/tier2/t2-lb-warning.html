<!doctype html>
<!--
  KALLAWAY · tier2 · label · WARNING
  A WARNING/alert label: red var(--alert) accent glow + warning glyph + term + detail.
  Anchored left side. Transparent overlay.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-warn {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized red glow — left side */
      #t2-lb-warn .local-glow {
        position: absolute; left: 40px; top: 290px;
        width: 600px; height: 440px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--alert-rgb), 0.18) 0%,
          rgba(var(--alert-rgb), 0.06) 50%,
          transparent 78%);
        filter: blur(46px);
        pointer-events: none;
      }

      /* Glass card anchored left — red-tinted border */
      #t2-lb-warn .card {
        position: absolute; left: 80px; top: 330px;
        width: 520px;
        background: rgba(16, 22, 34, 0.60);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid rgba(255, 59, 48, 0.30);
        border-top: 1.5px solid rgba(255, 59, 48, 0.50);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--alert-rgb), 0.10),
                    0 0 40px rgba(var(--alert-rgb), 0.12);
        border-radius: var(--radius);
        padding: 28px 34px 32px;
        overflow: hidden;
      }

      /* Top red neon rim */
      #t2-lb-warn .card::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--alert-rgb), 0.75) 38%,
          rgba(var(--alert-rgb), 0.75) 62%, transparent 100%);
        box-shadow: 0 0 12px rgba(var(--alert-rgb), 0.55);
      }

      /* Badge row */
      #t2-lb-warn .badge-row {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 18px;
      }

      /* Warning glyph — triangle */
      #t2-lb-warn .warn-glyph {
        width: 36px; height: 32px;
        flex-shrink: 0;
        position: relative;
      }
      #t2-lb-warn .warn-glyph::before {
        content: "";
        position: absolute; inset: 0;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        background: transparent;
        border: none;
        /* drawn with box approach: use an inner element instead */
      }
      /* SVG-style triangle via CSS border trick */
      #t2-lb-warn .warn-tri {
        width: 0; height: 0;
        border-left: 18px solid transparent;
        border-right: 18px solid transparent;
        border-bottom: 32px solid var(--alert);
        filter: drop-shadow(0 0 8px rgba(255,59,48,0.80))
                drop-shadow(0 0 20px rgba(255,59,48,0.40));
        position: relative;
      }
      #t2-lb-warn .warn-tri::after {
        content: "!";
        position: absolute; left: -5px; top: 7px;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 14px; color: var(--white); line-height: 1;
      }

      /* "WARNING" kicker label */
      #t2-lb-warn .warn-label {
        font-family: var(--font-body); font-weight: var(--wt-bold);
        font-size: 14px; letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--alert);
        text-shadow: 0 0 12px rgba(var(--alert-rgb), 0.70),
                     0 0 30px rgba(var(--alert-rgb), 0.35);
      }

      /* Term heading */
      #t2-lb-warn .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 38px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.15; margin-bottom: 14px;
      }

      /* Red accent rule */
      #t2-lb-warn .accent-rule {
        height: 2px; width: 100%;
        background: linear-gradient(90deg,
          var(--alert) 0%, rgba(var(--alert-rgb), 0.12) 100%);
        box-shadow: 0 0 7px rgba(var(--alert-rgb), 0.40);
        margin-bottom: 18px;
        transform-origin: left center;
      }

      /* Detail body */
      #t2-lb-warn .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 26px; line-height: 1.52;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-warn" data-composition-id="t2-lb-warn" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <div class="badge-row">
          <div class="warn-glyph"><div class="warn-tri"></div></div>
          <div class="warn-label">Warning</div>
        </div>
        <div class="term" data-slot="term">Hallucination Risk</div>
        <div class="accent-rule"></div>
        <div class="detail" data-slot="detail">Without grounding, the model will confidently fabricate citations, numbers, and product details that don't exist.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP = "#t2-lb-warn";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* card glides in from left + blur */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: -58, filter: "blur(14px)",
            duration: 0.88, ease: "back.out(1.4)" }, 0.18)

        /* badge row scales + fades */
        .from(`${COMP} .badge-row`, {
            autoAlpha: 0, scale: 0.72, transformOrigin: "0% 50%",
            filter: "blur(6px)",
            duration: 0.52, ease: "back.out(1.7)" }, 0.52)

        /* term glides + blur */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.78)

        /* red rule draws */
        .from(`${COMP} .accent-rule`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.50, ease: "power3.out" }, 1.02)

        /* detail fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.62, ease: "power3.out" }, 1.20)

        /* red glow pulse on glyph — finite */
        .to(`${COMP} .warn-tri`, {
            filter: "drop-shadow(0 0 16px rgba(255,59,48,0.95)) drop-shadow(0 0 40px rgba(255,59,48,0.50))",
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-warn"] = tl;
    </script>
  </body>
</html>
