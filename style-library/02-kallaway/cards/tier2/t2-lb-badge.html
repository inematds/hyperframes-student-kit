<!doctype html>
<!--
  KALLAWAY · tier2 · label · BADGE
  A glass chip containing a glowing outlined icon + term, with detail beneath.
  Anchored left side. Transparent overlay — only the chip paints.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-badge {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow behind badge — left side, contained */
      #t2-lb-badge .local-glow {
        position: absolute; left: 60px; top: 350px;
        width: 460px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(38px);
        pointer-events: none;
      }

      /* Outer wrapper — left anchored */
      #t2-lb-badge .wrapper {
        position: absolute; left: 80px; top: 380px;
        display: flex; flex-direction: column; gap: 14px;
      }

      /* Main glass chip containing icon + term */
      #t2-lb-badge .chip {
        display: inline-flex; align-items: center; gap: 18px;
        padding: 16px 28px 16px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.10);
        border-radius: var(--radius-sm);
        overflow: hidden;
        position: relative;
      }

      /* Top-edge neon rim on chip */
      #t2-lb-badge .chip::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.75) 35%,
          rgba(var(--accent-rgb), 0.75) 65%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.50);
      }

      /* Icon tile — glowing outlined circle with an SVG icon inside */
      #t2-lb-badge .icon-tile {
        width: 52px; height: 52px; border-radius: 14px;
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        background: rgba(var(--accent-rgb), 0.10);
        box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.32),
                    inset 0 1px 0 rgba(255,255,255,0.14);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      /* Icon SVG — lightning bolt */
      #t2-lb-badge .icon-tile svg {
        width: 26px; height: 26px;
        stroke: var(--accent);
        fill: none;
        stroke-width: 2;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.65));
      }

      /* Term text in chip */
      #t2-lb-badge .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 32px; letter-spacing: var(--track-tight);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Detail card beneath */
      #t2-lb-badge .detail-card {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        padding: 14px 22px;
        max-width: 460px;
      }

      #t2-lb-badge .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 23px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-badge" data-composition-id="t2-lb-badge" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="chip">
          <div class="icon-tile">
            <!-- lightning bolt icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
            </svg>
          </div>
          <div class="term" data-slot="term">Inference Speed</div>
        </div>

        <div class="detail-card">
          <div class="detail" data-slot="detail">Tokens per second at P95 — the number that actually determines product feel.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-badge";

      /* glow blooms in */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* icon tile pops in with spring */
        .from(`${COMP} .icon-tile`, {
            autoAlpha: 0, scale: 0.6, filter: "blur(10px)",
            duration: 0.65, ease: "back.out(1.4)" }, 0.25)

        /* chip glides in from left */
        .from(`${COMP} .chip`, {
            autoAlpha: 0, x: -44, filter: "blur(12px)",
            duration: 0.80, ease: "back.out(1.4)" }, 0.28)

        /* detail card glides up */
        .from(`${COMP} .detail-card`, {
            autoAlpha: 0, y: 20, filter: "blur(8px)",
            duration: 0.70, ease: "power4.out" }, 0.62)

        /* finite icon glow pulse */
        .to(`${COMP} .icon-tile`, {
            boxShadow: "0 0 34px rgba(55,189,248,0.62), inset 0 1px 0 rgba(255,255,255,0.18)",
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-badge"] = tl;
    </script>
  </body>
</html>
