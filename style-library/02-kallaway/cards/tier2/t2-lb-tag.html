<!doctype html>
<!--
  KALLAWAY · tier2 · label · TAG
  A small glowing pill/tag label (term) with a tiny detail line beneath.
  Anchored right side. Transparent overlay — only the pill paints.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-tag {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow behind tag — small, contained */
      #t2-lb-tag .local-glow {
        position: absolute; right: 140px; top: 400px;
        width: 400px; height: 240px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(36px);
        pointer-events: none;
      }

      /* Wrapper anchored right */
      #t2-lb-tag .wrapper {
        position: absolute; right: 140px; top: 440px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      }

      /* The glowing pill/tag */
      #t2-lb-tag .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 26px; border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.38),
                    inset 0 1px 0 rgba(255,255,255,0.16),
                    0 4px 18px rgba(0,0,0,0.45);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      /* Glowing dot inside pill */
      #t2-lb-tag .pill-dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      /* Term text */
      #t2-lb-tag .pill-term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 28px; letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Detail beneath — slim dark glass underlay */
      #t2-lb-tag .detail-wrap {
        padding: 8px 18px 8px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 440px;
      }

      #t2-lb-tag .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 22px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-tag" data-composition-id="t2-lb-tag" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="pill">
          <div class="pill-dot"></div>
          <div class="pill-term" data-slot="term">Model Collapse</div>
        </div>
        <div class="detail-wrap">
          <div class="detail" data-slot="detail">When training data becomes self-referential and the model drifts from reality.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-tag";

      /* glow blooms in first */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.2, ease: "expo.out" }, 0)

        /* pill springs in from right with blur */
        .from(`${COMP} .pill`, {
            autoAlpha: 0, x: 40, filter: "blur(10px)",
            duration: 0.72, ease: "back.out(1.4)" }, 0.22)

        /* detail glides up from below */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 18, filter: "blur(8px)",
            duration: 0.68, ease: "power4.out" }, 0.52)

        /* finite glow pulse on pill border */
        .to(`${COMP} .pill`, {
            boxShadow: "0 0 38px rgba(55,189,248,0.62), inset 0 1px 0 rgba(255,255,255,0.20), 0 4px 18px rgba(0,0,0,0.45)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80)

        .set({}, {}, 7);

      window.__timelines["t2-lb-tag"] = tl;
    </script>
  </body>
</html>
