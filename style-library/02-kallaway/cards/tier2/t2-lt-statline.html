<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · STATLINE
  A name card with an inline glowing stat chip at the right end. The chip shows
  a metric in mono type inside a bright neon-rimmed capsule, separated from the
  name by a thin accent rule. The chip number counts up from zero to the target.
  Sits over live footage — only the component paints.
  Slots: name (~26 chars), stat (~8 chars, e.g. "4.9M", "87%", "$2.4B").
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-sline {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-sline .local-bloom {
        position: absolute;
        left: 45px; bottom: 92px;
        width: 640px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 45% 78%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Main row */
      #t2-lt-sline .row {
        position: absolute;
        left: 80px; bottom: 130px;
        display: flex;
        align-items: center;
        gap: 0;
        z-index: 2;
      }

      /* Name block — dark glass */
      #t2-lt-sline .name-block {
        padding: 20px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius) 0 0 var(--radius);
        border: var(--stroke) solid var(--glass-border);
        border-right: none;
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      /* Highlight strip */
      #t2-lt-sline .name-block::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 50%, transparent);
      }

      #t2-lt-sline .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        line-height: 1.0;
      }

      /* Thin vertical separator between name block and stat chip */
      #t2-lt-sline .sep {
        width: 2px; height: 48px;
        background: linear-gradient(180deg,
          transparent,
          rgba(var(--accent-rgb), 0.65) 30%,
          rgba(var(--accent-rgb), 0.65) 70%,
          transparent);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.70);
        flex-shrink: 0;
        align-self: center;
      }

      /* Stat chip — bright accent neon capsule */
      #t2-lt-sline .stat-chip {
        padding: 20px 26px;
        background: rgba(var(--accent-rgb), 0.10);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius) var(--radius) 0;
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.60);
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.22),
          0 0 22px rgba(var(--accent-rgb), 0.38),
          var(--glass-shadow),
          inset 0 1px 0 rgba(255,255,255,0.16);
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
        overflow: hidden;
      }

      /* Small label above the number */
      #t2-lt-sline .stat-chip::before {
        content: "";
        position: absolute; top: 0; left: 8px; right: 8px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.55) 50%, transparent);
      }

      /* The actual stat value */
      #t2-lt-sline .stat-val {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 38px;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      /* Glowing micro dot beside number */
      #t2-lt-sline .stat-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-sline"
         data-composition-id="t2-lt-sline"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="row">
        <div class="name-block">
          <div class="name" data-slot="name">Jordan Lee</div>
        </div>
        <div class="sep"></div>
        <div class="stat-chip">
          <div class="stat-dot"></div>
          <div class="stat-val" id="sline-stat" data-slot="stat">87%</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-sline";

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.1, ease: "power2.out" }, 0);

      /* name block slides in from left */
      tl.from(`${C} .name-block`,
        { autoAlpha: 0, x: -32, scale: 0.94,
          filter: "blur(10px)", transformOrigin: "left center",
          duration: 0.78, ease: "back.out(1.4)" }, 0.10);

      /* name text glides */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.58, ease: "power4.out" }, 0.56);

      /* separator draws in vertically */
      tl.from(`${C} .sep`,
        { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 50%",
          duration: 0.28, ease: "power2.out" }, 0.74);

      /* stat chip springs in from right */
      tl.from(`${C} .stat-chip`,
        { autoAlpha: 0, x: 24, scale: 0.90,
          filter: "blur(10px)", transformOrigin: "left center",
          duration: 0.65, ease: "back.out(1.4)" }, 0.82);

      /* stat number counts up — read placeholder value as target string */
      /* Using a fixed numeric target of 87 for the default "87%" slot */
      const statEl = document.getElementById("sline-stat");
      const suffix = "%";
      tl.to({ val: 0 }, {
        val: 87, duration: 1.2, ease: "power2.out",
        onUpdate: function() {
          const v = this.targets()[0].val;
          if (statEl) statEl.textContent = Math.round(v) + suffix;
        }
      }, 0.88);

      /* stat chip glow pulse — finite */
      tl.to(`${C} .stat-chip`, {
        boxShadow:
          "0 0 0 1px rgba(55,189,248,0.45), 0 0 36px rgba(55,189,248,0.62), 0 24px 70px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.22)",
        borderColor: "rgba(55,189,248,0.90)",
        duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-sline"] = tl;
    </script>
  </body>
</html>
