<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · GRADIENTBAR
  A gradient-glow horizontal bar (accent → transparent) as the backing,
  with name/role text floating over it. No hard card box — the bar IS
  the surface. A thin accent edge line runs across the top of the bar.
  Sits over live speaker footage — fully transparent background.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-gbar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Bar container — positioned lower-left */
      #t2-lt-gbar .bar-wrap {
        position: absolute;
        left: 0; bottom: 120px;
        width: 900px;
        z-index: 2;
      }

      /* Thin accent top edge line */
      #t2-lt-gbar .edge-line {
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.90) 0%,
          rgba(var(--accent-rgb), 0.55) 30%,
          rgba(var(--accent-rgb), 0.10) 70%,
          transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.55), 0 0 28px rgba(var(--accent-rgb), 0.25);
        margin-bottom: 0;
      }

      /* Main gradient bar */
      #t2-lt-gbar .bar {
        padding: 22px 80px 24px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(16, 22, 34, 0.70) 32%,
          rgba(16, 22, 34, 0.35) 65%,
          transparent 100%);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        display: flex;
        flex-direction: column;
        gap: 7px;
        /* no border-radius: bar bleeds to screen-left */
      }

      /* Left accent stripe — a glowing vertical edge */
      #t2-lt-gbar .bar::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.95) 0%,
          rgba(var(--accent-rgb), 0.50) 55%,
          rgba(var(--accent-rgb), 0.10) 100%);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.70), 0 0 32px rgba(var(--accent-rgb), 0.35);
        pointer-events: none;
      }

      /* Soft bloom specifically behind the left-anchor text */
      #t2-lt-gbar .local-bloom {
        position: absolute;
        left: -40px; bottom: 100px;
        width: 480px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 76%);
        filter: blur(30px);
        pointer-events: none;
        z-index: 1;
      }

      #t2-lt-gbar .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 40px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
      }

      /* Gradient glow text treatment on the name */
      #t2-lt-gbar .name .gradient-text {
        background: linear-gradient(90deg, #ffffff 0%, var(--accent) 80%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 12px rgba(55,189,248,0.50));
      }

      #t2-lt-gbar .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.025em;
        color: var(--text-dim);
        line-height: 1.3;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #t2-lt-gbar .role-dot {
        flex-shrink: 0;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-gbar"
         data-composition-id="t2-lt-gbar"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="bar-wrap">
        <div class="edge-line"></div>
        <div class="bar">
          <div class="name" data-slot="name">
            <span class="gradient-text">Ronny Mitchell</span>
          </div>
          <div class="role">
            <span class="role-dot"></span>
            <span data-slot="role">Head of Content Strategy</span>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom fades in */
      tl.from("#t2-lt-gbar .local-bloom",
        { autoAlpha: 0, scale: 0.75, duration: 1.2, ease: "power2.out" }, 0);

      /* edge line draws left→right */
      tl.from("#t2-lt-gbar .edge-line",
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.70, ease: "power4.out" }, 0.05);

      /* bar wipes in from left */
      tl.from("#t2-lt-gbar .bar",
        { autoAlpha: 0, x: -60, filter: "blur(10px)",
          duration: 0.75, ease: "power4.out" }, 0.18);

      /* name glides in */
      tl.from("#t2-lt-gbar .name",
        { autoAlpha: 0, x: -24, filter: "blur(8px)",
          duration: 0.65, ease: "power4.out" }, 0.58);

      /* role follows */
      tl.from("#t2-lt-gbar .role",
        { autoAlpha: 0, x: -16, filter: "blur(6px)",
          duration: 0.60, ease: "power3.out" }, 0.74);

      /* accent dot pulses */
      tl.to("#t2-lt-gbar .role-dot",
        { boxShadow: "0 0 16px rgba(55,189,248,0.95), 0 0 32px rgba(55,189,248,0.50)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.5);

      /* edge line glow pulses */
      tl.to("#t2-lt-gbar .edge-line",
        { boxShadow: "0 0 18px rgba(55,189,248,0.80), 0 0 44px rgba(55,189,248,0.38)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.65);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-gbar"] = tl;
    </script>
  </body>
</html>
