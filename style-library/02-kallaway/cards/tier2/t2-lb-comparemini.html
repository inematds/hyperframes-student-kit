<!doctype html>
<!--
  KALLAWAY · tier2 · label · COMPARE MINI (A vs B)
  Two values/labels split by a glowing vertical divider that lights up on entry.
  `term` = left side (A), `detail` = right side (B). Left side anchor.
  Slots: term (~18 chars — left value + label), detail (~18 chars — right value + label).
  Convention: encode as "VALUE|LABEL" — the card splits on the pipe character.
  If no pipe found, the whole string is treated as the value with no sub-label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-cmp {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — left side */
      #t2-lb-cmp .local-glow {
        position: absolute; left: 40px; top: 390px;
        width: 500px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 76%);
        filter: blur(38px);
        pointer-events: none;
      }

      /* Chip — left anchor */
      #t2-lb-cmp .chip {
        position: absolute; left: 80px; top: 420px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 28px rgba(var(--accent-rgb), 0.20),
                    inset 0 0 0 1px rgba(var(--accent-rgb), 0.08);
        border-radius: var(--radius-sm);
        padding: 26px 0;
        display: flex; align-items: stretch;
        min-width: 440px;
        overflow: hidden;
      }

      /* Top neon rim */
      #t2-lb-cmp .chip::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 1.5px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.75) 50%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.50);
      }

      /* Each half */
      #t2-lb-cmp .half {
        flex: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 0 30px; gap: 6px;
      }

      /* Values — Space Mono gradient */
      #t2-lb-cmp .val {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 44px; letter-spacing: -0.02em; line-height: 1.0;
        display: block; text-align: center;
      }

      /* Left value — accent gradient */
      #t2-lb-cmp .half-a .val {
        background: linear-gradient(110deg, #FFFFFF 0%, var(--accent) 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.55));
      }

      /* Right value — dimmer, white-ish */
      #t2-lb-cmp .half-b .val {
        color: var(--text-dim);
        text-shadow: 0 0 14px rgba(255,255,255,0.20);
      }

      /* Sub-label */
      #t2-lb-cmp .sub {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase;
        color: var(--text-faint); text-align: center;
        line-height: 1.3;
      }

      /* Glowing vertical divider */
      #t2-lb-cmp .divider {
        width: 1.5px; flex-shrink: 0;
        background: linear-gradient(180deg,
          transparent 0%, var(--accent) 30%, var(--accent) 70%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.60);
        transform-origin: 50% 50%;
        /* scaleY animated in */
      }

      /* "VS" label centered on divider */
      #t2-lb-cmp .vs-badge {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        font-family: var(--font-mono); font-weight: 700;
        font-size: 13px; letter-spacing: 0.10em; color: var(--accent);
        background: rgba(16, 22, 34, 0.80);
        padding: 3px 7px; border-radius: 4px;
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.40);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-cmp" data-composition-id="t2-lb-cmp" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="chip">
        <!-- Left half (term) -->
        <div class="half half-a">
          <span class="val val-a" data-slot-part="term-value">2.4x</span>
          <span class="sub sub-a" data-slot-part="term-label">With AI</span>
        </div>

        <!-- Divider -->
        <div class="divider" style="position:relative;">
          <div class="vs-badge">VS</div>
        </div>

        <!-- Right half (detail) -->
        <div class="half half-b">
          <span class="val val-b" data-slot-part="detail-value">1.0x</span>
          <span class="sub sub-b" data-slot-part="detail-label">Without AI</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-cmp";

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* chip glides in from left */
        .from(`${COMP} .chip`, {
            autoAlpha: 0, x: -52, filter: "blur(12px)",
            duration: 0.78, ease: "back.out(1.4)" }, 0.18)

        /* divider draws scaleY 0→1 */
        .from(`${COMP} .divider`, {
            scaleY: 0, transformOrigin: "50% 50%",
            duration: 0.40, ease: "power3.out" }, 0.54)

        /* VS badge pops */
        .from(`${COMP} .vs-badge`, {
            autoAlpha: 0, scale: 0.6,
            duration: 0.28, ease: "back.out(2.5)" }, 0.82)

        /* left value (hero) fades down from above */
        .from(`${COMP} .val-a`, {
            autoAlpha: 0, y: -16, filter: "blur(12px)",
            duration: 0.52, ease: "power4.out" }, 0.62)

        .from(`${COMP} .sub-a`, {
            autoAlpha: 0, y: 6,
            duration: 0.35, ease: "power2.out" }, 0.86)

        /* right value — slightly delayed, softer */
        .from(`${COMP} .val-b`, {
            autoAlpha: 0, y: -16, filter: "blur(10px)",
            duration: 0.52, ease: "power4.out" }, 0.76)

        .from(`${COMP} .sub-b`, {
            autoAlpha: 0, y: 6,
            duration: 0.35, ease: "power2.out" }, 1.00)

        /* divider glow pulse — finite */
        .to(`${COMP} .divider`, {
            boxShadow: "0 0 18px rgba(55,189,248,0.80)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-cmp"] = tl;
    </script>
  </body>
</html>
