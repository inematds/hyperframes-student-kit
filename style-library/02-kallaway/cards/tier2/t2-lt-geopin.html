<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · GEOPIN
  An animated GPS drop-pin icon falls from above and sticks with a spring
  bounce; a frosted pill below it reveals the place name and coordinate line.
  The pin glows blue. Distinct from other lower-thirds: vertical entry axis,
  icon-first storytelling, mono coords.
  Slots: place (~28 chars), coords (~22 chars, e.g. "37.7749° N, 122.4194° W").
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-geo {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Bloom pools on the ground beneath the pin */
      #t2-lt-geo .local-bloom {
        position: absolute;
        left: 66px; bottom: 88px;
        width: 460px; height: 220px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 28% 85%,
          rgba(var(--accent-rgb), 0.34) 0%,
          rgba(var(--accent-rgb), 0.10) 50%,
          transparent 74%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 1;
      }

      /* Component stacks vertically: pin → pill */
      #t2-lt-geo .stack {
        position: absolute;
        left: 80px; bottom: 108px;
        display: flex; flex-direction: column;
        align-items: flex-start; gap: 0;
        z-index: 2;
      }

      /* PIN icon wrapper */
      #t2-lt-geo .pin-wrap {
        margin-left: 14px; /* center pin over pill text area */
        margin-bottom: -2px;
      }

      #t2-lt-geo .pin-svg {
        width: 44px; height: 58px;
        filter: drop-shadow(0 0 10px rgba(55,189,248,0.80))
                drop-shadow(0 0 24px rgba(55,189,248,0.45));
      }

      /* Shadow dot under the pin when it lands */
      #t2-lt-geo .pin-shadow {
        width: 28px; height: 8px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(0,0,0,0.55) 0%, transparent 75%);
        margin: 0 auto;
        transform: scaleX(0);
      }

      /* Frosted pill containing place + coords */
      #t2-lt-geo .pill {
        padding: 18px 36px 16px 24px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow: var(--glass-shadow),
                    0 0 0 1.5px rgba(var(--accent-rgb), 0.42),
                    inset 0 1px 0 var(--glass-hi);
        position: relative; overflow: hidden;
        min-width: 320px;
      }

      #t2-lt-geo .pill::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 40%, rgba(255,255,255,0.48) 60%, transparent);
      }

      #t2-lt-geo .place {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 6px;
        white-space: nowrap;
      }

      #t2-lt-geo .coords {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: var(--wt-reg);
        letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-geo"
         data-composition-id="t2-lt-geo"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stack">

        <div class="pin-wrap">
          <!-- GPS drop-pin SVG -->
          <svg class="pin-svg" viewBox="0 0 44 58" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2C12.06 2 4 10.06 4 20c0 14.4 18 36 18 36s18-21.6 18-36C40 10.06 31.94 2 22 2z"
                  fill="rgba(55,189,248,0.22)"
                  stroke="#37BDF8" stroke-width="2.5"/>
            <circle cx="22" cy="20" r="6"
                    fill="#37BDF8"
                    filter="url(#pin-glow)"/>
            <defs>
              <filter id="pin-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
          </svg>
          <div class="pin-shadow"></div>
        </div>

        <div class="pill">
          <div class="place" data-slot="place">San Francisco, CA</div>
          <div class="coords" data-slot="coords">37.7749° N, 122.4194° W</div>
        </div>

      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom pools in */
      tl.from("#t2-lt-geo .local-bloom",
        { autoAlpha: 0, scale: 0.65, duration: 1.2, ease: "power2.out" }, 0);

      /* pin drops from above and bounces */
      tl.from("#t2-lt-geo .pin-wrap",
        { autoAlpha: 0, y: -80,
          duration: 0.62, ease: "bounce.out" }, 0.10);

      /* shadow squishes in when pin lands */
      tl.to("#t2-lt-geo .pin-shadow",
        { scaleX: 1, autoAlpha: 1,
          duration: 0.22, ease: "power2.out" }, 0.64);

      /* pill springs up from below */
      tl.from("#t2-lt-geo .pill",
        { autoAlpha: 0, y: 20, scale: 0.95,
          filter: "blur(10px)", transformOrigin: "left bottom",
          duration: 0.65, ease: "back.out(1.4)" }, 0.55);

      /* place name glides */
      tl.from("#t2-lt-geo .place",
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.58, ease: "power4.out" }, 0.88);

      /* coords type-reveal: scaleX from left */
      tl.from("#t2-lt-geo .coords",
        { autoAlpha: 0, x: -12, duration: 0.50, ease: "power3.out" }, 1.02);

      /* pin glow breathes — finite */
      tl.to("#t2-lt-geo .pin-svg",
        { filter:
            "drop-shadow(0 0 18px rgba(55,189,248,1.0)) drop-shadow(0 0 40px rgba(55,189,248,0.55))",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-geo"] = tl;
    </script>
  </body>
</html>
