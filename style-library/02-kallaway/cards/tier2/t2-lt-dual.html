<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · DUAL
  Two-person interview lower-third: two stacked glass name/role blocks.
  Both cards spring in staggered from lower-left; each row glows its own
  subtle accent rim. Sits over live speaker footage — fully transparent
  background, only the cards paint.
  Slots: name, role, name2, role2.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-dual {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind both cards */
      #t2-lt-dual .local-bloom {
        position: absolute;
        left: 50px; bottom: 90px;
        width: 560px; height: 320px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 85%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 76%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 1;
      }

      /* Stack container */
      #t2-lt-dual .stack {
        position: absolute;
        left: 80px; bottom: 110px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        z-index: 2;
      }

      /* Shared card chrome */
      #t2-lt-dual .card {
        width: 480px;
        padding: 20px 32px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.48),
          0 0 18px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        position: relative;
      }

      /* Hairline top shimmer */
      #t2-lt-dual .card::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
        border-radius: 1px;
      }

      /* Thin accent left-bar distinguishes card1 vs card2 */
      #t2-lt-dual .card-2::after {
        content: "";
        position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
        background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.90), rgba(var(--accent-rgb), 0.35));
        border-radius: 2px;
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.70);
      }

      /* Row layout within card */
      #t2-lt-dual .row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      /* Numbered badge */
      #t2-lt-dual .badge {
        flex-shrink: 0;
        width: 30px; height: 30px;
        border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.18);
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.50);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--accent);
        line-height: 1;
      }

      #t2-lt-dual .text-block {
        display: flex; flex-direction: column; gap: 4px;
      }

      #t2-lt-dual .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 28px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
      }

      #t2-lt-dual .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 18px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      #t2-lt-dual .role::before {
        content: "";
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 7px rgba(var(--accent-rgb), 0.80);
        margin-right: 8px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-dual"
         data-composition-id="t2-lt-dual"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stack">
        <!-- Card 1 -->
        <div class="card card-1">
          <div class="row">
            <div class="badge">1</div>
            <div class="text-block">
              <div class="name" data-slot="name">Ronny Mitchell</div>
              <div class="role" data-slot="role">Head of Content Strategy</div>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="card card-2">
          <div class="row">
            <div class="badge">2</div>
            <div class="text-block">
              <div class="name" data-slot="name2">Sarah Chen</div>
              <div class="role" data-slot="role2">Lead Creative Director</div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom rises */
      tl.from("#t2-lt-dual .local-bloom",
        { autoAlpha: 0, scale: 0.75, duration: 1.2, ease: "power2.out" }, 0);

      /* card 1 springs in */
      tl.from("#t2-lt-dual .card-1",
        { autoAlpha: 0, x: -44, y: 20, scale: 0.92,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.80, ease: "back.out(1.4)" }, 0.10);

      /* card 2 springs in, slightly staggered */
      tl.from("#t2-lt-dual .card-2",
        { autoAlpha: 0, x: -44, y: 20, scale: 0.92,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.80, ease: "back.out(1.4)" }, 0.26);

      /* name 1 glides in */
      tl.from("#t2-lt-dual .card-1 .name",
        { autoAlpha: 0, x: -18, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.58);

      /* role 1 follows */
      tl.from("#t2-lt-dual .card-1 .role",
        { autoAlpha: 0, x: -12, filter: "blur(6px)",
          duration: 0.55, ease: "power3.out" }, 0.74);

      /* name 2 glides in */
      tl.from("#t2-lt-dual .card-2 .name",
        { autoAlpha: 0, x: -18, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.72);

      /* role 2 follows */
      tl.from("#t2-lt-dual .card-2 .role",
        { autoAlpha: 0, x: -12, filter: "blur(6px)",
          duration: 0.55, ease: "power3.out" }, 0.88);

      /* gentle glow pulse across both cards — finite */
      tl.to("#t2-lt-dual .card-1",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.88), 0 0 30px rgba(55,189,248,0.34), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      tl.to("#t2-lt-dual .card-2",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.88), 0 0 30px rgba(55,189,248,0.34), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.94);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-dual"] = tl;
    </script>
  </body>
</html>
