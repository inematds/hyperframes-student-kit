<!doctype html>
<!--
  KALLAWAY · tier2 · label · QMARK
  A large glowing quotation-mark glyph dominates the left, with a short quote
  phrase beside it in glass. The quote mark is the sole decorative element —
  clean, typographic, high contrast. Anchored left side over footage.
  Slots: term (the short phrase ~40 chars), detail (~80 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-qmk {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Soft glow bloom anchored left-mid */
      #t2-lb-qmk .local-glow {
        position: absolute; left: 60px; top: 280px;
        width: 600px; height: 420px; border-radius: 50%;
        background: radial-gradient(ellipse at 28% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(50px);
        pointer-events: none;
        z-index: 0;
      }

      /* Component wrapper */
      #t2-lb-qmk .wrapper {
        position: absolute; left: 100px; top: 330px;
        display: flex; flex-direction: row; align-items: flex-start; gap: 28px;
        z-index: 2;
        max-width: 720px;
      }

      /* The big quote mark */
      #t2-lb-qmk .qmark {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 160px;
        line-height: 0.8;
        color: var(--accent);
        text-shadow: var(--textglow-accent),
          0 0 80px rgba(var(--accent-rgb), 0.45);
        flex-shrink: 0;
        user-select: none;
        letter-spacing: -0.04em;
      }

      /* Quote text block */
      #t2-lb-qmk .quote-block {
        display: flex; flex-direction: column; gap: 10px;
        padding-top: 24px; /* align with cap height of quote mark */
      }

      /* The main quote phrase */
      #t2-lb-qmk .term {
        font-family: var(--font-display);
        font-weight: var(--wt-semi);
        font-style: italic;
        font-size: 34px;
        line-height: 1.28;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
      }

      /* Glass detail backing */
      #t2-lb-qmk .detail-wrap {
        padding: 10px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-left: 2px solid var(--accent);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        box-shadow: var(--glass-shadow), 0 0 16px rgba(var(--accent-rgb), 0.12);
        position: relative; overflow: hidden;
      }

      #t2-lb-qmk .detail-wrap::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb),0.50), rgba(255,255,255,0.25) 60%, transparent);
      }

      #t2-lb-qmk .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 20px;
        line-height: 1.50;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-qmk"
         data-composition-id="t2-lb-qmk"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <!-- Opening curly quote mark — decorative glyph -->
        <div class="qmark" aria-hidden="true">&#8220;</div>

        <div class="quote-block">
          <div class="term" data-slot="term">The model doesn't know what it doesn't know.</div>
          <div class="detail-wrap">
            <div class="detail" data-slot="detail">AI hallucinations stem from confident gaps — the model fills the unknown with plausible-sounding fabrications.</div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-qmk";

      /* Bloom builds */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
          duration: 1.3, ease: "power2.out" }, 0)

        /* Quote mark drops in with blur focus pull — no drop-shadow CSS on it, safe to blur */
        .from(`${C} .qmark`,
          { autoAlpha: 0, y: -28, scale: 1.15, filter: "blur(18px)",
            transformOrigin: "center top",
            duration: 0.85, ease: "power4.out" }, 0.18)

        /* Term phrase glides right */
        .from(`${C} .term`,
          { autoAlpha: 0, x: -22, filter: "blur(9px)",
            duration: 0.72, ease: "power4.out" }, 0.60)

        /* Detail slides up */
        .from(`${C} .detail-wrap`,
          { autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.65, ease: "power3.out" }, 0.85)

        /* Quote mark glow breathes — finite */
        .to(`${C} .qmark`,
          { textShadow: "0 0 28px rgba(55,189,248,0.90), 0 0 100px rgba(55,189,248,0.50)",
            duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-qmk"] = tl;
    </script>
  </body>
</html>
