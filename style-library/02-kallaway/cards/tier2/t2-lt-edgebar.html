<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · EDGEBAR
  A vertical neon blue edge bar glows to the left of name and role on a subtle
  dark glass strip. The bar draws in from bottom to top; the text slides in from
  the right. Transparent background — only the strip paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-edge {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom anchored to the bar */
      #t2-lt-edge .local-bloom {
        position: absolute;
        left: 52px; bottom: 108px;
        width: 380px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 8% 60%,
          rgba(var(--accent-rgb), 0.32) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 72%);
        filter: blur(28px);
        pointer-events: none;
        z-index: 1;
      }

      /* The whole strip */
      #t2-lt-edge .strip {
        position: absolute;
        left: 80px; bottom: 130px;
        display: flex; align-items: center;
        gap: 0;
        padding: 18px 32px 18px 0;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        border: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      /* Vertical neon edge bar on the left */
      #t2-lt-edge .bar {
        width: 5px;
        height: 100%;
        min-height: 88px;
        align-self: stretch;
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.0) 0%,
          rgba(var(--accent-rgb), 1.0) 20%,
          var(--accent) 75%,
          rgba(var(--accent-rgb), 0.5) 100%);
        box-shadow:
          0 0 10px rgba(var(--accent-rgb), 0.90),
          0 0 24px rgba(var(--accent-rgb), 0.55),
          0 0 50px rgba(var(--accent-rgb), 0.28);
        border-radius: 3px;
        flex-shrink: 0;
        margin-right: 24px;
        /* clip-path is animated by GSAP for draw-in */
        clip-path: inset(100% 0 0 0);
      }

      #t2-lt-edge .text-block {
        display: flex; flex-direction: column; gap: 7px;
      }

      #t2-lt-edge .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }

      #t2-lt-edge .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        color: var(--text-dim);
        letter-spacing: 0.01em;
        line-height: 1.3;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-edge"
         data-composition-id="t2-lt-edge"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="strip">
        <div class="bar"></div>
        <div class="text-block">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom eases in */
      tl.from("#t2-lt-edge .local-bloom",
        { autoAlpha: 0, scale: 0.6, duration: 1.0, ease: "power2.out" }, 0);

      /* strip slides in from the left */
      tl.from("#t2-lt-edge .strip",
        { autoAlpha: 0, x: -56, filter: "blur(10px)",
          duration: 0.80, ease: "back.out(1.4)" }, 0.05);

      /* neon bar draws up (clip-path reveal bottom-to-top) */
      tl.to("#t2-lt-edge .bar",
        { clipPath: "inset(0% 0 0 0)", duration: 0.55, ease: "power3.out" }, 0.50);

      /* name slides in */
      tl.from("#t2-lt-edge .name",
        { autoAlpha: 0, x: 18, filter: "blur(7px)",
          duration: 0.58, ease: "power4.out" }, 0.68);

      /* role follows */
      tl.from("#t2-lt-edge .role",
        { autoAlpha: 0, x: 14, filter: "blur(5px)",
          duration: 0.52, ease: "power3.out" }, 0.84);

      /* bar glow pulse — finite */
      tl.to("#t2-lt-edge .bar",
        { boxShadow: "0 0 18px rgba(55,189,248,1.0), 0 0 42px rgba(55,189,248,0.70), 0 0 80px rgba(55,189,248,0.38)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-edge"] = tl;
    </script>
  </body>
</html>
