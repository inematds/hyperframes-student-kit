<!doctype html>
<!--
  KALLAWAY · tier2 · label · COORD
  A monospace coordinate readout chip — displays an X/Y pair in the "interface"
  typeface (Space Mono) with a bracket-style glassmorphism frame. A small
  crosshair pip sits left, the term label below. Anchored left side.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-coord {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-mono);
      }

      /* Local glow */
      #t2-lb-coord .local-glow {
        position: absolute; left: 80px; top: 360px;
        width: 500px; height: 260px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
      }

      /* Outer bracket wrapper */
      #t2-lb-coord .bracket-outer {
        position: absolute; left: 80px; top: 390px;
        width: 560px;
      }

      /* Corner bracket SVG ornament */
      #t2-lb-coord .bracket-svg {
        position: absolute; top: -12px; left: -12px;
        width: 580px; height: 220px;
        overflow: visible; pointer-events: none;
      }

      #t2-lb-coord .bk-line {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.50);
        stroke-width: 1.5px;
        stroke-linecap: round;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.55));
      }

      /* Coord chip — main glassmorphism panel */
      #t2-lb-coord .coord-chip {
        position: relative;
        padding: 18px 28px 14px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid rgba(var(--accent-rgb), 0.38);
        border-radius: 6px;
        box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.22),
                    inset 0 1px 0 rgba(255,255,255,0.14),
                    var(--glass-shadow);
        overflow: hidden;
      }

      /* Top highlight strip */
      #t2-lb-coord .coord-chip::before {
        content: "";
        position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      /* Row inside coord chip */
      #t2-lb-coord .coord-row {
        display: flex; align-items: center; gap: 18px;
      }

      /* Small crosshair pip */
      #t2-lb-coord .pip-svg {
        width: 28px; height: 28px; flex-shrink: 0; overflow: visible;
      }

      #t2-lb-coord .pip-line {
        stroke: var(--accent); stroke-width: 1.5px; stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.80));
      }

      #t2-lb-coord .pip-dot {
        fill: var(--accent);
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.90));
      }

      /* Coordinate values */
      #t2-lb-coord .coord-vals {
        display: flex; gap: 24px;
      }

      #t2-lb-coord .coord-pair {
        display: flex; flex-direction: column; gap: 2px;
      }

      #t2-lb-coord .coord-axis {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 13px; letter-spacing: var(--track-wide);
        color: var(--accent); text-transform: uppercase;
        text-shadow: var(--textglow-accent);
      }

      #t2-lb-coord .coord-val {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: 32px; letter-spacing: 0.04em;
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.0;
      }

      /* Divider */
      #t2-lb-coord .coord-divider {
        width: 1px; background: rgba(var(--accent-rgb), 0.30);
        align-self: stretch;
      }

      /* Term label below chip */
      #t2-lb-coord .term-wrap {
        position: absolute; left: 80px; top: 530px;
        display: flex; align-items: center; gap: 12px;
      }

      #t2-lb-coord .term-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      #t2-lb-coord .term-text {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 22px; letter-spacing: var(--track-wide);
        color: var(--text-dim); text-transform: uppercase;
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Detail strip */
      #t2-lb-coord .detail-wrap {
        position: absolute; left: 80px; top: 574px;
        padding: 8px 18px 8px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 480px;
      }

      #t2-lb-coord .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 22px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-coord" data-composition-id="t2-lb-coord" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <!-- Corner bracket SVG ornament (top-left + bottom-right corners) -->
      <svg class="bracket-svg" viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
        <!-- Top-left corner bracket -->
        <polyline id="t2-lb-coord-bk-tl" class="bk-line" points="0,30 0,0 30,0" />
        <!-- Bottom-right corner bracket -->
        <polyline id="t2-lb-coord-bk-br" class="bk-line" points="550,190 580,190 580,220" />
        <!-- Top-right tick -->
        <line id="t2-lb-coord-bk-tr" class="bk-line" x1="560" y1="0" x2="580" y2="0" />
        <!-- Bottom-left tick -->
        <line id="t2-lb-coord-bk-bl" class="bk-line" x1="0" y1="210" x2="0" y2="220" />
      </svg>

      <div class="bracket-outer">
        <div class="coord-chip">
          <div class="coord-row">
            <!-- Mini crosshair pip -->
            <svg class="pip-svg" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
              <line class="pip-line" x1="14" y1="2"  x2="14" y2="10" />
              <line class="pip-line" x1="14" y1="18" x2="14" y2="26" />
              <line class="pip-line" x1="2"  y1="14" x2="10" y2="14" />
              <line class="pip-line" x1="18" y1="14" x2="26" y2="14" />
              <circle class="pip-dot" cx="14" cy="14" r="2.5" />
            </svg>

            <div class="coord-vals">
              <div class="coord-pair">
                <div class="coord-axis">X</div>
                <div class="coord-val">48.72°N</div>
              </div>
              <div class="coord-divider"></div>
              <div class="coord-pair">
                <div class="coord-axis">Y</div>
                <div class="coord-val">2.35°E</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="term-wrap">
        <div class="term-dot"></div>
        <div class="term-text" data-slot="term">Training Data Source</div>
      </div>

      <div class="detail-wrap">
        <div class="detail-text" data-slot="detail">Geographic and temporal metadata embedded in the dataset — influences model world-knowledge biases.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-coord";

      /* Local glow */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "40% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Corner brackets draw in */
        .from(`${COMP} #t2-lb-coord-bk-tl`, {
            autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 0.10)
        .from(`${COMP} #t2-lb-coord-bk-br`, {
            autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 0.18)
        .from(`${COMP} #t2-lb-coord-bk-tr, ${COMP} #t2-lb-coord-bk-bl`, {
            autoAlpha: 0, duration: 0.3, ease: "power2.out" }, 0.26)

        /* Chip springs in from left */
        .from(`${COMP} .coord-chip`, {
            autoAlpha: 0, x: -30, filter: "blur(12px)",
            duration: 0.75, ease: "back.out(1.4)" }, 0.30)

        /* Coord values stagger in */
        .from(`${COMP} .coord-pair`, {
            autoAlpha: 0, y: 10, duration: 0.4, ease: "power3.out", stagger: 0.14 }, 0.80)

        /* Term label slides in */
        .from(`${COMP} .term-wrap`, {
            autoAlpha: 0, x: -18, filter: "blur(7px)",
            duration: 0.60, ease: "power4.out" }, 1.05)

        /* Detail glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.62, ease: "power4.out" }, 1.28)

        /* Chip glow pulse */
        .to(`${COMP} .coord-chip`, {
            boxShadow: "0 0 36px rgba(55,189,248,0.40), inset 0 1px 0 rgba(255,255,255,0.20), 0 24px 70px rgba(0,0,0,0.50)",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t2-lb-coord"] = tl;
    </script>
  </body>
</html>
