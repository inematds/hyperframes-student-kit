<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · BRANDBAR
  A co-branded lower-third: a glowing logotype block (wordmark placeholder)
  on the left, a thin vertical separator, then the name and role stacked on
  the right. The brand block has an accent glow border; name is display-bold.
  Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-brand {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom — two-zone: behind brand block and behind name */
      #t2-lt-brand .local-bloom {
        position: absolute;
        left: 40px; bottom: 80px;
        width: 680px; height: 230px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* The combined row */
      #t2-lt-brand .row {
        position: absolute;
        left: 80px; bottom: 114px;
        display: flex;
        align-items: stretch;
        gap: 0;
        z-index: 2;
      }

      /* Brand block — neon-bordered glass tile */
      #t2-lt-brand .brand-block {
        width: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 20px 20px;
        background: rgba(var(--accent-rgb), 0.08);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius) 0 0 var(--radius);
        border: 1.5px solid rgba(var(--accent-rgb), 0.60);
        border-right: none;
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.55),
          0 0 28px rgba(var(--accent-rgb), 0.28),
          inset 0 1px 0 rgba(255,255,255,0.16),
          0 20px 50px rgba(0,0,0,0.55);
        position: relative;
        overflow: hidden;
      }

      /* Top highlight shimmer */
      #t2-lt-brand .brand-block::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 50%, transparent);
      }

      /* Wordmark logotype placeholder */
      #t2-lt-brand .wordmark {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
      }

      /* Small brand descriptor below wordmark */
      #t2-lt-brand .brand-sub {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(var(--accent-rgb), 0.65);
        line-height: 1;
      }

      /* Connecting separator — thin glowing line */
      #t2-lt-brand .sep {
        width: 2px;
        background: linear-gradient(180deg,
          transparent 10%,
          rgba(var(--accent-rgb), 0.70) 30%,
          rgba(var(--accent-rgb), 0.70) 70%,
          transparent 90%);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.40);
        flex-shrink: 0;
      }

      /* Name + role block */
      #t2-lt-brand .card {
        padding: 22px 38px 22px 34px;
        min-width: 380px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius) var(--radius) 0;
        border: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      #t2-lt-brand .card::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 50%, transparent);
      }

      #t2-lt-brand .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 7px;
        line-height: 1.1;
      }

      #t2-lt-brand .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-brand"
         data-composition-id="t2-lt-brand"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="row">
        <div class="brand-block">
          <div class="wordmark">AIS</div>
          <div class="brand-sub">Academy</div>
        </div>
        <div class="sep"></div>
        <div class="card">
          <div class="name" data-slot="name">Taylor Brooks</div>
          <div class="role" data-slot="role">Lead AI Certification Coach</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-brand";

      /* bloom swells */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.62, duration: 1.1, ease: "power2.out" }, 0);

      /* brand block drops in with spring */
      tl.from(`${C} .brand-block`,
        { autoAlpha: 0, y: 30, scale: 0.88, filter: "blur(12px)",
          transformOrigin: "center bottom",
          duration: 0.80, ease: "back.out(1.4)" }, 0.08);

      /* sep draws down */
      tl.from(`${C} .sep`,
        { scaleY: 0, transformOrigin: "top center",
          duration: 0.45, ease: "power3.out" }, 0.50);

      /* card slides from right */
      tl.from(`${C} .card`,
        { autoAlpha: 0, x: 36, filter: "blur(12px)",
          duration: 0.72, ease: "power4.out" }, 0.60);

      /* name glides in */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: 16, filter: "blur(8px)",
          duration: 0.58, ease: "power4.out" }, 0.92);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: 12, filter: "blur(6px)",
          duration: 0.52, ease: "power3.out" }, 1.08);

      /* brand block glow breathes — finite */
      tl.to(`${C} .brand-block`,
        { boxShadow:
            "0 0 0 1px rgba(55,189,248,0.90), 0 0 44px rgba(55,189,248,0.50), inset 0 1px 0 rgba(255,255,255,0.22), 0 20px 50px rgba(0,0,0,0.55)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.65);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-brand"] = tl;
    </script>
  </body>
</html>
