<!doctype html>
<!--
  KALLAWAY · tier2 · label · PERCENT
  A % HIGHLIGHT chip: big glowing percentage (term) counts up + a small label
  (detail) below. Compact pill anchored right side. Transparent overlay.
  Slots: term (numeric value, e.g. "73"), detail (~28 chars label).
  The % character is hardcoded in the card; term is the numeric portion.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-pct {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — right, centered on chip */
      #t2-lb-pct .local-glow {
        position: absolute; right: 80px; top: 350px;
        width: 440px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 78%);
        filter: blur(40px);
        pointer-events: none;
      }

      /* Compact chip anchored right */
      #t2-lb-pct .chip {
        position: absolute; right: 80px; top: 380px;
        width: 380px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.10),
                    0 0 50px rgba(var(--accent-rgb), 0.14);
        border-radius: var(--radius);
        padding: 28px 38px 28px;
        overflow: hidden;
        text-align: center;
      }

      /* Top neon rim */
      #t2-lb-pct .chip::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.70) 38%,
          rgba(var(--accent-rgb), 0.70) 62%, transparent 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.50);
      }

      /* Percentage display row */
      #t2-lb-pct .pct-row {
        display: flex; align-items: flex-start; justify-content: center;
        line-height: 1;
        margin-bottom: 14px;
      }

      /* Big number — counts up via JS */
      #t2-lb-pct .pct-number {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 110px; letter-spacing: -0.03em;
        color: var(--white);
        text-shadow: var(--textglow),
                     0 0 40px rgba(var(--accent-rgb), 0.50),
                     0 0 90px rgba(var(--accent-rgb), 0.25);
        line-height: 1;
      }

      /* % symbol — smaller, sits top-right of number */
      #t2-lb-pct .pct-symbol {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 46px; letter-spacing: -0.02em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
        margin-top: 14px; margin-left: 4px;
      }

      /* Hairline rule */
      #t2-lb-pct .sep {
        height: 1px; width: 80%;
        background: var(--glass-border);
        margin: 0 auto 14px;
        transform-origin: center center;
      }

      /* Detail label */
      #t2-lb-pct .detail {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: 22px; letter-spacing: 0.03em;
        color: var(--text-dim);
        line-height: 1.4; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-pct" data-composition-id="t2-lb-pct" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="chip">
        <div class="pct-row">
          <div class="pct-number" id="pct-num">0</div>
          <div class="pct-symbol">%</div>
        </div>
        <div class="sep"></div>
        <div class="detail" data-slot="detail">of AI projects fail at production</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP = "#t2-lb-pct";

      /* Count-up — target value from data-slot term (default 73) */
      const TARGET = 73;
      const counter = { val: 0 };

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* chip glides in from right + blur */
        .from(`${COMP} .chip`, {
            autoAlpha: 0, x: 56, filter: "blur(14px)",
            duration: 0.88, ease: "back.out(1.4)" }, 0.18)

        /* % symbol pops in */
        .from(`${COMP} .pct-symbol`, {
            autoAlpha: 0, scale: 0.60, transformOrigin: "50% 50%",
            filter: "blur(6px)",
            duration: 0.42, ease: "back.out(1.7)" }, 0.55)

        /* count-up from 0 to TARGET */
        .to(counter, {
            val: TARGET,
            duration: 1.40,
            ease: "power2.out",
            onUpdate() {
              const el = document.getElementById("pct-num");
              if (el) el.textContent = Math.round(counter.val);
            }
          }, 0.60)

        /* sep draws */
        .from(`${COMP} .sep`, {
            scaleX: 0, transformOrigin: "50% 50%",
            duration: 0.42, ease: "power2.out" }, 1.65)

        /* detail fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.60, ease: "power3.out" }, 1.80)

        /* number glow pulse — finite */
        .to(`${COMP} .pct-number`, {
            textShadow: "0 0 30px rgba(255,255,255,0.65), 0 0 70px rgba(55,189,248,0.70), 0 0 120px rgba(55,189,248,0.35)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4)

        .set({}, {}, 7);

      window.__timelines["t2-lb-pct"] = tl;
    </script>
  </body>
</html>
