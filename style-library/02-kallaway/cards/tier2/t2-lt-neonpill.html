<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · NEONPILL
  A long neon-rimmed pill nameplate — wide, low, horizontal — that stretches
  across the lower-left. Name (bold, large) on the left side of the pill;
  role (lighter, mono) on the right. A bright vertical divider separates them.
  The pill outline illuminates from both ends and meets in the center.
  Sits over live footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-npill {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-npill .local-bloom {
        position: absolute;
        left: 45px; bottom: 95px;
        width: 700px; height: 190px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 48% 78%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 74%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 1;
      }

      /* SVG overlay for the animating neon outline */
      #t2-lt-npill .pill-svg {
        position: absolute;
        left: 78px; bottom: 138px;
        width: 620px; height: 84px;
        pointer-events: none;
        z-index: 3;
        overflow: visible;
      }

      /* The pill body — dark glass fill */
      #t2-lt-npill .pill-body {
        position: absolute;
        left: 80px; bottom: 140px;
        width: 616px; height: 80px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 999px;
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        display: flex;
        align-items: center;
        padding: 0 32px;
        gap: 0;
        overflow: hidden;
      }

      /* Inner highlight line at top of pill */
      #t2-lt-npill .pill-body::before {
        content: "";
        position: absolute;
        top: 0; left: 18%; right: 18%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
        border-radius: 1px;
      }

      #t2-lt-npill .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        flex: 1;
      }

      /* Vertical neon divider */
      #t2-lt-npill .divider {
        width: 2px;
        height: 44px;
        flex-shrink: 0;
        margin: 0 24px;
        border-radius: 2px;
        background: linear-gradient(180deg,
          transparent,
          rgba(var(--accent-rgb), 0.70) 25%,
          var(--accent) 50%,
          rgba(var(--accent-rgb), 0.70) 75%,
          transparent);
        box-shadow:
          0 0 6px rgba(var(--accent-rgb), 0.80),
          0 0 18px rgba(var(--accent-rgb), 0.45);
      }

      #t2-lt-npill .role {
        font-family: var(--font-mono);
        font-weight: var(--wt-reg);
        font-size: 19px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        white-space: nowrap;
        flex: 1;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-npill"
         data-composition-id="t2-lt-npill"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <!-- Pill body (content) -->
      <div class="pill-body">
        <div class="name" data-slot="name">Priya Nambiar</div>
        <div class="divider"></div>
        <div class="role" data-slot="role">Senior Machine Learning Engineer</div>
      </div>

      <!-- SVG pill outline that animates in from both ends -->
      <svg class="pill-svg" id="npill-svg" viewBox="0 0 620 84">
        <defs>
          <filter id="npill-glow">
            <feGaussianBlur stdDeviation="2.8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!--
          Pill path: rect 620×84 with rx=42.
          Perimeter ≈ 2*(620-84)+π*84 ≈ 1072+264 ≈ 1336
          We draw two half-arcs: first the top half starting from left midpoint,
          then the bottom half. Use a full rounded-rect path split into two segments.
          Simpler: use two rect elements with complementary dashoffsets that draw from
          each end toward the middle.
        -->
        <!-- Full rect path, drawn left-to-right via dashoffset -->
        <rect id="npill-rect"
              x="1.5" y="1.5"
              width="617" height="81"
              rx="40.5" ry="40.5"
              fill="none"
              stroke="#37BDF8"
              stroke-width="2"
              filter="url(#npill-glow)"
              stroke-dasharray="1340"
              stroke-dashoffset="1340"
              opacity="0" />
      </svg>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-npill";
      const rectEl = document.getElementById("npill-rect");

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.1, ease: "power2.out" }, 0);

      /* pill body slides up from below */
      tl.from(`${C} .pill-body`,
        { autoAlpha: 0, y: 30, scale: 0.92,
          filter: "blur(12px)", transformOrigin: "50% 100%",
          duration: 0.78, ease: "back.out(1.4)" }, 0.12);

      /* SVG outline draws in from left (dashoffset 1340→0) */
      if (rectEl) {
        tl.to(rectEl, { opacity: 1, duration: 0.15, ease: "none" }, 0.18);
        tl.to({ offset: 1340 }, {
          offset: 0, duration: 0.90, ease: "power3.out",
          onUpdate: function() {
            rectEl.setAttribute("stroke-dashoffset", this.targets()[0].offset);
          }
        }, 0.20);
      }

      /* name fades in */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -22, filter: "blur(7px)",
          duration: 0.62, ease: "power4.out" }, 0.58);

      /* divider draws */
      tl.from(`${C} .divider`,
        { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 50%",
          duration: 0.28, ease: "power2.out" }, 0.76);

      /* role fades in from right */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: 18, filter: "blur(5px)",
          duration: 0.55, ease: "power3.out" }, 0.88);

      /* SVG outline glow pulse — finite (animate opacity) */
      if (rectEl) {
        tl.to("#npill-svg", {
          opacity: 0.50, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);
      }

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-npill"] = tl;
    </script>
  </body>
</html>
