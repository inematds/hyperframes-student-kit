<!doctype html>
<!--
  KALLAWAY · tier2 · label · FACT
  A "FACT" label box: small accent FACT tag + term statement + detail body.
  Anchored right side. Transparent overlay.
  Slots: term (~36 chars), detail (~80 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-fact {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — right side */
      #t2-lb-fact .local-glow {
        position: absolute; right: 50px; top: 280px;
        width: 600px; height: 440px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.16) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 78%);
        filter: blur(44px);
        pointer-events: none;
      }

      /* Glass card anchored right */
      #t2-lb-fact .card {
        position: absolute; right: 80px; top: 320px;
        width: 520px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.07);
        border-radius: var(--radius);
        padding: 28px 34px 32px;
        overflow: hidden;
      }

      /* Top neon rim */
      #t2-lb-fact .card::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.65) 38%,
          rgba(var(--accent-rgb), 0.65) 62%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.44);
      }

      /* FACT tag pill */
      #t2-lb-fact .fact-tag {
        display: inline-flex; align-items: center;
        background: linear-gradient(135deg,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.08) 100%);
        border: 1.5px solid rgba(var(--accent-rgb), 0.50);
        border-radius: var(--radius-sm);
        padding: 5px 14px;
        margin-bottom: 20px;
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.28);
      }

      #t2-lb-fact .fact-tag span {
        font-family: var(--font-body); font-weight: var(--wt-bold);
        font-size: 13px; letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Term — main statement */
      #t2-lb-fact .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 36px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.2; margin-bottom: 14px;
      }

      /* Hairline separator */
      #t2-lb-fact .sep {
        height: 1px; width: 100%;
        background: var(--glass-border);
        margin-bottom: 16px;
        transform-origin: left center;
      }

      /* Detail body */
      #t2-lb-fact .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 25px; line-height: 1.52;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-fact" data-composition-id="t2-lb-fact" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <div class="fact-tag"><span>Fact</span></div>
        <div class="term" data-slot="term">Context window ≠ working memory</div>
        <div class="sep"></div>
        <div class="detail" data-slot="detail">Tokens at the fringe of a long context are reliably ignored by most models — recency and salience dominate retrieval.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP = "#t2-lb-fact";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* card glides in from right + blur */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: 58, filter: "blur(14px)",
            duration: 0.88, ease: "back.out(1.4)" }, 0.18)

        /* FACT tag scales in */
        .from(`${COMP} .fact-tag`, {
            autoAlpha: 0, scale: 0.68, transformOrigin: "0% 50%",
            filter: "blur(5px)",
            duration: 0.50, ease: "back.out(1.7)" }, 0.52)

        /* term glides + blur */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.76)

        /* sep draws */
        .from(`${COMP} .sep`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.45, ease: "power2.out" }, 1.02)

        /* detail fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.62, ease: "power3.out" }, 1.20)

        /* tag glow pulse — finite */
        .to(`${COMP} .fact-tag`, {
            boxShadow: "0 0 22px rgba(55,189,248,0.65), 0 0 55px rgba(55,189,248,0.28)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-fact"] = tl;
    </script>
  </body>
</html>
