<!doctype html>
<!--
  KALLAWAY · tier2 · label · EYEBROW
  An eyebrow kicker line (small all-caps label) floats above a bold term phrase;
  a glowing animated underline draws in beneath the term. Anchored left side.
  Slots: term (~32 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-eye {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — left */
      #t2-lb-eye .local-glow {
        position: absolute; left: 80px; top: 370px;
        width: 540px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 38% 50%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(50px);
        pointer-events: none;
      }

      /* Wrapper anchored left */
      #t2-lb-eye .wrapper {
        position: absolute; left: 120px; top: 400px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 0;
      }

      /* Eyebrow kicker */
      #t2-lb-eye .eyebrow {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: 20px; letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 8px;
      }

      /* Term — big, glowing */
      #t2-lb-eye .term-wrap {
        position: relative; display: inline-block;
        margin-bottom: 6px;
      }

      #t2-lb-eye .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 54px; line-height: 1.08; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        display: block;
      }

      /* Glow underline — SVG line drawn by GSAP */
      #t2-lb-eye .underline-svg {
        display: block; width: 100%; height: 8px; overflow: visible;
        margin-top: 2px;
      }

      #t2-lb-eye .u-line {
        stroke: url(#eyeUnderlineGrad);
        stroke-width: 3;
        stroke-linecap: round;
        fill: none;
        /* drawn via stroke-dashoffset */
      }

      /* Detail glass block — sits below with gap */
      #t2-lb-eye .detail-wrap {
        margin-top: 18px;
        padding: 12px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.16);
        max-width: 480px;
        position: relative; overflow: hidden;
      }

      #t2-lb-eye .detail-wrap::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.36) 50%, transparent);
      }

      #t2-lb-eye .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.45; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-eye" data-composition-id="t2-lb-eye" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="eyebrow">The Big Idea</div>

        <div class="term-wrap">
          <span class="term" data-slot="term">Learn AI in 12 Weeks</span>
          <!-- Underline SVG — width set by JS to match term width -->
          <svg class="underline-svg" id="t2-lb-eye-ul-svg"
               viewBox="0 0 400 8" preserveAspectRatio="none"
               xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="eyeUnderlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(55,189,248,0.20)"/>
                <stop offset="40%" stop-color="#37BDF8" stop-opacity="1"/>
                <stop offset="100%" stop-color="rgba(55,189,248,0.30)"/>
              </linearGradient>
            </defs>
            <line id="t2-lb-eye-ul-line"
              x1="0" y1="4" x2="400" y2="4"
              class="u-line"
              stroke-dasharray="400"
              stroke-dashoffset="400"
              style="filter: drop-shadow(0 0 6px rgba(55,189,248,0.80)) drop-shadow(0 0 14px rgba(55,189,248,0.45));"
            />
          </svg>
        </div>

        <div class="detail-wrap">
          <div class="detail" data-slot="detail">Structured curriculum built for working professionals</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP  = "#t2-lb-eye";
      const ulEl  = document.getElementById("t2-lb-eye-ul-line");
      const ulLen = 400; /* matches the SVG viewBox width */

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "38% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* eyebrow slides down + fade */
        .from(`${COMP} .eyebrow`, {
            autoAlpha: 0, y: -14, filter: "blur(6px)",
            duration: 0.55, ease: "power3.out" }, 0.16)

        /* term glides in */
        .from(`${COMP} .term`, {
            autoAlpha: 0, x: -24, filter: "blur(10px)",
            duration: 0.72, ease: "power4.out" }, 0.32)

        /* underline draws left→right via dashoffset proxy */
        .to({ val: ulLen }, {
            val: 0,
            duration: 0.65, ease: "power3.out",
            onUpdate: function () {
              ulEl.style.strokeDashoffset = this.targets()[0].val;
            }
          }, 0.70)

        /* detail block glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.88)

        /* finite underline glow breathing */
        .to(`${COMP} .underline-svg`, {
            opacity: 0.55,
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80)

        .set({}, {}, 7);

      window.__timelines["t2-lb-eye"] = tl;
    </script>
  </body>
</html>
