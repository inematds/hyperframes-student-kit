<!doctype html>
<!--
  KALLAWAY · tier2 · label · MINI PROGRESS BAR
  `term` heading + a mini progress bar that fills via scaleX + a live % value
  that counts up; `detail` label beneath. Right side anchor. Dark glass backing.
  Knob `data-fill` (0..1, default 0.7) controls fill fraction.
  Slots: term (~28 chars — label above bar), detail (~40 chars — sub-label).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-bar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — right side */
      #t2-lb-bar .local-glow {
        position: absolute; right: 55px; top: 310px;
        width: 540px; height: 360px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(42px);
        pointer-events: none;
      }

      /* Card — right anchor */
      #t2-lb-bar .card {
        position: absolute; right: 80px; top: 340px;
        width: 460px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.08);
        border-radius: var(--radius-sm);
        padding: 30px 36px 28px;
      }

      /* Top neon rim */
      #t2-lb-bar .card::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.65) 40%,
          rgba(var(--accent-rgb), 0.65) 60%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.45);
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      }

      /* Row: term + % value side by side */
      #t2-lb-bar .header-row {
        display: flex; align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      #t2-lb-bar .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.2;
      }

      /* % counter — Space Mono, accent gradient */
      #t2-lb-bar .pct {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 28px; letter-spacing: -0.02em;
        background: linear-gradient(110deg, #FFFFFF 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.55));
      }

      /* Track */
      #t2-lb-bar .bar-track {
        height: 10px; width: 100%;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      /* Fill segment */
      #t2-lb-bar .bar-fill {
        height: 100%; width: 100%; border-radius: 999px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.70) 0%, var(--accent) 60%, #FFFFFF 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.65),
                    0 0 24px rgba(var(--accent-rgb), 0.30);
        transform-origin: left center;
        /* scaleX animated by GSAP */
      }

      /* Detail */
      #t2-lb-bar .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; color: var(--text-dim); line-height: 1.4;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-bar"
         data-composition-id="t2-lb-bar"
         data-start="0" data-width="1920" data-height="1080"
         data-fill="0.7">

      <div class="local-glow"></div>

      <div class="card">
        <div class="header-row">
          <div class="term" data-slot="term">Adoption Rate</div>
          <div class="pct">0%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill"></div>
        </div>
        <div class="detail" data-slot="detail">Teams using AI workflows weekly</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP    = "#t2-lb-bar";
      const root    = document.querySelector(COMP);
      const fillVal = parseFloat(root.dataset.fill ?? "0.7");
      const pctEl   = root.querySelector(".pct");

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* card glides in from right */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: 50, filter: "blur(12px)",
            duration: 0.80, ease: "back.out(1.4)" }, 0.18)

        /* term fades up */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 12, filter: "blur(8px)",
            duration: 0.55, ease: "power4.out" }, 0.52)

        /* % counter pops */
        .from(`${COMP} .pct`, {
            autoAlpha: 0, scale: 0.75,
            duration: 0.40, ease: "back.out(2.0)" }, 0.60)

        /* bar fill scaleX 0 → fillVal; VALUE RULE: tl.to({val:0}, ...) */
        .to({ val: 0 }, {
            val: fillVal,
            duration: 0.80, ease: "power3.out",
            onUpdate: function() {
              const v = this.targets()[0].val;
              root.querySelector(".bar-fill").style.transform = `scaleX(${v})`;
              pctEl.textContent = Math.round(v * 100) + "%";
            }
          }, 0.80)

        /* detail */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 8,
            duration: 0.40, ease: "power2.out" }, 1.10)

        /* bar glow pulse — finite */
        .to(`${COMP} .bar-fill`, {
            boxShadow: "0 0 20px rgba(55,189,248,0.80), 0 0 40px rgba(55,189,248,0.45)",
            duration: 0.9, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.70)

        .set({}, {}, 7);

      window.__timelines["t2-lb-bar"] = tl;
    </script>
  </body>
</html>
