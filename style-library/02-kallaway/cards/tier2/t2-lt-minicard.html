<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · MINICARD
  A compact minimal mini-card: tiny glass chip, name bold + role micro
  beneath, one accent dot. Designed to be unobtrusive — small footprint,
  maximum legibility, instant read. Perfect for returning guest IDs or
  secondary speaker credits.
  Sits over live speaker footage — fully transparent background.
  Slots: name (~20 chars), role (~32 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-mini {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom — very subtle, scaled down to match the tiny card */
      #t2-lt-mini .local-bloom {
        position: absolute;
        left: 55px; bottom: 95px;
        width: 380px; height: 170px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 80%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 52%,
          transparent 76%);
        filter: blur(28px);
        pointer-events: none;
        z-index: 1;
      }

      /* Mini glass chip */
      #t2-lt-mini .chip {
        position: absolute;
        left: 80px; bottom: 120px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 24px 13px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.44),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 16px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
      }

      /* Shimmer strip */
      #t2-lt-mini .chip::before {
        content: "";
        position: absolute; top: 0; left: 8px; right: 8px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 40%, rgba(255,255,255,0.48) 60%, transparent);
        border-radius: 1px;
      }

      /* Accent dot indicator */
      #t2-lt-mini .dot {
        flex-shrink: 0;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow:
          0 0 8px rgba(var(--accent-rgb), 0.85),
          0 0 20px rgba(var(--accent-rgb), 0.40);
      }

      /* Text block */
      #t2-lt-mini .text-block {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      #t2-lt-mini .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 26px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }

      #t2-lt-mini .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 15px;
        letter-spacing: 0.025em;
        color: var(--text-dim);
        line-height: 1.3;
        white-space: nowrap;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-mini"
         data-composition-id="t2-lt-mini"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="chip">
        <div class="dot"></div>
        <div class="text-block">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom fades in */
      tl.from("#t2-lt-mini .local-bloom",
        { autoAlpha: 0, scale: 0.70, duration: 1.1, ease: "power2.out" }, 0);

      /* chip springs in from lower-left */
      tl.from("#t2-lt-mini .chip",
        { autoAlpha: 0, x: -36, y: 20, scale: 0.88,
          filter: "blur(10px)", transformOrigin: "left bottom",
          duration: 0.75, ease: "back.out(1.4)" }, 0.10);

      /* dot blooms on */
      tl.from("#t2-lt-mini .dot",
        { autoAlpha: 0, scale: 0.30,
          duration: 0.45, ease: "back.out(1.8)" }, 0.52);

      /* name glides in */
      tl.from("#t2-lt-mini .name",
        { autoAlpha: 0, x: -16, filter: "blur(7px)",
          duration: 0.55, ease: "power4.out" }, 0.60);

      /* role follows */
      tl.from("#t2-lt-mini .role",
        { autoAlpha: 0, x: -10, filter: "blur(5px)",
          duration: 0.50, ease: "power3.out" }, 0.74);

      /* dot glow breathes — finite */
      tl.to("#t2-lt-mini .dot",
        { boxShadow:
            "0 0 16px rgba(55,189,248,1.0), 0 0 36px rgba(55,189,248,0.55)",
          duration: 0.90, ease: "sine.inOut", repeat: 4, yoyo: true }, 1.4);

      /* chip rim pulse — finite */
      tl.to("#t2-lt-mini .chip",
        { boxShadow:
            "0 16px 48px rgba(0,0,0,0.44), 0 0 0 1.5px rgba(55,189,248,0.88), 0 0 28px rgba(55,189,248,0.35), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-mini"] = tl;
    </script>
  </body>
</html>
