<!doctype html>
<!--
  KALLAWAY · tier2 · label · FLAG
  A small flag marker on a glowing vertical pole. The pole line draws up from
  a base dot; the flag unfurls to the right; the term label sits on the flag.
  Detail note appears below. Anchored right side.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-flag {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local glow at the pole base */
      #t2-lb-flag .local-glow {
        position: absolute; right: 220px; top: 420px;
        width: 340px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 60%,
          rgba(var(--accent-rgb), 0.25) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 78%);
        filter: blur(46px);
        pointer-events: none;
      }

      /* Pole SVG */
      #t2-lb-flag .pole-svg {
        position: absolute; right: 276px; top: 360px;
        width: 24px; height: 280px;
        overflow: visible;
      }

      /* Pole line */
      #t2-lb-flag .pole-line {
        stroke: var(--accent);
        stroke-width: 2px;
        stroke-linecap: round;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.80))
                drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.38));
      }

      /* Base dot */
      #t2-lb-flag .pole-base {
        fill: var(--accent);
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.85));
      }

      /* Base ring */
      #t2-lb-flag .pole-ring {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.40);
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.50));
      }

      /* Top mount dot */
      #t2-lb-flag .pole-top {
        fill: var(--white);
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.80));
      }

      /* Flag body — anchored to the right of the pole */
      #t2-lb-flag .flag-body {
        position: absolute; right: 90px; top: 360px;
        width: 200px;
        transform-origin: 100% 50%;  /* unfurl from pole side (right edge) */
      }

      /* The flag panel */
      #t2-lb-flag .flag-panel {
        padding: 14px 22px 13px;
        background: rgba(var(--accent-rgb), 0.14);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        border-left: none;  /* no border on pole side */
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.30),
                    inset 0 1px 0 rgba(255,255,255,0.16),
                    var(--glass-shadow);
        /* Pointy tail on the left (pole side) via clip-path */
        clip-path: polygon(12px 0%, 100% 0%, 100% 100%, 12px 100%, 0% 50%);
        position: relative;
      }

      /* Flag term text */
      #t2-lb-flag .flag-term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 22px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
        text-align: center;
      }

      /* Horizontal dashed line below flag to detail */
      #t2-lb-flag .connector-svg {
        position: absolute; right: 136px; top: 421px;
        width: 2px; height: 80px; overflow: visible;
      }

      #t2-lb-flag .conn-line {
        stroke: rgba(var(--accent-rgb), 0.40);
        stroke-width: 1.5px;
        stroke-dasharray: 4 4;
        filter: drop-shadow(0 0 3px rgba(var(--accent-rgb), 0.45));
      }

      /* Detail strip at the bottom */
      #t2-lb-flag .detail-wrap {
        position: absolute; right: 90px; top: 504px;
        padding: 8px 18px 8px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 440px;
      }

      #t2-lb-flag .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 21px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-flag" data-composition-id="t2-lb-flag" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <!-- Pole SVG: viewBox 24×280, pole from y=0 (top) to y=270 (base) -->
      <svg class="pole-svg" viewBox="0 0 24 280" xmlns="http://www.w3.org/2000/svg">
        <!-- Pole line -->
        <line id="t2-lb-flag-pole" class="pole-line" x1="12" y1="270" x2="12" y2="10" />
        <!-- Base ring and dot -->
        <circle class="pole-ring" cx="12" cy="270" r="10" />
        <circle class="pole-base" cx="12" cy="270" r="5" />
        <!-- Top mount dot -->
        <circle class="pole-top" cx="12" cy="10" r="3" />
      </svg>

      <!-- Dashed connector below the flag -->
      <svg class="connector-svg" viewBox="0 0 2 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line id="t2-lb-flag-conn" class="conn-line" x1="1" y1="0" x2="1" y2="80" />
      </svg>

      <!-- Flag body -->
      <div class="flag-body">
        <div class="flag-panel">
          <div class="flag-term" data-slot="term">Checkpoint</div>
        </div>
      </div>

      <!-- Detail strip -->
      <div class="detail-wrap">
        <div class="detail-text" data-slot="detail">A saved model state mid-training — allows rollback and eval at any training step.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-flag";

      /* Local glow */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 60%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Base ring fades in */
        .from(`${COMP} .pole-ring`, {
            autoAlpha: 0, scale: 0, transformOrigin: "12px 270px",
            duration: 0.38, ease: "back.out(2)" }, 0.10)

        /* Base dot pops */
        .from(`${COMP} .pole-base`, {
            autoAlpha: 0, scale: 0, transformOrigin: "12px 270px",
            duration: 0.30, ease: "back.out(2.5)" }, 0.20)

        /* Pole line draws up — scaleY from base */
        .from(`${COMP} #t2-lb-flag-pole`, {
            scaleY: 0, transformOrigin: "12px 270px",
            duration: 0.65, ease: "power3.out" }, 0.32)

        /* Top dot pops */
        .from(`${COMP} .pole-top`, {
            autoAlpha: 0, scale: 0, transformOrigin: "12px 10px",
            duration: 0.28, ease: "back.out(2)" }, 0.85)

        /* Flag unfurls from pole (scaleX from left = pole side) */
        .from(`${COMP} .flag-body`, {
            autoAlpha: 0, scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.60, ease: "back.out(1.4)" }, 0.90)

        /* Connector draws down */
        .from(`${COMP} #t2-lb-flag-conn`, {
            scaleY: 0, transformOrigin: "1px 0px",
            duration: 0.38, ease: "power3.out" }, 1.20)

        /* Detail glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.62, ease: "power4.out" }, 1.40)

        /* Finite flag glow pulse */
        .to(`${COMP} .flag-panel`, {
            boxShadow: "0 0 36px rgba(55,189,248,0.55), inset 0 1px 0 rgba(255,255,255,0.22), 0 24px 70px rgba(0,0,0,0.50)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.9)

        /* Pole glow pulse */
        .to(`${COMP} .pole-base`, {
            opacity: 0.40, duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-flag"] = tl;
    </script>
  </body>
</html>
