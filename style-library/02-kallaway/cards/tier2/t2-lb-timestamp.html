<!doctype html>
<!--
  KALLAWAY · tier2 · label · TIMESTAMP
  A timestamped label: a Space-Mono time chip + term heading + detail body, on
  frosted dark glass. Anchored right side. Transparent overlay.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-ts {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized ambient glow — right side, contained */
      #t2-lb-ts .local-glow {
        position: absolute; right: 50px; top: 290px;
        width: 560px; height: 420px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.15) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 78%);
        filter: blur(44px);
        pointer-events: none;
      }

      /* Glass card anchored right */
      #t2-lb-ts .card {
        position: absolute; right: 80px; top: 330px;
        width: 500px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.07);
        border-radius: var(--radius);
        padding: 28px 34px 32px;
        overflow: hidden;
      }

      /* Top neon rim */
      #t2-lb-ts .card::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.65) 38%,
          rgba(var(--accent-rgb), 0.65) 62%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.45);
      }

      /* Time chip row */
      #t2-lb-ts .chip-row {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 18px;
      }

      /* Clock icon — pure CSS */
      #t2-lb-ts .clock-icon {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.55);
        position: relative; flex-shrink: 0;
      }
      #t2-lb-ts .clock-icon::before,
      #t2-lb-ts .clock-icon::after {
        content: "";
        position: absolute; left: 50%; bottom: 50%;
        transform-origin: 50% 100%;
        background: var(--accent);
        border-radius: 1px;
      }
      /* hour hand */
      #t2-lb-ts .clock-icon::before {
        width: 2px; height: 6px;
        transform: translateX(-50%) rotate(-35deg);
      }
      /* minute hand */
      #t2-lb-ts .clock-icon::after {
        width: 1.5px; height: 8px;
        transform: translateX(-50%) rotate(60deg);
      }

      /* Space Mono time text */
      #t2-lb-ts .time-chip {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 20px; letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
      }

      /* Term heading */
      #t2-lb-ts .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 38px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.15; margin-bottom: 14px;
      }

      /* Thin accent rule */
      #t2-lb-ts .accent-rule {
        height: 2px; width: 100%;
        background: linear-gradient(90deg,
          var(--accent) 0%, rgba(var(--accent-rgb), 0.15) 100%);
        box-shadow: 0 0 7px rgba(var(--accent-rgb), 0.40);
        margin-bottom: 18px;
        transform-origin: left center;
      }

      /* Detail body */
      #t2-lb-ts .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 26px; line-height: 1.52;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-ts" data-composition-id="t2-lb-ts" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <div class="chip-row">
          <div class="clock-icon"></div>
          <div class="time-chip">02:14:37</div>
        </div>
        <div class="term" data-slot="term">Model Invocation</div>
        <div class="accent-rule"></div>
        <div class="detail" data-slot="detail">The API call fires here — after retrieval, before the prompt is assembled for the final response.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP = "#t2-lb-ts";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* card glides in from right + blur */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: 58, filter: "blur(14px)",
            duration: 0.88, ease: "back.out(1.4)" }, 0.18)

        /* chip row fades + drifts up */
        .from(`${COMP} .chip-row`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.50, ease: "power3.out" }, 0.55)

        /* term glides + blur */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.75)

        /* accent rule draws */
        .from(`${COMP} .accent-rule`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.50, ease: "power3.out" }, 1.00)

        /* detail fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.62, ease: "power3.out" }, 1.18)

        /* finite glow pulse on chip */
        .to(`${COMP} .time-chip`, {
            textShadow: "0 0 28px rgba(55,189,248,0.90), 0 0 60px rgba(55,189,248,0.45)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-ts"] = tl;
    </script>
  </body>
</html>
