<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · INFOCHIPS
  Name and role rendered as two separate glowing pill chips stacked vertically.
  Each chip has its own accent color: name chip is white-glow / blue border,
  role chip is a softer blue-tinted glass. They stagger in independently.
  Transparent overlay over live footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-ichips {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-ichips .local-bloom {
        position: absolute;
        left: 60px; bottom: 80px;
        width: 540px; height: 260px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 80%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 78%);
        filter: blur(44px);
        pointer-events: none;
        z-index: 1;
      }

      /* Stack of chips */
      #t2-lt-ichips .chip-stack {
        position: absolute;
        left: 80px; bottom: 120px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        z-index: 2;
      }

      /* Shared chip base */
      #t2-lt-ichips .chip {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 14px 30px;
        border-radius: 999px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      /* Name chip — premium bright */
      #t2-lt-ichips .chip-name {
        background: rgba(255, 255, 255, 0.06);
        border: 1.5px solid rgba(255, 255, 255, 0.30);
        box-shadow:
          0 0 0 1px rgba(var(--accent-rgb), 0.40),
          0 0 24px rgba(var(--accent-rgb), 0.30),
          0 8px 32px rgba(0,0,0,0.50),
          inset 0 1px 0 rgba(255,255,255,0.22);
      }

      /* Role chip — softer blue-glass */
      #t2-lt-ichips .chip-role {
        background: rgba(var(--accent-rgb), 0.08);
        border: 1.5px solid rgba(var(--accent-rgb), 0.38);
        box-shadow:
          0 0 18px rgba(var(--accent-rgb), 0.20),
          0 6px 24px rgba(0,0,0,0.45),
          inset 0 1px 0 rgba(255,255,255,0.10);
      }

      /* Dot indicators */
      #t2-lt-ichips .chip-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      #t2-lt-ichips .chip-name .chip-dot {
        background: var(--white);
        box-shadow: var(--glow-white);
      }

      #t2-lt-ichips .chip-role .chip-dot {
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
      }

      /* Name text */
      #t2-lt-ichips .chip-name .chip-label {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Role text */
      #t2-lt-ichips .chip-role .chip-label {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-ichips"
         data-composition-id="t2-lt-ichips"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="chip-stack">
        <div class="chip chip-name">
          <div class="chip-dot"></div>
          <div class="chip-label" data-slot="name">Kallaway Osei</div>
        </div>
        <div class="chip chip-role">
          <div class="chip-dot"></div>
          <div class="chip-label" data-slot="role">AI Education Director, AIS</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-ichips";

      /* bloom first */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.55, duration: 1.1, ease: "expo.out" }, 0);

      /* name chip springs in from left with scale */
      tl.from(`${C} .chip-name`,
        { autoAlpha: 0, x: -44, scale: 0.88,
          filter: "blur(12px)", transformOrigin: "left center",
          duration: 0.80, ease: "back.out(1.4)" }, 0.20);

      /* role chip staggers in 160ms later */
      tl.from(`${C} .chip-role`,
        { autoAlpha: 0, x: -32, scale: 0.90,
          filter: "blur(10px)", transformOrigin: "left center",
          duration: 0.72, ease: "back.out(1.4)" }, 0.38);

      /* name chip rim glow pulse */
      tl.to(`${C} .chip-name`, {
        boxShadow:
          "0 0 0 1px rgba(55,189,248,0.80), 0 0 42px rgba(55,189,248,0.50), 0 8px 32px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.28)",
        duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.60);

      /* role chip subtler pulse */
      tl.to(`${C} .chip-role`, {
        boxShadow:
          "0 0 30px rgba(55,189,248,0.38), 0 6px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.16)",
        duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-ichips"] = tl;
    </script>
  </body>
</html>
