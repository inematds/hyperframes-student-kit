<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · DOUBLECARD
  Two stacked glass cards: a compact name card on top (slightly wider, brighter
  accent rim), and a larger topic/subject card below with a dimmer accent and
  a small glow-dot kicker. The two cards animate in with a stagger — top card
  springs, bottom follows with a beat delay. Sits over live footage.
  Slots: name (~26 chars), topic (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-dcard {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-dcard .local-bloom {
        position: absolute;
        left: 50px; bottom: 80px;
        width: 600px; height: 280px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 80%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 74%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 1;
      }

      /* Stack container — two cards stacked vertically */
      #t2-lt-dcard .stack {
        position: absolute;
        left: 80px; bottom: 118px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 2;
      }

      /* Top card — name, compact, bright accent rim */
      #t2-lt-dcard .top-card {
        padding: 16px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm) var(--radius-sm) var(--radius-sm) var(--radius-sm);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.55);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.22),
          0 0 20px rgba(var(--accent-rgb), 0.28),
          inset 0 1px 0 var(--glass-hi);
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        overflow: hidden;
        min-width: 340px;
        align-self: flex-start;
      }

      /* Top card inner highlight */
      #t2-lt-dcard .top-card::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 40%, rgba(255,255,255,0.55) 60%, transparent);
      }

      /* Tiny accent square bullet in top card */
      #t2-lt-dcard .name-bullet {
        width: 8px; height: 8px;
        border-radius: 2px;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      #t2-lt-dcard .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 32px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        line-height: 1.0;
      }

      /* Bottom card — topic, wider, dimmer */
      #t2-lt-dcard .bottom-card {
        padding: 18px 28px 20px;
        background: rgba(10, 14, 20, 0.48);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 rgba(255,255,255,0.10);
        position: relative;
        overflow: hidden;
        max-width: 560px;
      }

      /* Bottom card left accent line */
      #t2-lt-dcard .bottom-card::after {
        content: "";
        position: absolute;
        left: 0; top: 12px; bottom: 12px;
        width: 2px;
        border-radius: 0 1px 1px 0;
        background: linear-gradient(180deg, transparent,
          rgba(var(--accent-rgb), 0.45) 30%,
          rgba(var(--accent-rgb), 0.45) 70%,
          transparent);
      }

      /* Label kicker above topic */
      #t2-lt-dcard .topic-label {
        font-family: var(--font-mono);
        font-size: 17px;
        font-weight: var(--wt-reg);
        letter-spacing: var(--track-wide);
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        text-transform: uppercase;
        margin-bottom: 6px;
        padding-left: 14px;
      }

      #t2-lt-dcard .topic {
        font-family: var(--font-body);
        font-weight: var(--wt-semi);
        font-size: 26px;
        letter-spacing: var(--track-snug);
        color: var(--text);
        line-height: 1.3;
        padding-left: 14px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-dcard"
         data-composition-id="t2-lt-dcard"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stack">
        <!-- Top card: name -->
        <div class="top-card">
          <div class="name-bullet"></div>
          <div class="name" data-slot="name">Aisha Okonkwo</div>
        </div>

        <!-- Bottom card: topic -->
        <div class="bottom-card">
          <div class="topic-label">Now Discussing</div>
          <div class="topic" data-slot="topic">Why AI Alignment Is the Hardest Problem in Tech</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-dcard";

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.2, ease: "power2.out" }, 0);

      /* top card springs in */
      tl.from(`${C} .top-card`,
        { autoAlpha: 0, x: -28, y: 16, scale: 0.92,
          filter: "blur(10px)", transformOrigin: "left bottom",
          duration: 0.72, ease: "back.out(1.4)" }, 0.14);

      /* name glides */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.55, ease: "power4.out" }, 0.58);

      /* bottom card follows with beat delay */
      tl.from(`${C} .bottom-card`,
        { autoAlpha: 0, x: -20, y: 20, scale: 0.94,
          filter: "blur(8px)", transformOrigin: "left top",
          duration: 0.68, ease: "back.out(1.2)" }, 0.46);

      /* topic label fades */
      tl.from(`${C} .topic-label`,
        { autoAlpha: 0, y: 8, filter: "blur(5px)",
          duration: 0.48, ease: "power3.out" }, 0.88);

      /* topic text glides up */
      tl.from(`${C} .topic`,
        { autoAlpha: 0, y: 10, filter: "blur(6px)",
          duration: 0.60, ease: "power4.out" }, 1.02);

      /* top card accent rim glow pulse — finite */
      tl.to(`${C} .top-card`, {
        boxShadow:
          "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.45), 0 0 30px rgba(55,189,248,0.55), inset 0 1px 0 rgba(255,255,255,0.22)",
        borderColor: "rgba(55,189,248,0.85)",
        duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-dcard"] = tl;
    </script>
  </body>
</html>
