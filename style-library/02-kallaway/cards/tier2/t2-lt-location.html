<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · LOCATION
  Name/role glass card with a location line beneath it. A clean glowing
  pin marker (teardrop SVG path) precedes the location text. The marker
  draws on via a stroke animation, then fills with accent glow.
  Sits over live speaker footage — fully transparent background.
  Slots: name (~26 chars), role (~40 chars), location (~30 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-loc {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-loc .local-bloom {
        position: absolute;
        left: 50px; bottom: 88px;
        width: 540px; height: 250px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 82%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 76%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Main glass card */
      #t2-lt-loc .card {
        position: absolute;
        left: 80px; bottom: 110px;
        width: 520px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 22px rgba(var(--accent-rgb), 0.20),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
      }

      /* Shimmer strip */
      #t2-lt-loc .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.52) 60%, transparent);
        border-radius: 1px;
      }

      /* Nameplate */
      #t2-lt-loc .nameplate {
        padding: 26px 34px 18px;
        border-bottom: 1px solid rgba(var(--accent-rgb), 0.18);
      }

      #t2-lt-loc .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 7px;
      }

      #t2-lt-loc .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      #t2-lt-loc .role::before {
        content: "";
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        margin-right: 10px;
        vertical-align: middle;
        position: relative; top: -1px;
      }

      /* Location row */
      #t2-lt-loc .location-row {
        padding: 14px 34px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* SVG pin wrapper */
      #t2-lt-loc .pin-wrap {
        flex-shrink: 0;
        width: 22px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }

      #t2-lt-loc .pin-wrap svg {
        width: 18px; height: 22px;
        overflow: visible;
      }

      /* Pin fill + glow drop-shadow applied via GSAP */
      #t2-lt-loc .pin-path {
        fill: var(--accent);
        filter: drop-shadow(0 0 5px rgba(55,189,248,0.80)) drop-shadow(0 0 12px rgba(55,189,248,0.45));
      }

      #t2-lt-loc .location-text {
        font-family: var(--font-body);
        font-weight: var(--wt-semi);
        font-size: 20px;
        letter-spacing: 0.03em;
        color: var(--accent);
        text-shadow: 0 0 14px rgba(var(--accent-rgb), 0.55);
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-loc"
         data-composition-id="t2-lt-loc"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="nameplate">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
        <div class="location-row">
          <div class="pin-wrap">
            <!-- Clean teardrop pin: no fills/scribbles -->
            <svg viewBox="0 0 18 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path class="pin-path"
                d="M9 0C5.134 0 2 3.134 2 7c0 5.25 7 15 7 15s7-9.75 7-15c0-3.866-3.134-7-7-7Z"
                fill="rgba(55,189,248,0.90)" />
              <circle cx="9" cy="7" r="2.5" fill="rgba(7,18,28,0.80)" />
            </svg>
          </div>
          <div class="location-text" data-slot="location">San Francisco, CA</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom rises */
      tl.from("#t2-lt-loc .local-bloom",
        { autoAlpha: 0, scale: 0.72, duration: 1.2, ease: "power2.out" }, 0);

      /* card springs in */
      tl.from("#t2-lt-loc .card",
        { autoAlpha: 0, x: -44, y: 26, scale: 0.93,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.85, ease: "back.out(1.4)" }, 0.10);

      /* name glides in */
      tl.from("#t2-lt-loc .name",
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.65, ease: "power4.out" }, 0.56);

      /* role follows */
      tl.from("#t2-lt-loc .role",
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.60, ease: "power3.out" }, 0.72);

      /* pin drops in with a bounce */
      tl.from("#t2-lt-loc .pin-wrap",
        { autoAlpha: 0, y: -14, scale: 0.70,
          duration: 0.55, ease: "back.out(1.7)" }, 0.92);

      /* location text sweeps in */
      tl.from("#t2-lt-loc .location-text",
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.60, ease: "power4.out" }, 1.04);

      /* pin glow pulse — finite */
      tl.to("#t2-lt-loc .pin-wrap",
        { filter: "drop-shadow(0 0 10px rgba(55,189,248,0.90)) drop-shadow(0 0 22px rgba(55,189,248,0.50))",
          duration: 0.95, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      /* card rim pulse — finite */
      tl.to("#t2-lt-loc .card",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.88), 0 0 34px rgba(55,189,248,0.36), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.7);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-loc"] = tl;
    </script>
  </body>
</html>
