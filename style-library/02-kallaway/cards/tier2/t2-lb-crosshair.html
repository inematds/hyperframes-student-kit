<!doctype html>
<!--
  KALLAWAY · tier2 · label · CROSSHAIR
  A precision targeting crosshair (four lines + small tick marks) draws in around
  an implied target point on the right side. A term/value readout chip floats
  just outside the crosshair; the detail strip glides in below.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-cross {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local glow at target */
      #t2-lb-cross .local-glow {
        position: absolute; right: 200px; top: 330px;
        width: 420px; height: 420px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 78%);
        filter: blur(55px);
        pointer-events: none;
      }

      /* Crosshair SVG — anchored right */
      #t2-lb-cross .xhair-svg {
        position: absolute; right: 180px; top: 330px;
        width: 240px; height: 240px;
        overflow: visible;
      }

      /* Crosshair lines */
      #t2-lb-cross .xh-line {
        stroke: var(--accent);
        stroke-width: 1.5px;
        stroke-linecap: round;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.80))
                drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.38));
      }

      /* Gap in center for center-circle effect */
      #t2-lb-cross .xh-outer-ring {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.42);
        stroke-width: 1.5px;
        stroke-dasharray: 8 6;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.50));
      }

      /* Center dot */
      #t2-lb-cross .xh-center {
        fill: var(--accent);
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.90));
      }

      /* Small inner circle */
      #t2-lb-cross .xh-inner-ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.85));
      }

      /* Corner tick marks */
      #t2-lb-cross .xh-tick {
        stroke: rgba(var(--accent-rgb), 0.60);
        stroke-width: 1.5px;
        stroke-linecap: round;
      }

      /* Readout chip — floats top-left of the crosshair */
      #t2-lb-cross .readout-chip {
        position: absolute; right: 430px; top: 348px;
        padding: 6px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid rgba(var(--accent-rgb), 0.48);
        border-radius: var(--radius-sm);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.28),
                    inset 0 1px 0 rgba(255,255,255,0.14),
                    var(--glass-shadow);
        display: flex; align-items: center; gap: 10px;
        white-space: nowrap;
      }

      #t2-lb-cross .chip-label {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 13px; letter-spacing: var(--track-wide);
        color: var(--accent); text-transform: uppercase;
        text-shadow: var(--textglow-accent);
      }

      #t2-lb-cross .chip-value {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 24px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
      }

      /* Detail strip below crosshair */
      #t2-lb-cross .detail-wrap {
        position: absolute; right: 130px; top: 592px;
        padding: 8px 18px 8px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 460px;
      }

      #t2-lb-cross .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 22px; line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-cross" data-composition-id="t2-lb-cross" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <!-- Crosshair SVG: center at 120,120 in 240×240 viewBox -->
      <svg class="xhair-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer dashed ring -->
        <circle class="xh-outer-ring" cx="120" cy="120" r="100" />
        <!-- Inner ring -->
        <circle id="t2-lb-cross-inner" class="xh-inner-ring" cx="120" cy="120" r="24" />
        <!-- Crosshair lines — gap in center (20px gap each side) -->
        <!-- Top line -->
        <line id="t2-lb-cross-t" class="xh-line" x1="120" y1="8"  x2="120" y2="95" />
        <!-- Bottom line -->
        <line id="t2-lb-cross-b" class="xh-line" x1="120" y1="145" x2="120" y2="232" />
        <!-- Left line -->
        <line id="t2-lb-cross-l" class="xh-line" x1="8"   y1="120" x2="95"  y2="120" />
        <!-- Right line -->
        <line id="t2-lb-cross-r" class="xh-line" x1="145" y1="120" x2="232" y2="120" />
        <!-- Corner ticks (outer edge marks) -->
        <line class="xh-tick" x1="50"  y1="50"  x2="62"  y2="50"  />
        <line class="xh-tick" x1="50"  y1="50"  x2="50"  y2="62"  />
        <line class="xh-tick" x1="190" y1="50"  x2="178" y2="50"  />
        <line class="xh-tick" x1="190" y1="50"  x2="190" y2="62"  />
        <line class="xh-tick" x1="50"  y1="190" x2="62"  y2="190" />
        <line class="xh-tick" x1="50"  y1="190" x2="50"  y2="178" />
        <line class="xh-tick" x1="190" y1="190" x2="178" y2="190" />
        <line class="xh-tick" x1="190" y1="190" x2="190" y2="178" />
        <!-- Center dot -->
        <circle class="xh-center" cx="120" cy="120" r="4" />
      </svg>

      <!-- Readout chip -->
      <div class="readout-chip">
        <span class="chip-label">TGT</span>
        <span class="chip-value" data-slot="term">Token Budget</span>
      </div>

      <!-- Detail strip -->
      <div class="detail-wrap">
        <div class="detail-text" data-slot="detail">Maximum tokens the model can process in a single forward pass — cost and speed tradeoff.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-cross";

      /* Inner ring circumference for dashoffset animation */
      const innerCirc = 2 * Math.PI * 24; /* ~151px */
      const innerEl   = document.getElementById("t2-lb-cross-inner");
      if (innerEl) {
        innerEl.style.strokeDasharray  = innerCirc;
        innerEl.style.strokeDashoffset = innerCirc;
      }

      /* Local glow */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Corner ticks fade in */
        .from(`${COMP} .xh-tick`, {
            autoAlpha: 0, duration: 0.35, ease: "power2.out", stagger: 0.04 }, 0.10)

        /* Outer dashed ring */
        .from(`${COMP} .xh-outer-ring`, {
            autoAlpha: 0, scale: 0.88, transformOrigin: "120px 120px",
            duration: 0.55, ease: "power3.out" }, 0.15)

        /* Crosshair lines draw in from center outward */
        .from(`${COMP} #t2-lb-cross-t`, { scaleY: 0, transformOrigin: "120px 95px",  duration: 0.45, ease: "power3.out" }, 0.30)
        .from(`${COMP} #t2-lb-cross-b`, { scaleY: 0, transformOrigin: "120px 145px", duration: 0.45, ease: "power3.out" }, 0.30)
        .from(`${COMP} #t2-lb-cross-l`, { scaleX: 0, transformOrigin: "95px 120px",  duration: 0.45, ease: "power3.out" }, 0.30)
        .from(`${COMP} #t2-lb-cross-r`, { scaleX: 0, transformOrigin: "145px 120px", duration: 0.45, ease: "power3.out" }, 0.30)

        /* Inner ring draws on */
        .to(`${COMP} #t2-lb-cross-inner`, {
            strokeDashoffset: 0, duration: 0.50, ease: "power3.out" }, 0.55)

        /* Center dot pops */
        .from(`${COMP} .xh-center`, {
            autoAlpha: 0, scale: 0, transformOrigin: "120px 120px",
            duration: 0.30, ease: "back.out(2)" }, 0.90)

        /* Readout chip slides in */
        .from(`${COMP} .readout-chip`, {
            autoAlpha: 0, x: 20, filter: "blur(8px)",
            duration: 0.65, ease: "back.out(1.4)" }, 0.80)

        /* Detail strip glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 16, filter: "blur(7px)",
            duration: 0.62, ease: "power4.out" }, 1.10)

        /* Center dot finite pulse */
        .to(`${COMP} .xh-center`, {
            opacity: 0.30, duration: 0.8, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80)

        /* Chip glow pulse */
        .to(`${COMP} .readout-chip`, {
            boxShadow: "0 0 28px rgba(55,189,248,0.55), inset 0 1px 0 rgba(255,255,255,0.18), 0 24px 70px rgba(0,0,0,0.50)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.90)

        .set({}, {}, 7);

      window.__timelines["t2-lb-cross"] = tl;
    </script>
  </body>
</html>
