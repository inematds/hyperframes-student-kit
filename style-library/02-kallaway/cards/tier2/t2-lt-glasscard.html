<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · GLASSCARD
  Frosted glass name card anchored lower-left. A thin accent glow rim traces the
  card edge; name and role glide in after the card springs on-screen. Sits over
  live speaker footage — fully transparent background, only the card paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-glass {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the card only */
      #t2-lt-glass .local-bloom {
        position: absolute;
        left: 60px; bottom: 100px;
        width: 520px; height: 220px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 80%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 75%);
        filter: blur(30px);
        pointer-events: none;
        z-index: 1;
      }

      /* Main glass card */
      #t2-lt-glass .card {
        position: absolute;
        left: 80px; bottom: 120px;
        width: 460px;
        padding: 28px 36px 26px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.55),   /* accent glow rim */
          0 0 22px rgba(var(--accent-rgb), 0.22),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        /* inner top-highlight */
        overflow: hidden;
      }

      /* Hairline top-highlight shimmer strip */
      #t2-lt-glass .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 40%, rgba(255,255,255,0.55) 60%, transparent);
        border-radius: 1px;
      }

      #t2-lt-glass .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 8px;
        line-height: 1.1;
      }

      #t2-lt-glass .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      /* Accent dot before role */
      #t2-lt-glass .role::before {
        content: "";
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        margin-right: 10px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-glass"
         data-composition-id="t2-lt-glass"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="name" data-slot="name">Ronny Mitchell</div>
        <div class="role" data-slot="role">Head of Content Strategy</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* local bloom fades in softly */
      tl.from("#t2-lt-glass .local-bloom",
        { autoAlpha: 0, scale: 0.7, duration: 1.2, ease: "power2.out" }, 0);

      /* card springs in from lower-left */
      tl.from("#t2-lt-glass .card",
        { autoAlpha: 0, x: -40, y: 28, scale: 0.93,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.85, ease: "back.out(1.4)" }, 0.1);

      /* name glides in */
      tl.from("#t2-lt-glass .name",
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.65, ease: "power4.out" }, 0.55);

      /* role follows */
      tl.from("#t2-lt-glass .role",
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.60, ease: "power3.out" }, 0.72);

      /* gentle glow rim pulse — finite */
      tl.to("#t2-lt-glass .card",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.90), 0 0 36px rgba(55,189,248,0.38), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-glass"] = tl;
    </script>
  </body>
</html>
