<!doctype html>
<!--
  KALLAWAY · tier2 · label · NOTIFICATION TOAST
  A single glass notification toast: a horizontal row with a glowing icon badge,
  `term` (toast title) + `detail` (toast body/description). Slides in from the
  right edge. Anchored right side. Transparent overlay.
  Slots: term (~28 chars — title), detail (~60 chars — body line).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-toast {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — right side, elongated for wide toast */
      #t2-lb-toast .local-glow {
        position: absolute; right: 40px; top: 460px;
        width: 640px; height: 260px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
      }

      /* Toast bar — glass horizontal pill anchored right */
      #t2-lb-toast .toast {
        position: absolute; right: 80px; top: 488px;
        width: 560px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 28px rgba(var(--accent-rgb), 0.20),
                    inset 0 0 0 1px rgba(var(--accent-rgb), 0.06);
        border-radius: var(--radius); /* 28px — full pill feel */
        padding: 22px 26px;
        display: flex; flex-direction: row;
        align-items: center; gap: 20px;
        overflow: hidden;
      }

      /* Neon top-rim line */
      #t2-lb-toast .toast::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.72) 40%,
          rgba(var(--accent-rgb), 0.72) 60%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.48);
      }

      /* Left accent stripe */
      #t2-lb-toast .toast::after {
        content: "";
        position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px;
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.90) 0%, rgba(var(--accent-rgb), 0.40) 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.60);
        border-radius: 0 2px 2px 0;
      }

      /* Icon badge — rounded glass tile with a glyph */
      #t2-lb-toast .icon-badge {
        flex-shrink: 0;
        width: 52px; height: 52px;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1.5px solid rgba(var(--accent-rgb), 0.40);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.38),
                    inset 0 1px 0 rgba(255,255,255,0.12);
      }

      /* SVG icon inside the badge */
      #t2-lb-toast .icon-badge svg {
        width: 26px; height: 26px;
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.70));
      }

      /* Text column */
      #t2-lb-toast .toast-body {
        flex: 1; min-width: 0;
        display: flex; flex-direction: column; gap: 5px;
      }

      /* Term — toast title */
      #t2-lb-toast .toast-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 24px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* Detail — toast body */
      #t2-lb-toast .toast-detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 19px; line-height: 1.4; letter-spacing: 0.01em;
        color: var(--text-dim);
        display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
      }

      /* Timestamp chip — Space Mono, far right */
      #t2-lb-toast .timestamp {
        flex-shrink: 0;
        font-family: var(--font-mono); font-weight: 400;
        font-size: 16px; color: var(--text-faint);
        white-space: nowrap;
        align-self: flex-start; margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-toast"
         data-composition-id="t2-lb-toast"
         data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="toast">
        <!-- Icon badge: bell / notification SVG -->
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>

        <div class="toast-body">
          <div class="toast-title"  data-slot="term">New milestone reached</div>
          <div class="toast-detail" data-slot="detail">Your course crossed 10,000 enrolled students this week</div>
        </div>

        <div class="timestamp">just now</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const COMP = "#t2-lb-toast";
      const tl   = gsap.timeline({ paused: true });

      /* 1 — local glow materialises */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scaleX: 0.4, transformOrigin: "100% 50%",
            duration: 1.0, ease: "expo.out" }, 0)

        /* 2 — toast slides in from right + blur resolves */
        .from(`${COMP} .toast`, {
            autoAlpha: 0, x: 80, filter: "blur(14px)",
            duration: 0.72, ease: "back.out(1.4)" }, 0.18)

        /* 3 — icon badge scales in */
        .from(`${COMP} .icon-badge`, {
            autoAlpha: 0, scale: 0.50, filter: "blur(8px)",
            transformOrigin: "50% 50%",
            duration: 0.50, ease: "back.out(1.7)" }, 0.52)

        /* 4 — title fades up */
        .from(`${COMP} .toast-title`, {
            autoAlpha: 0, x: 16, filter: "blur(8px)",
            duration: 0.45, ease: "power4.out" }, 0.70)

        /* 5 — detail fades up */
        .from(`${COMP} .toast-detail`, {
            autoAlpha: 0, x: 12,
            duration: 0.42, ease: "power3.out" }, 0.86)

        /* 6 — timestamp fades in last */
        .from(`${COMP} .timestamp`, {
            autoAlpha: 0,
            duration: 0.30, ease: "power2.out" }, 1.00)

        /* 7 — icon badge glow pulse, finite */
        .to(`${COMP} .icon-badge`, {
            boxShadow: "0 0 26px rgba(55,189,248,0.65), inset 0 1px 0 rgba(255,255,255,0.12)",
            duration: 0.85, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.5)

        /* 8 — card glow pulse, finite (offset from icon pulse) */
        .to(`${COMP} .toast`, {
            boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 40px rgba(55,189,248,0.38), inset 0 0 0 1px rgba(55,189,248,0.14)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-toast"] = tl;
    </script>
  </body>
</html>
