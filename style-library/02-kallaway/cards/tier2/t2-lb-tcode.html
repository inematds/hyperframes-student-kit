<!doctype html>
<!--
  KALLAWAY · tier2 · label · TCODE
  A frame-timecode label — monospace readout (e.g. 00:14:22:08) renders as a
  glowing "interface" chip, with a term line beneath it in glass. Anchored right
  side over speaker footage; no full-screen backgrounds.
  Slots: term (~28 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-tcode {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow behind card */
      #t2-lb-tcode .local-glow {
        position: absolute; right: 120px; top: 320px;
        width: 480px; height: 280px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 0;
      }

      /* Wrapper anchored right */
      #t2-lb-tcode .wrapper {
        position: absolute; right: 140px; top: 360px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
        z-index: 2;
      }

      /* Timecode chip — dark glass + accent border */
      #t2-lb-tcode .tcode-chip {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 12px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.60);
        border-radius: var(--radius-sm);
        box-shadow:
          var(--glass-shadow),
          0 0 26px rgba(var(--accent-rgb), 0.32),
          inset 0 1px 0 var(--glass-hi);
        position: relative; overflow: hidden;
      }

      /* Hairline top shimmer */
      #t2-lb-tcode .tcode-chip::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      /* Blinking cursor-style indicator dot */
      #t2-lb-tcode .rec-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      /* The timecode string */
      #t2-lb-tcode .tcode-readout {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 42px;
        letter-spacing: 0.10em;
        color: var(--white);
        text-shadow: var(--textglow-accent);
        white-space: nowrap;
      }

      /* Label annotation beneath timecode */
      #t2-lb-tcode .detail-wrap {
        padding: 10px 20px 10px 18px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        max-width: 480px;
      }

      #t2-lb-tcode .term {
        font-family: var(--font-display);
        font-weight: var(--wt-semi);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 4px;
        text-align: right;
      }

      #t2-lb-tcode .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 20px;
        line-height: 1.45;
        color: var(--text-dim);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-tcode"
         data-composition-id="t2-lb-tcode"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="tcode-chip">
          <div class="rec-dot"></div>
          <div class="tcode-readout" data-slot="term">00:14:22:08</div>
        </div>
        <div class="detail-wrap">
          <div class="term">Key Moment</div>
          <div class="detail" data-slot="detail">The exact frame where the AI model begins predicting incorrectly — every time.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-tcode";

      /* Glow blooms in first */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
          duration: 1.1, ease: "expo.out" }, 0)

        /* Timecode chip slides in from right */
        .from(`${C} .tcode-chip`,
          { autoAlpha: 0, x: 50, scale: 0.92, transformOrigin: "right center",
            duration: 0.78, ease: "back.out(1.4)" }, 0.20)

        /* Detail card glides up */
        .from(`${C} .detail-wrap`,
          { autoAlpha: 0, y: 16, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.55)

        /* Rec-dot pulse — finite blink */
        .to(`${C} .rec-dot`,
          { autoAlpha: 0.15, duration: 0.45, ease: "sine.inOut", repeat: 5, yoyo: true }, 1.20)

        /* Border glow breathes */
        .to(`${C} .tcode-chip`,
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 46px rgba(55,189,248,0.55), inset 0 1px 0 rgba(255,255,255,0.22)",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-tcode"] = tl;
    </script>
  </body>
</html>
