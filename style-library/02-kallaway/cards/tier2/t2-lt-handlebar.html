<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · HANDLEBAR
  A social @handle bar anchored lower-left. A platform glyph (SVG icon, accent
  colored) leads the row; the @handle text types in character-by-character using
  a Space Mono clip-width reveal, giving a terminal typewriter feel over a minimal
  glass pill. Dark, narrow, clean — deliberately different from the wider glass cards.
  Slots: handle (~28 chars, include @), platform (~8 chars, e.g. "LinkedIn").
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-hndl {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-mono);
      }

      /* Localized glow — tight, behind the pill */
      #t2-lt-hndl .local-glow {
        position: absolute;
        left: 62px; bottom: 124px;
        width: 440px; height: 130px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.08) 55%,
          transparent 80%);
        filter: blur(24px);
        pointer-events: none;
        z-index: 1;
      }

      /* Pill container */
      #t2-lt-hndl .pill {
        position: absolute;
        left: 80px; bottom: 142px;
        display: inline-flex;
        align-items: center;
        gap: 0;
        height: 58px;
        border-radius: 999px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.45);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.22),
          0 0 28px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
      }

      /* Platform badge — filled left cap */
      #t2-lt-hndl .platform-cap {
        height: 58px;
        padding: 0 18px 0 22px;
        background: rgba(var(--accent-rgb), 0.15);
        border-right: var(--stroke) solid rgba(var(--accent-rgb), 0.40);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-shrink: 0;
      }

      /* SVG platform glyph — a generic "link" / at-sign SVG icon */
      #t2-lt-hndl .platform-icon {
        width: 22px; height: 22px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2;
        filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.70));
        flex-shrink: 0;
      }

      #t2-lt-hndl .platform-name {
        font-family: var(--font-body);
        font-weight: var(--wt-bold);
        font-size: 17px;
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        white-space: nowrap;
      }

      /* Handle text — typewriter clip reveal wrapper */
      #t2-lt-hndl .handle-wrap {
        overflow: hidden;
        display: flex;
        align-items: center;
        padding: 0 26px 0 20px;
      }

      #t2-lt-hndl .handle {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.02em;
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      /* Blinking cursor element */
      #t2-lt-hndl .cursor {
        display: inline-block;
        width: 2px; height: 28px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.85);
        margin-left: 3px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-hndl"
         data-composition-id="t2-lt-hndl"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="pill">
        <div class="platform-cap">
          <!-- at-sign / link glyph -->
          <svg class="platform-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M16 12a4 4 0 0 1 4 4v1a2 2 0 0 1-4 0v-1a4 4 0 0 0-8 0v1a2 2 0 0 1-4 0v-1a8 8 0 0 1 16 0"/>
          </svg>
          <span class="platform-name" data-slot="platform">LinkedIn</span>
        </div>
        <div class="handle-wrap">
          <span class="handle" data-slot="handle">@yourchannel</span>
          <span class="cursor" aria-hidden="true"></span>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lt-hndl";

      /* glow blooms in */
      tl.from(`${COMP} .local-glow`,
        { autoAlpha: 0, scale: 0.55, duration: 0.90, ease: "power2.out" }, 0);

      /* pill slides in from left */
      tl.from(`${COMP} .pill`,
        { autoAlpha: 0, x: -80, duration: 0.62, ease: "power4.out" }, 0.08);

      /* platform cap fades/scales in */
      tl.from(`${COMP} .platform-cap`,
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
          duration: 0.45, ease: "back.out(1.4)" }, 0.30);

      /* handle text: typewriter via clip-width on the wrapper */
      tl.fromTo(`${COMP} .handle-wrap`,
        { width: 0 },
        { width: 340, duration: 1.1, ease: "steps(28)" }, 0.62);

      /* cursor blinks finite then disappears */
      tl.to(`${COMP} .cursor`,
        { autoAlpha: 0, duration: 0.28, ease: "none", repeat: 7, yoyo: true }, 0.62);
      tl.to(`${COMP} .cursor`,
        { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 2.5);

      /* accent glow rim pulse — finite */
      tl.to(`${COMP} .pill`,
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.55), 0 0 42px rgba(55,189,248,0.35), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-hndl"] = tl;
    </script>
  </body>
</html>
