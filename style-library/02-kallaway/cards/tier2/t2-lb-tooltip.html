<!doctype html>
<!--
  KALLAWAY · tier2 · label · TOOLTIP
  A frosted glass tooltip bubble with a pointer tail, holding term + detail.
  Anchored right side, tail points left toward the subject. Transparent overlay.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-tip {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — right side, soft */
      #t2-lb-tip .local-glow {
        position: absolute; right: 80px; top: 320px;
        width: 540px; height: 360px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
      }

      /* Tooltip wrapper — right anchored */
      #t2-lb-tip .tooltip-wrap {
        position: absolute; right: 100px; top: 370px;
        display: flex; align-items: center;
      }

      /* The pointer tail — an SVG triangle pointing left toward the subject */
      #t2-lb-tip .tail-svg {
        width: 26px; height: 40px;
        flex-shrink: 0;
        margin-right: -1px; /* overlap bubble border by 1px */
        overflow: visible;
      }

      #t2-lb-tip .tail-path {
        fill: rgba(16, 22, 34, 0.55); /* matches glass-bg-dark */
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 1.5;
        stroke-linejoin: round;
      }

      /* Top edge neon highlight on tail */
      #t2-lb-tip .tail-top-stroke {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.55);
        stroke-width: 2;
        stroke-linecap: round;
      }

      /* Main bubble */
      #t2-lb-tip .bubble {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 0 1px rgba(var(--accent-rgb), 0.10),
                    0 0 32px rgba(var(--accent-rgb), 0.10);
        border-radius: var(--radius);
        padding: 28px 36px;
        max-width: 500px;
        overflow: hidden;
        position: relative;
      }

      /* Top neon rim on bubble */
      #t2-lb-tip .bubble::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.68) 40%,
          rgba(var(--accent-rgb), 0.68) 60%, transparent 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.48);
      }

      /* Term heading */
      #t2-lb-tip .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 34px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 12px;
      }

      /* Thin accent rule */
      #t2-lb-tip .rule {
        height: 2px; width: 100%;
        background: linear-gradient(90deg,
          var(--accent) 0%, rgba(var(--accent-rgb), 0.15) 100%);
        box-shadow: 0 0 7px rgba(var(--accent-rgb), 0.42);
        margin-bottom: 14px;
        transform-origin: left center;
      }

      /* Detail */
      #t2-lb-tip .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 24px; line-height: 1.5;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-tip" data-composition-id="t2-lb-tip" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="tooltip-wrap">
        <!-- Pointer tail (SVG triangle pointing left) -->
        <svg class="tail-svg" viewBox="0 0 26 40" xmlns="http://www.w3.org/2000/svg">
          <path class="tail-path" d="M26,4 L2,20 L26,36 Z" />
          <path class="tail-top-stroke" d="M26,4 L2,20" />
        </svg>

        <div class="bubble">
          <div class="term" data-slot="term">Temperature</div>
          <div class="rule"></div>
          <div class="detail" data-slot="detail">Controls output randomness — higher values trade coherence for creativity.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-tip";

      /* glow blooms in */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* whole tooltip (tail + bubble) springs in from right */
        .from(`${COMP} .tooltip-wrap`, {
            autoAlpha: 0, x: 60, filter: "blur(14px)",
            duration: 0.82, ease: "back.out(1.4)" }, 0.22)

        /* term fades up */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 12, filter: "blur(7px)",
            duration: 0.60, ease: "power4.out" }, 0.58)

        /* rule draws left→right */
        .from(`${COMP} .rule`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.52, ease: "power3.out" }, 0.78)

        /* detail fades up */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(5px)",
            duration: 0.60, ease: "power3.out" }, 0.94)

        /* finite bubble glow pulse */
        .to(`${COMP} .bubble`, {
            boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.32), 0 0 40px rgba(55,189,248,0.18)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.10)

        .set({}, {}, 7);

      window.__timelines["t2-lb-tip"] = tl;
    </script>
  </body>
</html>
