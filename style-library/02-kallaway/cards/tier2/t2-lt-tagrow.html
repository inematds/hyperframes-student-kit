<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · TAGROW
  A compact name line above a horizontal row of small glowing topic-tag chips
  that pop in staggered left-to-right. Each chip is an accent-bordered glass
  pill. Different from ratingname (no stars, free-text tags, horizontal scan).
  Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), tags (comma-separated topic chips, ≤6 tags).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-tagr {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom — wider to span the tag row */
      #t2-lt-tagr .local-bloom {
        position: absolute;
        left: 40px; bottom: 70px;
        width: 760px; height: 220px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 85%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 78%);
        filter: blur(38px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer stacked layout */
      #t2-lt-tagr .stack {
        position: absolute;
        left: 80px; bottom: 108px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        z-index: 2;
      }

      /* Name row — slim glass backing */
      #t2-lt-tagr .name-wrap {
        padding: 14px 30px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      #t2-lt-tagr .name-wrap::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.48) 50%, transparent);
      }

      #t2-lt-tagr .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        line-height: 1.0;
      }

      /* Tag row container */
      #t2-lt-tagr .tag-row {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 12px;
      }

      /* Individual tag chip */
      #t2-lt-tagr .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.10);
        border: 1.5px solid rgba(var(--accent-rgb), 0.50);
        box-shadow:
          0 0 16px rgba(var(--accent-rgb), 0.28),
          inset 0 1px 0 rgba(255,255,255,0.12),
          0 3px 12px rgba(0,0,0,0.40);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        white-space: nowrap;
      }

      /* Small dot accent inside tag */
      #t2-lt-tagr .tag-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.80);
        flex-shrink: 0;
      }

      #t2-lt-tagr .tag-text {
        font-family: var(--font-body);
        font-weight: var(--wt-semi);
        font-size: 20px;
        letter-spacing: 0.03em;
        color: var(--text);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-tagr"
         data-composition-id="t2-lt-tagr"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="stack">
        <div class="name-wrap">
          <div class="name" data-slot="name">Priya Nair</div>
        </div>
        <div class="tag-row" data-slot="tags">
          <div class="tag"><div class="tag-dot"></div><div class="tag-text">Prompt Engineering</div></div>
          <div class="tag"><div class="tag-dot"></div><div class="tag-text">LLM Alignment</div></div>
          <div class="tag"><div class="tag-dot"></div><div class="tag-text">RAG Systems</div></div>
          <div class="tag"><div class="tag-dot"></div><div class="tag-text">Fine-Tuning</div></div>
          <div class="tag"><div class="tag-dot"></div><div class="tag-text">AI Safety</div></div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-tagr";

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.62, duration: 1.1, ease: "power2.out" }, 0);

      /* name-wrap slides in from left */
      tl.from(`${C} .name-wrap`,
        { autoAlpha: 0, x: -42, filter: "blur(12px)",
          duration: 0.72, ease: "power4.out" }, 0.08);

      /* name text */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -14, filter: "blur(7px)",
          duration: 0.55, ease: "power3.out" }, 0.44);

      /* tags stagger pop in */
      const tags = document.querySelectorAll(`${C} .tag`);
      tags.forEach(function(tag, i) {
        tl.from(tag,
          { autoAlpha: 0, y: 22, scale: 0.72,
            transformOrigin: "center bottom",
            duration: 0.48, ease: "back.out(1.6)" },
          0.68 + i * 0.10);
      });

      /* tag row glow pulse — finite */
      tl.to(`${C} .tag`,
        { boxShadow: "0 0 26px rgba(55,189,248,0.50), inset 0 1px 0 rgba(255,255,255,0.18), 0 3px 12px rgba(0,0,0,0.40)",
          duration: 0.95, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-tagr"] = tl;
    </script>
  </body>
</html>
