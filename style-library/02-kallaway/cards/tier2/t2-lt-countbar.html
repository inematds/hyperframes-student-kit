<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · COUNTBAR
  Name card with a glowing metric row beneath — a small label + a number that
  counts up. Knob: data-target on the counting element (default 128000).
  The counter is Space Mono, accent-colored, and reaches its value with a
  power2.out ease. Transparent overlay over live footage.
  Slots: name (~26 chars), count (numeric target via data-target="128000").
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-cnt {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-cnt .local-bloom {
        position: absolute;
        left: 50px; bottom: 70px;
        width: 560px; height: 280px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 75%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(42px);
        pointer-events: none;
        z-index: 1;
      }

      /* Card */
      #t2-lt-cnt .card {
        position: absolute;
        left: 80px; bottom: 110px;
        width: 480px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.45),
          0 0 24px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
      }

      /* Top section: name */
      #t2-lt-cnt .name-row {
        padding: 26px 32px 18px;
      }

      #t2-lt-cnt .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
      }

      /* Divider */
      #t2-lt-cnt .divider {
        height: 1px;
        margin: 0 32px;
        background: linear-gradient(90deg,
          transparent,
          rgba(var(--accent-rgb), 0.40) 30%,
          rgba(var(--accent-rgb), 0.40) 70%,
          transparent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.30);
      }

      /* Bottom section: count */
      #t2-lt-cnt .count-row {
        padding: 14px 32px 22px;
        display: flex;
        align-items: baseline;
        gap: 14px;
      }

      #t2-lt-cnt .count-label {
        font-family: var(--font-mono);
        font-size: 15px;
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--text-faint);
      }

      #t2-lt-cnt .count-number {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: 0.04em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
      }

      #t2-lt-cnt .count-suffix {
        font-family: var(--font-mono);
        font-size: 20px;
        color: var(--text-dim);
        margin-left: 4px;
      }

      /* Top hairline shimmer */
      #t2-lt-cnt .card::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 40%,
                                     rgba(255,255,255,0.55) 60%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-cnt"
         data-composition-id="t2-lt-cnt"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="name-row">
          <div class="name" data-slot="name">Kallaway Osei</div>
        </div>
        <div class="divider"></div>
        <div class="count-row">
          <div class="count-label">FOLLOWERS</div>
          <div class="count-number" id="cnt-number" data-slot="count" data-target="128000">0</div>
          <div class="count-suffix">+</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-cnt";
      const numEl  = document.getElementById("cnt-number");
      const target = parseFloat(numEl.getAttribute("data-target")) || 128000;

      /* helper: format number with comma thousands separator */
      function fmt(n) {
        return Math.round(n).toLocaleString("en-US");
      }
      numEl.textContent = "0";

      /* bloom */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.1, ease: "expo.out" }, 0);

      /* card springs in */
      tl.from(`${C} .card`,
        { autoAlpha: 0, x: -38, y: 24, scale: 0.92,
          filter: "blur(14px)", transformOrigin: "left bottom",
          duration: 0.88, ease: "back.out(1.4)" }, 0.14);

      /* name */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -18, duration: 0.60, ease: "power4.out" }, 0.60);

      /* divider draws */
      tl.from(`${C} .divider`,
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.45, ease: "power2.out" }, 0.78);

      /* count row fades */
      tl.from(`${C} .count-row`,
        { autoAlpha: 0, y: 12, duration: 0.50, ease: "power3.out" }, 0.92);

      /* COUNT-UP: 3-arg .to on proxy — never fromTo */
      tl.to({ val: 0 }, {
        val: target,
        duration: 1.80,
        ease: "power2.out",
        onUpdate: function() {
          numEl.textContent = fmt(this.targets()[0].val);
        }
      }, 1.05);

      /* rim glow pulse — finite */
      tl.to(`${C} .card`, {
        boxShadow:
          "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.85), 0 0 38px rgba(55,189,248,0.38), inset 0 1px 0 rgba(255,255,255,0.22)",
        duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.00);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-cnt"] = tl;
    </script>
  </body>
</html>
