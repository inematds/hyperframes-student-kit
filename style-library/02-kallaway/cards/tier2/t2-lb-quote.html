<!doctype html>
<!--
  KALLAWAY · tier2 · label · PULL QUOTE
  A PULL QUOTE in a glass card with a glowing oversized accent quote mark.
  `term` is the quote text; `detail` is the attribution.
  Anchored left-of-center. Transparent overlay.
  Slots: term (~80 chars — quote), detail (~32 chars — attribution).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-quote {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — left, behind card */
      #t2-lb-quote .local-glow {
        position: absolute; left: 50px; top: 280px;
        width: 600px; height: 460px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 50%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 80%);
        filter: blur(40px);
        pointer-events: none;
      }

      /* Card anchored left */
      #t2-lb-quote .card {
        position: absolute; left: 80px; top: 300px;
        width: 540px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius);
        padding: 36px 36px 32px;
        position: absolute; left: 80px; top: 300px;
        width: 540px;
      }

      /* Oversized glowing quotation mark */
      #t2-lb-quote .quote-mark {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 120px; line-height: 0.7;
        color: var(--accent);
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.65))
                drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.40));
        user-select: none;
        display: block;
        margin-bottom: 10px;
        letter-spacing: -0.04em;
      }

      /* Quote text */
      #t2-lb-quote .quote-text {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi);
        font-size: 28px; line-height: 1.5;
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 22px;
      }

      /* Attribution row */
      #t2-lb-quote .attr-row {
        display: flex; align-items: center; gap: 12px;
      }
      #t2-lb-quote .attr-dash {
        width: 28px; height: 2px; border-radius: 1px; flex-shrink: 0;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        transform-origin: left center;
      }
      #t2-lb-quote .attribution {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 20px; letter-spacing: 0.04em;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-quote" data-composition-id="t2-lb-quote" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <span class="quote-mark">&ldquo;</span>
        <div class="quote-text" data-slot="term">The best prompt is the one users never have to write.</div>
        <div class="attr-row">
          <div class="attr-dash"></div>
          <div class="attribution" data-slot="detail">— Sam Altman, Open AI Summit</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-quote";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "40% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* card glides up from below */
        .from(`${COMP} .card`, {
            autoAlpha: 0, y: 40, filter: "blur(16px)",
            duration: 0.88, ease: "back.out(1.4)" }, 0.18)

        /* quote mark blooms in */
        .from(`${COMP} .quote-mark`, {
            autoAlpha: 0, scale: 0.4, filter: "blur(12px)",
            transformOrigin: "0% 0%",
            duration: 0.70, ease: "power4.out" }, 0.55)

        /* quote text appears word by word feel — simple y+fade */
        .from(`${COMP} .quote-text`, {
            autoAlpha: 0, y: 16, filter: "blur(8px)",
            duration: 0.72, ease: "power3.out" }, 0.80)

        /* attr dash draws */
        .from(`${COMP} .attr-dash`, {
            scaleX: 0, transformOrigin: "0% 50%",
            duration: 0.40, ease: "power3.out" }, 1.22)

        /* attribution fades */
        .from(`${COMP} .attribution`, {
            autoAlpha: 0, x: 10,
            duration: 0.40, ease: "power2.out" }, 1.46)

        /* quote mark glow breathe — finite */
        .to(`${COMP} .quote-mark`, {
            filter: "drop-shadow(0 0 36px rgba(55,189,248,0.85)) drop-shadow(0 0 14px rgba(55,189,248,0.50))",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t2-lb-quote"] = tl;
    </script>
  </body>
</html>
