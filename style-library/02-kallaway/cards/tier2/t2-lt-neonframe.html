<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · NEONFRAME
  Name/role inside a NEON-OUTLINED rounded frame (the outline draws/illuminates),
  on faint dark glass. Anchored lower-left.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-neon {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind card */
      #t2-lt-neon .local-bloom {
        position: absolute;
        left: 40px; bottom: 85px;
        width: 600px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 45% 80%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 74%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Neon frame container — uses SVG for the outline draw animation */
      #t2-lt-neon .frame-wrap {
        position: absolute;
        left: 80px; bottom: 110px;
        width: 500px;
        z-index: 2;
      }

      /* SVG neon outline — absolutely positioned over the card */
      #t2-lt-neon .neon-svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        overflow: visible;
      }

      #t2-lt-neon .neon-rect {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        rx: 28;
        /* stroke-dasharray set via JS to total perimeter */
      }

      /* Dark glass fill */
      #t2-lt-neon .card {
        position: relative;
        padding: 28px 36px 26px;
        background: rgba(10, 14, 20, 0.72);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: none; /* outline drawn by SVG */
        box-shadow: var(--glass-shadow);
        overflow: hidden;
      }

      /* Very faint inner top-highlight */
      #t2-lt-neon .card::before {
        content: "";
        position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35) 40%, rgba(255,255,255,0.35) 60%, transparent);
      }

      #t2-lt-neon .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 9px;
        line-height: 1.1;
      }

      #t2-lt-neon .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 23px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-neon"
         data-composition-id="t2-lt-neon"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="frame-wrap">
        <!-- SVG neon outline — rect matches card exactly -->
        <svg class="neon-svg" id="neon-svg-el">
          <rect class="neon-rect" id="neon-rect-el" x="1.25" y="1.25"
                width="497.5" height="100%"
                rx="28" ry="28" />
        </svg>

        <div class="card">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Measure card height after paint and set SVG height + perimeter */
      const frameWrap = document.querySelector("#t2-lt-neon .frame-wrap");
      const card      = document.querySelector("#t2-lt-neon .card");
      const rectEl    = document.getElementById("neon-rect-el");
      const svgEl     = document.getElementById("neon-svg-el");

      /* Use a fixed height matching the content — 116px for two lines */
      const cardH = 116;
      const cardW = 500;
      const rx = 28;
      /* Perimeter of rounded rect: 2*(W-2rx) + 2*(H-2rx) + 2*PI*rx */
      const perim = 2 * (cardW - 2 * rx) + 2 * (cardH - 2 * rx) + 2 * Math.PI * rx;

      if (rectEl) {
        rectEl.setAttribute("height", (cardH - 2.5) + "px");
        rectEl.setAttribute("stroke-dasharray", perim);
        rectEl.setAttribute("stroke-dashoffset", perim);
        /* Neon glow filter applied inline */
        svgEl.innerHTML = `
          <defs>
            <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3.5" result="blur1"/>
              <feGaussianBlur stdDeviation="8" result="blur2"/>
              <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect class="neon-rect" id="neon-rect-el2" x="1.25" y="1.25"
                width="497.5" height="${cardH - 2.5}px"
                rx="28" ry="28"
                fill="none"
                stroke="#37BDF8"
                stroke-width="2.5"
                filter="url(#neon-glow)"
                stroke-dasharray="${perim}"
                stroke-dashoffset="${perim}" />`;
      }

      /* bloom swells */
      tl.from("#t2-lt-neon .local-bloom",
        { autoAlpha: 0, scale: 0.60, duration: 1.2, ease: "power2.out" }, 0);

      /* card fades in (glass background) */
      tl.from("#t2-lt-neon .card",
        { autoAlpha: 0, y: 18, scale: 0.96,
          filter: "blur(10px)", transformOrigin: "center bottom",
          duration: 0.78, ease: "back.out(1.4)" }, 0.12);

      /* neon outline draws in via strokeDashoffset 0→perim animated in reverse */
      const dashObj = { offset: perim };
      tl.to(dashObj, {
        offset: 0, duration: 1.1, ease: "power3.out",
        onUpdate() {
          const r = document.getElementById("neon-rect-el2");
          if (r) r.setAttribute("stroke-dashoffset", dashObj.offset);
        }
      }, 0.25);

      /* name glides in */
      tl.from("#t2-lt-neon .name",
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.62, ease: "power4.out" }, 0.72);

      /* role follows */
      tl.from("#t2-lt-neon .role",
        { autoAlpha: 0, x: -14, filter: "blur(5px)",
          duration: 0.56, ease: "power3.out" }, 0.88);

      /* neon outline glow pulse — finite: animate opacity of the SVG */
      tl.to("#neon-svg-el",
        { opacity: 0.55, duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.7);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-neon"] = tl;
    </script>
  </body>
</html>
