<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · BUG
  A small broadcast "corner ID bug" anchored bottom-left. Compact rounded square
  glass badge: brand name stacked over a thin label line, with a pulsing live dot
  in the top-right corner of the badge. Minimal footprint — the smallest card in
  the tier2 set, meant to persist on-screen without distracting. Finite pulse.
  Slots: brand (~12 chars), label (~22 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-bug {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Tiny localized bloom — just a breath of light */
      #t2-lt-bug .local-bloom {
        position: absolute;
        left: 30px; bottom: 60px;
        width: 280px; height: 140px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 80%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 80%);
        filter: blur(20px);
        pointer-events: none;
        z-index: 1;
      }

      /* Bug badge */
      #t2-lt-bug .badge {
        position: absolute;
        left: 48px; bottom: 72px;
        width: 168px;
        padding: 16px 18px 14px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.28),
          0 0 18px rgba(var(--accent-rgb), 0.14),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
        position: absolute;
      }

      /* Inner top-highlight */
      #t2-lt-bug .badge::before {
        content: "";
        position: absolute; top: 0; left: 8px; right: 8px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45) 50%, transparent);
      }

      /* Live dot — top-right corner */
      #t2-lt-bug .live-dot {
        position: absolute;
        top: 10px; right: 12px;
        width: 9px; height: 9px;
        border-radius: 50%;
        background: #FF3B30;
        box-shadow:
          0 0 6px rgba(255,59,48, 0.85),
          0 0 14px rgba(255,59,48, 0.50);
      }

      #t2-lt-bug .brand {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 26px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        padding-right: 14px; /* avoid dot overlap */
      }

      /* Thin divider */
      #t2-lt-bug .divider {
        height: 1px;
        background: rgba(255,255,255,0.10);
        margin: 8px 0 7px;
      }

      #t2-lt-bug .label {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 15px;
        letter-spacing: 0.03em;
        color: var(--text-dim);
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: var(--track-wide);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-bug"
         data-composition-id="t2-lt-bug"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="badge">
        <div class="live-dot"></div>
        <div class="brand" data-slot="brand">Kallaway</div>
        <div class="divider"></div>
        <div class="label" data-slot="label">AI Course</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lt-bug";

      /* bloom fades in */
      tl.from(`${COMP} .local-bloom`,
        { autoAlpha: 0, scale: 0.50, duration: 0.90, ease: "power2.out" }, 0);

      /* badge pops in with spring */
      tl.from(`${COMP} .badge`,
        { autoAlpha: 0, scale: 0.80, y: 20,
          filter: "blur(8px)", transformOrigin: "left bottom",
          duration: 0.60, ease: "back.out(1.7)" }, 0.10);

      /* brand glides in */
      tl.from(`${COMP} .brand`,
        { autoAlpha: 0, y: -10, duration: 0.42, ease: "power3.out" }, 0.46);

      /* divider draws in */
      tl.from(`${COMP} .divider`,
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.30, ease: "power2.out" }, 0.62);

      /* label fades in */
      tl.from(`${COMP} .label`,
        { autoAlpha: 0, y: 8, duration: 0.38, ease: "power3.out" }, 0.72);

      /* live dot appears */
      tl.from(`${COMP} .live-dot`,
        { autoAlpha: 0, scale: 0, duration: 0.30, ease: "back.out(2.5)" }, 0.55);

      /* live dot pulses — finite (red glow, the one alert color allowed) */
      tl.to(`${COMP} .live-dot`,
        { boxShadow: "0 0 12px rgba(255,59,48,1.00), 0 0 26px rgba(255,59,48,0.70)",
          scale: 1.25,
          duration: 0.75, ease: "sine.inOut", repeat: 5, yoyo: true }, 1.2);

      /* badge glow rim pulse — finite */
      tl.to(`${COMP} .badge`,
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.45), 0 0 26px rgba(55,189,248,0.22), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-bug"] = tl;
    </script>
  </body>
</html>
