<!doctype html>
<!--
  KALLAWAY · tier2 · label · TAKEAWAY
  A glowing glass pill labeled in `term` (e.g. "BIG TAKEAWAY") above a `detail`
  body — a highlighted-insight callout. Anchored left-of-center, transparent bg.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-take {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow behind the card — contained, not full-canvas */
      #t2-lb-take .local-glow {
        position: absolute; left: 72px; top: 340px;
        width: 560px; height: 320px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(32px);
        pointer-events: none;
      }

      /* Wrapper anchored left side */
      #t2-lb-take .card {
        position: absolute; left: 80px; top: 360px;
        width: 520px;
      }

      /* The glowing pill label */
      #t2-lb-take .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 8px 22px; border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.15);
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.35),
                    inset 0 1px 0 rgba(255,255,255,0.18);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        margin-bottom: 16px;
      }
      #t2-lb-take .pill-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }
      #t2-lb-take .pill-text {
        font-family: var(--font-body); font-weight: var(--wt-bold);
        font-size: 17px; letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Detail body in dark glass card */
      #t2-lb-take .body-card {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius);
        padding: 28px 32px;
      }

      /* Accent left rule */
      #t2-lb-take .rule {
        width: 3px; height: 100%; position: absolute;
        left: 0; top: 0; border-radius: 2px;
        background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
        box-shadow: var(--glow-accent);
      }
      #t2-lb-take .body-inner {
        position: relative; padding-left: 20px;
      }

      #t2-lb-take .detail {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-body); line-height: 1.45;
        color: var(--text); text-shadow: var(--textglow);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-take" data-composition-id="t2-lb-take" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="card">
        <div class="pill">
          <div class="pill-dot"></div>
          <div class="pill-text" data-slot="term">BIG TAKEAWAY</div>
        </div>
        <div class="body-card">
          <div class="body-inner">
            <div class="rule"></div>
            <div class="detail" data-slot="detail">The models that win aren't the smartest — they're the ones you actually trust.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-take";

      /* glow blooms in before card arrives */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%",
            duration: 1.2, ease: "power4.out" }, 0)

        /* pill springs down from above with blur-in */
        .from(`${COMP} .pill`, {
            autoAlpha: 0, y: -22, filter: "blur(8px)",
            duration: 0.72, ease: "back.out(1.4)" }, 0.25)

        /* body card glides up with spring */
        .from(`${COMP} .body-card`, {
            autoAlpha: 0, y: 28, filter: "blur(12px)",
            duration: 0.85, ease: "back.out(1.4)" }, 0.50)

        /* rule draws down */
        .from(`${COMP} .rule`, {
            scaleY: 0, transformOrigin: "50% 0%",
            duration: 0.55, ease: "power3.out" }, 0.70)

        /* detail fades in */
        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10, filter: "blur(6px)",
            duration: 0.60, ease: "power3.out" }, 0.82)

        /* finite glow pulse on pill border */
        .to(`${COMP} .pill`, {
            boxShadow: "0 0 32px rgba(55,189,248,0.60), inset 0 1px 0 rgba(255,255,255,0.18)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-take"] = tl;
    </script>
  </body>
</html>
