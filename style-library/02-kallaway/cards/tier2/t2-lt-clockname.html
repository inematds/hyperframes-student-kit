<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · CLOCKNAME
  Name card with a live-style timestamp chip in Space Mono. The chip sits
  above-right, showing hours:minutes:seconds frozen at a plausible time (no
  Date.now() — deterministic). A colon-blink within the timestamp gives the
  "live broadcast" tick (finite repeat). The name card is frosted glass.
  Slots: name (~26 chars), timestamp (~11 chars, e.g. "09:41:22 UTC").
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-clock {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Bloom behind the component */
      #t2-lt-clock .local-bloom {
        position: absolute;
        left: 50px; bottom: 85px;
        width: 540px; height: 270px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 75%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 76%);
        filter: blur(38px);
        pointer-events: none;
        z-index: 1;
      }

      /* Container — stacks timestamp chip above the name card */
      #t2-lt-clock .container {
        position: absolute;
        left: 80px; bottom: 110px;
        display: flex; flex-direction: column;
        align-items: flex-start; gap: 10px;
        z-index: 2;
      }

      /* Timestamp chip — mono, minimal, "interface" voice */
      #t2-lt-clock .ts-chip {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 18px 7px 14px;
        background: rgba(var(--accent-rgb), 0.09);
        border: 1.5px solid rgba(var(--accent-rgb), 0.48);
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.28),
                    inset 0 1px 0 rgba(255,255,255,0.14);
      }

      /* Record dot */
      #t2-lt-clock .rec-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.90),
                    0 0 18px rgba(var(--accent-rgb), 0.50);
        flex-shrink: 0;
      }

      #t2-lt-clock .ts-text {
        font-family: var(--font-mono);
        font-size: 20px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.10em;
        color: var(--accent);
        text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.65);
        white-space: nowrap;
      }

      /* Colons inside timestamp animate opacity for "tick" */
      #t2-lt-clock .ts-colon {
        /* handled by GSAP; starts visible */
      }

      /* Main glass name card */
      #t2-lt-clock .card {
        padding: 24px 40px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.40),
          0 0 22px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        position: relative; overflow: hidden;
      }

      #t2-lt-clock .card::before {
        content: "";
        position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.52) 60%, transparent);
      }

      #t2-lt-clock .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-clock"
         data-composition-id="t2-lt-clock"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="container">

        <div class="ts-chip">
          <div class="rec-dot"></div>
          <div class="ts-text">
            <span data-slot="timestamp">09<span class="ts-colon">:</span>41<span class="ts-colon">:</span>22 UTC</span>
          </div>
        </div>

        <div class="card">
          <div class="name" data-slot="name">Simone Okafor</div>
        </div>

      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom in */
      tl.from("#t2-lt-clock .local-bloom",
        { autoAlpha: 0, scale: 0.70, duration: 1.1, ease: "power2.out" }, 0);

      /* chip drops in from above */
      tl.from("#t2-lt-clock .ts-chip",
        { autoAlpha: 0, y: -18, filter: "blur(8px)",
          duration: 0.62, ease: "back.out(1.4)" }, 0.12);

      /* card springs up */
      tl.from("#t2-lt-clock .card",
        { autoAlpha: 0, y: 22, scale: 0.95,
          filter: "blur(10px)", transformOrigin: "left bottom",
          duration: 0.72, ease: "back.out(1.4)" }, 0.38);

      /* name glides */
      tl.from("#t2-lt-clock .name",
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.60, ease: "power4.out" }, 0.76);

      /* colon blink — "live" tick, finite */
      tl.to("#t2-lt-clock .ts-colon",
        { autoAlpha: 0.15, duration: 0.50, ease: "none",
          repeat: 7, yoyo: true }, 1.20);

      /* rec dot glow pulse — finite */
      tl.to("#t2-lt-clock .rec-dot",
        { boxShadow:
            "0 0 14px rgba(55,189,248,1.0), 0 0 30px rgba(55,189,248,0.65)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      /* card rim glow breathes — finite */
      tl.to("#t2-lt-clock .card",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.80), 0 0 36px rgba(55,189,248,0.36), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-clock"] = tl;
    </script>
  </body>
</html>
