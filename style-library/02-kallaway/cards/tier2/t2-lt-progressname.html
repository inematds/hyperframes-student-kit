<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · PROGRESSNAME
  A name card with a thin talk-progress bar running beneath it. The bar fills
  left-to-right over the card's hold duration (simulating how long the speaker
  has been talking). The bar track is a hairline dark glass line; the fill is an
  accent glow gradient. Sits over live footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-pname {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-pname .local-bloom {
        position: absolute;
        left: 50px; bottom: 85px;
        width: 580px; height: 210px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 42% 80%,
          rgba(var(--accent-rgb), 0.25) 0%,
          rgba(var(--accent-rgb), 0.07) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer wrapper — card + bar stacked */
      #t2-lt-pname .wrapper {
        position: absolute;
        left: 80px; bottom: 120px;
        z-index: 2;
        min-width: 420px;
      }

      /* Main glass card */
      #t2-lt-pname .card {
        padding: 22px 34px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius) var(--radius) 0 0;
        border: var(--stroke) solid var(--glass-border);
        border-bottom: none;
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.40),
          0 0 18px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      /* Inner highlight */
      #t2-lt-pname .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      #t2-lt-pname .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 7px;
        line-height: 1.0;
      }

      #t2-lt-pname .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.2;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      /* Accent dot before role */
      #t2-lt-pname .role-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      /* Progress bar track — sits flush below the card */
      #t2-lt-pname .bar-track {
        height: 5px;
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 0 0 4px 4px;
        border: var(--stroke) solid rgba(255, 255, 255, 0.08);
        border-top: none;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* Bar fill — animates via scaleX 0→1 using transformOrigin left */
      #t2-lt-pname .bar-fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.90) 0%,
          rgba(var(--accent-rgb), 0.60) 60%,
          rgba(var(--accent-rgb), 0.20) 100%);
        box-shadow:
          0 0 6px rgba(var(--accent-rgb), 0.80),
          0 0 16px rgba(var(--accent-rgb), 0.45);
        border-radius: 0 0 4px 0;
      }

      /* Glowing leading-edge tip that rides the fill */
      #t2-lt-pname .bar-tip {
        position: absolute;
        top: -3px; bottom: -3px;
        width: 10px;
        background: rgba(255,255,255,0.90);
        box-shadow:
          0 0 6px rgba(255,255,255,0.80),
          0 0 14px rgba(var(--accent-rgb), 0.80);
        border-radius: 2px;
        /* JS positions this via left % */
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-pname"
         data-composition-id="t2-lt-pname"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="wrapper" id="pname-wrapper">
        <div class="card">
          <div class="name" data-slot="name">Elena Torres</div>
          <div class="role">
            <div class="role-dot"></div>
            <span data-slot="role">AI Products &amp; Growth, AIS Labs</span>
          </div>
        </div>
        <!-- Progress bar track beneath the card -->
        <div class="bar-track">
          <div class="bar-fill" id="pname-bar-fill"></div>
          <div class="bar-tip"  id="pname-bar-tip"></div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-pname";
      const fillEl = document.getElementById("pname-bar-fill");
      const tipEl  = document.getElementById("pname-bar-tip");

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.60, duration: 1.1, ease: "power2.out" }, 0);

      /* card springs in */
      tl.from(`${C} .card`,
        { autoAlpha: 0, x: -34, y: 22, scale: 0.93,
          filter: "blur(11px)", transformOrigin: "left bottom",
          duration: 0.80, ease: "back.out(1.4)" }, 0.10);

      /* name glides */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.62, ease: "power4.out" }, 0.56);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -14, filter: "blur(5px)",
          duration: 0.55, ease: "power3.out" }, 0.74);

      /* bar track fades in */
      tl.from(`${C} .bar-track`,
        { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.90);

      /* bar fills from left to right over a long hold — scaleX 0→1 */
      /* Also moves the tip from 0% to 100% via a proxy to keep tip in sync */
      const barProxy = { pct: 0 };
      tl.to(barProxy, {
        pct: 100,
        duration: 4.8,
        ease: "power1.inOut",
        onUpdate: function() {
          const p = barProxy.pct;
          /* scaleX on fill */
          if (fillEl) fillEl.style.transform = `scaleX(${p / 100})`;
          /* tip moves left position (as fraction of wrapper width) */
          /* wrapper is min 420px wide; use % relative to itself */
          if (tipEl) tipEl.style.left = `calc(${p}% - 5px)`;
        }
      }, 1.05);

      /* card glow rim pulse — finite */
      tl.to(`${C} .card`, {
        boxShadow:
          "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.80), 0 0 28px rgba(55,189,248,0.42), inset 0 1px 0 rgba(255,255,255,0.22)",
        duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-pname"] = tl;
    </script>
  </body>
</html>
