<!doctype html>
<!--
  KALLAWAY · tier2 · label · RIBBON
  A small glowing ribbon label — a horizontal glowing band with a bold term on it
  and a detail line beneath in frosted glass. The ribbon has a folded-corner accent
  on the right end. Anchored right side.
  Slots: term (~24 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-rib {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — right side */
      #t2-lb-rib .local-glow {
        position: absolute; right: 80px; top: 370px;
        width: 520px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 60% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(46px);
        pointer-events: none;
      }

      /* Wrapper anchored right */
      #t2-lb-rib .wrapper {
        position: absolute; right: 120px; top: 400px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
      }

      /* The ribbon band */
      #t2-lb-rib .ribbon {
        position: relative;
        display: flex; align-items: center;
        padding: 14px 48px 14px 32px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.28) 60%,
          rgba(var(--accent-rgb), 0.14) 100%);
        border-top: 1.5px solid rgba(var(--accent-rgb), 0.65);
        border-bottom: 1.5px solid rgba(var(--accent-rgb), 0.40);
        border-left: 1.5px solid rgba(var(--accent-rgb), 0.35);
        border-right: none;
        box-shadow:
          0 0 30px rgba(var(--accent-rgb), 0.40),
          inset 0 1px 0 rgba(255,255,255,0.20),
          0 4px 22px rgba(0,0,0,0.50);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        /* clip the right corner notch via clip-path */
        clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
        min-width: 320px;
      }

      /* Faint inner shimmer along top */
      #t2-lb-rib .ribbon::before {
        content: "";
        position: absolute; top: 0; left: 20px; right: 28px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 50%, transparent);
      }

      /* Ribbon label text */
      #t2-lb-rib .ribbon-term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 32px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap; position: relative; z-index: 1;
      }

      /* Glowing left edge bar */
      #t2-lb-rib .edge-bar {
        position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.90) 0%, rgba(var(--accent-rgb), 0.40) 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.70);
        border-radius: 2px 0 0 2px;
      }

      /* Detail glass block */
      #t2-lb-rib .detail-wrap {
        padding: 12px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.16);
        max-width: 440px;
        text-align: right;
        position: relative; overflow: hidden;
      }

      #t2-lb-rib .detail-wrap::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.36) 50%, transparent);
      }

      #t2-lb-rib .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.45; color: var(--text-dim);
      }

      #t2-lb-rib .term {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 22px; color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 3px;
        display: none; /* term is on the ribbon itself; detail-wrap shows detail only */
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-rib" data-composition-id="t2-lb-rib" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="ribbon">
          <div class="edge-bar"></div>
          <div class="ribbon-term" data-slot="term">Key Insight</div>
        </div>
        <div class="detail-wrap">
          <div class="detail" data-slot="detail">AI-assisted learning cuts study time by half</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-rib";

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "60% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* ribbon wipes in from right (scaleX 0→1 with transform-origin right) */
        .from(`${COMP} .ribbon`, {
            autoAlpha: 0, scaleX: 0, transformOrigin: "right center",
            duration: 0.65, ease: "power4.out" }, 0.18)

        /* edge bar draws down */
        .from(`${COMP} .edge-bar`, {
            scaleY: 0, transformOrigin: "50% top",
            duration: 0.55, ease: "power3.out" }, 0.22)

        /* term text fades in */
        .from(`${COMP} .ribbon-term`, {
            autoAlpha: 0, x: 16, filter: "blur(8px)",
            duration: 0.55, ease: "power3.out" }, 0.42)

        /* detail glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.58)

        /* ribbon glow pulse — finite */
        .to(`${COMP} .ribbon`, {
            boxShadow: "0 0 50px rgba(55,189,248,0.60), inset 0 1px 0 rgba(255,255,255,0.26), 0 4px 22px rgba(0,0,0,0.50)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80)

        .set({}, {}, 7);

      window.__timelines["t2-lb-rib"] = tl;
    </script>
  </body>
</html>
