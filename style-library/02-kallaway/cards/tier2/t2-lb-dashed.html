<!doctype html>
<!--
  KALLAWAY · tier2 · label · DASHED CONNECTOR
  A glass card (term/detail) with a dashed connector line and a glowing
  end-dot that trails toward the subject. The line draws in (scaleX 0→1).
  Anchored right side; connector trails left toward the speaker.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-dash {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — right side */
      #t2-lb-dash .local-glow {
        position: absolute; right: 50px; top: 370px;
        width: 600px; height: 360px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.17) 0%,
          rgba(var(--accent-rgb), 0.05) 55%,
          transparent 80%);
        filter: blur(38px);
        pointer-events: none;
      }

      /* Connector row — holds the dot + dashed line to the left of the card */
      #t2-lb-dash .connector-row {
        position: absolute; right: 460px; top: 510px;
        display: flex; align-items: center;
        /* line draws left from card edge toward center */
        width: 560px;
      }

      /* End-dot that glows (left end, nearest subject) */
      #t2-lb-dash .end-dot {
        width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
        background: var(--accent);
        box-shadow: var(--glow-accent), 0 0 0 4px rgba(var(--accent-rgb), 0.18);
      }

      /* Dashed line SVG — draws in via stroke-dashoffset */
      #t2-lb-dash .dash-line {
        flex: 1; height: 2px; overflow: visible;
      }

      /* Start-dot at card edge (right end) */
      #t2-lb-dash .start-dot {
        width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        background: rgba(var(--accent-rgb), 0.55);
        box-shadow: var(--glow-accent-sm);
      }

      /* Card anchored right */
      #t2-lb-dash .card {
        position: absolute; right: 80px; top: 400px;
        width: 460px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius);
        padding: 28px 30px;
      }

      #t2-lb-dash .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 32px; letter-spacing: var(--track-tight);
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 12px;
      }

      #t2-lb-dash .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 24px; line-height: 1.5;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-dash" data-composition-id="t2-lb-dash" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <!-- Connector: end-dot (subject side) → dashed line → start-dot (card side) -->
      <div class="connector-row">
        <div class="end-dot"></div>
        <svg class="dash-line" viewBox="0 0 530 2" preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg">
          <line id="dash-path" x1="0" y1="1" x2="530" y2="1"
            stroke="rgba(55,189,248,0.55)" stroke-width="2"
            stroke-dasharray="8 6"
            stroke-linecap="round"
            style="filter: drop-shadow(0 0 4px rgba(55,189,248,0.45))" />
        </svg>
        <div class="start-dot"></div>
      </div>

      <div class="card">
        <div class="term" data-slot="term">Latency Cliff</div>
        <div class="detail" data-slot="detail">Response times above 800 ms trigger a measurable drop in perceived intelligence — even if accuracy is identical.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-dash";

      /* measure dash line for stroke-dashoffset animation */
      const lineEl = document.getElementById("dash-path");
      /* line total length — draw-in from right (card end) toward left (dot end) */
      const lineLen = 530;
      gsap.set(lineEl, { strokeDashoffset: lineLen, strokeDasharray: `${lineLen} ${lineLen}` });

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.2, ease: "expo.out" }, 0)

        /* end-dot glows on first */
        .from(`${COMP} .end-dot`, {
            autoAlpha: 0, scale: 0,
            duration: 0.40, ease: "back.out(2.0)" }, 0.22)

        /* dash line draws left→right (stroke-dashoffset 530→0) */
        .to(lineEl, {
            strokeDashoffset: 0,
            duration: 0.68, ease: "power3.out" }, 0.52)

        /* start-dot pops on at line end */
        .from(`${COMP} .start-dot`, {
            autoAlpha: 0, scale: 0,
            duration: 0.30, ease: "back.out(2.0)" }, 1.15)

        /* card springs in from right */
        .from(`${COMP} .card`, {
            autoAlpha: 0, x: 40, filter: "blur(14px)",
            duration: 0.80, ease: "back.out(1.4)" }, 1.20)

        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 12, filter: "blur(6px)",
            duration: 0.55, ease: "power3.out" }, 1.50)

        .from(`${COMP} .detail`, {
            autoAlpha: 0, y: 10,
            duration: 0.50, ease: "power2.out" }, 1.72)

        /* end-dot pulse — finite */
        .to(`${COMP} .end-dot`, {
            boxShadow: "0 0 40px rgba(55,189,248,0.75), 0 0 80px rgba(55,189,248,0.40), 0 0 0 6px rgba(55,189,248,0.22)",
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4)

        .set({}, {}, 7);

      window.__timelines["t2-lb-dash"] = tl;
    </script>
  </body>
</html>
