<!doctype html>
<!--
  KALLAWAY · tier2 · label · UNDERLINE
  A term displayed large with a glowing animated underline that draws in beneath it.
  Detail appears below on a slim dark glass underlay. Anchored left side.
  Transparent overlay — only the element paints.
  Slots: term (~24 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-uline {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — left side */
      #t2-lb-uline .local-glow {
        position: absolute; left: 60px; top: 360px;
        width: 580px; height: 360px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(44px);
        pointer-events: none;
      }

      /* Wrapper anchored left */
      #t2-lb-uline .wrapper {
        position: absolute; left: 80px; top: 390px;
        display: flex; flex-direction: column; gap: 14px;
      }

      /* Term + underline block */
      #t2-lb-uline .term-block {
        position: relative;
        display: inline-block;
      }

      /* Slim dark glass underlay behind the term so it reads on bright footage */
      #t2-lb-uline .term-underlay {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius-sm);
        padding: 16px 32px 22px;
        overflow: hidden;
        position: relative;
      }

      /* Top neon rim on term underlay */
      #t2-lb-uline .term-underlay::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.80) 0%, rgba(var(--accent-rgb), 0.30) 70%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.50);
      }

      /* Term text */
      #t2-lb-uline .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 52px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        display: block;
      }

      /* Animated underline — drawn via scaleX from 0 */
      #t2-lb-uline .underline-bar {
        position: absolute;
        bottom: 8px; left: 32px; right: 32px;
        height: 4px; border-radius: 2px;
        background: linear-gradient(90deg,
          var(--accent) 0%, rgba(var(--accent-rgb), 0.25) 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.65),
                    0 0 28px rgba(var(--accent-rgb), 0.35);
        transform-origin: left center;
        transform: scaleX(0);
      }

      /* Detail card — slim dark glass */
      #t2-lb-uline .detail-card {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        padding: 14px 28px;
        max-width: 560px;
      }

      #t2-lb-uline .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 24px; line-height: 1.5;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-uline" data-composition-id="t2-lb-uline" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="term-block">
          <div class="term-underlay">
            <span class="term" data-slot="term">Hallucination</span>
            <div class="underline-bar"></div>
          </div>
        </div>

        <div class="detail-card">
          <div class="detail" data-slot="detail">When a model outputs fluent, confident text that is factually incorrect or fabricated.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-uline";

      /* glow blooms in */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* term underlay glides in from left with blur */
        .from(`${COMP} .term-underlay`, {
            autoAlpha: 0, x: -44, filter: "blur(12px)",
            duration: 0.80, ease: "back.out(1.4)" }, 0.22)

        /* term text fades in with focus pull */
        .from(`${COMP} .term`, {
            autoAlpha: 0, y: 10, filter: "blur(8px)",
            duration: 0.62, ease: "power4.out" }, 0.50)

        /* underline draws left→right */
        .to(`${COMP} .underline-bar`, {
            scaleX: 1,
            duration: 0.65, ease: "power3.out" }, 0.78)

        /* pulse the underline glow — finite */
        .to(`${COMP} .underline-bar`, {
            boxShadow: "0 0 22px rgba(55,189,248,0.85), 0 0 50px rgba(55,189,248,0.45)",
            duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.55)

        /* detail glides up */
        .from(`${COMP} .detail-card`, {
            autoAlpha: 0, y: 18, filter: "blur(8px)",
            duration: 0.68, ease: "power4.out" }, 0.96)

        .set({}, {}, 7);

      window.__timelines["t2-lb-uline"] = tl;
    </script>
  </body>
</html>
