<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · RIBBON
  An angled glowing ribbon nameplate anchored lower-left. The ribbon is a
  parallelogram shape with an accent neon edge — name sits large on the ribbon,
  role on a smaller secondary band below it, both bands angled ~-3°. A neon rim
  traces the top edge of the primary band. Entirely different layout mechanic from
  all the rectangular / pill lower-thirds. Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-rib {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-rib .local-bloom {
        position: absolute;
        left: 30px; bottom: 88px;
        width: 700px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 28% 90%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* The angled wrapper — skewed to create parallelogram */
      #t2-lt-rib .ribbon-wrap {
        position: absolute;
        left: 60px; bottom: 118px;
        z-index: 2;
        transform: skewX(-3deg);
        transform-origin: left bottom;
      }

      /* Primary ribbon band */
      #t2-lt-rib .band-primary {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-top: 3px solid var(--accent);
        border-right: var(--stroke) solid rgba(var(--accent-rgb), 0.40);
        border-bottom: var(--stroke) solid rgba(var(--accent-rgb), 0.20);
        border-left: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 0 rgba(var(--accent-rgb), 0),
          0 0 32px rgba(var(--accent-rgb), 0.20),
          inset 0 1px 0 var(--glass-hi);
        padding: 16px 52px 14px 28px;
        position: relative;
        overflow: hidden;
      }

      /* Top neon glow streak above border */
      #t2-lt-rib .band-primary::before {
        content: "";
        position: absolute; top: -5px; left: 0; right: 0; height: 5px;
        background: linear-gradient(90deg,
          var(--accent),
          rgba(var(--accent-rgb), 0.50) 55%,
          transparent 85%);
        filter: blur(3px);
        border-radius: 2px;
      }

      #t2-lt-rib .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
        /* counter-skew the text so it reads straight */
        transform: skewX(3deg);
        display: inline-block;
      }

      /* Secondary role band — narrower, dimmer */
      #t2-lt-rib .band-secondary {
        background: rgba(var(--accent-rgb), 0.10);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-right: var(--stroke) solid rgba(var(--accent-rgb), 0.30);
        border-bottom: var(--stroke) solid rgba(var(--accent-rgb), 0.25);
        border-left: var(--stroke) solid var(--glass-border);
        padding: 8px 52px 8px 28px;
        margin-top: -1px;
        position: relative;
      }

      #t2-lt-rib .role {
        font-family: var(--font-body);
        font-weight: var(--wt-semi);
        font-size: 20px;
        letter-spacing: 0.02em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        white-space: nowrap;
        /* counter-skew */
        transform: skewX(3deg);
        display: inline-block;
      }

      /* Right accent corner element */
      #t2-lt-rib .corner-accent {
        position: absolute;
        right: -2px; top: 0; bottom: 0;
        width: 4px;
        background: linear-gradient(180deg,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.30) 60%,
          transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.70);
        border-radius: 0 2px 2px 0;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-rib"
         data-composition-id="t2-lt-rib"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="ribbon-wrap">
        <div class="band-primary">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="corner-accent"></div>
        </div>
        <div class="band-secondary">
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lt-rib";

      /* bloom fades in */
      tl.from(`${COMP} .local-bloom`,
        { autoAlpha: 0, scale: 0.55, duration: 1.0, ease: "power2.out" }, 0);

      /* primary band sweeps in from left — scaleX reveal */
      tl.fromTo(`${COMP} .band-primary`,
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center" },
        { autoAlpha: 1, scaleX: 1, duration: 0.60, ease: "power4.out" }, 0.12);

      /* name glides in from left after band is visible */
      tl.from(`${COMP} .name`,
        { autoAlpha: 0, x: -30, duration: 0.58, ease: "power4.out" }, 0.46);

      /* secondary band sweeps in slightly slower */
      tl.fromTo(`${COMP} .band-secondary`,
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center" },
        { autoAlpha: 1, scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.54);

      /* role glides in */
      tl.from(`${COMP} .role`,
        { autoAlpha: 0, x: -22, duration: 0.50, ease: "power3.out" }, 0.76);

      /* corner accent draws in */
      tl.from(`${COMP} .corner-accent`,
        { scaleY: 0, autoAlpha: 0, transformOrigin: "top center",
          duration: 0.40, ease: "power2.out" }, 0.50);

      /* top-border neon glow pulse — finite */
      tl.to(`${COMP} .band-primary`,
        { borderTopColor: "rgba(55,189,248,1.00)",
          boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 44px rgba(55,189,248,0.32), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-rib"] = tl;
    </script>
  </body>
</html>
