<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · STACKED
  Name stacked OVER role with a glowing accent dividing rule that draws in
  between them. On frosted dark glass, anchored lower-left.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-stk {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-stk .local-bloom {
        position: absolute;
        left: 50px; bottom: 88px;
        width: 560px; height: 220px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 82%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 75%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 1;
      }

      /* Glass card */
      #t2-lt-stk .card {
        position: absolute;
        left: 80px; bottom: 118px;
        padding: 26px 36px 24px;
        min-width: 380px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 20px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      /* Highlight strip */
      #t2-lt-stk .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      /* Name */
      #t2-lt-stk .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 40px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 0;
      }

      /* Dividing rule — drawn in via scaleX */
      #t2-lt-stk .divider {
        height: 2px;
        width: 100%;
        margin: 14px 0;
        border-radius: 2px;
        background: linear-gradient(90deg,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.30) 70%,
          transparent 100%);
        box-shadow:
          0 0 6px rgba(var(--accent-rgb), 0.80),
          0 0 18px rgba(var(--accent-rgb), 0.40);
        transform-origin: left center;
      }

      /* Role */
      #t2-lt-stk .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 23px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-stk"
         data-composition-id="t2-lt-stk"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="name" data-slot="name">Ronny Mitchell</div>
        <div class="divider"></div>
        <div class="role" data-slot="role">Head of Content Strategy</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom swells in */
      tl.from("#t2-lt-stk .local-bloom",
        { autoAlpha: 0, scale: 0.62, duration: 1.2, ease: "power2.out" }, 0);

      /* card springs in */
      tl.from("#t2-lt-stk .card",
        { autoAlpha: 0, x: -36, y: 24, scale: 0.93,
          filter: "blur(11px)", transformOrigin: "left bottom",
          duration: 0.82, ease: "back.out(1.4)" }, 0.10);

      /* name glides down-in */
      tl.from("#t2-lt-stk .name",
        { autoAlpha: 0, y: -12, filter: "blur(7px)",
          duration: 0.60, ease: "power4.out" }, 0.56);

      /* divider draws in via scaleX from 0 → 1 */
      tl.from("#t2-lt-stk .divider",
        { scaleX: 0, autoAlpha: 0, duration: 0.55, ease: "power3.out" }, 0.74);

      /* role glides up-in */
      tl.from("#t2-lt-stk .role",
        { autoAlpha: 0, y: 10, filter: "blur(5px)",
          duration: 0.58, ease: "power4.out" }, 0.90);

      /* divider glow pulse — finite */
      tl.to("#t2-lt-stk .divider",
        { boxShadow: "0 0 10px rgba(55,189,248,1.00), 0 0 30px rgba(55,189,248,0.60)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-stk"] = tl;
    </script>
  </body>
</html>
