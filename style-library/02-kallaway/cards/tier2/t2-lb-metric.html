<!doctype html>
<!--
  KALLAWAY · tier2 · label · METRIC PILL
  A compact pill: Space Mono value (`term`, e.g. "94%") centered with gradient
  glow + a small label (`detail`) beneath. Accent-edge glow. Left side anchor.
  Slots: term (~8 chars — value/number), detail (~32 chars — metric label).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-metric {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — left side, tightly centered on the pill */
      #t2-lb-metric .local-glow {
        position: absolute; left: 90px; top: 400px;
        width: 360px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.35) 0%,
          rgba(var(--accent-rgb), 0.12) 48%,
          transparent 74%);
        filter: blur(32px);
        pointer-events: none;
      }

      /* Pill — left anchor */
      #t2-lb-metric .pill {
        position: absolute; left: 80px; top: 430px;
        min-width: 260px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid var(--glass-hi);
        /* accent glow halo + shadow */
        box-shadow: var(--glass-shadow),
                    0 0 36px rgba(var(--accent-rgb), 0.30),
                    inset 0 0 0 1px rgba(var(--accent-rgb), 0.10);
        border-radius: 999px; /* true pill */
        padding: 28px 44px 26px;
        display: flex; flex-direction: column;
        align-items: center; gap: 8px;
        position: absolute; left: 80px; top: 430px;
      }

      /* Inner neon edge lines — top highlight via ::before */
      #t2-lb-metric .pill::before {
        content: "";
        position: absolute; left: 20%; right: 20%; top: 0; height: 1.5px;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.85) 50%, transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.60);
        border-radius: 0 0 3px 3px;
      }

      /* Large metric value — Space Mono, white→accent gradient */
      #t2-lb-metric .value {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 68px; letter-spacing: -0.03em; line-height: 1.0;
        background: linear-gradient(110deg,
          #FFFFFF 0%, #FFFFFF 35%, var(--accent) 80%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.60))
                drop-shadow(0 0 6px rgba(255,255,255,0.30));
        display: block; text-align: center;
      }

      /* Thin separator */
      #t2-lb-metric .sep {
        height: 1px; width: 70%;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb), 0.55) 50%, transparent 100%);
        transform-origin: center center;
      }

      /* Detail label */
      #t2-lb-metric .label {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--text-dim); text-align: center;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-metric" data-composition-id="t2-lb-metric" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="pill">
        <div class="value" data-slot="term">94%</div>
        <div class="sep"></div>
        <div class="label" data-slot="detail">accuracy rate</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-metric";

      /* glow blooms up */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.45, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* pill springs in from left + blur */
        .from(`${COMP} .pill`, {
            autoAlpha: 0, x: -50, scale: 0.86, filter: "blur(12px)",
            transformOrigin: "0% 50%",
            duration: 0.75, ease: "back.out(1.4)" }, 0.20)

        /* value drops in with blur resolve */
        .from(`${COMP} .value`, {
            autoAlpha: 0, y: -20, filter: "blur(16px)",
            duration: 0.58, ease: "power4.out" }, 0.54)

        /* separator draws */
        .from(`${COMP} .sep`, {
            scaleX: 0, transformOrigin: "50% 50%",
            duration: 0.38, ease: "power3.out" }, 0.80)

        /* label fades */
        .from(`${COMP} .label`, {
            autoAlpha: 0, y: 8,
            duration: 0.38, ease: "power2.out" }, 0.96)

        /* accent glow pulse on pill — finite */
        .to(`${COMP} .pill`, {
            boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 55px rgba(55,189,248,0.55), inset 0 0 0 1px rgba(55,189,248,0.22)",
            duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.55)

        .set({}, {}, 7);

      window.__timelines["t2-lb-metric"] = tl;
    </script>
  </body>
</html>
