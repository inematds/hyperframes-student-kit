<!doctype html>
<!--
  KALLAWAY · tier2 · label · SPEC
  A mini specification panel: a term header row + 3 label:value data rows that
  stagger in one by one. Think HUD readout or product spec sheet — mono labels,
  display values. Anchored left side, mid-height.
  Slots: term (~24 chars), detail (~70 chars — used as the third value row text).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-spec {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Local glow behind panel */
      #t2-lb-spec .local-glow {
        position: absolute; left: 80px; top: 330px;
        width: 580px; height: 360px; border-radius: 50%;
        background: radial-gradient(ellipse at 35% 55%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(50px);
        pointer-events: none;
      }

      /* Main spec panel */
      #t2-lb-spec .spec-panel {
        position: absolute; left: 80px; top: 360px;
        width: 520px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 2px solid rgba(var(--accent-rgb), 0.60);
        border-radius: var(--radius-sm);
        box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.20),
                    inset 0 1px 0 rgba(255,255,255,0.14),
                    var(--glass-shadow);
        overflow: hidden;
      }

      /* Header row */
      #t2-lb-spec .spec-header {
        display: flex; align-items: center; gap: 12px;
        padding: 16px 22px 14px;
        border-bottom: 1px solid rgba(var(--accent-rgb), 0.22);
      }

      #t2-lb-spec .spec-icon {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
      }

      #t2-lb-spec .spec-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 24px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        flex: 1;
      }

      #t2-lb-spec .spec-badge {
        font-family: var(--font-mono); font-size: 11px;
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        padding: 3px 8px;
        border: 1px solid rgba(var(--accent-rgb), 0.40);
        border-radius: 4px;
        flex-shrink: 0;
      }

      /* Data rows */
      #t2-lb-spec .spec-rows {
        padding: 6px 0 6px;
      }

      #t2-lb-spec .spec-row {
        display: flex; align-items: baseline; gap: 0;
        padding: 10px 22px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      #t2-lb-spec .spec-row:last-child {
        border-bottom: none;
      }

      /* Dashed connector between label and value */
      #t2-lb-spec .spec-row-label {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 14px; letter-spacing: var(--track-wide);
        color: var(--text-faint); text-transform: uppercase;
        white-space: nowrap; flex-shrink: 0;
      }

      #t2-lb-spec .spec-row-dots {
        flex: 1;
        border-bottom: 1px dashed rgba(255,255,255,0.14);
        margin: 0 10px;
        position: relative; top: -4px;
      }

      #t2-lb-spec .spec-row-value {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 22px; letter-spacing: var(--track-snug);
        color: var(--text);
        white-space: nowrap;
      }

      #t2-lb-spec .spec-row-value.accent {
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Detail note below panel */
      #t2-lb-spec .detail-wrap {
        position: absolute; left: 80px; top: 656px;
        padding: 8px 18px 8px 16px;
        background: rgba(16,22,34,0.40);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-left: 2px solid rgba(var(--accent-rgb), 0.40);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        max-width: 500px;
      }

      #t2-lb-spec .detail-text {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.5;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-spec" data-composition-id="t2-lb-spec" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="spec-panel">
        <div class="spec-header">
          <div class="spec-icon"></div>
          <div class="spec-title" data-slot="term">GPT-4o Parameters</div>
          <div class="spec-badge">SPEC</div>
        </div>
        <div class="spec-rows">
          <div class="spec-row spec-row-1">
            <span class="spec-row-label">Context</span>
            <span class="spec-row-dots"></span>
            <span class="spec-row-value accent">128K tokens</span>
          </div>
          <div class="spec-row spec-row-2">
            <span class="spec-row-label">Release</span>
            <span class="spec-row-dots"></span>
            <span class="spec-row-value">May 2024</span>
          </div>
          <div class="spec-row spec-row-3">
            <span class="spec-row-label">Modality</span>
            <span class="spec-row-dots"></span>
            <span class="spec-row-value" data-slot="detail">Text · Vision · Audio</span>
          </div>
        </div>
      </div>

      <div class="detail-wrap">
        <div class="detail-text">First natively multimodal model — processes and generates across all three modes in a single forward pass.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-spec";

      /* Local glow */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "35% 55%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* Panel slides in from left with blur */
        .from(`${COMP} .spec-panel`, {
            autoAlpha: 0, x: -36, filter: "blur(14px)",
            duration: 0.78, ease: "back.out(1.4)" }, 0.15)

        /* Header elements stagger in */
        .from(`${COMP} .spec-icon`, {
            autoAlpha: 0, scale: 0, transformOrigin: "50% 50%",
            duration: 0.30, ease: "back.out(2)" }, 0.65)
        .from(`${COMP} .spec-title`, {
            autoAlpha: 0, x: -12, filter: "blur(6px)",
            duration: 0.48, ease: "power4.out" }, 0.72)
        .from(`${COMP} .spec-badge`, {
            autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.85)

        /* Data rows stagger in one by one */
        .from(`${COMP} .spec-row-1`, {
            autoAlpha: 0, x: -14, duration: 0.42, ease: "power3.out" }, 1.00)
        .from(`${COMP} .spec-row-2`, {
            autoAlpha: 0, x: -14, duration: 0.42, ease: "power3.out" }, 1.20)
        .from(`${COMP} .spec-row-3`, {
            autoAlpha: 0, x: -14, duration: 0.42, ease: "power3.out" }, 1.40)

        /* Detail note glides up */
        .from(`${COMP} .detail-wrap`, {
            autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.62, ease: "power4.out" }, 1.65)

        /* Finite border-top glow pulse */
        .to(`${COMP} .spec-panel`, {
            boxShadow: "0 0 38px rgba(55,189,248,0.42), inset 0 1px 0 rgba(255,255,255,0.20), 0 24px 70px rgba(0,0,0,0.50)",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t2-lb-spec"] = tl;
    </script>
  </body>
</html>
