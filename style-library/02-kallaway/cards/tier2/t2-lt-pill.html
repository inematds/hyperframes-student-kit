<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · PILL
  Name and role sit inside a wide rounded glass pill with a glowing edge.
  The pill springs in from below with a slight bounce; name and role stagger
  up inside it. Transparent background — only the pill paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-pill {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized soft bloom behind the pill */
      #t2-lt-pill .local-bloom {
        position: absolute;
        left: 58px; bottom: 118px;
        width: 560px; height: 180px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 80%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 75%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer accent glow ring (separate div for animating opacity) */
      #t2-lt-pill .pill-glow {
        position: absolute;
        left: 80px; bottom: 138px;
        border-radius: 999px;
        pointer-events: none;
        z-index: 2;
      }

      /* Main pill */
      #t2-lt-pill .pill {
        position: absolute;
        left: 80px; bottom: 140px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px 44px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 999px;
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.45);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.18),
          0 0 28px rgba(var(--accent-rgb), 0.20),
          inset 0 1px 0 var(--glass-hi);
        z-index: 3;
        overflow: hidden;
      }

      /* Inner highlight line at the top of the pill */
      #t2-lt-pill .pill::before {
        content: "";
        position: absolute;
        top: 0; left: 15%; right: 15%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
        border-radius: 1px;
      }

      /* Vertical divider between name and role */
      #t2-lt-pill .divider {
        width: 1.5px;
        height: 38px;
        background: linear-gradient(180deg,
          transparent,
          rgba(var(--accent-rgb), 0.55) 30%,
          rgba(var(--accent-rgb), 0.55) 70%,
          transparent);
        flex-shrink: 0;
      }

      #t2-lt-pill .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      #t2-lt-pill .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        color: var(--text-dim);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-pill"
         data-composition-id="t2-lt-pill"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="pill">
        <div class="name" data-slot="name">Ronny Mitchell</div>
        <div class="divider"></div>
        <div class="role" data-slot="role">Head of Content Strategy</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom in */
      tl.from("#t2-lt-pill .local-bloom",
        { autoAlpha: 0, scale: 0.65, duration: 1.1, ease: "power2.out" }, 0);

      /* pill springs up from below */
      tl.from("#t2-lt-pill .pill",
        { autoAlpha: 0, y: 36, scale: 0.90,
          filter: "blur(14px)", transformOrigin: "50% 100%",
          duration: 0.80, ease: "back.out(1.4)" }, 0.08);

      /* name fades in */
      tl.from("#t2-lt-pill .name",
        { autoAlpha: 0, y: 10, filter: "blur(6px)",
          duration: 0.55, ease: "power4.out" }, 0.52);

      /* divider draws in */
      tl.from("#t2-lt-pill .divider",
        { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 50%",
          duration: 0.30, ease: "power2.out" }, 0.68);

      /* role fades in */
      tl.from("#t2-lt-pill .role",
        { autoAlpha: 0, y: 8, filter: "blur(5px)",
          duration: 0.52, ease: "power3.out" }, 0.76);

      /* pill border glow pulse — finite */
      tl.to("#t2-lt-pill .pill",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.40), 0 0 50px rgba(55,189,248,0.38), inset 0 1px 0 rgba(255,255,255,0.22)",
          borderColor: "rgba(55,189,248,0.80)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-pill"] = tl;
    </script>
  </body>
</html>
