<!doctype html>
<!--
  KALLAWAY · tier2 · label · NOTE
  A sticky glass note card with a slight counter-clockwise tilt (~-3°), giving a
  hand-placed feel without any hand-drawn elements. A faint fold crease and a
  pushpin accent at the top-center. Anchored left side.
  Slots: term (~28 chars), detail (~80 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-note {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Warm-tinted local bloom behind note */
      #t2-lb-note .local-glow {
        position: absolute; left: 80px; top: 300px;
        width: 520px; height: 380px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 50%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent2-rgb), 0.06) 50%,
          transparent 78%);
        filter: blur(48px);
        pointer-events: none;
        z-index: 0;
      }

      /* Tilted note card wrapper */
      #t2-lb-note .note-card {
        position: absolute; left: 120px; top: 340px;
        width: 400px;
        transform: rotate(-3deg);
        transform-origin: center center;
        padding: 32px 32px 28px;
        background: rgba(20, 28, 44, 0.72);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid rgba(255, 255, 255, 0.12);
        border-radius: 14px 14px 20px 20px; /* slightly different radii = post-it feel */
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.18),
          0 0 24px rgba(var(--accent-rgb), 0.14),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      /* Top-left fold triangle */
      #t2-lb-note .note-card::after {
        content: "";
        position: absolute; bottom: 0; right: 0;
        width: 28px; height: 28px;
        background: linear-gradient(135deg, transparent 50%, rgba(var(--accent-rgb), 0.25) 50%);
        border-top-left-radius: 6px;
      }

      /* Hairline shimmer */
      #t2-lb-note .note-card::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45) 40%, rgba(255,255,255,0.45) 60%, transparent);
      }

      /* Pushpin accent — a tiny bright dot at top center */
      #t2-lb-note .pin {
        position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm), 0 2px 4px rgba(0,0,0,0.6);
      }

      /* Horizontal crease line */
      #t2-lb-note .crease {
        position: absolute; top: 52px; left: 0; right: 0; height: 1px;
        background: rgba(255,255,255,0.06);
      }

      #t2-lb-note .term {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 28px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 14px;
        line-height: 1.15;
      }

      #t2-lb-note .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 20px;
        line-height: 1.55;
        color: var(--text-dim);
      }

      /* Accent underline on term */
      #t2-lb-note .term-underline {
        display: block; margin-top: 6px;
        width: 42px; height: 2px;
        background: linear-gradient(90deg, var(--accent), transparent);
        border-radius: 1px;
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-note"
         data-composition-id="t2-lb-note"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="note-card">
        <div class="pin"></div>
        <div class="crease"></div>
        <div class="term" data-slot="term">
          Context Window
          <span class="term-underline"></span>
        </div>
        <div class="detail" data-slot="detail">The maximum amount of text a model can "see" at once — beyond this limit, earlier content disappears.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-note";

      /* Glow softly materializes */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%",
          duration: 1.3, ease: "power2.out" }, 0)

        /* Note card drops in with slight spring + slight extra tilt correcting */
        .from(`${C} .note-card`,
          { autoAlpha: 0, y: -36, rotation: -8, scale: 0.90,
            filter: "blur(14px)", transformOrigin: "center top",
            duration: 0.82, ease: "back.out(1.4)" }, 0.18)

        /* Term reveals — no blur (has no CSS filter to conflict) */
        .from(`${C} .term`,
          { autoAlpha: 0, y: 12,
            duration: 0.60, ease: "power3.out" }, 0.62)

        /* Underline draws left to right */
        .from(`${C} .term-underline`,
          { scaleX: 0, transformOrigin: "left center",
            duration: 0.45, ease: "power3.out" }, 0.82)

        /* Detail fades up */
        .from(`${C} .detail`,
          { autoAlpha: 0, y: 10,
            duration: 0.60, ease: "power3.out" }, 0.88)

        /* Pin glow pulse — finite */
        .to(`${C} .pin`,
          { boxShadow: "0 0 22px rgba(55,189,248,0.90), 0 2px 4px rgba(0,0,0,0.6)",
            duration: 0.9, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.50)

        /* Subtle float drift on the note */
        .to(`${C} .note-card`,
          { y: -8, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.80)

        .set({}, {}, 7);

      window.__timelines["t2-lb-note"] = tl;
    </script>
  </body>
</html>
