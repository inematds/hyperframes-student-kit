<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · SPOTLIGHTNAME
  A soft localized pool of light blooms lower-left — like a theatre spotlight
  on the speaker corner — and the name + role fade up within it, sitting on a
  minimal transparent glass plate. No hard card edge; the glow IS the container.
  Transparent overlay over live footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-spotn {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* THE spotlight pool — large, soft, blooms from lower-left corner */
      #t2-lt-spotn .spotlight {
        position: absolute;
        left: -80px; bottom: -60px;
        width: 780px; height: 520px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 25% 80%,
          rgba(var(--accent-rgb), 0.35) 0%,
          rgba(var(--accent-rgb), 0.18) 28%,
          rgba(var(--accent-rgb), 0.05) 56%,
          transparent 75%);
        filter: blur(52px);
        pointer-events: none;
        z-index: 1;
      }

      /* Secondary warm white core at center of the pool */
      #t2-lt-spotn .spotlight-core {
        position: absolute;
        left: 60px; bottom: 120px;
        width: 260px; height: 180px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 70%,
          rgba(255,255,255,0.14) 0%,
          transparent 70%);
        filter: blur(28px);
        pointer-events: none;
        z-index: 2;
      }

      /* Text content — no hard glass card; floats inside the glow pool */
      #t2-lt-spotn .text-content {
        position: absolute;
        left: 80px; bottom: 150px;
        z-index: 3;
      }

      #t2-lt-spotn .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 46px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow:
          0 0 22px rgba(255,255,255,0.55),
          0 0 60px rgba(var(--accent-rgb),0.38),
          0 2px 12px rgba(0,0,0,0.60);
        line-height: 1.05;
        margin-bottom: 10px;
      }

      #t2-lt-spotn .rule {
        width: 56px; height: 1.5px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.80), transparent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.55);
        margin-bottom: 12px;
      }

      #t2-lt-spotn .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 23px;
        letter-spacing: 0.02em;
        color: rgba(255,255,255,0.72);
        text-shadow: 0 0 16px rgba(var(--accent-rgb),0.28), 0 1px 8px rgba(0,0,0,0.50);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-spotn"
         data-composition-id="t2-lt-spotn"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="spotlight" id="spotn-spotlight"></div>
      <div class="spotlight-core"></div>

      <div class="text-content">
        <div class="name" data-slot="name">Kallaway Osei</div>
        <div class="rule" id="spotn-rule"></div>
        <div class="role" data-slot="role">AI Education Director, AIS</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-spotn";

      /* spotlight blooms up from below — the key entrance */
      tl.from(`${C} .spotlight`,
        { autoAlpha: 0, scale: 0.50, y: 80,
          transformOrigin: "20% 90%",
          duration: 1.40, ease: "expo.out" }, 0);

      tl.from(`${C} .spotlight-core`,
        { autoAlpha: 0, scale: 0.40, duration: 1.1, ease: "power2.out" }, 0.30);

      /* name fades up inside the glow — use autoAlpha + y only (no blur on
         text-shadow element to avoid filter trap) */
      tl.from(`${C} .name`,
        { autoAlpha: 0, y: 22, duration: 0.80, ease: "power4.out" }, 0.75);

      /* rule draws */
      tl.from(`${C} .rule`,
        { scaleX: 0, transformOrigin: "left center",
          duration: 0.38, ease: "power2.out" }, 1.20);

      /* role fades up */
      tl.from(`${C} .role`,
        { autoAlpha: 0, y: 14, duration: 0.65, ease: "power3.out" }, 1.36);

      /* slow breathing of the spotlight pool — finite */
      tl.to(`${C} .spotlight`,
        { opacity: 0.60, scale: 1.10, transformOrigin: "20% 90%",
          duration: 2.0, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.00);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-spotn"] = tl;
    </script>
  </body>
</html>
