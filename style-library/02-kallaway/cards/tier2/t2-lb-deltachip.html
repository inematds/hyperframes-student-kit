<!doctype html>
<!--
  KALLAWAY · tier2 · label · DELTACHIP
  A small +/- delta chip with a glowing directional arrow and a percentage value,
  plus a term label and detail line. Anchored left side. Positive = accent blue
  up-arrow; negative = alert red down-arrow.
  Slots: term (~28 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-delta {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — left side */
      #t2-lb-delta .local-glow {
        position: absolute; left: 80px; top: 400px;
        width: 460px; height: 260px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(44px);
        pointer-events: none;
      }

      /* Wrapper anchored left */
      #t2-lb-delta .wrapper {
        position: absolute; left: 120px; top: 430px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
      }

      /* Delta chip row */
      #t2-lb-delta .chip-row {
        display: flex; align-items: center; gap: 14px;
      }

      /* The delta chip itself — rounded pill */
      #t2-lb-delta .chip {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 22px 10px 16px;
        border-radius: 999px;
        background: rgba(var(--accent-rgb), 0.14);
        border: 1.5px solid rgba(var(--accent-rgb), 0.60);
        box-shadow:
          0 0 24px rgba(var(--accent-rgb), 0.38),
          inset 0 1px 0 rgba(255,255,255,0.18),
          0 4px 18px rgba(0,0,0,0.45);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      /* Arrow SVG icon */
      #t2-lb-delta .arrow-icon {
        width: 28px; height: 28px; flex-shrink: 0;
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.80));
      }

      /* Delta value text */
      #t2-lb-delta .delta-val {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: 36px; letter-spacing: 0.02em;
        color: var(--accent); text-shadow: var(--textglow-accent);
        white-space: nowrap;
      }

      /* VS / context label beside chip */
      #t2-lb-delta .vs-label {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 20px; color: var(--text-dim);
        letter-spacing: 0.04em; white-space: nowrap;
      }

      /* Term + detail glass card */
      #t2-lb-delta .text-block {
        padding: 14px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.18);
        max-width: 440px;
        position: relative; overflow: hidden;
      }

      #t2-lb-delta .text-block::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.38) 50%, transparent);
      }

      #t2-lb-delta .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 26px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 4px;
      }

      #t2-lb-delta .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.45; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-delta" data-composition-id="t2-lb-delta" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="chip-row">
          <div class="chip">
            <!-- Up-arrow SVG (inline, no external fetch) -->
            <svg class="arrow-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 22V8M14 8L7 15M14 8L21 15"
                    stroke="#37BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="delta-val">+34%</span>
          </div>
          <span class="vs-label">vs. last cohort</span>
        </div>

        <div class="text-block">
          <div class="term" data-slot="term">Completion Rate</div>
          <div class="detail" data-slot="detail">Module 3 engagement up significantly</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-delta";

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* chip springs from left */
        .from(`${COMP} .chip`, {
            autoAlpha: 0, x: -36, scale: 0.88, transformOrigin: "left center",
            duration: 0.72, ease: "back.out(1.4)" }, 0.20)

        /* vs label glides in */
        .from(`${COMP} .vs-label`, {
            autoAlpha: 0, x: -16, filter: "blur(6px)",
            duration: 0.55, ease: "power3.out" }, 0.48)

        /* arrow icon pops up with overshoot */
        .from(`${COMP} .arrow-icon`, {
            autoAlpha: 0, y: 14, scale: 0.6,
            duration: 0.55, ease: "back.out(2.2)" }, 0.24)

        /* text block slides up */
        .from(`${COMP} .text-block`, {
            autoAlpha: 0, y: 18, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.56)

        /* finite glow pulse on chip */
        .to(`${COMP} .chip`, {
            boxShadow: "0 0 40px rgba(55,189,248,0.65), inset 0 1px 0 rgba(255,255,255,0.22), 0 4px 18px rgba(0,0,0,0.45)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80)

        /* subtle arrow breathing — finite */
        .to(`${COMP} .arrow-icon`, {
            y: -5, duration: 0.9, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.90)

        .set({}, {}, 7);

      window.__timelines["t2-lb-delta"] = tl;
    </script>
  </body>
</html>
