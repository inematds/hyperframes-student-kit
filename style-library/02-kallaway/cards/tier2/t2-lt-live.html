<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · LIVE
  A pulsing "LIVE" indicator dot + label pill on the top-left of the card,
  then the name and role below. The dot rings outward in a finite sonar
  pulse during the hold. Distinct "broadcast" energy — not just a name card.
  Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-live {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized warm bloom (LIVE uses alert red accent glow, not blue) */
      #t2-lt-live .local-bloom {
        position: absolute;
        left: 50px; bottom: 80px;
        width: 600px; height: 250px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 38% 85%,
          rgba(var(--alert-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.10) 45%,
          transparent 72%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer card */
      #t2-lt-live .card {
        position: absolute;
        left: 80px; bottom: 108px;
        padding: 22px 38px 22px 30px;
        min-width: 480px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.45),
          0 0 18px rgba(var(--accent-rgb), 0.15),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      #t2-lt-live .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      /* LIVE pill row */
      #t2-lt-live .live-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      /* LIVE pill badge */
      #t2-lt-live .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 5px 16px 5px 12px;
        border-radius: 999px;
        background: rgba(var(--alert-rgb), 0.14);
        border: 1.5px solid rgba(var(--alert-rgb), 0.70);
        box-shadow:
          0 0 14px rgba(var(--alert-rgb), 0.35),
          inset 0 1px 0 rgba(255,255,255,0.10);
      }

      /* The dot and its sonar rings */
      #t2-lt-live .dot-wrap {
        position: relative;
        width: 14px; height: 14px;
        flex-shrink: 0;
      }

      #t2-lt-live .dot-core {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--alert);
        box-shadow: 0 0 8px rgba(var(--alert-rgb), 0.90);
        z-index: 2;
      }

      /* sonar ring 1 */
      #t2-lt-live .ring1,
      #t2-lt-live .ring2 {
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--alert-rgb), 0.50);
        transform: scale(0);
        opacity: 0;
        z-index: 1;
      }

      #t2-lt-live .live-label {
        font-family: var(--font-mono);
        font-weight: var(--wt-bold);
        font-size: 18px;
        letter-spacing: 0.20em;
        text-transform: uppercase;
        color: var(--alert);
        text-shadow: 0 0 14px rgba(var(--alert-rgb), 0.70);
        line-height: 1;
      }

      /* Name + role */
      #t2-lt-live .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 38px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 7px;
        line-height: 1.1;
      }

      #t2-lt-live .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-live"
         data-composition-id="t2-lt-live"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="live-row">
          <div class="live-pill">
            <div class="dot-wrap">
              <div class="ring1"></div>
              <div class="ring2"></div>
              <div class="dot-core"></div>
            </div>
            <div class="live-label">LIVE</div>
          </div>
        </div>
        <div class="name" data-slot="name">Alex Morgan</div>
        <div class="role" data-slot="role">AI Systems Architect</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-live";

      /* bloom in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.62, duration: 1.1, ease: "power2.out" }, 0);

      /* card springs in */
      tl.from(`${C} .card`,
        { autoAlpha: 0, x: -44, y: 26, scale: 0.94,
          filter: "blur(14px)", transformOrigin: "left bottom",
          duration: 0.82, ease: "back.out(1.4)" }, 0.10);

      /* LIVE pill slides in from left */
      tl.from(`${C} .live-pill`,
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.55, ease: "power4.out" }, 0.55);

      /* dot pops */
      tl.from(`${C} .dot-core`,
        { scale: 0, transformOrigin: "center",
          duration: 0.30, ease: "back.out(2.5)" }, 0.78);

      /* name glides in */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -18, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.86);

      /* role follows */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.55, ease: "power3.out" }, 1.02);

      /* sonar ring 1 — finite pulse outward */
      tl.to(`${C} .ring1`,
        { scale: 2.8, autoAlpha: 0,
          duration: 1.1, ease: "power2.out", repeat: 3, yoyo: false,
          repeatDelay: 0.6 }, 1.30);

      /* sonar ring 2 — offset from ring 1 */
      tl.to(`${C} .ring2`,
        { scale: 2.8, autoAlpha: 0,
          duration: 1.1, ease: "power2.out", repeat: 3, yoyo: false,
          repeatDelay: 0.6 }, 1.85);

      /* dot core pulses — finite */
      tl.to(`${C} .dot-core`,
        { boxShadow: "0 0 18px rgba(255,59,48,1.00)",
          duration: 0.65, ease: "sine.inOut", repeat: 5, yoyo: true }, 1.30);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-live"] = tl;
    </script>
  </body>
</html>
