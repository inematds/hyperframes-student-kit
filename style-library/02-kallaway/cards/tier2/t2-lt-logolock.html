<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · LOGOLOCK
  Name/role glass card with a small LOGO placeholder lockup to the left:
  a glowing rounded-square mark with an accent gradient fill. The logo
  and the text share one glass surface; a thin accent divider separates
  them. Sits over live speaker footage — fully transparent background.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-logo {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the card */
      #t2-lt-logo .local-bloom {
        position: absolute;
        left: 50px; bottom: 95px;
        width: 540px; height: 230px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 80%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Main glass card */
      #t2-lt-logo .card {
        position: absolute;
        left: 80px; bottom: 120px;
        display: flex;
        align-items: center;
        gap: 0;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.52),
          0 0 24px rgba(var(--accent-rgb), 0.20),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
      }

      /* Inner shimmer strip */
      #t2-lt-logo .card::before {
        content: "";
        position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.52) 60%, transparent);
        border-radius: 1px;
        z-index: 10;
      }

      /* Logo block on the left */
      #t2-lt-logo .logo-block {
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        width: 100px;
        align-self: stretch;
        padding: 0 24px;
        border-right: 1px solid rgba(var(--accent-rgb), 0.28);
        background: rgba(var(--accent-rgb), 0.07);
      }

      /* The glowing rounded-square mark */
      #t2-lt-logo .logo-mark {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg,
          rgba(var(--accent-rgb), 0.85) 0%,
          rgba(var(--accent-rgb), 0.38) 55%,
          rgba(255,255,255,0.18) 100%);
        border: 1.5px solid rgba(var(--accent-rgb), 0.70);
        box-shadow:
          0 0 14px rgba(var(--accent-rgb), 0.65),
          0 0 32px rgba(var(--accent-rgb), 0.30),
          inset 0 1px 0 rgba(255,255,255,0.35);
        display: flex; align-items: center; justify-content: center;
      }

      /* Inner letter / icon stand-in */
      #t2-lt-logo .logo-mark span {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 22px;
        color: var(--white);
        text-shadow: 0 0 12px rgba(255,255,255,0.80);
        letter-spacing: -0.02em;
        line-height: 1;
      }

      /* Text block on the right */
      #t2-lt-logo .text-block {
        padding: 26px 32px 24px 28px;
        display: flex; flex-direction: column; gap: 7px;
      }

      #t2-lt-logo .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
      }

      #t2-lt-logo .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      #t2-lt-logo .role::before {
        content: "";
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        margin-right: 10px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-logo"
         data-composition-id="t2-lt-logo"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="logo-block">
          <div class="logo-mark">
            <span>K</span>
          </div>
        </div>
        <div class="text-block">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom rises */
      tl.from("#t2-lt-logo .local-bloom",
        { autoAlpha: 0, scale: 0.72, duration: 1.2, ease: "power2.out" }, 0);

      /* card springs in from lower-left */
      tl.from("#t2-lt-logo .card",
        { autoAlpha: 0, x: -44, y: 26, scale: 0.92,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.85, ease: "back.out(1.4)" }, 0.10);

      /* logo mark blooms in */
      tl.from("#t2-lt-logo .logo-mark",
        { autoAlpha: 0, scale: 0.55,
          duration: 0.65, ease: "back.out(1.6)" }, 0.50);

      /* name glides in */
      tl.from("#t2-lt-logo .name",
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.65, ease: "power4.out" }, 0.60);

      /* role follows */
      tl.from("#t2-lt-logo .role",
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.60, ease: "power3.out" }, 0.76);

      /* logo mark glow pulse — finite */
      tl.to("#t2-lt-logo .logo-mark",
        { boxShadow:
            "0 0 22px rgba(55,189,248,0.90), 0 0 48px rgba(55,189,248,0.48), inset 0 1px 0 rgba(255,255,255,0.35)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.5);

      /* card rim pulse — finite */
      tl.to("#t2-lt-logo .card",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.88), 0 0 34px rgba(55,189,248,0.36), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.65);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-logo"] = tl;
    </script>
  </body>
</html>
