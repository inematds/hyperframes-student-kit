<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · MINIMAL
  Glowing name text on a slim dark glass underlay + a glowing accent underline
  that draws in. Role appears smaller beneath. Deliberately spare — accent is
  entirely in the glow and the underline.
  Transparent background — only the underlay paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-min {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom — very soft, directly behind text */
      #t2-lt-min .local-bloom {
        position: absolute;
        left: 60px; bottom: 110px;
        width: 440px; height: 160px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.05) 60%,
          transparent 75%);
        filter: blur(28px);
        pointer-events: none;
        z-index: 1;
      }

      /* Slim glass underlay */
      #t2-lt-min .underlay {
        position: absolute;
        left: 80px; bottom: 130px;
        padding: 18px 36px 20px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: visible;
      }

      #t2-lt-min .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 42px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.05;
        margin-bottom: 8px;
        white-space: nowrap;
      }

      /* Glowing underline — sits below name */
      #t2-lt-min .underline {
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.30) 85%,
          transparent 100%);
        box-shadow:
          0 0 8px rgba(var(--accent-rgb), 0.80),
          0 0 20px rgba(var(--accent-rgb), 0.45);
        border-radius: 2px;
        margin-bottom: 12px;
        /* GSAP draws this left-to-right via scaleX */
        transform-origin: left center;
      }

      #t2-lt-min .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        color: var(--text-dim);
        letter-spacing: 0.01em;
        line-height: 1.3;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-min"
         data-composition-id="t2-lt-min"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="underlay">
        <div class="name" data-slot="name">Ronny Mitchell</div>
        <div class="underline"></div>
        <div class="role" data-slot="role">Head of Content Strategy</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom in */
      tl.from("#t2-lt-min .local-bloom",
        { autoAlpha: 0, scale: 0.7, duration: 1.0, ease: "power2.out" }, 0);

      /* underlay glides up */
      tl.from("#t2-lt-min .underlay",
        { autoAlpha: 0, y: 28, filter: "blur(10px)",
          duration: 0.78, ease: "back.out(1.4)" }, 0.05);

      /* name glows in */
      tl.from("#t2-lt-min .name",
        { autoAlpha: 0, y: 14, filter: "blur(8px)",
          duration: 0.65, ease: "power4.out" }, 0.40);

      /* underline draws left-to-right */
      tl.from("#t2-lt-min .underline",
        { scaleX: 0, autoAlpha: 0,
          duration: 0.50, ease: "power3.out" }, 0.72);

      /* role fades in */
      tl.from("#t2-lt-min .role",
        { autoAlpha: 0, y: 8, filter: "blur(5px)",
          duration: 0.50, ease: "power3.out" }, 0.88);

      /* underline glow pulse — finite */
      tl.to("#t2-lt-min .underline",
        { boxShadow: "0 0 16px rgba(55,189,248,1.0), 0 0 36px rgba(55,189,248,0.60)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-min"] = tl;
    </script>
  </body>
</html>
