<!doctype html>
<!--
  KALLAWAY · tier2 · label · PRICE
  A price-tag micro label — a glowing currency symbol + value in gradient type,
  a term and detail line beneath in frosted glass. The value has a decorative
  price-tag notch SVG outline. Anchored right side.
  Slots: term (~28 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-price {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — right side */
      #t2-lb-price .local-glow {
        position: absolute; right: 80px; top: 380px;
        width: 500px; height: 320px; border-radius: 50%;
        background: radial-gradient(ellipse at 60% 50%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(48px);
        pointer-events: none;
      }

      /* Wrapper anchored right */
      #t2-lb-price .wrapper {
        position: absolute; right: 140px; top: 410px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
      }

      /* Price tag container */
      #t2-lb-price .tag-wrap {
        position: relative;
        display: inline-flex; flex-direction: column; align-items: flex-end;
      }

      /* Tag body — frosted glass with notch clip */
      #t2-lb-price .tag {
        display: flex; align-items: flex-end; gap: 6px;
        padding: 18px 36px 18px 32px;
        background: rgba(var(--accent-rgb), 0.10);
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow:
          0 0 28px rgba(var(--accent-rgb), 0.38),
          inset 0 1px 0 rgba(255,255,255,0.18),
          0 6px 24px rgba(0,0,0,0.50);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        position: relative; overflow: hidden;
      }

      #t2-lb-price .tag::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45) 50%, transparent);
      }

      /* Currency symbol */
      #t2-lb-price .currency {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 36px; line-height: 1;
        color: var(--accent); text-shadow: var(--textglow-accent);
        align-self: flex-start; padding-top: 8px;
      }

      /* Price value */
      #t2-lb-price .price-val {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 88px; line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb), 0.85) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.55));
      }

      /* Small "per" qualifier */
      #t2-lb-price .per {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 20px; color: var(--text-dim);
        align-self: flex-end; padding-bottom: 10px;
        white-space: nowrap;
      }

      /* Notch tab — small square folded corner on the right */
      #t2-lb-price .tag-notch {
        position: absolute; right: -1.5px; top: 50%; transform: translateY(-50%);
        width: 18px; height: 36px;
        background: rgba(var(--accent-rgb), 0.55);
        clip-path: polygon(0 0, 0 100%, 100% 50%);
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.60));
      }

      /* Text block: term + detail */
      #t2-lb-price .text-block {
        padding: 14px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.16);
        max-width: 440px; text-align: right;
        position: relative; overflow: hidden;
      }

      #t2-lb-price .text-block::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.36) 50%, transparent);
      }

      #t2-lb-price .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 26px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 4px;
      }

      #t2-lb-price .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.45; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-price" data-composition-id="t2-lb-price" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="tag-wrap">
          <div class="tag">
            <span class="currency">$</span>
            <span class="price-val">497</span>
            <span class="per">/yr</span>
            <div class="tag-notch"></div>
          </div>
        </div>

        <div class="text-block">
          <div class="term" data-slot="term">Pro Membership</div>
          <div class="detail" data-slot="detail">Full access to every AI course + coaching calls</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-price";

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "60% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* tag-wrap scales+blurs in from right */
        .from(`${COMP} .tag-wrap`, {
            autoAlpha: 0, x: 40, scale: 0.88, transformOrigin: "right center",
            duration: 0.78, ease: "back.out(1.4)" }, 0.18)

        /* currency ticks in first */
        .from(`${COMP} .currency`, {
            autoAlpha: 0, y: -14,
            duration: 0.45, ease: "back.out(2.0)" }, 0.32)

        /* price value focus-reveal — no blur on gradient-clip text (filter trap) */
        .from(`${COMP} .price-val`, {
            autoAlpha: 0, scale: 0.80, transformOrigin: "right bottom",
            duration: 0.62, ease: "back.out(1.6)" }, 0.38)

        /* per label */
        .from(`${COMP} .per`, {
            autoAlpha: 0, y: 10,
            duration: 0.42, ease: "power3.out" }, 0.52)

        /* notch appears */
        .from(`${COMP} .tag-notch`, {
            scaleX: 0, transformOrigin: "left center",
            duration: 0.35, ease: "power3.out" }, 0.60)

        /* text block */
        .from(`${COMP} .text-block`, {
            autoAlpha: 0, y: 16, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.68)

        /* tag glow pulse — finite */
        .to(`${COMP} .tag`, {
            boxShadow: "0 0 48px rgba(55,189,248,0.65), inset 0 1px 0 rgba(255,255,255,0.22), 0 6px 24px rgba(0,0,0,0.50)",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.80)

        .set({}, {}, 7);

      window.__timelines["t2-lb-price"] = tl;
    </script>
  </body>
</html>
