<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · AVATAR
  Circular avatar placeholder (glowing ring) beside a glass name/role block.
  Anchored lower-left. Fully transparent background — only the card paints.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-av {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the card */
      #t2-lt-av .local-bloom {
        position: absolute;
        left: 40px; bottom: 90px;
        width: 600px; height: 240px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 80%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 75%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Row wrapper */
      #t2-lt-av .row {
        position: absolute;
        left: 80px; bottom: 118px;
        display: flex;
        align-items: center;
        gap: 24px;
        z-index: 2;
      }

      /* Avatar circle */
      #t2-lt-av .avatar-ring {
        width: 100px; height: 100px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
        /* outer glow ring */
        box-shadow:
          0 0 0 2.5px rgba(var(--accent-rgb), 0.85),
          0 0 20px rgba(var(--accent-rgb), 0.55),
          0 0 48px rgba(var(--accent-rgb), 0.28),
          inset 0 0 0 2px rgba(255,255,255,0.10);
        background: radial-gradient(circle at 38% 32%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(16, 22, 34, 0.80) 65%);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        overflow: hidden;
      }

      /* Placeholder silhouette inside avatar */
      #t2-lt-av .avatar-ring::before {
        content: "";
        position: absolute;
        bottom: 0; left: 50%;
        transform: translateX(-50%);
        width: 52px; height: 66px;
        border-radius: 50% 50% 0 0 / 60% 60% 0 0;
        background: rgba(var(--accent-rgb), 0.22);
      }
      #t2-lt-av .avatar-ring::after {
        content: "";
        position: absolute;
        top: 22px; left: 50%;
        transform: translateX(-50%);
        width: 32px; height: 32px;
        border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.30);
      }

      /* Glass text block */
      #t2-lt-av .card {
        padding: 22px 32px 20px;
        min-width: 340px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 18px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        position: relative;
      }

      #t2-lt-av .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      #t2-lt-av .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 7px;
        line-height: 1.1;
      }

      #t2-lt-av .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 22px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-av"
         data-composition-id="t2-lt-av"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="row">
        <div class="avatar-ring"></div>
        <div class="card">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* local bloom swells in */
      tl.from("#t2-lt-av .local-bloom",
        { autoAlpha: 0, scale: 0.6, duration: 1.2, ease: "power2.out" }, 0);

      /* avatar ring springs in */
      tl.from("#t2-lt-av .avatar-ring",
        { autoAlpha: 0, scale: 0.55, y: 22,
          filter: "blur(10px)", transformOrigin: "center center",
          duration: 0.80, ease: "back.out(1.4)" }, 0.08);

      /* glass card springs in from left */
      tl.from("#t2-lt-av .card",
        { autoAlpha: 0, x: -30, y: 20, scale: 0.94,
          filter: "blur(10px)", transformOrigin: "left center",
          duration: 0.80, ease: "back.out(1.4)" }, 0.22);

      /* name glides in */
      tl.from("#t2-lt-av .name",
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.60, ease: "power4.out" }, 0.60);

      /* role follows */
      tl.from("#t2-lt-av .role",
        { autoAlpha: 0, x: -12, filter: "blur(5px)",
          duration: 0.55, ease: "power3.out" }, 0.76);

      /* avatar ring glow pulse — finite breathing */
      const glowDim  = "0 0 0 2.5px rgba(55,189,248,0.85), 0 0 20px rgba(55,189,248,0.55), 0 0 48px rgba(55,189,248,0.28), inset 0 0 0 2px rgba(255,255,255,0.10)";
      const glowBright = "0 0 0 2.5px rgba(55,189,248,1.00), 0 0 32px rgba(55,189,248,0.85), 0 0 72px rgba(55,189,248,0.45), inset 0 0 0 2px rgba(255,255,255,0.14)";
      const glowObj = { val: 0 };
      tl.to(glowObj, {
        val: 1, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true,
        onUpdate() {
          const el = document.querySelector("#t2-lt-av .avatar-ring");
          if (el) el.style.boxShadow = glowBright;
        },
        onComplete() {
          const el = document.querySelector("#t2-lt-av .avatar-ring");
          if (el) el.style.boxShadow = glowDim;
        }
      }, 1.4);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-av"] = tl;
    </script>
  </body>
</html>
