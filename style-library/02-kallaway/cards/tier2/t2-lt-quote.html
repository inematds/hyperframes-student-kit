<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · QUOTE
  Name/role glass card with a short attributed quote line beneath.
  A large glowing quotation mark anchors the left of the quote row.
  Sits over live speaker footage — fully transparent background.
  Slots: name (~26 chars), role (~40 chars), quote (~80 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-qt {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the card */
      #t2-lt-qt .local-bloom {
        position: absolute;
        left: 50px; bottom: 90px;
        width: 600px; height: 280px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 82%,
          rgba(var(--accent-rgb), 0.25) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(36px);
        pointer-events: none;
        z-index: 1;
      }

      /* Main glass card */
      #t2-lt-qt .card {
        position: absolute;
        left: 80px; bottom: 110px;
        width: 640px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 22px rgba(var(--accent-rgb), 0.20),
          inset 0 1px 0 var(--glass-hi);
        overflow: hidden;
        z-index: 2;
      }

      /* Shimmer strip */
      #t2-lt-qt .card::before {
        content: "";
        position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52) 40%, rgba(255,255,255,0.52) 60%, transparent);
        border-radius: 1px;
      }

      /* Nameplate row */
      #t2-lt-qt .nameplate {
        padding: 26px 34px 18px;
        border-bottom: 1px solid rgba(var(--accent-rgb), 0.20);
      }

      #t2-lt-qt .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 7px;
      }

      #t2-lt-qt .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 20px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      #t2-lt-qt .role::before {
        content: "";
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        margin-right: 10px;
        vertical-align: middle;
        position: relative; top: -1px;
      }

      /* Quote row */
      #t2-lt-qt .quote-row {
        padding: 16px 34px 22px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      /* Big glowing open-quotation mark */
      #t2-lt-qt .q-mark {
        flex-shrink: 0;
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 52px;
        line-height: 0.85;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-top: 2px;
        user-select: none;
      }

      #t2-lt-qt .quote-text {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 20px;
        letter-spacing: 0.005em;
        color: var(--text-dim);
        line-height: 1.45;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-qt"
         data-composition-id="t2-lt-qt"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="nameplate">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
        <div class="quote-row">
          <div class="q-mark">&ldquo;</div>
          <div class="quote-text" data-slot="quote">The future of content is building in public, faster than anyone expects.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom rises */
      tl.from("#t2-lt-qt .local-bloom",
        { autoAlpha: 0, scale: 0.72, duration: 1.2, ease: "power2.out" }, 0);

      /* card springs in from lower-left */
      tl.from("#t2-lt-qt .card",
        { autoAlpha: 0, x: -44, y: 28, scale: 0.93,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.85, ease: "back.out(1.4)" }, 0.10);

      /* name glides in */
      tl.from("#t2-lt-qt .name",
        { autoAlpha: 0, x: -20, filter: "blur(8px)",
          duration: 0.65, ease: "power4.out" }, 0.56);

      /* role follows */
      tl.from("#t2-lt-qt .role",
        { autoAlpha: 0, x: -14, filter: "blur(6px)",
          duration: 0.60, ease: "power3.out" }, 0.72);

      /* quotation mark blooms in */
      tl.from("#t2-lt-qt .q-mark",
        { autoAlpha: 0, scale: 0.60, y: 8,
          duration: 0.55, ease: "back.out(1.6)" }, 0.90);

      /* quote text sweeps in */
      tl.from("#t2-lt-qt .quote-text",
        { autoAlpha: 0, x: -16, filter: "blur(6px)",
          duration: 0.65, ease: "power4.out" }, 1.02);

      /* glow pulse on card rim — finite */
      tl.to("#t2-lt-qt .card",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(55,189,248,0.88), 0 0 36px rgba(55,189,248,0.38), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-qt"] = tl;
    </script>
  </body>
</html>
