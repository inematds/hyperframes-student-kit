<!doctype html>
<!--
  KALLAWAY · tier2 · label · PULSE
  A pulsing locator dot with FINITE expanding concentric rings (like a sonar
  ping) anchored left side over footage. A glass term label sits to the right
  of the dot. Rings expand and fade — no infinite repeat.
  Slots: term (~28 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-pulse {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Soft localized bloom behind the component */
      #t2-lb-pulse .local-glow {
        position: absolute; left: 60px; top: 360px;
        width: 500px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 30% 50%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 80%);
        filter: blur(44px);
        pointer-events: none;
        z-index: 0;
      }

      /* Outer positioning wrapper */
      #t2-lb-pulse .wrapper {
        position: absolute; left: 100px; top: 430px;
        display: flex; flex-direction: row; align-items: center; gap: 36px;
        z-index: 2;
      }

      /* Dot + rings container */
      #t2-lb-pulse .locator {
        position: relative;
        width: 110px; height: 110px;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }

      /* Expanding rings — each positioned absolutely, centered */
      #t2-lb-pulse .ring {
        position: absolute;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.30);
        /* Start collapsed; GSAP will scale them out */
        width: 110px; height: 110px;
        top: 0; left: 0;
      }

      /* Core dot */
      #t2-lb-pulse .dot-core {
        width: 22px; height: 22px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent), 0 0 0 4px rgba(var(--accent-rgb), 0.20);
        position: relative; z-index: 3;
        flex-shrink: 0;
      }

      /* Glass label beside the locator */
      #t2-lb-pulse .label-wrap {
        display: flex; flex-direction: column; gap: 8px;
        max-width: 420px;
      }

      #t2-lb-pulse .term {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 32px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
      }

      #t2-lb-pulse .detail-wrap {
        padding: 9px 18px 9px 16px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow);
        position: relative; overflow: hidden;
      }

      #t2-lb-pulse .detail-wrap::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45) 50%, transparent);
      }

      #t2-lb-pulse .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 20px;
        line-height: 1.45;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-pulse"
         data-composition-id="t2-lb-pulse"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="locator">
          <!-- Three expanding rings, animated by GSAP in sequence -->
          <div class="ring" id="t2-lb-pulse-r1"></div>
          <div class="ring" id="t2-lb-pulse-r2"></div>
          <div class="ring" id="t2-lb-pulse-r3"></div>
          <div class="dot-core"></div>
        </div>

        <div class="label-wrap">
          <div class="term" data-slot="term">Attention Peak</div>
          <div class="detail-wrap">
            <div class="detail" data-slot="detail">Viewer engagement spikes at this exact moment in every successful AI explainer video.</div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-pulse";

      /* Init rings fully collapsed and invisible */
      gsap.set(["#t2-lb-pulse-r1", "#t2-lb-pulse-r2", "#t2-lb-pulse-r3"], {
        scale: 0.18, autoAlpha: 0, transformOrigin: "50% 50%"
      });

      /* Glow blooms in */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
          duration: 1.2, ease: "power2.out" }, 0)

        /* Core dot pops in */
        .from(`${C} .dot-core`,
          { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%",
            duration: 0.55, ease: "back.out(1.7)" }, 0.28)

        /* Ring 1 expands + fades — finite */
        .to("#t2-lb-pulse-r1",
          { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%",
            duration: 0.01, ease: "none" }, 0.40)
        .to("#t2-lb-pulse-r1",
          { scale: 2.8, autoAlpha: 0, transformOrigin: "50% 50%",
            duration: 1.1, ease: "power2.out" }, 0.40)

        /* Ring 2 — staggered 0.22s */
        .to("#t2-lb-pulse-r2",
          { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%",
            duration: 0.01, ease: "none" }, 0.62)
        .to("#t2-lb-pulse-r2",
          { scale: 2.8, autoAlpha: 0, transformOrigin: "50% 50%",
            duration: 1.1, ease: "power2.out" }, 0.62)

        /* Ring 3 — staggered again */
        .to("#t2-lb-pulse-r3",
          { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%",
            duration: 0.01, ease: "none" }, 0.84)
        .to("#t2-lb-pulse-r3",
          { scale: 2.8, autoAlpha: 0, transformOrigin: "50% 50%",
            duration: 1.1, ease: "power2.out" }, 0.84)

        /* Term glides in from left */
        .from(`${C} .term`,
          { autoAlpha: 0, x: -24, filter: "blur(8px)",
            duration: 0.68, ease: "power4.out" }, 0.55)

        /* Detail panel glides in below */
        .from(`${C} .detail-wrap`,
          { autoAlpha: 0, y: 14, filter: "blur(7px)",
            duration: 0.62, ease: "power3.out" }, 0.75)

        /* Core dot finite glow breathe */
        .to(`${C} .dot-core`,
          { boxShadow: "0 0 40px rgba(55,189,248,0.80), 0 0 0 4px rgba(55,189,248,0.30)",
            duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.6)

        .set({}, {}, 7);

      window.__timelines["t2-lb-pulse"] = tl;
    </script>
  </body>
</html>
