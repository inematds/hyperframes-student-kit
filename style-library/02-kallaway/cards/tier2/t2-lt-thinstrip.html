<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · THINSTRIP
  A minimal full-width thin strip pinned to the very bottom of the frame.
  Name left-aligned, role right-aligned, separated by a stretching accent glow
  rule along the top edge. Maximally minimal — no glass card box, just the strip.
  Anchored bottom edge (full-width). Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-thin {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Diffuse glow bloom along bottom */
      #t2-lt-thin .local-bloom {
        position: absolute;
        left: 0; bottom: 0;
        width: 100%; height: 160px;
        background: linear-gradient(0deg,
          rgba(var(--accent-rgb), 0.16) 0%,
          rgba(var(--accent-rgb), 0.06) 50%,
          transparent 100%);
        pointer-events: none;
        z-index: 1;
      }

      /* The strip itself */
      #t2-lt-thin .strip {
        position: absolute;
        left: 0; bottom: 0;
        width: 1920px;
        height: 72px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-top: var(--stroke) solid var(--glass-border);
        box-shadow:
          0 -4px 40px rgba(0,0,0,0.50),
          inset 0 1px 0 var(--glass-hi);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 72px;
        z-index: 2;
        overflow: hidden;
      }

      /* Accent glow rule along top edge of strip */
      #t2-lt-thin .strip::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 0;  /* animated */
        height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.90) 15%,
          var(--accent) 50%,
          rgba(var(--accent-rgb), 0.90) 85%,
          transparent 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.70);
      }

      /* Name — left */
      #t2-lt-thin .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 32px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        white-space: nowrap;
      }

      /* Separator dot */
      #t2-lt-thin .sep-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent-sm);
        flex-shrink: 0;
        /* hidden initially, revealed in GSAP */
      }

      /* Role — right */
      #t2-lt-thin .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 24px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.1;
        white-space: nowrap;
        text-align: right;
      }

      /* Pseudo rule — we target via a wrapper div so GSAP can animate width */
      #t2-lt-thin .top-rule {
        position: absolute;
        top: 0; left: 0;
        height: 2px;
        width: 0;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.90) 0%,
          var(--accent) 50%,
          rgba(var(--accent-rgb), 0.70) 100%);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.70);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-thin"
         data-composition-id="t2-lt-thin"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="strip">
        <div class="top-rule"></div>
        <div class="name" data-slot="name">Alex Rivera</div>
        <div class="sep-dot"></div>
        <div class="role" data-slot="role">Course Creator &amp; AI Educator</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-thin";

      /* bloom reveals first */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, duration: 0.80, ease: "power2.out" }, 0);

      /* strip slides up from below */
      tl.from(`${C} .strip`,
        { autoAlpha: 0, y: 72,
          duration: 0.68, ease: "power4.out" }, 0.10);

      /* rule draws left-to-right across the full width */
      tl.to(`${C} .top-rule`,
        { width: 1920, duration: 0.75, ease: "power3.out" }, 0.44);

      /* name fades/slides in from left */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -28, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.72);

      /* sep dot pops */
      tl.from(`${C} .sep-dot`,
        { autoAlpha: 0, scale: 0, transformOrigin: "center",
          duration: 0.36, ease: "back.out(2.0)" }, 0.90);

      /* role slides in from right */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: 28, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.92);

      /* glow rule breathes — finite */
      tl.to(`${C} .top-rule`,
        { boxShadow: "0 0 26px rgba(55,189,248,0.90)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-thin"] = tl;
    </script>
  </body>
</html>
