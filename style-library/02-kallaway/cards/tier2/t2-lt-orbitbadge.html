<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · ORBITBADGE
  A small glowing avatar dot anchored lower-left with an orbiting ring satellite
  that travels a finite arc (270 degrees), then a name card slides out to its right.
  The orbit uses a rotating wrapper div so no trig/JS is needed for the arc path.
  Transparent overlay over live footage.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-obadge {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-obadge .local-bloom {
        position: absolute;
        left: 40px; bottom: 70px;
        width: 580px; height: 280px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 28% 78%,
          rgba(var(--accent-rgb), 0.26) 0%,
          rgba(var(--accent-rgb), 0.08) 52%,
          transparent 76%);
        filter: blur(44px);
        pointer-events: none;
        z-index: 1;
      }

      /* Anchor: avatar + orbit rig */
      #t2-lt-obadge .badge-rig {
        position: absolute;
        left: 80px; bottom: 132px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      /* Avatar circle */
      #t2-lt-obadge .avatar {
        position: relative;
        width: 80px; height: 80px;
        flex-shrink: 0;
      }

      #t2-lt-obadge .avatar-dot {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 34%,
          rgba(255,255,255,0.85) 0%,
          rgba(var(--accent-rgb),0.80) 40%,
          rgba(var(--accent-rgb),0.28) 75%,
          transparent 100%);
        box-shadow:
          0 0 22px rgba(var(--accent-rgb), 0.55),
          0 0 60px rgba(var(--accent-rgb), 0.25);
      }

      /* Orbit ring track (static faint) */
      #t2-lt-obadge .orbit-track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.20);
      }

      /* Rotating wrapper — the satellite rides on this div's edge */
      #t2-lt-obadge .orbit-rotor {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        /* satellite positioned at top-center of this div */
      }

      /* The satellite dot */
      #t2-lt-obadge .satellite {
        position: absolute;
        top: -5px;          /* sit just outside the ring top */
        left: 50%;
        transform: translateX(-50%);
        width: 11px; height: 11px;
        border-radius: 50%;
        background: var(--white);
        box-shadow:
          0 0 10px rgba(255,255,255,0.70),
          0 0 24px rgba(var(--accent-rgb), 0.80),
          0 0 50px rgba(var(--accent-rgb), 0.40);
      }

      /* Name card — slides in from the right side of the avatar */
      #t2-lt-obadge .name-card {
        padding: 16px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(var(--accent-rgb), 0.35),
          0 0 20px rgba(var(--accent-rgb), 0.16),
          inset 0 1px 0 var(--glass-hi);
        min-width: 300px;
      }

      #t2-lt-obadge .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 34px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 4px;
        line-height: 1.1;
      }

      #t2-lt-obadge .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 20px;
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.3;
      }

      #t2-lt-obadge .role::before {
        content: "";
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        margin-right: 8px;
        vertical-align: middle;
        position: relative; top: -1px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-obadge"
         data-composition-id="t2-lt-obadge"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="badge-rig">
        <div class="avatar">
          <div class="orbit-track"></div>
          <div class="orbit-rotor" id="obadge-rotor">
            <div class="satellite"></div>
          </div>
          <div class="avatar-dot"></div>
        </div>
        <div class="name-card" id="obadge-card">
          <div class="name" data-slot="name">Kallaway Osei</div>
          <div class="role" data-slot="role">AI Education Director, AIS</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-obadge";

      /* bloom */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.55, duration: 1.1, ease: "expo.out" }, 0);

      /* avatar dot blooms in */
      tl.from(`${C} .avatar-dot`,
        { autoAlpha: 0, scale: 0.3, duration: 0.80, ease: "back.out(1.4)" }, 0.14);

      /* orbit track ring fades in */
      tl.from(`${C} .orbit-track`,
        { autoAlpha: 0, scale: 0.50, duration: 0.60, ease: "expo.out" }, 0.30);

      /* satellite starts at top (rotor at 0deg), travels 270deg — finite arc */
      tl.set(`${C} .orbit-rotor`, { rotation: 0, transformOrigin: "50% 50%" }, 0.30);
      tl.to(`${C} .orbit-rotor`,
        { rotation: 270, duration: 1.0, ease: "power2.inOut",
          transformOrigin: "50% 50%" }, 0.45);

      /* name card slides in as orbit completes */
      tl.from(`${C} .name-card`,
        { autoAlpha: 0, x: -28, scale: 0.92,
          filter: "blur(10px)", transformOrigin: "left center",
          duration: 0.75, ease: "back.out(1.4)" }, 1.20);

      /* name */
      tl.from(`${C} .name`,
        { autoAlpha: 0, x: -16, duration: 0.55, ease: "power4.out" }, 1.55);

      /* role */
      tl.from(`${C} .role`,
        { autoAlpha: 0, x: -12, duration: 0.50, ease: "power3.out" }, 1.72);

      /* satellite slow continued drift — 2 more gentle passes, finite */
      tl.to(`${C} .orbit-rotor`,
        { rotation: 360, duration: 2.2, ease: "none",
          transformOrigin: "50% 50%" }, 2.00);
      tl.to(`${C} .orbit-rotor`,
        { rotation: 420, duration: 1.8, ease: "power2.out",
          transformOrigin: "50% 50%" }, 4.20);

      /* rim glow pulse on card — finite */
      tl.to(`${C} .name-card`, {
        boxShadow:
          "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(55,189,248,0.75), 0 0 32px rgba(55,189,248,0.36), inset 0 1px 0 rgba(255,255,255,0.22)",
        duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.10);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-obadge"] = tl;
    </script>
  </body>
</html>
