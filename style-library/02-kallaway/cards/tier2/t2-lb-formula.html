<!doctype html>
<!--
  KALLAWAY · tier2 · label · FORMULA
  A micro "X = Y" formula label — the left term is white/accent, the equals
  sign glows bright blue as the hero glyph, and the right side completes the
  equation. Anchored right. Glass background, no full-screen decorations.
  Slots: term (left side ~18 chars), detail (right side ~28 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-form {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom — centered behind card */
      #t2-lb-form .local-glow {
        position: absolute; right: 100px; top: 380px;
        width: 560px; height: 260px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 0;
      }

      /* Card wrapper anchored right */
      #t2-lb-form .wrapper {
        position: absolute; right: 140px; top: 420px;
        z-index: 2;
      }

      /* Outer glass card */
      #t2-lb-form .formula-card {
        display: inline-flex; flex-direction: column; gap: 0;
        padding: 26px 36px 24px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.30),
          0 0 28px rgba(var(--accent-rgb), 0.18),
          inset 0 1px 0 var(--glass-hi);
        position: relative; overflow: hidden;
        min-width: 480px;
      }

      /* Top-edge shimmer */
      #t2-lb-form .formula-card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 35%, rgba(255,255,255,0.50) 65%, transparent);
      }

      /* Small uppercase label above equation */
      #t2-lb-form .kicker-label {
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 14px;
      }

      /* The equation row */
      #t2-lb-form .equation {
        display: flex; align-items: baseline; gap: 20px;
        white-space: nowrap;
      }

      #t2-lb-form .eq-lhs {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 44px;
        letter-spacing: var(--track-tight);
        color: var(--white);
        text-shadow: var(--textglow);
      }

      /* THE glowing equals — hero glyph */
      #t2-lb-form .eq-sign {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 44px;
        color: var(--accent);
        text-shadow: var(--textglow-accent),
          0 0 42px rgba(var(--accent-rgb), 0.60);
        letter-spacing: 0;
      }

      #t2-lb-form .eq-rhs {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 44px;
        letter-spacing: var(--track-tight);
        color: var(--text-dim);
        text-shadow: var(--textglow);
      }

      /* Separator + detail beneath */
      #t2-lb-form .sep {
        width: 100%; height: 1px;
        background: linear-gradient(90deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04) 80%, transparent);
        margin: 14px 0 12px;
      }

      #t2-lb-form .detail {
        font-family: var(--font-body);
        font-weight: var(--wt-reg);
        font-size: 19px;
        line-height: 1.48;
        color: var(--text-dim);
        max-width: 460px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-form"
         data-composition-id="t2-lb-form"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="formula-card">
          <div class="kicker-label">Key Formula</div>
          <div class="equation">
            <div class="eq-lhs" data-slot="term">Intelligence</div>
            <div class="eq-sign" id="t2-lb-form-eq">=</div>
            <div class="eq-rhs" data-slot="detail">Data + Compute</div>
          </div>
          <div class="sep"></div>
          <div class="detail">The two resources every foundation model needs — and why scaling them changed everything.</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lb-form";

      /* Glow blooms in */
      tl.from(`${C} .local-glow`,
        { autoAlpha: 0, scale: 0.55, transformOrigin: "50% 50%",
          duration: 1.2, ease: "expo.out" }, 0)

        /* Card springs in from right */
        .from(`${C} .formula-card`,
          { autoAlpha: 0, x: 44, scale: 0.92, filter: "blur(12px)",
            transformOrigin: "right center",
            duration: 0.80, ease: "back.out(1.4)" }, 0.20)

        /* Kicker types in (fade) */
        .from(`${C} .kicker-label`,
          { autoAlpha: 0, x: 12,
            duration: 0.50, ease: "power3.out" }, 0.60)

        /* LHS glides in */
        .from(`${C} .eq-lhs`,
          { autoAlpha: 0, x: -18,
            duration: 0.55, ease: "power4.out" }, 0.75)

        /* Equals sign pops with a scale burst */
        .from(`${C} .eq-sign`,
          { autoAlpha: 0, scale: 1.6, transformOrigin: "50% 50%",
            duration: 0.50, ease: "back.out(1.6)" }, 0.95)

        /* RHS slides in from right */
        .from(`${C} .eq-rhs`,
          { autoAlpha: 0, x: 20,
            duration: 0.55, ease: "power4.out" }, 1.05)

        /* Separator reveals */
        .from(`${C} .sep`,
          { scaleX: 0, transformOrigin: "left center",
            duration: 0.45, ease: "power3.out" }, 1.20)

        /* Detail fades up */
        .from(`${C} .detail`,
          { autoAlpha: 0, y: 10,
            duration: 0.55, ease: "power3.out" }, 1.35)

        /* Equals glow pulse — finite */
        .to(`${C} .eq-sign`,
          { textShadow: "0 0 32px rgba(55,189,248,1.0), 0 0 72px rgba(55,189,248,0.65)",
            duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.80)

        .set({}, {}, 7);

      window.__timelines["t2-lb-form"] = tl;
    </script>
  </body>
</html>
