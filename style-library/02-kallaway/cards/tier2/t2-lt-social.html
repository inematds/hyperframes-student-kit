<!doctype html>
<!--
  KALLAWAY · tier2 · lower-third · SOCIAL
  Name + Space-Mono @handle + a small glowing platform dot, on frosted glass.
  Anchored lower-left. Transparent background — only the card paints.
  Slots: name (~26 chars), role (~40 chars — used as @handle here).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-soc {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom */
      #t2-lt-soc .local-bloom {
        position: absolute;
        left: 50px; bottom: 88px;
        width: 560px; height: 210px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 80%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.07) 50%,
          transparent 75%);
        filter: blur(32px);
        pointer-events: none;
        z-index: 1;
      }

      /* Glass card */
      #t2-lt-soc .card {
        position: absolute;
        left: 80px; bottom: 118px;
        min-width: 380px;
        padding: 22px 32px 20px 32px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.50),
          0 0 22px rgba(var(--accent-rgb), 0.20),
          inset 0 1px 0 var(--glass-hi);
        z-index: 2;
        overflow: hidden;
      }

      /* Inner top-highlight */
      #t2-lt-soc .card::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 40%, rgba(255,255,255,0.50) 60%, transparent);
      }

      /* Name row */
      #t2-lt-soc .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 36px;
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        margin-bottom: 10px;
        line-height: 1.1;
      }

      /* Social row: dot + handle */
      #t2-lt-soc .social-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Platform dot */
      #t2-lt-soc .platform-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow:
          0 0 8px rgba(var(--accent-rgb), 0.85),
          0 0 22px rgba(var(--accent-rgb), 0.50);
        flex-shrink: 0;
      }

      /* @handle in Space Mono */
      #t2-lt-soc .handle {
        font-family: var(--font-mono);
        font-weight: 400;
        font-size: 21px;
        letter-spacing: 0.02em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
      }

      /* role subtitle under handle — dimmer */
      #t2-lt-soc .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: 19px;
        letter-spacing: 0.01em;
        color: var(--text-faint);
        margin-top: 6px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-soc"
         data-composition-id="t2-lt-soc"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="card">
        <div class="name" data-slot="name">Ronny Mitchell</div>
        <div class="social-row">
          <div class="platform-dot"></div>
          <div class="handle" data-slot="role">@ronnymitchell</div>
        </div>
        <div class="role">Head of Content Strategy</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom fades in */
      tl.from("#t2-lt-soc .local-bloom",
        { autoAlpha: 0, scale: 0.65, duration: 1.2, ease: "power2.out" }, 0);

      /* card springs in from lower-left */
      tl.from("#t2-lt-soc .card",
        { autoAlpha: 0, x: -38, y: 26, scale: 0.92,
          filter: "blur(12px)", transformOrigin: "left bottom",
          duration: 0.82, ease: "back.out(1.4)" }, 0.10);

      /* name glides in */
      tl.from("#t2-lt-soc .name",
        { autoAlpha: 0, x: -18, filter: "blur(7px)",
          duration: 0.62, ease: "power4.out" }, 0.56);

      /* platform dot pops in */
      tl.from("#t2-lt-soc .platform-dot",
        { autoAlpha: 0, scale: 0, duration: 0.40, ease: "back.out(2.0)" }, 0.75);

      /* handle types in (x-slide) */
      tl.from("#t2-lt-soc .handle",
        { autoAlpha: 0, x: -16, filter: "blur(6px)",
          duration: 0.56, ease: "power3.out" }, 0.82);

      /* role line */
      tl.from("#t2-lt-soc .role",
        { autoAlpha: 0, x: -12, filter: "blur(4px)",
          duration: 0.50, ease: "power3.out" }, 0.96);

      /* platform dot glow pulse — finite */
      tl.to("#t2-lt-soc .platform-dot",
        { boxShadow: "0 0 14px rgba(55,189,248,1.00), 0 0 36px rgba(55,189,248,0.70)",
          duration: 1.0, ease: "sine.inOut", repeat: 4, yoyo: true }, 1.5);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-soc"] = tl;
    </script>
  </body>
</html>
