<!doctype html>
<!--
  KALLAWAY · tier2 · label · MEASURE
  A dimension/measure line with glowing end-ticks that animate-draw, a centered
  value label on the line, and a term + detail block below. Anchored left side.
  Slots: term (~28 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-meas {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
      }

      /* Localized glow — left */
      #t2-lb-meas .local-glow {
        position: absolute; left: 80px; top: 420px;
        width: 560px; height: 300px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 50%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 82%);
        filter: blur(50px);
        pointer-events: none;
      }

      /* Wrapper anchored left */
      #t2-lb-meas .wrapper {
        position: absolute; left: 120px; top: 450px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 18px;
      }

      /* SVG measure line container */
      #t2-lb-meas .meas-svg-wrap {
        width: 480px; height: 48px; position: relative;
      }

      #t2-lb-meas .meas-svg {
        width: 480px; height: 48px;
        overflow: visible;
      }

      /* Centered value label on the line */
      #t2-lb-meas .meas-value {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: 0.04em;
        color: var(--white); text-shadow: var(--textglow);
        padding: 4px 14px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 8px;
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        white-space: nowrap;
        z-index: 2;
      }

      /* Term + detail glass block */
      #t2-lb-meas .text-block {
        padding: 14px 24px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.16);
        max-width: 480px;
        position: relative; overflow: hidden;
      }

      #t2-lb-meas .text-block::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.36) 50%, transparent);
      }

      #t2-lb-meas .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 26px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 4px;
      }

      #t2-lb-meas .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 20px; line-height: 1.45; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-meas" data-composition-id="t2-lb-meas" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="meas-svg-wrap">
          <!-- The measure line draws from center outward via stroke-dashoffset -->
          <svg class="meas-svg" viewBox="0 0 480 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="measLineGlow" x="-10%" y="-200%" width="120%" height="500%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- Main horizontal line -->
            <line id="t2-lb-meas-line"
              x1="0" y1="24" x2="480" y2="24"
              stroke="rgba(55,189,248,0.70)"
              stroke-width="1.5"
              stroke-dasharray="480"
              stroke-dashoffset="480"
              filter="url(#measLineGlow)"
            />

            <!-- Left end-tick -->
            <line id="t2-lb-meas-tick-l"
              x1="0" y1="10" x2="0" y2="38"
              stroke="#37BDF8" stroke-width="2.5" stroke-linecap="round"
              style="filter: drop-shadow(0 0 6px rgba(55,189,248,0.80));"
            />
            <!-- Right end-tick -->
            <line id="t2-lb-meas-tick-r"
              x1="480" y1="10" x2="480" y2="38"
              stroke="#37BDF8" stroke-width="2.5" stroke-linecap="round"
              style="filter: drop-shadow(0 0 6px rgba(55,189,248,0.80));"
            />
          </svg>
          <div class="meas-value">12 wk</div>
        </div>

        <div class="text-block">
          <div class="term" data-slot="term">Course Duration</div>
          <div class="detail" data-slot="detail">Self-paced — complete at your own speed</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP   = "#t2-lb-meas";
      const lineEl = document.getElementById("t2-lb-meas-line");
      const tickL  = document.getElementById("t2-lb-meas-tick-l");
      const tickR  = document.getElementById("t2-lb-meas-tick-r");

      /* Init: ticks invisible, line hidden */
      gsap.set([tickL, tickR], { autoAlpha: 0 });

      /* glow blooms */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.55, transformOrigin: "40% 50%",
            duration: 1.1, ease: "expo.out" }, 0)

        /* ticks flash in simultaneously */
        .to([tickL, tickR], {
            autoAlpha: 1, scale: 1.0, transformOrigin: "50% 50%",
            duration: 0.30, ease: "power3.out" }, 0.22)

        /* line draws from left to right via strokeDashoffset proxy */
        .to({ val: 480 }, {
            val: 0,
            duration: 0.70, ease: "power3.out",
            onUpdate: function () {
              lineEl.style.strokeDashoffset = this.targets()[0].val;
            }
          }, 0.30)

        /* value label fades in at mid-draw */
        .from(`${COMP} .meas-value`, {
            autoAlpha: 0, scale: 0.80, filter: "blur(8px)",
            duration: 0.52, ease: "back.out(1.4)" }, 0.65)

        /* text block glides up */
        .from(`${COMP} .text-block`, {
            autoAlpha: 0, y: 18, filter: "blur(8px)",
            duration: 0.65, ease: "power4.out" }, 0.78)

        /* finite tick glow pulse */
        .to(tickL, {
            attr: { "stroke-width": 4 },
            duration: 0.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.60)
        .to(tickR, {
            attr: { "stroke-width": 4 },
            duration: 0.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.60)

        .set({}, {}, 7);

      window.__timelines["t2-lb-meas"] = tl;
    </script>
  </body>
</html>
