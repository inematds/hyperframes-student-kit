<!doctype html>
<!--
  KALLAWAY · tier2 · label · KEYWORD
  A big glowing KEYWORD (`term`) rendered as gradient white→blue clip-text on a
  slim dark glass underlay, with a small `note` beneath.
  Anchored left-of-center. Transparent overlay.
  Slots: term (~24 chars), note (~50 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-key {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized glow — concentrated behind the keyword */
      #t2-lb-key .local-glow {
        position: absolute; left: 60px; top: 350px;
        width: 700px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 42% 50%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 75%);
        filter: blur(44px);
        pointer-events: none;
      }

      /* Wrapper anchored left */
      #t2-lb-key .wrap {
        position: absolute; left: 80px; top: 380px;
        width: 700px;
      }

      /* Slim dark glass underlay for the whole block */
      #t2-lb-key .underlay {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-top: 1.5px solid rgba(255,255,255,0.16);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius);
        padding: 26px 36px 24px;
        position: relative; overflow: hidden;
      }

      /* Left accent edge stripe */
      #t2-lb-key .underlay::before {
        content: "";
        position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: linear-gradient(180deg,
          var(--accent) 0%, rgba(var(--accent-rgb), 0.10) 100%);
        box-shadow: 2px 0 12px rgba(var(--accent-rgb), 0.50);
        border-radius: 2px 0 0 2px;
      }

      /* The keyword itself — gradient clip-text */
      #t2-lb-key .keyword {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-headline); /* 54px */
        letter-spacing: var(--track-tight);
        line-height: 1.05;
        background: linear-gradient(100deg,
          #FFFFFF 0%, #FFFFFF 45%,
          var(--accent) 75%, rgba(var(--accent-rgb), 0.75) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        /* halo glow via filter since text-shadow doesn't work on clip-text */
        filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.50))
                drop-shadow(0 0 6px rgba(255,255,255,0.30));
        display: block;
        margin-bottom: 12px;
      }

      /* Small note below */
      #t2-lb-key .note {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: 21px; letter-spacing: 0.04em;
        color: var(--text-dim);
        padding-left: 0;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-key" data-composition-id="t2-lb-key" data-start="0" data-width="1920" data-height="1080">
      <div class="local-glow"></div>

      <div class="wrap">
        <div class="underlay">
          <span class="keyword" data-slot="term">Prompt Leakage</span>
          <div class="note" data-slot="note">When system instructions bleed into visible output.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP = "#t2-lb-key";

      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "40% 50%",
            duration: 1.3, ease: "expo.out" }, 0)

        /* underlay glides in from left */
        .from(`${COMP} .underlay`, {
            autoAlpha: 0, x: -48, filter: "blur(14px)",
            duration: 0.82, ease: "back.out(1.4)" }, 0.20)

        /* keyword expands up + blur resolves */
        .from(`${COMP} .keyword`, {
            autoAlpha: 0, y: 20, filter: "blur(18px) brightness(1.5)",
            duration: 0.78, ease: "power4.out" }, 0.52)

        /* note fades in */
        .from(`${COMP} .note`, {
            autoAlpha: 0, y: 8, filter: "blur(6px)",
            duration: 0.50, ease: "power3.out" }, 0.90)

        /* glow breathe on keyword — finite */
        .to(`${COMP} .keyword`, {
            filter: "drop-shadow(0 0 30px rgba(55,189,248,0.75)) drop-shadow(0 0 10px rgba(255,255,255,0.45))",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t2-lb-key"] = tl;
    </script>
  </body>
</html>
