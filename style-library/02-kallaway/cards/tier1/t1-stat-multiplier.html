<!doctype html>
<!--
  KALLAWAY · tier1 · stat · MULTIPLIER
  A glowing "2.9x" multiplier (big gradient number) with an "x" suffix that pops in
  separately, kicker above, label below. The number counts up. Halo bloom behind it.
  Slots: kicker (~28 chars uppercase), stat (e.g. "2.9x"), label (~70 chars, <em>),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-mult {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-mult .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-mult .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Halo disc behind number */
      #t1-stat-mult .halo {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -56%);
        width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--accent-rgb), 0.14) 0%,
          rgba(var(--accent-rgb), 0.05) 42%,
          transparent 70%);
        box-shadow: 0 0 130px 30px rgba(var(--accent-rgb), 0.18);
        z-index: 2;
      }

      /* Content */
      #t1-stat-mult .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 44px; padding-bottom: 40px;
      }

      #t1-stat-mult .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Multiplier number + "x" in a flex row */
      #t1-stat-mult .stat-row {
        display: flex; align-items: flex-end; gap: 8px; line-height: 1;
      }
      #t1-stat-mult .stat-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 280px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(160deg, #ffffff 12%, rgba(var(--accent-rgb),0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.55))
                drop-shadow(0 0 80px rgba(var(--accent-rgb), 0.28));
      }
      /* The "x" suffix — accent color, slightly smaller, floats to bottom */
      #t1-stat-mult .stat-x {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 160px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        padding-bottom: 18px;           /* optical align with number bottom */
      }

      #t1-stat-mult .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
      }
      #t1-stat-mult .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-mult .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-mult .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-mult .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-mult" data-composition-id="t1-stat-mult" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="halo"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">PRODUCTIVITY LIFT · AI TEAMS</div>

        <div class="stat-row">
          <div class="stat-num" id="t1-stat-mult-num" data-slot="stat">2.9</div>
          <div class="stat-x" id="t1-stat-mult-x">×</div>
        </div>

        <div class="label" data-slot="label">teams using AI-assisted workflows achieve <em>2.9× higher output</em> per engineer per sprint</div>
      </div>

      <div class="source" data-slot="source">SOURCE · GITHUB COPILOT STUDY 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Parse the number portion of the stat slot (strip "x" / "×" suffix) */
      const numEl  = document.getElementById("t1-stat-mult-num");
      const xEl    = document.getElementById("t1-stat-mult-x");
      const raw    = numEl.textContent.trim();
      const target = parseFloat(raw) || 2.9;
      const decimals = (raw.includes(".")) ? (raw.split(".")[1] || "").length : 0;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-mult .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-mult .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-mult .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-stat-mult .halo",
          { autoAlpha: 0, scale: 0.6, duration: 1.6, ease: "expo.out" }, 0.3)

        /* kicker */
        .from("#t1-stat-mult .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.55)

        /* number focus pull + count-up */
        .from("#t1-stat-mult .stat-num",
          { autoAlpha: 0, scale: 0.78, filter: "blur(28px)", transformOrigin: "50% 50%",
            duration: 1.1, ease: "power4.out" }, 0.80)
        .to({ val: 0 }, { val: target,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            numEl.textContent = decimals > 0 ? v.toFixed(decimals) : Math.round(v).toString();
          }
        }, 0.82)

        /* "x" pops in with spring after the number lands */
        .from("#t1-stat-mult .stat-x",
          { autoAlpha: 0, x: -20, scale: 0.6, filter: "blur(14px)",
            duration: 0.65, ease: "back.out(1.4)" }, 2.00)

        /* label */
        .from("#t1-stat-mult .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.20)

        /* source */
        .from("#t1-stat-mult .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.50)

        /* breathing glow on halo */
        .to("#t1-stat-mult .halo",
          { opacity: 0.50, scale: 1.06, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.80)

        .set({}, {}, 7);

      window.__timelines["t1-stat-mult"] = tl;
    </script>
  </body>
</html>
