<!doctype html>
<!--
  KALLAWAY · tier1 · stat · WATERFALL
  Waterfall chart — bars build step-by-step, each offset vertically from the last,
  left-to-right, accumulating to a glowing total. Each bar's height animates in
  with a spring. The final "Total" bar is accent-white and brighter.
  Slots: kicker (~28 chars), stat (total value, e.g. "$3.2M"), label (~65 chars),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-water {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-water .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-water .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* chart area — centred with stat above */
      #t1-stat-water .chart-wrap {
        position: absolute; left: 140px; right: 140px; top: 80px; bottom: 140px;
        z-index: 4; display: flex; flex-direction: column; gap: 0;
      }

      /* Top header row */
      #t1-stat-water .header {
        display: flex; align-items: flex-end; justify-content: space-between;
        padding: 0 0 40px 0;
      }
      #t1-stat-water .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
      #t1-stat-water .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 120px; line-height: 0.9; letter-spacing: var(--track-tight);
        background: linear-gradient(135deg, #ffffff 10%, rgba(var(--accent-rgb), 0.88) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }

      /* SVG chart */
      #t1-stat-water .wfall-svg {
        flex: 1; width: 100%;
      }

      /* Labels below chart */
      #t1-stat-water .label {
        font-family: var(--font-body); font-size: 28px;
        font-weight: var(--wt-med); color: var(--text-dim);
        line-height: 1.45; padding-top: 28px; max-width: 1100px;
      }
      #t1-stat-water .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-water .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-water .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-water .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-water" data-composition-id="t1-stat-water" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="chart-wrap">
        <div class="header">
          <div class="kicker" data-slot="kicker">REVENUE BUILD · FY 2026</div>
          <div class="stat" id="wf-num" data-slot="stat">$3.2M</div>
        </div>

        <!--
          Waterfall bars. Canvas width ~1640px inside padding. 5 +1 total bars.
          Bar widths=190px, gap=58px. Chart height ~580px.
          Baseline y=580. Bars (values normalized, max 580):
          Bar0 "Courses"   +220 → y_top=360, height=220  (starts at 360)
          Bar1 "Certs"     +165 → y_top=195, height=165  (starts at 195)
          Bar2 "Coaching"  +110 → y_top=85,  height=110  (starts at 85)
          Bar3 "Events"    +75  → y_top=10,  height=75   (starts at 10)
          Bar4 "Refunds"   -55  → y_top=65,  height=55   (negative bar, red-tint)
          Bar5 "TOTAL"     whole height=515 (sum 220+165+110+75-55=515) bottom=65, top=65
          x positions: 0,248,496,744,992,1312 (wider total)
        -->
        <svg class="wfall-svg" id="wf-svg" viewBox="0 0 1640 580" preserveAspectRatio="xMidYMid meet"
             fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="wgPos" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.50"/>
            </linearGradient>
            <linearGradient id="wgNeg" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FF8A5C" stop-opacity="0.75"/>
              <stop offset="100%" stop-color="#FF3B30" stop-opacity="0.45"/>
            </linearGradient>
            <linearGradient id="wgTotal" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1.00"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.80"/>
            </linearGradient>
            <filter id="wGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
              <feComposite in="SourceGraphic" in2="b" operator="over"/>
            </filter>
          </defs>

          <!-- baseline -->
          <line x1="0" y1="580" x2="1640" y2="580" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

          <!-- connector dotted lines between bars -->
          <line id="wc0" x1="190" y1="360" x2="248" y2="360" stroke="rgba(255,255,255,0.20)" stroke-width="1" stroke-dasharray="4 4"/>
          <line id="wc1" x1="438" y1="195" x2="496" y2="195" stroke="rgba(255,255,255,0.20)" stroke-width="1" stroke-dasharray="4 4"/>
          <line id="wc2" x1="686" y1="85"  x2="744" y2="85"  stroke="rgba(255,255,255,0.20)" stroke-width="1" stroke-dasharray="4 4"/>
          <line id="wc3" x1="934" y1="10"  x2="992" y2="10"  stroke="rgba(255,255,255,0.20)" stroke-width="1" stroke-dasharray="4 4"/>
          <line id="wc4" x1="1182" y1="65" x2="1312" y2="65" stroke="rgba(255,255,255,0.20)" stroke-width="1" stroke-dasharray="4 4"/>

          <!-- Bar 0: Courses +220, y=360..580 -->
          <rect id="wb0" x="0"    y="360" width="190" height="220"
                fill="url(#wgPos)" rx="5" filter="url(#wGlow)"
                stroke="rgba(55,189,248,0.40)" stroke-width="1.5"/>

          <!-- Bar 1: Certs +165, y=195..360 -->
          <rect id="wb1" x="248"  y="195" width="190" height="165"
                fill="url(#wgPos)" rx="5" filter="url(#wGlow)"
                stroke="rgba(55,189,248,0.35)" stroke-width="1.5"/>

          <!-- Bar 2: Coaching +110, y=85..195 -->
          <rect id="wb2" x="496"  y="85"  width="190" height="110"
                fill="url(#wgPos)" rx="5" filter="url(#wGlow)"
                stroke="rgba(55,189,248,0.35)" stroke-width="1.5"/>

          <!-- Bar 3: Events +75, y=10..85 -->
          <rect id="wb3" x="744"  y="10"  width="190" height="75"
                fill="url(#wgPos)" rx="5" filter="url(#wGlow)"
                stroke="rgba(55,189,248,0.35)" stroke-width="1.5"/>

          <!-- Bar 4: Refunds -55 (negative), y=10..65 -->
          <rect id="wb4" x="992"  y="10"  width="190" height="55"
                fill="url(#wgNeg)" rx="5" filter="url(#wGlow)"
                stroke="rgba(255,59,48,0.50)" stroke-width="1.5"/>

          <!-- Bar 5: TOTAL 515, y=65..580 -->
          <rect id="wb5" x="1312" y="65"  width="220" height="515"
                fill="url(#wgTotal)" rx="5" filter="url(#wGlow)"
                stroke="rgba(255,255,255,0.55)" stroke-width="2"/>

          <!-- Bar labels (bottom of chart area, at y=595) -->
          <text x="95"   y="597" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="rgba(240,238,233,0.55)">Courses</text>
          <text x="343"  y="597" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="rgba(240,238,233,0.55)">Certs</text>
          <text x="591"  y="597" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="rgba(240,238,233,0.55)">Coaching</text>
          <text x="839"  y="597" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="rgba(240,238,233,0.55)">Events</text>
          <text x="1087" y="597" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="rgba(255,138,92,0.75)">Refunds</text>
          <text x="1422" y="597" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="rgba(255,255,255,0.80)" font-weight="700">TOTAL</text>

          <!-- Value labels above each bar -->
          <text id="wv0" x="95"   y="350" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.70)">+$1.4M</text>
          <text id="wv1" x="343"  y="185" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.70)">+$1.0M</text>
          <text id="wv2" x="591"  y="75"  text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.70)">+$680K</text>
          <text id="wv3" x="839"  y="0"   text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.70)">+$460K</text>
          <text id="wv4" x="1087" y="0"   text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="22" font-weight="700" fill="rgba(255,138,92,0.85)">−$340K</text>
          <text id="wv5" x="1422" y="55"  text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="24" font-weight="800" fill="rgba(255,255,255,0.92)">$3.2M</text>
        </svg>

        <div class="label" data-slot="label">
          course revenue leads the stack — <em>coaching upsells</em> and certification bundles compound each cohort
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS FINANCE DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain */
      tl.fromTo("#t1-stat-water .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "115px 88px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-water .bloom",
          { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-stat-water .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker + stat header */
        .from("#t1-stat-water .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.45)
        .from("#t1-stat-water .stat",
          { autoAlpha: 0, y: 20, duration: 0.75, ease: "back.out(1.4)" }, 0.55);

      /* bars and connectors build left-to-right from bottom */
      const barIds = ["#wb0","#wb1","#wb2","#wb3","#wb4","#wb5"];
      const valIds = ["#wv0","#wv1","#wv2","#wv3","#wv4","#wv5"];
      const connIds = ["#wc0","#wc1","#wc2","#wc3","#wc4"];
      /* bar original heights and y positions (from SVG) */
      const barData = [
        { h: 220, y: 360 },
        { h: 165, y: 195 },
        { h: 110, y: 85  },
        { h: 75,  y: 10  },
        { h: 55,  y: 10  },
        { h: 515, y: 65  }
      ];

      barData.forEach(function(d, i) {
        const el = document.querySelector(barIds[i]);
        /* set initial state: zero height anchored at bottom */
        el.setAttribute("y",      d.y + d.h);
        el.setAttribute("height", 0);
        const startT = 0.80 + i * 0.22;
        tl.to({ val: 0 }, {
          val: d.h,
          duration: 0.65, ease: "back.out(1.3)",
          onUpdate: function() {
            const v = this.targets()[0].val;
            el.setAttribute("y", d.y + d.h - v);
            el.setAttribute("height", v);
          }
        }, startT);

        tl.from(valIds[i], { autoAlpha: 0, duration: 0.3, ease: "power2.out" }, startT + 0.50);

        if (i < connIds.length) {
          tl.from(connIds[i], { autoAlpha: 0, duration: 0.25, ease: "power2.out" }, startT + 0.60);
        }
      });

      tl
        .from("#t1-stat-water .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.60)
        .from("#t1-stat-water .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.90)
        .set({}, {}, 7);

      window.__timelines["t1-stat-water"] = tl;
    </script>
  </body>
</html>
