<!doctype html>
<!--
  KALLAWAY · tier1 · section · PRISM
  Full-screen chapter takeover. A narrow light beam enters from the left,
  strikes a glass prism shape at center-left, and refracts into a soft
  chromatic fan of blue-led color bands spreading to the right. The kicker
  and headline sit in the open right-hand space.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-prism {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-prism .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-prism .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* ---- Prism SVG container ---- */
      #t1-sec-prism .prism-svg-wrap {
        position: absolute;
        left: 80px; top: 50%;
        transform: translateY(-50%);
        width: 900px; height: 700px;
        z-index: 3;
      }
      #t1-sec-prism .prism-svg {
        width: 100%; height: 100%;
        overflow: visible;
      }

      /* Spectrum glow behind the beam fans */
      #t1-sec-prism .spectrum-glow {
        position: absolute;
        left: 280px; top: 50%;
        transform: translateY(-50%);
        width: 660px; height: 500px;
        background: conic-gradient(
          from 155deg at 8% 50%,
          rgba(255,255,255,0) 0deg,
          rgba(125,215,255,0.18) 14deg,
          rgba(55,189,248,0.32) 28deg,
          rgba(80,148,255,0.26) 42deg,
          rgba(130,80,255,0.16) 56deg,
          rgba(255,255,255,0) 70deg
        );
        filter: blur(28px);
        z-index: 2;
        opacity: 0;
      }

      /* Text panel — right side */
      #t1-sec-prism .content {
        position: absolute;
        left: 1020px; top: 50%;
        transform: translateY(-50%);
        z-index: 5;
      }
      #t1-sec-prism .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); margin-bottom: 28px;
      }
      #t1-sec-prism .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 78px; line-height: 1.06; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 820px;
      }
      #t1-sec-prism .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-prism .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-prism .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-prism" data-composition-id="t1-sec-prism" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- SVG: incoming beam + prism triangle + refraction fans -->
      <div class="prism-svg-wrap">
        <div class="spectrum-glow" id="t1-sec-prism-sglow"></div>
        <svg class="prism-svg" viewBox="0 0 900 700" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,0)" />
              <stop offset="70%" stop-color="rgba(255,255,255,0.9)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0.7)" />
            </linearGradient>
            <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <!-- Refracted beam gradients: blue-led spectrum -->
            <linearGradient id="ray1Grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,0.85)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>
            <linearGradient id="ray2Grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(200,235,255,0.80)" />
              <stop offset="100%" stop-color="rgba(200,235,255,0)" />
            </linearGradient>
            <linearGradient id="ray3Grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(55,189,248,0.88)" />
              <stop offset="100%" stop-color="rgba(55,189,248,0)" />
            </linearGradient>
            <linearGradient id="ray4Grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(80,148,255,0.75)" />
              <stop offset="100%" stop-color="rgba(80,148,255,0)" />
            </linearGradient>
            <linearGradient id="ray5Grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(130,80,255,0.60)" />
              <stop offset="100%" stop-color="rgba(130,80,255,0)" />
            </linearGradient>
          </defs>

          <!-- Incoming beam (horizontal, hits prism at ~350,350) -->
          <line id="t1-sec-prism-beam"
            x1="0" y1="350" x2="350" y2="350"
            stroke="url(#beamGrad)" stroke-width="3"
            stroke-linecap="round"
            filter="url(#prismGlow)" />
          <!-- Beam glow -->
          <line id="t1-sec-prism-beam-glow"
            x1="0" y1="350" x2="350" y2="350"
            stroke="rgba(255,255,255,0.18)" stroke-width="14"
            stroke-linecap="round" />

          <!-- Prism triangle (equilateral, vertex pointing right) -->
          <!-- vertices: left-top(280,220) left-bottom(280,480) right-tip(400,350) -->
          <polygon id="t1-sec-prism-tri"
            points="280,220 280,480 400,350"
            fill="rgba(255,255,255,0.04)"
            stroke="rgba(var(--accent-rgb),0.8)"
            stroke-width="1.5"
            filter="url(#prismGlow)" />
          <!-- Prism face highlight -->
          <line x1="280" y1="220" x2="400" y2="350"
            stroke="rgba(255,255,255,0.55)" stroke-width="1"
            stroke-linecap="round" />

          <!-- Refracted rays fanning out to the right -->
          <!-- Ray 1 — straight through, slight upward -->
          <line id="t1-sec-prism-ray1"
            x1="400" y1="350" x2="900" y2="290"
            stroke="url(#ray1Grad)" stroke-width="2"
            stroke-linecap="round" filter="url(#prismGlow)" />
          <!-- Ray 2 -->
          <line id="t1-sec-prism-ray2"
            x1="400" y1="350" x2="900" y2="320"
            stroke="url(#ray2Grad)" stroke-width="2.5"
            stroke-linecap="round" filter="url(#prismGlow)" />
          <!-- Ray 3 — hero blue -->
          <line id="t1-sec-prism-ray3"
            x1="400" y1="350" x2="900" y2="352"
            stroke="url(#ray3Grad)" stroke-width="3"
            stroke-linecap="round" filter="url(#prismGlow)" />
          <!-- Ray 4 -->
          <line id="t1-sec-prism-ray4"
            x1="400" y1="350" x2="900" y2="385"
            stroke="url(#ray4Grad)" stroke-width="2.5"
            stroke-linecap="round" filter="url(#prismGlow)" />
          <!-- Ray 5 -->
          <line id="t1-sec-prism-ray5"
            x1="400" y1="350" x2="900" y2="420"
            stroke="url(#ray5Grad)" stroke-width="2"
            stroke-linecap="round" filter="url(#prismGlow)" />
        </svg>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Part 1 —</div>
        <div class="headline" data-slot="headline">One Input.<br><em>Many Possibilities.</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-prism .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-prism .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-prism .grid",
          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* incoming beam draws from left to right */
        .from("#t1-sec-prism-beam, #t1-sec-prism-beam-glow",
          { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0.5)
        .fromTo("#t1-sec-prism-beam, #t1-sec-prism-beam-glow",
          { strokeDasharray: "350 350", strokeDashoffset: "350" },
          { strokeDashoffset: "0", duration: 0.65, ease: "power3.out" }, 0.5)

        /* prism triangle fades in */
        .from("#t1-sec-prism-tri",
          { autoAlpha: 0, scale: 0.5, transformOrigin: "340px 350px",
            duration: 0.6, ease: "back.out(1.8)" }, 1.0)

        /* refracted rays draw one by one */
        .from("#t1-sec-prism-ray1",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "400px 290px", duration: 0.5, ease: "power2.out" }, 1.35)
        .from("#t1-sec-prism-ray2",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "400px 320px", duration: 0.5, ease: "power2.out" }, 1.45)
        .from("#t1-sec-prism-ray3",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "400px 352px", duration: 0.6, ease: "power3.out" }, 1.55)
        .from("#t1-sec-prism-ray4",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "400px 385px", duration: 0.5, ease: "power2.out" }, 1.65)
        .from("#t1-sec-prism-ray5",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "400px 420px", duration: 0.5, ease: "power2.out" }, 1.75)

        /* spectrum glow blooms */
        .to("#t1-sec-prism-sglow",
          { autoAlpha: 1, duration: 0.8, ease: "power2.out" }, 1.6)

        /* text slides in */
        .from("#t1-sec-prism .kicker",
          { autoAlpha: 0, x: 30, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 1.5)
        .from("#t1-sec-prism .headline",
          { autoAlpha: 0, x: 40, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.75)

        /* gentle breathing of spectrum glow */
        .to("#t1-sec-prism-sglow",
          { opacity: 0.55, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-sec-prism"] = tl;
    </script>
  </body>
</html>
