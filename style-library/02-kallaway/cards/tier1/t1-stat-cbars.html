<!doctype html>
<!--
  KALLAWAY · tier1 · stat · CBARS
  Two compared horizontal glowing bars grow from left to length representing
  data-a and data-b. Values sit at the bar tips with glowing labels. A vertical
  separator divides the two rows making the gap immediately readable. Aurora bloom,
  glass card, cool dark canvas.
  Knobs: data-a (default 35), data-b (default 82) on #t1-stat-cbars.
  Slots: kicker (~28 chars uppercase), statA (value A label e.g. "35%"),
         statB (value B label e.g. "82%"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-cbars {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-cbars .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-cbars .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Glass card housing the bars */
      #t1-stat-cbars .glass-card {
        position: absolute;
        left: 200px; right: 200px; top: 220px; bottom: 200px;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-top: var(--stroke) solid var(--glass-hi);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        z-index: 2;
      }

      /* Content layout */
      #t1-stat-cbars .stage {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: flex-start; justify-content: center;
        z-index: 4;
        padding: 0 280px 30px 280px;
        gap: 48px;
      }

      #t1-stat-cbars .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        align-self: center;
      }

      /* Bar rows container */
      #t1-stat-cbars .bars {
        width: 100%;
        display: flex; flex-direction: column; gap: 52px;
      }

      /* Single bar row */
      #t1-stat-cbars .bar-row {
        display: flex; flex-direction: column; gap: 14px;
      }
      #t1-stat-cbars .bar-meta {
        display: flex; align-items: baseline; gap: 20px;
      }
      #t1-stat-cbars .bar-row-label {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
        width: 180px;
        flex-shrink: 0;
      }
      #t1-stat-cbars .bar-val {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 72px;
        line-height: 1;
        letter-spacing: var(--track-tight);
      }
      /* A = accent blue, B = warm accent-2 yellow */
      #t1-stat-cbars .bar-row.row-a .bar-val {
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
      #t1-stat-cbars .bar-row.row-b .bar-val {
        color: var(--accent-2);
        text-shadow: 0 0 18px rgba(var(--accent2-rgb), 0.65), 0 0 48px rgba(var(--accent2-rgb), 0.35);
      }

      /* Track + fill */
      #t1-stat-cbars .bar-track {
        width: 100%; height: 24px;
        background: rgba(255,255,255,0.06);
        border-radius: 12px;
        position: relative; overflow: hidden;
      }
      #t1-stat-cbars .bar-fill {
        position: absolute; left: 0; top: 0; bottom: 0;
        border-radius: 12px;
        width: 0%; /* animated by GSAP */
      }
      #t1-stat-cbars .bar-row.row-a .bar-fill {
        background: linear-gradient(90deg, rgba(var(--accent-rgb),0.5) 0%, var(--accent) 100%);
        box-shadow: 0 0 16px 2px rgba(var(--accent-rgb),0.55), 0 0 40px rgba(var(--accent-rgb),0.25);
      }
      #t1-stat-cbars .bar-row.row-b .bar-fill {
        background: linear-gradient(90deg, rgba(var(--accent2-rgb),0.5) 0%, var(--accent-2) 100%);
        box-shadow: 0 0 16px 2px rgba(var(--accent2-rgb),0.55), 0 0 40px rgba(var(--accent2-rgb),0.25);
      }
      /* Tip dot */
      #t1-stat-cbars .bar-tip {
        position: absolute; right: 0; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; border-radius: 50%;
      }
      #t1-stat-cbars .bar-row.row-a .bar-tip {
        background: var(--white);
        box-shadow: 0 0 10px 4px rgba(var(--accent-rgb),0.8);
      }
      #t1-stat-cbars .bar-row.row-b .bar-tip {
        background: var(--white);
        box-shadow: 0 0 10px 4px rgba(var(--accent2-rgb),0.8);
      }

      /* Horizontal divider between rows */
      #t1-stat-cbars .divider {
        width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12) 40%, rgba(255,255,255,0.12) 60%, transparent);
      }

      #t1-stat-cbars .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        align-self: center;
        max-width: 1000px;
        line-height: 1.45;
      }
      #t1-stat-cbars .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-cbars .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-cbars .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-cbars .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-cbars" data-composition-id="t1-stat-cbars"
         data-a="35" data-b="82"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="glass-card"></div>

      <div class="stage">
        <div class="kicker" data-slot="kicker">COURSE COMPLETION · BEFORE VS AFTER AI</div>

        <div class="bars">
          <!-- Bar A (before) -->
          <div class="bar-row row-a">
            <div class="bar-meta">
              <div class="bar-row-label">BEFORE</div>
              <div class="bar-val" id="t1-stat-cbars-valA" data-slot="statA">35%</div>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="t1-stat-cbars-fillA">
                <div class="bar-tip"></div>
              </div>
            </div>
          </div>

          <div class="divider" id="t1-stat-cbars-divider"></div>

          <!-- Bar B (after) -->
          <div class="bar-row row-b">
            <div class="bar-meta">
              <div class="bar-row-label">AFTER</div>
              <div class="bar-val" id="t1-stat-cbars-valB" data-slot="statB">82%</div>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="t1-stat-cbars-fillB">
                <div class="bar-tip"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="label" data-slot="label">adding AI-assisted feedback loops <em>more than doubled</em> learner completion across every cohort</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS INTERNAL COHORT DATA 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const root   = document.getElementById("t1-stat-cbars");
      const valA   = parseFloat(root.getAttribute("data-a")) || 35;
      const valB   = parseFloat(root.getAttribute("data-b")) || 82;
      const fillA  = document.getElementById("t1-stat-cbars-fillA");
      const fillB  = document.getElementById("t1-stat-cbars-fillB");
      const numA   = document.getElementById("t1-stat-cbars-valA");
      const numB   = document.getElementById("t1-stat-cbars-valB");

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-cbars .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "88px 66px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-cbars .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-cbars .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* glass card */
        .from("#t1-stat-cbars .glass-card",
          { autoAlpha: 0, y: 30, duration: 0.9, ease: "power4.out" }, 0.30)

        /* kicker */
        .from("#t1-stat-cbars .kicker",
          { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.50)

        /* Bar A label + number in */
        .from("#t1-stat-cbars .row-a .bar-meta",
          { autoAlpha: 0, x: -30, duration: 0.65, ease: "power3.out" }, 0.75)

        /* Bar A fills + counts up */
        .to({ val: 0 }, {
          val: valA, duration: 1.4, ease: "power2.out",
          onUpdate: function () {
            const v = Math.round(this.targets()[0].val);
            fillA.style.width = v + "%";
            numA.textContent  = v + "%";
          }
        }, 0.85)

        .from("#t1-stat-cbars-divider",
          { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power2.out" }, 1.35)

        /* Bar B label + number in */
        .from("#t1-stat-cbars .row-b .bar-meta",
          { autoAlpha: 0, x: -30, duration: 0.65, ease: "power3.out" }, 1.40)

        /* Bar B fills + counts up */
        .to({ val: 0 }, {
          val: valB, duration: 1.6, ease: "power2.out",
          onUpdate: function () {
            const v = Math.round(this.targets()[0].val);
            fillB.style.width = v + "%";
            numB.textContent  = v + "%";
          }
        }, 1.50)

        /* label */
        .from("#t1-stat-cbars .label",
          { autoAlpha: 0, y: 20, filter: "blur(6px)", duration: 0.8, ease: "power3.out" }, 2.50)

        /* source */
        .from("#t1-stat-cbars .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.80)

        /* breathing glow on bar B (the bigger result) */
        .to("#t1-stat-cbars-fillB",
          { boxShadow: "0 0 28px 6px rgba(245,216,42,0.65), 0 0 60px rgba(245,216,42,0.30)",
            duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.00)

        .set({}, {}, 7);

      window.__timelines["t1-stat-cbars"] = tl;
    </script>
  </body>
</html>
