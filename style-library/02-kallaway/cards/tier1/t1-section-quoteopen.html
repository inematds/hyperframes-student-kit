<!doctype html>
<!--
  KALLAWAY · tier1 · section · QUOTE OPEN
  Full-screen takeover. An opening statement framed by a GIANT glowing
  quotation mark that blooms in behind the headline — the "we are about to
  make a claim" beat. Kicker is a small attribution-style label below.
  Slots: kicker (~16 chars, acts as attribution/source), headline (~52 chars, <em> accent word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-qopen {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-qopen .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-qopen .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.38;
        -webkit-mask-image: radial-gradient(140% 120% at 50% 55%, #000 28%, transparent 74%);
                mask-image: radial-gradient(140% 120% at 50% 55%, #000 28%, transparent 74%);
      }

      /* ── Giant quotation mark ─────────────────────────────────────────── */
      /* Sits behind content (z:2); centred slightly above centre */
      #t1-sec-qopen .quote-mark {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-54%, -56%);  /* offset slightly up-left for visual balance */
        z-index: 2;
        /* The glyph itself */
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 780px; line-height: 1; letter-spacing: -0.05em;
        /* Gradient fill: accent blue at core, fades to near-transparent at edges */
        background: radial-gradient(circle at 40% 40%,
          rgba(var(--accent-rgb), 0.85) 0%,
          rgba(var(--accent-rgb), 0.35) 40%,
          rgba(var(--accent-rgb), 0.05) 70%,
          transparent 85%);
        -webkit-background-clip: text;
                background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        /* Soft glow around the character shape */
        filter: drop-shadow(0 0 60px rgba(var(--accent-rgb), 0.50))
                drop-shadow(0 0 160px rgba(var(--accent-rgb), 0.22));
        user-select: none; pointer-events: none;
      }

      /* ── Content ─────────────────────────────────────────────────────── */
      #t1-sec-qopen .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
        padding: 0 130px;
      }
      #t1-sec-qopen .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1400px;
      }
      #t1-sec-qopen .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }
      /* Attribution kicker — sits below the headline like a quote source */
      #t1-sec-qopen .kicker {
        margin-top: 40px;
        font-family: var(--font-body); font-weight: var(--wt-semi); font-style: italic;
        font-size: var(--size-label); letter-spacing: 0.10em;
        color: var(--text-dim);
        display: flex; align-items: center; gap: 16px;
      }
      /* Short rule before the attribution */
      #t1-sec-qopen .kicker::before {
        content: "";
        display: block; width: 48px; height: 1.5px;
        background: rgba(var(--accent-rgb), 0.60);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.35);
        flex-shrink: 0;
      }

      /* ── Global chrome ────────────────────────────────────────────────── */
      #t1-sec-qopen .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-qopen .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-qopen"
         data-composition-id="t1-sec-qopen"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Giant quotation mark backdrop -->
      <div class="quote-mark" aria-hidden="true">&ldquo;</div>

      <!-- Content -->
      <div class="content">
        <div class="headline" data-slot="headline">The Next Decade Belongs to <em>Builders</em></div>
        <div class="kicker" data-slot="kicker">Sam Altman, 2024</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-qopen .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom */
      tl.from("#t1-sec-qopen .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      tl.from("#t1-sec-qopen .grid",
        { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* giant quote mark blooms in — scale up from near-zero with blur */
      tl.from("#t1-sec-qopen .quote-mark",
        { autoAlpha: 0, scale: 0.55, filter: "blur(40px)",
          transformOrigin: "50% 50%", duration: 1.5, ease: "expo.out" }, 0.10);

      /* headline focus-pulls in */
      tl.from("#t1-sec-qopen .headline",
        { autoAlpha: 0, y: 32, filter: "blur(20px)", duration: 1.05, ease: "power4.out" }, 0.80);

      /* kicker attribution slides up gently */
      tl.from("#t1-sec-qopen .kicker",
        { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 1.30);

      /* quote mark breathes — finite pulse */
      tl.to("#t1-sec-qopen .quote-mark",
        { opacity: 0.60, scale: 1.04, duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      /* slow upward drift of content */
      tl.to("#t1-sec-qopen .content",
        { y: -12, duration: 4.5, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-qopen"] = tl;
    </script>
  </body>
</html>
