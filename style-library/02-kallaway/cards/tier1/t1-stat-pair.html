<!doctype html>
<!--
  KALLAWAY · tier1 · stat · PAIR
  Two metrics side-by-side — each a glowing mega-number with its own label.
  A glowing vertical divider separates them. Both numbers count up on entry.
  Slots: kicker (~28 chars uppercase), statA, labelA, statB, labelB, source (~40 chars uppercase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-pair {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-pair .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-pair .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Centered layout */
      #t1-stat-pair .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 52px;
      }

      #t1-stat-pair .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Two-up row */
      #t1-stat-pair .pair-row {
        display: flex; align-items: center; gap: 0;
      }

      /* Each metric block */
      #t1-stat-pair .metric {
        width: 700px;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
        padding: 0 60px;
      }

      #t1-stat-pair .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: var(--size-mega);
        line-height: 0.88;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.80) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.50));
      }

      /* Second stat uses yellow accent to distinguish the two metrics */
      #t1-stat-pair .metric.b .stat {
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent2-rgb), 0.85) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent2-rgb), 0.50));
      }

      #t1-stat-pair .metric-label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 500px;
        line-height: 1.4;
      }
      #t1-stat-pair .metric-label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* Glowing vertical divider */
      #t1-stat-pair .divider {
        width: 2px; height: 340px;
        background: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(var(--accent-rgb), 0.6) 20%,
          rgba(255,255,255,0.7) 50%,
          rgba(var(--accent-rgb), 0.6) 80%,
          transparent 100%
        );
        box-shadow: 0 0 22px 4px rgba(var(--accent-rgb), 0.35);
        flex-shrink: 0;
      }

      #t1-stat-pair .bottom-label {
        font-family: var(--font-body);
        font-size: 28px;
        font-weight: var(--wt-med);
        color: var(--text-faint);
        text-align: center;
        max-width: 1200px;
        line-height: 1.5;
      }
      #t1-stat-pair .bottom-label em {
        font-style: normal; color: var(--text-dim);
      }

      #t1-stat-pair .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-pair .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-pair .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-pair" data-composition-id="t1-stat-pair"
         data-start="0" data-width="1920" data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">OUTCOMES SNAPSHOT · Q2 2026</div>

        <div class="pair-row">
          <div class="metric a">
            <div class="stat" id="t1-stat-pair-numA" data-slot="statA">94%</div>
            <div class="metric-label" data-slot="labelA">learners who finish report being <em>more confident</em> in real-world AI tasks</div>
          </div>

          <div class="divider" id="t1-stat-pair-div"></div>

          <div class="metric b">
            <div class="stat" id="t1-stat-pair-numB" data-slot="statB">3.2×</div>
            <div class="metric-label" data-slot="labelB">average <em>salary-growth multiplier</em> within 12 months of certification</div>
          </div>
        </div>

        <div class="bottom-label" data-slot="label">Two numbers that define what <em>completing this course actually means.</em></div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS OUTCOMES STUDY 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numAEl = document.getElementById("t1-stat-pair-numA");
      const numBEl = document.getElementById("t1-stat-pair-numB");

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-pair .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-pair .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-pair .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-pair .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.5)

        /* left metric slides in */
        .from("#t1-stat-pair .metric.a",
          { autoAlpha: 0, x: -60, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.70)

        /* right metric slides in */
        .from("#t1-stat-pair .metric.b",
          { autoAlpha: 0, x: 60, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.70)

        /* divider draws in from center */
        .from("#t1-stat-pair .divider",
          { scaleY: 0, transformOrigin: "50% 50%", autoAlpha: 0,
            duration: 0.8, ease: "power3.out" }, 0.85)

        /* statA count-up: 0→94 */
        .to({ val: 0 }, {
          val: 94,
          duration: 1.6, ease: "power2.out",
          onUpdate: function() {
            numAEl.textContent = Math.round(this.targets()[0].val) + "%";
          }
        }, 0.95)

        /* statB count-up: 0→3.2 (multiplier, 1 decimal) */
        .to({ val: 1.0 }, {
          val: 3.2,
          duration: 1.6, ease: "power2.out",
          onUpdate: function() {
            numBEl.textContent = this.targets()[0].val.toFixed(1) + "×";
          }
        }, 0.95)

        /* bottom label */
        .from("#t1-stat-pair .bottom-label",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.2)

        /* source */
        .from("#t1-stat-pair .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.5)

        /* breathing glow on divider */
        .to("#t1-stat-pair .divider",
          { opacity: 0.45, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.1)

        .set({}, {}, 7);

      window.__timelines["t1-stat-pair"] = tl;
    </script>
  </body>
</html>
