<!doctype html>
<!--
  KALLAWAY · tier1 · stat · RANGE
  Min–max range track with a glowing marker that slides to the value position.
  Min/max labels sit at the ends; the value floats above the marker and counts up.
  Aurora bloom, glass, grain, vignette.
  Knob: data-pos on #t1-st-rng-track (0..1, default 0.68).
  Slots: kicker (~28 chars), stat (value label above marker), label (~70 chars,
         <em>), source (~40 chars). Min/max labels via data-min / data-max.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-st-rng {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-st-rng .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-st-rng .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-st-rng .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 56px; padding-bottom: 30px;
      }

      #t1-st-rng .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* The track assembly */
      #t1-st-rng .track-wrap {
        position: relative;
        width: 1200px;
      }

      /* Floating value label above the marker — positioned by JS */
      #t1-st-rng .marker-value {
        position: absolute;
        top: -88px;
        transform: translateX(-50%);
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 80px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.82) 78%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.55));
        white-space: nowrap;
      }

      /* Dashed connector from value label to marker */
      #t1-st-rng .marker-connector {
        position: absolute;
        top: -14px;
        transform: translateX(-50%);
        width: 2px;
        height: 24px;
        background: linear-gradient(to bottom, rgba(var(--accent-rgb), 0.8), rgba(var(--accent-rgb), 0.2));
        border-radius: 1px;
      }

      /* Glow halo behind the track */
      #t1-st-rng .track-glow {
        position: absolute; top: 50%; left: 0; right: 0;
        height: 120px; transform: translateY(-50%);
        background: radial-gradient(ellipse at 50% 50%, rgba(var(--accent-rgb), 0.10) 0%, transparent 65%);
        pointer-events: none;
      }

      /* Track bed: dim pill */
      #t1-st-rng .track-bed {
        width: 100%; height: 10px; border-radius: 5px;
        background: rgba(255,255,255,0.10);
        position: relative; z-index: 1;
      }

      /* Filled portion (left of marker) */
      #t1-st-rng .track-fill {
        position: absolute; left: 0; top: 0; bottom: 0;
        border-radius: 5px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.30) 0%, var(--accent) 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.50);
        transform-origin: left center;
        width: 0%; /* set by JS */
      }

      /* Glowing marker dot */
      #t1-st-rng .marker {
        position: absolute; top: 50%; transform: translate(-50%, -50%);
        width: 32px; height: 32px; border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 0 6px rgba(var(--accent-rgb), 0.35),
                    0 0 28px rgba(var(--accent-rgb), 0.80),
                    0 0 60px rgba(var(--accent-rgb), 0.40);
        z-index: 2;
      }

      /* Min / max end labels */
      #t1-st-rng .track-ends {
        display: flex; justify-content: space-between; align-items: flex-start;
        margin-top: 24px;
      }
      #t1-st-rng .end-label {
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      #t1-st-rng .end-label span {
        display: block;
        font-family: var(--font-display);
        font-weight: var(--wt-semi);
        font-size: 30px;
        letter-spacing: var(--track-snug);
        color: var(--text-dim);
        margin-top: 6px;
      }

      #t1-st-rng .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 880px;
        line-height: 1.45;
      }
      #t1-st-rng .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-st-rng .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-st-rng .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-st-rng .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-st-rng" data-composition-id="t1-st-rng" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">AVERAGE REVENUE · PER CREATOR</div>

        <div class="track-wrap">
          <div class="track-glow"></div>

          <!-- knob: data-pos (0..1), data-min, data-max, data-unit -->
          <div id="t1-st-rng-track" data-pos="0.68" data-min="$0" data-max="$250K" data-unit="$">
            <div class="marker-value" id="t1-st-rng-mval" data-slot="stat">$170K</div>
            <div class="marker-connector" id="t1-st-rng-conn"></div>
            <div class="track-bed">
              <div class="track-fill" id="t1-st-rng-fill"></div>
              <div class="marker" id="t1-st-rng-marker"></div>
            </div>
          </div>

          <div class="track-ends" id="t1-st-rng-ends">
            <div class="end-label">MIN<span id="t1-st-rng-min">$0</span></div>
            <div class="end-label" style="text-align:right;">MAX<span id="t1-st-rng-max">$250K</span></div>
          </div>
        </div>

        <div class="label" data-slot="label">top creators earn <em>6× more</em> than the platform average after completing the program</div>
      </div>

      <div class="source" data-slot="source">SOURCE · CREATOR EARNINGS REPORT 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* --- Read knobs ------------------------------------------------------- */
      const trackEl   = document.getElementById("t1-st-rng-track");
      const pos       = parseFloat(trackEl.getAttribute("data-pos")) || 0.68;
      const minLabel  = trackEl.getAttribute("data-min") || "$0";
      const maxLabel  = trackEl.getAttribute("data-max") || "$250K";

      /* Resolve display labels from min / max and current pos */
      document.getElementById("t1-st-rng-min").textContent = minLabel;
      document.getElementById("t1-st-rng-max").textContent = maxLabel;

      const TRACK_W   = 1200;   /* matches .track-wrap width in px */
      const markerEl  = document.getElementById("t1-st-rng-marker");
      const fillEl    = document.getElementById("t1-st-rng-fill");
      const mvalEl    = document.getElementById("t1-st-rng-mval");
      const connEl    = document.getElementById("t1-st-rng-conn");

      /* Initial positions — marker at left edge (pos=0) */
      gsap.set(markerEl, { left: "0%" });
      gsap.set(fillEl,   { width: "0%" });
      gsap.set(mvalEl,   { left: "0%" });
      gsap.set(connEl,   { left: "0%" });

      /* Derive a display value string from pos for the count-up */
      /* We interpolate between 0 and the numeric part of maxLabel */
      const maxNum = parseFloat(maxLabel.replace(/[^0-9.]/g, "")) || 250;
      const unit   = trackEl.getAttribute("data-unit") || "";
      /* strip digits AND the currency/unit prefix so it isn't doubled (e.g. "$250K" -> "K") */
      const suffix = maxLabel.replace(/[0-9.,]/g, "").replace(unit, "").trim();

      /* Grain flicker */
      tl.fromTo("#t1-st-rng .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Scene entrance */
      tl.from("#t1-st-rng .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-st-rng .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-st-rng .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)
        .from("#t1-st-rng .track-wrap",
          { autoAlpha: 0, y: 28, duration: 0.90, ease: "power3.out" }, 0.75)
        .from("#t1-st-rng .track-glow",
          { autoAlpha: 0, scale: 0.7, duration: 1.0, ease: "expo.out" }, 0.80)
        .from("#t1-st-rng .track-ends",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 0.95)
        .from("#t1-st-rng-mval",
          { autoAlpha: 0, filter: "blur(16px)", duration: 0.80, ease: "power3.out" }, 1.05)
        .from("#t1-st-rng-conn",
          { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 0%", duration: 0.40, ease: "power2.out" }, 1.35)

        /* Marker slides + fill grows + value counts up */
        .to({ val: 0 }, {
          val: pos,
          duration: 1.80, ease: "power2.out",
          onUpdate: function() {
            const v  = this.targets()[0].val;
            const pct = v * 100;
            markerEl.style.left = pct + "%";
            fillEl.style.width  = pct + "%";
            mvalEl.style.left   = pct + "%";
            connEl.style.left   = pct + "%";
            /* Count-up display */
            const displayNum = v * maxNum;
            const rounded = Math.round(displayNum * 10) / 10;
            mvalEl.textContent = unit + rounded + suffix;
          }
        }, 1.10)

        .from("#t1-st-rng .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.20)
        .from("#t1-st-rng .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.50)

        /* Breathing glow on marker */
        .to("#t1-st-rng-marker",
          { boxShadow: "0 0 0 10px rgba(55,189,248,0.22), 0 0 46px rgba(55,189,248,0.90), 0 0 90px rgba(55,189,248,0.45)",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.10)

        .set({}, {}, 7);

      window.__timelines["t1-st-rng"] = tl;
    </script>
  </body>
</html>
