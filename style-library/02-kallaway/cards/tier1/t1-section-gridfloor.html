<!doctype html>
<!--
  KALLAWAY · tier1 · section · GRIDFLOOR
  Full-screen chapter takeover. A perspective grid floor recedes to a glowing
  blue horizon line. The kicker and headline float above the horizon in open sky.
  Strong sci-fi / simulation aesthetic — depth pulls the eye inward.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-gfloor {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Sky bloom — blue atmospheric glow above the horizon */
      #t1-sec-gfloor .bloom-sky {
        position: absolute; left: 0; right: 0; top: 0; height: 620px;
        background: radial-gradient(90% 140% at 50% 100%,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.10) 40%,
          transparent 68%);
        z-index: 1;
      }
      /* Floor bloom — brighter glow at the horizon */
      #t1-sec-gfloor .bloom-floor {
        position: absolute; left: 0; right: 0; top: 360px; height: 200px;
        background: radial-gradient(100% 100% at 50% 50%,
          rgba(var(--accent-rgb), 0.50) 0%,
          rgba(var(--accent-rgb), 0.18) 45%,
          transparent 70%);
        filter: blur(12px);
        z-index: 2;
      }

      /* The perspective grid floor built with CSS transform */
      #t1-sec-gfloor .floor-scene {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 3;
        perspective: 480px; perspective-origin: 50% 52%;
      }
      #t1-sec-gfloor .floor-plane {
        position: absolute; left: -600px; right: -600px; bottom: -300px;
        height: 1600px;
        transform: rotateX(72deg);
        transform-origin: 50% 52%;
        overflow: hidden;
      }
      /* Grid lines via repeating-linear-gradient */
      #t1-sec-gfloor .floor-plane .grid-h {
        position: absolute; inset: 0;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(var(--accent-rgb), 0.22) 0px, rgba(var(--accent-rgb), 0.22) 1.5px,
          transparent 1.5px, transparent 72px
        );
      }
      #t1-sec-gfloor .floor-plane .grid-v {
        position: absolute; inset: 0;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(var(--accent-rgb), 0.22) 0px, rgba(var(--accent-rgb), 0.22) 1.5px,
          transparent 1.5px, transparent 96px
        );
      }
      /* Fade-to-dark at the far end of the floor */
      #t1-sec-gfloor .floor-plane .fade-far {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, var(--canvas) 0%, transparent 35%, transparent 70%, var(--canvas-deep) 100%);
      }

      /* Horizon glow line */
      #t1-sec-gfloor .horizon {
        position: absolute; left: 0; right: 0; top: 510px; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.70) 20%,
          var(--accent) 50%,
          rgba(var(--accent-rgb), 0.70) 80%,
          transparent 100%);
        box-shadow: 0 0 24px 4px rgba(var(--accent-rgb), 0.55),
                    0 0 80px 12px rgba(var(--accent-rgb), 0.22);
        z-index: 4;
      }

      /* Content — floats in the sky above the horizon */
      #t1-sec-gfloor .content {
        position: absolute; left: 0; right: 0; top: 160px;
        text-align: center; z-index: 5;
      }
      #t1-sec-gfloor .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 28px;
      }
      #t1-sec-gfloor .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.07; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1300px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-gfloor .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Vanishing-point dot on the horizon */
      #t1-sec-gfloor .vp-dot {
        position: absolute; left: 50%; top: 502px;
        transform: translateX(-50%);
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--white);
        box-shadow: var(--glow-white-lg);
        z-index: 5;
      }

      #t1-sec-gfloor .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-gfloor .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-gfloor" data-composition-id="t1-sec-gfloor" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom-sky"></div>
      <div class="bloom-floor"></div>

      <div class="floor-scene">
        <div class="floor-plane">
          <div class="grid-h"></div>
          <div class="grid-v"></div>
          <div class="fade-far"></div>
        </div>
      </div>

      <div class="horizon"></div>
      <div class="vp-dot"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Chapter 04 —</div>
        <div class="headline" data-slot="headline">Deep Learning:<br><em>The Architecture of Intelligence</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-gfloor .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Sky bloom rises */
      tl.from("#t1-sec-gfloor .bloom-sky", { autoAlpha: 0, y: 40, duration: 1.5, ease: "expo.out" }, 0);

      /* Floor materialises from below — grid plane slides up */
      tl.from("#t1-sec-gfloor .floor-scene", { autoAlpha: 0, y: 80, duration: 1.4, ease: "power4.out" }, 0.2);

      /* Horizon line draws in from center */
      tl.from("#t1-sec-gfloor .horizon", { scaleX: 0, transformOrigin: "50% 50%", duration: 1.0, ease: "power3.out" }, 0.6)
        .from("#t1-sec-gfloor .bloom-floor", { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.6);

      /* Vanishing-point dot pops */
      tl.from("#t1-sec-gfloor .vp-dot", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.4);

      /* Kicker + headline glide in from above */
      tl.from("#t1-sec-gfloor .kicker",   { autoAlpha: 0, y: -22, filter: "blur(8px)", duration: 0.8, ease: "power3.out" }, 1.1);
      tl.from("#t1-sec-gfloor .headline", { autoAlpha: 0, y: -36, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.4);

      /* Floor grid slow creep — gives sense of motion toward vanishing point */
      tl.to("#t1-sec-gfloor .floor-plane", { backgroundPositionY: "-72px", duration: 5.0, ease: "none" }, 1.2);

      /* Horizon pulse — finite */
      tl.to("#t1-sec-gfloor .horizon", {
        boxShadow: "0 0 40px 8px rgba(55,189,248,0.8), 0 0 120px 20px rgba(55,189,248,0.30)",
        duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true
      }, 2.4);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-gfloor"] = tl;
    </script>
  </body>
</html>
