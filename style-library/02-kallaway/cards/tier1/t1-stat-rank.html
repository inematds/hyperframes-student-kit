<!doctype html>
<!--
  KALLAWAY · tier1 · stat · RANK
  A glowing glass badge with the rank numeral ("#1") and a sub-label
  ("out of 4,200 channels"). Aurora bloom, grain, vignette, breathing glow.
  Knob: data-rank on #t1-st-rank-badge (default "1"), data-outof (default "4,200").
  Slots: kicker (~28 chars), stat (rank string e.g. "#1"),
         label (~70 chars, <em>), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-st-rank {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-st-rank .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-st-rank .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-st-rank .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 52px; padding-bottom: 30px;
      }

      #t1-st-rank .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Badge wrapper holds glow + glass surface */
      #t1-st-rank .badge-wrap {
        position: relative;
        display: flex; flex-direction: column; align-items: center;
      }

      /* Outer radial glow behind the badge */
      #t1-st-rank .badge-glow {
        position: absolute; inset: -70px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.28) 0%, transparent 60%);
        box-shadow: 0 0 140px 20px rgba(var(--accent-rgb), 0.22);
        pointer-events: none; z-index: 0;
      }

      /* Neon ring around the badge */
      #t1-st-rank .badge-ring {
        position: absolute; inset: -10px;
        border-radius: 50%;
        border: 2px solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.50),
                    inset 0 0 18px rgba(var(--accent-rgb), 0.14);
        pointer-events: none; z-index: 1;
      }

      /* Glass disc */
      #t1-st-rank .badge {
        position: relative; z-index: 2;
        width: 460px; height: 460px; border-radius: 50%;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        box-shadow: var(--glass-shadow),
                    inset 0 2px 0 var(--glass-hi);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 6px;
      }

      /* Hash symbol */
      #t1-st-rank .hash {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 100px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.40);
        margin-bottom: -16px;
        align-self: flex-start;
        margin-left: 106px;
      }

      /* Rank numeral */
      #t1-st-rank .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 220px;
        line-height: 0.88;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.85) 76%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 36px rgba(var(--accent-rgb), 0.60));
        position: relative; z-index: 1;
      }

      /* "out of N" sub-label inside the badge */
      #t1-st-rank .out-of {
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-top: 4px;
      }

      /* Supporting label below badge */
      #t1-st-rank .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 880px;
        line-height: 1.45;
      }
      #t1-st-rank .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-st-rank .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-st-rank .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-st-rank .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-st-rank" data-composition-id="t1-st-rank" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">PLATFORM RANKING · 2026</div>

        <div class="badge-wrap">
          <div class="badge-glow" id="t1-st-rank-glow"></div>
          <div class="badge-ring" id="t1-st-rank-ring"></div>

          <!-- Knobs: data-rank = rank numeral string, data-outof = "4,200" -->
          <div class="badge" id="t1-st-rank-badge" data-rank="1" data-outof="4,200">
            <div class="hash">#</div>
            <div class="stat" id="t1-st-rank-num" data-slot="stat">1</div>
            <div class="out-of" id="t1-st-rank-outof">out of 4,200</div>
          </div>
        </div>

        <div class="label" data-slot="label">ranked <em>#1 out of 4,200 channels</em> for course completion and learner satisfaction</div>
      </div>

      <div class="source" data-slot="source">SOURCE · CREATOR RANKINGS Q4 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* --- Read knobs ------------------------------------------------------- */
      const badgeEl = document.getElementById("t1-st-rank-badge");
      const rankStr = badgeEl.getAttribute("data-rank") || "1";
      const outofStr = badgeEl.getAttribute("data-outof") || "4,200";
      const rankNum = parseInt(rankStr, 10) || 1;

      const numEl   = document.getElementById("t1-st-rank-num");
      const outofEl = document.getElementById("t1-st-rank-outof");
      outofEl.textContent = "out of " + outofStr;

      /* Init num display */
      numEl.textContent = rankNum > 1 ? "1" : rankNum.toString();

      /* Grain flicker */
      tl.fromTo("#t1-st-rank .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Scene entrance */
      tl.from("#t1-st-rank .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-st-rank .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-st-rank .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* Badge glow blooms in first, then ring, then glass disc */
        .from("#t1-st-rank-glow",
          { autoAlpha: 0, scale: 0.4, duration: 1.3, ease: "expo.out" }, 0.65)
        .from("#t1-st-rank-ring",
          { autoAlpha: 0, scale: 0.5, duration: 0.90, ease: "expo.out" }, 0.80)
        .from("#t1-st-rank .badge",
          { autoAlpha: 0, scale: 0.70, transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.4)" }, 0.85)

        /* Hash and numeral blur in */
        .from("#t1-st-rank .hash",
          { autoAlpha: 0, filter: "blur(12px)", duration: 0.70, ease: "power3.out" }, 1.10)
        .from("#t1-st-rank .stat",
          { autoAlpha: 0, filter: "blur(22px)", duration: 0.85, ease: "power4.out" }, 1.15)
        .from("#t1-st-rank .out-of",
          { autoAlpha: 0, y: 10, duration: 0.60, ease: "power2.out" }, 1.45)

        /* Count-up: if rank > 1 count down FROM a high number to the target rank */
        .to({ val: rankNum > 1 ? Math.max(rankNum * 8, 50) : 1 }, {
          val: rankNum,
          duration: 1.60, ease: "power3.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            numEl.textContent = Math.round(v).toString();
          }
        }, 1.15)

        .from("#t1-st-rank .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.20)
        .from("#t1-st-rank .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.50)

        /* Breathing glow — badge ring pulse */
        .to("#t1-st-rank-glow",
          { opacity: 0.55, scale: 1.12, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.10)
        .to("#t1-st-rank-ring",
          { opacity: 0.65, scale: 1.05, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.10)

        .set({}, {}, 7);

      window.__timelines["t1-st-rank"] = tl;
    </script>
  </body>
</html>
