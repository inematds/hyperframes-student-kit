<!doctype html>
<!--
  KALLAWAY · tier1 · overview · LEVELS
  Full-screen takeover. Three stacked glowing blocks (LEVEL 1 bottom →
  LEVEL 3 top), like a pyramid/progression. A title label splits to the LEFT
  and RIGHT of the stack — one phrase on each side, flanking the blocks.
  Blocks build bottom-to-top; side titles glide in last.
  Slots: title_left, title_right, l1 (bottom), l2 (middle), l3 (top).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-levels {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-levels .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-levels .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(110% 100% at 50% 65%, #000 28%, transparent 78%);
                mask-image: radial-gradient(110% 100% at 50% 65%, #000 28%, transparent 78%);
      }

      /* Layout: three columns — left label | center stack | right label */
      #t1-ov-levels .layout {
        position: absolute; left: 80px; right: 80px;
        top: 120px; bottom: 80px;
        display: flex; align-items: center; gap: 56px; z-index: 4;
      }

      /* Side title panels */
      #t1-ov-levels .side-title {
        flex: 1; display: flex; align-items: center; justify-content: center;
        text-align: center;
      }
      #t1-ov-levels .side-title-text {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug); line-height: 1.18;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 360px;
      }
      #t1-ov-levels .side-title-text em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
        display: block;
      }

      /* Center stack — blocks narrow at top (pyramid feel) */
      #t1-ov-levels .stack {
        flex-shrink: 0; width: 820px;
        display: flex; flex-direction: column; align-items: center;
        gap: 16px;
      }

      /* Glass level block — widest at bottom, narrower at top */
      #t1-ov-levels .level {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; align-items: center;
        position: relative; overflow: hidden;
        padding: 0 44px;
      }
      /* Top hairline */
      #t1-ov-levels .level::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }

      /* Pyramid sizing — l3 top is narrowest / shortest, l1 bottom is widest / tallest */
      #t1-ov-levels #lv3 { width: 520px; height: 140px; border-color: rgba(var(--accent-rgb), 0.45);
        box-shadow: var(--glass-shadow), 0 0 50px rgba(var(--accent-rgb), 0.22); }
      #t1-ov-levels #lv2 { width: 670px; height: 160px; }
      #t1-ov-levels #lv1 { width: 820px; height: 180px; }

      /* Level number tag */
      #t1-ov-levels .level-tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        color: rgba(var(--accent-rgb), 0.75);
        text-transform: uppercase; margin-right: 28px; flex-shrink: 0;
        min-width: 90px;
      }
      #t1-ov-levels #lv3 .level-tag { color: var(--accent); text-shadow: var(--textglow-accent); }

      /* Level label */
      #t1-ov-levels .level-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 38px; letter-spacing: var(--track-snug); line-height: 1.2;
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-ov-levels #lv3 .level-label {
        font-weight: var(--wt-bold); font-size: 42px;
      }

      #t1-ov-levels .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-levels .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-levels" data-composition-id="t1-ov-levels" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <!-- Left title -->
        <div class="side-title" id="side-left">
          <div class="side-title-text" data-slot="title_left">From <em>Beginner</em></div>
        </div>

        <!-- Center stack — L3 (top) first in DOM so stagger goes top-down visually,
             but we animate in bottom-to-top order via stagger start times -->
        <div class="stack">
          <!-- Level 3 — top / apex -->
          <div class="level" id="lv3">
            <div class="level-tag">Level 3</div>
            <div class="level-label" data-slot="l3">Expert</div>
          </div>

          <!-- Level 2 — middle -->
          <div class="level" id="lv2">
            <div class="level-tag">Level 2</div>
            <div class="level-label" data-slot="l2">Practitioner</div>
          </div>

          <!-- Level 1 — bottom / base -->
          <div class="level" id="lv1">
            <div class="level-tag">Level 1</div>
            <div class="level-label" data-slot="l1">Newcomer</div>
          </div>
        </div>

        <!-- Right title -->
        <div class="side-title" id="side-right">
          <div class="side-title-text" data-slot="title_right">To <em>Advanced</em></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-levels .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "95px 75px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-levels .bloom", { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-levels .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* blocks spring in — bottom-to-top order */
        .from("#lv1", { autoAlpha: 0, y: 50, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 0.65)
        .from("#lv2", { autoAlpha: 0, y: 44, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 0.82)
        .from("#lv3", { autoAlpha: 0, y: 38, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.00)

        /* side titles glide in after stack is up */
        .from("#side-left .side-title-text", { autoAlpha: 0, x: -40, filter: "blur(12px)", duration: 0.9, ease: "power4.out" }, 1.40)
        .from("#side-right .side-title-text", { autoAlpha: 0, x:  40, filter: "blur(12px)", duration: 0.9, ease: "power4.out" }, 1.55)

        /* apex glow pulse */
        .to("#lv3", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 80px rgba(55,189,248,0.38)",
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        /* slow upward drift during hold */
        .to("#t1-ov-levels .stack", { y: -12, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-levels"] = tl;
    </script>
  </body>
</html>
