<!doctype html>
<!--
  KALLAWAY · tier1 · stat · HEATCELL
  A single large number sits inside a full-screen glowing "heat tile" — a glass
  card whose edge glow intensity implies the magnitude of the value. The canvas
  itself pulses with heat. Count-up. No rings or bars — pure ambient glow drama.
  Slots: kicker, stat (big number e.g. "94"), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-heat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* aurora bloom — bottom-centre, heavy */
      #t1-stat-heat .bloom {
        position: absolute; inset: 0;
        background: radial-gradient(130% 90% at 50% 115%,
          rgba(var(--accent-rgb), 0.55) 0%,
          rgba(var(--accent-rgb), 0.22) 36%,
          transparent 65%);
        z-index: 1;
      }
      /* secondary warm bloom from top-left */
      #t1-stat-heat .bloom-warm {
        position: absolute; inset: 0;
        background: radial-gradient(80% 80% at 8% 8%,
          rgba(var(--warm-rgb), 0.15) 0%,
          transparent 55%);
        z-index: 1;
      }
      #t1-stat-heat .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-stat-heat .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 40px;
      }

      #t1-stat-heat .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* the heat tile itself */
      #t1-stat-heat .tile {
        position: relative;
        width: 580px; height: 460px;
        border-radius: var(--radius-lg);
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        border-top: var(--stroke) solid var(--glass-hi);
        border-bottom: var(--stroke) solid rgba(255,255,255,0.04);
        box-shadow:
          var(--glass-shadow),
          0 0 60px 12px rgba(var(--accent-rgb), 0.22),
          0 0 160px 30px rgba(var(--accent-rgb), 0.14),
          inset 0 1px 0 var(--glass-hi);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0;
        overflow: hidden;
      }

      /* inner floor glow — the "heat" */
      #t1-stat-heat .tile-heat {
        position: absolute; inset: 0;
        background: radial-gradient(85% 85% at 50% 90%,
          rgba(var(--accent-rgb), 0.20) 0%,
          transparent 70%);
        border-radius: inherit;
      }

      /* neon rim — accent rim light on all 4 edges, corner glow */
      #t1-stat-heat .tile-rim {
        position: absolute; inset: 0;
        border-radius: inherit;
        border: 1.5px solid rgba(var(--accent-rgb), 0.28);
        box-shadow:
          inset 0 0 20px rgba(var(--accent-rgb), 0.12),
          0 0 20px rgba(var(--accent-rgb), 0.15);
        pointer-events: none;
      }

      #t1-stat-heat .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: var(--size-mega);
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 5%, rgba(var(--accent-rgb), 0.90) 88%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 40px rgba(var(--accent-rgb), 0.70));
        position: relative; z-index: 2;
      }

      #t1-stat-heat .stat-suffix {
        font-family: var(--font-display);
        font-weight: var(--wt-semi);
        font-size: 72px;
        color: var(--text-faint);
        position: relative; z-index: 2;
        letter-spacing: 0.04em;
        margin-top: 8px;
      }

      #t1-stat-heat .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-heat .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-heat .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-heat .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-heat .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-heat" data-composition-id="t1-stat-heat" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-warm"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">STUDENT SATISFACTION SCORE</div>

        <div class="tile">
          <div class="tile-heat"></div>
          <div class="tile-rim"></div>
          <div class="stat" id="t1-stat-heat-num" data-slot="stat">0</div>
          <div class="stat-suffix">/ 100</div>
        </div>

        <div class="label" data-slot="label">average Net Promoter Score from <em>verified graduate reviews</em> — top 1% of online courses</div>
      </div>

      <div class="source" data-slot="source">SOURCE · COURSEMARKS VERIFIED REVIEWS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl    = document.getElementById("t1-stat-heat-num");
      const target   = 94; /* matches placeholder */

      /* grain flicker */
      tl.fromTo("#t1-stat-heat .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-heat .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.5, ease: "expo.out" }, 0)
        .from("#t1-stat-heat .bloom-warm",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.1)
        .from("#t1-stat-heat .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-heat .kicker",
          { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.45)

        /* tile springs in */
        .from("#t1-stat-heat .tile",
          { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.4)" }, 0.65)

        /* count-up */
        .to({ val: 0 }, {
          val: target,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            numEl.textContent = Math.round(this.targets()[0].val);
          }
        }, 0.90)

        /* label */
        .from("#t1-stat-heat .label",
          { autoAlpha: 0, y: 22, duration: 0.85, ease: "power3.out" }, 2.20)

        /* source */
        .from("#t1-stat-heat .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.55)

        /* tile heat floor breathes */
        .to("#t1-stat-heat .tile-heat",
          { opacity: 0.45, duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.85)

        /* tile rim glow pulse */
        .to("#t1-stat-heat .tile-rim",
          { opacity: 0.50, duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.85)

        .set({}, {}, 7);

      window.__timelines["t1-stat-heat"] = tl;
    </script>
  </body>
</html>
