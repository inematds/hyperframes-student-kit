<!doctype html>
<!--
  KALLAWAY · tier1 · section · PORTAL
  Full-screen chapter takeover. A glowing oval portal opens at center — it starts
  as a pinpoint and scales up with a radiant bloom burst, its rim lit in neon
  blue-white. The title then "emerges" from within the portal, appearing from
  behind it and floating into focus. The portal interior shows a deep blue-void
  gradient suggesting infinite depth.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-portal {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-portal .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-portal .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 50%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 50%, #000 35%, transparent 80%);
      }

      /* ── PORTAL ──────────────────────────────────────────────────────── */
      #t1-sec-portal .portal-wrap {
        position: absolute;
        left: 50%; top: 50%;
        width: 760px; height: 440px;
        margin-left: -380px; margin-top: -220px;
        z-index: 3;
      }
      /* Wide soft halo around the portal */
      #t1-sec-portal .portal-halo {
        position: absolute;
        inset: -80px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.55) 0%,
          rgba(var(--accent-rgb), 0.22) 40%,
          transparent 68%);
        filter: blur(28px);
        z-index: -1;
      }
      /* Portal interior — deep blue void */
      #t1-sec-portal .portal-void {
        position: absolute; inset: 0;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 40%,
          rgba(10, 22, 44, 0.95) 0%,
          rgba(4, 8, 20, 1.0) 55%,
          rgba(var(--accent-rgb), 0.08) 80%,
          transparent 95%);
        overflow: hidden;
      }
      /* Inner shimmer lines inside the portal void */
      #t1-sec-portal .portal-shimmer {
        position: absolute; inset: 0;
        border-radius: 50%;
        background:
          radial-gradient(ellipse at 50% 30%,
            rgba(var(--accent-rgb), 0.18) 0%,
            transparent 40%),
          radial-gradient(ellipse at 50% 80%,
            rgba(var(--accent-rgb), 0.10) 0%,
            transparent 35%);
      }
      /* Glass rim of the portal */
      #t1-sec-portal .portal-rim {
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 2.5px solid transparent;
        background: transparent;
        /* Neon rim via box-shadow */
        box-shadow:
          0 0 0 2.5px rgba(255,255,255,0.65),
          0 0 0 4px rgba(var(--accent-rgb), 0.90),
          0 0 24px 6px rgba(var(--accent-rgb), 0.65),
          0 0 60px 16px rgba(var(--accent-rgb), 0.32),
          inset 0 0 20px 4px rgba(var(--accent-rgb), 0.22);
      }
      /* Bright highlight arc — top portion of the oval rim brighter */
      #t1-sec-portal .portal-arc {
        position: absolute; inset: 0;
        border-radius: 50%;
        box-shadow:
          inset 0 6px 20px rgba(255,255,255,0.55),
          inset 0 2px 6px rgba(255,255,255,0.80);
        -webkit-mask-image: radial-gradient(ellipse at 50% 28%, transparent 55%, #000 60%, transparent 76%);
                mask-image: radial-gradient(ellipse at 50% 28%, transparent 55%, #000 60%, transparent 76%);
      }

      /* ── CONTENT ─────────────────────────────────────────────────────── */
      /* Title emerges from the portal center — z-index above portal */
      #t1-sec-portal .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 5;
      }
      #t1-sec-portal .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 30px;
      }
      #t1-sec-portal .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1320px; padding: 0 80px;
      }
      #t1-sec-portal .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-portal .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-portal .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-portal" data-composition-id="t1-sec-portal" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="portal-wrap">
        <div class="portal-halo"></div>
        <div class="portal-void">
          <div class="portal-shimmer"></div>
        </div>
        <div class="portal-rim"></div>
        <div class="portal-arc"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Part Three —</div>
        <div class="headline" data-slot="headline">Step Through the Door:<br><em>Your AI-Powered Future</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-portal .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-portal .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.5, ease: "expo.out" }, 0)
        .from("#t1-sec-portal .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Portal opens from pinpoint — scale from 0 with bloom burst */
      tl.from("#t1-sec-portal .portal-wrap",
            { scale: 0.02, autoAlpha: 0, transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.7)" }, 0.35);

      /* Halo blooms outward after the rim arrives */
      tl.from("#t1-sec-portal .portal-halo",
            { scale: 0.1, autoAlpha: 0, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.50);

      /* Portal shimmer rotates slowly — infinite-feel but finite */
      tl.to("#t1-sec-portal .portal-shimmer",
            { rotation: 12, transformOrigin: "50% 50%", duration: 6.0, ease: "sine.inOut" }, 1.0);

      /* Kicker emerges from within the portal (small, scaled up) */
      tl.from("#t1-sec-portal .kicker",
            { autoAlpha: 0, scale: 0.70, transformOrigin: "50% 50%", duration: 0.65, ease: "back.out(1.4)" }, 1.05);

      /* Headline emerges — scale from slightly small + blur */
      tl.from("#t1-sec-portal .headline",
            { autoAlpha: 0, scale: 0.80, filter: "blur(18px)", transformOrigin: "50% 50%", duration: 0.95, ease: "power4.out" }, 1.30);

      /* Portal rim breathes — neon pulse */
      tl.to("#t1-sec-portal .portal-rim",
            { boxShadow: "0 0 0 2.5px rgba(255,255,255,0.85), 0 0 0 4px rgba(var(--accent-rgb),1.0), 0 0 36px 10px rgba(var(--accent-rgb),0.80), 0 0 90px 24px rgba(var(--accent-rgb),0.42), inset 0 0 28px 6px rgba(var(--accent-rgb),0.32)",
              duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.1);

      /* Slow portal drift during hold */
      tl.to("#t1-sec-portal .portal-wrap",
            { y: -16, duration: 4.0, ease: "sine.inOut" }, 2.0);

      /* Slow bloom drift */
      tl.to("#t1-sec-portal .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-portal"] = tl;
    </script>
  </body>
</html>
