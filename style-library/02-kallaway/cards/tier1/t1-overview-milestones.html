<!doctype html>
<!--
  KALLAWAY · tier1 · overview · MILESTONES
  Milestone markers along a horizontal track with date labels (Space Mono) above
  and headings below. Track draws left-to-right; markers pop/spring on staggered.
  Dates alternate above/below alternating nodes for visual rhythm.
  Slots: title, ms1_date, ms1_head, ms2_date, ms2_head, ms3_date, ms3_head,
         ms4_date, ms4_head, ms5_date, ms5_head.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-miles {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-miles .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-miles .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-miles .title-row {
        position: absolute; left: 0; right: 0; top: 72px; text-align: center; z-index: 4;
      }
      #t1-ov-miles .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1500px; margin: 0 auto;
      }
      #t1-ov-miles .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Track area — the full horizontal strip */
      #t1-ov-miles .track-area {
        position: absolute;
        left: 100px; right: 100px; top: 300px; height: 440px;
        z-index: 4;
      }

      /* Horizontal track centered at ~50% height of track-area */
      #t1-ov-miles .h-track {
        position: absolute; left: 0; right: 0; top: 50%; margin-top: -2px;
        height: 3px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.15) 0%,
          rgba(var(--accent-rgb), 0.70) 10%,
          rgba(var(--accent-rgb), 0.85) 50%,
          rgba(var(--accent-rgb), 0.70) 90%,
          rgba(var(--accent-rgb), 0.15) 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.45), 0 0 36px rgba(var(--accent-rgb), 0.20);
        transform-origin: left center;
        border-radius: 1.5px;
      }

      /* Milestone markers — positioned absolutely along the track */
      .mile-marker {
        position: absolute; top: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center;
        width: 200px;
      }

      /* Glowing diamond marker on the track */
      .mile-marker .m-diamond {
        width: 22px; height: 22px; flex-shrink: 0;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.90), 0 0 50px rgba(var(--accent-rgb), 0.45);
        transform: rotate(45deg);
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.40);
        position: relative; z-index: 2;
      }

      /* Vertical tick line above diamond */
      .mile-marker .m-tick-up {
        width: 1.5px; flex-shrink: 0;
        background: linear-gradient(to top, rgba(var(--accent-rgb), 0.70), rgba(var(--accent-rgb), 0.20));
        transform-origin: bottom center;
      }
      /* Vertical tick line below diamond */
      .mile-marker .m-tick-down {
        width: 1.5px; flex-shrink: 0;
        background: linear-gradient(to bottom, rgba(var(--accent-rgb), 0.70), rgba(var(--accent-rgb), 0.20));
        transform-origin: top center;
      }

      /* Date label — Space Mono, above or below based on class */
      .mile-marker .m-date {
        font-family: var(--font-mono); font-weight: 700;
        font-size: 20px; color: var(--accent);
        letter-spacing: 0.06em; text-shadow: var(--textglow-accent);
        white-space: nowrap; text-transform: uppercase;
      }

      /* Heading — glass chip below/above */
      .mile-marker .m-head {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 22px; color: var(--white); letter-spacing: var(--track-snug);
        line-height: 1.3; text-align: center;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        padding: 14px 18px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        white-space: nowrap;
        position: relative;
      }
      .mile-marker .m-head::before {
        content: ""; position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }

      /* Layout: odd markers — date above track, head below */
      /* even markers — date below track, head above (to avoid overlap) */
      /* Positions set in HTML via inline left% */

      /* Odd layout: date-tick-diamond-tick-head */
      .mile-marker.above .m-date    { order: 1; margin-bottom: 8px; }
      .mile-marker.above .m-tick-up { order: 2; height: 50px; }
      .mile-marker.above .m-diamond { order: 3; }
      .mile-marker.above .m-tick-down { order: 4; height: 50px; }
      .mile-marker.above .m-head    { order: 5; margin-top: 8px; }

      /* Even layout: head-tick-diamond-tick-date */
      .mile-marker.below .m-head     { order: 1; margin-bottom: 8px; }
      .mile-marker.below .m-tick-up  { order: 2; height: 50px; }
      .mile-marker.below .m-diamond  { order: 3; }
      .mile-marker.below .m-tick-down{ order: 4; height: 50px; }
      .mile-marker.below .m-date     { order: 5; margin-top: 8px; }

      #t1-ov-miles .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-miles .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-miles" data-composition-id="t1-ov-miles" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Key <em>Milestones</em> Along the Way</div>
      </div>

      <div class="track-area">
        <div class="h-track" id="miles-track"></div>

        <!-- Milestone 1 — above (date above, head below) — 10% -->
        <div class="mile-marker above" id="mm1" style="left:10%;">
          <div class="m-date" data-slot="ms1_date">WEEK 1</div>
          <div class="m-tick-up"></div>
          <div class="m-diamond" id="mdiam1"></div>
          <div class="m-tick-down"></div>
          <div class="m-head" data-slot="ms1_head">Kickoff</div>
        </div>

        <!-- Milestone 2 — below (head above, date below) — 30% -->
        <div class="mile-marker below" id="mm2" style="left:30%;">
          <div class="m-head" data-slot="ms2_head">First Draft</div>
          <div class="m-tick-up"></div>
          <div class="m-diamond" id="mdiam2"></div>
          <div class="m-tick-down"></div>
          <div class="m-date" data-slot="ms2_date">WEEK 4</div>
        </div>

        <!-- Milestone 3 — above — 50% -->
        <div class="mile-marker above" id="mm3" style="left:50%;">
          <div class="m-date" data-slot="ms3_date">WEEK 8</div>
          <div class="m-tick-up"></div>
          <div class="m-diamond" id="mdiam3"></div>
          <div class="m-tick-down"></div>
          <div class="m-head" data-slot="ms3_head">Beta Launch</div>
        </div>

        <!-- Milestone 4 — below — 70% -->
        <div class="mile-marker below" id="mm4" style="left:70%;">
          <div class="m-head" data-slot="ms4_head">Full Release</div>
          <div class="m-tick-up"></div>
          <div class="m-diamond" id="mdiam4"></div>
          <div class="m-tick-down"></div>
          <div class="m-date" data-slot="ms4_date">WEEK 12</div>
        </div>

        <!-- Milestone 5 — above — 90% -->
        <div class="mile-marker above" id="mm5" style="left:90%;">
          <div class="m-date" data-slot="ms5_date">WEEK 16</div>
          <div class="m-tick-up"></div>
          <div class="m-diamond" id="mdiam5"></div>
          <div class="m-tick-down"></div>
          <div class="m-head" data-slot="ms5_head">Scale-up</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-miles .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "115px 85px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-miles .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-miles .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-miles .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 0.5)

        /* track draws left-to-right */
        .from("#miles-track", { scaleX: 0, transformOrigin: "left center", duration: 1.10, ease: "power3.inOut" }, 1.0)

        /* milestones pop on staggered — diamond first, then labels fade up/down */
        .from("#mdiam1", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.40, ease: "back.out(2.5)" }, 1.55)
        .from("#mm1 .m-date, #mm1 .m-head, #mm1 .m-tick-up, #mm1 .m-tick-down",
          { autoAlpha: 0, y: 10, filter: "blur(6px)", duration: 0.50, ease: "power3.out", stagger: 0.06 }, 1.75)

        .from("#mdiam2", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.40, ease: "back.out(2.5)" }, 2.00)
        .from("#mm2 .m-date, #mm2 .m-head, #mm2 .m-tick-up, #mm2 .m-tick-down",
          { autoAlpha: 0, y: 10, filter: "blur(6px)", duration: 0.50, ease: "power3.out", stagger: 0.06 }, 2.20)

        .from("#mdiam3", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.40, ease: "back.out(2.5)" }, 2.45)
        .from("#mm3 .m-date, #mm3 .m-head, #mm3 .m-tick-up, #mm3 .m-tick-down",
          { autoAlpha: 0, y: 10, filter: "blur(6px)", duration: 0.50, ease: "power3.out", stagger: 0.06 }, 2.65)

        .from("#mdiam4", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.40, ease: "back.out(2.5)" }, 2.90)
        .from("#mm4 .m-date, #mm4 .m-head, #mm4 .m-tick-up, #mm4 .m-tick-down",
          { autoAlpha: 0, y: 10, filter: "blur(6px)", duration: 0.50, ease: "power3.out", stagger: 0.06 }, 3.10)

        .from("#mdiam5", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.40, ease: "back.out(2.5)" }, 3.35)
        .from("#mm5 .m-date, #mm5 .m-head, #mm5 .m-tick-up, #mm5 .m-tick-down",
          { autoAlpha: 0, y: 10, filter: "blur(6px)", duration: 0.50, ease: "power3.out", stagger: 0.06 }, 3.55)

        /* diamond glow pulse — finite, wave left-to-right */
        .to("#mdiam1, #mdiam2, #mdiam3, #mdiam4, #mdiam5", {
          boxShadow: "0 0 28px rgba(55,189,248,0.98), 0 0 72px rgba(55,189,248,0.55)",
          duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.18
        }, 4.2)

        /* hold drift */
        .to("#t1-ov-miles .track-area", { y: -10, duration: 4.5, ease: "sine.inOut" }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-miles"] = tl;
    </script>
  </body>
</html>
