<!doctype html>
<!--
  KALLAWAY · tier1 · overview · NESTED CONCENTRIC CONTAINERS
  Full-screen takeover. Three glowing rounded rectangles nested inside each
  other (outermost is faintest/largest, innermost is brightest/smallest with
  full accent glow). Each ring has a label at its top-left corner. Rings fade
  in from outside-in with glow; labels glide in staggered.
  Slots: title, ring1 (outermost), ring2 (middle), ring3 (innermost/accent).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-nested {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-nested .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-nested .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 108% at 50% 55%, #000 28%, transparent 76%);
                mask-image: radial-gradient(120% 108% at 50% 55%, #000 28%, transparent 76%);
      }

      /* Title */
      #t1-ov-nested .card-title {
        position: absolute; left: 0; right: 0; top: 60px; z-index: 5;
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow); line-height: 1.1;
      }
      #t1-ov-nested .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /*
        Three nested glass rings, centered on canvas (960, 540).
        Ring1 (outer): 1520 x 800
        Ring2 (mid):   1080 x 580
        Ring3 (inner):  640 x 360
        All centered at 960, 540.
      */
      #t1-ov-nested .ring {
        position: absolute; z-index: 3;
        border-radius: 48px;
        background: rgba(255, 255, 255, 0.028);
        border: var(--stroke) solid var(--glass-border);
        backdrop-filter: blur(6px) saturate(120%);
        -webkit-backdrop-filter: blur(6px) saturate(120%);
        box-shadow: var(--glass-shadow);
        /* label badge position relative to ring */
      }

      #t1-ov-nested #ring1 {
        width: 1520px; height: 800px;
        left: 200px; top: 140px;
        border-radius: 52px;
        border-color: rgba(var(--accent-rgb), 0.18);
      }
      #t1-ov-nested #ring2 {
        width: 1080px; height: 580px;
        left: 420px; top: 250px;
        border-radius: 44px;
        border-color: rgba(var(--accent-rgb), 0.35);
        box-shadow: var(--glass-shadow), 0 0 40px rgba(var(--accent-rgb), 0.12);
      }
      #t1-ov-nested #ring3 {
        width: 640px; height: 360px;
        left: 640px; top: 360px;
        border-radius: 36px;
        border-color: rgba(var(--accent-rgb), 0.65);
        background: rgba(var(--accent-rgb), 0.06);
        box-shadow: var(--glass-shadow), 0 0 70px rgba(var(--accent-rgb), 0.28),
                    inset 0 1px 0 var(--glass-hi);
      }

      /* Label badge — top-left inside each ring */
      #t1-ov-nested .ring-label {
        position: absolute; top: 22px; left: 36px;
        display: flex; align-items: center; gap: 14px;
      }
      #t1-ov-nested .ring-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent); flex-shrink: 0;
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.80);
      }
      #t1-ov-nested .ring-text {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 28px; color: var(--text-dim);
        letter-spacing: var(--track-snug);
      }
      /* Innermost ring label is brighter */
      #t1-ov-nested #ring3 .ring-text {
        color: var(--white); text-shadow: var(--textglow); font-weight: var(--wt-bold);
        font-size: 30px;
      }
      #t1-ov-nested #ring3 .ring-dot {
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.95), 0 0 36px rgba(var(--accent-rgb), 0.50);
      }

      /* Center accent — innermost ring center label */
      #t1-ov-nested .ring-center {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #t1-ov-nested .ring-center-text {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 42px; color: var(--accent);
        text-shadow: var(--textglow-accent); letter-spacing: var(--track-snug);
        text-align: center; line-height: 1.2;
      }

      #t1-ov-nested .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-nested .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-nested" data-composition-id="t1-ov-nested" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="card-title" data-slot="title">Every Layer <em>Depends</em> on the One Inside</div>

      <!-- Ring 1 — outermost -->
      <div class="ring" id="ring1">
        <div class="ring-label">
          <div class="ring-dot"></div>
          <div class="ring-text" data-slot="ring1">Market Context</div>
        </div>
      </div>

      <!-- Ring 2 — middle -->
      <div class="ring" id="ring2">
        <div class="ring-label">
          <div class="ring-dot"></div>
          <div class="ring-text" data-slot="ring2">Business Model</div>
        </div>
      </div>

      <!-- Ring 3 — innermost, accent glow -->
      <div class="ring" id="ring3">
        <div class="ring-label">
          <div class="ring-dot"></div>
          <div class="ring-text" data-slot="ring3">Core Product</div>
        </div>
        <div class="ring-center">
          <div class="ring-center-text">Value</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-nested .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "102px 79px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-nested .bloom", { autoAlpha: 0, scale: 0.89, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-nested .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-nested .card-title", { autoAlpha: 0, y: 26, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.46)

        /* rings expand in from outside-in */
        .from("#ring1", { autoAlpha: 0, scale: 1.08, transformOrigin: "50% 50%",
          filter: "blur(14px)", duration: 0.88, ease: "power4.out" }, 0.88)
        .from("#ring2", { autoAlpha: 0, scale: 1.10, transformOrigin: "50% 50%",
          filter: "blur(14px)", duration: 0.88, ease: "power4.out" }, 1.10)
        .from("#ring3", { autoAlpha: 0, scale: 1.12, transformOrigin: "50% 50%",
          filter: "blur(14px)", duration: 0.88, ease: "back.out(1.4)" }, 1.32)

        /* ring labels glide in with slight delay after each ring */
        .from("#ring1 .ring-label", { autoAlpha: 0, x: -20, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 1.30)
        .from("#ring2 .ring-label", { autoAlpha: 0, x: -20, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 1.50)
        .from("#ring3 .ring-label", { autoAlpha: 0, x: -20, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 1.70)
        .from("#ring3 .ring-center", { autoAlpha: 0, scale: 0.75, filter: "blur(12px)", transformOrigin: "50% 50%", duration: 0.70, ease: "back.out(1.5)" }, 1.90)

        /* innermost ring glow pulse */
        .to("#ring3",
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 100px rgba(55,189,248,0.48), inset 0 1px 0 rgba(255,255,255,0.22)",
            duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        /* center value text pulse */
        .to("#ring3 .ring-center-text",
          { textShadow: "0 0 30px rgba(55,189,248,0.90), 0 0 70px rgba(55,189,248,0.50)",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        /* slow scale breathe on rings — very subtle */
        .to("#ring1", { scale: 1.006, transformOrigin: "50% 50%", duration: 4.5, ease: "sine.inOut" }, 2.0)
        .to("#ring2", { scale: 1.008, transformOrigin: "50% 50%", duration: 4.2, ease: "sine.inOut" }, 2.2)
        .to("#ring3", { scale: 1.012, transformOrigin: "50% 50%", duration: 4.0, ease: "sine.inOut" }, 2.4)

        .set({}, {}, 7);

      window.__timelines["t1-ov-nested"] = tl;
    </script>
  </body>
</html>
