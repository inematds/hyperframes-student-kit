<!doctype html>
<!--
  KALLAWAY · tier1 · stat · MULTIRING
  Three concentric glowing SVG progress rings of different radii, fills, and
  accent colours (blue / yellow / warm). Each fills independently to its pct
  value. Headline stat in the center. Aurora bloom, deep vignette, glass surface.
  Knobs: data-pct1 (default 80), data-pct2 (default 55), data-pct3 (default 35)
         on #t1-stat-mring.
  Slots: kicker (~28 chars uppercase), stat (center number e.g. "80%"),
         label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-mring {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-mring .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-mring .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Layout: kicker top / rings+labels left / copy right */
      #t1-stat-mring .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4; gap: 44px; padding-bottom: 20px;
      }

      #t1-stat-mring .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Ring composite container */
      #t1-stat-mring .rings-container {
        position: relative;
        width: 560px; height: 560px;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }

      /* Multi-layer glow behind all rings */
      #t1-stat-mring .rings-glow {
        position: absolute; inset: -60px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 60%);
        pointer-events: none;
      }

      #t1-stat-mring .rings-svg {
        position: absolute; inset: 0;
        width: 560px; height: 560px;
        overflow: visible;
      }

      /* Center number */
      #t1-stat-mring .ring-center {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 6px;
      }
      #t1-stat-mring .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 100px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 15%, rgba(var(--accent-rgb), 0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(var(--accent-rgb), 0.55));
      }

      /* Ring legend row */
      #t1-stat-mring .legend {
        display: flex; gap: 40px; align-items: center;
      }
      #t1-stat-mring .legend-item {
        display: flex; align-items: center; gap: 12px;
      }
      #t1-stat-mring .legend-dot {
        width: 16px; height: 16px; border-radius: 50%;
        flex-shrink: 0;
      }
      #t1-stat-mring .legend-dot.r1 {
        background: var(--accent);
        box-shadow: 0 0 8px 2px rgba(var(--accent-rgb), 0.70);
      }
      #t1-stat-mring .legend-dot.r2 {
        background: var(--accent-2);
        box-shadow: 0 0 8px 2px rgba(var(--accent2-rgb), 0.70);
      }
      #t1-stat-mring .legend-dot.r3 {
        background: var(--warm);
        box-shadow: 0 0 8px 2px rgba(var(--warm-rgb), 0.70);
      }
      #t1-stat-mring .legend-text {
        font-family: var(--font-mono);
        font-size: var(--size-tiny);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      #t1-stat-mring .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-mring .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-mring .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-mring .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-mring .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-mring" data-composition-id="t1-stat-mring"
         data-pct1="80" data-pct2="55" data-pct3="35"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="stage">
        <div class="kicker" data-slot="kicker">AI SKILLS BENCHMARK · 2026</div>

        <div class="rings-container">
          <div class="rings-glow" id="t1-stat-mring-glow"></div>

          <svg class="rings-svg" id="t1-stat-mring-svg"
               viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Ring 1 gradient — accent blue -->
              <linearGradient id="mringGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
              </linearGradient>
              <!-- Ring 2 gradient — yellow -->
              <linearGradient id="mringGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#F5D82A" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.90"/>
              </linearGradient>
              <!-- Ring 3 gradient — warm orange -->
              <linearGradient id="mringGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF8A5C" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
              </linearGradient>
            </defs>

            <!-- Outer track (r=250) -->
            <circle cx="280" cy="280" r="250"
              stroke="rgba(255,255,255,0.06)" stroke-width="18" stroke-linecap="round"/>
            <!-- Outer arc — ring 1 (blue) -->
            <circle id="mring-arc1" cx="280" cy="280" r="250"
              stroke="url(#mringGrad1)" stroke-width="18" stroke-linecap="round"
              fill="none" transform="rotate(-90 280 280)"
              style="filter: drop-shadow(0 0 8px rgba(55,189,248,0.70)) drop-shadow(0 0 22px rgba(55,189,248,0.35));"/>

            <!-- Middle track (r=200) -->
            <circle cx="280" cy="280" r="200"
              stroke="rgba(255,255,255,0.06)" stroke-width="18" stroke-linecap="round"/>
            <!-- Middle arc — ring 2 (yellow) -->
            <circle id="mring-arc2" cx="280" cy="280" r="200"
              stroke="url(#mringGrad2)" stroke-width="18" stroke-linecap="round"
              fill="none" transform="rotate(-90 280 280)"
              style="filter: drop-shadow(0 0 8px rgba(245,216,42,0.70)) drop-shadow(0 0 22px rgba(245,216,42,0.35));"/>

            <!-- Inner track (r=150) -->
            <circle cx="280" cy="280" r="150"
              stroke="rgba(255,255,255,0.06)" stroke-width="18" stroke-linecap="round"/>
            <!-- Inner arc — ring 3 (warm) -->
            <circle id="mring-arc3" cx="280" cy="280" r="150"
              stroke="url(#mringGrad3)" stroke-width="18" stroke-linecap="round"
              fill="none" transform="rotate(-90 280 280)"
              style="filter: drop-shadow(0 0 8px rgba(255,138,92,0.70)) drop-shadow(0 0 22px rgba(255,138,92,0.35));"/>
          </svg>

          <!-- Center value -->
          <div class="ring-center">
            <div class="stat" id="t1-stat-mring-num" data-slot="stat">80%</div>
          </div>
        </div>

        <!-- Legend -->
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot r1"></div>
            <div class="legend-text">ADVANCED · 80%</div>
          </div>
          <div class="legend-item">
            <div class="legend-dot r2"></div>
            <div class="legend-text">INTERMEDIATE · 55%</div>
          </div>
          <div class="legend-item">
            <div class="legend-dot r3"></div>
            <div class="legend-text">BEGINNER · 35%</div>
          </div>
        </div>

        <div class="label" data-slot="label">learners who pass the advanced tier <em>earn 40% higher salaries</em> within 6 months of certification</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS BENCHMARK REPORT 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const root  = document.getElementById("t1-stat-mring");
      const pct1  = parseFloat(root.getAttribute("data-pct1")) || 80;
      const pct2  = parseFloat(root.getAttribute("data-pct2")) || 55;
      const pct3  = parseFloat(root.getAttribute("data-pct3")) || 35;

      const arc1  = document.getElementById("mring-arc1");
      const arc2  = document.getElementById("mring-arc2");
      const arc3  = document.getElementById("mring-arc3");
      const numEl = document.getElementById("t1-stat-mring-num");

      /* circumferences for each radius */
      const c1 = 2 * Math.PI * 250;
      const c2 = 2 * Math.PI * 200;
      const c3 = 2 * Math.PI * 150;

      /* Init all arcs fully hidden */
      arc1.style.strokeDasharray  = c1; arc1.style.strokeDashoffset = c1;
      arc2.style.strokeDasharray  = c2; arc2.style.strokeDashoffset = c2;
      arc3.style.strokeDasharray  = c3; arc3.style.strokeDashoffset = c3;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-mring .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "106px 84px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-mring .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-mring .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-mring .kicker",
          { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.45)

        /* rings glow blooms */
        .from("#t1-stat-mring-glow",
          { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.60)

        /* rings SVG scale in */
        .from("#t1-stat-mring-svg",
          { autoAlpha: 0, scale: 0.65, transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.3)" }, 0.65)

        /* center number reveal */
        .from("#t1-stat-mring .stat",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0.80)

        /* ALL THREE rings fill + center counts up simultaneously */
        .to({ val: 0 }, {
          val: 100, duration: 2.0, ease: "power2.out",
          onUpdate: function () {
            const p = this.targets()[0].val / 100;
            arc1.style.strokeDashoffset = c1 - Math.min(p, pct1 / 100) * c1;
            arc2.style.strokeDashoffset = c2 - Math.min(p, pct2 / 100) * c2;
            arc3.style.strokeDashoffset = c3 - Math.min(p, pct3 / 100) * c3;
            /* center counts up with ring 1 */
            numEl.textContent = Math.min(Math.round(p * 100), pct1) + "%";
          }
        }, 0.85)

        /* legend */
        .from("#t1-stat-mring .legend-item",
          { autoAlpha: 0, y: 14, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 2.20)

        /* label */
        .from("#t1-stat-mring .label",
          { autoAlpha: 0, y: 20, filter: "blur(6px)", duration: 0.85, ease: "power3.out" }, 2.50)

        /* source */
        .from("#t1-stat-mring .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.80)

        /* breathing glow on ring cluster */
        .to("#t1-stat-mring-glow",
          { opacity: 0.45, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.00)

        .set({}, {}, 7);

      window.__timelines["t1-stat-mring"] = tl;
    </script>
  </body>
</html>
