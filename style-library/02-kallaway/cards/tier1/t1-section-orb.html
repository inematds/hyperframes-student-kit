<!doctype html>
<!--
  KALLAWAY · tier1 · section · ORB   (GOLD REFERENCE)
  Full-screen chapter takeover. A glowing blue orb rises from the bottom of a
  dark canvas; a numbered kicker and a glowing headline float above it. The
  signature "we are inside the idea" beat. Smooth glide + bloom, breathing glow.
  Slots: kicker (~16 chars, e.g. a chapter number or label), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-orb {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom rising from the bottom — the hero ambience */
      #t1-sec-orb .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Faint dot grid */
      #t1-sec-orb .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* The rising orb */
      #t1-sec-orb .orb-wrap {
        position: absolute; left: 50%; top: 760px; transform: translateX(-50%);
        width: 1180px; height: 1180px; z-index: 2;
      }
      #t1-sec-orb .orb {
        position: absolute; inset: 0; border-radius: 50%;
        background:
          radial-gradient(circle at 50% 32%,
            rgba(255,255,255,0.92) 0%,
            rgba(var(--accent-rgb), 0.85) 9%,
            rgba(var(--accent-rgb), 0.34) 38%,
            rgba(var(--accent-rgb), 0.06) 62%,
            transparent 72%);
        box-shadow: 0 0 160px 20px rgba(var(--accent-rgb), 0.40);
      }
      /* bright horizon rim across the top of the orb */
      #t1-sec-orb .rim {
        position: absolute; inset: 0; border-radius: 50%;
        box-shadow: inset 0 6px 22px rgba(255,255,255,0.65),
                    inset 0 2px 6px rgba(255,255,255,0.9);
        -webkit-mask-image: radial-gradient(circle at 50% 32%, transparent 60%, #000 64%, transparent 78%);
                mask-image: radial-gradient(circle at 50% 32%, transparent 60%, #000 64%, transparent 78%);
      }
      /* Content */
      #t1-sec-orb .content {
        position: absolute; left: 0; right: 0; top: 300px; text-align: center; z-index: 4;
      }
      #t1-sec-orb .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 26px;
      }
      /* soft glow plate behind the headline (blurred bright bar, not a hard box) */
      #t1-sec-orb .plate {
        position: absolute; left: 50%; top: 86px; transform: translateX(-50%);
        width: 1180px; height: 150px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(255,255,255,0.16), transparent 70%);
        filter: blur(14px); z-index: -1;
      }
      #t1-sec-orb .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1320px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-orb .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-orb .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-orb .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-orb" data-composition-id="t1-sec-orb" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="orb-wrap">
        <div class="orb"></div>
        <div class="rim"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 1 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">How Do Algorithms <em>Actually</em> Work?</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker — finite, deterministic */
      tl.fromTo("#t1-sec-orb .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom blooms up */
      tl.from("#t1-sec-orb .bloom", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-orb .grid", { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)
        /* orb rises */
        .from("#t1-sec-orb .orb-wrap", { autoAlpha: 0, y: 130, scale: 0.94, transformOrigin: "50% 50%", duration: 1.5, ease: "power4.out" }, 0.15)
        /* kicker + headline glide + blur-in */
        .from("#t1-sec-orb .kicker", { autoAlpha: 0, y: 24, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 0.7)
        .from("#t1-sec-orb .plate", { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.9)
        .from("#t1-sec-orb .headline", { autoAlpha: 0, y: 34, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 0.95)
        /* breathing glow on the headline plate — finite pulse */
        .to("#t1-sec-orb .plate", { opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0)
        /* slow continued drift of the orb during the hold */
        .to("#t1-sec-orb .orb-wrap", { y: -26, duration: 4.5, ease: "sine.inOut" }, 1.8)
        .set({}, {}, 7);

      window.__timelines["t1-sec-orb"] = tl;
    </script>
  </body>
</html>
