<!doctype html>
<!--
  KALLAWAY · tier1 · section · ECLIPSE
  Full-screen chapter takeover. A dark disc sits center-frame with a bright
  glowing corona rim — the eclipse. The corona blooms outward as the kicker
  and headline appear across the disc face.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-eclipse {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Subtle ambient bloom from bottom */
      #t1-sec-eclipse .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      /* Dot grid */
      #t1-sec-eclipse .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.40;
        -webkit-mask-image: radial-gradient(80% 80% at 50% 50%, #000 30%, transparent 72%);
                mask-image: radial-gradient(80% 80% at 50% 50%, #000 30%, transparent 72%);
      }

      /* Eclipse wrapper — centered */
      #t1-sec-eclipse .eclipse-wrap {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 820px; height: 820px;
        z-index: 2;
      }

      /* Dark disc — the moon face */
      #t1-sec-eclipse .disc {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #0E1620 0%, #07121C 60%, #050C14 100%);
      }

      /* Corona outer glow rings — achieved with box-shadow layers */
      #t1-sec-eclipse .corona {
        position: absolute; inset: -32px; border-radius: 50%;
        box-shadow:
          0 0 0 4px  rgba(var(--accent-rgb), 0.90),
          0 0 0 10px rgba(var(--accent-rgb), 0.45),
          0 0 0 24px rgba(var(--accent-rgb), 0.22),
          0 0 0 60px rgba(var(--accent-rgb), 0.10),
          0 0 120px 40px rgba(var(--accent-rgb), 0.18),
          0 0 260px 80px rgba(var(--accent-rgb), 0.10);
      }

      /* Bright arc highlight — the "totality" bright rim at the top edge */
      #t1-sec-eclipse .rim-arc {
        position: absolute; inset: 0; border-radius: 50%;
        box-shadow:
          inset 0 -4px 0 rgba(255,255,255,0.0),
          0 0 0 3px rgba(255,255,255,0.70),
          0 0 0 7px rgba(255,255,255,0.20);
        -webkit-mask-image: conic-gradient(
          from 300deg at 50% 50%,
          transparent 0deg, #000 40deg, #000 130deg, transparent 170deg,
          transparent 360deg
        );
                mask-image: conic-gradient(
          from 300deg at 50% 50%,
          transparent 0deg, #000 40deg, #000 130deg, transparent 170deg,
          transparent 360deg
        );
      }

      /* Subtle solar flare spikes — 4 thin radial lines */
      #t1-sec-eclipse .spikes {
        position: absolute; inset: -80px; z-index: -1;
        background:
          repeating-conic-gradient(
            from 0deg,
            rgba(var(--accent-rgb), 0.12) 0deg 2deg,
            transparent 2deg 90deg
          );
        border-radius: 50%;
        filter: blur(2px);
      }

      /* Content centered over disc */
      #t1-sec-eclipse .content {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      #t1-sec-eclipse .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 36px; letter-spacing: 0.14em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 22px;
      }
      #t1-sec-eclipse .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 72px; line-height: 1.08; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 660px; margin: 0 auto;
      }
      #t1-sec-eclipse .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-eclipse .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-eclipse .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-eclipse" data-composition-id="t1-sec-eclipse" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="eclipse-wrap">
        <div class="spikes"></div>
        <div class="disc"></div>
        <div class="corona"></div>
        <div class="rim-arc"></div>

        <div class="content">
          <div class="kicker" data-slot="kicker">&mdash; 3 &mdash;</div>
          <div class="headline" data-slot="headline">The <em>Moment</em> Everything Changes</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite, deterministic */
      tl.fromTo("#t1-sec-eclipse .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom and grid fade in */
      tl.from("#t1-sec-eclipse .bloom", { autoAlpha: 0, scale: 0.92, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-eclipse .grid",  { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* eclipse disc scales in from nothing — like totality beginning */
      tl.from("#t1-sec-eclipse .eclipse-wrap", {
        scale: 0.30, autoAlpha: 0, transformOrigin: "50% 50%",
        duration: 1.2, ease: "expo.out"
      }, 0.1);

      /* corona blooms out after disc appears */
      tl.from("#t1-sec-eclipse .corona", {
        scale: 0.60, autoAlpha: 0, transformOrigin: "50% 50%",
        duration: 1.6, ease: "power4.out"
      }, 0.6);

      /* rim-arc sweeps in */
      tl.from("#t1-sec-eclipse .rim-arc", {
        autoAlpha: 0, scale: 0.85, transformOrigin: "50% 50%",
        duration: 1.0, ease: "power3.out"
      }, 0.85);

      /* spikes radiate out */
      tl.from("#t1-sec-eclipse .spikes", {
        scale: 0.50, autoAlpha: 0, transformOrigin: "50% 50%",
        duration: 1.8, ease: "expo.out"
      }, 0.5);

      /* text slides in */
      tl.from("#t1-sec-eclipse .kicker",   { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 1.1)
        .from("#t1-sec-eclipse .headline", { autoAlpha: 0, y: 28, duration: 0.9, ease: "power4.out" }, 1.3);

      /* corona breathing pulse — finite */
      tl.to("#t1-sec-eclipse .corona", {
        boxShadow:
          "0 0 0 4px rgba(55,189,248,0.60)," +
          "0 0 0 10px rgba(55,189,248,0.25)," +
          "0 0 0 24px rgba(55,189,248,0.10)," +
          "0 0 0 60px rgba(55,189,248,0.05)," +
          "0 0 140px 50px rgba(55,189,248,0.22)," +
          "0 0 300px 90px rgba(55,189,248,0.12)",
        duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true
      }, 2.2);

      /* slow disc drift */
      tl.to("#t1-sec-eclipse .eclipse-wrap", { y: -14, duration: 4.2, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-eclipse"] = tl;
    </script>
  </body>
</html>
