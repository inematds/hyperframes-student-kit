<!doctype html>
<!--
  KALLAWAY · tier1 · section · HALO
  The headline sits dead centre. A thin glowing ring (SVG circle with stroke-dasharray)
  draws on around it over ~1s, then the ring breathes gently. The title glows
  against the ring light. Signature "crowned idea" moment.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-halo {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }

      #t1-sec-halo .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      #t1-sec-halo .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.38;
        -webkit-mask-image: radial-gradient(80% 80% at 50% 50%, #000 20%, transparent 72%);
                mask-image: radial-gradient(80% 80% at 50% 50%, #000 20%, transparent 72%);
      }

      /* SVG halo ring container — centred */
      #t1-sec-halo .halo-svg-wrap {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        /* pointer-events: none so it doesn't interfere with layout */
        pointer-events: none;
      }

      #t1-sec-halo .halo-ring {
        /* stroke-dasharray animated by GSAP */
        stroke: rgba(var(--accent-rgb), 0.80);
        fill: none;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.70))
                drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.35));
      }

      /* Soft inner glow disc inside the ring */
      #t1-sec-halo .halo-inner-glow {
        position: absolute; left: 50%; top: 50%;
        width: 820px; height: 820px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--accent-rgb), 0.14) 0%,
          rgba(var(--accent-rgb), 0.04) 50%,
          transparent 72%);
        z-index: 2; pointer-events: none;
      }

      /* Content — title sits in the centre of the ring */
      #t1-sec-halo .content {
        position: relative; z-index: 4;
        text-align: center; width: 1200px;
      }

      #t1-sec-halo .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 36px;
      }

      #t1-sec-halo .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 90px; line-height: 1.06;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1100px; margin: 0 auto;
      }
      #t1-sec-halo .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-halo .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-halo .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-halo" data-composition-id="t1-sec-halo" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="halo-inner-glow"></div>

      <!-- SVG halo ring: cx/cy = half of viewBox, r chosen so it frames the text -->
      <div class="halo-svg-wrap">
        <svg width="840" height="840" viewBox="0 0 840 840"
             xmlns="http://www.w3.org/2000/svg">
          <circle class="halo-ring" cx="420" cy="420" r="400"
                  stroke-dasharray="2513" stroke-dashoffset="2513"
                  id="t1-sec-halo-circle" />
        </svg>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">The Big Idea</div>
        <div class="headline" data-slot="headline">Leverage Is<br>the <em>Multiplier</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain */
      tl.fromTo("#t1-sec-halo .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* env */
      tl.from("#t1-sec-halo .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0);
      tl.from("#t1-sec-halo .grid",
        { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* inner glow fades in */
      tl.from("#t1-sec-halo .halo-inner-glow",
        { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%", duration: 1.4, ease: "expo.out" }, 0.3);

      /* kicker appears */
      tl.from("#t1-sec-halo .kicker",
        { autoAlpha: 0, y: 14, duration: 0.7, ease: "power3.out" }, 0.6);

      /* headline resolves sharp — no blur tween (avoid filter conflict with potential text-shadow) */
      tl.from("#t1-sec-halo .headline",
        { autoAlpha: 0, scale: 0.92, y: 20, transformOrigin: "50% 50%", duration: 0.9, ease: "power4.out" }, 0.8);

      /* RING DRAWS ON — animate stroke-dashoffset from 2513 → 0 */
      tl.to("#t1-sec-halo-circle",
        { strokeDashoffset: 0, duration: 1.1, ease: "power3.inOut" }, 0.5);

      /* ring breathes — scale pulse, finite */
      tl.to("#t1-sec-halo .halo-svg-wrap",
        { scale: 1.025, transformOrigin: "50% 50%",
          duration: 1.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0);

      /* inner glow breathes in sync */
      tl.to("#t1-sec-halo .halo-inner-glow",
        { opacity: 0.55, duration: 1.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-halo"] = tl;
    </script>
  </body>
</html>
