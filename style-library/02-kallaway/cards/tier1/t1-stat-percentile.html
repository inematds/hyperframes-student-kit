<!doctype html>
<!--
  KALLAWAY · tier1 · stat · PERCENTILE
  "Top X%" with a glowing bell-distribution curve drawn via SVG polyline; a
  vertical marker line travels along the x-axis to land at the percentile
  position. The area to the right of the marker glows in accent blue.
  Knob: data-pct on #t1-stat-pctile-svg (default 5).
  Slots: kicker, stat (e.g. "Top 5%"), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-pctile {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-pctile .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-pctile .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-stat-pctile .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 36px; padding-bottom: 20px;
      }

      #t1-stat-pctile .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* big "Top X%" label */
      #t1-stat-pctile .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 160px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 0%, rgba(var(--accent-rgb), 0.85) 90%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 36px rgba(var(--accent-rgb), 0.55));
      }

      /* SVG distribution chart */
      #t1-stat-pctile .dist-wrap {
        position: relative;
        width: 1100px; height: 200px;
      }

      #t1-stat-pctile .dist-svg {
        width: 1100px; height: 200px;
      }

      /* baseline axis */
      #t1-stat-pctile .axis {
        position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
        background: rgba(255,255,255,0.12);
      }

      /* "You are here" marker glow spot */
      #t1-stat-pctile .marker-glow {
        position: absolute; top: -20px; width: 80px; height: 240px;
        background: radial-gradient(ellipse at 50% 60%, rgba(var(--accent-rgb), 0.30) 0%, transparent 65%);
        transform: translateX(-50%);
        pointer-events: none;
      }

      #t1-stat-pctile .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-pctile .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-pctile .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-pctile .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-pctile .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-pctile" data-composition-id="t1-stat-pctile" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">COURSE RANKING · GLOBAL COHORT</div>

        <div class="stat" id="t1-stat-pctile-display" data-slot="stat">Top 5%</div>

        <div class="dist-wrap">
          <!-- SVG: bell curve + filled right tail + animated marker line -->
          <svg class="dist-svg" id="t1-stat-pctile-svg" data-pct="5"
               viewBox="0 0 1100 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- gradient for the filled tail area -->
              <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(55,189,248,0.55)"/>
                <stop offset="100%" stop-color="rgba(55,189,248,0.15)"/>
              </linearGradient>
              <!-- glow filter -->
              <filter id="curveGlow" x="-5%" y="-20%" width="110%" height="140%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- filled tail area (right of marker) — revealed via clipRect in JS -->
            <clipPath id="tailClip">
              <rect id="t1-stat-pctile-clip" x="1100" y="0" width="0" height="200"/>
            </clipPath>
            <path id="t1-stat-pctile-tail"
              d="M0 180 C 60 180 100 10 200 6 C 300 2 360 0 460 0
                 C 560 0 620 2 720 6 C 820 10 860 180 1100 180 Z"
              fill="url(#tailGrad)" clip-path="url(#tailClip)" opacity="0.8"/>

            <!-- the bell curve stroke -->
            <path id="t1-stat-pctile-curve"
              d="M0 180 C 60 180 100 10 200 6 C 300 2 360 0 460 0
                 C 560 0 620 2 720 6 C 820 10 860 180 1100 180"
              fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"
              filter="url(#curveGlow)"
              stroke-dasharray="2000" stroke-dashoffset="2000"/>

            <!-- axis baseline -->
            <line x1="0" y1="180" x2="1100" y2="180"
              stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

            <!-- marker vertical line — starts at center (x=550), travels to percentile -->
            <line id="t1-stat-pctile-marker"
              x1="550" y1="10" x2="550" y2="180"
              stroke="#37BDF8" stroke-width="2.5"
              style="filter: drop-shadow(0 0 8px rgba(55,189,248,1)) drop-shadow(0 0 18px rgba(55,189,248,0.6));"
            />
            <!-- marker tip dot -->
            <circle id="t1-stat-pctile-tip" cx="550" cy="10" r="7"
              fill="#ffffff"
              style="filter: drop-shadow(0 0 10px rgba(55,189,248,0.9));"
            />
          </svg>

          <!-- ambient glow spot at marker -->
          <div class="marker-glow" id="t1-stat-pctile-mglow" style="left:50%;"></div>
        </div>

        <div class="label" data-slot="label">graduates rank in the <em>top 5% of AI practitioners</em> globally by assessed output quality</div>
      </div>

      <div class="source" data-slot="source">SOURCE · GLOBAL AI SKILLS BENCHMARK 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* read knob */
      const svgEl   = document.getElementById("t1-stat-pctile-svg");
      const pct     = parseFloat(svgEl.getAttribute("data-pct")) || 5;
      /* x position on 0-1100 where the marker should land:
         percentile of 5 → marker near left tail (x ~ pct/100 * 1100 * 0.9 = far left).
         We place 0th percentile at x=0, 100th at x=1100. Top-X% → position at (100-X)% */
      const markerPct = (100 - pct) / 100;   // 0.95 for top-5%
      const markerX   = Math.round(markerPct * 1100);

      const markerEl  = document.getElementById("t1-stat-pctile-marker");
      const tipEl     = document.getElementById("t1-stat-pctile-tip");
      const clipEl    = document.getElementById("t1-stat-pctile-clip");
      const mglowEl   = document.getElementById("t1-stat-pctile-mglow");
      const curveEl   = document.getElementById("t1-stat-pctile-curve");

      /* helper: find y on the bell curve at a given x (0-1100) */
      function bellY(x) {
        /* gaussian approximation; peak at x=550, sigma≈220 */
        const t = (x - 550) / 220;
        return 180 - 174 * Math.exp(-0.5 * t * t);
      }

      /* grain flicker */
      tl.fromTo("#t1-stat-pctile .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-pctile .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-pctile .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-pctile .kicker",
          { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.45)

        /* big stat appears */
        .from("#t1-stat-pctile .stat",
          { autoAlpha: 0, y: 30, duration: 0.9, ease: "power4.out" }, 0.6)

        /* curve draws itself */
        .to("#t1-stat-pctile-curve",
          { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 0.85)

        /* marker travels from center to final position */
        .to({ val: 550 }, {
          val: markerX,
          duration: 1.2, ease: "power3.out",
          onUpdate: function() {
            const x   = this.targets()[0].val;
            const y   = bellY(x);
            markerEl.setAttribute("x1", x);
            markerEl.setAttribute("x2", x);
            markerEl.setAttribute("y1", y);
            tipEl.setAttribute("cx", x);
            tipEl.setAttribute("cy", y);
            /* glow spot follows */
            mglowEl.style.left = (x / 1100 * 100) + "%";
          }
        }, 1.60)

        /* tail area reveals with clip */
        .to({ val: 0 }, {
          val: 1100 - markerX,
          duration: 1.0, ease: "power2.out",
          onUpdate: function() {
            const w = this.targets()[0].val;
            clipEl.setAttribute("x", markerX);
            clipEl.setAttribute("width", w);
          }
        }, 1.70)

        /* label */
        .from("#t1-stat-pctile .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.30)

        /* source */
        .from("#t1-stat-pctile .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.65)

        /* marker glow breathes */
        .to("#t1-stat-pctile .marker-glow",
          { opacity: 0.40, duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)

        .set({}, {}, 7);

      window.__timelines["t1-stat-pctile"] = tl;
    </script>
  </body>
</html>
