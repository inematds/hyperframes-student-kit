<!doctype html>
<!--
  KALLAWAY · tier1 · section · DUOTONE
  Full-screen chapter takeover. A large, soft duotone gradient blob — electric
  blue with a cooler navy shadow — drifts slowly behind the centered title. The
  blob is purely atmospheric, not a hard shape; it breathes and shifts.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-duo {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* ── Duotone blob system ──
         Three overlapping radial blobs at different offsets and sizes.
         Composited with mix-blend-mode: screen so they merge naturally. */
      #t1-sec-duo .blobs {
        position: absolute; inset: 0; z-index: 2;
      }
      #t1-sec-duo .blob {
        position: absolute; border-radius: 50%;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      /* Primary blob — large, warm electric blue, off-center left */
      #t1-sec-duo .blob-a {
        left: 200px; top: 80px;
        width: 1200px; height: 900px;
        background: radial-gradient(circle at 45% 52%,
          rgba(var(--accent-rgb), 0.48) 0%,
          rgba(var(--accent-rgb), 0.18) 38%,
          transparent 62%);
        filter: blur(60px);
      }
      /* Secondary blob — cool navy offset, off-center right */
      #t1-sec-duo .blob-b {
        left: 640px; top: 100px;
        width: 1000px; height: 780px;
        background: radial-gradient(circle at 55% 48%,
          rgba(16, 60, 120, 0.55) 0%,
          rgba(8, 28, 64, 0.28) 42%,
          transparent 64%);
        filter: blur(80px);
      }
      /* Accent highlight — smaller, bright core, center-ish */
      #t1-sec-duo .blob-c {
        left: 580px; top: 220px;
        width: 720px; height: 560px;
        background: radial-gradient(circle at 50% 50%,
          rgba(255,255,255,0.22) 0%,
          rgba(var(--accent-rgb), 0.30) 30%,
          transparent 62%);
        filter: blur(44px);
      }

      /* Dot grid — visible through the blobs */
      #t1-sec-duo .grid {
        position: absolute; inset: 0; z-index: 3;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.35;
      }

      /* Content — centred */
      #t1-sec-duo .content {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        text-align: center; width: 1380px; z-index: 5;
      }
      #t1-sec-duo .kicker {
        font-family: var(--font-display); font-weight: var(--wt-semi); font-style: italic;
        font-size: 38px; letter-spacing: 0.12em;
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 30px;
      }
      /* Divider line between kicker + headline */
      #t1-sec-duo .divider {
        width: 120px; height: 1.5px; margin: 0 auto 36px;
        background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--white) 50%, var(--accent) 70%, transparent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.55);
      }
      #t1-sec-duo .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.07; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-sec-duo .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-duo .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-duo .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.12;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-duo" data-composition-id="t1-sec-duo" data-start="0" data-width="1920" data-height="1080">
      <div class="blobs">
        <div class="blob blob-a"></div>
        <div class="blob blob-b"></div>
        <div class="blob blob-c"></div>
      </div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Lesson 06 —</div>
        <div class="divider"></div>
        <div class="headline" data-slot="headline">Fine-Tuning:<br>Make <em>Any Model</em> Yours</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-duo .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Grid fades in */
      tl.from("#t1-sec-duo .grid", { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.3);

      /* Blobs materialise — each with slightly offset timing */
      tl.from("#t1-sec-duo .blob-a", { autoAlpha: 0, scale: 0.72, duration: 1.8, ease: "expo.out" }, 0)
        .from("#t1-sec-duo .blob-b", { autoAlpha: 0, scale: 0.80, duration: 1.6, ease: "expo.out" }, 0.15)
        .from("#t1-sec-duo .blob-c", { autoAlpha: 0, scale: 0.68, duration: 1.4, ease: "expo.out" }, 0.30);

      /* Continuous slow drift of the blob system during hold (finite travel) */
      tl.to("#t1-sec-duo .blob-a", { x: 60,  y: -40, duration: 6.0, ease: "sine.inOut" }, 1.2);
      tl.to("#t1-sec-duo .blob-b", { x: -50, y:  30, duration: 6.0, ease: "sine.inOut" }, 1.2);
      tl.to("#t1-sec-duo .blob-c", { x: 30,  y:  20, duration: 5.5, ease: "sine.inOut" }, 1.4);

      /* Kicker + divider + headline come in with blur-focus */
      tl.from("#t1-sec-duo .kicker",   { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.8, ease: "power3.out" }, 0.8)
        .from("#t1-sec-duo .divider",  { autoAlpha: 0, scaleX: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.out" }, 1.1)
        .from("#t1-sec-duo .headline", { autoAlpha: 0, y: 34, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.3);

      /* Breathing glow pulse on blob-c (the bright highlight) — finite */
      tl.to("#t1-sec-duo .blob-c", {
        opacity: 0.65, duration: 1.3, ease: "sine.inOut", repeat: 3, yoyo: true
      }, 2.4);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-duo"] = tl;
    </script>
  </body>
</html>
