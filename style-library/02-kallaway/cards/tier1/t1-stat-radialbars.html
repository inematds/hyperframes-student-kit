<!doctype html>
<!--
  KALLAWAY · tier1 · stat · RADIALBARS
  Several concentric arc bars of different lengths glow in from the outside in.
  A bold headline value sits at the center. Each arc represents a different metric.
  Knob: data-pct on the lead (outermost) arc element #t1-stat-radbar-svg (default 68).
  Slots: kicker (~28 chars uppercase), stat (center headline value), label (~70 chars, <em> on one phrase), source (~40 chars uppercase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-radbar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-radbar .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-radbar .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Left block: radial chart */
      #t1-stat-radbar .chart-block {
        position: absolute; left: 180px; top: 50%;
        transform: translateY(-50%);
        z-index: 4;
      }

      /* Glow behind chart */
      #t1-stat-radbar .chart-glow {
        position: absolute; left: -80px; top: -80px; right: -80px; bottom: -80px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 65%);
        box-shadow: 0 0 120px 30px rgba(var(--accent-rgb), 0.20);
        pointer-events: none;
      }

      #t1-stat-radbar .radbar-svg {
        width: 580px; height: 580px;
        position: relative; z-index: 2;
        overflow: visible;
      }

      /* Center value inside chart */
      #t1-stat-radbar .center-val {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        text-align: center; z-index: 3;
      }
      #t1-stat-radbar .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 120px;
        line-height: 0.9;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 15%, rgba(var(--accent-rgb), 0.80) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-radbar .stat-sub {
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.12em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-top: 6px;
      }

      /* Right block: kicker + label + legend */
      #t1-stat-radbar .right-block {
        position: absolute; right: 140px; top: 50%;
        transform: translateY(-50%);
        z-index: 4; max-width: 640px;
        display: flex; flex-direction: column; gap: 32px;
      }

      #t1-stat-radbar .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      #t1-stat-radbar .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        line-height: 1.45;
      }
      #t1-stat-radbar .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* Legend for the 4 arcs */
      #t1-stat-radbar .legend {
        display: flex; flex-direction: column; gap: 16px;
      }
      #t1-stat-radbar .legend-item {
        display: flex; align-items: center; gap: 16px;
      }
      #t1-stat-radbar .legend-swatch {
        width: 32px; height: 6px; border-radius: 3px; flex-shrink: 0;
      }
      #t1-stat-radbar .legend-text {
        font-family: var(--font-body);
        font-size: 24px;
        color: var(--text-dim);
      }
      #t1-stat-radbar .legend-pct {
        font-family: var(--font-mono);
        font-size: 24px;
        color: var(--text);
        margin-left: auto;
        letter-spacing: 0.08em;
      }

      #t1-stat-radbar .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-radbar .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-radbar .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-radbar" data-composition-id="t1-stat-radbar"
         data-start="0" data-width="1920" data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="chart-block" id="t1-stat-radbar-chart">
        <div class="chart-glow"></div>

        <!--
          4 concentric arcs. Lead arc (outermost) driven by data-pct.
          Radii: 260, 210, 160, 110. Center: 290, 290.
          Each arc sweeps 270deg max (from -225deg to +45deg = 3/4 circle).
          Arc values (hardcoded inner arcs): 85, 72, 58 (lead = data-pct=68).
        -->
        <svg class="radbar-svg" id="t1-stat-radbar-svg" data-pct="68"
             viewBox="0 0 580 580" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="arc1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
            </linearGradient>
            <linearGradient id="arc2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.9"/>
            </linearGradient>
            <linearGradient id="arc3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F5D82A" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#F5D82A" stop-opacity="0.85"/>
            </linearGradient>
            <linearGradient id="arc4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF8A5C" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#FF8A5C" stop-opacity="0.85"/>
            </linearGradient>
            <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>

          <!-- Track arcs (dim) -->
          <!-- r=260 -->
          <circle cx="290" cy="290" r="260"
            stroke="rgba(255,255,255,0.06)" stroke-width="18"
            stroke-linecap="round" fill="none"
            stroke-dasharray="1099.6" stroke-dashoffset="274.9"
            transform="rotate(-225 290 290)"/>
          <!-- r=210 -->
          <circle cx="290" cy="290" r="210"
            stroke="rgba(255,255,255,0.06)" stroke-width="18"
            stroke-linecap="round" fill="none"
            stroke-dasharray="879.6" stroke-dashoffset="219.9"
            transform="rotate(-225 290 290)"/>
          <!-- r=160 -->
          <circle cx="290" cy="290" r="160"
            stroke="rgba(255,255,255,0.06)" stroke-width="18"
            stroke-linecap="round" fill="none"
            stroke-dasharray="1005.3" stroke-dashoffset="251.3"
            transform="rotate(-225 290 290)"/>
          <!-- r=110 -->
          <circle cx="290" cy="290" r="110"
            stroke="rgba(255,255,255,0.06)" stroke-width="18"
            stroke-linecap="round" fill="none"
            stroke-dasharray="691.2" stroke-dashoffset="172.8"
            transform="rotate(-225 290 290)"/>

          <!-- Filled arcs — driven by JS -->
          <!-- arc1: r=260 — lead, driven by data-pct -->
          <circle id="t1-stat-radbar-arc1" cx="290" cy="290" r="260"
            stroke="url(#arc1Grad)" stroke-width="18"
            stroke-linecap="round" fill="none"
            filter="url(#arcGlow)"
            transform="rotate(-225 290 290)"/>
          <!-- arc2: r=210 — 85% -->
          <circle id="t1-stat-radbar-arc2" cx="290" cy="290" r="210"
            stroke="url(#arc2Grad)" stroke-width="18"
            stroke-linecap="round" fill="none"
            filter="url(#arcGlow)"
            transform="rotate(-225 290 290)"/>
          <!-- arc3: r=160 — 72%, yellow -->
          <circle id="t1-stat-radbar-arc3" cx="290" cy="290" r="160"
            stroke="url(#arc3Grad)" stroke-width="18"
            stroke-linecap="round" fill="none"
            filter="url(#arcGlow)"
            transform="rotate(-225 290 290)"/>
          <!-- arc4: r=110 — 58%, orange -->
          <circle id="t1-stat-radbar-arc4" cx="290" cy="290" r="110"
            stroke="url(#arc4Grad)" stroke-width="18"
            stroke-linecap="round" fill="none"
            filter="url(#arcGlow)"
            transform="rotate(-225 290 290)"/>
        </svg>

        <div class="center-val">
          <div class="stat" id="t1-stat-radbar-num" data-slot="stat">68%</div>
          <div class="stat-sub">LEAD METRIC</div>
        </div>
      </div>

      <div class="right-block">
        <div class="kicker" data-slot="kicker">SKILLS BENCHMARK · COHORT 12</div>

        <div class="label" data-slot="label">graduates score above industry average on <em>every core competency</em> tracked in the assessment</div>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-swatch" style="background: rgba(55,189,248,0.9);
              box-shadow: 0 0 10px rgba(55,189,248,0.6);"></div>
            <span class="legend-text">Practical AI</span>
            <span class="legend-pct" id="t1-stat-radbar-l1">68%</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background: rgba(55,189,248,0.75);
              box-shadow: 0 0 10px rgba(55,189,248,0.4);"></div>
            <span class="legend-text">Prompt Engineering</span>
            <span class="legend-pct">85%</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background: rgba(245,216,42,0.85);
              box-shadow: 0 0 10px rgba(245,216,42,0.5);"></div>
            <span class="legend-text">Model Evaluation</span>
            <span class="legend-pct">72%</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background: rgba(255,138,92,0.85);
              box-shadow: 0 0 10px rgba(255,138,92,0.5);"></div>
            <span class="legend-text">Ethics & Safety</span>
            <span class="legend-pct">58%</span>
          </div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS SKILLS FRAMEWORK 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const svgEl  = document.getElementById("t1-stat-radbar-svg");
      const pct    = parseFloat(svgEl.getAttribute("data-pct")) || 68;
      const numEl  = document.getElementById("t1-stat-radbar-num");
      const l1El   = document.getElementById("t1-stat-radbar-l1");

      /* Arc circumferences for 270° sweep (= 3/4 of full circle) */
      /* For a circle with radius r: full circ = 2πr, 270° arc = 0.75 * 2πr */
      /* stroke-dashoffset = full_circ - arc_length, so:
           dasharray  = 2πr
           dashoffset = 2πr - (pct/100) * 0.75 * 2πr = 2πr * (1 - pct/100 * 0.75) */

      function arcDash(r, p) {
        const c = 2 * Math.PI * r;
        return { array: c, offset: c - (p / 100) * 0.75 * c };
      }

      /* Init: all arcs empty */
      const arcs = [
        { el: document.getElementById("t1-stat-radbar-arc1"), r: 260, target: pct },
        { el: document.getElementById("t1-stat-radbar-arc2"), r: 210, target: 85  },
        { el: document.getElementById("t1-stat-radbar-arc3"), r: 160, target: 72  },
        { el: document.getElementById("t1-stat-radbar-arc4"), r: 110, target: 58  },
      ];
      arcs.forEach(function(a) {
        const d = arcDash(a.r, 0);
        a.el.style.strokeDasharray  = d.array;
        a.el.style.strokeDashoffset = d.array; /* start empty */
      });

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-radbar .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-radbar .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-radbar .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* right block: kicker */
        .from("#t1-stat-radbar .kicker",
          { autoAlpha: 0, x: 28, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.5)

        /* chart blooms in */
        .from("#t1-stat-radbar .chart-glow",
          { autoAlpha: 0, scale: 0.4, duration: 1.2, ease: "expo.out" }, 0.60)
        .from("#t1-stat-radbar .radbar-svg",
          { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 1.0, ease: "back.out(1.4)" }, 0.65)

        /* center stat */
        .from("#t1-stat-radbar .center-val",
          { autoAlpha: 0, scale: 0.7, duration: 0.8, ease: "power3.out" }, 0.80)

        /* all 4 arcs fill + lead arc count-up */
        .to({ val: 0 }, {
          val: 1,
          duration: 2.0, ease: "power2.out",
          onUpdate: function() {
            const t = this.targets()[0].val;
            arcs.forEach(function(a) {
              const d = arcDash(a.r, a.target * t);
              a.el.style.strokeDasharray  = d.array;
              a.el.style.strokeDashoffset = d.offset;
            });
            const v = pct * t;
            numEl.textContent = Math.round(v) + "%";
            l1El.textContent  = Math.round(v) + "%";
          }
        }, 1.0)

        /* right block: label + legend */
        .from("#t1-stat-radbar .label",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.0)
        .from("#t1-stat-radbar .legend",
          { autoAlpha: 0, x: 20, duration: 0.85, ease: "power3.out" }, 2.2)

        /* source */
        .from("#t1-stat-radbar .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.6)

        /* breathing glow */
        .to("#t1-stat-radbar .chart-glow",
          { opacity: 0.55, scale: 1.08, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.2)

        .set({}, {}, 7);

      window.__timelines["t1-stat-radbar"] = tl;
    </script>
  </body>
</html>
