<!doctype html>
<!--
  KALLAWAY · tier1 · stat · FIGURE
  Full-screen hero number. A giant gradient-glow numeral counts up from zero in the
  center; a brief kicker rides above it; a label caption floats below. Aurora bloom
  behind everything, glass disc halo behind the number.
  Slots: kicker (~28 chars uppercase), stat (number/figure e.g. "73%"), label (~70
  chars, <em> on one phrase), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-fig {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-stat-fig .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      /* Dot grid */
      #t1-stat-fig .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Glass halo disc behind the number */
      #t1-stat-fig .halo {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -56%);
        width: 860px; height: 860px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--accent-rgb), 0.12) 0%,
          rgba(var(--accent-rgb), 0.05) 40%,
          transparent 70%);
        box-shadow: 0 0 120px 30px rgba(var(--accent-rgb), 0.18);
        z-index: 2;
      }

      /* Content stack */
      #t1-stat-fig .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; padding-bottom: 60px;
      }

      #t1-stat-fig .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 24px;
      }

      /* Giant gradient number */
      #t1-stat-fig .stat-wrap {
        position: relative; display: flex; align-items: center; justify-content: center;
        margin-bottom: 32px;
      }
      #t1-stat-fig .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 280px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        /* white → accent gradient clip-text */
        background: linear-gradient(160deg, #ffffff 10%, rgba(var(--accent-rgb),0.85) 80%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-fill-color: transparent;
        text-shadow: none;
        filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.55)) drop-shadow(0 0 80px rgba(var(--accent-rgb), 0.28));
      }

      #t1-stat-fig .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
        letter-spacing: var(--track-snug);
      }
      #t1-stat-fig .label em {
        font-style: normal;
        color: var(--text);
        text-shadow: var(--textglow);
      }

      /* Source — bottom-left */
      #t1-stat-fig .source {
        position: absolute;
        left: var(--pad); bottom: 44px;
        font-family: var(--font-mono);
        font-size: var(--size-tiny);
        font-weight: var(--wt-reg);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
        z-index: 5;
      }

      #t1-stat-fig .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-fig .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-fig" data-composition-id="t1-stat-fig" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="halo"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">ADOPTION RATE · 2026</div>
        <div class="stat-wrap">
          <div class="stat" id="t1-stat-fig-num" data-slot="stat">73%</div>
        </div>
        <div class="label" data-slot="label">of organizations have <em>deployed AI tools</em> in their core workflows this year</div>
      </div>

      <div class="source" data-slot="source">SOURCE · MCKINSEY GLOBAL 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Parse the display value — strip non-numeric suffix for count-up */
      const statEl = document.getElementById("t1-stat-fig-num");
      const raw = statEl.textContent.trim();          // e.g. "73%"
      const suffix = raw.replace(/[\d.]+/, "");       // e.g. "%"
      const target = parseFloat(raw) || 73;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-fig .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom in */
      tl.from("#t1-stat-fig .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-fig .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* halo blooms behind number */
        .from("#t1-stat-fig .halo",
          { autoAlpha: 0, scale: 0.6, duration: 1.6, ease: "expo.out" }, 0.3)

        /* kicker glides in */
        .from("#t1-stat-fig .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.55)

        /* count-up for the number */
        .fromTo({ val: 0 }, { val: target,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            statEl.textContent = Math.round(v) + suffix;
          }
        }, 0.80)

        /* number blooms in visually with blur focus pull */
        .from("#t1-stat-fig .stat",
          { autoAlpha: 0, scale: 0.82, filter: "blur(28px)", duration: 1.1, ease: "power4.out" }, 0.80)

        /* label glides in */
        .from("#t1-stat-fig .label",
          { autoAlpha: 0, y: 22, filter: "blur(10px)", duration: 0.9, ease: "power3.out" }, 1.55)

        /* source fades in */
        .from("#t1-stat-fig .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 1.85)

        /* breathing glow on halo — finite pulse */
        .to("#t1-stat-fig .halo",
          { opacity: 0.55, scale: 1.06, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4)

        .set({}, {}, 7);

      window.__timelines["t1-stat-fig"] = tl;
    </script>
  </body>
</html>
