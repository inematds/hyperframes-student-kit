<!doctype html>
<!--
  KALLAWAY · tier1 · section · BEAM
  Full-screen chapter takeover. A single vertical god-ray light beam sweeps
  left to right across the dark canvas; as the beam passes through the title
  position the text is revealed in its wake, like light exposing text on film.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-beam {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-beam .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      #t1-sec-beam .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 120% at 50% 50%, #000 40%, transparent 80%);
                mask-image: radial-gradient(120% 120% at 50% 50%, #000 40%, transparent 80%);
      }

      /* The god-ray beam — a tall, narrow, soft-edged bar of light that sweeps across */
      #t1-sec-beam .beam {
        position: absolute; top: -200px; bottom: -200px;
        width: 320px;
        /* Beam positioned left of frame initially (set via GSAP) */
        left: -320px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.06) 15%,
          rgba(var(--accent-rgb), 0.22) 32%,
          rgba(255,255,255,0.38) 50%,
          rgba(var(--accent-rgb), 0.22) 68%,
          rgba(var(--accent-rgb), 0.06) 85%,
          transparent 100%
        );
        filter: blur(8px);
        z-index: 4;
        pointer-events: none;
      }

      /* Floor reflection of the beam at the bottom */
      #t1-sec-beam .beam-floor {
        position: absolute; bottom: -20px; left: -320px;
        width: 320px; height: 340px;
        background: linear-gradient(to top,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 100%
        );
        filter: blur(18px);
        z-index: 4;
        pointer-events: none;
      }

      /* Particle dust caught in the beam — 8 tiny bright specks (hardcoded positions) */
      #t1-sec-beam .dust-wrap {
        position: absolute; inset: 0; z-index: 5; pointer-events: none;
      }
      #t1-sec-beam .dust {
        position: absolute; border-radius: 50%;
        background: rgba(255,255,255,0.88);
        box-shadow: 0 0 6px rgba(var(--accent-rgb),0.80);
      }

      /* Content — centered; revealed by the beam sweep */
      #t1-sec-beam .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-54%);
        text-align: center; z-index: 6;
      }
      #t1-sec-beam .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 24px;
      }
      #t1-sec-beam .plate {
        position: absolute; left: 50%; top: 76px; transform: translateX(-50%);
        width: 1200px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(255,255,255,0.11), transparent 70%);
        filter: blur(18px); z-index: -1;
      }
      #t1-sec-beam .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1340px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-beam .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-beam .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-beam .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-beam" data-composition-id="t1-sec-beam" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Beam and floor reflection -->
      <div class="beam"></div>
      <div class="beam-floor"></div>

      <!-- Dust motes — 8 hardcoded positions relative to beam center (offset applied by GSAP) -->
      <div class="dust-wrap">
        <div class="dust" style="width:4px; height:4px; left:  80px; top: 220px;"></div>
        <div class="dust" style="width:3px; height:3px; left: 140px; top: 380px;"></div>
        <div class="dust" style="width:5px; height:5px; left:  60px; top: 540px;"></div>
        <div class="dust" style="width:3px; height:3px; left: 160px; top: 660px;"></div>
        <div class="dust" style="width:4px; height:4px; left: 100px; top: 780px;"></div>
        <div class="dust" style="width:3px; height:3px; left:  50px; top: 860px;"></div>
        <div class="dust" style="width:4px; height:4px; left: 170px; top: 140px;"></div>
        <div class="dust" style="width:3px; height:3px; left: 120px; top: 940px;"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 9 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">Where the <em>Light</em> Falls on What Matters</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-beam .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas fades in */
      tl.from("#t1-sec-beam .bloom", { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-beam .grid",  { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* Beam sweeps left → right across full canvas width.
         Starts at x=-320 (off left edge), travels to x=1920 (off right edge).
         Total travel = 2240px; at power2.inOut the mid-sweep is fastest.
         We want the beam to cross center (~960px) at approximately t=1.0s so
         the title reveal lands at that moment. */
      tl.fromTo("#t1-sec-beam .beam",
        { x: -320 },
        { x: 2240, duration: 2.2, ease: "power2.inOut" }, 0.1);

      tl.fromTo("#t1-sec-beam .beam-floor",
        { x: -320 },
        { x: 2240, duration: 2.2, ease: "power2.inOut" }, 0.1);

      /* Dust motes travel with beam (same timing, offset slightly) */
      tl.fromTo("#t1-sec-beam .dust",
        { x: -320 },
        { x: 2240, duration: 2.2, ease: "power2.inOut",
          stagger: { each: 0.06, from: "start" } }, 0.1);

      /* Text is revealed as the beam sweeps through center (~t=1.1s) */
      tl.from("#t1-sec-beam .kicker",   { autoAlpha: 0, x: -30, duration: 0.65, ease: "power3.out" }, 1.05)
        .from("#t1-sec-beam .plate",    { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 1.15)
        .from("#t1-sec-beam .headline", { autoAlpha: 0, x: -44, duration: 0.85, ease: "power4.out" }, 1.20);

      /* After the sweep, a secondary beam crosses back (narrower, dimmer) */
      tl.fromTo("#t1-sec-beam .beam",
        { x: 2240, opacity: 0.35 },
        { x: -320, opacity: 0.18, duration: 3.2, ease: "power1.inOut" }, 3.5);

      /* Plate breathing glow */
      tl.to("#t1-sec-beam .plate", { opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.6);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-beam"] = tl;
    </script>
  </body>
</html>
