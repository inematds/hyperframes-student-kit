<!doctype html>
<!--
  KALLAWAY · tier1 · stat · FILLSHAPE
  A large rounded-square "vessel" fills upward with glowing blue light to the
  knob percentage. A clip-path wipe drives the fill; the count-up number sits
  centered inside and transitions from dim to bright as the fill reaches it.
  Knob: data-pct on #t1-stat-fill-shape (default 67).
  Slots: kicker (~28 chars), stat (e.g. "67%"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-fill {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-fill .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-fill .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── layout ── */
      #t1-stat-fill .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: row;
        align-items: center; justify-content: center; gap: 100px;
      }

      /* left: kicker + label + source stack */
      #t1-stat-fill .text-col {
        display: flex; flex-direction: column; gap: 40px; max-width: 760px;
      }
      #t1-stat-fill .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
      #t1-stat-fill .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim); line-height: 1.45;
      }
      #t1-stat-fill .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* right: the fill shape */
      #t1-stat-fill .shape-wrap {
        position: relative; flex-shrink: 0;
        width: 380px; height: 500px;
      }

      /* outer vessel border */
      #t1-stat-fill .vessel {
        position: absolute; inset: 0;
        border-radius: 60px;
        border: 2px solid rgba(var(--accent-rgb), 0.35);
        box-shadow: 0 0 40px rgba(var(--accent-rgb), 0.18),
                    inset 0 0 60px rgba(var(--accent-rgb), 0.05);
        background: rgba(var(--accent-rgb), 0.03);
        overflow: hidden;
      }

      /* fill panel — clipped from the bottom up by JS via clip-path */
      #t1-stat-fill .vessel-fill {
        position: absolute; inset: 0;
        background: linear-gradient(to top,
          rgba(var(--accent-rgb), 0.85) 0%,
          rgba(var(--accent-rgb), 0.45) 55%,
          rgba(var(--accent-rgb), 0.14) 100%);
        /* ripple top edge */
        box-shadow: 0 -6px 28px rgba(var(--accent-rgb), 0.55),
                    0 -2px 10px rgba(255,255,255,0.40);
        clip-path: inset(100% 0 0 0 round 4px);  /* starts fully hidden */
      }

      /* glow behind shape */
      #t1-stat-fill .shape-glow {
        position: absolute; inset: -60px; border-radius: 80px;
        background: radial-gradient(circle, rgba(var(--accent-rgb),0.18) 0%, transparent 70%);
        box-shadow: 0 0 120px 20px rgba(var(--accent-rgb),0.16);
        z-index: -1;
      }

      /* stat number overlaid on shape */
      #t1-stat-fill .stat {
        position: absolute; left: 0; right: 0; bottom: 30px;
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 120px; line-height: 1; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        z-index: 3;
      }

      /* waterline ticks on the vessel side */
      #t1-stat-fill .tick {
        position: absolute; right: -24px;
        width: 14px; height: 1px;
        background: rgba(var(--accent-rgb), 0.45);
      }

      #t1-stat-fill .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-fill .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-fill .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-fill" data-composition-id="t1-stat-fill" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="text-col">
          <div class="kicker" data-slot="kicker">MODULE PASS RATE · COHORT 7</div>
          <div class="label" data-slot="label">students who reach the midpoint of any AI module go on to <em>pass on their first attempt</em></div>
        </div>

        <!-- fill shape -->
        <div class="shape-wrap">
          <div class="shape-glow" id="t1-stat-fill-glow"></div>
          <div class="vessel" id="t1-stat-fill-shape" data-pct="67">
            <div class="vessel-fill" id="t1-stat-fill-water"></div>
          </div>
          <!-- waterline tick marks every 25% -->
          <div class="tick" style="bottom: 25%; "></div>
          <div class="tick" style="bottom: 50%; "></div>
          <div class="tick" style="bottom: 75%; "></div>
          <div class="stat" id="t1-stat-fill-num" data-slot="stat">67%</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS ASSESSMENT DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const shapeEl = document.getElementById("t1-stat-fill-shape");
      const waterEl = document.getElementById("t1-stat-fill-water");
      const numEl   = document.getElementById("t1-stat-fill-num");
      const pct     = parseFloat(shapeEl.getAttribute("data-pct")) || 67;

      /* init: fill fully hidden (inset from top = 100%) */
      waterEl.style.clipPath = "inset(100% 0 0 0 round 4px)";
      numEl.textContent = "0%";

      /* grain flicker */
      tl.fromTo("#t1-stat-fill .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-fill .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-fill .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-fill .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.40)

        /* vessel entrance */
        .from("#t1-stat-fill .vessel",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 50%",
            duration: 0.9, ease: "back.out(1.4)" }, 0.55)
        .from("#t1-stat-fill-glow",
          { autoAlpha: 0, scale: 0.6, duration: 1.0, ease: "expo.out" }, 0.60)

        /* fill rises + count-up */
        .to({ val: 0 }, {
          val: pct, duration: 2.0, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            /* inset from top: when v=0 → 100%; when v=100 → 0% */
            const topPct = 100 - v;
            waterEl.style.clipPath = "inset(" + topPct + "% 0 0 0 round 4px)";
            numEl.textContent = Math.round(v) + "%";
          }
        }, 0.75)

        /* stat number fade-in as fill rises past it */
        .from("#t1-stat-fill .stat",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 0.90)

        /* label */
        .from("#t1-stat-fill .label",
          { autoAlpha: 0, x: -30, duration: 0.85, ease: "power3.out" }, 1.40)

        /* source */
        .from("#t1-stat-fill .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.20)

        /* glow breathing */
        .to("#t1-stat-fill-glow",
          { opacity: 0.50, scale: 1.12,
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-fill"] = tl;
    </script>
  </body>
</html>
