<!doctype html>
<!--
  KALLAWAY · tier1 · section · QUESTION
  Full-screen chapter takeover. A clean centred glowing question headline — minimal,
  maximum impact. The entire card breathes with a strong central bloom. Kicker
  is a tiny italic label below the headline, almost a caption whisper.
  Slots: kicker (~16 chars), headline (~52 chars, <em> wraps one phrase for accent).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-q {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom — stronger here, this card IS the bloom */
      #t1-sec-q .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Secondary central bloom — extra halo behind the question */
      #t1-sec-q .bloom-center {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 1400px; height: 700px;
        background: radial-gradient(ellipse at 50% 55%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.06) 40%,
          transparent 68%);
        filter: blur(40px);
        z-index: 2; pointer-events: none;
      }
      /* Dot grid */
      #t1-sec-q .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content — centered */
      #t1-sec-q .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        text-align: center; z-index: 4;
        padding: 0 120px;
      }

      /* Opening question mark accent — oversized, faint */
      #t1-sec-q .q-mark {
        display: block;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 180px; line-height: 1;
        /* gradient fill recedes */
        background: linear-gradient(
          160deg,
          rgba(var(--accent-rgb), 0.55) 0%,
          rgba(var(--accent-rgb), 0.14) 60%,
          transparent 90%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.35));
        margin-bottom: -30px;
        letter-spacing: 0;
        user-select: none;
      }

      /* Headline */
      #t1-sec-q .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-display); line-height: 1.02; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 44px;
      }
      #t1-sec-q .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Kicker — tiny italic label below, whisper style */
      #t1-sec-q .kicker {
        font-family: var(--font-body); font-style: italic; font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: 0.06em;
        color: var(--text-faint);
      }

      /* Vignette + grain */
      #t1-sec-q .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-q .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-q" data-composition-id="t1-sec-q" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-center"></div>
      <div class="grid"></div>

      <div class="content">
        <span class="q-mark" aria-hidden="true">?</span>
        <div class="headline" data-slot="headline">Why Does Every Expert<br><em>Disagree</em> on This?</div>
        <div class="kicker" data-slot="kicker">— The Real Question —</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-q .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "90px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom surges */
      tl.from("#t1-sec-q .bloom",
        { autoAlpha: 0, scale: 0.85, transformOrigin: "50% 120%", duration: 1.6, ease: "expo.out" }, 0)
        .from("#t1-sec-q .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.15)

        /* central halo pulses in first */
        .from("#t1-sec-q .bloom-center",
          { autoAlpha: 0, scale: 0.6, duration: 1.4, ease: "power4.out" }, 0.3)

        /* question mark rises like a ghost */
        .from("#t1-sec-q .q-mark",
          { autoAlpha: 0, scale: 1.3, y: -20, filter: "blur(24px)",
            transformOrigin: "50% 50%", duration: 1.2, ease: "power4.out" }, 0.4)

        /* headline glides up — the main event */
        .from("#t1-sec-q .headline",
          { autoAlpha: 0, y: 50, filter: "blur(18px)", duration: 1.2, ease: "power4.out" }, 0.85)

        /* kicker whispers in after */
        .from("#t1-sec-q .kicker",
          { autoAlpha: 0, y: 14, filter: "blur(6px)", duration: 0.8, ease: "power3.out" }, 1.5)

        /* central bloom breathes — the main ambient pulse */
        .to("#t1-sec-q .bloom-center",
          { opacity: 0.5, scale: 1.12, duration: 1.8, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        /* headline very slow upward drift */
        .to("#t1-sec-q .headline",
          { y: -14, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-sec-q"] = tl;
    </script>
  </body>
</html>
