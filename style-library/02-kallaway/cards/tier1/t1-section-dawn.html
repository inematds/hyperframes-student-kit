<!doctype html>
<!--
  KALLAWAY · tier1 · section · DAWN
  Full-screen chapter takeover. A warm-to-cool gradient "dawn" light rises up
  from the very bottom of the canvas — warm orange-amber at the horizon fading
  to the signature AIS blue higher up, like a sunrise viewed from space. The
  title sits in the upper zone, its text glowing with a cool-blue halo above
  the warm horizon. The horizon line itself is a faint glowing edge.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-dawn {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas-deep); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* ── DAWN GRADIENT — rises from bottom ─────────────────────────── */
      /* Warm lower zone — amber/orange at the horizon */
      #t1-sec-dawn .dawn-warm {
        position: absolute;
        left: 0; right: 0;
        bottom: 0; height: 560px;
        background: radial-gradient(120% 100% at 50% 100%,
          rgba(var(--warm-rgb), 0.50) 0%,
          rgba(var(--accent2-rgb), 0.28) 22%,
          rgba(var(--accent-rgb), 0.16) 48%,
          transparent 72%);
        z-index: 1;
      }
      /* Cool upper bloom — the blue sky zone */
      #t1-sec-dawn .dawn-cool {
        position: absolute; inset: 0;
        background: var(--bloom-bottom);
        z-index: 1; opacity: 0.55;
      }
      /* Horizon line — thin glowing edge where warm meets dark */
      #t1-sec-dawn .horizon {
        position: absolute;
        left: 0; right: 0;
        bottom: 300px; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--warm-rgb), 0.35) 12%,
          rgba(var(--accent2-rgb), 0.65) 30%,
          rgba(255,255,255,0.80) 46%,
          rgba(var(--accent-rgb), 0.80) 50%,
          rgba(255,255,255,0.80) 54%,
          rgba(var(--accent2-rgb), 0.65) 70%,
          rgba(var(--warm-rgb), 0.35) 88%,
          transparent 100%);
        box-shadow:
          0 0 8px 2px rgba(var(--warm-rgb),0.45),
          0 0 22px 5px rgba(var(--accent2-rgb),0.30),
          0 0 40px 10px rgba(var(--accent-rgb),0.22);
        z-index: 3;
        transform: scaleX(0);
        transform-origin: 50% 50%;
      }
      /* Atmosphere haze just above horizon */
      #t1-sec-dawn .haze {
        position: absolute;
        left: 0; right: 0;
        bottom: 240px; height: 200px;
        background: radial-gradient(100% 100% at 50% 100%,
          rgba(var(--accent-rgb), 0.14) 0%,
          rgba(var(--warm-rgb), 0.10) 30%,
          transparent 70%);
        filter: blur(22px);
        z-index: 2;
      }

      /* Dot grid — visible mostly in the cool upper zone */
      #t1-sec-dawn .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.38;
        -webkit-mask-image: radial-gradient(120% 90% at 50% 30%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 90% at 50% 30%, #000 35%, transparent 80%);
      }

      /* ── CONTENT — upper zone ────────────────────────────────────────── */
      #t1-sec-dawn .content {
        position: absolute; left: 0; right: 0;
        top: 210px;
        text-align: center; z-index: 5;
      }
      #t1-sec-dawn .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 32px;
      }
      #t1-sec-dawn .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1320px; margin: 0 auto; padding: 0 80px;
      }
      #t1-sec-dawn .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-dawn .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-dawn .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-dawn" data-composition-id="t1-sec-dawn" data-start="0" data-width="1920" data-height="1080">
      <div class="dawn-warm"></div>
      <div class="dawn-cool"></div>
      <div class="haze"></div>
      <div class="horizon"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— The Beginning —</div>
        <div class="headline" data-slot="headline">A New Era of Learning<br>Starts <em>Right Here</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-dawn .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-dawn .dawn-cool",
            { autoAlpha: 0, duration: 1.3, ease: "power2.out" }, 0)
        .from("#t1-sec-dawn .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Dawn warm light rises from below — starts off-canvas, slides up */
      tl.from("#t1-sec-dawn .dawn-warm",
            { autoAlpha: 0, y: 200, duration: 1.6, ease: "power3.out" }, 0.20);

      /* Haze fades in above horizon */
      tl.from("#t1-sec-dawn .haze",
            { autoAlpha: 0, y: 80, duration: 1.2, ease: "power2.out" }, 0.55);

      /* Horizon line draws from center outward */
      tl.to("#t1-sec-dawn .horizon",
            { scaleX: 1, transformOrigin: "50% 50%", duration: 0.80, ease: "power3.out" }, 0.85);

      /* Kicker glides in */
      tl.from("#t1-sec-dawn .kicker",
            { autoAlpha: 0, y: 20, filter: "blur(10px)", duration: 0.75, ease: "power3.out" }, 1.0);

      /* Headline glides in — focus pull */
      tl.from("#t1-sec-dawn .headline",
            { autoAlpha: 0, y: 36, filter: "blur(18px)", duration: 1.0, ease: "power4.out" }, 1.25);

      /* Dawn warm glow breathes — finite pulse suggesting a sun rising */
      tl.to("#t1-sec-dawn .dawn-warm",
            { opacity: 0.75, duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      /* Horizon glow pulses */
      tl.to("#t1-sec-dawn .horizon",
            { boxShadow: "0 0 14px 4px rgba(var(--warm-rgb),0.65), 0 0 36px 8px rgba(var(--accent2-rgb),0.45), 0 0 60px 14px rgba(var(--accent-rgb),0.35)",
              duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0);

      /* Slow dawn cool drift */
      tl.to("#t1-sec-dawn .dawn-cool",
            { scale: 1.06, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-dawn"] = tl;
    </script>
  </body>
</html>
