<!doctype html>
<!--
  KALLAWAY · tier1 · section · REVEAL-MASK
  The headline is revealed by a moving light-wipe mask — a bright blue-white
  clip-path sweep that travels left to right across the title, leaving the text
  glowing in its wake. The kicker fades in first, then the wipe crosses the
  headline in ~1s. Premium "light through a blind" reveal.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-rmask {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-rmask .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      #t1-sec-rmask .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 55%, #000 30%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 55%, #000 30%, transparent 80%);
      }

      /* Content positioned centre */
      #t1-sec-rmask .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        text-align: center; z-index: 4;
        padding: 0 120px;
      }

      #t1-sec-rmask .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 38px;
      }

      /* Headline wrapper clips the text */
      #t1-sec-rmask .headline-wrap {
        position: relative; display: inline-block;
        overflow: visible;
      }

      #t1-sec-rmask .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        position: relative; z-index: 1;
        /* clipped via clip-path — starts fully hidden (clip at left edge) */
        clip-path: inset(0 100% 0 0);
      }

      #t1-sec-rmask .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* The wipe beam — a luminous vertical bar that sweeps across */
      #t1-sec-rmask .wipe-beam {
        position: absolute; top: -30px; bottom: -30px;
        /* initial position: just off left of headline */
        left: -60px; width: 90px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.25) 20%,
          rgba(255,255,255,0.75) 48%,
          rgba(var(--accent-rgb), 0.35) 72%,
          transparent 100%);
        filter: blur(6px);
        z-index: 3; pointer-events: none;
      }

      /* Horizontal rule that draws in beneath */
      #t1-sec-rmask .rule {
        width: 0; height: 2px; margin: 44px auto 0;
        background: linear-gradient(to right, transparent, var(--accent), transparent);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.55);
      }

      #t1-sec-rmask .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-rmask .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-rmask" data-composition-id="t1-sec-rmask" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">The Core Principle</div>
        <div class="headline-wrap">
          <div class="headline" data-slot="headline">Output Beats <em>Hours Worked</em></div>
          <div class="wipe-beam"></div>
        </div>
        <div class="rule"></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain */
      tl.fromTo("#t1-sec-rmask .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* env */
      tl.from("#t1-sec-rmask .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0);
      tl.from("#t1-sec-rmask .grid",
        { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* kicker fades in */
      tl.from("#t1-sec-rmask .kicker",
        { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.5);

      /* wipe beam starts left-of-frame, sweeps right across headline */
      /* headline clip-path opens in sync with beam so text is revealed by it */
      const headlineEl = "#t1-sec-rmask .headline";
      const beamEl = "#t1-sec-rmask .wipe-beam";

      /* beam travels ~1700px total width across the headline area */
      tl.fromTo(beamEl,
        { x: -60 },
        { x: 1700, duration: 1.05, ease: "power2.inOut" }, 1.0);

      /* clip-path open — left edge stays at 0, right edge goes 100%→0% in sync */
      tl.fromTo(headlineEl,
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 1.05, ease: "power2.inOut" }, 1.0);

      /* rule draws in after reveal */
      tl.to("#t1-sec-rmask .rule",
        { width: 560, duration: 0.55, ease: "power3.out" }, 2.05);

      /* gentle glow settle — headline text-shadow pulses softly (via opacity on an overlay) */
      tl.to(headlineEl,
        { opacity: 0.88, duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8);

      /* slow drift */
      tl.to("#t1-sec-rmask .content",
        { y: -12, duration: 4.0, ease: "sine.inOut" }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-rmask"] = tl;
    </script>
  </body>
</html>
