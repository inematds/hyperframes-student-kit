<!doctype html>
<!--
  KALLAWAY · tier1 · overview · GRID6
  Full-screen takeover. Six small glass tiles in a 3x2 grid, each with a
  short label. Build staggered left-to-right, top-to-bottom.
  Slots: title, i1, i2, i3, i4, i5, i6.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-grid6 {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-grid6 .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-grid6 .grid-bg {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.42;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-grid6 .title-row {
        position: absolute; left: 0; right: 0; top: 84px; text-align: center; z-index: 4;
      }
      #t1-ov-grid6 .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-grid6 .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* 3x2 grid */
      #t1-ov-grid6 .grid-wrap {
        position: absolute; left: 160px; right: 160px; top: 240px; bottom: 80px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 32px; z-index: 4;
      }

      /* Glass tile */
      #t1-ov-grid6 .tile {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; flex-direction: column;
        align-items: flex-start; justify-content: flex-end;
        padding: 40px 48px;
        position: relative; overflow: hidden;
      }
      /* Top hairline */
      #t1-ov-grid6 .tile::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }
      /* Corner number watermark */
      #t1-ov-grid6 .tile-num {
        position: absolute; top: 28px; right: 36px;
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--accent-rgb), 0.30); font-weight: var(--wt-bold);
        letter-spacing: 0.04em;
      }
      /* Tile label — the main content */
      #t1-ov-grid6 .tile-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 36px; letter-spacing: var(--track-snug); line-height: 1.25;
        color: var(--white); text-shadow: var(--textglow);
      }
      /* Small glowing accent line above label */
      #t1-ov-grid6 .tile-rule {
        width: 36px; height: 2px; border-radius: 1px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        margin-bottom: 16px;
      }

      #t1-ov-grid6 .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-grid6 .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-grid6" data-composition-id="t1-ov-grid6" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid-bg"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Six Things <em>You Need to Know</em></div>
      </div>

      <div class="grid-wrap">
        <div class="tile" id="g6-i1">
          <div class="tile-num">01</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i1">Positioning</div>
        </div>
        <div class="tile" id="g6-i2">
          <div class="tile-num">02</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i2">Messaging</div>
        </div>
        <div class="tile" id="g6-i3">
          <div class="tile-num">03</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i3">Distribution</div>
        </div>
        <div class="tile" id="g6-i4">
          <div class="tile-num">04</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i4">Conversion</div>
        </div>
        <div class="tile" id="g6-i5">
          <div class="tile-num">05</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i5">Retention</div>
        </div>
        <div class="tile" id="g6-i6">
          <div class="tile-num">06</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i6">Analytics</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-grid6 .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "88px 66px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-grid6 .bloom",   { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-grid6 .grid-bg", { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title first */
        .from("#t1-ov-grid6 .title",   { autoAlpha: 0, y: 26, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* 6 tiles stagger in — left-to-right, top row then bottom row */
        .from("#g6-i1", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.78, ease: "back.out(1.4)" }, 1.05)
        .from("#g6-i2", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.78, ease: "back.out(1.4)" }, 1.18)
        .from("#g6-i3", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.78, ease: "back.out(1.4)" }, 1.31)
        .from("#g6-i4", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.78, ease: "back.out(1.4)" }, 1.44)
        .from("#g6-i5", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.78, ease: "back.out(1.4)" }, 1.57)
        .from("#g6-i6", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.78, ease: "back.out(1.4)" }, 1.70)

        /* last tile accent rule glow pulse */
        .to("#g6-i6 .tile-rule", { boxShadow: "0 0 16px rgba(55,189,248,0.80)",
          width: "56px", duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        /* slow hold drift */
        .to("#t1-ov-grid6 .grid-wrap", { y: -10, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-grid6"] = tl;
    </script>
  </body>
</html>
