<!doctype html>
<!--
  KALLAWAY · tier1 · section · ASCEND
  Full-screen chapter takeover. Each word of the headline rises individually
  from below with a focus-pull blur that clears as it settles into position,
  stacking into the final headline. The kicker appears first as an anchor.
  Deliberately word-by-word, not letter-by-letter — clean and purposeful.
  Slots: kicker (~20 chars), headline (~40 chars — will be split per word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-ascend {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-ascend .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-ascend .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Layout: centered column */
      #t1-sec-ascend .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        z-index: 4; gap: 0;
        padding-bottom: 40px;
      }

      #t1-sec-ascend .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 52px;
      }

      /* Headline word-stack container */
      #t1-sec-ascend .headline-wrap {
        display: flex; flex-wrap: wrap;
        justify-content: center; align-items: baseline;
        gap: 0 26px;
        max-width: 1400px;
        text-align: center;
        line-height: 1.15;
      }
      #t1-sec-ascend .word {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.10;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        display: inline-block;
        /* each word starts hidden — JS animates each in sequence */
        opacity: 0;
      }
      /* Accent words */
      #t1-sec-ascend .word.accent {
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* A soft glow plate beneath the headline that builds up */
      #t1-sec-ascend .plate {
        position: absolute;
        left: 50%; top: calc(50% + 20px);
        transform: translate(-50%, -50%);
        width: 1400px; height: 180px;
        border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(var(--accent-rgb), 0.12), transparent 70%);
        filter: blur(18px);
        z-index: 3;
        opacity: 0;
      }

      #t1-sec-ascend .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-ascend .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-ascend" data-composition-id="t1-sec-ascend" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="plate" id="t1-sec-ascend-plate"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Section 2 —</div>

        <!-- Headline rendered as individual word spans for staggered ascend.
             The data-slot="headline" is on the wrapper; each .word is the atomic unit. -->
        <div class="headline-wrap" data-slot="headline">
          <span class="word" id="t1-sec-ascend-w0">The</span>
          <span class="word" id="t1-sec-ascend-w1">Art</span>
          <span class="word" id="t1-sec-ascend-w2">of</span>
          <span class="word accent" id="t1-sec-ascend-w3">Teaching</span>
          <span class="word" id="t1-sec-ascend-w4">AI</span>
          <span class="word" id="t1-sec-ascend-w5">to</span>
          <span class="word accent" id="t1-sec-ascend-w6">Think</span>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wordIds = [
        "t1-sec-ascend-w0",
        "t1-sec-ascend-w1",
        "t1-sec-ascend-w2",
        "t1-sec-ascend-w3",
        "t1-sec-ascend-w4",
        "t1-sec-ascend-w5",
        "t1-sec-ascend-w6",
      ];

      /* grain flicker */
      tl.fromTo("#t1-sec-ascend .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "115px 85px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-ascend .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-ascend .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker glides in */
        .from("#t1-sec-ascend .kicker",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.5);

      /* Words ascend one by one — staggered by 0.13s */
      var wordStart = 1.0;
      var wordGap   = 0.14;
      wordIds.forEach(function(id, i) {
        tl.fromTo("#" + id,
          { autoAlpha: 0, y: 60, filter: "blur(18px)" },
          { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "power4.out" },
          wordStart + i * wordGap
        );
      });

      /* Plate fades in once words have settled */
      tl.to("#t1-sec-ascend-plate",
        { autoAlpha: 1, duration: 0.9, ease: "power2.out" }, 2.1)

        /* breathing glow on plate */
        .to("#t1-sec-ascend-plate",
          { opacity: 0.45, scale: 1.08, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.9)

        .set({}, {}, 7);

      window.__timelines["t1-sec-ascend"] = tl;
    </script>
  </body>
</html>
