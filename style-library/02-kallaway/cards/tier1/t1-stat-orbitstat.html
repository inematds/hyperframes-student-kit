<!doctype html>
<!--
  KALLAWAY · tier1 · stat · ORBITSTAT
  The big count-up number is centered on a dark canvas. A glowing SVG ring
  encircles it; a bright satellite dot travels along the ring orbit during
  count-up, then settles into a slow breathing drift. Pure kinetic impact —
  number + ring + orbiting light.
  Slots: kicker, stat (e.g. "2.4M"), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-orbit {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-orbit .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-orbit .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-stat-orbit .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 44px; padding-bottom: 20px;
      }

      #t1-stat-orbit .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* orbit assembly */
      #t1-stat-orbit .orbit-wrap {
        position: relative;
        width: 560px; height: 560px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      /* outer ambient glow halo */
      #t1-stat-orbit .orbit-halo {
        position: absolute; inset: -60px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.14) 0%, transparent 65%);
        box-shadow: 0 0 120px 24px rgba(var(--accent-rgb), 0.16);
      }

      /* SVG ring */
      #t1-stat-orbit .orbit-svg {
        position: absolute; inset: 0;
        width: 560px; height: 560px;
      }

      /* center number */
      #t1-stat-orbit .orbit-center {
        position: relative; z-index: 3;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 4px;
      }

      #t1-stat-orbit .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 140px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 8%, rgba(var(--accent-rgb), 0.82) 88%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.60));
      }

      #t1-stat-orbit .stat-unit {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--text-faint);
      }

      #t1-stat-orbit .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-orbit .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-orbit .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-orbit .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-orbit .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-orbit" data-composition-id="t1-stat-orbit" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">TOTAL MINUTES WATCHED · 2026</div>

        <div class="orbit-wrap">
          <div class="orbit-halo"></div>

          <svg class="orbit-svg" viewBox="0 0 560 560" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- ring gradient: bright arc fades to invisible -->
              <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="rgba(55,189,248,0.05)"/>
                <stop offset="60%"  stop-color="rgba(55,189,248,0.70)"/>
                <stop offset="100%" stop-color="rgba(255,255,255,0.90)"/>
              </linearGradient>
              <!-- glow filter -->
              <filter id="orbitGlow" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- dim track ring -->
            <circle cx="280" cy="280" r="240"
              stroke="rgba(255,255,255,0.07)"
              stroke-width="1.5"
              stroke-dasharray="4 8"
              fill="none"
            />

            <!-- glowing arc — stroke-dashoffset driven by JS for draw-on -->
            <circle id="t1-stat-orbit-arc"
              cx="280" cy="280" r="240"
              stroke="url(#orbitGrad)"
              stroke-width="3"
              stroke-linecap="round"
              fill="none"
              filter="url(#orbitGlow)"
              transform="rotate(-90 280 280)"
            />

            <!-- satellite dot -->
            <circle id="t1-stat-orbit-sat" cx="280" cy="40" r="10"
              fill="#ffffff"
              style="filter: drop-shadow(0 0 12px rgba(55,189,248,1.0)) drop-shadow(0 0 30px rgba(55,189,248,0.60));"
            />
            <!-- satellite trail (smaller dim dot slightly behind) -->
            <circle id="t1-stat-orbit-trail" cx="280" cy="40" r="5"
              fill="rgba(55,189,248,0.40)"
              style="filter: drop-shadow(0 0 8px rgba(55,189,248,0.60));"
            />
          </svg>

          <div class="orbit-center">
            <div class="stat" id="t1-stat-orbit-num" data-slot="stat">0</div>
            <div class="stat-unit">million mins</div>
          </div>
        </div>

        <div class="label" data-slot="label">of AI course content consumed by <em>active learners</em> in a single calendar year</div>
      </div>

      <div class="source" data-slot="source">SOURCE · PLATFORM ENGAGEMENT REPORT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl   = document.getElementById("t1-stat-orbit-num");
      const arcEl   = document.getElementById("t1-stat-orbit-arc");
      const satEl   = document.getElementById("t1-stat-orbit-sat");
      const trailEl = document.getElementById("t1-stat-orbit-trail");
      const target  = 2.4; /* millions — matches placeholder */

      const r    = 240;
      const cx   = 280;
      const cy   = 280;
      const circ = 2 * Math.PI * r;

      /* init arc fully hidden */
      arcEl.style.strokeDasharray  = circ;
      arcEl.style.strokeDashoffset = circ;

      /* compute x,y on the ring for a given progress fraction (0=top, 1=full circle) */
      function ringPos(frac, offset) {
        const angle = frac * 2 * Math.PI - Math.PI / 2 + (offset || 0);
        return {
          cx: cx + r * Math.cos(angle),
          cy: cy + r * Math.sin(angle)
        };
      }

      /* place satellite + trail at their initial position (top) */
      function setSat(frac, trailOffset) {
        const p  = ringPos(frac);
        const pt = ringPos(frac, trailOffset || -0.08);
        satEl.setAttribute("cx",   p.cx);
        satEl.setAttribute("cy",   p.cy);
        trailEl.setAttribute("cx", pt.cx);
        trailEl.setAttribute("cy", pt.cy);
      }
      setSat(0);

      /* grain flicker */
      tl.fromTo("#t1-stat-orbit .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-orbit .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-orbit .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-orbit .kicker",
          { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.45)

        /* orbit halo blooms */
        .from("#t1-stat-orbit .orbit-halo",
          { autoAlpha: 0, scale: 0.5, duration: 1.2, ease: "expo.out" }, 0.60)

        /* track ring fades in */
        .from("#t1-stat-orbit .orbit-svg",
          { autoAlpha: 0, scale: 0.75, transformOrigin: "50% 50%",
            duration: 0.9, ease: "back.out(1.4)" }, 0.70)

        /* center number reveal (no filter — it has drop-shadow) */
        .from("#t1-stat-orbit .orbit-center",
          { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%",
            duration: 0.9, ease: "back.out(1.3)" }, 0.80)

        /* arc draw-on + satellite orbit + count-up — all driven together */
        .to({ val: 0 }, {
          val: 1,   /* fraction 0→1 of full orbit */
          duration: 2.0, ease: "power2.out",
          onUpdate: function() {
            const frac = this.targets()[0].val;
            /* arc */
            arcEl.style.strokeDashoffset = circ * (1 - frac);
            /* satellite position */
            setSat(frac, -0.06);
            /* number: scale 0→target over frac */
            numEl.textContent = (target * frac).toFixed(1);
          }
        }, 0.95)

        /* label */
        .from("#t1-stat-orbit .label",
          { autoAlpha: 0, y: 22, duration: 0.85, ease: "power3.out" }, 2.30)

        /* source */
        .from("#t1-stat-orbit .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.65)

        /* slow continued satellite drift after orbit (finite arc crawl) */
        .to({ val: 1 }, {
          val: 1.08,
          duration: 3.0, ease: "sine.inOut",
          onUpdate: function() {
            const frac = this.targets()[0].val;
            /* clamp arc to full */
            arcEl.style.strokeDashoffset = 0;
            setSat(frac, -0.06);
          }
        }, 3.0)

        /* halo breathing */
        .to("#t1-stat-orbit .orbit-halo",
          { opacity: 0.50, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.1)

        .set({}, {}, 7);

      window.__timelines["t1-stat-orbit"] = tl;
    </script>
  </body>
</html>
