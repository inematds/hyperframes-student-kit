<!doctype html>
<!--
  KALLAWAY · tier1 · section · SPLIT-REVEAL
  Full-screen chapter takeover. The headline is split into two halves — top and
  bottom — that start offset apart (top slides up, bottom slides down) and glide
  together to meet at center in a satisfying lock. As they join, a neon crack of
  light flashes at the seam. The kicker fades in above after the halves are joined.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-srev {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-srev .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-srev .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 55%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 55%, #000 35%, transparent 80%);
      }

      /* ── SPLIT HEADLINE ──────────────────────────────────────────────── */
      /* Clip-wrapper for the top half: overflow:hidden clips at the center seam */
      #t1-sec-srev .split-wrap {
        position: absolute;
        left: 0; right: 0;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
      }
      /* The shared headline text — rendered twice (top/bottom halves) */
      #t1-sec-srev .half-top-clip {
        position: absolute;
        left: 0; right: 0;
        /* clip to upper half of the text block */
        height: 140px;
        bottom: 0; /* anchor bottom of clip at the seam */
        overflow: hidden;
      }
      #t1-sec-srev .half-bottom-clip {
        position: absolute;
        left: 0; right: 0;
        top: 0;
        height: 140px;
        overflow: hidden;
      }

      /* Container that holds both halves at the seam-center */
      #t1-sec-srev .seam-center {
        position: absolute;
        left: 0; right: 0;
        top: 50%;
        margin-top: -140px; /* half total text height */
        height: 280px;
        z-index: 3;
      }

      /* The headline text block, shown in both clips */
      #t1-sec-srev .hl-text {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 100px; line-height: 1.15;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center;
        width: 100%; position: absolute;
      }
      /* top half — text positioned so the bottom half shows through top clip */
      #t1-sec-srev .hl-top {
        top: 0;
        -webkit-clip-path: inset(0 0 50% 0);
                clip-path: inset(0 0 50% 0);
      }
      /* bottom half */
      #t1-sec-srev .hl-bottom {
        top: 0;
        -webkit-clip-path: inset(50% 0 0 0);
                clip-path: inset(50% 0 0 0);
      }
      #t1-sec-srev .hl-text em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Seam flash — a thin bright line that fires when the halves meet */
      #t1-sec-srev .seam-flash {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 1400px; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.0) 10%,
          rgba(255,255,255,0.90) 35%,
          rgba(var(--accent-rgb), 1.0) 50%,
          rgba(255,255,255,0.90) 65%,
          rgba(var(--accent-rgb), 0.0) 90%,
          transparent 100%);
        box-shadow:
          0 0 16px 4px rgba(var(--accent-rgb), 0.80),
          0 0 40px 12px rgba(var(--accent-rgb), 0.40);
        z-index: 5;
        opacity: 0;
      }

      /* ── KICKER ─────────────────────────────────────────────────────── */
      #t1-sec-srev .kicker {
        position: absolute;
        left: 0; right: 0;
        /* sits above the headline center; adjusted after seam-center placement */
        top: calc(50% - 240px);
        text-align: center; z-index: 4;
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
      }

      /* Vignette + grain */
      #t1-sec-srev .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-srev .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-srev" data-composition-id="t1-sec-srev" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="kicker" data-slot="kicker">— Section 2 —</div>

      <!-- Top half of headline -->
      <div class="hl-top hl-text" data-slot="headline">The <em>Hidden Cost</em> of<br>Getting AI Wrong</div>
      <!-- Bottom half of same headline -->
      <div class="hl-bottom hl-text">The <em>Hidden Cost</em> of<br>Getting AI Wrong</div>

      <!-- Seam flash overlay -->
      <div class="seam-flash"></div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-srev .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-srev .bloom",
            { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-srev .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Both halves start far apart (top slides in from above, bottom from below)
         and glide toward center */
      tl.from("#t1-sec-srev .hl-top",
            { autoAlpha: 0, y: -120, duration: 0.85, ease: "power4.out" }, 0.35);
      tl.from("#t1-sec-srev .hl-bottom",
            { autoAlpha: 0, y:  120, duration: 0.85, ease: "power4.out" }, 0.35);

      /* Seam flash fires as they lock together */
      tl.to("#t1-sec-srev .seam-flash",
            { autoAlpha: 1, duration: 0.08, ease: "none" }, 1.15);
      tl.to("#t1-sec-srev .seam-flash",
            { autoAlpha: 0, duration: 0.50, ease: "power2.out" }, 1.23);

      /* Glow on both halves intensifies at the moment of joining */
      tl.to(["#t1-sec-srev .hl-top", "#t1-sec-srev .hl-bottom"],
            { textShadow: "0 0 30px rgba(255,255,255,0.65), 0 0 70px rgba(var(--accent-rgb),0.50)",
              duration: 0.25, ease: "power2.out" }, 1.15);
      tl.to(["#t1-sec-srev .hl-top", "#t1-sec-srev .hl-bottom"],
            { textShadow: "0 0 18px rgba(255,255,255,0.45), 0 0 40px rgba(var(--accent-rgb),0.30)",
              duration: 0.8, ease: "power2.inOut" }, 1.40);

      /* Kicker fades in above the joined headline */
      tl.from("#t1-sec-srev .kicker",
            { autoAlpha: 0, y: 14, filter: "blur(8px)", duration: 0.65, ease: "power3.out" }, 1.50);

      /* Subtle glow breathing after reveal */
      tl.to("#t1-sec-srev .seam-flash",
            { autoAlpha: 0.18, duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4);

      /* Slow bloom drift */
      tl.to("#t1-sec-srev .bloom",
            { scale: 1.08, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-srev"] = tl;
    </script>
  </body>
</html>
