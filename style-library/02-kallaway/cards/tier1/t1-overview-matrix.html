<!doctype html>
<!--
  KALLAWAY · tier1 · overview · 2×2 QUADRANT MATRIX
  Full-screen takeover. Glowing x/y axes draw in; four quadrant labels; a
  named item appears in each quadrant with a glowing dot.
  Slots: title, x_lo (left x-axis label), x_hi (right), y_lo (bottom), y_hi (top),
         q_tl (top-left item), q_tr (top-right item), q_bl (bottom-left), q_br (bottom-right).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-matrix {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Ambience */
      #t1-ov-matrix .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-matrix .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.38;
        -webkit-mask-image: radial-gradient(120% 110% at 50% 50%, #000 28%, transparent 72%);
                mask-image: radial-gradient(120% 110% at 50% 50%, #000 28%, transparent 72%);
      }

      /* Title */
      #t1-ov-matrix .title-row {
        position: absolute; left: 0; right: 0; top: 60px; text-align: center; z-index: 4;
      }
      #t1-ov-matrix .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-matrix .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Matrix canvas */
      #t1-ov-matrix .matrix-wrap {
        position: absolute;
        left: 240px; right: 240px; top: 185px; bottom: 100px;
        z-index: 4;
      }

      /* SVG axes drawn by GSAP */
      #t1-ov-matrix .axes-svg {
        position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
        pointer-events: none; z-index: 2;
      }
      #t1-ov-matrix .axis-line {
        stroke: rgba(var(--accent-rgb), 0.55);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.40));
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
      }
      /* Tick marks */
      #t1-ov-matrix .tick {
        stroke: rgba(var(--accent-rgb), 0.35);
        stroke-width: 1;
      }

      /* Axis labels */
      #t1-ov-matrix .axis-label {
        position: absolute;
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }
      #t1-ov-matrix .lbl-x-lo { bottom: -60px; left: 0; }
      #t1-ov-matrix .lbl-x-hi { bottom: -60px; right: 0; text-align: right; }
      #t1-ov-matrix .lbl-y-lo {
        left: -200px; bottom: 0;
        writing-mode: vertical-rl; transform: rotate(180deg);
        text-align: left;
      }
      #t1-ov-matrix .lbl-y-hi {
        left: -200px; top: 0;
        writing-mode: vertical-rl; transform: rotate(180deg);
        text-align: right;
      }

      /* Quadrant items */
      #t1-ov-matrix .q-item {
        position: absolute;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      #t1-ov-matrix .q-dot {
        width: 18px; height: 18px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 20px rgba(var(--accent-rgb),0.70), 0 0 50px rgba(var(--accent-rgb),0.30);
        flex-shrink: 0;
      }
      #t1-ov-matrix .q-item.alt .q-dot {
        background: var(--accent-2);
        box-shadow: 0 0 20px rgba(var(--accent2-rgb),0.70), 0 0 50px rgba(var(--accent2-rgb),0.30);
      }
      #t1-ov-matrix .q-chip {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 16px 30px;
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: 26px; color: var(--text); text-align: center;
        position: relative; overflow: hidden;
        box-shadow: var(--glass-shadow);
      }
      #t1-ov-matrix .q-chip::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }

      /* Quadrant position helpers — percentages within .matrix-wrap */
      /* TL: x in 20-44%, y in 12-40% */
      #t1-ov-matrix .q-tl { left: 10%;  top: 10%;  }
      /* TR: x 56-78%, y 12-40% */
      #t1-ov-matrix .q-tr { right: 8%;  top: 10%;  align-items: flex-end; }
      /* BL: x 10-44%, y 58-82% */
      #t1-ov-matrix .q-bl { left: 10%;  bottom: 16%; }
      /* BR: x 56-78%, y 58-82% */
      #t1-ov-matrix .q-br { right: 8%;  bottom: 16%; align-items: flex-end; }

      /* Quadrant dim backgrounds */
      #t1-ov-matrix .q-bg {
        position: absolute; border-radius: var(--radius);
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
      }
      #t1-ov-matrix .q-bg-tl { left: 0;   top: 0;   width: 48%; height: 48%; }
      #t1-ov-matrix .q-bg-tr { right: 0;  top: 0;   width: 48%; height: 48%; }
      #t1-ov-matrix .q-bg-bl { left: 0;   bottom: 0; width: 48%; height: 48%; }
      #t1-ov-matrix .q-bg-br { right: 0;  bottom: 0; width: 48%; height: 48%; }

      #t1-ov-matrix .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-matrix .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-matrix" data-composition-id="t1-ov-matrix" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Positioning the <em>Options</em></div>
      </div>

      <div class="matrix-wrap" id="mat-wrap">
        <!-- Quadrant backgrounds -->
        <div class="q-bg q-bg-tl"></div>
        <div class="q-bg q-bg-tr"></div>
        <div class="q-bg q-bg-bl"></div>
        <div class="q-bg q-bg-br"></div>

        <!-- SVG axes -->
        <svg class="axes-svg" viewBox="0 0 1440 780" preserveAspectRatio="none">
          <!-- Horizontal axis -->
          <line class="axis-line" id="ax-x" x1="0" y1="390" x2="1440" y2="390"/>
          <!-- Vertical axis -->
          <line class="axis-line" id="ax-y" x1="720" y1="0" x2="720" y2="780"/>
          <!-- Arrow heads -->
          <polygon points="1440,390 1418,378 1418,402" fill="rgba(55,189,248,0.55)" filter="drop-shadow(0 0 6px rgba(55,189,248,0.5))"/>
          <polygon points="720,0 708,22 732,22" fill="rgba(55,189,248,0.55)" filter="drop-shadow(0 0 6px rgba(55,189,248,0.5))"/>
        </svg>

        <!-- Axis labels -->
        <div class="axis-label lbl-x-lo" data-slot="x_lo">Low Risk</div>
        <div class="axis-label lbl-x-hi" data-slot="x_hi">High Risk</div>
        <div class="axis-label lbl-y-lo" data-slot="y_lo">Low Return</div>
        <div class="axis-label lbl-y-hi" data-slot="y_hi">High Return</div>

        <!-- Quadrant items -->
        <div class="q-item q-tl" id="mat-q-tl">
          <div class="q-dot"></div>
          <div class="q-chip" data-slot="q_tl">Index Funds</div>
        </div>
        <div class="q-item q-tr alt" id="mat-q-tr">
          <div class="q-dot"></div>
          <div class="q-chip" data-slot="q_tr">Venture Bets</div>
        </div>
        <div class="q-item q-bl" id="mat-q-bl">
          <div class="q-dot"></div>
          <div class="q-chip" data-slot="q_bl">Savings Account</div>
        </div>
        <div class="q-item q-br" id="mat-q-br">
          <div class="q-dot"></div>
          <div class="q-chip" data-slot="q_br">Penny Stocks</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-matrix .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "95px 75px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-matrix .bloom",   { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-matrix .grid",    { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-matrix .title",   { autoAlpha: 0, y: 24, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* quadrant bg tiles */
        .from("#t1-ov-matrix .q-bg",    { autoAlpha: 0, duration: 0.8, ease: "power2.out", stagger: 0.08 }, 0.9)

        /* axes draw in */
        .to("#ax-x",                    { strokeDashoffset: 0, duration: 0.85, ease: "power3.out" }, 1.1)
        .to("#ax-y",                    { strokeDashoffset: 0, duration: 0.85, ease: "power3.out" }, 1.2)

        /* axis labels fade in */
        .from("#t1-ov-matrix .axis-label", { autoAlpha: 0, duration: 0.6, ease: "power2.out", stagger: 0.1 }, 1.85)

        /* quadrant items bloom in stagger */
        .from("#mat-q-tl",              { autoAlpha: 0, scale: 0.7, filter: "blur(10px)", duration: 0.65, ease: "back.out(1.7)" }, 2.0)
        .from("#mat-q-br",              { autoAlpha: 0, scale: 0.7, filter: "blur(10px)", duration: 0.65, ease: "back.out(1.7)" }, 2.15)
        .from("#mat-q-tr",              { autoAlpha: 0, scale: 0.7, filter: "blur(10px)", duration: 0.65, ease: "back.out(1.7)" }, 2.30)
        .from("#mat-q-bl",              { autoAlpha: 0, scale: 0.7, filter: "blur(10px)", duration: 0.65, ease: "back.out(1.7)" }, 2.45)

        /* dot glow pulses — finite */
        .to("#t1-ov-matrix .q-dot",     { boxShadow: "0 0 30px rgba(55,189,248,0.90), 0 0 70px rgba(55,189,248,0.40)", duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 3.0)

        /* slow drift hold */
        .to("#mat-wrap",                { y: -8, duration: 5.0, ease: "sine.inOut" }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-ov-matrix"] = tl;
    </script>
  </body>
</html>
