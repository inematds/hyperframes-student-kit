<!doctype html>
<!--
  KALLAWAY · tier1 · stat · RATIO
  A glowing "X : Y" ratio displayed full-screen. Both sides scale in from
  opposite directions; the glowing colon separator pulses in last. Pure
  typographic impact — no ring or bar, just the confrontation of two numbers.
  Slots: kicker, stat (e.g. "3 : 1" — drives display copy), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-ratio {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-ratio .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* corner bloom — accent on the upper right */
      #t1-stat-ratio .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner); z-index: 1;
      }
      #t1-stat-ratio .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-stat-ratio .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 48px;
      }

      #t1-stat-ratio .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* ratio row */
      #t1-stat-ratio .ratio-row {
        display: flex; align-items: center; gap: 0;
        line-height: 1;
      }

      /* each side of the ratio */
      #t1-stat-ratio .ratio-side {
        display: flex; flex-direction: column; align-items: center;
        gap: 12px;
      }

      #t1-stat-ratio .ratio-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        letter-spacing: var(--track-tight);
        line-height: 1;
      }
      /* left side: pure white, extra large */
      #t1-stat-ratio .ratio-left .ratio-num {
        font-size: 260px;
        background: linear-gradient(155deg, #ffffff 0%, rgba(255,255,255,0.75) 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 40px rgba(255,255,255,0.30));
      }
      /* right side: accent-tinted, slightly smaller */
      #t1-stat-ratio .ratio-right .ratio-num {
        font-size: 180px;
        background: linear-gradient(155deg, rgba(var(--accent-rgb),0.95) 0%, rgba(255,255,255,0.55) 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-ratio .ratio-side-label {
        font-family: var(--font-mono);
        font-size: var(--size-tiny);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--text-faint);
      }

      /* the glowing colon */
      #t1-stat-ratio .ratio-colon {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 200px;
        line-height: 1;
        color: var(--accent);
        text-shadow: var(--textglow-accent),
                     0 0 80px rgba(var(--accent-rgb), 0.60),
                     0 0 160px rgba(var(--accent-rgb), 0.30);
        padding: 0 36px;
        padding-bottom: 48px; /* optical baseline alignment */
      }

      /* dividing hairlines flanking the colon */
      #t1-stat-ratio .rule {
        width: 2px; height: 200px;
        background: linear-gradient(to bottom, transparent, rgba(var(--accent-rgb), 0.5), transparent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.4);
        align-self: center;
      }

      #t1-stat-ratio .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
      }
      #t1-stat-ratio .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-ratio .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-ratio .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-ratio .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-ratio" data-composition-id="t1-stat-ratio" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">REVENUE PER STUDENT</div>

        <div class="ratio-row">
          <div class="ratio-side ratio-left">
            <div class="ratio-num" id="t1-stat-ratio-lhs">3</div>
            <div class="ratio-side-label">retained</div>
          </div>

          <div class="rule"></div>
          <div class="ratio-colon">:</div>
          <div class="rule"></div>

          <div class="ratio-side ratio-right">
            <div class="ratio-num" id="t1-stat-ratio-rhs">1</div>
            <div class="ratio-side-label">churned</div>
          </div>
        </div>

        <!-- stat slot (hidden); JS reads the ratio from it -->
        <div style="display:none" data-slot="stat" id="t1-stat-ratio-val">3 : 1</div>

        <div class="label" data-slot="label">for every student who drops, <em>three complete</em> and upgrade to the advanced track</div>
      </div>

      <div class="source" data-slot="source">SOURCE · LMS COHORT DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* parse ratio from slot "X : Y" */
      const rawStat  = document.getElementById("t1-stat-ratio-val").textContent.trim();
      const rParts   = rawStat.split(":").map(s => parseInt(s.trim(), 10));
      const lhsVal   = isNaN(rParts[0]) ? 3 : rParts[0];
      const rhsVal   = isNaN(rParts[1]) ? 1 : rParts[1];
      const lhsEl    = document.getElementById("t1-stat-ratio-lhs");
      const rhsEl    = document.getElementById("t1-stat-ratio-rhs");

      /* init to 0 */
      lhsEl.textContent = "0";
      rhsEl.textContent = "0";

      /* grain flicker */
      tl.fromTo("#t1-stat-ratio .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom */
      tl.from("#t1-stat-ratio .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-ratio .bloom-corner",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.1)
        .from("#t1-stat-ratio .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-ratio .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.45)

        /* left number swoops in from left */
        .from("#t1-stat-ratio .ratio-left",
          { autoAlpha: 0, x: -120, duration: 0.9, ease: "power4.out" }, 0.65)

        /* right number swoops in from right */
        .from("#t1-stat-ratio .ratio-right",
          { autoAlpha: 0, x: 80, duration: 0.9, ease: "power4.out" }, 0.65)

        /* rules draw in */
        .from("#t1-stat-ratio .rule",
          { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 50%",
            duration: 0.5, ease: "power2.out", stagger: 0.1 }, 0.90)

        /* colon pops in with spring */
        .from("#t1-stat-ratio .ratio-colon",
          { autoAlpha: 0, scale: 0.3, duration: 0.6, ease: "back.out(1.8)" }, 1.05)

        /* count-up both sides simultaneously */
        .to({ val: 0 }, {
          val: lhsVal, duration: 1.2, ease: "power2.out",
          onUpdate: function() { lhsEl.textContent = Math.round(this.targets()[0].val); }
        }, 0.70)
        .to({ val: 0 }, {
          val: rhsVal, duration: 0.9, ease: "power2.out",
          onUpdate: function() { rhsEl.textContent = Math.round(this.targets()[0].val); }
        }, 0.70)

        /* label */
        .from("#t1-stat-ratio .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.0)

        /* source */
        .from("#t1-stat-ratio .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.35)

        /* colon glow pulse */
        .to("#t1-stat-ratio .ratio-colon",
          { opacity: 0.40, duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-ratio"] = tl;
    </script>
  </body>
</html>
