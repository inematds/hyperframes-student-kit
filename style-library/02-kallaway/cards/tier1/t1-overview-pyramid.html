<!doctype html>
<!--
  KALLAWAY · tier1 · overview · PYRAMID
  Full-screen takeover. Three stacked glass tiers building bottom-to-top —
  the classic hierarchy pyramid. Widest slab at bottom, narrowest at top (apex
  gets the accent glow). Side labels glide in flanking the pyramid. Each tier
  has a tag + label. Builds bottom→top.
  Slots: title, tier1_tag, tier1 (bottom, widest), tier2_tag, tier2, tier3_tag, tier3 (top, apex).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-pyr {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-pyr .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-pyr .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(110% 100% at 50% 65%, #000 28%, transparent 78%);
                mask-image: radial-gradient(110% 100% at 50% 65%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-pyr .card-title {
        position: absolute; left: 0; right: 0; top: 62px; z-index: 4;
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow); line-height: 1.1;
      }
      #t1-ov-pyr .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Center pyramid stack — absolute centered */
      #t1-ov-pyr .pyramid {
        position: absolute; z-index: 4;
        left: 50%; top: 50%;
        transform: translate(-50%, -40%);
        display: flex; flex-direction: column; align-items: center;
        gap: 12px;
      }

      /* Tier slab — glass block */
      #t1-ov-pyr .tier {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow);
        display: flex; align-items: center;
        position: relative; overflow: hidden;
        padding: 0 48px; height: 160px;
      }
      /* Top hairline highlight */
      #t1-ov-pyr .tier::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }

      /* Pyramid sizing — t3 (apex/top) narrowest, t1 (base) widest */
      #t1-ov-pyr #pyr-t3 {
        width: 480px; height: 148px;
        border-color: rgba(var(--accent-rgb), 0.55);
        box-shadow: var(--glass-shadow), 0 0 60px rgba(var(--accent-rgb), 0.28);
      }
      #t1-ov-pyr #pyr-t2 { width: 680px; height: 160px; }
      #t1-ov-pyr #pyr-t1 { width: 880px; height: 172px; }

      /* Tier tag */
      #t1-ov-pyr .tier-tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        color: rgba(var(--accent-rgb), 0.70);
        text-transform: uppercase; margin-right: 30px; flex-shrink: 0;
        min-width: 80px;
      }
      #t1-ov-pyr #pyr-t3 .tier-tag {
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Tier label */
      #t1-ov-pyr .tier-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 38px; letter-spacing: var(--track-snug); line-height: 1.2;
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-ov-pyr #pyr-t3 .tier-label {
        font-weight: var(--wt-bold); font-size: 42px;
      }

      #t1-ov-pyr .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-pyr .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-pyr" data-composition-id="t1-ov-pyr" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="card-title" data-slot="title">The <em>Mastery</em> Hierarchy</div>

      <!-- Pyramid: T3 (apex) first in DOM → stagger bottom-to-top via tl positions -->
      <div class="pyramid">
        <!-- Tier 3 — top / apex -->
        <div class="tier" id="pyr-t3">
          <div class="tier-tag" data-slot="tier3_tag">Tier 3</div>
          <div class="tier-label" data-slot="tier3">Strategic Leader</div>
        </div>
        <!-- Tier 2 — middle -->
        <div class="tier" id="pyr-t2">
          <div class="tier-tag" data-slot="tier2_tag">Tier 2</div>
          <div class="tier-label" data-slot="tier2">Skilled Practitioner</div>
        </div>
        <!-- Tier 1 — base -->
        <div class="tier" id="pyr-t1">
          <div class="tier-tag" data-slot="tier1_tag">Tier 1</div>
          <div class="tier-label" data-slot="tier1">Curious Beginner</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-pyr .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "95px 75px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-pyr .bloom", { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-pyr .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-pyr .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.48)

        /* blocks spring in — bottom-to-top */
        .from("#pyr-t1", { autoAlpha: 0, y: 52, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 0.68)
        .from("#pyr-t2", { autoAlpha: 0, y: 44, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 0.86)
        .from("#pyr-t3", { autoAlpha: 0, y: 36, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.04)

        /* apex glow pulse */
        .to("#pyr-t3", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 90px rgba(55,189,248,0.42)",
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4)

        /* slow upward drift */
        .to("#t1-ov-pyr .pyramid", { y: -14, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-pyr"] = tl;
    </script>
  </body>
</html>
