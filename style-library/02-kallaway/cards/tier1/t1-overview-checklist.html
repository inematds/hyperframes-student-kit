<!doctype html>
<!--
  KALLAWAY · tier1 · overview · CHECKLIST
  A checklist with glowing checkmark icons that tick on as each row appears.
  Aurora canvas, bloom, glass rows, staggered build-in with SVG check draw.
  Slots: title, i1, i2, i3, i4.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-check {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }

      #t1-ov-check .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-check .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      #t1-ov-check .layout {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column;
        padding: 90px var(--pad) 80px;
      }

      /* Title */
      #t1-ov-check .card-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 60px; line-height: 1.1;
      }
      #t1-ov-check .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Rows */
      #t1-ov-check .rows {
        display: flex; flex-direction: column; gap: 24px; flex: 1;
      }

      #t1-ov-check .row {
        display: flex; align-items: center; gap: 36px;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        padding: 34px 52px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow),
                    inset 0 1px 0 var(--glass-hi);
      }

      /* Checkmark circle */
      #t1-ov-check .check-wrap {
        width: 72px; height: 72px; flex-shrink: 0;
        border-radius: 50%;
        border: 2px solid rgba(var(--accent-rgb), 0.55);
        background: rgba(var(--accent-rgb), 0.10);
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.25),
                    inset 0 0 12px rgba(var(--accent-rgb), 0.15);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      /* SVG checkmark drawn via stroke-dashoffset animation */
      #t1-ov-check .check-wrap svg {
        width: 36px; height: 36px; overflow: visible;
      }
      #t1-ov-check .check-wrap svg path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* initial hidden state set by GSAP */
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.80));
      }

      /* Row text */
      #t1-ov-check .row-text {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 36px; color: var(--white);
        letter-spacing: var(--track-snug); line-height: 1.2;
      }

      #t1-ov-check .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-check .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-check" data-composition-id="t1-ov-check" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <div class="card-title" data-slot="title">The <em>Complete</em> Pre-Launch Checklist</div>

        <div class="rows">
          <div class="row" id="chk-row-1">
            <div class="check-wrap">
              <svg viewBox="0 0 36 36"><path id="chk-path-1" d="M6 18 L15 27 L30 10" /></svg>
            </div>
            <div class="row-text" data-slot="i1">Thumbnail tested against 3 competing videos</div>
          </div>

          <div class="row" id="chk-row-2">
            <div class="check-wrap">
              <svg viewBox="0 0 36 36"><path id="chk-path-2" d="M6 18 L15 27 L30 10" /></svg>
            </div>
            <div class="row-text" data-slot="i2">Title front-loaded with the core keyword phrase</div>
          </div>

          <div class="row" id="chk-row-3">
            <div class="check-wrap">
              <svg viewBox="0 0 36 36"><path id="chk-path-3" d="M6 18 L15 27 L30 10" /></svg>
            </div>
            <div class="row-text" data-slot="i3">First 30 seconds re-edited for retention hook</div>
          </div>

          <div class="row" id="chk-row-4">
            <div class="check-wrap">
              <svg viewBox="0 0 36 36"><path id="chk-path-4" d="M6 18 L15 27 L30 10" /></svg>
            </div>
            <div class="row-text" data-slot="i4">End screen CTA linked to a companion video</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-check .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-ov-check .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-check .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-check .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.5);

      /* each row: glass springs in, then checkmark draws */
      const rows    = [1, 2, 3, 4];
      const offsets = [0.9, 1.08, 1.26, 1.44];

      rows.forEach((n, i) => {
        const t = offsets[i];
        tl.from(`#chk-row-${n}`, { autoAlpha: 0, y: 38, x: -16, filter: "blur(8px)", duration: 0.7, ease: "back.out(1.3)" }, t)
          /* check circle glow pulse on enter */
          .to(`#chk-row-${n} .check-wrap`, {
            boxShadow: "0 0 30px rgba(55,189,248,0.55), inset 0 0 18px rgba(55,189,248,0.25)",
            duration: 0.35, ease: "power2.out" }, t + 0.2)
          /* stroke draws in */
          .to(`#chk-path-${n}`, { strokeDashoffset: 0, duration: 0.38, ease: "power3.out" }, t + 0.28);
      });

      /* breathing bloom glow hold */
      tl.to("#t1-ov-check .bloom", { opacity: 0.75, duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)
        .set({}, {}, 7);

      window.__timelines["t1-ov-check"] = tl;
    </script>
  </body>
</html>
