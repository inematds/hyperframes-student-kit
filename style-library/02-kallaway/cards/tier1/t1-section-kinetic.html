<!doctype html>
<!--
  KALLAWAY · tier1 · section · KINETIC
  Pure kinetic typography takeover. Each word of the headline enters from a
  different direction/scale, tracking dramatically into its final position with
  big scale and motion — reads as a single composed thought once settled.
  No kicker slot. One slot: headline (multi-word, e.g. "The Future Is Adaptive").
  Slots: headline (multi-word, displayed word by word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-kin {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }

      /* Subtle bloom — title is the hero, background recedes */
      #t1-sec-kin .bloom {
        position: absolute; inset: 0;
        background: radial-gradient(90% 70% at 50% 60%,
          rgba(var(--accent-rgb), 0.18) 0%,
          rgba(var(--accent-rgb), 0.06) 45%,
          transparent 68%);
        z-index: 1;
      }

      #t1-sec-kin .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.32;
      }

      /* Kinetic word container */
      #t1-sec-kin .kin-stage {
        position: relative; z-index: 4;
        text-align: center;
        width: 1680px;
        /* words stack in a flexible wrap */
        display: flex; flex-wrap: wrap;
        align-items: baseline; justify-content: center;
        gap: 0 28px;
      }

      #t1-sec-kin .word {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 150px; line-height: 1.0;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        display: block;
        /* will-change enables smooth composited transforms */
        will-change: transform, opacity;
      }

      /* accent word — third word gets the blue glow treatment */
      #t1-sec-kin .word.accent {
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        /* gradient fill for the accent word */
        background: linear-gradient(135deg, #ffffff 0%, var(--accent) 55%, #a8e6ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        /* Note: no filter tween on this element — uses autoAlpha+scale+y only */
      }

      /* Thin accent rule below the composition */
      #t1-sec-kin .rule {
        position: absolute; bottom: 320px; left: 50%; transform: translateX(-50%);
        width: 0; height: 2px; border-radius: 1px;
        background: linear-gradient(to right, transparent, var(--accent), transparent);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.55);
        z-index: 4;
      }

      #t1-sec-kin .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-kin .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-kin" data-composition-id="t1-sec-kin" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Each word is individually animated. data-slot on the container. -->
      <div class="kin-stage" data-slot="headline">
        <span class="word" id="t1-sec-kin-w1">The</span>
        <span class="word" id="t1-sec-kin-w2">Future</span>
        <span class="word accent" id="t1-sec-kin-w3">Is</span>
        <span class="word" id="t1-sec-kin-w4">Adaptive</span>
      </div>

      <div class="rule" id="t1-sec-kin-rule"></div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain */
      tl.fromTo("#t1-sec-kin .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom */
      tl.from("#t1-sec-kin .bloom",
        { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0);

      /* word 1: "The" — slams in large from left, shrinks to final size */
      tl.from("#t1-sec-kin-w1",
        { autoAlpha: 0, x: -220, scale: 1.8, transformOrigin: "0% 50%",
          duration: 0.7, ease: "power4.out" }, 0.2);

      /* word 2: "Future" — rockets in from below, settles */
      tl.from("#t1-sec-kin-w2",
        { autoAlpha: 0, y: 180, scale: 1.4, transformOrigin: "50% 100%",
          duration: 0.75, ease: "expo.out" }, 0.42);

      /* word 3: "Is" (accent) — scales from enormous center, no blur (gradient clip) */
      tl.from("#t1-sec-kin-w3",
        { autoAlpha: 0, scale: 3.2, transformOrigin: "50% 50%",
          duration: 0.65, ease: "power4.out" }, 0.62);

      /* word 4: "Adaptive" — drifts in from right with tracking compression */
      tl.from("#t1-sec-kin-w4",
        { autoAlpha: 0, x: 280, scale: 0.72, transformOrigin: "100% 50%",
          letterSpacing: "0.22em",
          duration: 0.85, ease: "power4.out" }, 0.80);

      /* rule draws across under the words */
      tl.to("#t1-sec-kin-rule",
        { width: 680, duration: 0.6, ease: "power3.out" }, 1.55);

      /* subtle hold drift — words breathe very gently */
      tl.to("#t1-sec-kin .kin-stage",
        { y: -10, duration: 4.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-kin"] = tl;
    </script>
  </body>
</html>
