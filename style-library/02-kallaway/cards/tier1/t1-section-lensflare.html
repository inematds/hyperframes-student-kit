<!doctype html>
<!--
  KALLAWAY · tier1 · section · LENS FLARE
  Full-screen takeover. An anamorphic LENS-FLARE streak — a horizontal bright
  glow line with a bloom core — sweeps in from the left, peaks at centre, and
  settles behind the headline. The headline then focus-pulls into clarity.
  Kicker sits small and centred above.
  Slots: kicker (~16 chars), headline (~52 chars, <em> accent word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-flare {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-flare .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-flare .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.35;
        -webkit-mask-image: radial-gradient(140% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(140% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── Lens flare system ─────────────────────────────────────────────── */
      /* Flare layer lives between grid (z:1) and content (z:4) */
      #t1-sec-flare .flare-layer {
        position: absolute; left: 0; right: 0; z-index: 2;
        top: calc(50% + 30px); /* sits just below headline vertical center */
        height: 160px;
        transform: translateY(-50%);
        pointer-events: none;
      }

      /* Main horizontal streak — the anamorphic bar */
      #t1-sec-flare .streak {
        position: absolute; left: -120px; right: -120px; top: 50%;
        transform: translateY(-50%);
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.15) 8%,
          rgba(var(--accent-rgb), 0.70) 30%,
          rgba(255,255,255,0.95) 50%,
          rgba(var(--accent-rgb), 0.70) 70%,
          rgba(var(--accent-rgb), 0.15) 92%,
          transparent 100%
        );
        box-shadow:
          0 0 6px 2px rgba(255,255,255,0.60),
          0 0 28px 6px rgba(var(--accent-rgb), 0.55),
          0 0 90px 18px rgba(var(--accent-rgb), 0.20);
      }
      /* Wide soft aura above/below the streak */
      #t1-sec-flare .streak-aura {
        position: absolute; left: 200px; right: 200px; top: 50%;
        transform: translateY(-50%);
        height: 120px;
        background: radial-gradient(
          50% 100% at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 80%
        );
        filter: blur(18px);
      }
      /* Bloom core (the "hotspot") — pinned at horizontal center */
      #t1-sec-flare .flare-core {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 140px; height: 140px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(255,255,255,0.96) 0%,
          rgba(var(--accent-rgb), 0.80) 18%,
          rgba(var(--accent-rgb), 0.22) 50%,
          transparent 70%);
        box-shadow: 0 0 60px 10px rgba(var(--accent-rgb), 0.45);
      }
      /* Satellite rings — typical anamorphic artefact dots */
      #t1-sec-flare .flare-ring-1 {
        position: absolute; left: calc(50% - 180px); top: 50%;
        transform: translate(-50%, -50%);
        width: 28px; height: 28px; border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.50);
      }
      #t1-sec-flare .flare-ring-2 {
        position: absolute; left: calc(50% + 260px); top: 50%;
        transform: translate(-50%, -50%);
        width: 18px; height: 18px; border-radius: 50%;
        background: rgba(255,255,255,0.60);
        box-shadow: 0 0 12px rgba(255,255,255,0.45);
      }
      #t1-sec-flare .flare-ring-3 {
        position: absolute; left: calc(50% - 400px); top: 50%;
        transform: translate(-50%, -50%);
        width: 12px; height: 12px; border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.40);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.40);
      }

      /* ── Content ────────────────────────────────────────────────────────── */
      #t1-sec-flare .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-flare .kicker {
        font-family: var(--font-display); font-weight: var(--wt-semi); font-style: italic;
        font-size: var(--size-label); letter-spacing: 0.20em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 28px;
      }
      #t1-sec-flare .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.05; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1340px; padding: 0 80px;
      }
      #t1-sec-flare .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* ── Global chrome ────────────────────────────────────────────────── */
      #t1-sec-flare .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-flare .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-flare"
         data-composition-id="t1-sec-flare"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Flare layer -->
      <div class="flare-layer">
        <div class="streak-aura"></div>
        <div class="streak"></div>
        <div class="flare-core"></div>
        <div class="flare-ring-1"></div>
        <div class="flare-ring-2"></div>
        <div class="flare-ring-3"></div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="kicker" data-slot="kicker">Part One</div>
        <div class="headline" data-slot="headline">Intelligence That <em>Sees</em> Beyond the Data</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-flare .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-flare .bloom",
        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      tl.from("#t1-sec-flare .grid",
        { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* streak sweeps in from left to center — scaleX + translateX trick:
         start clipped to left edge, expand rightward */
      tl.from("#t1-sec-flare .streak",
        { clipPath: "inset(0 100% 0 0)", duration: 0.70, ease: "expo.out" }, 0.25);

      /* aura blooms after streak is placed */
      tl.from("#t1-sec-flare .streak-aura",
        { autoAlpha: 0, scaleX: 0.4, duration: 0.80, ease: "power3.out" }, 0.55);

      /* core pops in */
      tl.from("#t1-sec-flare .flare-core",
        { autoAlpha: 0, scale: 0.3, duration: 0.50, ease: "back.out(1.4)" }, 0.65);

      /* satellite rings pop in with stagger */
      tl.from(["#t1-sec-flare .flare-ring-1", "#t1-sec-flare .flare-ring-2", "#t1-sec-flare .flare-ring-3"],
        { autoAlpha: 0, scale: 0, duration: 0.35, ease: "back.out(1.4)", stagger: 0.10 }, 0.75);

      /* kicker glides down */
      tl.from("#t1-sec-flare .kicker",
        { autoAlpha: 0, y: -18, filter: "blur(8px)", duration: 0.70, ease: "power3.out" }, 0.55);

      /* headline focus-pulls in */
      tl.from("#t1-sec-flare .headline",
        { autoAlpha: 0, filter: "blur(22px)", y: 16, duration: 1.05, ease: "power4.out" }, 0.95);

      /* flare breathes/fades down to settled glow — finite pulse */
      tl.to("#t1-sec-flare .flare-core",
        { opacity: 0.55, scale: 0.88, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0);
      tl.to("#t1-sec-flare .streak",
        { opacity: 0.60, duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-flare"] = tl;
    </script>
  </body>
</html>
