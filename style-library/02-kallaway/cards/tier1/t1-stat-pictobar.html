<!doctype html>
<!--
  KALLAWAY · tier1 · stat · PICTOBAR
  A vertical bar built entirely from stacked glowing icon units (person silhouettes
  rendered as SVG). Units light up bottom-to-top as the bar "grows". Value counts
  up alongside. Left-aligned layout with label right of the bar.
  Slots: kicker (~28 chars), stat (e.g. "12,400"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-picto {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-picto .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-picto .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Main layout: icon column left, text right */
      #t1-stat-picto .layout {
        position: absolute; left: 180px; right: 180px; top: 80px; bottom: 100px;
        display: flex; align-items: center; gap: 100px; z-index: 4;
      }

      /* Icon column */
      #t1-stat-picto .icon-col {
        display: flex; flex-direction: column; align-items: center;
        gap: 0; flex-shrink: 0;
      }

      /* Each icon unit — a person SVG, 72×96px */
      #t1-stat-picto .icon-unit {
        width: 72px; height: 88px; opacity: 0.15;
        transition: none; flex-shrink: 0;
      }
      #t1-stat-picto .icon-unit.lit {
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(55,189,248,0.80)) drop-shadow(0 0 20px rgba(55,189,248,0.45));
      }
      #t1-stat-picto .icon-unit.lit-top {
        opacity: 1;
        filter: drop-shadow(0 0 14px rgba(255,255,255,0.90)) drop-shadow(0 0 30px rgba(55,189,248,0.80));
      }

      /* Text column */
      #t1-stat-picto .text-col {
        display: flex; flex-direction: column; gap: 40px;
        flex: 1;
      }
      #t1-stat-picto .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
      #t1-stat-picto .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 180px; line-height: 0.9; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 15%, rgba(var(--accent-rgb), 0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-picto .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        line-height: 1.5; max-width: 860px;
      }
      #t1-stat-picto .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* sub-label below stat showing "per cohort" style info */
      #t1-stat-picto .sub {
        font-family: var(--font-mono); font-size: 22px;
        font-weight: var(--wt-reg); letter-spacing: 0.10em;
        text-transform: uppercase; color: var(--text-faint);
        margin-top: -20px;
      }

      #t1-stat-picto .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-picto .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-picto .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-picto" data-composition-id="t1-stat-picto" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <!-- 9 icon units — built by JS, bottom unit = index 8, top = index 0 -->
        <div class="icon-col" id="picto-col">
          <!-- filled by JS -->
        </div>

        <div class="text-col">
          <div class="kicker" data-slot="kicker">ACTIVE LEARNERS · THIS QUARTER</div>
          <div class="stat" id="picto-num" data-slot="stat">12,400</div>
          <div class="sub">enrolled students</div>
          <div class="label" data-slot="label">
            across all active cohorts — <em>highest single-quarter count</em> in platform history, up 38% year-over-year
          </div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PLATFORM DATA Q4 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Build icon units */
      const UNITS = 9;
      /* target value for count-up */
      const TARGET = 12400;
      const col = document.getElementById("picto-col");

      /* person SVG path (simple silhouette) */
      const personSVG = '<svg viewBox="0 0 72 88" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="20" r="16" fill="currentColor"/><path d="M8 88c0-15.464 12.536-28 28-28s28 12.536 28 28H8z" fill="currentColor"/></svg>';

      const units = [];
      for (let i = 0; i < UNITS; i++) {
        const div = document.createElement("div");
        div.className = "icon-unit";
        div.innerHTML = personSVG;
        div.style.color = "#37BDF8";
        col.prepend(div); /* prepend so index 0 is at BOTTOM of stack after reversal */
        units.unshift(div);  /* units[0] = bottom, units[UNITS-1] = top */
      }
      /* Re-order: bottom units light first. DOM order top-to-bottom,
         but we want bottom-first lighting so reverse mapping: units[0]=top DOM, units[UNITS-1]=bottom DOM */
      /* Actually let's rebuild correctly: first appended = bottom visually? No — flex column.
         We want stack bottom-to-top, so DOM order should be top icon first (flex-col renders top-first).
         We'll keep units[] where units[0]=top-rendered=index0, and light from bottom (units[UNITS-1] first). */

      /* grain */
      tl.fromTo("#t1-stat-picto .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "112px 84px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-picto .bloom",
          { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-stat-picto .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* icon column slides up */
        .from("#t1-stat-picto .icon-col",
          { autoAlpha: 0, y: 60, duration: 0.9, ease: "power4.out" }, 0.40)

        /* kicker */
        .from("#t1-stat-picto .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.45);

      /* count-up number */
      const numEl = document.getElementById("picto-num");
      tl.from("#t1-stat-picto .stat",
          { autoAlpha: 0, y: 20, duration: 0.5, ease: "power2.out" }, 0.75)
        .to({ val: 0 }, {
          val: TARGET,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            numEl.textContent = Math.round(v).toLocaleString();
          }
        }, 0.80);

      /* Light icon units one by one bottom-to-top */
      for (let i = UNITS - 1; i >= 0; i--) {
        (function(idx) {
          const t = 0.85 + (UNITS - 1 - idx) * 0.20;
          tl.call(function() {
            units[idx].classList.add(idx === 0 ? "lit-top" : "lit");
          }, null, t);
          tl.from(units[idx], { scale: 1.35, duration: 0.35, ease: "back.out(2)", transformOrigin: "50% 100%" }, t);
        })(i);
      }

      tl
        .from("#t1-stat-picto .sub",
          { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 1.90)
        .from("#t1-stat-picto .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.10)
        .from("#t1-stat-picto .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.40)
        .set({}, {}, 7);

      window.__timelines["t1-stat-picto"] = tl;
    </script>
  </body>
</html>
