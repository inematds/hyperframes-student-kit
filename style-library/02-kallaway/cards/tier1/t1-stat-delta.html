<!doctype html>
<!--
  KALLAWAY · tier1 · stat · DELTA
  A big number with a clean glowing up/down CARET triangle indicator. Color-coded:
  blue/green accent for up, red alert for down. The caret is an SVG triangle — no
  hand-drawn arrows. Number counts up from 0. Trend label below the number.
  Direction knob: data-dir="up"|"down" on .delta-block (default "up").
  Slots: kicker (~28 chars uppercase), stat (e.g. "+42%"), label (~70 chars, <em>),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-delta {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-delta .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-delta .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Halo disc */
      #t1-stat-delta .halo {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -54%);
        width: 860px; height: 860px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--accent-rgb), 0.12) 0%,
          rgba(var(--accent-rgb), 0.04) 45%,
          transparent 70%);
        box-shadow: 0 0 120px 30px rgba(var(--accent-rgb), 0.16);
        z-index: 2;
      }
      /* Down variant halo — will be toggled by JS */
      #t1-stat-delta .halo.down {
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--alert-rgb), 0.12) 0%,
          rgba(var(--alert-rgb), 0.04) 45%,
          transparent 70%);
        box-shadow: 0 0 120px 30px rgba(var(--alert-rgb), 0.16);
      }

      /* Content */
      #t1-stat-delta .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 36px; padding-bottom: 40px;
      }

      #t1-stat-delta .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Caret + number row */
      #t1-stat-delta .delta-block {
        display: flex; align-items: center; gap: 36px;
      }

      /* SVG caret triangle — clean, glowing */
      #t1-stat-delta .caret-wrap {
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      #t1-stat-delta .caret-svg {
        width: 120px; height: 120px;
      }

      /* The stat number */
      #t1-stat-delta .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 220px;
        line-height: 1;
        letter-spacing: var(--track-tight);
      }
      /* Up — accent gradient */
      #t1-stat-delta .stat.up {
        background: linear-gradient(160deg, #ffffff 12%, rgba(var(--accent-rgb),0.85) 82%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }
      /* Down — alert red gradient */
      #t1-stat-delta .stat.down {
        background: linear-gradient(160deg, #ffffff 12%, rgba(var(--alert-rgb),0.85) 82%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--alert-rgb), 0.55));
      }

      /* Trend label row below delta block */
      #t1-stat-delta .trend {
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
        display: flex; align-items: center; gap: 14px;
      }
      #t1-stat-delta .trend-bar {
        width: 48px; height: 2px;
        background: var(--text-faint);
        border-radius: 2px;
      }

      #t1-stat-delta .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
      }
      #t1-stat-delta .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-delta .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-delta .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-delta .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-delta" data-composition-id="t1-stat-delta" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="halo" id="t1-stat-delta-halo"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">YEAR-OVER-YEAR GROWTH · AI</div>

        <!-- data-dir="up" | "down" -->
        <div class="delta-block" id="t1-stat-delta-block" data-dir="up">

          <div class="caret-wrap">
            <!-- Triangle caret — JS rotates it 180° for "down" -->
            <svg class="caret-svg" id="t1-stat-delta-caret"
                 viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="caretGradUp" x1="60" y1="100" x2="60" y2="10" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.9"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
                </linearGradient>
                <linearGradient id="caretGradDown" x1="60" y1="10" x2="60" y2="100" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.9"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
                </linearGradient>
                <filter id="caretGlow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
                  <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
              </defs>
              <!-- Triangle pointing UP (default) — rotate for down -->
              <polygon id="t1-stat-delta-poly"
                points="60,12 106,100 14,100"
                fill="url(#caretGradUp)"
                filter="url(#caretGlow)"
              />
            </svg>
          </div>

          <div class="stat up" id="t1-stat-delta-num" data-slot="stat">+42%</div>
        </div>

        <div class="trend" id="t1-stat-delta-trend">
          <div class="trend-bar"></div>
          <span>YEAR OVER YEAR</span>
          <div class="trend-bar"></div>
        </div>

        <div class="label" data-slot="label">AI-tooled engineering orgs saw <em>+42% throughput</em> versus the prior fiscal year</div>
      </div>

      <div class="source" data-slot="source">SOURCE · DORA ACCELERATE 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Direction knob */
      const block  = document.getElementById("t1-stat-delta-block");
      const dir    = (block.getAttribute("data-dir") || "up").toLowerCase();
      const isDown = dir === "down";

      const numEl   = document.getElementById("t1-stat-delta-num");
      const caretEl = document.getElementById("t1-stat-delta-caret");
      const polyEl  = document.getElementById("t1-stat-delta-poly");
      const haloEl  = document.getElementById("t1-stat-delta-halo");

      /* Adapt colors to direction */
      if (isDown) {
        numEl.classList.remove("up");
        numEl.classList.add("down");
        haloEl.classList.add("down");
        polyEl.setAttribute("fill", "url(#caretGradDown)");
        /* Rotate caret SVG 180° */
        caretEl.style.transform = "rotate(180deg)";
      }

      /* Parse number — strip leading +/- and suffix */
      const raw    = numEl.textContent.trim();
      const sign   = raw.startsWith("-") ? "-" : (raw.startsWith("+") ? "+" : "");
      const suffix = raw.replace(/^[+\-]?[\d.]+/, "");
      const target = Math.abs(parseFloat(raw)) || 42;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-delta .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-delta .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-delta .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-stat-delta .halo",
          { autoAlpha: 0, scale: 0.6, duration: 1.5, ease: "expo.out" }, 0.3)

        /* kicker */
        .from("#t1-stat-delta .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* caret drops/rises in */
        .from("#t1-stat-delta-caret",
          { autoAlpha: 0, y: isDown ? -40 : 40, scale: 0.6, filter: "blur(18px)",
            duration: 0.85, ease: "back.out(1.4)" }, 0.75)

        /* number blur-in + count-up */
        .from("#t1-stat-delta .stat",
          { autoAlpha: 0, x: 30, filter: "blur(22px)", duration: 1.0, ease: "power4.out" }, 0.88)
        .to({ val: 0 }, { val: target,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            numEl.textContent = sign + Math.round(v) + suffix;
          }
        }, 0.90)

        /* trend label */
        .from("#t1-stat-delta .trend",
          { autoAlpha: 0, y: 12, duration: 0.65, ease: "power2.out" }, 1.80)

        /* caption label */
        .from("#t1-stat-delta .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.00)

        /* source */
        .from("#t1-stat-delta .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.30)

        /* breathing glow pulse on caret */
        .to("#t1-stat-delta-caret",
          { opacity: 0.55, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.70)

        .set({}, {}, 7);

      window.__timelines["t1-stat-delta"] = tl;
    </script>
  </body>
</html>
