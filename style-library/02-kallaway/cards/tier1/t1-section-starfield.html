<!doctype html>
<!--
  KALLAWAY · tier1 · section · STARFIELD
  Full-screen chapter takeover. Drifting star particles on two parallax layers
  (hardcoded positions — no Math.random) float behind a glowing kicker/headline.
  Far stars drift slowly, near stars drift faster, creating depth.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-stars {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Deep bloom from corner + bottom */
      #t1-sec-stars .bloom {
        position: absolute; inset: 0; z-index: 1;
        background:
          var(--bloom-bottom),
          radial-gradient(70% 60% at 20% 25%, rgba(var(--accent-rgb), 0.12) 0%, transparent 60%);
      }

      /* Star layers — positioned absolutely, each star is a tiny element.
         Layer A = far/small (z:2), Layer B = near/large (z:3) */
      #t1-sec-stars .stars-far,
      #t1-sec-stars .stars-near {
        position: absolute; inset: 0; z-index: 2;
      }
      #t1-sec-stars .stars-near { z-index: 3; }

      #t1-sec-stars .star {
        position: absolute; border-radius: 50%;
        background: var(--white);
      }
      /* Far stars: 2px, dim */
      #t1-sec-stars .stars-far .star {
        width: 2px; height: 2px; opacity: 0.45;
      }
      /* Near stars: 3-5px, glowing */
      #t1-sec-stars .stars-near .star {
        width: 4px; height: 4px; opacity: 0.85;
        box-shadow: 0 0 6px 2px rgba(var(--accent-rgb), 0.55),
                    0 0 14px 4px rgba(var(--accent-rgb), 0.22);
      }
      #t1-sec-stars .stars-near .star.sm {
        width: 3px; height: 3px;
        box-shadow: 0 0 4px 1px rgba(255,255,255,0.4);
      }
      /* Accent-colored hero star */
      #t1-sec-stars .stars-near .star.accent {
        width: 5px; height: 5px; background: var(--accent);
        box-shadow: 0 0 12px 4px rgba(var(--accent-rgb), 0.65),
                    0 0 30px 8px rgba(var(--accent-rgb), 0.25);
      }

      /* Content */
      #t1-sec-stars .content {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        text-align: center; width: 1440px; z-index: 5;
      }
      #t1-sec-stars .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 32px;
      }
      #t1-sec-stars .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.07; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-sec-stars .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Soft center halo behind the text */
      #t1-sec-stars .halo {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 900px; height: 420px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(var(--accent-rgb), 0.09) 0%, transparent 68%);
        filter: blur(40px); z-index: 4; pointer-events: none;
      }

      #t1-sec-stars .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-stars .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-stars" data-composition-id="t1-sec-stars" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>

      <!-- Far star layer (hardcoded positions) -->
      <div class="stars-far">
        <div class="star" style="left:112px; top:88px;"></div>
        <div class="star" style="left:234px; top:210px;"></div>
        <div class="star" style="left:388px; top:55px;"></div>
        <div class="star" style="left:490px; top:310px;"></div>
        <div class="star" style="left:570px; top:148px;"></div>
        <div class="star" style="left:680px; top:450px;"></div>
        <div class="star" style="left:795px; top:72px;"></div>
        <div class="star" style="left:862px; top:920px;"></div>
        <div class="star" style="left:950px; top:185px;"></div>
        <div class="star" style="left:1040px; top:390px;"></div>
        <div class="star" style="left:1120px; top:820px;"></div>
        <div class="star" style="left:1200px; top:130px;"></div>
        <div class="star" style="left:1310px; top:470px;"></div>
        <div class="star" style="left:1430px; top:65px;"></div>
        <div class="star" style="left:1530px; top:290px;"></div>
        <div class="star" style="left:1620px; top:900px;"></div>
        <div class="star" style="left:1700px; top:175px;"></div>
        <div class="star" style="left:1800px; top:530px;"></div>
        <div class="star" style="left:160px; top:720px;"></div>
        <div class="star" style="left:310px; top:860px;"></div>
        <div class="star" style="left:445px; top:640px;"></div>
        <div class="star" style="left:630px; top:760px;"></div>
        <div class="star" style="left:760px; top:540px;"></div>
        <div class="star" style="left:900px; top:680px;"></div>
        <div class="star" style="left:1080px; top:960px;"></div>
        <div class="star" style="left:1260px; top:730px;"></div>
        <div class="star" style="left:1460px; top:850px;"></div>
        <div class="star" style="left:1640px; top:630px;"></div>
        <div class="star" style="left:1850px; top:790px;"></div>
        <div class="star" style="left:58px; top:420px;"></div>
      </div>

      <!-- Near star layer (fewer, glowing, accent) -->
      <div class="stars-near">
        <div class="star sm" style="left:200px; top:160px;"></div>
        <div class="star accent" style="left:340px; top:420px;"></div>
        <div class="star" style="left:540px; top:90px;"></div>
        <div class="star sm" style="left:730px; top:780px;"></div>
        <div class="star" style="left:1020px; top:280px;"></div>
        <div class="star accent" style="left:1380px; top:670px;"></div>
        <div class="star sm" style="left:1560px; top:140px;"></div>
        <div class="star" style="left:1760px; top:440px;"></div>
        <div class="star sm" style="left:88px; top:680px;"></div>
        <div class="star accent" style="left:1860px; top:200px;"></div>
        <div class="star" style="left:640px; top:920px;"></div>
        <div class="star sm" style="left:1180px; top:940px;"></div>
      </div>

      <div class="halo"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Module 03 —</div>
        <div class="headline" data-slot="headline">Neural Networks:<br><em>Seeing the Patterns</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-stars .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Bloom + halo fade in */
      tl.from("#t1-sec-stars .bloom", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 110%", duration: 1.6, ease: "expo.out" }, 0)
        .from("#t1-sec-stars .halo",  { autoAlpha: 0, scale: 0.7, duration: 1.8, ease: "power2.out" }, 0.3);

      /* Far stars materialize (staggered via GSAP) */
      tl.from("#t1-sec-stars .stars-far .star", {
        autoAlpha: 0, stagger: { each: 0.04, from: "random" },
        duration: 0.5, ease: "power2.out"
      }, 0.1);

      /* Near stars pop slightly later */
      tl.from("#t1-sec-stars .stars-near .star", {
        autoAlpha: 0, scale: 0, stagger: { each: 0.08, from: "random" },
        duration: 0.4, ease: "back.out(2)"
      }, 0.5);

      /* Parallax drift — far layer moves slowly left, near layer moves faster right */
      tl.to("#t1-sec-stars .stars-far",  { x: -18, y: -8,  duration: 6.5, ease: "sine.inOut" }, 0.2);
      tl.to("#t1-sec-stars .stars-near", { x:  28, y: -14, duration: 6.5, ease: "sine.inOut" }, 0.2);

      /* Kicker glide */
      tl.from("#t1-sec-stars .kicker",   { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.8, ease: "power3.out" }, 0.85);
      /* Headline blur-resolve */
      tl.from("#t1-sec-stars .headline", { autoAlpha: 0, y: 36, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.1);

      /* Breathing glow on accent stars — finite */
      tl.to("#t1-sec-stars .stars-near .star.accent", {
        boxShadow: "0 0 20px 8px rgba(55,189,248,0.9), 0 0 50px 16px rgba(55,189,248,0.35)",
        duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true
      }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-stars"] = tl;
    </script>
  </body>
</html>
