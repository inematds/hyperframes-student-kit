<!doctype html>
<!--
  KALLAWAY · tier1 · overview · THREE-TIER COMPARISON
  Full-screen takeover. Three vertical tier columns, each with a header chip
  and 3 feature lines. The winning/highlighted column uses accent-2 yellow.
  Slots: title, t1_hdr, t1_f1, t1_f2, t1_f3,
                t2_hdr, t2_f1, t2_f2, t2_f3,
                t3_hdr, t3_f1, t3_f2, t3_f3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-tier {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Ambience */
      #t1-ov-tier .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-tier .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner); z-index: 1; opacity: 0.50;
      }
      #t1-ov-tier .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.40;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 25%, transparent 74%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 25%, transparent 74%);
      }

      /* Title */
      #t1-ov-tier .title-row {
        position: absolute; left: 0; right: 0; top: 66px; text-align: center; z-index: 4;
      }
      #t1-ov-tier .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-tier .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Three-column grid */
      #t1-ov-tier .tiers {
        position: absolute; left: 120px; right: 120px; top: 210px; bottom: 80px;
        display: flex; gap: 40px; z-index: 4;
      }

      /* Individual tier column */
      #t1-ov-tier .tier-col {
        flex: 1;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-lg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow);
        padding: 52px 44px 48px;
        display: flex; flex-direction: column;
        position: relative; overflow: hidden;
      }
      /* Hairline top */
      #t1-ov-tier .tier-col::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 20%, var(--glass-hi) 80%, transparent);
      }

      /* Left accent bar */
      #t1-ov-tier .tier-col::after {
        content: ""; position: absolute; left: 0; top: 48px; bottom: 48px; width: 3px;
        border-radius: 2px;
        background: rgba(var(--accent-rgb), 0.35);
        box-shadow: 0 0 12px rgba(var(--accent-rgb),0.20);
      }

      /* Highlighted (winner) column overrides */
      #t1-ov-tier .tier-col.winner {
        background: rgba(var(--accent2-rgb), 0.06);
        border-color: rgba(var(--accent2-rgb), 0.45);
        box-shadow: var(--glass-shadow), 0 0 60px rgba(var(--accent2-rgb), 0.12);
      }
      #t1-ov-tier .tier-col.winner::after {
        background: rgba(var(--accent2-rgb), 0.65);
        box-shadow: 0 0 18px rgba(var(--accent2-rgb),0.45);
      }
      #t1-ov-tier .tier-col.winner::before {
        background: linear-gradient(90deg, transparent, rgba(var(--accent2-rgb),0.55) 20%, rgba(var(--accent2-rgb),0.55) 80%, transparent);
      }

      /* Header chip */
      #t1-ov-tier .tier-chip {
        display: inline-flex; align-items: center; gap: 10px;
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.45);
        border-radius: 999px;
        padding: 10px 24px;
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent);
        background: rgba(var(--accent-rgb), 0.06);
        box-shadow: var(--glow-accent-sm);
        margin-bottom: 14px; align-self: flex-start;
      }
      #t1-ov-tier .winner .tier-chip {
        border-color: rgba(var(--accent2-rgb), 0.60);
        color: var(--accent-2);
        background: rgba(var(--accent2-rgb), 0.08);
        box-shadow: 0 0 14px rgba(var(--accent2-rgb),0.40);
      }
      #t1-ov-tier .chip-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),0.8);
      }
      #t1-ov-tier .winner .chip-dot {
        background: var(--accent-2); box-shadow: 0 0 8px rgba(var(--accent2-rgb),0.8);
      }

      /* Tier heading */
      #t1-ov-tier .tier-heading {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 52px; letter-spacing: var(--track-snug); line-height: 1.12;
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 36px;
      }
      #t1-ov-tier .winner .tier-heading {
        color: var(--accent-2);
        text-shadow: 0 0 18px rgba(var(--accent2-rgb),0.50), 0 0 48px rgba(var(--accent2-rgb),0.25);
      }

      /* Rule under heading */
      #t1-ov-tier .tier-rule {
        height: 1px; margin-bottom: 34px;
        transform: scaleX(0); transform-origin: left center;
        background: linear-gradient(90deg, rgba(var(--accent-rgb),0.50), transparent 80%);
      }
      #t1-ov-tier .winner .tier-rule {
        background: linear-gradient(90deg, rgba(var(--accent2-rgb),0.60), transparent 80%);
      }

      /* Feature lines */
      #t1-ov-tier .feat-list {
        display: flex; flex-direction: column; gap: 0; flex: 1;
      }
      #t1-ov-tier .feat-line {
        display: flex; align-items: center; gap: 18px;
        padding: 20px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 28px; color: var(--text-dim); line-height: 1.4;
      }
      #t1-ov-tier .feat-line:last-child { border-bottom: none; }
      #t1-ov-tier .feat-dot {
        width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        background: rgba(var(--accent-rgb), 0.50);
        box-shadow: 0 0 8px rgba(var(--accent-rgb),0.30);
      }
      #t1-ov-tier .winner .feat-dot {
        background: var(--accent-2);
        box-shadow: 0 0 10px rgba(var(--accent2-rgb),0.55);
      }
      #t1-ov-tier .winner .feat-line { color: var(--text); }

      /* "Best" badge on winning column */
      #t1-ov-tier .best-badge {
        position: absolute; top: -1px; right: 36px;
        background: var(--accent-2);
        color: var(--ink);
        font-family: var(--font-mono); font-size: 18px; font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        padding: 8px 20px; border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        box-shadow: 0 4px 18px rgba(var(--accent2-rgb),0.45);
      }

      #t1-ov-tier .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-tier .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-tier" data-composition-id="t1-ov-tier" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Pick Your <em>Tier</em></div>
      </div>

      <div class="tiers">
        <!-- Tier 1 -->
        <div class="tier-col" id="tier-col-1">
          <div class="tier-chip"><div class="chip-dot"></div><span data-slot="t1_hdr">Starter</span></div>
          <div class="tier-heading">Basic</div>
          <div class="tier-rule" id="tier-rule-1"></div>
          <div class="feat-list">
            <div class="feat-line" id="tier-1-f1"><div class="feat-dot"></div><span data-slot="t1_f1">5 projects included</span></div>
            <div class="feat-line" id="tier-1-f2"><div class="feat-dot"></div><span data-slot="t1_f2">Community support</span></div>
            <div class="feat-line" id="tier-1-f3"><div class="feat-dot"></div><span data-slot="t1_f3">1 GB storage</span></div>
          </div>
        </div>

        <!-- Tier 2 — WINNER / highlighted -->
        <div class="tier-col winner" id="tier-col-2">
          <div class="best-badge" id="tier-best-badge">Best Value</div>
          <div class="tier-chip"><div class="chip-dot"></div><span data-slot="t2_hdr">Pro</span></div>
          <div class="tier-heading">Professional</div>
          <div class="tier-rule" id="tier-rule-2"></div>
          <div class="feat-list">
            <div class="feat-line" id="tier-2-f1"><div class="feat-dot"></div><span data-slot="t2_f1">Unlimited projects</span></div>
            <div class="feat-line" id="tier-2-f2"><div class="feat-dot"></div><span data-slot="t2_f2">Priority support</span></div>
            <div class="feat-line" id="tier-2-f3"><div class="feat-dot"></div><span data-slot="t2_f3">50 GB storage</span></div>
          </div>
        </div>

        <!-- Tier 3 -->
        <div class="tier-col" id="tier-col-3">
          <div class="tier-chip"><div class="chip-dot"></div><span data-slot="t3_hdr">Enterprise</span></div>
          <div class="tier-heading">Custom</div>
          <div class="tier-rule" id="tier-rule-3"></div>
          <div class="feat-list">
            <div class="feat-line" id="tier-3-f1"><div class="feat-dot"></div><span data-slot="t3_f1">Dedicated account manager</span></div>
            <div class="feat-line" id="tier-3-f2"><div class="feat-dot"></div><span data-slot="t3_f2">Custom integrations</span></div>
            <div class="feat-line" id="tier-3-f3"><div class="feat-dot"></div><span data-slot="t3_f3">Unlimited storage</span></div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-tier .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "92px 78px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-tier .bloom",        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-tier .bloom-corner",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.25)
        .from("#t1-ov-tier .grid",          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-tier .title",         { autoAlpha: 0, y: 24, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* columns spring in left, center, right */
        .from("#tier-col-1",                { autoAlpha: 0, x: -55, scale: 0.95, transformOrigin: "0% 50%",
                                              filter: "blur(12px)", duration: 0.88, ease: "back.out(1.4)" }, 1.05)
        .from("#tier-col-2",                { autoAlpha: 0, y: 45, scale: 0.95, transformOrigin: "50% 0%",
                                              filter: "blur(14px)", duration: 0.92, ease: "back.out(1.4)" }, 1.18)
        .from("#tier-col-3",                { autoAlpha: 0, x: 55,  scale: 0.95, transformOrigin: "100% 50%",
                                              filter: "blur(12px)", duration: 0.88, ease: "back.out(1.4)" }, 1.30)

        /* best badge pops */
        .from("#tier-best-badge",           { autoAlpha: 0, y: -12, duration: 0.4, ease: "back.out(2.0)" }, 1.75)

        /* rules draw in */
        .to("#tier-rule-1",                 { scaleX: 1, duration: 0.60, ease: "power3.out" }, 1.70)
        .to("#tier-rule-2",                 { scaleX: 1, duration: 0.60, ease: "power3.out" }, 1.82)
        .to("#tier-rule-3",                 { scaleX: 1, duration: 0.60, ease: "power3.out" }, 1.94)

        /* feature lines stagger per column */
        .from("#tier-1-f1, #tier-1-f2, #tier-1-f3", { autoAlpha: 0, y: 20, duration: 0.55, ease: "power3.out", stagger: 0.12 }, 2.0)
        .from("#tier-2-f1, #tier-2-f2, #tier-2-f3", { autoAlpha: 0, y: 20, duration: 0.55, ease: "power3.out", stagger: 0.12 }, 2.08)
        .from("#tier-3-f1, #tier-3-f2, #tier-3-f3", { autoAlpha: 0, y: 20, duration: 0.55, ease: "power3.out", stagger: 0.12 }, 2.16)

        /* winner column glow pulse — finite */
        .to("#tier-col-2",                  { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 80px rgba(245,216,42,0.18)", duration: 1.3, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.7)

        /* slow drift hold */
        .to("#t1-ov-tier .tiers",           { y: -8, duration: 5.0, ease: "sine.inOut" }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-ov-tier"] = tl;
    </script>
  </body>
</html>
