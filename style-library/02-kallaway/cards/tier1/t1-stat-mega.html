<!doctype html>
<!--
  KALLAWAY · tier1 · stat · MEGA
  Ultra-minimal: one absolute-giant gradient number counting up dominates the
  full canvas. Deep vignette, aurora bloom, barely-visible grid. Kicker sits
  above in mono; label and source are quietly below. Nothing competes with the
  number. Pure glow, pure scale.
  Slots: kicker (~28 chars uppercase), stat (number/text e.g. "2.4M"),
         label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-mega {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Deeper bloom for the mega treatment — more intense */
      #t1-stat-mega .bloom {
        position: absolute; inset: 0; z-index: 1;
        background:
          radial-gradient(130% 90% at 50% 118%,
            rgba(var(--accent-rgb), 0.55) 0%,
            rgba(var(--accent-rgb), 0.22) 32%,
            transparent 60%);
      }
      #t1-stat-mega .bloom-top {
        position: absolute; inset: 0; z-index: 1;
        background: radial-gradient(70% 50% at 50% -5%,
          rgba(var(--accent-rgb), 0.15) 0%, transparent 60%);
      }

      #t1-stat-mega .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.30;
        -webkit-mask-image: radial-gradient(100% 100% at 50% 50%, #000 30%, transparent 80%);
                mask-image: radial-gradient(100% 100% at 50% 50%, #000 30%, transparent 80%);
      }

      /* Stage */
      #t1-stat-mega .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
        gap: 0;
      }

      #t1-stat-mega .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 18px;
      }

      /* The mega number — as big as it gets */
      #t1-stat-mega .mega-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 320px;
        line-height: 0.88;
        letter-spacing: -0.05em;
        background: linear-gradient(145deg,
          #ffffff 0%,
          rgba(var(--accent-rgb), 0.90) 45%,
          #ffffff 60%,
          rgba(var(--accent-rgb), 0.70) 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 40px rgba(var(--accent-rgb), 0.65))
                drop-shadow(0 0 100px rgba(var(--accent-rgb), 0.30));
        text-align: center;
      }

      /* Hairline underline rule — subtly grounds the number */
      #t1-stat-mega .rule {
        width: 560px; height: 1.5px; margin-top: 28px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.60) 30%,
          rgba(255,255,255,0.70) 50%,
          rgba(var(--accent-rgb), 0.60) 70%,
          transparent 100%);
        box-shadow: 0 0 10px 1px rgba(var(--accent-rgb), 0.40);
      }

      #t1-stat-mega .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
        margin-top: 32px;
      }
      #t1-stat-mega .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-mega .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      /* Extra-deep vignette for mega — crushes corners to black */
      #t1-stat-mega .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: radial-gradient(130% 130% at 50% 45%, transparent 42%, rgba(0,0,0,0.72) 100%);
      }
      #t1-stat-mega .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-mega" data-composition-id="t1-stat-mega"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-top"></div>
      <div class="grid"></div>

      <div class="stage">
        <div class="kicker" data-slot="kicker">TOTAL ENROLLED LEARNERS</div>
        <div class="mega-num" id="t1-stat-mega-num" data-slot="stat">2.4M</div>
        <div class="rule" id="t1-stat-mega-rule"></div>
        <div class="label" data-slot="label">learners enrolled in AI certification programs — <em>growing 3× year over year</em></div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS GLOBAL PLATFORM 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl  = document.getElementById("t1-stat-mega-num");
      /* Target: 2.4 (millions) — display with "M" suffix */
      const target = 2.4;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-mega .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom builds */
      tl.from("#t1-stat-mega .bloom",
          { autoAlpha: 0, scale: 0.85, transformOrigin: "50% 120%", duration: 1.6, ease: "expo.out" }, 0)
        .from("#t1-stat-mega .bloom-top",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.3)
        .from("#t1-stat-mega .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.3)

        /* kicker */
        .from("#t1-stat-mega .kicker",
          { autoAlpha: 0, y: 20, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 0.60)

        /* mega number — starts invisible, reveals as count runs */
        .from("#t1-stat-mega .mega-num",
          { autoAlpha: 0, scale: 1.12, transformOrigin: "50% 50%", duration: 0.6, ease: "power2.out" }, 0.75)

        /* count-up: 0.0 → 2.4 */
        .to({ val: 0 }, {
          val: target,
          duration: 1.8, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            numEl.textContent = v.toFixed(1) + "M";
          }
        }, 0.80)

        /* rule draws in */
        .from("#t1-stat-mega-rule",
          { scaleX: 0, transformOrigin: "50% 50%", duration: 0.7, ease: "power3.out" }, 1.70)

        /* label */
        .from("#t1-stat-mega .label",
          { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.10)

        /* source */
        .from("#t1-stat-mega .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.50)

        /* slow breathing bloom pulse */
        .to("#t1-stat-mega .bloom",
          { opacity: 0.72, scale: 1.05, transformOrigin: "50% 120%",
            duration: 2.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.00)

        /* mega number slow drift down — "settling" */
        .to("#t1-stat-mega .mega-num",
          { y: 8, duration: 3.5, ease: "sine.inOut" }, 2.80)

        .set({}, {}, 7);

      window.__timelines["t1-stat-mega"] = tl;
    </script>
  </body>
</html>
