<!doctype html>
<!--
  KALLAWAY · tier1 · stat · POLAR
  A polar-area / rose chart of glowing wedges radiating from center; each wedge
  has a different radius conveying magnitude. A hero headline value sits centered
  above with aurora bloom. Wedges animate in clockwise one by one.
  Slots: kicker (~28 chars), stat (center headline number, e.g. "87%"),
         label (~60 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-polar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-polar .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-polar .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* polar SVG container – centred, slightly right of middle */
      #t1-stat-polar .polar-wrap {
        position: absolute; right: 160px; top: 50%; transform: translateY(-50%);
        width: 680px; height: 680px; z-index: 3;
      }
      #t1-stat-polar .polar-glow {
        position: absolute; inset: -60px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.20) 0%, transparent 65%);
        box-shadow: 0 0 140px 30px rgba(var(--accent-rgb), 0.18);
      }

      /* Left text column */
      #t1-stat-polar .content {
        position: absolute; left: 180px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 36px; z-index: 4;
        max-width: 820px;
      }
      #t1-stat-polar .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
      #t1-stat-polar .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 0.9; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb), 0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-polar .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim); line-height: 1.45;
      }
      #t1-stat-polar .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-polar .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-polar .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-polar .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-polar" data-composition-id="t1-stat-polar" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- text left -->
      <div class="content">
        <div class="kicker" data-slot="kicker">ENGAGEMENT · BY COHORT</div>
        <div class="stat" id="polar-num" data-slot="stat">87%</div>
        <div class="label" data-slot="label">
          average weekly active learner rate across <em>all six</em> cohort segments measured
        </div>
      </div>

      <!-- polar rose chart right -->
      <div class="polar-wrap">
        <div class="polar-glow"></div>
        <!--
          6 wedges, each a path. Centre 340,340. Different radii encode value.
          Radii (out of 290 max): 290, 230, 260, 180, 310 (capped 290), 200
          Fixed values: segment angles = 60° each. Drawn as arc paths.
        -->
        <svg id="polar-svg" viewBox="0 0 680 680" fill="none" xmlns="http://www.w3.org/2000/svg"
             width="680" height="680">
          <defs>
            <filter id="pGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
              <feComposite in="SourceGraphic" in2="b" operator="over"/>
            </filter>
            <linearGradient id="pg0" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
            </linearGradient>
            <linearGradient id="pg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.65"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.15"/>
            </linearGradient>
            <linearGradient id="pg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.30"/>
            </linearGradient>
            <linearGradient id="pg3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.10"/>
            </linearGradient>
            <linearGradient id="pg4" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.40"/>
            </linearGradient>
            <linearGradient id="pg5" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.60"/>
              <stop offset="100%" stop-color="#37BDF8" stop-opacity="0.15"/>
            </linearGradient>
          </defs>
          <!-- faint spoke lines -->
          <line x1="340" y1="340" x2="340" y2="50"  stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <line x1="340" y1="340" x2="593" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <line x1="340" y1="340" x2="593" y2="490" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <line x1="340" y1="340" x2="340" y2="630" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <line x1="340" y1="340" x2="87"  y2="490" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <line x1="340" y1="340" x2="87"  y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <!-- faint concentric circles -->
          <circle cx="340" cy="340" r="97"  stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>
          <circle cx="340" cy="340" r="194" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>
          <circle cx="340" cy="340" r="290" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>

          <!--
            Wedge paths — each is a pie sector from center.
            Segment i spans from angle (i*60 - 90)° to ((i+1)*60 - 90)°.
            Radii (px): 0→285, 1→218, 2→255, 3→174, 4→290, 5→200
            Computed large-arc-flag=0 (all < 180°).
            Centre: (340,340).
          -->
          <!-- Wedge 0: -90° → -30°, r=285 -->
          <path id="pw0" d="M340,340 L340,55 A285,285 0 0,1 582.5,197.5 Z"
                fill="url(#pg0)" stroke="rgba(55,189,248,0.40)" stroke-width="1.5"
                filter="url(#pGlow)"/>
          <!-- Wedge 1: -30° → 30°, r=218 -->
          <path id="pw1" d="M340,340 L582.5,197.5 A218,218 0 0,1 558.8,449.6 Z"
                fill="url(#pg1)" stroke="rgba(55,189,248,0.30)" stroke-width="1.5"
                filter="url(#pGlow)"/>
          <!-- Wedge 2: 30° → 90°, r=255 -->
          <path id="pw2" d="M340,340 L558.8,449.6 A255,255 0 0,1 340,595 Z"
                fill="url(#pg2)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"
                filter="url(#pGlow)"/>
          <!-- Wedge 3: 90° → 150°, r=174 -->
          <path id="pw3" d="M340,340 L340,595 A174,174 0 0,1 166.8,427 Z"
                fill="url(#pg3)" stroke="rgba(55,189,248,0.25)" stroke-width="1.5"
                filter="url(#pGlow)"/>
          <!-- Wedge 4: 150° → 210°, r=290 -->
          <path id="pw4" d="M340,340 L166.8,427 A290,290 0 0,1 91.6,194.7 Z"
                fill="url(#pg4)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"
                filter="url(#pGlow)"/>
          <!-- Wedge 5: 210° → 270°, r=200 -->
          <path id="pw5" d="M340,340 L91.6,194.7 A200,200 0 0,1 340,140 Z"
                fill="url(#pg5)" stroke="rgba(55,189,248,0.28)" stroke-width="1.5"
                filter="url(#pGlow)"/>

          <!-- center dot glow -->
          <circle cx="340" cy="340" r="12" fill="white"
                  style="filter:drop-shadow(0 0 10px rgba(55,189,248,0.9)) drop-shadow(0 0 30px rgba(55,189,248,0.5));"/>
        </svg>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PLATFORM DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wedges = ["#pw0","#pw1","#pw2","#pw3","#pw4","#pw5"];

      /* grain */
      tl.fromTo("#t1-stat-polar .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "105px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-polar .bloom",
          { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-stat-polar .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* polar glow blooms */
        .from("#t1-stat-polar .polar-glow",
          { autoAlpha: 0, scale: 0.4, duration: 1.2, ease: "expo.out" }, 0.40)

        /* kicker */
        .from("#t1-stat-polar .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* stat number */
        .from("#t1-stat-polar .stat",
          { autoAlpha: 0, y: 30, duration: 0.85, ease: "back.out(1.4)" }, 0.70);

      /* wedges spring in one by one */
      wedges.forEach(function(sel, i) {
        tl.from(sel,
          { autoAlpha: 0, scale: 0, transformOrigin: "340px 340px",
            duration: 0.55, ease: "back.out(1.6)" }, 0.90 + i * 0.14);
      });

      tl
        /* label */
        .from("#t1-stat-polar .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 1.90)

        /* source */
        .from("#t1-stat-polar .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.20)

        /* breathing glow on polar glow */
        .to("#t1-stat-polar .polar-glow",
          { opacity: 0.55, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.60)

        .set({}, {}, 7);

      window.__timelines["t1-stat-polar"] = tl;
    </script>
  </body>
</html>
