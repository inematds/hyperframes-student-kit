<!doctype html>
<!--
  KALLAWAY · tier1 · stat · ANNOT
  The big number dominates. Two or three clean leader-line annotations point to
  labelled parts of it — e.g. annotating the prefix, the integer part, the
  suffix/decimal. Lines animate-draw from the number outward; endpoint nodes glow
  and the annotation text fades in. Dark canvas, aurora bloom, no glass panel.
  Slots: stat (big number e.g. "$1.8B"), note1 (~40 chars),
         note2 (~40 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-annot {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-annot .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-annot .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Central number */
      #t1-stat-annot .stat-wrap {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        z-index: 4; text-align: center;
      }
      #t1-stat-annot .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 260px;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(150deg, #ffffff 18%, rgba(var(--accent-rgb), 0.85) 72%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.55))
                drop-shadow(0 0 80px rgba(var(--accent-rgb), 0.22));
      }

      /* SVG leader-line layer — overlays the full canvas */
      #t1-stat-annot .leader-svg {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        z-index: 5; pointer-events: none;
        overflow: visible;
      }

      /* Leader lines — initially hidden, drawn via dashoffset */
      #t1-stat-annot .leader {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.65);
        stroke-width: 1.5;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
      }
      /* Endpoint circles */
      #t1-stat-annot .node {
        fill: var(--accent);
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.90))
                drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.50));
        opacity: 0;
      }
      /* Source node (at number) */
      #t1-stat-annot .src-node {
        fill: rgba(255,255,255,0.70);
        filter: drop-shadow(0 0 4px rgba(255,255,255,0.60));
        opacity: 0;
      }

      /* Annotation text boxes */
      #t1-stat-annot .annot-box {
        position: absolute; z-index: 6;
        opacity: 0;
      }
      #t1-stat-annot .annot-label {
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 6px;
      }
      #t1-stat-annot .annot-text {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        max-width: 340px;
        line-height: 1.42;
      }
      #t1-stat-annot .annot-text em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* Annotation 1 — upper left */
      #t1-stat-annot .annot-1 {
        left: 148px; top: 196px; text-align: right;
      }
      /* Annotation 2 — lower right */
      #t1-stat-annot .annot-2 {
        right: 148px; bottom: 220px; text-align: left;
      }

      #t1-stat-annot .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-annot .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-stat-annot .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-annot" data-composition-id="t1-stat-annot"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Central big number -->
      <div class="stat-wrap">
        <div class="stat" data-slot="stat">$1.8B</div>
      </div>

      <!-- SVG leader lines + nodes -->
      <svg class="leader-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <!-- Leader 1: from near the $ sign → upper-left annotation -->
        <!-- anchor point on number: ~(700, 440) → annotation box right edge ~(490, 330) -->
        <path id="t1-stat-annot-l1"
          class="leader"
          d="M 700 440 C 650 400, 580 360, 490 330"/>
        <circle id="t1-stat-annot-n1s" class="src-node" cx="700" cy="440" r="5"/>
        <circle id="t1-stat-annot-n1e" class="node" cx="490" cy="330" r="6"/>

        <!-- Leader 2: from near the "B" suffix → lower-right annotation -->
        <!-- anchor: ~(1220, 630) → annotation ~(1360, 700) -->
        <path id="t1-stat-annot-l2"
          class="leader"
          d="M 1220 630 C 1270 660, 1310 680, 1360 700"/>
        <circle id="t1-stat-annot-n2s" class="src-node" cx="1220" cy="630" r="5"/>
        <circle id="t1-stat-annot-n2e" class="node" cx="1360" cy="700" r="6"/>
      </svg>

      <!-- Annotation boxes -->
      <div class="annot-box annot-1" id="t1-stat-annot-box1">
        <div class="annot-label">TOTAL MARKET VALUE</div>
        <div class="annot-text" data-slot="note1">global AI education market valuation entering 2026 — <em>up from $380M in 2022</em></div>
      </div>

      <div class="annot-box annot-2" id="t1-stat-annot-box2">
        <div class="annot-label">PROJECTED BY 2028</div>
        <div class="annot-text" data-slot="note2">on current trajectory, <em>doubling again within 24 months</em> driven by enterprise mandates</div>
      </div>

      <div class="source" data-slot="source">SOURCE · EDTECH INSIGHTS REPORT 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const l1   = document.getElementById("t1-stat-annot-l1");
      const l2   = document.getElementById("t1-stat-annot-l2");
      const n1s  = document.getElementById("t1-stat-annot-n1s");
      const n1e  = document.getElementById("t1-stat-annot-n1e");
      const n2s  = document.getElementById("t1-stat-annot-n2s");
      const n2e  = document.getElementById("t1-stat-annot-n2e");
      const box1 = document.getElementById("t1-stat-annot-box1");
      const box2 = document.getElementById("t1-stat-annot-box2");

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-annot .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "92px 74px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-annot .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-annot .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* big number lands */
        .from("#t1-stat-annot .stat",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 50%", duration: 0.9, ease: "back.out(1.4)" }, 0.45)

        /* source nodes appear */
        .to([n1s, n2s], { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.10)

        /* leader 1 draws */
        .to(l1, { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 1.20)
        /* end node 1 pops */
        .to(n1e, { opacity: 1, scale: 1, transformOrigin: "50% 50%",
          duration: 0.3, ease: "back.out(1.8)" }, 1.82)
        /* annotation 1 fades in */
        .to(box1, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.88)
        .from(box1, { y: 14 }, 1.88)

        /* leader 2 draws */
        .to(l2, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.10)
        /* end node 2 */
        .to(n2e, { opacity: 1, scale: 1, transformOrigin: "50% 50%",
          duration: 0.3, ease: "back.out(1.8)" }, 2.62)
        /* annotation 2 */
        .to(box2, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.68)
        .from(box2, { y: -14 }, 2.68)

        /* source */
        .from("#t1-stat-annot .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 3.00)

        /* leader glow pulse */
        .to([l1, l2],
          { stroke: "rgba(55,189,248,0.90)", strokeWidth: 2.5,
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.20)

        .set({}, {}, 7);

      window.__timelines["t1-stat-annot"] = tl;
    </script>
  </body>
</html>
