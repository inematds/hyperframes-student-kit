<!doctype html>
<!--
  KALLAWAY · tier1 · section · WAVEFORM
  Full-screen chapter takeover. A glowing audio-waveform of vertical bars
  spans the full frame width; the bars animate their heights up and down
  in a deterministic breathing pattern. The kicker and headline float
  centered over the waveform.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-wform {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-wform .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      #t1-sec-wform .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.38;
        -webkit-mask-image: radial-gradient(110% 90% at 50% 50%, #000 30%, transparent 72%);
                mask-image: radial-gradient(110% 90% at 50% 50%, #000 30%, transparent 72%);
      }

      /* Waveform stage — centered vertically */
      #t1-sec-wform .wave-stage {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        height: 520px; z-index: 3;
        display: flex; align-items: center; justify-content: center;
        gap: 6px; padding: 0 40px;
      }

      /* Each waveform bar — symmetric around center line */
      #t1-sec-wform .wbar {
        flex: 1; max-width: 22px; border-radius: 4px;
        background: linear-gradient(to top,
          rgba(var(--accent-rgb), 0.15) 0%,
          rgba(var(--accent-rgb), 0.80) 45%,
          rgba(255,255,255,0.90) 50%,
          rgba(var(--accent-rgb), 0.80) 55%,
          rgba(var(--accent-rgb), 0.15) 100%
        );
        box-shadow:
          0 0 8px  rgba(var(--accent-rgb), 0.60),
          0 0 22px rgba(var(--accent-rgb), 0.28);
        transform-origin: center center;
      }

      /* Center hairline across waveform */
      #t1-sec-wform .center-line {
        position: absolute; left: 40px; right: 40px; top: 50%;
        height: 1px; margin-top: -0.5px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.35) 8%,
          rgba(255,255,255,0.60) 50%,
          rgba(var(--accent-rgb), 0.35) 92%,
          transparent 100%);
        box-shadow: 0 0 8px rgba(255,255,255,0.35), 0 0 22px rgba(var(--accent-rgb),0.20);
        z-index: 4;
      }

      /* Content centered over the waveform */
      #t1-sec-wform .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-54%);
        text-align: center; z-index: 6;
      }
      #t1-sec-wform .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 24px;
      }
      #t1-sec-wform .plate {
        position: absolute; left: 50%; top: 76px; transform: translateX(-50%);
        width: 1200px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(10,14,20,0.72), transparent 70%);
        filter: blur(20px); z-index: -1;
      }
      #t1-sec-wform .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1340px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-wform .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-wform .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-wform .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-wform" data-composition-id="t1-sec-wform" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- 60 waveform bars with hardcoded heights forming a symmetrical waveform profile -->
      <div class="wave-stage">
        <div class="wbar" style="height: 40px"></div>
        <div class="wbar" style="height: 68px"></div>
        <div class="wbar" style="height: 96px"></div>
        <div class="wbar" style="height: 140px"></div>
        <div class="wbar" style="height: 112px"></div>
        <div class="wbar" style="height: 180px"></div>
        <div class="wbar" style="height: 240px"></div>
        <div class="wbar" style="height: 210px"></div>
        <div class="wbar" style="height: 280px"></div>
        <div class="wbar" style="height: 320px"></div>
        <div class="wbar" style="height: 290px"></div>
        <div class="wbar" style="height: 360px"></div>
        <div class="wbar" style="height: 400px"></div>
        <div class="wbar" style="height: 380px"></div>
        <div class="wbar" style="height: 420px"></div>
        <div class="wbar" style="height: 460px"></div>
        <div class="wbar" style="height: 440px"></div>
        <div class="wbar" style="height: 480px"></div>
        <div class="wbar" style="height: 500px"></div>
        <div class="wbar" style="height: 490px"></div>
        <div class="wbar" style="height: 510px"></div>
        <div class="wbar" style="height: 520px"></div>
        <div class="wbar" style="height: 508px"></div>
        <div class="wbar" style="height: 516px"></div>
        <div class="wbar" style="height: 504px"></div>
        <div class="wbar" style="height: 520px"></div>
        <div class="wbar" style="height: 512px"></div>
        <div class="wbar" style="height: 498px"></div>
        <div class="wbar" style="height: 520px"></div>
        <div class="wbar" style="height: 510px"></div>
        <div class="wbar" style="height: 520px"></div>
        <div class="wbar" style="height: 510px"></div>
        <div class="wbar" style="height: 498px"></div>
        <div class="wbar" style="height: 520px"></div>
        <div class="wbar" style="height: 512px"></div>
        <div class="wbar" style="height: 504px"></div>
        <div class="wbar" style="height: 516px"></div>
        <div class="wbar" style="height: 508px"></div>
        <div class="wbar" style="height: 520px"></div>
        <div class="wbar" style="height: 490px"></div>
        <div class="wbar" style="height: 500px"></div>
        <div class="wbar" style="height: 480px"></div>
        <div class="wbar" style="height: 440px"></div>

        <div class="wbar" style="height: 360px"></div>
        <div class="wbar" style="height: 290px"></div>
        <div class="wbar" style="height: 320px"></div>
        <div class="wbar" style="height: 280px"></div>
        <div class="wbar" style="height: 210px"></div>
        <div class="wbar" style="height: 240px"></div>
        <div class="wbar" style="height: 180px"></div>
        <div class="wbar" style="height: 112px"></div>
        <div class="wbar" style="height: 140px"></div>
        <div class="wbar" style="height: 96px"></div>
        <div class="wbar" style="height: 68px"></div>
        <div class="wbar" style="height: 40px"></div>
        <div class="wbar" style="height: 20px"></div>
      </div>

      <div class="center-line"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 5 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">Reading the <em>Frequency</em> of Intelligence</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-wform .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-sec-wform .bloom", { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-wform .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* Center line draws in from center */
      tl.from("#t1-sec-wform .center-line", { scaleX: 0, transformOrigin: "50% 50%", duration: 0.9, ease: "expo.out" }, 0.2);

      /* Waveform bars scale up from center — alternating from-center stagger */
      tl.from("#t1-sec-wform .wbar", {
        scaleY: 0.04, autoAlpha: 0,
        duration: 1.3, ease: "expo.out",
        stagger: { each: 0.018, from: "center" },
        transformOrigin: "50% 50%"
      }, 0.3);

      /* Kicker and headline */
      tl.from("#t1-sec-wform .kicker",   { autoAlpha: 0, y: 20, duration: 0.7, ease: "power3.out" }, 1.2)
        .from("#t1-sec-wform .plate",    { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 1.4)
        .from("#t1-sec-wform .headline", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 1.5);

      /* Waveform breathing — the bars scale their height over time in groups
         (finite deterministic — using 3 separate tweens for low/mid/peak bars) */
      const barSel = "#t1-sec-wform .wbar";
      /* low bars group */
      tl.to("#t1-sec-wform .wbar:nth-child(-n+10), #t1-sec-wform .wbar:nth-child(n+51)", {
        scaleY: 1.5, duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true
      }, 2.2);
      /* mid bars group */
      tl.to("#t1-sec-wform .wbar:nth-child(n+11):nth-child(-n+25), #t1-sec-wform .wbar:nth-child(n+36):nth-child(-n+50)", {
        scaleY: 0.75, duration: 0.9, ease: "sine.inOut", repeat: 2, yoyo: true
      }, 2.5);
      /* Peak bars — slight gentle breathe */
      tl.to("#t1-sec-wform .wbar:nth-child(n+26):nth-child(-n+35)", {
        scaleY: 0.88, duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true
      }, 2.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-wform"] = tl;
    </script>
  </body>
</html>
