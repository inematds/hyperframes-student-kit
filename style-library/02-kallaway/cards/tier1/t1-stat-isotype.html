<!doctype html>
<!--
  KALLAWAY · tier1 · stat · ISOTYPE
  Pictograph grid: rows of glowing person/dot unit icons; a fraction are "lit"
  in accent blue to represent a proportion. Count-up shows the lit count.
  Knob: data-lit on #t1-stat-iso-grid (default 7 of 10 units).
  Slots: kicker, stat (e.g. "7 out of 10"), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-iso {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-iso .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-iso .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* split layout: big number left, icon grid right */
      #t1-stat-iso .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; align-items: center;
        padding: 0 var(--pad);
        gap: 100px;
      }

      /* ---- left panel ---- */
      #t1-stat-iso .left {
        display: flex; flex-direction: column; gap: 36px;
        flex: 0 0 600px;
      }

      #t1-stat-iso .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      #t1-stat-iso .stat-wrap {
        display: flex; align-items: baseline; gap: 18px;
      }

      #t1-stat-iso .stat-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: var(--size-mega);
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.80) 88%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-iso .stat-denom {
        font-family: var(--font-display);
        font-weight: var(--wt-semi);
        font-size: 80px;
        color: var(--text-faint);
        line-height: 1;
      }

      #t1-stat-iso .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        line-height: 1.45;
        max-width: 560px;
      }
      #t1-stat-iso .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* ---- right panel — icon grid ---- */
      #t1-stat-iso .right {
        flex: 1;
        display: flex; align-items: center; justify-content: center;
      }

      #t1-stat-iso .icon-grid {
        display: flex; flex-wrap: wrap;
        gap: 28px;
        width: 680px;
      }

      /* each icon: an SVG person silhouette */
      #t1-stat-iso .unit {
        width: 82px; height: 82px;
        flex-shrink: 0;
        transition: none; /* GSAP drives it */
      }

      /* dim (unlit) icons */
      #t1-stat-iso .unit svg { width: 82px; height: 82px; }
      #t1-stat-iso .unit.dim svg path  { fill: rgba(255,255,255,0.12); }
      /* lit icons */
      #t1-stat-iso .unit.lit svg path  {
        fill: var(--accent);
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.85))
                drop-shadow(0 0 20px rgba(var(--accent-rgb), 0.45));
      }

      #t1-stat-iso .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-iso .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-iso .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-iso" data-composition-id="t1-stat-iso" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <!-- left -->
        <div class="left">
          <div class="kicker" data-slot="kicker">LEARNER OUTCOME RATE</div>
          <div class="stat-wrap">
            <div class="stat-num" id="t1-stat-iso-num">0</div>
            <div class="stat-denom">/ 10</div>
          </div>
          <!-- stat slot hidden; drives JS -->
          <div style="display:none" data-slot="stat" id="t1-stat-iso-val">7 out of 10</div>
          <div class="label" data-slot="label">students who complete the practicum land a <em>paying project</em> within 60 days</div>
        </div>

        <!-- right: icon grid populated by JS — knob: data-lit -->
        <div class="right">
          <div class="icon-grid" id="t1-stat-iso-grid" data-lit="7"></div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS OUTCOMES REPORT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ---- build icon grid ---- */
      const gridEl = document.getElementById("t1-stat-iso-grid");
      const litKnob = parseInt(gridEl.getAttribute("data-lit"), 10) || 7;
      const total   = 10;
      const numEl   = document.getElementById("t1-stat-iso-num");

      /* person SVG path (simple silhouette) */
      const personPath = "M41 18 a13 13 0 1 1 0-0.01 Z M22 68 C22 50 60 50 60 68 L60 80 H22 Z";
      const units = [];

      for (let i = 0; i < total; i++) {
        const div  = document.createElement("div");
        div.className = "unit " + (i < litKnob ? "lit" : "dim");
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 82 82");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", personPath);
        svg.appendChild(path);
        div.appendChild(svg);
        gridEl.appendChild(div);
        units.push(div);
      }

      /* start all icons invisible */
      gsap.set(units, { autoAlpha: 0 });

      /* grain flicker */
      tl.fromTo("#t1-stat-iso .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-iso .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-iso .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-iso .kicker",
          { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.45)

        /* icons stagger in — dim ones first */
        .to(units, {
          autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)",
          stagger: { amount: 0.8, from: "start" }
        }, 0.65)

        /* count-up number */
        .to({ val: 0 }, {
          val: litKnob,
          duration: 1.4, ease: "power2.out",
          onUpdate: function() {
            numEl.textContent = Math.round(this.targets()[0].val);
          }
        }, 0.90)

        /* label */
        .from("#t1-stat-iso .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.0)

        /* source */
        .from("#t1-stat-iso .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.4)

        /* breathing glow on lit icons */
        .to("#t1-stat-iso .unit.lit svg path", {
          opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true
        }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-iso"] = tl;
    </script>
  </body>
</html>
