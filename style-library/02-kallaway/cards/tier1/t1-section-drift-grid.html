<!doctype html>
<!--
  KALLAWAY · tier1 · section · DRIFT-GRID
  A field of blue-tinted dots (hardcoded positions, no Math.random) drifts and
  slowly converges toward the centre where the title sits. The dots are
  positioned in a 19×11 grid with deterministic offsets. During the hold they
  continue their slow parallax drift, giving a living "data universe" feel.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-dgrid {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-dgrid .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }

      /* Canvas for the dot field */
      #t1-sec-dgrid .dot-canvas {
        position: absolute; inset: 0; z-index: 2;
        pointer-events: none;
      }

      /* Individual dot — we use a 5px circle div per dot */
      #t1-sec-dgrid .dot-canvas .d {
        position: absolute; border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.40);
        will-change: transform, opacity;
      }

      /* Content — title in centre at z-index 5 */
      #t1-sec-dgrid .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        text-align: center; z-index: 5;
        padding: 0 120px;
      }

      #t1-sec-dgrid .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 36px;
      }

      #t1-sec-dgrid .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-sec-dgrid .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Vignette masks the dot field to centre */
      #t1-sec-dgrid .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: radial-gradient(120% 120% at 50% 50%, transparent 28%, rgba(7,18,28,0.70) 72%, rgba(7,18,28,0.95) 100%);
      }
      #t1-sec-dgrid .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-dgrid" data-composition-id="t1-sec-dgrid" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>

      <div class="dot-canvas" id="t1-sec-dgrid-canvas">
        <!-- dots injected by script (hardcoded positions) -->
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">What Powers Growth</div>
        <div class="headline" data-slot="headline">Data Without <em>Direction</em><br>Is Just Noise</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* --- build dot field from hardcoded grid --- */
      /* 14 cols × 9 rows = 126 dots, placed on a regular grid with deterministic
         per-dot offsets drawn from a fixed seed table so it looks organic, not robotic */

      /* Fixed offset table (px) — 126 values each for x and y.
         Generated once from seed 42 and inlined. Never call Math.random(). */
      const OX = [
        22,-14, 38,-28, 12,-40, 30,-18, 44,-8,  26,-32, 16, 42,-22, 34,-10, 48,-36, 20,
        -44, 28, 18,-38, 10, 46,-20, 36,-12, 50,-34, 8,  24,-46, 14, 40,-24, 32,-6,  52,
        -30, 22,-16, 44,-8,  38,-26, 18, 54,-42, 12, 28,-50, 20, 46,-18, 34,-14, 48,-36,
        16, 42,-28, 24,-50, 10, 38,-22, 32,-48, 14, 52,-40, 26,-16, 44,-8,  36,-30, 18,
        54,-44, 22,-12, 40,-28, 16, 48,-36, 28,-54, 20, 46,-20, 34,-10, 50,-38, 24,-16,
        44,-8,  38,-26, 18, 52,-42, 12, 28,-50, 20, 46,-18, 34,-14, 48,-36, 16, 42,-28,
        24,-50, 10, 38,-22, 32,-48, 14, 52,-40, 26,-16
      ];
      const OY = [
        -18, 30,-10, 42,-24, 16,-38, 8,  44,-28, 20,-46, 12, 36,-6,  52,-40, 22,-14, 48,
        -32, 18,-50, 24,-8,  38,-22, 14, 46,-34, 10, 26,-54, 16, 40,-20, 36,-12, 50,-44,
        28,-16, 44,-8,  38,-26, 18, 52,-42, 12, 28,-50, 20, 46,-18, 34,-14, 48,-36, 16,
        42,-28, 24,-50, 10, 38,-22, 32,-48, 14, 52,-40, 26,-16, 44,-8,  36,-30, 18, 54,
        -44, 22,-12, 40,-28, 16, 48,-36, 28,-54, 20, 46,-20, 34,-10, 50,-38, 24,-16, 44,
        -8,  38,-26, 18, 52,-42, 12, 28,-50, 20, 46,-18, 34,-14, 48,-36, 16, 42,-28, 24,
        -50, 10, 38,-22, 32,-48, 14, 52,-40, 26,-16
      ];

      /* dot size & opacity table — 126 values */
      const DS = [
        4,3,5,3,4,6,3,5,4,3, 5,4,3,6,4,5,3,4,5,6,
        3,4,5,3,4,6,3,5,4,3, 5,4,3,6,4,5,3,4,5,4,
        5,3,4,6,3,5,4,3,5,4, 3,6,4,5,3,4,5,6,3,4,
        5,3,4,6,3,5,4,3,5,4, 3,6,4,5,3,4,5,4,5,3,
        4,6,3,5,4,3,5,4,3,6, 4,5,3,4,5,6,3,4,5,3,
        4,6,3,5,4,3,5,4,3,6, 4,5,3,4,5,6,3,4,5,3,
        4,6,3,5,4,3
      ];

      const canvas = document.getElementById("t1-sec-dgrid-canvas");
      const cols = 14, rows = 9;
      const cw = 1920, ch = 1080;
      const dotEls = [];
      let idx = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const bx = (c + 0.5) * (cw / cols);
          const by = (r + 0.5) * (ch / rows);
          const ox = OX[idx] || 0;
          const oy = OY[idx] || 0;
          const sz = DS[idx] || 4;
          const d = document.createElement("div");
          d.className = "d";
          d.style.width  = sz + "px";
          d.style.height = sz + "px";
          d.style.left   = (bx + ox - sz/2) + "px";
          d.style.top    = (by + oy - sz/2) + "px";
          d.style.opacity = 0;
          canvas.appendChild(d);
          dotEls.push({ el: d, bx: bx + ox, by: by + oy });
          idx++;
        }
      }

      /* grain */
      tl.fromTo("#t1-sec-dgrid .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom */
      tl.from("#t1-sec-dgrid .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0);

      /* dots fade in staggered, then converge toward centre */
      const cx = cw / 2, cy = ch / 2;
      dotEls.forEach(function(dot, i) {
        const dx = dot.bx - cx;
        const dy = dot.by - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const delay = 0.05 + (i * 0.012);
        /* start offset from current position — further dots start further out */
        const offsetScale = 0.28;
        tl.set(dot.el, { opacity: 0, x: dx * offsetScale, y: dy * offsetScale }, 0);
        tl.to(dot.el,
          { opacity: 0.55 + (Math.abs(OX[i % OX.length]) % 3) * 0.15,
            x: 0, y: 0, duration: 1.2 + (dist / 2000),
            ease: "power3.out" }, delay);
      });

      /* kicker + headline enter after dots are mostly there */
      tl.from("#t1-sec-dgrid .kicker",
        { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.9);
      tl.from("#t1-sec-dgrid .headline",
        { autoAlpha: 0, y: 34, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.1);

      /* slow continued convergence drift — dots drift closer to centre */
      dotEls.forEach(function(dot, i) {
        const dx = dot.bx - cx;
        const dy = dot.by - cy;
        tl.to(dot.el,
          { x: -dx * 0.04, y: -dy * 0.04,
            duration: 4.0, ease: "sine.inOut" }, 2.2);
      });

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-dgrid"] = tl;
    </script>
  </body>
</html>
