<!doctype html>
<!--
  KALLAWAY · tier1 · stat · QUOTESTAT
  A glowing pull-quote where the big stat number lives inline within a short
  declarative sentence. The number blazes white/blue gradient; surrounding prose
  glows softer. Left-aligned, editorial, high-drama.
  Slots: stat (the inline number, e.g. "4.2×"), label (full sentence with {{stat}}
         placeholder already merged), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-qstat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-qstat .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-qstat .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Left vertical accent bar */
      #t1-stat-qstat .accent-bar {
        position: absolute; left: 200px; top: 210px;
        width: 6px; height: 620px; border-radius: 3px;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.9) 20%,
          rgba(var(--accent-rgb), 0.9) 80%,
          transparent 100%);
        box-shadow: var(--glow-accent-lg);
        z-index: 3;
      }

      /* Quote mark ornament */
      #t1-stat-qstat .quotemark {
        position: absolute; left: 228px; top: 175px;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 220px; line-height: 1; color: rgba(var(--accent-rgb), 0.10);
        z-index: 2; user-select: none; pointer-events: none;
        letter-spacing: -0.05em;
      }

      /* Main content block */
      #t1-stat-qstat .content {
        position: absolute; left: 260px; top: 180px; right: 180px;
        z-index: 4; display: flex; flex-direction: column; gap: 0;
      }

      /* The sentence – built of prose spans + stat span */
      #t1-stat-qstat .sentence {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 88px; line-height: 1.12; letter-spacing: var(--track-snug);
        color: var(--text); text-shadow: var(--textglow);
        max-width: 1380px;
      }

      /* The stat number inline */
      #t1-stat-qstat .sentence .stat-inline {
        display: inline-block;
        background: linear-gradient(135deg, #ffffff 10%, rgba(var(--accent-rgb), 0.90) 75%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.65));
        font-size: 1.28em; line-height: 1; vertical-align: baseline;
        letter-spacing: var(--track-tight);
      }

      /* Source */
      #t1-stat-qstat .label-line {
        margin-top: 64px;
        font-family: var(--font-body); font-size: 30px;
        font-weight: var(--wt-med); color: var(--text-dim);
        line-height: 1.5; max-width: 1200px;
      }
      #t1-stat-qstat .label-line em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-qstat .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-qstat .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-qstat .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-qstat" data-composition-id="t1-stat-qstat" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="accent-bar" id="qs-bar"></div>
      <div class="quotemark">&ldquo;</div>

      <div class="content">
        <div class="sentence">
          Students who finish&nbsp;<span class="stat-inline" id="qs-num" data-slot="stat">4.2×</span>&nbsp;more likely<br>to land a <em style="color:var(--accent);text-shadow:var(--textglow-accent);-webkit-text-fill-color:initial;filter:none;">paying role</em> within 90&nbsp;days
        </div>
        <div class="label-line" data-slot="label">
          compared to self-taught peers with <em>no structured curriculum</em> or mentored feedback loop
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS OUTCOMES SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Count-up: stat inline reads "4.2×" — animate 0.0→4.2, keep × suffix */
      const qsNumEl  = document.getElementById("qs-num");
      const qsTarget = 4.2;

      /* grain flicker */
      tl.fromTo("#t1-stat-qstat .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 85px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-qstat .bloom",
          { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-stat-qstat .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* accent bar draws down */
        .from("#t1-stat-qstat .accent-bar",
          { scaleY: 0, transformOrigin: "50% 0%", duration: 0.9, ease: "power4.out" }, 0.45)

        /* quotemark fades */
        .from("#t1-stat-qstat .quotemark",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 0.55)

        /* sentence slides in word-by-word feel: whole block glides */
        .from("#t1-stat-qstat .sentence",
          { autoAlpha: 0, x: -40, filter: "blur(14px)", duration: 1.05, ease: "power4.out" }, 0.65)

        /* count-up the inline stat number 0→4.2× once sentence is visible */
        .to({ val: 0 }, {
          val: qsTarget, duration: 1.4, ease: "power2.out",
          onUpdate: function() {
            qsNumEl.textContent = this.targets()[0].val.toFixed(1) + "×";
          }
        }, 1.00)

        /* stat number pulses its glow after counting finishes */
        .to("#t1-stat-qstat .sentence .stat-inline",
          { filter: "drop-shadow(0 0 48px rgba(55,189,248,0.90)) drop-shadow(0 0 90px rgba(55,189,248,0.45))",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.20)

        /* label */
        .from("#t1-stat-qstat .label-line",
          { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 1.80)

        /* source */
        .from("#t1-stat-qstat .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.20)

        .set({}, {}, 7);

      window.__timelines["t1-stat-qstat"] = tl;
    </script>
  </body>
</html>
