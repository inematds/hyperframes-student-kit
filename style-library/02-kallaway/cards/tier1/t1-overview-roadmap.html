<!doctype html>
<!--
  KALLAWAY · tier1 · overview · ROADMAP
  Horizontal glowing track with 4 milestone nodes + labels. Track draws left-to-right
  via scaleX, nodes pop/spring on staggered, labels fade+blur in.
  Slots: title, m1, m2, m3, m4 (milestone headings), d1, d2, d3, d4 (date/phase labels).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-road {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-road .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-road .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-road .title-row {
        position: absolute; left: 0; right: 0; top: 88px; text-align: center; z-index: 4;
      }
      #t1-ov-road .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1500px; margin: 0 auto;
      }
      #t1-ov-road .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Track container — centers the road */
      #t1-ov-road .track-area {
        position: absolute;
        left: 120px; right: 120px; top: 380px; height: 300px;
        z-index: 4;
      }

      /* The horizontal glowing track line */
      #t1-ov-road .track-line {
        position: absolute; left: 0; right: 0; top: 50%; margin-top: -2px;
        height: 4px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.75) 30%,
          rgba(var(--accent-rgb), 0.90) 50%,
          rgba(var(--accent-rgb), 0.75) 70%,
          rgba(var(--accent-rgb), 0.20) 100%);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.55), 0 0 40px rgba(var(--accent-rgb), 0.25);
        transform-origin: left center;
        border-radius: 2px;
      }
      /* Glow halo under the track */
      #t1-ov-road .track-glow {
        position: absolute; left: 0; right: 0; top: 50%; margin-top: -16px;
        height: 32px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.12) 20%, rgba(var(--accent-rgb), 0.22) 50%, rgba(var(--accent-rgb), 0.12) 80%, transparent);
        filter: blur(8px);
        transform-origin: left center;
      }

      /* Milestone node wrapper — 4 evenly spaced */
      #t1-ov-road .nodes {
        position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: space-between;
        padding: 0 0; /* nodes sit at the very edges + quarters */
      }

      .road-node {
        position: relative; display: flex; flex-direction: column; align-items: center;
        width: 220px;
      }

      /* Glowing disc */
      .road-node .disc {
        width: 52px; height: 52px; border-radius: 50%;
        background: radial-gradient(circle at 38% 30%,
          rgba(255,255,255,0.80) 0%,
          rgba(var(--accent-rgb), 0.90) 28%,
          rgba(var(--accent-rgb), 0.45) 60%,
          transparent 80%);
        border: 1.5px solid rgba(var(--accent-rgb), 0.70);
        box-shadow:
          0 0 18px rgba(var(--accent-rgb), 0.85),
          0 0 50px rgba(var(--accent-rgb), 0.40);
        flex-shrink: 0;
      }

      /* Label above the disc */
      .road-node .phase-label {
        position: absolute; bottom: calc(100% + 20px); left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-mono); font-weight: 700;
        font-size: var(--size-label); color: var(--accent);
        letter-spacing: 0.06em; text-shadow: var(--textglow-accent);
        white-space: nowrap;
        text-transform: uppercase;
      }

      /* Card below the disc */
      .road-node .node-card {
        margin-top: 28px;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        padding: 22px 26px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        text-align: center; min-width: 200px;
        position: relative;
      }
      .road-node .node-card::before {
        content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }
      .road-node .node-heading {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 26px; color: var(--white); letter-spacing: var(--track-snug);
        line-height: 1.25;
      }

      #t1-ov-road .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-road .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-road" data-composition-id="t1-ov-road" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">The <em>Four-Phase</em> Roadmap</div>
      </div>

      <div class="track-area">
        <div class="track-glow" id="road-track-glow"></div>
        <div class="track-line" id="road-track"></div>

        <div class="nodes">
          <div class="road-node" id="rn1">
            <div class="phase-label" data-slot="d1">PHASE 01</div>
            <div class="disc" id="rd1"></div>
            <div class="node-card">
              <div class="node-heading" data-slot="m1">Research &amp; Define</div>
            </div>
          </div>
          <div class="road-node" id="rn2">
            <div class="phase-label" data-slot="d2">PHASE 02</div>
            <div class="disc" id="rd2"></div>
            <div class="node-card">
              <div class="node-heading" data-slot="m2">Build Foundation</div>
            </div>
          </div>
          <div class="road-node" id="rn3">
            <div class="phase-label" data-slot="d3">PHASE 03</div>
            <div class="disc" id="rd3"></div>
            <div class="node-card">
              <div class="node-heading" data-slot="m3">Launch &amp; Iterate</div>
            </div>
          </div>
          <div class="road-node" id="rn4">
            <div class="phase-label" data-slot="d4">PHASE 04</div>
            <div class="disc" id="rd4"></div>
            <div class="node-card">
              <div class="node-heading" data-slot="m4">Scale &amp; Optimize</div>
            </div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-road .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-road .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-road .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-road .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 0.5)

        /* track draws left-to-right */
        .from("#road-track",      { scaleX: 0, transformOrigin: "left center", duration: 1.0, ease: "power3.inOut" }, 1.1)
        .from("#road-track-glow", { scaleX: 0, transformOrigin: "left center", duration: 1.0, ease: "power3.inOut" }, 1.1)

        /* node 1 — pops on, then card slides in */
        .from("#rd1", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(2.2)" }, 1.65)
        .from("#rn1 .phase-label", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.5, ease: "power3.out" }, 1.72)
        .from("#rn1 .node-card",   { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 1.78)

        /* node 2 */
        .from("#rd2", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(2.2)" }, 2.00)
        .from("#rn2 .phase-label", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.5, ease: "power3.out" }, 2.07)
        .from("#rn2 .node-card",   { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 2.13)

        /* node 3 */
        .from("#rd3", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(2.2)" }, 2.35)
        .from("#rn3 .phase-label", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.5, ease: "power3.out" }, 2.42)
        .from("#rn3 .node-card",   { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 2.48)

        /* node 4 */
        .from("#rd4", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(2.2)" }, 2.70)
        .from("#rn4 .phase-label", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.5, ease: "power3.out" }, 2.77)
        .from("#rn4 .node-card",   { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.55, ease: "power3.out" }, 2.83)

        /* breathing glow pulse on all discs — finite */
        .to("#rd1, #rd2, #rd3, #rd4", {
          boxShadow: "0 0 32px rgba(55,189,248,0.95), 0 0 80px rgba(55,189,248,0.50)",
          duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.18
        }, 3.6)

        /* slow hold drift */
        .to("#t1-ov-road .track-area", { y: -10, duration: 4.5, ease: "sine.inOut" }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-ov-road"] = tl;
    </script>
  </body>
</html>
