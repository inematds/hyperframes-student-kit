<!doctype html>
<!--
  KALLAWAY · tier1 · stat · UNDERSCORE
  A huge gradient number occupies the canvas center. After it appears, a glowing
  underline grows outward beneath it — minimal, typographic, confident.
  Slots: kicker (~28 chars uppercase), stat (the big number), label (~70 chars, <em> on one phrase), source (~40 chars uppercase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-uscore {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-uscore .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-uscore .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Centered column */
      #t1-stat-uscore .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 0;
      }

      #t1-stat-uscore .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 36px;
      }

      /* The enormous number */
      #t1-stat-uscore .stat-wrap {
        position: relative;
        display: flex; flex-direction: column; align-items: center;
      }

      #t1-stat-uscore .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 360px;
        line-height: 0.85;
        letter-spacing: -0.04em;
        background: linear-gradient(165deg,
          #ffffff 0%,
          rgba(var(--accent-rgb), 0.75) 55%,
          rgba(var(--accent-rgb), 0.40) 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 50px rgba(var(--accent-rgb), 0.55));
      }

      /* Underline track (dim) — full width of number */
      #t1-stat-uscore .uscore-track {
        width: 820px; height: 7px;
        border-radius: 4px;
        background: rgba(255,255,255,0.06);
        margin-top: 28px;
        position: relative; overflow: visible;
      }
      /* Glowing fill line that grows from center outward */
      #t1-stat-uscore .uscore-fill {
        position: absolute;
        top: 0; left: 50%; height: 100%;
        width: 0%;
        transform: translateX(-50%);
        border-radius: 4px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.6) 0%,
          rgba(255,255,255,0.95) 50%,
          rgba(var(--accent-rgb), 0.6) 100%);
        box-shadow: 0 0 24px 6px rgba(var(--accent-rgb), 0.55),
                    0 0 60px 10px rgba(var(--accent-rgb), 0.25);
      }
      /* Tip dots at each end of the underline */
      #t1-stat-uscore .uscore-dot-l,
      #t1-stat-uscore .uscore-dot-r {
        position: absolute;
        top: 50%; width: 18px; height: 18px; border-radius: 50%;
        transform: translateY(-50%);
        background: #ffffff;
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.9),
                    0 0 30px rgba(var(--accent-rgb), 0.50);
        opacity: 0;
      }
      #t1-stat-uscore .uscore-dot-l { left: -9px; }
      #t1-stat-uscore .uscore-dot-r { right: -9px; }

      #t1-stat-uscore .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
        margin-top: 52px;
      }
      #t1-stat-uscore .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-uscore .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-uscore .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-uscore .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-uscore" data-composition-id="t1-stat-uscore"
         data-start="0" data-width="1920" data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">HOURS SAVED PER WEEK · PER USER</div>

        <div class="stat-wrap">
          <div class="stat" id="t1-stat-uscore-num" data-slot="stat">14</div>

          <div class="uscore-track">
            <div class="uscore-fill" id="t1-stat-uscore-fill"></div>
            <div class="uscore-dot-l" id="t1-stat-uscore-dotl"></div>
            <div class="uscore-dot-r" id="t1-stat-uscore-dotr"></div>
          </div>
        </div>

        <div class="label" data-slot="label">hours per week reclaimed by graduates who apply AI in their daily workflows — <em>that's 2 full working days</em></div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PRODUCTIVITY SURVEY 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl  = document.getElementById("t1-stat-uscore-num");
      const fillEl = document.getElementById("t1-stat-uscore-fill");
      const dotLEl = document.getElementById("t1-stat-uscore-dotl");
      const dotREl = document.getElementById("t1-stat-uscore-dotr");
      const TARGET_VAL = 14;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-uscore .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-uscore .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-uscore .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-uscore .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.5)

        /* big number drops in with blur focus-pull */
        .from("#t1-stat-uscore .stat",
          { autoAlpha: 0, y: 40, scale: 0.92, duration: 1.0, ease: "power4.out" }, 0.70)

        /* number counts up */
        .to({ val: 0 }, {
          val: TARGET_VAL,
          duration: 1.4, ease: "power2.out",
          onUpdate: function() {
            numEl.textContent = Math.round(this.targets()[0].val);
          }
        }, 0.85)

        /* underline track fades in */
        .from("#t1-stat-uscore .uscore-track",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.5)

        /* underline grows outward from center */
        .to("#t1-stat-uscore-fill",
          { width: "100%", duration: 1.0, ease: "power3.out" }, 1.7)

        /* dots appear at tips */
        .to([dotLEl, dotREl],
          { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.5)

        /* label fades in */
        .from("#t1-stat-uscore .label",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.2)

        /* source */
        .from("#t1-stat-uscore .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.5)

        /* breathing glow on the underline */
        .to("#t1-stat-uscore-fill",
          { opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)

        .set({}, {}, 7);

      window.__timelines["t1-stat-uscore"] = tl;
    </script>
  </body>
</html>
