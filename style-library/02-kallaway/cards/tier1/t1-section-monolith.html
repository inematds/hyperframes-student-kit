<!doctype html>
<!--
  KALLAWAY · tier1 · section · MONOLITH
  Full-screen chapter takeover. A tall frosted-glass slab rises from below the
  canvas; the headline and kicker are etched onto its face with a blue glow. The
  slab has a neon rim that lights up as it settles, like a power-on sequence.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-mono {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom from bottom */
      #t1-sec-mono .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-mono .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* The monolith slab */
      #t1-sec-mono .slab-wrap {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 680px; height: 860px;
        z-index: 3;
      }
      #t1-sec-mono .slab {
        position: absolute; inset: 0;
        border-radius: 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow),
                    0 0 0 1.5px var(--glass-border),
                    inset 0 1px 0 var(--glass-hi);
      }
      /* Top inner highlight stripe */
      #t1-sec-mono .slab-hi {
        position: absolute; left: 2px; right: 2px; top: 2px; height: 3px;
        border-radius: 22px 22px 0 0;
        background: linear-gradient(90deg, transparent 5%, var(--glass-hi) 40%, var(--glass-hi) 60%, transparent 95%);
        opacity: 0.7;
      }
      /* Neon rim glow (accent border that lights up) */
      #t1-sec-mono .slab-rim {
        position: absolute; inset: -2px;
        border-radius: 24px;
        box-shadow: 0 0 0 1.5px rgba(var(--accent-rgb), 0.55),
                    0 0 32px 4px rgba(var(--accent-rgb), 0.28),
                    0 0 80px 8px rgba(var(--accent-rgb), 0.12);
        opacity: 0;
      }
      /* Etched horizontal rule above headline */
      #t1-sec-mono .etch-rule {
        position: absolute; left: 60px; right: 60px; top: 290px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.6), transparent);
        box-shadow: 0 0 8px 1px rgba(var(--accent-rgb), 0.4);
      }
      /* Content on the slab face */
      #t1-sec-mono .slab-content {
        position: absolute; left: 60px; right: 60px; top: 190px;
        text-align: center;
      }
      #t1-sec-mono .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); margin-bottom: 28px;
      }
      #t1-sec-mono .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 72px; line-height: 1.08; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        margin-top: 54px;
      }
      #t1-sec-mono .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }
      /* Small glowing dot decorations top/bottom of slab */
      #t1-sec-mono .dot-top,
      #t1-sec-mono .dot-bot {
        position: absolute; left: 50%; width: 8px; height: 8px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px 4px rgba(var(--accent-rgb), 0.7);
      }
      #t1-sec-mono .dot-top { top: 36px; }
      #t1-sec-mono .dot-bot { bottom: 36px; }

      /* Ambient floor glow beneath slab */
      #t1-sec-mono .floor-glow {
        position: absolute; left: 50%; bottom: -60px;
        transform: translateX(-50%);
        width: 900px; height: 200px;
        background: radial-gradient(ellipse at center, rgba(var(--accent-rgb), 0.22) 0%, transparent 70%);
        filter: blur(30px);
        z-index: 2;
      }

      #t1-sec-mono .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-mono .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-mono" data-composition-id="t1-sec-mono" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="floor-glow"></div>

      <div class="slab-wrap">
        <div class="slab">
          <div class="slab-hi"></div>
          <div class="slab-rim"></div>
          <div class="etch-rule"></div>
          <div class="dot-top"></div>
          <div class="dot-bot"></div>
          <div class="slab-content">
            <div class="kicker" data-slot="kicker">— Module 3 —</div>
            <div class="headline" data-slot="headline">Building Your First<br><em>AI-Powered</em> Workflow</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-mono .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-mono .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-mono .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* floor glow blooms */
        .from("#t1-sec-mono .floor-glow",
          { autoAlpha: 0, scaleX: 0.4, duration: 1.2, ease: "expo.out" }, 0.1)

        /* slab rises from below */
        .from("#t1-sec-mono .slab-wrap",
          { autoAlpha: 0, y: 280, duration: 1.3, ease: "power4.out" }, 0.2)

        /* rim lights up after slab settles */
        .to("#t1-sec-mono .slab-rim",
          { autoAlpha: 1, duration: 0.8, ease: "power2.out" }, 1.1)

        /* etch rule draws in */
        .from("#t1-sec-mono .etch-rule",
          { scaleX: 0, transformOrigin: "50% 50%", duration: 0.7, ease: "power3.out" }, 1.4)

        /* kicker fades */
        .from("#t1-sec-mono .kicker",
          { autoAlpha: 0, y: 14, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 1.5)

        /* headline glides in */
        .from("#t1-sec-mono .headline",
          { autoAlpha: 0, y: 30, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.7)

        /* dots pop */
        .from("#t1-sec-mono .dot-top, #t1-sec-mono .dot-bot",
          { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(1.4)" }, 1.9)

        /* breathing rim glow — finite pulse */
        .to("#t1-sec-mono .slab-rim",
          { opacity: 0.45, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-sec-mono"] = tl;
    </script>
  </body>
</html>
