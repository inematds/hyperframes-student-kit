<!doctype html>
<!--
  KALLAWAY · tier1 · section · GLOW-RULE
  Full-screen chapter takeover. A thin, neon-glowing horizontal rule expands from
  center outward across the full canvas width, then the headline glides in above
  the rule and the kicker fades in below it. The rule is the hero visual event —
  a laser line cutting the dark canvas. Accent-blue glow, white core, slow width
  expansion.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-grule {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom — lower opacity; the rule is the light source */
      #t1-sec-grule .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1; opacity: 0.60;
      }
      /* Dot grid */
      #t1-sec-grule .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 55%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 55%, #000 35%, transparent 80%);
      }

      /* ── GLOW RULE ──────────────────────────────────────────────────── */
      #t1-sec-grule .rule-wrap {
        position: absolute;
        left: 0; right: 0;
        top: 50%;
        margin-top: -1px; /* center the 2px rule on the vertical midpoint */
        z-index: 3;
        display: flex; align-items: center; justify-content: center;
      }
      /* The rule itself — starts at 0 width, expands outward */
      #t1-sec-grule .rule {
        width: 1760px; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.55) 8%,
          rgba(var(--accent-rgb), 0.90) 28%,
          rgba(255,255,255,1.0) 45%,
          rgba(var(--accent-rgb), 1.0) 50%,
          rgba(255,255,255,1.0) 55%,
          rgba(var(--accent-rgb), 0.90) 72%,
          rgba(var(--accent-rgb), 0.55) 92%,
          transparent 100%);
        box-shadow:
          0 0 10px 2px rgba(255,255,255,0.80),
          0 0 24px 6px rgba(var(--accent-rgb),0.80),
          0 0 60px 14px rgba(var(--accent-rgb),0.40),
          0 0 120px 28px rgba(var(--accent-rgb),0.18);
        transform-origin: 50% 50%;
        transform: scaleX(0);
      }
      /* Wide halo under the rule — atmosphere */
      #t1-sec-grule .rule-halo {
        position: absolute;
        left: 50%; top: 50%;
        width: 1920px; height: 120px;
        margin-left: -960px; margin-top: -60px;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.08) 50%,
          transparent 80%);
        filter: blur(18px);
        z-index: 2;
        transform: scaleX(0);
        transform-origin: 50% 50%;
      }
      /* Small endpoint nodes at each end of the rule */
      #t1-sec-grule .node-left,
      #t1-sec-grule .node-right {
        position: absolute;
        top: 50%; margin-top: -5px;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--white);
        box-shadow:
          0 0 12px 3px rgba(var(--accent-rgb),0.90),
          0 0 28px 8px rgba(var(--accent-rgb),0.50);
        z-index: 4;
        opacity: 0;
      }
      #t1-sec-grule .node-left  { left:  80px; }
      #t1-sec-grule .node-right { right: 80px; }

      /* ── HEADLINE (above rule) ─────────────────────────────────────── */
      #t1-sec-grule .headline {
        position: absolute;
        left: 0; right: 0;
        top: calc(50% - 220px);
        text-align: center; z-index: 4;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        padding: 0 80px;
      }
      #t1-sec-grule .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* ── KICKER (below rule) ────────────────────────────────────────── */
      #t1-sec-grule .kicker {
        position: absolute;
        left: 0; right: 0;
        top: calc(50% + 55px);
        text-align: center; z-index: 4;
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-grule .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-grule .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-grule" data-composition-id="t1-sec-grule" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="rule-halo"></div>
      <div class="rule-wrap">
        <div class="rule"></div>
      </div>
      <div class="node-left"></div>
      <div class="node-right"></div>

      <div class="headline" data-slot="headline">Build Courses That <em>Sell Themselves</em></div>
      <div class="kicker" data-slot="kicker">— Module 5 —</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-grule .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-grule .bloom",
            { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-grule .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Halo expands first (behind the rule, soft) */
      tl.to("#t1-sec-grule .rule-halo",
            { scaleX: 1, autoAlpha: 1, transformOrigin: "50% 50%", duration: 0.90, ease: "power3.out" }, 0.30);

      /* Rule draws from center outward — the hero event */
      tl.to("#t1-sec-grule .rule",
            { scaleX: 1, transformOrigin: "50% 50%", duration: 0.75, ease: "power4.out" }, 0.45);

      /* Endpoint nodes pop on as rule reaches them */
      tl.to("#t1-sec-grule .node-left",
            { autoAlpha: 1, scale: 1.4, transformOrigin: "50% 50%", duration: 0.20, ease: "power2.out" }, 1.15);
      tl.to("#t1-sec-grule .node-left",
            { scale: 1.0, duration: 0.25, ease: "back.out(2.0)" }, 1.35);
      tl.to("#t1-sec-grule .node-right",
            { autoAlpha: 1, scale: 1.4, transformOrigin: "50% 50%", duration: 0.20, ease: "power2.out" }, 1.15);
      tl.to("#t1-sec-grule .node-right",
            { scale: 1.0, duration: 0.25, ease: "back.out(2.0)" }, 1.35);

      /* Headline glides down from above */
      tl.from("#t1-sec-grule .headline",
            { autoAlpha: 0, y: -40, filter: "blur(14px)", duration: 0.90, ease: "power4.out" }, 0.85);

      /* Kicker glides up from below */
      tl.from("#t1-sec-grule .kicker",
            { autoAlpha: 0, y:  30, filter: "blur(8px)",  duration: 0.75, ease: "power3.out" }, 1.05);

      /* Rule glow pulse — finite */
      tl.to("#t1-sec-grule .rule",
            { boxShadow: "0 0 18px 4px rgba(255,255,255,0.90), 0 0 44px 12px rgba(var(--accent-rgb),1.0), 0 0 90px 22px rgba(var(--accent-rgb),0.50), 0 0 180px 40px rgba(var(--accent-rgb),0.22)",
              duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0);

      /* Slow bloom drift */
      tl.to("#t1-sec-grule .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-grule"] = tl;
    </script>
  </body>
</html>
