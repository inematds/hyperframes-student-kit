<!doctype html>
<!--
  KALLAWAY · tier1 · overview · LOGOWALL
  Full-screen takeover. A grid of 6 glowing rounded-square brand/logo
  placeholder tiles with optional labels below each. Tiles spring in
  staggered with a soft accent glow rim on hover-frame; bloom rises first.
  Slots: title, l1_name–l6_name, l1_label–l6_label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-logos {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-ov-logos .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Corner bloom accent */
      #t1-ov-logos .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner); z-index: 1;
        opacity: 0.5;
      }
      /* Dot grid */
      #t1-ov-logos .grid-bg {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.44;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-logos .title-row {
        position: absolute; left: 0; right: 0; top: 84px; text-align: center; z-index: 4;
      }
      #t1-ov-logos .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-logos .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Logo wall grid — 6 tiles in a 3x2 layout */
      #t1-ov-logos .logo-wall {
        position: absolute; left: 0; right: 0; top: 248px;
        display: flex; justify-content: center; align-items: flex-start;
        gap: 48px; flex-wrap: wrap;
        padding: 0 160px; z-index: 4;
      }

      /* Individual logo cell */
      #t1-ov-logos .logo-cell {
        display: flex; flex-direction: column; align-items: center; gap: 22px;
        width: 240px;
      }

      /* Rounded-square glass logo tile */
      #t1-ov-logos .logo-tile {
        width: 200px; height: 200px;
        border-radius: var(--radius);
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        box-shadow: var(--glass-shadow), 0 0 32px rgba(var(--accent-rgb), 0.10);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
        flex-shrink: 0;
      }
      /* Top hairline */
      #t1-ov-logos .logo-tile::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }
      /* Soft inner glow rim (neon edge) */
      #t1-ov-logos .logo-tile::after {
        content: ""; position: absolute; inset: 0; border-radius: var(--radius);
        box-shadow: inset 0 0 24px rgba(var(--accent-rgb), 0.12);
      }

      /* Logo placeholder SVG inside tile */
      #t1-ov-logos .logo-tile svg {
        width: 88px; height: 88px; stroke: rgba(var(--accent-rgb), 0.80); fill: none; stroke-width: 1.6;
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.55));
      }

      /* Monogram text fallback */
      #t1-ov-logos .logo-monogram {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 64px; letter-spacing: -0.02em;
        color: rgba(var(--accent-rgb), 0.80);
        text-shadow: 0 0 18px rgba(var(--accent-rgb), 0.50);
        line-height: 1;
      }

      /* Name label under the tile */
      #t1-ov-logos .logo-name {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 28px; letter-spacing: var(--track-snug); line-height: 1.2;
        color: var(--white); text-shadow: var(--textglow); text-align: center;
      }

      /* Optional sub-label */
      #t1-ov-logos .logo-sublabel {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: var(--size-label); line-height: 1.3;
        color: var(--text-dim); text-align: center; margin-top: -10px;
      }

      #t1-ov-logos .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-logos .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-logos" data-composition-id="t1-ov-logos" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid-bg"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Platforms That <em>Power This</em></div>
      </div>

      <div class="logo-wall">

        <div class="logo-cell" id="lw-l1">
          <div class="logo-tile">
            <!-- Placeholder: abstract circuit node -->
            <svg viewBox="0 0 88 88">
              <circle cx="44" cy="44" r="18"/>
              <circle cx="44" cy="44" r="6" fill="var(--accent)" stroke="none"/>
              <line x1="44" y1="8" x2="44" y2="26"/>
              <line x1="44" y1="62" x2="44" y2="80"/>
              <line x1="8" y1="44" x2="26" y2="44"/>
              <line x1="62" y1="44" x2="80" y2="44"/>
              <circle cx="44" cy="8" r="3" fill="none" stroke-width="1.6"/>
              <circle cx="44" cy="80" r="3" fill="none" stroke-width="1.6"/>
              <circle cx="8" cy="44" r="3" fill="none" stroke-width="1.6"/>
              <circle cx="80" cy="44" r="3" fill="none" stroke-width="1.6"/>
            </svg>
          </div>
          <div class="logo-name" data-slot="l1_name">Platform A</div>
          <div class="logo-sublabel" data-slot="l1_label">AI Infra</div>
        </div>

        <div class="logo-cell" id="lw-l2">
          <div class="logo-tile">
            <!-- Placeholder: stacked layers -->
            <svg viewBox="0 0 88 88">
              <polygon points="44,14 76,30 44,46 12,30"/>
              <polyline points="12,44 44,60 76,44"/>
              <polyline points="12,58 44,74 76,58"/>
            </svg>
          </div>
          <div class="logo-name" data-slot="l2_name">Platform B</div>
          <div class="logo-sublabel" data-slot="l2_label">Cloud Compute</div>
        </div>

        <div class="logo-cell" id="lw-l3">
          <div class="logo-tile">
            <!-- Placeholder: hexagonal ring -->
            <svg viewBox="0 0 88 88">
              <polygon points="44,8 72,24 72,56 44,72 16,56 16,24"/>
              <polygon points="44,26 58,34 58,50 44,58 30,50 30,34"/>
            </svg>
          </div>
          <div class="logo-name" data-slot="l3_name">Platform C</div>
          <div class="logo-sublabel" data-slot="l3_label">Orchestration</div>
        </div>

        <div class="logo-cell" id="lw-l4">
          <div class="logo-tile">
            <!-- Placeholder: lightning bolt -->
            <svg viewBox="0 0 88 88">
              <polyline points="52,8 28,46 48,46 36,80"/>
              <line x1="28" y1="46" x2="48" y2="46"/>
            </svg>
          </div>
          <div class="logo-name" data-slot="l4_name">Platform D</div>
          <div class="logo-sublabel" data-slot="l4_label">Edge Inference</div>
        </div>

        <div class="logo-cell" id="lw-l5">
          <div class="logo-tile">
            <!-- Placeholder: bracket/code symbol -->
            <svg viewBox="0 0 88 88">
              <path d="M34 18 L18 44 L34 70"/>
              <path d="M54 18 L70 44 L54 70"/>
              <line x1="38" y1="44" x2="50" y2="44" stroke-dasharray="4 3"/>
            </svg>
          </div>
          <div class="logo-name" data-slot="l5_name">Platform E</div>
          <div class="logo-sublabel" data-slot="l5_label">Dev Tools</div>
        </div>

        <div class="logo-cell" id="lw-l6">
          <div class="logo-tile">
            <!-- Placeholder: eye / observer -->
            <svg viewBox="0 0 88 88">
              <path d="M8 44 C24 18 64 18 80 44 C64 70 24 70 8 44 Z"/>
              <circle cx="44" cy="44" r="13"/>
              <circle cx="44" cy="44" r="5" fill="var(--accent)" stroke="none"/>
            </svg>
          </div>
          <div class="logo-name" data-slot="l6_name">Platform F</div>
          <div class="logo-sublabel" data-slot="l6_label">Observability</div>
        </div>

      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-logos .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "86px 64px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-logos .bloom",        { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-logos .bloom-corner", { autoAlpha: 0, duration: 1.8, ease: "power2.out" }, 0.3)
        .from("#t1-ov-logos .grid-bg",      { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title glides in */
        .from("#t1-ov-logos .title", { autoAlpha: 0, y: 26, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* 6 logo cells stagger in — 0.14s apart, scale+blur spring */
        .from("#lw-l1", { autoAlpha: 0, y: 44, scale: 0.88, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.80, ease: "back.out(1.4)" }, 1.0)
        .from("#lw-l2", { autoAlpha: 0, y: 44, scale: 0.88, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.80, ease: "back.out(1.4)" }, 1.14)
        .from("#lw-l3", { autoAlpha: 0, y: 44, scale: 0.88, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.80, ease: "back.out(1.4)" }, 1.28)
        .from("#lw-l4", { autoAlpha: 0, y: 44, scale: 0.88, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.80, ease: "back.out(1.4)" }, 1.42)
        .from("#lw-l5", { autoAlpha: 0, y: 44, scale: 0.88, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.80, ease: "back.out(1.4)" }, 1.56)
        .from("#lw-l6", { autoAlpha: 0, y: 44, scale: 0.88, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.80, ease: "back.out(1.4)" }, 1.70)

        /* sequential icon glow pulse — one tile at a time, finite */
        .to("#lw-l1 .logo-tile", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 60px rgba(55,189,248,0.30)",
          duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.4)
        .to("#lw-l4 .logo-tile", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 60px rgba(55,189,248,0.30)",
          duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.2)

        /* slow hold drift */
        .to("#t1-ov-logos .logo-wall", { y: -10, duration: 5.0, ease: "sine.inOut" }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t1-ov-logos"] = tl;
    </script>
  </body>
</html>
