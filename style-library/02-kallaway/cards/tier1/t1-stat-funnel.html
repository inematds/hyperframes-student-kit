<!doctype html>
<!--
  KALLAWAY · tier1 · stat · FUNNEL
  A centre-aligned funnel of 4 narrowing glowing bands, each labeled with a
  stage name and a number. Bands drop in with stagger; the final (narrowest)
  conversion row is highlighted in accent blue with extra glow.
  Slots: kicker, stat (the headline conversion % — shown above funnel),
         label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-funnel {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-funnel .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-funnel .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-stat-funnel .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; align-items: center;
        padding: 0 var(--pad);
        gap: 80px;
      }

      /* ---- left: kicker + big stat + label ---- */
      #t1-stat-funnel .left {
        display: flex; flex-direction: column; gap: 32px;
        flex: 0 0 460px;
      }

      #t1-stat-funnel .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      #t1-stat-funnel .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 160px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 0%, rgba(var(--accent-rgb), 0.85) 90%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-funnel .label {
        font-family: var(--font-body);
        font-size: 28px;
        font-weight: var(--wt-med);
        color: var(--text-dim);
        line-height: 1.5;
        max-width: 420px;
      }
      #t1-stat-funnel .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* ---- right: funnel ---- */
      #t1-stat-funnel .right {
        flex: 1;
        display: flex; flex-direction: column;
        align-items: center; gap: 0;
      }

      /* funnel band row */
      #t1-stat-funnel .band-row {
        display: flex; align-items: center;
        width: 100%;
        margin-bottom: 4px;
      }

      #t1-stat-funnel .band {
        flex: 0 0 auto;
        height: 82px;
        border-radius: var(--radius-sm);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 32px;
        margin: 0 auto;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        border-top: var(--stroke) solid var(--glass-hi);
        box-shadow: var(--glass-shadow),
                    0 0 20px rgba(var(--accent-rgb), 0.08);
      }

      /* width per tier: 860 680 500 360 px */
      #t1-stat-funnel .band-1 { width: 860px; }
      #t1-stat-funnel .band-2 { width: 680px; }
      #t1-stat-funnel .band-3 { width: 500px; }
      #t1-stat-funnel .band-4 {
        width: 360px;
        background: rgba(var(--accent-rgb), 0.12);
        border-top: var(--stroke) solid rgba(var(--accent-rgb), 0.45);
        box-shadow: var(--glass-shadow),
                    0 0 36px rgba(var(--accent-rgb), 0.25),
                    inset 0 1px 0 rgba(var(--accent-rgb), 0.30);
      }

      #t1-stat-funnel .band-stage {
        font-family: var(--font-body);
        font-size: 22px;
        font-weight: var(--wt-semi);
        color: var(--text-dim);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #t1-stat-funnel .band-4 .band-stage {
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      #t1-stat-funnel .band-val {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 44px;
        color: var(--text);
        text-shadow: var(--textglow);
      }
      #t1-stat-funnel .band-4 .band-val {
        color: var(--accent);
        text-shadow: var(--textglow-accent),
                     0 0 40px rgba(var(--accent-rgb), 0.55);
        font-size: 54px;
      }

      /* arrow connector between bands */
      #t1-stat-funnel .arrow {
        width: 0; height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 14px solid rgba(255,255,255,0.10);
        margin: 0 auto;
      }
      #t1-stat-funnel .arrow-3 {
        border-top-color: rgba(var(--accent-rgb), 0.25);
      }

      #t1-stat-funnel .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-funnel .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-funnel .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-funnel" data-composition-id="t1-stat-funnel" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <!-- left -->
        <div class="left">
          <div class="kicker" data-slot="kicker">ENROLLMENT FUNNEL · Q4</div>
          <div class="stat" data-slot="stat">18%</div>
          <div class="label" data-slot="label">of visitors who hit the landing page become <em>paying graduates</em></div>
        </div>

        <!-- right funnel -->
        <div class="right">
          <div class="band-row">
            <div class="band band-1">
              <span class="band-stage">Page Visit</span>
              <span class="band-val">24,800</span>
            </div>
          </div>
          <div class="arrow"></div>
          <div class="band-row">
            <div class="band band-2">
              <span class="band-stage">Free Lesson</span>
              <span class="band-val">9,300</span>
            </div>
          </div>
          <div class="arrow"></div>
          <div class="band-row">
            <div class="band band-3">
              <span class="band-stage">Enrolled</span>
              <span class="band-val">4,100</span>
            </div>
          </div>
          <div class="arrow arrow-3"></div>
          <div class="band-row">
            <div class="band band-4">
              <span class="band-stage">Graduated</span>
              <span class="band-val">4,464</span>
            </div>
          </div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · FUNNEL ANALYTICS Q4 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const bandEls  = document.querySelectorAll("#t1-stat-funnel .band");
      const arrowEls = document.querySelectorAll("#t1-stat-funnel .arrow");

      /* grain flicker */
      tl.fromTo("#t1-stat-funnel .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-funnel .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-funnel .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker + stat */
        .from("#t1-stat-funnel .kicker",
          { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.45)
        .from("#t1-stat-funnel .stat",
          { autoAlpha: 0, y: 30, duration: 0.9, ease: "power4.out" }, 0.60)

        /* bands drop in with stagger — wide first, narrow last */
        .from(bandEls, {
          autoAlpha: 0, scaleX: 0.5, y: -20,
          transformOrigin: "50% 50%",
          duration: 0.65, ease: "back.out(1.3)",
          stagger: 0.18
        }, 0.80)

        /* arrows */
        .from(arrowEls, {
          autoAlpha: 0, duration: 0.3, ease: "power2.out", stagger: 0.18
        }, 1.00)

        /* label */
        .from("#t1-stat-funnel .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 1.90)

        /* source */
        .from("#t1-stat-funnel .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.30)

        /* final band breathing glow */
        .to("#t1-stat-funnel .band-4",
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 60px rgba(55,189,248,0.40), inset 0 1px 0 rgba(55,189,248,0.50)",
            duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.70)

        .set({}, {}, 7);

      window.__timelines["t1-stat-funnel"] = tl;
    </script>
  </body>
</html>
