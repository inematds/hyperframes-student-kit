<!doctype html>
<!--
  KALLAWAY · tier1 · section · STACKED-WORDS
  Full-screen chapter takeover. Three lines of text each live on their own frosted
  glass slab. Slabs stack into view from alternating sides (left / right / left),
  snapping into a centred column like a well-timed card deck.
  Slots: line1 (~24 chars), line2 (~24 chars), line3 (~24 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-swords {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Bloom */
      #t1-sec-swords .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-swords .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.42;
        -webkit-mask-image: radial-gradient(110% 95% at 50% 58%, #000 30%, transparent 76%);
                mask-image: radial-gradient(110% 95% at 50% 58%, #000 30%, transparent 76%);
      }

      /* Slab stack column — centred */
      #t1-sec-swords .stack {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; gap: 24px;
        align-items: stretch; width: 1260px;
        z-index: 4;
      }

      /* Individual slab */
      #t1-sec-swords .slab {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        padding: 36px 72px;
        display: flex; align-items: center; justify-content: center;
        min-height: 132px;
        position: relative; overflow: hidden;
      }
      /* Neon top-edge accent per slab (different intensity) */
      #t1-sec-swords .slab::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg,
          transparent 5%,
          rgba(var(--accent-rgb), 0.70) 30%,
          rgba(255,255,255,0.85) 50%,
          rgba(var(--accent-rgb), 0.70) 70%,
          transparent 95%);
      }
      /* Left accent side-bar — only on first slab */
      #t1-sec-swords .slab:nth-child(1)::after {
        content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px;
        background: var(--accent);
        box-shadow: var(--glow-accent);
        border-radius: 2px;
      }
      /* Right side-bar on second slab */
      #t1-sec-swords .slab:nth-child(2)::after {
        content: ""; position: absolute; right: 0; top: 20%; bottom: 20%; width: 3px;
        background: rgba(var(--accent-rgb), 0.55);
        box-shadow: var(--glow-accent-sm);
        border-radius: 2px;
      }

      #t1-sec-swords .slab-text {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 88px; line-height: 1.0; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center;
      }
      /* Second slab — accent gradient text */
      #t1-sec-swords .slab:nth-child(2) .slab-text {
        background: linear-gradient(90deg, var(--white) 0%, var(--accent) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        /* No text-shadow on gradient-clipped text to avoid filter trap */
        text-shadow: none;
      }
      /* Third slab — dimmer, supporting */
      #t1-sec-swords .slab:nth-child(3) .slab-text {
        font-size: 56px; font-weight: var(--wt-semi);
        color: var(--text-dim); text-shadow: none;
        letter-spacing: var(--track-wide); text-transform: uppercase;
        font-family: var(--font-mono);
      }

      #t1-sec-swords .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-swords .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-swords" data-composition-id="t1-sec-swords" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="stack">
        <div class="slab" id="t1-sec-swords-slab1">
          <span class="slab-text" data-slot="line1">Build AI Products</span>
        </div>
        <div class="slab" id="t1-sec-swords-slab2">
          <span class="slab-text" data-slot="line2">That Actually Scale</span>
        </div>
        <div class="slab" id="t1-sec-swords-slab3">
          <span class="slab-text" data-slot="line3">— Module 05 · Deployment —</span>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-swords .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-swords .bloom", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.5, ease: "expo.out" }, 0)
        .from("#t1-sec-swords .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Slab 1 — slides in from the LEFT */
      tl.from("#t1-sec-swords-slab1", {
        autoAlpha: 0, x: -340, duration: 0.75, ease: "back.out(1.4)"
      }, 0.45);

      /* Slab 2 — slides in from the RIGHT */
      tl.from("#t1-sec-swords-slab2", {
        autoAlpha: 0, x: 340, duration: 0.75, ease: "back.out(1.4)"
      }, 0.80);

      /* Slab 3 — slides in from the LEFT again */
      tl.from("#t1-sec-swords-slab3", {
        autoAlpha: 0, x: -280, duration: 0.70, ease: "back.out(1.4)"
      }, 1.15);

      /* Subtle scale micro-breath on all slabs during the hold — finite */
      tl.to("#t1-sec-swords .slab", {
        boxShadow: "var(--glass-shadow), inset 0 1px 0 var(--glass-hi), 0 0 50px rgba(var(--accent-rgb), 0.12)",
        duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true, stagger: 0.15
      }, 2.2);

      /* Slow upward drift of the whole stack during hold */
      tl.to("#t1-sec-swords .stack", { y: -16, duration: 4.5, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-swords"] = tl;
    </script>
  </body>
</html>
