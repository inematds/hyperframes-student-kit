<!doctype html>
<!--
  KALLAWAY · tier1 · overview · PROS / CONS
  Full-screen takeover. Left column: 3 pros with accent + glyphs.
  Right column: 3 cons with red − glyphs. Clean geometric symbols, not scribbles.
  Slots: title, pro1, pro2, pro3, con1, con2, con3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-procons {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Ambience */
      #t1-ov-procons .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-procons .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner); z-index: 1; opacity: 0.45;
      }
      #t1-ov-procons .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.40;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 25%, transparent 75%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 25%, transparent 75%);
      }

      /* Title */
      #t1-ov-procons .title-row {
        position: absolute; left: 0; right: 0; top: 68px; text-align: center; z-index: 4;
      }
      #t1-ov-procons .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-procons .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Two-column layout */
      #t1-ov-procons .columns {
        position: absolute; left: 120px; right: 120px; top: 210px; bottom: 80px;
        display: flex; gap: 60px; z-index: 4;
      }

      /* Each panel */
      #t1-ov-procons .panel {
        flex: 1;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-lg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow);
        padding: 56px 60px 52px;
        display: flex; flex-direction: column; gap: 0;
        position: relative; overflow: hidden;
      }
      /* Hairline top highlight */
      #t1-ov-procons .panel::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 20%, var(--glass-hi) 80%, transparent);
      }

      /* Panel header */
      #t1-ov-procons .panel-hdr {
        display: flex; align-items: center; gap: 18px; margin-bottom: 40px;
      }
      #t1-ov-procons .panel-icon {
        width: 56px; height: 56px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: var(--wt-black); line-height: 1; flex-shrink: 0;
      }
      #t1-ov-procons .pros .panel-icon {
        background: rgba(var(--accent-rgb), 0.12);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.55);
        color: var(--accent);
        box-shadow: 0 0 18px rgba(var(--accent-rgb),0.35);
      }
      #t1-ov-procons .cons .panel-icon {
        background: rgba(var(--alert-rgb), 0.12);
        border: var(--stroke) solid rgba(var(--alert-rgb), 0.55);
        color: var(--alert);
        box-shadow: 0 0 18px rgba(var(--alert-rgb),0.30);
      }
      #t1-ov-procons .panel-label {
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
      }
      #t1-ov-procons .pros .panel-label { color: var(--accent); text-shadow: var(--textglow-accent); }
      #t1-ov-procons .cons .panel-label { color: var(--alert); text-shadow: 0 0 14px rgba(var(--alert-rgb),0.55); }

      /* Divider under header */
      #t1-ov-procons .panel-rule {
        height: 1px; margin-bottom: 36px;
        transform: scaleX(0); transform-origin: left center;
      }
      #t1-ov-procons .pros .panel-rule {
        background: linear-gradient(90deg, rgba(var(--accent-rgb),0.60), transparent 85%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb),0.25);
      }
      #t1-ov-procons .cons .panel-rule {
        background: linear-gradient(90deg, rgba(var(--alert-rgb),0.55), transparent 85%);
        box-shadow: 0 0 10px rgba(var(--alert-rgb),0.20);
      }

      /* List items */
      #t1-ov-procons .items {
        display: flex; flex-direction: column; gap: 0; flex: 1;
      }
      #t1-ov-procons .item {
        display: flex; align-items: flex-start; gap: 22px;
        padding: 22px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      #t1-ov-procons .item:last-child { border-bottom: none; }

      /* Glyph — clean geometric plus / minus */
      #t1-ov-procons .glyph {
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; margin-top: 2px;
        font-size: 22px; font-weight: var(--wt-black); line-height: 1;
      }
      #t1-ov-procons .pros .glyph {
        background: rgba(var(--accent-rgb), 0.10);
        border: 1.5px solid rgba(var(--accent-rgb), 0.60);
        color: var(--accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb),0.40);
      }
      #t1-ov-procons .cons .glyph {
        background: rgba(var(--alert-rgb), 0.10);
        border: 1.5px solid rgba(var(--alert-rgb), 0.55);
        color: var(--alert);
        box-shadow: 0 0 10px rgba(var(--alert-rgb),0.30);
      }

      #t1-ov-procons .item-text {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 30px; line-height: 1.45; color: var(--text);
        padding-top: 2px;
      }

      /* Left accent bar on each panel */
      #t1-ov-procons .pros { border-left: 3px solid rgba(var(--accent-rgb),0.55); }
      #t1-ov-procons .pros { box-shadow: var(--glass-shadow), -4px 0 22px rgba(var(--accent-rgb),0.10); }
      #t1-ov-procons .cons { border-left: 3px solid rgba(var(--alert-rgb),0.50); }
      #t1-ov-procons .cons { box-shadow: var(--glass-shadow), -4px 0 22px rgba(var(--alert-rgb),0.08); }

      #t1-ov-procons .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-procons .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-procons" data-composition-id="t1-ov-procons" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Breaking It <em>Down</em></div>
      </div>

      <div class="columns">
        <!-- Pros -->
        <div class="panel pros" id="pc-pros">
          <div class="panel-hdr">
            <div class="panel-icon">+</div>
            <div class="panel-label">Advantages</div>
          </div>
          <div class="panel-rule" id="pc-pros-rule"></div>
          <div class="items">
            <div class="item" id="pc-p1">
              <div class="glyph">+</div>
              <div class="item-text" data-slot="pro1">Ships fast, real user feedback</div>
            </div>
            <div class="item" id="pc-p2">
              <div class="glyph">+</div>
              <div class="item-text" data-slot="pro2">Low upfront capital required</div>
            </div>
            <div class="item" id="pc-p3">
              <div class="glyph">+</div>
              <div class="item-text" data-slot="pro3">Iterates faster than competitors</div>
            </div>
          </div>
        </div>

        <!-- Cons -->
        <div class="panel cons" id="pc-cons">
          <div class="panel-hdr">
            <div class="panel-icon">−</div>
            <div class="panel-label">Disadvantages</div>
          </div>
          <div class="panel-rule" id="pc-cons-rule"></div>
          <div class="items">
            <div class="item" id="pc-c1">
              <div class="glyph">−</div>
              <div class="item-text" data-slot="con1">Technical debt accumulates</div>
            </div>
            <div class="item" id="pc-c2">
              <div class="glyph">−</div>
              <div class="item-text" data-slot="con2">Bugs damage early reputation</div>
            </div>
            <div class="item" id="pc-c3">
              <div class="glyph">−</div>
              <div class="item-text" data-slot="con3">Refactoring costs multiply later</div>
            </div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-procons .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "105px 82px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-procons .bloom",        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-procons .bloom-corner",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.25)
        .from("#t1-ov-procons .grid",          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-procons .title",         { autoAlpha: 0, y: 24, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* panels spring in from each side */
        .from("#pc-pros",                      { autoAlpha: 0, x: -70, scale: 0.96, transformOrigin: "0% 50%",
                                                 filter: "blur(12px)", duration: 0.9, ease: "back.out(1.4)" }, 1.0)
        .from("#pc-cons",                      { autoAlpha: 0, x: 70,  scale: 0.96, transformOrigin: "100% 50%",
                                                 filter: "blur(12px)", duration: 0.9, ease: "back.out(1.4)" }, 1.15)

        /* divider rules draw */
        .to("#pc-pros-rule",                   { scaleX: 1, duration: 0.65, ease: "power3.out" }, 1.6)
        .to("#pc-cons-rule",                   { scaleX: 1, duration: 0.65, ease: "power3.out" }, 1.72)

        /* pros items fade-up staggered */
        .from("#pc-p1",                        { autoAlpha: 0, y: 22, duration: 0.6, ease: "power3.out" }, 1.8)
        .from("#pc-p2",                        { autoAlpha: 0, y: 22, duration: 0.6, ease: "power3.out" }, 1.95)
        .from("#pc-p3",                        { autoAlpha: 0, y: 22, duration: 0.6, ease: "power3.out" }, 2.10)

        /* cons items staggered */
        .from("#pc-c1",                        { autoAlpha: 0, y: 22, duration: 0.6, ease: "power3.out" }, 1.88)
        .from("#pc-c2",                        { autoAlpha: 0, y: 22, duration: 0.6, ease: "power3.out" }, 2.03)
        .from("#pc-c3",                        { autoAlpha: 0, y: 22, duration: 0.6, ease: "power3.out" }, 2.18)

        /* pros glyph glow pulse */
        .to("#pc-pros .glyph",                 { boxShadow: "0 0 22px rgba(55,189,248,0.70), 0 0 50px rgba(55,189,248,0.30)", duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.1 }, 2.7)
        /* cons glyph glow pulse */
        .to("#pc-cons .glyph",                 { boxShadow: "0 0 20px rgba(255,59,48,0.65), 0 0 44px rgba(255,59,48,0.25)", duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.1 }, 2.85)

        /* slow hold drift */
        .to("#t1-ov-procons .columns",         { y: -8, duration: 5.0, ease: "sine.inOut" }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-ov-procons"] = tl;
    </script>
  </body>
</html>
