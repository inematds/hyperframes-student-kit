<!doctype html>
<!--
  KALLAWAY · tier1 · section · EMBLEM
  Full-screen chapter takeover. A glowing circular emblem/badge animates in from
  above center — scaling up with a bloom burst — displaying a short 2-3 letter
  mark or glyph. Then the headline slides in below it. The emblem sits on a glass
  disc with a neon rim and a radiant glow halo.
  Slots: emblem (2-3 chars or glyph), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-emblem {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-emblem .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Corner accent bloom — adds depth from top-right */
      #t1-sec-emblem .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner);
        z-index: 1; opacity: 0.55;
      }
      /* Dot grid */
      #t1-sec-emblem .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.46;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 52%, #000 30%, transparent 76%);
                mask-image: radial-gradient(120% 100% at 50% 52%, #000 30%, transparent 76%);
      }

      /* ── EMBLEM ──────────────────────────────────────────────────────── */
      #t1-sec-emblem .emblem-wrap {
        position: absolute;
        left: 50%; top: 188px;
        width: 280px; height: 280px;
        margin-left: -140px;
        z-index: 3;
      }
      /* Outer halo glow — wide soft radiance */
      #t1-sec-emblem .emblem-halo {
        position: absolute;
        inset: -60px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--accent-rgb), 0.50) 0%,
          rgba(var(--accent-rgb), 0.20) 38%,
          transparent 65%);
        filter: blur(20px);
        z-index: -1;
      }
      /* Glass disc */
      #t1-sec-emblem .emblem-disc {
        position: absolute; inset: 0;
        border-radius: 50%;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.55);
        box-shadow:
          inset 0 1.5px 0 var(--glass-hi),
          0 0 48px 10px rgba(var(--accent-rgb), 0.35),
          0 0 120px 24px rgba(var(--accent-rgb), 0.16),
          var(--glass-shadow);
      }
      /* Neon ring — slightly outside the glass disc */
      #t1-sec-emblem .emblem-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.70);
        box-shadow:
          0 0 14px 3px rgba(var(--accent-rgb), 0.50),
          inset 0 0 10px 2px rgba(var(--accent-rgb), 0.20);
      }
      /* The mark / glyph text */
      #t1-sec-emblem .emblem-mark {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 100px; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow-accent);
      }
      /* Subtle scan-line on the disc */
      #t1-sec-emblem .emblem-scan {
        position: absolute; inset: 0; border-radius: 50%;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.08) 0%, transparent 50%);
      }

      /* ── HEADLINE ────────────────────────────────────────────────────── */
      #t1-sec-emblem .content {
        position: absolute; left: 0; right: 0;
        top: 510px;
        text-align: center; z-index: 4;
      }
      /* Divider rule between emblem and headline */
      #t1-sec-emblem .rule {
        width: 380px; height: 1.5px;
        margin: 0 auto 40px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.70) 30%,
          rgba(255,255,255,0.55) 50%,
          rgba(var(--accent-rgb), 0.70) 70%,
          transparent 100%);
        box-shadow: 0 0 12px 2px rgba(var(--accent-rgb), 0.40);
      }
      #t1-sec-emblem .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1320px; margin: 0 auto; padding: 0 80px;
      }
      #t1-sec-emblem .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-emblem .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-emblem .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-emblem" data-composition-id="t1-sec-emblem" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <div class="emblem-wrap">
        <div class="emblem-halo"></div>
        <div class="emblem-disc"></div>
        <div class="emblem-ring"></div>
        <div class="emblem-scan"></div>
        <div class="emblem-mark" data-slot="emblem">AI</div>
      </div>

      <div class="content">
        <div class="rule"></div>
        <div class="headline" data-slot="headline">Intelligence<br>Isn't Magic — <em>It's Math</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-emblem .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-emblem .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-emblem .bloom-corner",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.3)
        .from("#t1-sec-emblem .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Emblem slams in from above with spring overshoot */
      tl.from("#t1-sec-emblem .emblem-wrap",
            { autoAlpha: 0, y: -80, scale: 0.55, transformOrigin: "50% 50%", duration: 0.85, ease: "back.out(1.7)" }, 0.35);

      /* Halo blooms outward on arrival */
      tl.from("#t1-sec-emblem .emblem-halo",
            { scale: 0.2, autoAlpha: 0, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.50);

      /* Ring spins into position — subtle rotation */
      tl.from("#t1-sec-emblem .emblem-ring",
            { rotation: -90, autoAlpha: 0, transformOrigin: "50% 50%", duration: 0.9, ease: "power3.out" }, 0.40);

      /* Emblem mark snaps in after disc */
      tl.from("#t1-sec-emblem .emblem-mark",
            { autoAlpha: 0, scale: 1.4, transformOrigin: "50% 50%", duration: 0.6, ease: "power4.out" }, 0.70);

      /* Rule draws in */
      tl.from("#t1-sec-emblem .rule",
            { scaleX: 0, transformOrigin: "50% 50%", autoAlpha: 0, duration: 0.65, ease: "power3.out" }, 1.10);

      /* Headline glides up with focus-pull */
      tl.from("#t1-sec-emblem .headline",
            { autoAlpha: 0, y: 38, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.30);

      /* Emblem glow pulse — finite breathing */
      tl.to("#t1-sec-emblem .emblem-halo",
            { opacity: 0.55, scale: 1.15, transformOrigin: "50% 50%",
              duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.1);

      /* Slow bloom drift */
      tl.to("#t1-sec-emblem .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-emblem"] = tl;
    </script>
  </body>
</html>
