<!doctype html>
<!--
  KALLAWAY · tier1 · section · COLUMN-LIGHT
  Vertical god-ray light columns of varying widths brighten from the bottom in
  sequence behind the title. Creates a cathedral-light atmosphere — the idea
  illuminated from below. Each column is a distinct translucent blue gradient.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-colgt {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Base bloom from bottom */
      #t1-sec-colgt .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }

      /* God-ray columns — 7 columns at different x positions and widths */
      #t1-sec-colgt .cols {
        position: absolute; inset: 0; z-index: 2;
      }
      #t1-sec-colgt .col {
        position: absolute; bottom: 0; top: 0;
        background: linear-gradient(to top,
          rgba(var(--accent-rgb), 0.50) 0%,
          rgba(var(--accent-rgb), 0.22) 35%,
          rgba(var(--accent-rgb), 0.06) 65%,
          transparent 100%);
        transform-origin: 50% 100%;
      }
      /* col positions: left x, width */
      #t1-sec-colgt .col-1 { left: 148px;  width: 48px; }
      #t1-sec-colgt .col-2 { left: 388px;  width: 72px; }
      #t1-sec-colgt .col-3 { left: 680px;  width: 38px; }
      #t1-sec-colgt .col-4 { left: 930px;  width: 96px; } /* centre — brightest */
      #t1-sec-colgt .col-5 { left: 1200px; width: 52px; }
      #t1-sec-colgt .col-6 { left: 1460px; width: 66px; }
      #t1-sec-colgt .col-7 { left: 1720px; width: 40px; }

      /* centre column is brighter */
      #t1-sec-colgt .col-4 {
        background: linear-gradient(to top,
          rgba(var(--accent-rgb), 0.70) 0%,
          rgba(var(--accent-rgb), 0.36) 35%,
          rgba(var(--accent-rgb), 0.10) 65%,
          transparent 100%);
        filter: blur(4px);
      }

      /* Faint dot grid */
      #t1-sec-colgt .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
      }

      /* Content — elevated above columns */
      #t1-sec-colgt .content {
        position: absolute; left: 0; right: 0; top: 310px;
        text-align: center; z-index: 5;
      }

      #t1-sec-colgt .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 32px;
      }

      #t1-sec-colgt .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto; padding: 0 60px;
      }

      #t1-sec-colgt .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-colgt .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-colgt .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-colgt" data-composition-id="t1-sec-colgt" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="cols">
        <div class="col col-1"></div>
        <div class="col col-2"></div>
        <div class="col col-3"></div>
        <div class="col col-4"></div>
        <div class="col col-5"></div>
        <div class="col col-6"></div>
        <div class="col col-7"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">Section Two</div>
        <div class="headline" data-slot="headline">The Hidden Cost of<br><em>Getting It Wrong</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-colgt .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom rises */
      tl.from("#t1-sec-colgt .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0);

      tl.from("#t1-sec-colgt .grid",
        { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* columns brighten in sequence, each rising from scale 0 at bottom */
      const colOrder = [3, 0, 5, 1, 6, 2, 4]; /* centre last */
      const colSels = [
        "#t1-sec-colgt .col-1",
        "#t1-sec-colgt .col-2",
        "#t1-sec-colgt .col-3",
        "#t1-sec-colgt .col-4",
        "#t1-sec-colgt .col-5",
        "#t1-sec-colgt .col-6",
        "#t1-sec-colgt .col-7"
      ];
      colOrder.forEach(function(idx, step) {
        tl.from(colSels[idx],
          { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 100%", duration: 0.9, ease: "power3.out" },
          0.05 + step * 0.12);
      });

      /* kicker + headline after columns are lit */
      tl.from("#t1-sec-colgt .kicker",
        { autoAlpha: 0, y: 20, duration: 0.7, ease: "power3.out" }, 1.0);
      tl.from("#t1-sec-colgt .headline",
        { autoAlpha: 0, y: 36, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.2);

      /* slow drift upward on all columns — parallax breathe */
      tl.to("#t1-sec-colgt .cols",
        { y: -18, duration: 4.5, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-colgt"] = tl;
    </script>
  </body>
</html>
