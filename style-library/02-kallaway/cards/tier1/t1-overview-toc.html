<!doctype html>
<!--
  KALLAWAY · tier1 · overview · TABLE OF CONTENTS
  5 entries with leader dots and right-aligned section numbers. Horizontal
  connector lines draw in between the entry label and the section number.
  Title glides first; entries build in staggered with spring.
  Slots: title, e1_h, e1_n, e2_h, e2_n, e3_h, e3_n, e4_h, e4_n, e5_h, e5_n.
  (_h = heading text, _n = section number/label)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-toc {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-ov-toc .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-ov-toc .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Page layout — centered column */
      #t1-ov-toc .layout {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column;
        align-items: center;
        padding: 86px var(--pad) 80px;
      }

      /* Title */
      #t1-ov-toc .card-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 66px; line-height: 1.1;
        text-align: center;
        flex-shrink: 0;
      }
      #t1-ov-toc .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* TOC list */
      #t1-ov-toc .toc-list {
        width: 100%; max-width: 1520px;
        display: flex; flex-direction: column; gap: 0;
        flex: 1;
      }

      /* Separator rule between entries */
      #t1-ov-toc .sep {
        height: 1px; width: 100%;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.22) 20%, rgba(var(--accent-rgb), 0.22) 80%, transparent);
        transform-origin: 0% 50%;
        flex-shrink: 0;
      }
      #t1-ov-toc .sep:first-child { display: none; }

      /* Each TOC entry row */
      #t1-ov-toc .toc-entry {
        display: flex; align-items: baseline;
        padding: 28px 0;
        flex: 1;
        gap: 0;
        min-height: 0;
      }

      /* Entry index marker */
      #t1-ov-toc .entry-index {
        font-family: var(--font-mono); font-size: 20px; font-weight: 700;
        color: var(--accent); opacity: 0.7;
        letter-spacing: 0.05em;
        width: 54px; flex-shrink: 0;
        padding-top: 3px;
      }

      /* Entry heading label */
      #t1-ov-toc .entry-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 40px; color: var(--white);
        letter-spacing: var(--track-snug); line-height: 1.15;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* Leader dots — the connecting line drawn as a gradient */
      #t1-ov-toc .leader {
        flex: 1; min-width: 60px;
        height: 1.5px; align-self: center;
        margin: 0 28px;
        background: repeating-linear-gradient(
          90deg,
          rgba(var(--accent-rgb), 0.40) 0px,
          rgba(var(--accent-rgb), 0.40) 4px,
          transparent 4px,
          transparent 14px
        );
        transform-origin: 0% 50%;
      }

      /* Section number — right-aligned, monospaced */
      #t1-ov-toc .entry-num {
        font-family: var(--font-mono); font-size: 30px; font-weight: 700;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        letter-spacing: 0.04em;
        flex-shrink: 0;
        min-width: 80px; text-align: right;
      }

      /* Vignette + grain */
      #t1-ov-toc .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-toc .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-toc" data-composition-id="t1-ov-toc" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <div class="card-title" data-slot="title">What We're <em>Covering</em> Today</div>

        <div class="toc-list">
          <div class="sep" id="toc-sep-1"></div>
          <div class="toc-entry" id="toc-e1">
            <div class="entry-index">01</div>
            <div class="entry-label" data-slot="e1_h">The Creator Economy in 2025</div>
            <div class="leader" id="toc-ld-1"></div>
            <div class="entry-num" data-slot="e1_n">§ 01</div>
          </div>
          <div class="sep" id="toc-sep-2"></div>
          <div class="toc-entry" id="toc-e2">
            <div class="entry-index">02</div>
            <div class="entry-label" data-slot="e2_h">Building a Repeatable System</div>
            <div class="leader" id="toc-ld-2"></div>
            <div class="entry-num" data-slot="e2_n">§ 02</div>
          </div>
          <div class="sep" id="toc-sep-3"></div>
          <div class="toc-entry" id="toc-e3">
            <div class="entry-index">03</div>
            <div class="entry-label" data-slot="e3_h">Monetisation Before 1 000 Subs</div>
            <div class="leader" id="toc-ld-3"></div>
            <div class="entry-num" data-slot="e3_n">§ 03</div>
          </div>
          <div class="sep" id="toc-sep-4"></div>
          <div class="toc-entry" id="toc-e4">
            <div class="entry-index">04</div>
            <div class="entry-label" data-slot="e4_h">The Algorithm Is a Mirror</div>
            <div class="leader" id="toc-ld-4"></div>
            <div class="entry-num" data-slot="e4_n">§ 04</div>
          </div>
          <div class="sep" id="toc-sep-5"></div>
          <div class="toc-entry" id="toc-e5">
            <div class="entry-index">05</div>
            <div class="entry-label" data-slot="e5_h">Your 30-Day Action Plan</div>
            <div class="leader" id="toc-ld-5"></div>
            <div class="entry-num" data-slot="e5_n">§ 05</div>
          </div>
          <div class="sep" id="toc-sep-6"></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-toc .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-toc .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-toc .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title glides in */
        .from("#t1-ov-toc .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.5)

        /* separator rules draw in — scaleX from 0 */
        .from("#toc-sep-1, #toc-sep-2, #toc-sep-3, #toc-sep-4, #toc-sep-5, #toc-sep-6",
          { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.out", stagger: 0.14 }, 0.9)

        /* entries fade-up staggered with spring */
        .from("#toc-e1", { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.70, ease: "back.out(1.3)" }, 0.92)
        .from("#toc-e2", { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.70, ease: "back.out(1.3)" }, 1.08)
        .from("#toc-e3", { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.70, ease: "back.out(1.3)" }, 1.24)
        .from("#toc-e4", { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.70, ease: "back.out(1.3)" }, 1.40)
        .from("#toc-e5", { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.70, ease: "back.out(1.3)" }, 1.56)

        /* leader lines draw in after each entry */
        .from("#toc-ld-1", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.out" }, 1.10)
        .from("#toc-ld-2", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.out" }, 1.26)
        .from("#toc-ld-3", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.out" }, 1.42)
        .from("#toc-ld-4", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.out" }, 1.58)
        .from("#toc-ld-5", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.out" }, 1.74)

        /* breathing glow on section numbers — finite */
        .to("#t1-ov-toc .entry-num",
          { textShadow: "0 0 28px rgba(55,189,248,0.90), 0 0 80px rgba(55,189,248,0.50)", duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-ov-toc"] = tl;
    </script>
  </body>
</html>
