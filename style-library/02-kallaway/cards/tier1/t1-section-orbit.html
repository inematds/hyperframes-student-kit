<!doctype html>
<!--
  KALLAWAY · tier1 · section · ORBIT
  Full-screen chapter takeover. A glowing ring orbits a central glow dot; a
  satellite dot travels the ring continuously (finite repeat). The chapter
  kicker and headline float beneath the orbital system.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-orbit {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-orbit .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-orbit .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Orbital system centered in upper portion */
      #t1-sec-orbit .orbit-wrap {
        position: absolute;
        left: 50%; top: 220px;
        transform: translateX(-50%);
        width: 400px; height: 400px;
        z-index: 3;
      }
      /* The SVG ring + satellite */
      #t1-sec-orbit .orbit-svg {
        width: 400px; height: 400px;
        position: absolute; inset: 0;
      }
      /* Outer ambient glow around the whole system */
      #t1-sec-orbit .orbit-bloom {
        position: absolute; inset: -80px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 65%);
        box-shadow: 0 0 120px 40px rgba(var(--accent-rgb), 0.16);
        z-index: 0;
      }
      /* Central glow dot */
      #t1-sec-orbit .center-dot {
        position: absolute;
        left: 50%; top: 50%;
        width: 28px; height: 28px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(var(--accent-rgb), 0.85) 55%, transparent 75%);
        box-shadow: 0 0 24px 6px rgba(var(--accent-rgb), 0.7),
                    0 0 60px 16px rgba(var(--accent-rgb), 0.30);
        z-index: 4;
      }
      /* Satellite dot — positioned by JS */
      #t1-sec-orbit .satellite {
        position: absolute;
        width: 16px; height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 12px 4px rgba(var(--accent-rgb), 0.85),
                    0 0 30px 8px rgba(var(--accent-rgb), 0.40);
        z-index: 5;
        /* JS sets left/top/transform each frame */
      }

      /* Content below the orbit */
      #t1-sec-orbit .content {
        position: absolute;
        left: 0; right: 0;
        top: 670px;
        text-align: center;
        z-index: 4;
      }
      #t1-sec-orbit .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); margin-bottom: 22px;
      }
      #t1-sec-orbit .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1280px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-orbit .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-orbit .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-orbit .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-orbit" data-composition-id="t1-sec-orbit" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="orbit-wrap">
        <div class="orbit-bloom"></div>
        <!-- SVG ring -->
        <svg class="orbit-svg" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="orbitRingGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(55,189,248,0.55)"/>
              <stop offset="50%" stop-color="rgba(55,189,248,1)"/>
              <stop offset="100%" stop-color="rgba(55,189,248,0.15)"/>
            </linearGradient>
            <filter id="orbitGlow" x="-15%" y="-15%" width="130%" height="130%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <!-- Main orbit ring -->
          <circle cx="200" cy="200" r="160"
            stroke="url(#orbitRingGrad)"
            stroke-width="1.5"
            stroke-dasharray="4 10"
            filter="url(#orbitGlow)"
            fill="none"/>
          <!-- Solid glow inner track -->
          <circle cx="200" cy="200" r="160"
            stroke="rgba(55,189,248,0.12)"
            stroke-width="14"
            fill="none"/>
        </svg>
        <div class="center-dot"></div>
        <div class="satellite" id="t1-sec-orbit-sat"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Chapter 2 —</div>
        <div class="headline" data-slot="headline">How Models<br><em>Learn</em> From Data</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Satellite orbit — hardcoded angle steps, finite repeat */
      const satEl    = document.getElementById("t1-sec-orbit-sat");
      const R        = 160;    /* orbit radius (matches SVG r="160") */
      const CX       = 200;    /* SVG center x */
      const CY       = 200;    /* SVG center y */
      const wrapSize = 400;    /* orbit-wrap px size */
      /* Precomputed satellite positions for 7 steps (angle 0 → 2π, deterministic) */
      /* angle 0 = top of ring = 270° in standard coords => subtract π/2 */
      const steps = [
        { pct: 0.00, angle: -1.5708 },
        { pct: 0.14, angle: -0.6836 },
        { pct: 0.28, angle:  0.1920 },
        { pct: 0.42, angle:  1.0296 },
        { pct: 0.57, angle:  2.0053 },
        { pct: 0.71, angle:  2.9198 },
        { pct: 0.85, angle:  3.7854 },
        { pct: 1.00, angle:  4.7124 },
      ];

      function setSatPos(angle) {
        const x = CX + R * Math.cos(angle);
        const y = CY + R * Math.sin(angle);
        satEl.style.left = (x - 8) + "px";
        satEl.style.top  = (y - 8) + "px";
      }
      /* Init satellite at top of ring */
      setSatPos(-Math.PI / 2);

      /* grain flicker */
      tl.fromTo("#t1-sec-orbit .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 85px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-orbit .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-orbit .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* orbit-bloom expands */
        .from("#t1-sec-orbit .orbit-bloom",
          { autoAlpha: 0, scale: 0.3, duration: 1.3, ease: "expo.out" }, 0.2)

        /* ring SVG fades in */
        .from("#t1-sec-orbit .orbit-svg",
          { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%",
            duration: 1.1, ease: "back.out(1.4)" }, 0.35)

        /* center dot blooms */
        .from("#t1-sec-orbit .center-dot",
          { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%",
            duration: 0.6, ease: "back.out(2)" }, 0.9)

        /* satellite appears */
        .from("#t1-sec-orbit .satellite",
          { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%",
            duration: 0.4, ease: "back.out(2)" }, 1.1)

        /* satellite travels the ring — proxy-driven, finite */
        .to({ angle: -Math.PI / 2 }, {
          angle: -Math.PI / 2 + 2 * Math.PI * 1.5,  /* 1.5 laps */
          duration: 5.0, ease: "power1.inOut",
          repeat: 0,
          onUpdate: function () {
            setSatPos(this.targets()[0].angle);
          }
        }, 1.2)

        /* kicker glides in */
        .from("#t1-sec-orbit .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.85)

        /* headline */
        .from("#t1-sec-orbit .headline",
          { autoAlpha: 0, y: 32, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.1)

        /* breathing orbit bloom — finite */
        .to("#t1-sec-orbit .orbit-bloom",
          { opacity: 0.50, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-sec-orbit"] = tl;
    </script>
  </body>
</html>
