<!doctype html>
<!--
  KALLAWAY · tier1 · section · FLARE-SWEEP
  Full-screen chapter takeover. A bright lens-flare streak cuts diagonally across
  the frame at high speed; as the light passes, the headline "lands" sharp behind
  it — like the flare is painting the title onto the canvas. Secondary anamorphic
  blue streak bleeds horizontally across the mid-line.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-fsweep {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Background bloom */
      #t1-sec-fsweep .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-fsweep .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.4;
        -webkit-mask-image: radial-gradient(110% 90% at 50% 55%, #000 28%, transparent 72%);
                mask-image: radial-gradient(110% 90% at 50% 55%, #000 28%, transparent 72%);
      }

      /* ── Main diagonal flare streak ── */
      #t1-sec-fsweep .flare-main {
        position: absolute;
        /* tall thin bar rotated ~30° to look like a diagonal beam */
        left: -200px; top: -200px;
        width: 140px; height: 1600px;
        transform: rotate(30deg);
        transform-origin: 50% 0%;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(255,255,255,0.04) 5%,
          rgba(255,255,255,0.95) 48%,
          rgba(var(--accent-rgb), 0.85) 52%,
          rgba(255,255,255,0.04) 95%,
          transparent 100%);
        filter: blur(3px);
        z-index: 5;
        pointer-events: none;
      }
      /* Soft outer glow halo around the flare */
      #t1-sec-fsweep .flare-halo {
        position: absolute;
        left: -320px; top: -200px;
        width: 400px; height: 1600px;
        transform: rotate(30deg);
        transform-origin: 50% 0%;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(var(--accent-rgb), 0.0) 15%,
          rgba(var(--accent-rgb), 0.30) 48%,
          rgba(var(--accent-rgb), 0.30) 52%,
          rgba(var(--accent-rgb), 0.0) 85%,
          transparent 100%);
        filter: blur(28px);
        z-index: 4;
        pointer-events: none;
      }

      /* ── Anamorphic horizontal streak ── */
      #t1-sec-fsweep .anamorphic {
        position: absolute; left: 0; right: 0; top: 526px;
        height: 4px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.06) 10%,
          rgba(var(--accent-rgb), 0.70) 38%,
          rgba(255,255,255,0.92) 50%,
          rgba(var(--accent-rgb), 0.70) 62%,
          rgba(var(--accent-rgb), 0.06) 90%,
          transparent 100%);
        box-shadow: 0 0 18px 4px rgba(var(--accent-rgb), 0.55),
                    0 0 60px 12px rgba(var(--accent-rgb), 0.22);
        z-index: 5;
        pointer-events: none;
      }
      /* Diffuse glow bar */
      #t1-sec-fsweep .anamorphic-glow {
        position: absolute; left: 0; right: 0; top: 510px;
        height: 36px;
        background: radial-gradient(100% 100% at 50% 50%,
          rgba(var(--accent-rgb), 0.28) 0%, transparent 70%);
        filter: blur(12px);
        z-index: 4; pointer-events: none;
      }

      /* Content — centered */
      #t1-sec-fsweep .content {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 1440px; text-align: center; z-index: 6;
      }
      #t1-sec-fsweep .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 38px; letter-spacing: 0.14em;
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 30px;
      }
      #t1-sec-fsweep .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.07; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-sec-fsweep .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-fsweep .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-fsweep .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-fsweep" data-composition-id="t1-sec-fsweep" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="flare-halo"></div>
      <div class="flare-main"></div>
      <div class="anamorphic-glow"></div>
      <div class="anamorphic"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Part One —</div>
        <div class="headline" data-slot="headline">Foundation Models &amp;<br><em>How They Learn</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-fsweep .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Bloom fades in */
      tl.from("#t1-sec-fsweep .bloom", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.6, ease: "expo.out" }, 0)
        .from("#t1-sec-fsweep .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* ── Flare sweep across canvas ──
         Start well off-left (-300px), race to off-right (+2400px) in 0.65s */
      tl.set(["#t1-sec-fsweep .flare-main", "#t1-sec-fsweep .flare-halo"], { x: -300 })
        .to(["#t1-sec-fsweep .flare-main", "#t1-sec-fsweep .flare-halo"],
          { x: 2400, duration: 0.65, ease: "power2.in" }, 0.5);

      /* Anamorphic streak draws in from center as flare passes */
      tl.from("#t1-sec-fsweep .anamorphic",
        { scaleX: 0, transformOrigin: "50% 50%", autoAlpha: 0, duration: 0.45, ease: "power3.out" }, 0.72)
        .from("#t1-sec-fsweep .anamorphic-glow",
        { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0.72);

      /* Text lands sharp right as flare exits */
      tl.from("#t1-sec-fsweep .kicker",   { autoAlpha: 0, x: -30, duration: 0.6, ease: "power3.out" }, 0.95)
        .from("#t1-sec-fsweep .headline", { autoAlpha: 0, x: -50, duration: 0.8, ease: "power4.out" }, 1.1);

      /* Anamorphic fades gently during the hold */
      tl.to("#t1-sec-fsweep .anamorphic",      { autoAlpha: 0.25, duration: 2.5, ease: "sine.inOut" }, 3.0);
      tl.to("#t1-sec-fsweep .anamorphic-glow", { autoAlpha: 0.15, duration: 2.5, ease: "sine.inOut" }, 3.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-fsweep"] = tl;
    </script>
  </body>
</html>
