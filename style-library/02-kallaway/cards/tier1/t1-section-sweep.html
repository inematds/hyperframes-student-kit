<!doctype html>
<!--
  KALLAWAY · tier1 · section · SWEEP
  Full-screen chapter takeover. The headline renders on screen; a glass+accent
  highlight bar then sweeps from left-to-right behind the <em> keyword, bathing
  it in blue light. The sweep spotlights the accent phrase while the rest of the
  headline glows warmly. Clean, editorial, emphasis-driven.
  Slots: kicker (~16 chars), headline (~52 chars, <em> on accent-glow phrase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-sweep {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-sweep .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-sweep .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.44;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
      }

      /* The sweeping highlight bar — sits at z-index 3, behind text content (z-4) */
      #t1-sec-sweep .sweep-bar {
        position: absolute;
        /* positioned by GSAP after layout; starts off left edge */
        left: 0; top: 470px;
        width: 480px; height: 130px;
        z-index: 3;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.18) 15%,
          rgba(var(--accent-rgb), 0.36) 40%,
          rgba(var(--accent-rgb), 0.36) 60%,
          rgba(var(--accent-rgb), 0.18) 85%,
          transparent 100%);
        backdrop-filter: blur(4px);
        border-top: 1px solid rgba(var(--accent-rgb), 0.40);
        border-bottom: 1px solid rgba(var(--accent-rgb), 0.40);
        box-shadow: 0 0 40px 8px rgba(var(--accent-rgb), 0.18);
        transform: translateX(-520px);
        pointer-events: none;
      }

      /* Content — centered */
      #t1-sec-sweep .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-sweep .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 32px;
      }
      #t1-sec-sweep .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1400px; padding: 0 80px;
      }
      #t1-sec-sweep .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
        /* after sweep, accent word gets extra brightness pulse via GSAP */
        transition: none;
      }

      /* Thin decorative rules above/below headline */
      #t1-sec-sweep .rule-top,
      #t1-sec-sweep .rule-bot {
        width: 640px; height: 1.5px; background: var(--glass-border);
        transform-origin: center;
      }
      #t1-sec-sweep .rule-top { margin-bottom: 38px; }
      #t1-sec-sweep .rule-bot { margin-top: 38px; }

      /* Vignette + grain */
      #t1-sec-sweep .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-sweep .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-sweep" data-composition-id="t1-sec-sweep" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="sweep-bar"></div>

      <div class="content">
        <div class="rule-top"></div>
        <div class="kicker" data-slot="kicker">The Key Insight</div>
        <div class="headline" data-slot="headline">Speed Doesn't Matter If Your <em>Direction</em> Is Wrong</div>
        <div class="rule-bot"></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-sweep .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-sweep .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-sweep .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* decorative rules scale in from center */
      tl.from("#t1-sec-sweep .rule-top",
            { scaleX: 0, duration: 0.7, ease: "expo.out" }, 0.45)
        .from("#t1-sec-sweep .rule-bot",
            { scaleX: 0, duration: 0.7, ease: "expo.out" }, 0.52);

      /* kicker glides in */
      tl.from("#t1-sec-sweep .kicker",
            { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.9, ease: "power3.out" }, 0.55);

      /* headline blur-in */
      tl.from("#t1-sec-sweep .headline",
            { autoAlpha: 0, y: 30, filter: "blur(16px)", duration: 1.1, ease: "power4.out" }, 0.80);

      /* sweep bar travels across the headline (left → right) */
      tl.to("#t1-sec-sweep .sweep-bar",
            { x: 2440, duration: 1.1, ease: "power2.inOut" }, 1.50);

      /* accent em word pulses brighter after sweep passes over it */
      tl.to("#t1-sec-sweep .headline em",
            { textShadow: "0 0 32px rgba(var(--accent-rgb),0.85), 0 0 70px rgba(var(--accent-rgb),0.50)",
              duration: 0.5, ease: "power2.out" }, 2.05)
        .to("#t1-sec-sweep .headline em",
            { textShadow: "var(--textglow-accent)",
              duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.60);

      /* slow bloom drift during hold */
      tl.to("#t1-sec-sweep .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-sweep"] = tl;
    </script>
  </body>
</html>
