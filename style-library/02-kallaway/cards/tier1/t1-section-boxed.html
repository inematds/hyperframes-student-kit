<!doctype html>
<!--
  KALLAWAY · tier1 · section · BOXED
  Full-screen chapter takeover. A glowing glass frame border draws around the
  title area (stroke animates in like a rectangle being traced); the kicker fades
  above and the headline snaps into focus inside the box.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-boxed {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-boxed .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-boxed .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 30%, transparent 78%);
      }

      /* The glass box frame — drawn by SVG rect stroke-dashoffset trick */
      #t1-sec-boxed .frame-svg {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 1340px; height: 380px; z-index: 3; overflow: visible;
      }
      #t1-sec-boxed .frame-svg rect {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.72);
        stroke-width: 2;
        rx: 28; ry: 28;
        filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.55))
                drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.28));
      }

      /* Frosted glass fill inside the box */
      #t1-sec-boxed .frame-fill {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 1340px; height: 380px;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        z-index: 2;
      }

      /* Corner accent dots */
      #t1-sec-boxed .corner {
        position: absolute; width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--glow-accent);
        z-index: 4;
      }
      #t1-sec-boxed .corner.tl { left: calc(50% - 670px); top: calc(50% - 190px); }
      #t1-sec-boxed .corner.tr { left: calc(50% + 660px); top: calc(50% - 190px); }
      #t1-sec-boxed .corner.bl { left: calc(50% - 670px); top: calc(50% + 180px); }
      #t1-sec-boxed .corner.br { left: calc(50% + 660px); top: calc(50% + 180px); }

      /* Content inside the box */
      #t1-sec-boxed .content {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 1200px; text-align: center; z-index: 5;
      }
      #t1-sec-boxed .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        color: var(--accent); text-shadow: var(--textglow-accent);
        text-transform: uppercase; margin-bottom: 28px;
      }
      #t1-sec-boxed .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.08; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-sec-boxed .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-boxed .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-boxed .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-boxed" data-composition-id="t1-sec-boxed" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Glass fill first (lower z), then SVG stroke on top -->
      <div class="frame-fill"></div>
      <svg class="frame-svg" viewBox="0 0 1340 380" xmlns="http://www.w3.org/2000/svg">
        <rect id="t1-sec-boxed-rect" x="1" y="1" width="1338" height="378" rx="27" ry="27"/>
      </svg>

      <!-- Corner accent nodes -->
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Chapter 02 —</div>
        <div class="headline" data-slot="headline">Training Data &amp; <em>Why It Matters</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-boxed .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* ambient bloom + grid */
      tl.from("#t1-sec-boxed .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-boxed .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* glass fill fades in first */
      tl.from("#t1-sec-boxed .frame-fill", { autoAlpha: 0, scale: 0.96, duration: 0.7, ease: "power3.out" }, 0.3);

      /* SVG stroke draw — set up perimeter dasharray then animate dashoffset to 0 */
      const rect = document.getElementById("t1-sec-boxed-rect");
      const perimeter = 2 * (1338 + 378); /* 3432px */
      rect.style.strokeDasharray  = perimeter;
      rect.style.strokeDashoffset = perimeter;
      tl.to(rect, { strokeDashoffset: 0, duration: 1.4, ease: "power3.inOut" }, 0.5);

      /* corner dots pop in at stroke-draw milestones */
      tl.from("#t1-sec-boxed .corner.tl", { autoAlpha: 0, scale: 0, duration: 0.3, ease: "back.out(2)" }, 0.5)
        .from("#t1-sec-boxed .corner.tr", { autoAlpha: 0, scale: 0, duration: 0.3, ease: "back.out(2)" }, 0.85)
        .from("#t1-sec-boxed .corner.br", { autoAlpha: 0, scale: 0, duration: 0.3, ease: "back.out(2)" }, 1.15)
        .from("#t1-sec-boxed .corner.bl", { autoAlpha: 0, scale: 0, duration: 0.3, ease: "back.out(2)" }, 1.45);

      /* kicker + headline glide in */
      tl.from("#t1-sec-boxed .kicker",   { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 1.2)
        .from("#t1-sec-boxed .headline", { autoAlpha: 0, y: 30, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 1.55);

      /* breathing glow pulse on the frame — finite */
      tl.to("#t1-sec-boxed .frame-fill", { boxShadow: "var(--glass-shadow), inset 0 1px 0 var(--glass-hi), 0 0 60px rgba(var(--accent-rgb), 0.18)", duration: 1.3, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.6);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-boxed"] = tl;
    </script>
  </body>
</html>
