<!doctype html>
<!--
  KALLAWAY · tier1 · section · SEARCHBAR
  Full-screen chapter takeover. The headline is typed as a search query inside a
  glowing glass search bar with a magnifier icon and a blinking cursor. Kicker
  sits as a small label above the bar. Premium dark canvas with aurora bloom.
  Slots: kicker (~16 chars), headline (~52 chars, <em> wraps one phrase for accent).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-search {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-search .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Faint dot grid */
      #t1-sec-search .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content stack — centred in frame */
      #t1-sec-search .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-54%);
        text-align: center; z-index: 4;
      }

      /* Kicker — small italic label above bar */
      #t1-sec-search .kicker {
        font-family: var(--font-body); font-style: italic; font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 38px;
      }

      /* Search bar wrapper */
      #t1-sec-search .search-bar {
        display: inline-flex; align-items: center; gap: 32px;
        width: 1200px;
        padding: 38px 52px;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: 60px;
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(255,255,255,0.06) inset,
          0 1px 0 rgba(255,255,255,0.18) inset,
          /* accent glow rim */
          0 0 48px rgba(var(--accent-rgb), 0.22),
          0 0 100px rgba(var(--accent-rgb), 0.10);
        position: relative;
      }

      /* Magnifier icon — SVG inline */
      #t1-sec-search .icon-wrap {
        flex-shrink: 0; width: 56px; height: 56px;
        display: flex; align-items: center; justify-content: center;
        color: var(--accent);
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.70))
                drop-shadow(0 0 26px rgba(var(--accent-rgb), 0.40));
      }
      #t1-sec-search .icon-wrap svg {
        width: 52px; height: 52px; fill: none;
        stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
      }

      /* Query text */
      #t1-sec-search .query {
        flex: 1; text-align: left;
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 68px; line-height: 1.0; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap; overflow: hidden;
      }
      #t1-sec-search .query em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Blinking cursor */
      #t1-sec-search .cursor {
        flex-shrink: 0;
        display: inline-block; width: 4px; height: 72px;
        background: var(--accent);
        border-radius: 2px;
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.80),
                    0 0 30px rgba(var(--accent-rgb), 0.40);
        margin-left: 6px;
        align-self: center;
      }

      /* Soft glow halo behind the bar */
      #t1-sec-search .bar-glow {
        position: absolute; left: 50%; bottom: -40px; transform: translateX(-50%);
        width: 1200px; height: 60px;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.28) 0%,
          transparent 70%);
        filter: blur(20px); z-index: -1;
        pointer-events: none;
      }

      /* Vignette + grain */
      #t1-sec-search .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-search .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-search" data-composition-id="t1-sec-search" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Chapter 3 —</div>
        <div class="search-bar">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7"/>
              <line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
          </div>
          <div class="query" data-slot="headline">What Does <em>the Algorithm</em> Actually See?</div>
          <div class="cursor"></div>
        </div>
        <div class="bar-glow"></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker — finite, deterministic */
      tl.fromTo("#t1-sec-search .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-search .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-search .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* kicker fades in */
        .from("#t1-sec-search .kicker",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.8, ease: "power3.out" }, 0.5)

        /* search bar springs up */
        .from("#t1-sec-search .search-bar",
          { autoAlpha: 0, y: 50, scale: 0.96, transformOrigin: "50% 50%",
            filter: "blur(14px)", duration: 1.0, ease: "back.out(1.4)" }, 0.75)

        /* bar glow blooms in */
        .from("#t1-sec-search .bar-glow",
          { autoAlpha: 0, scaleX: 0.6, duration: 1.0, ease: "power4.out" }, 1.0)

        /* query text fades in slightly after the bar */
        .from("#t1-sec-search .query",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.1)

        /* cursor blinks — finite, blue pulse */
        .fromTo("#t1-sec-search .cursor",
          { autoAlpha: 1 },
          { autoAlpha: 0, duration: 0.55, ease: "power1.inOut", repeat: 7, yoyo: true }, 1.5)

        /* bar glow breathes softly */
        .to("#t1-sec-search .bar-glow",
          { opacity: 0.45, scaleX: 1.08, duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4)

        /* search bar glows richer */
        .to("#t1-sec-search .search-bar",
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1px rgba(255,255,255,0.06) inset, 0 1px 0 rgba(255,255,255,0.18) inset, 0 0 80px rgba(55,189,248,0.35), 0 0 160px rgba(55,189,248,0.16)",
            duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-sec-search"] = tl;
    </script>
  </body>
</html>
