<!doctype html>
<!--
  KALLAWAY · tier1 · stat · METER
  A horizontal glowing fill bar in a glass track. The percentage label rides at the
  leading edge of the fill; the bar's scaleX animates from 0 to value. Aurora bloom,
  breathing glow.
  Knob: data-fill on .meter-track (0..1, default 0.73).
  Slots: kicker (~28 chars uppercase), stat (e.g. "73%"), label (~70 chars, <em>),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-meter {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-meter .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-meter .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content stack */
      #t1-stat-meter .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 50px; padding-bottom: 40px;
      }

      #t1-stat-meter .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Big stat number */
      #t1-stat-meter .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 200px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(160deg, #ffffff 15%, rgba(var(--accent-rgb),0.85) 82%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 26px rgba(var(--accent-rgb), 0.55)) drop-shadow(0 0 70px rgba(var(--accent-rgb), 0.25));
      }

      /* Meter assembly */
      #t1-stat-meter .meter-assembly {
        display: flex; flex-direction: column; align-items: flex-start;
        width: 1200px; gap: 18px;
      }

      /* The glass track */
      #t1-stat-meter .meter-track {
        position: relative;
        width: 100%; height: 52px;
        border-radius: 26px;
        background: var(--glass-bg);
        border: 1.5px solid var(--glass-border);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        overflow: hidden;
      }

      /* The glowing fill inside the track */
      #t1-stat-meter .meter-fill {
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 100%;                /* GSAP scaleX from 0 → fill value */
        transform-origin: left center;
        transform: scaleX(0);
        border-radius: 26px;
        background: linear-gradient(to right,
          rgba(var(--accent-rgb), 0.55) 0%,
          rgba(var(--accent-rgb), 0.80) 50%,
          #ffffff 90%,
          rgba(var(--accent-rgb), 0.85) 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.45),
          0 0 28px rgba(var(--accent-rgb), 0.55),
          0 0 60px rgba(var(--accent-rgb), 0.28);
      }

      /* Bright leading-edge glow dot */
      #t1-stat-meter .meter-head {
        position: absolute; top: 50%; right: 0;
        width: 24px; height: 24px; border-radius: 50%;
        transform: translateY(-50%) translateX(50%);
        background: #ffffff;
        box-shadow:
          0 0 14px 4px rgba(var(--accent-rgb), 0.90),
          0 0 40px 8px rgba(var(--accent-rgb), 0.45);
      }

      /* Tick marks on the track */
      #t1-stat-meter .meter-ticks {
        display: flex; justify-content: space-between;
        width: 100%; padding: 0 4px;
      }
      #t1-stat-meter .tick {
        font-family: var(--font-mono); font-size: 18px;
        color: var(--text-faint); letter-spacing: 0.06em;
      }

      #t1-stat-meter .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
        align-self: center;
      }
      #t1-stat-meter .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-meter .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-meter .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-meter .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-meter" data-composition-id="t1-stat-meter" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">AI ADOPTION SCORE · 2026</div>

        <div class="stat" id="t1-stat-meter-num" data-slot="stat">73%</div>

        <div class="meter-assembly">
          <!-- data-fill drives scaleX (0..1) -->
          <div class="meter-track" id="t1-stat-meter-track" data-fill="0.73">
            <div class="meter-fill" id="t1-stat-meter-fill">
              <div class="meter-head"></div>
            </div>
          </div>
          <div class="meter-ticks">
            <span class="tick">0%</span>
            <span class="tick">25%</span>
            <span class="tick">50%</span>
            <span class="tick">75%</span>
            <span class="tick">100%</span>
          </div>
        </div>

        <div class="label" data-slot="label">of enterprise teams hit their <em>quarterly AI readiness target</em> ahead of schedule</div>
      </div>

      <div class="source" data-slot="source">SOURCE · GARTNER REPORT 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Read the knob */
      const trackEl  = document.getElementById("t1-stat-meter-track");
      const fillVal  = parseFloat(trackEl.getAttribute("data-fill")) || 0.73;
      const pct      = Math.round(fillVal * 100);
      const fillEl   = document.getElementById("t1-stat-meter-fill");
      const numEl    = document.getElementById("t1-stat-meter-num");

      /* Parse suffix from the stat slot to reuse in count-up */
      const rawStat  = numEl.textContent.trim();
      const suffix   = rawStat.replace(/[\d.]+/, "");

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-meter .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-meter .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-meter .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-meter .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* big stat counts up */
        .fromTo({ val: 0 }, { val: pct,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            numEl.textContent = Math.round(this.targets()[0].val) + suffix;
          }
        }, 0.75)
        .from("#t1-stat-meter .stat",
          { autoAlpha: 0, scale: 0.82, filter: "blur(22px)", transformOrigin: "50% 50%",
            duration: 0.95, ease: "power4.out" }, 0.75)

        /* glass track springs in */
        .from("#t1-stat-meter .meter-track",
          { autoAlpha: 0, scaleY: 0.5, transformOrigin: "50% 50%", filter: "blur(10px)",
            duration: 0.75, ease: "back.out(1.4)" }, 1.30)

        /* fill animates scaleX to target */
        .to("#t1-stat-meter .meter-fill",
          { scaleX: fillVal, duration: 1.8, ease: "power3.out",
            transformOrigin: "left center" }, 1.55)

        /* tick marks */
        .from("#t1-stat-meter .meter-ticks .tick",
          { autoAlpha: 0, y: 8, duration: 0.5, ease: "power2.out", stagger: 0.08 }, 1.60)

        /* label */
        .from("#t1-stat-meter .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.10)

        /* source */
        .from("#t1-stat-meter .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.40)

        /* breathing glow on fill */
        .to("#t1-stat-meter .meter-fill",
          { opacity: 0.70, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.00)

        .set({}, {}, 7);

      window.__timelines["t1-stat-meter"] = tl;
    </script>
  </body>
</html>
