<!doctype html>
<!--
  KALLAWAY · tier1 · section · WORDMARK
  Full-screen chapter takeover. The headline reads like a brand wordmark — letters
  illuminate left-to-right with a blue glow sweep traveling across the word;
  a tiny italic kicker floats above. Premium, editorial, cinematic.
  Slots: kicker (~16 chars), headline (~52 chars, <em> on accent-glow phrase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-mark {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-mark .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Faint dot grid */
      #t1-sec-mark .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 50%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 100% at 50% 50%, #000 30%, transparent 78%);
      }

      /* Horizontal glow sweep bar — travels left-to-right behind the headline text */
      #t1-sec-mark .sweep-bar {
        position: absolute; left: 0; top: 490px;
        width: 520px; height: 160px; z-index: 3;
        background: radial-gradient(ellipse 260px 80px at 50% 50%,
          rgba(var(--accent-rgb), 0.55) 0%,
          rgba(var(--accent-rgb), 0.18) 50%,
          transparent 100%);
        filter: blur(8px);
        /* starts off-screen left; GSAP translates it across */
        transform: translateX(-300px);
        pointer-events: none;
      }

      /* Content block — centered */
      #t1-sec-mark .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-mark .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 36px;
      }
      #t1-sec-mark .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 112px; line-height: 1.0; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1600px; padding: 0 80px;
        /* clip to reveal letter-by-letter via clip-path (via GSAP chars) */
      }
      #t1-sec-mark .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Thin underline accent rule that draws in under the headline */
      #t1-sec-mark .rule-wrap {
        position: relative; width: 820px; height: 2px; margin-top: 48px;
        overflow: hidden;
      }
      #t1-sec-mark .rule {
        position: absolute; inset: 0;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.9) 20%,
          rgba(var(--accent-rgb), 0.9) 80%,
          transparent 100%);
        box-shadow: 0 0 12px 2px rgba(var(--accent-rgb), 0.50);
        transform-origin: left center;
        /* GSAP scales scaleX from 0 */
      }

      /* Vignette + grain */
      #t1-sec-mark .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-mark .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-mark" data-composition-id="t1-sec-mark" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="sweep-bar"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">Chapter One</div>
        <div class="headline" data-slot="headline">The Age of <em>Intelligent</em> Systems</div>
        <div class="rule-wrap">
          <div class="rule"></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-mark .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid fade up */
      tl.from("#t1-sec-mark .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-mark .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* kicker glides in */
      tl.from("#t1-sec-mark .kicker",
            { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.9, ease: "power3.out" }, 0.55);

      /* headline blur-in focus pull */
      tl.from("#t1-sec-mark .headline",
            { autoAlpha: 0, y: 30, filter: "blur(22px)", duration: 1.1, ease: "power4.out" }, 0.80);

      /* glow sweep bar travels across the headline (left → right → stops center) */
      tl.to("#t1-sec-mark .sweep-bar",
            { x: 960 + 300, duration: 0.0, ease: "none" }, 0.80)   /* snap to start position */
        .to("#t1-sec-mark .sweep-bar",
            { x: 1920 + 300, duration: 1.0, ease: "power3.inOut" }, 0.85);

      /* accent rule draws in from left */
      tl.from("#t1-sec-mark .rule",
            { scaleX: 0, duration: 0.8, ease: "expo.out" }, 1.60);

      /* headline glow pulse (finite breathing) */
      tl.to("#t1-sec-mark .headline",
            { textShadow: "0 0 28px rgba(255,255,255,0.55), 0 0 60px rgba(var(--accent-rgb),0.40)",
              duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4);

      /* slow bloom drift during hold */
      tl.to("#t1-sec-mark .bloom",
            { scale: 1.08, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-mark"] = tl;
    </script>
  </body>
</html>
