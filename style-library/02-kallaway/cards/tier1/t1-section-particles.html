<!doctype html>
<!--
  KALLAWAY · tier1 · section · PARTICLES
  Full-screen takeover. The headline emerges from a drifting DOT/PARTICLE
  field — ~20 glowing dots at FIXED deterministic coordinates that fade/drift
  in from below, framing the headline. Kicker above. NO Math.random() anywhere.
  Slots: kicker (~16 chars), headline (~52 chars, <em> accent word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-dots {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-dots .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-dots .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.4;
        -webkit-mask-image: radial-gradient(140% 120% at 50% 55%, #000 30%, transparent 75%);
                mask-image: radial-gradient(140% 120% at 50% 55%, #000 30%, transparent 75%);
      }

      /* ── Particle layer (z:2 — between grid and content) ─────────────── */
      #t1-sec-dots .particles {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
      }
      /* Each dot is a small glowing circle at an absolute position.
         ALL coordinates are fixed — no Math.random(). Size in two sizes:
         .dot-lg = 10px, .dot-sm = 6px, .dot-xs = 4px */
      #t1-sec-dots .dot {
        position: absolute; border-radius: 50%;
        background: var(--accent);
      }
      #t1-sec-dots .dot-lg { width: 10px; height: 10px; box-shadow: 0 0 14px 3px rgba(var(--accent-rgb),0.70); }
      #t1-sec-dots .dot-sm { width:  6px; height:  6px; box-shadow: 0 0  9px 2px rgba(var(--accent-rgb),0.55); }
      #t1-sec-dots .dot-xs { width:  4px; height:  4px; box-shadow: 0 0  6px 1px rgba(var(--accent-rgb),0.40); }
      /* white variants for variety */
      #t1-sec-dots .dot-w  { width:  5px; height:  5px; background: var(--white); box-shadow: 0 0 8px 2px rgba(255,255,255,0.55); }

      /* ── Content ─────────────────────────────────────────────────────── */
      #t1-sec-dots .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-dots .kicker {
        font-family: var(--font-display); font-weight: var(--wt-semi); font-style: italic;
        font-size: var(--size-label); letter-spacing: 0.20em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 30px;
      }
      #t1-sec-dots .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.05; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1340px; padding: 0 80px;
      }
      #t1-sec-dots .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* ── Global chrome ────────────────────────────────────────────────── */
      #t1-sec-dots .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-dots .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-dots"
         data-composition-id="t1-sec-dots"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <!--
        20 dots at fixed coordinates.
        Spread them across the frame; denser near vertical center (540px ±280px).
        Coordinates are chosen deterministically by a regular-ish distribution:
        x: 7 columns across 1920; y: spread above and below centre.
      -->
      <div class="particles">
        <!-- row upper-far (y ≈ 200–280) -->
        <div class="dot dot-xs" style="left:220px; top:210px;"></div>
        <div class="dot dot-sm" style="left:540px; top:248px;"></div>
        <div class="dot dot-xs" style="left:960px; top:195px;"></div>
        <div class="dot dot-w"  style="left:1380px; top:232px;"></div>
        <div class="dot dot-xs" style="left:1700px; top:218px;"></div>

        <!-- row upper-mid (y ≈ 340–420) -->
        <div class="dot dot-sm" style="left:150px; top:360px;"></div>
        <div class="dot dot-lg" style="left:420px; top:398px;"></div>
        <div class="dot dot-xs" style="left:760px; top:348px;"></div>
        <div class="dot dot-sm" style="left:1160px; top:415px;"></div>
        <div class="dot dot-lg" style="left:1500px; top:365px;"></div>
        <div class="dot dot-xs" style="left:1800px; top:402px;"></div>

        <!-- flanking row (y ≈ 520–580, beside the headline) -->
        <div class="dot dot-sm" style="left:90px;  top:545px;"></div>
        <div class="dot dot-w"  style="left:310px; top:530px;"></div>
        <div class="dot dot-lg" style="left:1610px; top:548px;"></div>
        <div class="dot dot-sm" style="left:1840px; top:528px;"></div>

        <!-- row lower-mid (y ≈ 640–720) -->
        <div class="dot dot-xs" style="left:180px; top:658px;"></div>
        <div class="dot dot-sm" style="left:640px; top:700px;"></div>
        <div class="dot dot-lg" style="left:1280px; top:674px;"></div>
        <div class="dot dot-xs" style="left:1720px; top:712px;"></div>

        <!-- row lower-far (y ≈ 820–860) -->
        <div class="dot dot-w"  style="left:480px; top:838px;"></div>
        <div class="dot dot-sm" style="left:1440px; top:852px;"></div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="kicker" data-slot="kicker">The Foundation</div>
        <div class="headline" data-slot="headline">Every <em>Signal</em> Starts as Noise</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-dots .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-dots .bloom",
        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      tl.from("#t1-sec-dots .grid",
        { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* Dots fade + drift up from below — staggered across all 22 dots.
         Use a single selector with stagger so no individual targeting needed. */
      tl.from("#t1-sec-dots .dot",
        { autoAlpha: 0, y: 40, scale: 0.4, duration: 1.0, ease: "power3.out", stagger: 0.045 }, 0.30);

      /* kicker */
      tl.from("#t1-sec-dots .kicker",
        { autoAlpha: 0, y: -18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.65);

      /* headline focus-pulls through the particle cloud */
      tl.from("#t1-sec-dots .headline",
        { autoAlpha: 0, filter: "blur(20px)", y: 22, duration: 1.05, ease: "power4.out" }, 0.95);

      /* slow continued upward drift of all dots during hold */
      tl.to("#t1-sec-dots .dot",
        { y: -18, duration: 4.5, ease: "sine.inOut", stagger: 0.04 }, 2.0);

      /* gentle pulse on a subset of larger dots */
      tl.to(["#t1-sec-dots .dot-lg"],
        { opacity: 0.45, scale: 0.80, duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.15 }, 2.3);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-dots"] = tl;
    </script>
  </body>
</html>
