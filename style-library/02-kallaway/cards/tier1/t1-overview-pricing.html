<!doctype html>
<!--
  KALLAWAY · tier1 · overview · PRICING
  Full-screen takeover. Three pricing-tier glass cards in a row — each with a
  tier name, a big price that counts up, and 2–3 feature lines. The middle card
  is accent-featured (yellow accent-2 as the "recommended" highlight).
  Count-up uses tl.to({val:0},{val:target,onUpdate}, pos) — never 3-arg fromTo.
  Slots: title, t1_name, t1_price (number), t1_f1, t1_f2, t1_f3,
                t2_name, t2_price, t2_f1, t2_f2, t2_f3,
                t3_name, t3_price, t3_f1, t3_f2, t3_f3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-price {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-price .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-price .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.44;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 28%, transparent 76%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 28%, transparent 76%);
      }

      /* Title */
      #t1-ov-price .title-row {
        position: absolute; left: 0; right: 0; top: 80px; text-align: center; z-index: 4;
      }
      #t1-ov-price .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-price .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Three-card row */
      #t1-ov-price .cards {
        position: absolute; left: 130px; right: 130px; top: 234px; bottom: 64px;
        display: flex; gap: 44px; align-items: stretch; z-index: 4;
      }

      /* Glass card base */
      #t1-ov-price .pcard {
        flex: 1;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 56px 52px 52px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 0;
        position: relative; overflow: hidden;
      }
      /* Top hairline */
      #t1-ov-price .pcard::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }

      /* Featured (middle) tier — yellow accent-2 */
      #t1-ov-price .pcard.featured {
        border-color: rgba(var(--accent2-rgb), 0.42);
        box-shadow: var(--glass-shadow), 0 0 80px rgba(var(--accent2-rgb), 0.20);
      }

      /* "RECOMMENDED" badge */
      #t1-ov-price .badge {
        display: inline-flex; align-items: center; gap: 8px;
        border: var(--stroke) solid rgba(var(--accent2-rgb), 0.55);
        border-radius: 999px;
        padding: 7px 20px;
        font-family: var(--font-mono); font-size: 21px; font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent-2);
        background: rgba(var(--accent2-rgb), 0.07);
        box-shadow: 0 0 12px rgba(var(--accent2-rgb), 0.30);
        margin-bottom: 28px; align-self: flex-start;
      }
      #t1-ov-price .badge-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 8px rgba(var(--accent2-rgb), 0.8);
      }
      /* non-featured cards get a placeholder spacer to align */
      #t1-ov-price .badge-spacer {
        height: 54px; margin-bottom: 28px;
      }

      /* Tier name */
      #t1-ov-price .tier-name {
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--text-faint); margin-bottom: 14px;
      }
      #t1-ov-price .pcard.featured .tier-name {
        color: var(--accent-2); text-shadow: 0 0 12px rgba(var(--accent2-rgb), 0.50);
      }

      /* Big price */
      #t1-ov-price .price-row {
        display: flex; align-items: flex-end; gap: 8px; margin-bottom: 32px; line-height: 1;
      }
      #t1-ov-price .price-dollar {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 54px; color: var(--text-dim); line-height: 1.1;
        padding-bottom: 8px;
      }
      #t1-ov-price .price-num {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 108px; letter-spacing: var(--track-tight); line-height: 1;
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-ov-price .pcard.featured .price-num {
        color: var(--accent-2); text-shadow: 0 0 22px rgba(var(--accent2-rgb), 0.55), 0 0 56px rgba(var(--accent2-rgb), 0.28);
      }
      #t1-ov-price .price-period {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 26px; color: var(--text-faint); line-height: 1.2;
        padding-bottom: 14px;
      }

      /* Feature list */
      #t1-ov-price .features {
        display: flex; flex-direction: column; gap: 16px; margin-top: auto;
        border-top: 1px solid rgba(255,255,255,0.08); padding-top: 28px; width: 100%;
      }
      #t1-ov-price .feat {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 27px; line-height: 1.4; color: var(--text-dim);
      }
      #t1-ov-price .feat-dot {
        width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        background: rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.40);
      }
      #t1-ov-price .pcard.featured .feat-dot {
        background: var(--accent-2);
        box-shadow: 0 0 8px rgba(var(--accent2-rgb), 0.50);
      }

      #t1-ov-price .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-price .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-price" data-composition-id="t1-ov-price" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Simple, <em>Transparent Pricing</em></div>
      </div>

      <div class="cards">
        <!-- Tier 1 — Starter -->
        <div class="pcard" id="price-t1">
          <div class="badge-spacer"></div>
          <div class="tier-name" data-slot="t1_name">Starter</div>
          <div class="price-row">
            <div class="price-dollar">$</div>
            <div class="price-num" id="price-num-1">0</div>
            <div class="price-period">/mo</div>
          </div>
          <div class="features">
            <div class="feat"><div class="feat-dot"></div><span data-slot="t1_f1">Up to 3 projects</span></div>
            <div class="feat"><div class="feat-dot"></div><span data-slot="t1_f2">Basic analytics</span></div>
            <div class="feat"><div class="feat-dot"></div><span data-slot="t1_f3">Community support</span></div>
          </div>
        </div>

        <!-- Tier 2 — Pro (featured) -->
        <div class="pcard featured" id="price-t2">
          <div class="badge">
            <div class="badge-dot"></div> Recommended
          </div>
          <div class="tier-name" data-slot="t2_name">Pro</div>
          <div class="price-row">
            <div class="price-dollar">$</div>
            <div class="price-num" id="price-num-2">0</div>
            <div class="price-period">/mo</div>
          </div>
          <div class="features">
            <div class="feat"><div class="feat-dot"></div><span data-slot="t2_f1">Unlimited projects</span></div>
            <div class="feat"><div class="feat-dot"></div><span data-slot="t2_f2">Advanced analytics</span></div>
            <div class="feat"><div class="feat-dot"></div><span data-slot="t2_f3">Priority support</span></div>
          </div>
        </div>

        <!-- Tier 3 — Enterprise -->
        <div class="pcard" id="price-t3">
          <div class="badge-spacer"></div>
          <div class="tier-name" data-slot="t3_name">Enterprise</div>
          <div class="price-row">
            <div class="price-dollar">$</div>
            <div class="price-num" id="price-num-3">0</div>
            <div class="price-period">/mo</div>
          </div>
          <div class="features">
            <div class="feat"><div class="feat-dot"></div><span data-slot="t3_f1">Custom integrations</span></div>
            <div class="feat"><div class="feat-dot"></div><span data-slot="t3_f2">Dedicated account manager</span></div>
            <div class="feat"><div class="feat-dot"></div><span data-slot="t3_f3">SLA & compliance</span></div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-price .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "112px 86px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-price .bloom", { autoAlpha: 0, scale: 0.92, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-price .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* title glides in */
        .from("#t1-ov-price .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.55)

        /* cards spring in staggered */
        .from("#price-t1", { autoAlpha: 0, y: 56, scale: 0.95, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.92, ease: "back.out(1.4)" }, 1.05)
        .from("#price-t2", { autoAlpha: 0, y: 56, scale: 0.95, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.92, ease: "back.out(1.4)" }, 1.22)
        .from("#price-t3", { autoAlpha: 0, y: 56, scale: 0.95, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.92, ease: "back.out(1.4)" }, 1.39)

        /* count-up prices — correct pattern: tl.to({val:0},{val:target,onUpdate},pos) */
        .to({ val: 0 }, { val: 0, duration: 0.6, ease: "power2.out",
          onUpdate: function() { document.getElementById("price-num-1").textContent = Math.round(this.targets()[0].val); } }, 1.5)
        .to({ val: 0 }, { val: 79, duration: 0.9, ease: "power3.out",
          onUpdate: function() { document.getElementById("price-num-2").textContent = Math.round(this.targets()[0].val); } }, 1.65)
        .to({ val: 0 }, { val: 299, duration: 0.9, ease: "power3.out",
          onUpdate: function() { document.getElementById("price-num-3").textContent = Math.round(this.targets()[0].val); } }, 1.80)

        /* breathing glow on featured — finite yellow */
        .to("#price-t2", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 110px rgba(245,216,42,0.28)",
          duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        /* slow upward drift */
        .to("#t1-ov-price .cards", { y: -10, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-price"] = tl;
    </script>
  </body>
</html>
