<!doctype html>
<!--
  KALLAWAY · tier1 · section · DEPTH
  Layered parallax focus stack. Three planes of faint blurred ghost text sit at
  different z-depth blur levels behind the sharp, glowing foreground title. Each
  plane drifts at a different speed during the hold, creating a convincing depth
  illusion — like the idea exists in a space with volume.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-depth {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-depth .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      #t1-sec-depth .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.38;
        -webkit-mask-image: radial-gradient(100% 90% at 50% 50%, #000 20%, transparent 70%);
                mask-image: radial-gradient(100% 90% at 50% 50%, #000 20%, transparent 70%);
      }

      /* === depth planes === */
      /* Plane Z-far: very blurred, very faint, slightly larger scale */
      #t1-sec-depth .plane-far {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(1.22);
        width: 1920px; text-align: center;
        z-index: 2;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 128px; line-height: 1.06;
        letter-spacing: 0.04em;
        color: var(--white); opacity: 0.055;
        filter: blur(18px);
        pointer-events: none; white-space: nowrap;
      }

      /* Plane Z-mid: medium blur, medium faint */
      #t1-sec-depth .plane-mid {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(1.09);
        width: 1920px; text-align: center;
        z-index: 3;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 108px; line-height: 1.06;
        letter-spacing: 0.01em;
        color: var(--accent); opacity: 0.08;
        filter: blur(8px);
        pointer-events: none; white-space: nowrap;
      }

      /* Plane Z-near: slight blur, more visible — almost readable */
      #t1-sec-depth .plane-near {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(1.02);
        width: 1920px; text-align: center;
        z-index: 4;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 92px; line-height: 1.06;
        letter-spacing: -0.005em;
        color: var(--white); opacity: 0.14;
        filter: blur(3px);
        pointer-events: none; white-space: nowrap;
      }

      /* === sharp foreground content === */
      #t1-sec-depth .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        text-align: center; z-index: 6;
        padding: 0 120px;
      }

      #t1-sec-depth .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 36px;
      }

      #t1-sec-depth .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-sec-depth .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-depth .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-depth .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-depth" data-composition-id="t1-sec-depth" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- ghost depth planes — duplicate text, different blur/opacity/scale -->
      <div class="plane-far">Prompt Engineering That Converts</div>
      <div class="plane-mid">Prompt Engineering That Converts</div>
      <div class="plane-near">Prompt Engineering That Converts</div>

      <!-- sharp foreground -->
      <div class="content">
        <div class="kicker" data-slot="kicker">Deep Dive</div>
        <div class="headline" data-slot="headline">Prompt Engineering<br>That <em>Converts</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain */
      tl.fromTo("#t1-sec-depth .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom */
      tl.from("#t1-sec-depth .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0);
      tl.from("#t1-sec-depth .grid",
        { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* far plane emerges first, very slowly */
      tl.from("#t1-sec-depth .plane-far",
        { autoAlpha: 0, scale: 1.35, transformOrigin: "50% 50%", duration: 1.6, ease: "power3.out" }, 0.1);

      /* mid plane next */
      tl.from("#t1-sec-depth .plane-mid",
        { autoAlpha: 0, scale: 1.18, transformOrigin: "50% 50%", duration: 1.4, ease: "power3.out" }, 0.35);

      /* near plane */
      tl.from("#t1-sec-depth .plane-near",
        { autoAlpha: 0, scale: 1.08, transformOrigin: "50% 50%", duration: 1.2, ease: "power3.out" }, 0.55);

      /* foreground kicker + headline resolve into focus */
      tl.from("#t1-sec-depth .kicker",
        { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.75);
      tl.from("#t1-sec-depth .headline",
        { autoAlpha: 0, y: 28, filter: "blur(22px)", duration: 1.1, ease: "power4.out" }, 0.95);

      /* parallax drift during hold — each plane moves at different speed */
      tl.to("#t1-sec-depth .plane-far",
        { y: -36, x: 18, duration: 4.5, ease: "sine.inOut" }, 2.0);
      tl.to("#t1-sec-depth .plane-mid",
        { y: -20, x: 10, duration: 4.5, ease: "sine.inOut" }, 2.0);
      tl.to("#t1-sec-depth .plane-near",
        { y: -9, x: 4, duration: 4.5, ease: "sine.inOut" }, 2.0);
      /* foreground barely moves */
      tl.to("#t1-sec-depth .content",
        { y: -4, duration: 4.5, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-depth"] = tl;
    </script>
  </body>
</html>
