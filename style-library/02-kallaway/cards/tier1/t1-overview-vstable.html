<!doctype html>
<!--
  KALLAWAY · tier1 · overview · VS TABLE
  Full-screen takeover. Two-column comparison table (A vs B) with 3 rows.
  Glass header cells, glowing center divider, floating "vs" badge.
  Slots: title, col_a (column A header), col_b (column B header),
         r1_label, r1_a, r1_b,
         r2_label, r2_a, r2_b,
         r3_label, r3_a, r3_b.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-vstable {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Ambience */
      #t1-ov-vstable .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-vstable .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner); z-index: 1; opacity: 0.5;
      }
      #t1-ov-vstable .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.40;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 28%, transparent 76%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 28%, transparent 76%);
      }

      /* Title */
      #t1-ov-vstable .title-row {
        position: absolute; left: 0; right: 0; top: 70px; text-align: center; z-index: 4;
      }
      #t1-ov-vstable .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-vstable .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Table wrapper */
      #t1-ov-vstable .table-wrap {
        position: absolute; left: 160px; right: 160px; top: 220px; bottom: 80px;
        z-index: 4; display: flex; flex-direction: column;
      }

      /* Header row */
      #t1-ov-vstable .hdr-row {
        display: grid; grid-template-columns: 260px 1fr 80px 1fr;
        gap: 0; margin-bottom: 10px;
      }
      #t1-ov-vstable .hdr-spacer { /* row-label gap */ }
      #t1-ov-vstable .hdr-cell {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 28px 36px;
        position: relative; overflow: hidden;
        display: flex; align-items: center; gap: 16px;
      }
      /* Hairline top highlight */
      #t1-ov-vstable .hdr-cell::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 20%, var(--glass-hi) 80%, transparent);
      }
      #t1-ov-vstable .hdr-cell.col-a { border-right: none; }
      #t1-ov-vstable .hdr-cell.col-a::after {
        content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb),0.60), transparent);
      }
      #t1-ov-vstable .hdr-cell.col-b { border-left: none; }
      #t1-ov-vstable .hdr-cell.col-b::after {
        content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent2-rgb),0.60), transparent);
      }
      #t1-ov-vstable .hdr-dot {
        width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      }
      #t1-ov-vstable .hdr-dot.a { background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),0.8); }
      #t1-ov-vstable .hdr-dot.b { background: var(--accent-2); box-shadow: 0 0 10px rgba(var(--accent2-rgb),0.8); }
      #t1-ov-vstable .hdr-text {
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
      }
      #t1-ov-vstable .hdr-cell.col-a .hdr-text { color: var(--accent); }
      #t1-ov-vstable .hdr-cell.col-b .hdr-text { color: var(--accent-2); }

      /* Data rows */
      #t1-ov-vstable .rows {
        flex: 1; display: flex; flex-direction: column; gap: 0;
      }
      #t1-ov-vstable .data-row {
        flex: 1; display: grid; grid-template-columns: 260px 1fr 80px 1fr;
        gap: 0;
      }
      #t1-ov-vstable .data-row + .data-row { border-top: 1px solid rgba(255,255,255,0.07); }

      /* Row label */
      #t1-ov-vstable .row-label {
        display: flex; align-items: center; padding-right: 28px;
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); color: var(--text-faint);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        justify-content: flex-end;
      }

      /* Rule — the glowing vertical divider */
      #t1-ov-vstable .rule {
        display: flex; align-items: stretch; justify-content: center;
        position: relative;
      }
      #t1-ov-vstable .rule-line {
        width: 1.5px;
        background: linear-gradient(180deg, transparent 0%, rgba(var(--accent-rgb),0.55) 20%, rgba(var(--accent-rgb),0.55) 80%, transparent 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb),0.35);
        transform: scaleY(0);
        transform-origin: top center;
      }

      /* "vs" badge sitting on the rule */
      #t1-ov-vstable .vs-badge {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 64px; height: 64px; border-radius: 50%;
        background: var(--canvas-deep);
        border: var(--stroke) solid rgba(var(--accent-rgb),0.55);
        box-shadow: 0 0 22px rgba(var(--accent-rgb),0.40), 0 0 56px rgba(var(--accent-rgb),0.20);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 21px; letter-spacing: 0.04em;
        color: var(--accent); text-shadow: var(--textglow-accent);
        z-index: 5;
      }

      /* Cell */
      #t1-ov-vstable .cell {
        display: flex; align-items: center;
        padding: 28px 40px;
        background: var(--glass-bg);
        border: var(--stroke) solid var(--glass-border);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 30px; line-height: 1.4; color: var(--text);
      }
      #t1-ov-vstable .cell.col-a { border-right: none; }
      #t1-ov-vstable .cell.col-b { border-left: none; }
      #t1-ov-vstable .data-row:first-child .cell { border-top: none; border-radius: 0; }
      #t1-ov-vstable .data-row:last-child .cell.col-a { border-radius: 0 0 0 var(--radius-sm); }
      #t1-ov-vstable .data-row:last-child .cell.col-b { border-radius: 0 0 var(--radius-sm) 0; }

      #t1-ov-vstable .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-vstable .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-vstable" data-composition-id="t1-ov-vstable" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">The Core <em>Trade-off</em></div>
      </div>

      <div class="table-wrap">
        <!-- Header row -->
        <div class="hdr-row" id="vs-hdr">
          <div class="hdr-spacer"></div>
          <div class="hdr-cell col-a">
            <div class="hdr-dot a"></div>
            <div class="hdr-text" data-slot="col_a">Option A</div>
          </div>
          <div class="rule" id="vs-rule">
            <div class="rule-line" id="vs-rule-line"></div>
            <div class="vs-badge" id="vs-badge">vs</div>
          </div>
          <div class="hdr-cell col-b">
            <div class="hdr-dot b"></div>
            <div class="hdr-text" data-slot="col_b">Option B</div>
          </div>
        </div>

        <!-- Data rows -->
        <div class="rows">
          <div class="data-row" id="vs-r1">
            <div class="row-label" data-slot="r1_label">Speed</div>
            <div class="cell col-a" data-slot="r1_a">Ships in 2 weeks</div>
            <div class="rule"><div class="rule-line"></div></div>
            <div class="cell col-b" data-slot="r1_b">Months to launch</div>
          </div>
          <div class="data-row" id="vs-r2">
            <div class="row-label" data-slot="r2_label">Cost</div>
            <div class="cell col-a" data-slot="r2_a">Low upfront spend</div>
            <div class="rule"><div class="rule-line"></div></div>
            <div class="cell col-b" data-slot="r2_b">Heavy infrastructure</div>
          </div>
          <div class="data-row" id="vs-r3">
            <div class="row-label" data-slot="r3_label">Risk</div>
            <div class="cell col-a" data-slot="r3_a">Learns fast from users</div>
            <div class="rule"><div class="rule-line"></div></div>
            <div class="cell col-b" data-slot="r3_b">Bets on assumptions</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-vstable .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "100px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-vstable .bloom",        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-vstable .bloom-corner",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.25)
        .from("#t1-ov-vstable .grid",          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-vstable .title",         { autoAlpha: 0, y: 24, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* header row springs in */
        .from("#vs-hdr",                       { autoAlpha: 0, y: -18, filter: "blur(8px)", duration: 0.85, ease: "back.out(1.4)" }, 1.05)

        /* rule draws in */
        .to("#t1-ov-vstable .rule-line",       { scaleY: 1, duration: 0.75, ease: "power3.out", stagger: 0.14 }, 1.3)

        /* vs badge pops */
        .from("#vs-badge",                     { autoAlpha: 0, scale: 0.5, duration: 0.5, ease: "back.out(2.0)" }, 1.6)

        /* rows fade-up staggered */
        .from("#vs-r1",                        { autoAlpha: 0, y: 28, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 1.5)
        .from("#vs-r2",                        { autoAlpha: 0, y: 28, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 1.65)
        .from("#vs-r3",                        { autoAlpha: 0, y: 28, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 1.80)

        /* badge glow pulse — finite */
        .to("#vs-badge",                       { boxShadow: "0 0 36px rgba(55,189,248,0.65), 0 0 80px rgba(55,189,248,0.30)", duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.4)

        /* gentle hold drift */
        .to("#t1-ov-vstable .table-wrap",      { y: -8, duration: 5.0, ease: "sine.inOut" }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t1-ov-vstable"] = tl;
    </script>
  </body>
</html>
