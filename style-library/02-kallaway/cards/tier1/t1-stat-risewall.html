<!doctype html>
<!--
  KALLAWAY · tier1 · stat · RISEWALL
  The big number starts below a frosted glass "wall" (a wide glassmorphism panel)
  and rises up through it as a mask reveal — going from obscured to fully visible
  above the wall, with a trailing glow edge as it breaks through.
  Slots: kicker (~28 chars), stat (e.g. "97%"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-rwall {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-rwall .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-rwall .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── frosted glass wall — fixed, mid-canvas ── */
      #t1-stat-rwall .wall {
        position: absolute;
        left: 160px; right: 160px;
        top: 520px; height: 220px;
        z-index: 3;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-top: var(--stroke) solid var(--glass-hi);
        border-bottom: var(--stroke) solid var(--glass-border);
        border-left: var(--stroke) solid var(--glass-border);
        border-right: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow),
                    0 0 60px rgba(var(--accent-rgb),0.08);
      }

      /* rim glow on top edge of wall (the "break-through" edge) */
      #t1-stat-rwall .wall-rim {
        position: absolute;
        left: 160px; right: 160px;
        top: 519px; height: 3px;
        z-index: 5;
        background: linear-gradient(90deg,
          transparent 0%, rgba(var(--accent-rgb),0.55) 20%,
          rgba(255,255,255,0.85) 50%,
          rgba(var(--accent-rgb),0.55) 80%, transparent 100%);
        box-shadow: 0 0 24px rgba(var(--accent-rgb),0.60),
                    0 0 60px rgba(var(--accent-rgb),0.30);
        border-radius: 2px;
      }

      /* ── content: stat rises through wall, text sits below ── */
      #t1-stat-rwall .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column; align-items: center;
        /* stat will be placed absolutely, text items use margin-top */
      }

      #t1-stat-rwall .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-top: 108px;
      }

      /* stat — rises from y=750 up through wall to y~240 */
      #t1-stat-rwall .stat {
        position: absolute; left: 0; right: 0;
        top: 0; /* driven by GSAP y */
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb),0.80) 72%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 36px rgba(var(--accent-rgb), 0.65));
        z-index: 6;   /* above wall */
        padding-top: 260px; /* pushes text box center lower; JS moves with y */
      }

      /* glow wake behind rising number */
      #t1-stat-rwall .stat-wake {
        position: absolute; left: 50%; transform: translateX(-50%);
        width: 700px; height: 300px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb),0.25) 0%, transparent 70%);
        z-index: 5;
        padding-top: 420px; /* rough initial center below stat */
        pointer-events: none;
      }

      #t1-stat-rwall .lower-group {
        position: absolute; left: 0; right: 0; top: 680px;
        display: flex; flex-direction: column; align-items: center; gap: 32px;
        z-index: 4;
      }

      #t1-stat-rwall .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 900px; line-height: 1.45;
      }
      #t1-stat-rwall .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-rwall .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-rwall .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-stat-rwall .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-rwall" data-composition-id="t1-stat-rwall" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- frosted wall -->
      <div class="wall" id="t1-stat-rwall-wall"></div>
      <div class="wall-rim" id="t1-stat-rwall-rim"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">COURSE SATISFACTION · COHORT 8</div>

        <!-- stat rises through wall -->
        <div class="stat" id="t1-stat-rwall-num" data-slot="stat">97%</div>
        <div class="stat-wake" id="t1-stat-rwall-wake"></div>

        <div class="lower-group">
          <div class="label" data-slot="label">graduates who would <em>recommend the program</em> to a colleague within the first month</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS GRADUATE SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-stat-rwall .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-rwall .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-rwall .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-rwall .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.40)

        /* wall slides in from off-screen right */
        .from("#t1-stat-rwall-wall",
          { autoAlpha: 0, x: 200, duration: 0.9, ease: "expo.out" }, 0.45)
        .from("#t1-stat-rwall-rim",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "50% 50%",
            duration: 0.7, ease: "expo.out" }, 0.65)

        /* stat starts below wall (y=320 means 320px below its natural position ~260px from top)
           and rises up through it to natural position (y=0) */
        .from("#t1-stat-rwall-num",
          { autoAlpha: 0, y: 400, duration: 0.4, ease: "power1.out" }, 0.70)
        .to("#t1-stat-rwall-num",
          { y: 0, duration: 1.2, ease: "power4.out" }, 0.80)

        /* wake glow follows stat up */
        .from("#t1-stat-rwall-wake",
          { autoAlpha: 0, y: 400, duration: 0.4, ease: "power1.out" }, 0.70)
        .to("#t1-stat-rwall-wake",
          { y: -280, duration: 1.2, ease: "power4.out" }, 0.80)

        /* rim brightens as stat crosses through */
        .to("#t1-stat-rwall-rim",
          { opacity: 1.5, duration: 0.35, ease: "power2.in" }, 1.10)
        .to("#t1-stat-rwall-rim",
          { opacity: 1.0, duration: 0.4, ease: "power2.out" }, 1.45)

        /* lower text group rises in */
        .from("#t1-stat-rwall .lower-group",
          { autoAlpha: 0, y: 30, duration: 0.85, ease: "power3.out" }, 1.85)

        /* source */
        .from("#t1-stat-rwall .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.25)

        /* final slow levitation drift */
        .to("#t1-stat-rwall-num",
          { y: -18, duration: 4.0, ease: "sine.inOut" }, 2.4)
        .to("#t1-stat-rwall-wake",
          { y: -298, duration: 4.0, ease: "sine.inOut" }, 2.4)

        /* wall rim breathing glow */
        .to("#t1-stat-rwall-rim",
          { opacity: 0.55, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-rwall"] = tl;
    </script>
  </body>
</html>
