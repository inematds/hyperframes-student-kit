<!doctype html>
<!--
  KALLAWAY · tier1 · overview · GRID9
  Full-screen takeover. 3x3 grid of 9 small glass tiles, each with a
  numbered watermark and a short label. Tiles stagger in left-to-right,
  top-to-bottom with spring scale + blur-in.
  Slots: title, i1–i9.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-grid9 {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-ov-grid9 .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-ov-grid9 .grid-bg {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.42;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-grid9 .title-row {
        position: absolute; left: 0; right: 0; top: 72px; text-align: center; z-index: 4;
      }
      #t1-ov-grid9 .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-grid9 .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* 3x3 grid */
      #t1-ov-grid9 .grid-wrap {
        position: absolute; left: 136px; right: 136px; top: 218px; bottom: 68px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 26px; z-index: 4;
      }

      /* Glass tile */
      #t1-ov-grid9 .tile {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; flex-direction: column;
        align-items: flex-start; justify-content: flex-end;
        padding: 28px 36px;
        position: relative; overflow: hidden;
      }
      /* Top hairline highlight */
      #t1-ov-grid9 .tile::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }
      /* Corner number watermark */
      #t1-ov-grid9 .tile-num {
        position: absolute; top: 20px; right: 26px;
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--accent-rgb), 0.28); font-weight: var(--wt-bold);
        letter-spacing: 0.04em;
      }
      /* Small glowing accent rule */
      #t1-ov-grid9 .tile-rule {
        width: 28px; height: 2px; border-radius: 1px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        margin-bottom: 12px;
      }
      /* Tile label */
      #t1-ov-grid9 .tile-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 30px; letter-spacing: var(--track-snug); line-height: 1.25;
        color: var(--white); text-shadow: var(--textglow);
      }

      #t1-ov-grid9 .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-grid9 .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-grid9" data-composition-id="t1-ov-grid9" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid-bg"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Nine Things That <em>Actually Matter</em></div>
      </div>

      <div class="grid-wrap">
        <div class="tile" id="g9-i1">
          <div class="tile-num">01</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i1">Strategy</div>
        </div>
        <div class="tile" id="g9-i2">
          <div class="tile-num">02</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i2">Research</div>
        </div>
        <div class="tile" id="g9-i3">
          <div class="tile-num">03</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i3">Positioning</div>
        </div>
        <div class="tile" id="g9-i4">
          <div class="tile-num">04</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i4">Messaging</div>
        </div>
        <div class="tile" id="g9-i5">
          <div class="tile-num">05</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i5">Distribution</div>
        </div>
        <div class="tile" id="g9-i6">
          <div class="tile-num">06</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i6">Conversion</div>
        </div>
        <div class="tile" id="g9-i7">
          <div class="tile-num">07</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i7">Retention</div>
        </div>
        <div class="tile" id="g9-i8">
          <div class="tile-num">08</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i8">Analytics</div>
        </div>
        <div class="tile" id="g9-i9">
          <div class="tile-num">09</div>
          <div class="tile-rule"></div>
          <div class="tile-label" data-slot="i9">Iteration</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-grid9 .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "94px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-grid9 .bloom",   { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-grid9 .grid-bg", { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title first */
        .from("#t1-ov-grid9 .title",   { autoAlpha: 0, y: 26, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* 9 tiles stagger in — 0.13s apart */
        .from("#g9-i1", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.0)
        .from("#g9-i2", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.13)
        .from("#g9-i3", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.26)
        .from("#g9-i4", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.39)
        .from("#g9-i5", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.52)
        .from("#g9-i6", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.65)
        .from("#g9-i7", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.78)
        .from("#g9-i8", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 1.91)
        .from("#g9-i9", { autoAlpha: 0, y: 38, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.75, ease: "back.out(1.4)" }, 2.04)

        /* last tile accent rule glow pulse — finite */
        .to("#g9-i9 .tile-rule", { boxShadow: "0 0 16px rgba(55,189,248,0.85)",
          width: "50px", duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)

        /* slow hold drift */
        .to("#t1-ov-grid9 .grid-wrap", { y: -10, duration: 5.0, ease: "sine.inOut" }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-ov-grid9"] = tl;
    </script>
  </body>
</html>
