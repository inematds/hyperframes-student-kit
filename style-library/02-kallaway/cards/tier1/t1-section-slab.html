<!doctype html>
<!--
  KALLAWAY · tier1 · section · SLAB
  Full-screen chapter takeover. The headline sits on a single floating glass slab
  surface — a wide frosted panel with depth (parallax y-drift + drop shadow +
  edge-lit rim). The kicker is a pill chip pinned to the slab. The slab springs
  in with back.out(1.4) and gently drifts upward during the hold.
  Slots: kicker (~16 chars), headline (~52 chars, <em> on accent-glow phrase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-slab {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-slab .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-slab .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.44;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
      }

      /* Glass slab container — springs in */
      #t1-sec-slab .slab-wrap {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
      }
      #t1-sec-slab .slab {
        position: relative;
        width: 1480px;
        padding: 76px 100px 84px;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-lg);
        border: 1.5px solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 80px 0px rgba(var(--accent-rgb), 0.10),
          inset 0 1.5px 0 var(--glass-hi);
        /* Edge-lit rim: subtle blue inner glow on bottom edge */
        outline: none;
      }
      /* Blue neon rim on the bottom of the slab */
      #t1-sec-slab .slab::after {
        content: "";
        position: absolute; bottom: -1px; left: 10%; right: 10%; height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.80) 30%,
          rgba(var(--accent-rgb), 0.80) 70%,
          transparent 100%);
        box-shadow: 0 0 20px 4px rgba(var(--accent-rgb), 0.35);
        border-radius: 0 0 2px 2px;
      }

      /* Kicker pill — floats above the slab headline */
      #t1-sec-slab .kicker {
        display: inline-block;
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 30px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        background: rgba(var(--accent-rgb), 0.10);
        border: 1px solid rgba(var(--accent-rgb), 0.30);
        border-radius: 100px;
        padding: 8px 28px;
        margin-bottom: 38px;
      }

      #t1-sec-slab .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1280px;
      }
      #t1-sec-slab .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-slab .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-slab .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-slab" data-composition-id="t1-sec-slab" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="slab-wrap">
        <div class="slab">
          <div class="kicker" data-slot="kicker">Section Four</div>
          <div class="headline" data-slot="headline">Building Systems That <em>Scale</em> Without Breaking</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-slab .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-slab .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-slab .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* slab springs in — glass card back.out spring */
      tl.from("#t1-sec-slab .slab-wrap",
            { autoAlpha: 0, y: 50, scale: 0.96, transformOrigin: "50% 50%",
              filter: "blur(14px)", duration: 1.1, ease: "back.out(1.4)" }, 0.55);

      /* kicker chip stagger-in after slab */
      tl.from("#t1-sec-slab .kicker",
            { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 1.10);

      /* headline blur-in */
      tl.from("#t1-sec-slab .headline",
            { autoAlpha: 0, y: 28, filter: "blur(16px)", duration: 0.9, ease: "power4.out" }, 1.28);

      /* slab parallax drift upward during the hold */
      tl.to("#t1-sec-slab .slab-wrap",
            { y: -22, duration: 5.0, ease: "sine.inOut" }, 1.6);

      /* slab edge-lit rim glow pulse */
      tl.to("#t1-sec-slab .slab",
            { boxShadow:
                "0 24px 70px rgba(0,0,0,0.50), 0 0 140px 0px rgba(var(--accent-rgb),0.22), inset 0 1.5px 0 rgba(255,255,255,0.22)",
              duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0);

      /* headline glow breathes */
      tl.to("#t1-sec-slab .headline",
            { textShadow: "0 0 28px rgba(255,255,255,0.55), 0 0 60px rgba(var(--accent-rgb),0.38)",
              duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4);

      /* slow bloom drift during hold */
      tl.to("#t1-sec-slab .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-slab"] = tl;
    </script>
  </body>
</html>
