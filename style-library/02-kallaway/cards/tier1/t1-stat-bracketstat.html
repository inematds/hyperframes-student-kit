<!doctype html>
<!--
  KALLAWAY · tier1 · stat · BRACKETSTAT
  Two tall glowing bracket glyphs scale in from the sides and lock around the
  big headline number. The brackets breathe with a slow neon pulse after they
  settle. Clean typographic composition, no extra shapes.
  Slots: kicker (~28 chars uppercase), stat (e.g. "3.2M"), label (~70 chars),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-brk {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-brk .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-brk .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── layout ── */
      #t1-stat-brk .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 48px;
      }

      #t1-stat-brk .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* ── bracket + number row ── */
      #t1-stat-brk .bracket-row {
        display: flex; align-items: center; gap: 32px;
      }

      /* bracket SVG panels */
      #t1-stat-brk .brk-svg {
        width: 90px; height: 460px; flex-shrink: 0;
      }

      /* the big number */
      #t1-stat-brk .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 320px; line-height: 1; letter-spacing: -0.04em;
        background: linear-gradient(165deg, #ffffff 10%, rgba(var(--accent-rgb),0.80) 75%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 36px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-brk .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 900px; line-height: 1.45;
      }
      #t1-stat-brk .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-brk .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-brk .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-brk .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-brk" data-composition-id="t1-stat-brk" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">HOURS OF AI CONTENT CREATED</div>

        <div class="bracket-row">
          <!-- left bracket -->
          <svg class="brk-svg" id="t1-stat-brk-left" viewBox="0 0 90 460"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="brk-glow-l" x="-80%" y="-10%" width="300%" height="120%">
                <feGaussianBlur stdDeviation="6" result="b"/>
                <feComposite in="SourceGraphic" in2="b" operator="over"/>
              </filter>
              <linearGradient id="brkGradL" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="rgba(55,189,248,0.30)"/>
                <stop offset="50%" stop-color="#37BDF8"/>
                <stop offset="100%" stop-color="rgba(55,189,248,0.30)"/>
              </linearGradient>
            </defs>
            <!-- top arm -->
            <path d="M 78 10 L 22 10 L 22 450" stroke="url(#brkGradL)" stroke-width="3.5"
                  stroke-linecap="round" stroke-linejoin="round"
                  fill="none" filter="url(#brk-glow-l)"/>
            <!-- bottom arm -->
            <path d="M 22 450 L 78 450" stroke="url(#brkGradL)" stroke-width="3.5"
                  stroke-linecap="round" fill="none" filter="url(#brk-glow-l)"/>
          </svg>

          <div class="stat" data-slot="stat">3.2M</div>

          <!-- right bracket -->
          <svg class="brk-svg" id="t1-stat-brk-right" viewBox="0 0 90 460"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="brk-glow-r" x="-80%" y="-10%" width="300%" height="120%">
                <feGaussianBlur stdDeviation="6" result="b"/>
                <feComposite in="SourceGraphic" in2="b" operator="over"/>
              </filter>
              <linearGradient id="brkGradR" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="rgba(55,189,248,0.30)"/>
                <stop offset="50%" stop-color="#37BDF8"/>
                <stop offset="100%" stop-color="rgba(55,189,248,0.30)"/>
              </linearGradient>
            </defs>
            <path d="M 12 10 L 68 10 L 68 450" stroke="url(#brkGradR)" stroke-width="3.5"
                  stroke-linecap="round" stroke-linejoin="round"
                  fill="none" filter="url(#brk-glow-r)"/>
            <path d="M 68 450 L 12 450" stroke="url(#brkGradR)" stroke-width="3.5"
                  stroke-linecap="round" fill="none" filter="url(#brk-glow-r)"/>
          </svg>
        </div>

        <div class="label" data-slot="label">content generated by AIS graduates in the 90 days <em>after completing the program</em></div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PLATFORM METRICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-stat-brk .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-brk .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-brk .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-brk .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.40)

        /* brackets fly in from the sides and scale up */
        .from("#t1-stat-brk-left",
          { autoAlpha: 0, x: -120, scaleX: 0.4, transformOrigin: "100% 50%",
            duration: 0.85, ease: "back.out(1.4)" }, 0.55)
        .from("#t1-stat-brk-right",
          { autoAlpha: 0, x: 120, scaleX: 0.4, transformOrigin: "0% 50%",
            duration: 0.85, ease: "back.out(1.4)" }, 0.55)

        /* stat slams in between brackets */
        .from("#t1-stat-brk .stat",
          { autoAlpha: 0, scale: 0.82, transformOrigin: "50% 50%",
            duration: 0.80, ease: "back.out(1.2)" }, 0.90)

        /* label */
        .from("#t1-stat-brk .label",
          { autoAlpha: 0, y: 22, duration: 0.85, ease: "power3.out" }, 1.85)

        /* source */
        .from("#t1-stat-brk .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.20)

        /* brackets breathe — scale in X slightly, then back */
        .to(["#t1-stat-brk-left","#t1-stat-brk-right"],
          { scaleX: 1.08, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        .set({}, {}, 7);

      window.__timelines["t1-stat-brk"] = tl;
    </script>
  </body>
</html>
