<!doctype html>
<!--
  KALLAWAY · tier1 · overview · PIPELINE
  Four chevron/segment stages glowing on in sequence left-to-right. Each chevron is
  a glass pill with a pointed right edge. Chevrons draw in with scaleX from left,
  then glow pulse left-to-right in sequence.
  Slots: title, p1, p2, p3, p4.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-pipe {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-pipe .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-pipe .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-pipe .title-row {
        position: absolute; left: 0; right: 0; top: 88px; text-align: center; z-index: 4;
      }
      #t1-ov-pipe .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1500px; margin: 0 auto;
      }
      #t1-ov-pipe .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Pipeline row — horizontally centered */
      #t1-ov-pipe .pipe-row {
        position: absolute;
        left: 60px; right: 60px; top: 50%; margin-top: -80px;
        z-index: 4;
        display: flex; align-items: center; justify-content: center; gap: 0;
      }

      /* Chevron segment — uses clip-path for the arrow shape */
      .pipe-seg {
        position: relative; flex-shrink: 0;
        width: 396px; height: 160px;
        display: flex; align-items: center; justify-content: center;
        /* clip-path: parallelogram pointing right */
        clip-path: polygon(0% 0%, 92% 0%, 100% 50%, 92% 100%, 0% 100%, 8% 50%);
      }
      /* First segment — flat left edge */
      #pseg1 {
        clip-path: polygon(0% 0%, 92% 0%, 100% 50%, 92% 100%, 0% 100%);
        margin-right: -30px;
      }
      /* Middle segments — arrow both sides */
      #pseg2, #pseg3 {
        margin-right: -30px;
      }
      /* Last segment — flat right edge */
      #pseg4 {
        clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 8% 50%);
      }

      /* Glass fill inside the chevron */
      .pipe-seg .seg-fill {
        position: absolute; inset: 0;
        background: var(--glass-bg-dark);
        /* The clip-path on parent already clips this */
      }
      /* Glow edge layer */
      .pipe-seg .seg-glow {
        position: absolute; inset: 0;
        /* a subtle inner glow from accent */
        background: radial-gradient(ellipse at 50% 50%, rgba(var(--accent-rgb), 0.06) 0%, transparent 70%);
      }
      /* Active state glow — applied via GSAP */
      .pipe-seg .seg-border {
        position: absolute; inset: 1.5px;
        clip-path: inherit;
        border: 1.5px solid var(--glass-border);
        pointer-events: none;
      }

      /* Segment content */
      .pipe-seg .seg-content {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center; text-align: center;
        padding: 0 42px;
      }
      .pipe-seg .seg-num {
        font-family: var(--font-mono); font-weight: 700;
        font-size: var(--size-label); color: var(--accent);
        letter-spacing: 0.08em; text-shadow: var(--textglow-accent);
        margin-bottom: 8px;
      }
      .pipe-seg .seg-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 28px; color: var(--white); letter-spacing: var(--track-snug);
        line-height: 1.25;
      }

      /* The horizontal spine behind all chevrons */
      #t1-ov-pipe .pipe-spine {
        position: absolute;
        left: 60px; right: 60px; top: 50%; margin-top: -2px;
        height: 4px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.08) 0%,
          rgba(var(--accent-rgb), 0.30) 20%,
          rgba(var(--accent-rgb), 0.55) 50%,
          rgba(var(--accent-rgb), 0.30) 80%,
          rgba(var(--accent-rgb), 0.08) 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.30);
        z-index: 3; pointer-events: none;
        transform-origin: left center;
      }

      #t1-ov-pipe .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-pipe .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-pipe" data-composition-id="t1-ov-pipe" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">The <em>Build Pipeline</em></div>
      </div>

      <div class="pipe-spine" id="pipe-spine"></div>

      <div class="pipe-row">
        <div class="pipe-seg" id="pseg1">
          <div class="seg-fill"></div>
          <div class="seg-glow" id="pglow1"></div>
          <div class="seg-content">
            <div class="seg-num">01</div>
            <div class="seg-label" data-slot="p1">Discovery</div>
          </div>
        </div>

        <div class="pipe-seg" id="pseg2">
          <div class="seg-fill"></div>
          <div class="seg-glow" id="pglow2"></div>
          <div class="seg-content">
            <div class="seg-num">02</div>
            <div class="seg-label" data-slot="p2">Architecture</div>
          </div>
        </div>

        <div class="pipe-seg" id="pseg3">
          <div class="seg-fill"></div>
          <div class="seg-glow" id="pglow3"></div>
          <div class="seg-content">
            <div class="seg-num">03</div>
            <div class="seg-label" data-slot="p3">Implementation</div>
          </div>
        </div>

        <div class="pipe-seg" id="pseg4">
          <div class="seg-fill"></div>
          <div class="seg-glow" id="pglow4"></div>
          <div class="seg-content">
            <div class="seg-num">04</div>
            <div class="seg-label" data-slot="p4">Delivery</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-pipe .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "105px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-pipe .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-pipe .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-pipe .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 0.5)

        /* spine draws left-to-right */
        .from("#pipe-spine", { scaleX: 0, transformOrigin: "left center", duration: 1.0, ease: "power3.inOut" }, 1.0)

        /* seg 1 slides in from left */
        .from("#pseg1", { autoAlpha: 0, x: -50, filter: "blur(10px)", duration: 0.72, ease: "power3.out" }, 1.55)

        /* seg 2 */
        .from("#pseg2", { autoAlpha: 0, x: -50, filter: "blur(10px)", duration: 0.72, ease: "power3.out" }, 1.88)

        /* seg 3 */
        .from("#pseg3", { autoAlpha: 0, x: -50, filter: "blur(10px)", duration: 0.72, ease: "power3.out" }, 2.21)

        /* seg 4 */
        .from("#pseg4", { autoAlpha: 0, x: -50, filter: "blur(10px)", duration: 0.72, ease: "power3.out" }, 2.54)

        /* Sequential accent glow sweep — each segment glows bright then settles */
        .to("#pglow1", { background: "radial-gradient(ellipse at 50% 50%, rgba(55,189,248,0.18) 0%, transparent 70%)",
          duration: 0.55, ease: "power2.out" }, 2.00)
        .to("#pglow2", { background: "radial-gradient(ellipse at 50% 50%, rgba(55,189,248,0.18) 0%, transparent 70%)",
          duration: 0.55, ease: "power2.out" }, 2.33)
        .to("#pglow3", { background: "radial-gradient(ellipse at 50% 50%, rgba(55,189,248,0.18) 0%, transparent 70%)",
          duration: 0.55, ease: "power2.out" }, 2.66)
        .to("#pglow4", { background: "radial-gradient(ellipse at 50% 50%, rgba(55,189,248,0.22) 0%, transparent 70%)",
          duration: 0.55, ease: "power2.out" }, 2.99)

        /* Breathing glow on labels — finite */
        .to("#pseg1 .seg-num, #pseg2 .seg-num, #pseg3 .seg-num, #pseg4 .seg-num", {
          textShadow: "0 0 22px rgba(55,189,248,0.90), 0 0 56px rgba(55,189,248,0.50)",
          duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.22
        }, 3.8)

        /* hold drift */
        .to("#t1-ov-pipe .pipe-row", { y: -10, duration: 4.5, ease: "sine.inOut" }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-pipe"] = tl;
    </script>
  </body>
</html>
