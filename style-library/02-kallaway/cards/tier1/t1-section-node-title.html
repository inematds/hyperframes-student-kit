<!doctype html>
<!--
  KALLAWAY · tier1 · section · NODE-TITLE
  Full-screen chapter takeover. A single large glowing node/dot pulses on the
  left side. A clean thin horizontal line draws outward from the node to connect
  to the title label block on the right — like a circuit schematic or a network
  graph being traced live. The kicker sits above the line.
  Slots: kicker (~20 chars), headline (~42 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-node {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Bloom — corner variant (behind the node) */
      #t1-sec-node .bloom {
        position: absolute; inset: 0; z-index: 1;
        background:
          var(--bloom-bottom),
          radial-gradient(60% 55% at 22% 50%, rgba(var(--accent-rgb), 0.28) 0%, transparent 58%);
      }
      /* Dot grid */
      #t1-sec-node .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(110% 90% at 50% 55%, #000 28%, transparent 72%);
                mask-image: radial-gradient(110% 90% at 50% 55%, #000 28%, transparent 72%);
      }

      /* ── Node ── */
      #t1-sec-node .node-wrap {
        position: absolute; left: 280px; top: 50%; transform: translateY(-50%);
        z-index: 4;
      }
      /* Outer glow ring */
      #t1-sec-node .node-ring {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 160px; height: 160px; border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.35);
        box-shadow: 0 0 30px 4px rgba(var(--accent-rgb), 0.28),
                    0 0 80px 12px rgba(var(--accent-rgb), 0.12);
      }
      /* Middle ring */
      #t1-sec-node .node-ring-mid {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 100px; height: 100px; border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 16px 3px rgba(var(--accent-rgb), 0.40);
      }
      /* Core dot */
      #t1-sec-node .node-core {
        width: 48px; height: 48px; border-radius: 50%;
        background: radial-gradient(circle at 38% 34%,
          rgba(255,255,255,0.95) 0%, var(--accent) 40%, rgba(var(--accent-rgb), 0.45) 70%, transparent 85%);
        box-shadow: 0 0 24px 6px rgba(var(--accent-rgb), 0.75),
                    0 0 60px 14px rgba(var(--accent-rgb), 0.35),
                    0 0 120px 28px rgba(var(--accent-rgb), 0.15);
        position: relative; z-index: 1;
      }

      /* ── Connector line ── drawn via SVG */
      #t1-sec-node .connector-svg {
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 1920px; height: 4px; overflow: visible;
        z-index: 3;
      }
      #t1-sec-node .connector-svg line {
        stroke: rgba(var(--accent-rgb), 0.65);
        stroke-width: 1.5;
        stroke-linecap: round;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.55))
                drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.25));
      }
      /* Small terminal square at line end */
      #t1-sec-node .connector-svg rect.terminal {
        fill: var(--accent);
        filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.70));
      }

      /* ── Title block (right side) ── */
      #t1-sec-node .title-block {
        position: absolute; left: 780px; top: 50%; transform: translateY(-50%);
        z-index: 5; width: 1000px;
      }
      #t1-sec-node .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 24px;
      }
      #t1-sec-node .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-sec-node .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Small decorative label-chip below headline */
      #t1-sec-node .tag {
        display: inline-block; margin-top: 28px;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        border-radius: var(--radius-sm);
        padding: 8px 22px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        letter-spacing: 0.15em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-node .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-node .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-node" data-composition-id="t1-sec-node" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Connector SVG: line from node center (~304px) to title block left edge (~776px) -->
      <svg class="connector-svg" viewBox="0 0 1920 4" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <line id="t1-sec-node-line" x1="304" y1="2" x2="772" y2="2"/>
        <rect class="terminal" x="766" y="-3" width="10" height="10" rx="2"/>
      </svg>

      <!-- Node -->
      <div class="node-wrap">
        <div class="node-ring"></div>
        <div class="node-ring-mid"></div>
        <div class="node-core"></div>
      </div>

      <!-- Title block -->
      <div class="title-block">
        <div class="kicker" data-slot="kicker">— Node 07 —</div>
        <div class="headline" data-slot="headline">Agents &amp; <em>Tool Use</em>:<br>How AI Takes Action</div>
        <div class="tag">AI Certification Course</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — deterministic */
      tl.fromTo("#t1-sec-node .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Bloom + grid */
      tl.from("#t1-sec-node .bloom", { autoAlpha: 0, duration: 1.5, ease: "expo.out" }, 0)
        .from("#t1-sec-node .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Node materialises — rings expand outward */
      tl.from("#t1-sec-node .node-core",     { autoAlpha: 0, scale: 0, duration: 0.5, ease: "back.out(2)" }, 0.35)
        .from("#t1-sec-node .node-ring-mid", { autoAlpha: 0, scale: 0, duration: 0.55, ease: "expo.out" }, 0.55)
        .from("#t1-sec-node .node-ring",     { autoAlpha: 0, scale: 0, duration: 0.6, ease: "expo.out" }, 0.70);

      /* Connector line draws from node to terminal — animate strokeDashoffset */
      const line = document.getElementById("t1-sec-node-line");
      const lineLen = 468; /* x2 - x1 */
      line.style.strokeDasharray  = lineLen;
      line.style.strokeDashoffset = lineLen;
      tl.to(line, { strokeDashoffset: 0, duration: 0.65, ease: "power3.out" }, 0.90)
        .from("#t1-sec-node .connector-svg rect.terminal", { autoAlpha: 0, scale: 0, duration: 0.3, ease: "back.out(2)" }, 1.52);

      /* Title block slides in from right */
      tl.from("#t1-sec-node .kicker",   { autoAlpha: 0, x: 40, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 1.1)
        .from("#t1-sec-node .headline", { autoAlpha: 0, x: 55, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 1.35)
        .from("#t1-sec-node .tag",      { autoAlpha: 0, y: 12, duration: 0.5, ease: "power3.out" }, 1.8);

      /* Node core pulse — finite breathing glow */
      tl.to("#t1-sec-node .node-core", {
        boxShadow: "0 0 40px 12px rgba(55,189,248,0.95), 0 0 90px 24px rgba(55,189,248,0.45), 0 0 160px 40px rgba(55,189,248,0.18)",
        duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true
      }, 2.2);

      /* Slow drift of the node-wrap during hold */
      tl.to("#t1-sec-node .node-wrap", { y: -16, duration: 4.5, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-node"] = tl;
    </script>
  </body>
</html>
