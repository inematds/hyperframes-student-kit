<!doctype html>
<!--
  KALLAWAY · tier1 · stat · SPECTRUM
  A glowing horizontal gradient bar stretches across the card — cold blue on the
  left, warm white in the center, blue again. A bright marker dot glides from the
  left edge to the knob position; the stat number counts up beside it.
  Knob: data-pct on #t1-stat-spec-bar (default 58).
  Slots: kicker (~28 chars uppercase), stat (e.g. "58%"), label (~70 chars),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-spec {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-spec .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-spec .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── content stack ── */
      #t1-stat-spec .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 52px; z-index: 4; padding-bottom: 30px;
      }

      #t1-stat-spec .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* ── the stat + bar zone ── */
      #t1-stat-spec .viz-zone {
        display: flex; flex-direction: column; align-items: center; gap: 36px;
        width: 1160px;
      }

      /* big stat number */
      #t1-stat-spec .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb),0.80) 72%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }

      /* spectrum bar track */
      #t1-stat-spec .bar-track {
        position: relative; width: 1160px; height: 28px; border-radius: 14px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
        overflow: visible;
      }

      /* the glowing fill — clipped to bar-track via inner element */
      #t1-stat-spec .bar-fill {
        position: absolute; top: 0; left: 0; height: 100%;
        width: 0%;                        /* animated by JS */
        border-radius: 14px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.25) 0%,
          rgba(var(--accent-rgb), 0.85) 45%,
          #ffffff 75%,
          rgba(var(--accent-rgb), 0.55) 100%);
        box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.55),
                    0 0 56px rgba(var(--accent-rgb), 0.28);
        overflow: hidden;
      }

      /* edge labels */
      #t1-stat-spec .bar-labels {
        display: flex; justify-content: space-between; width: 1160px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint);
      }

      /* marker dot — positioned by JS via `left` on .bar-track */
      #t1-stat-spec .bar-marker {
        position: absolute; top: 50%; transform: translate(-50%, -50%);
        width: 36px; height: 36px; border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.90),
                    0 0 42px rgba(var(--accent-rgb), 0.55),
                    0 0 80px rgba(var(--accent-rgb), 0.30);
        left: 0%; /* driven by JS */
        z-index: 2;
      }
      /* tick-line descending from marker */
      #t1-stat-spec .bar-tick {
        position: absolute; top: 50%; left: 0%; /* driven by JS */
        transform: translate(-50%, 14px);
        width: 2px; height: 48px;
        background: linear-gradient(to bottom, rgba(var(--accent-rgb),0.7), transparent);
      }

      #t1-stat-spec .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 900px; line-height: 1.45;
      }
      #t1-stat-spec .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-spec .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-spec .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-spec .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-spec" data-composition-id="t1-stat-spec" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">LEARNER CONFIDENCE · POST COURSE</div>

        <div class="viz-zone">
          <div class="stat" id="t1-stat-spec-num" data-slot="stat">58%</div>

          <!-- data-pct drives the marker position (0–100) -->
          <div class="bar-track" id="t1-stat-spec-bar" data-pct="58">
            <div class="bar-fill" id="t1-stat-spec-fill"></div>
            <div class="bar-marker" id="t1-stat-spec-marker"></div>
            <div class="bar-tick" id="t1-stat-spec-tick"></div>
          </div>

          <div class="bar-labels">
            <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
          </div>
        </div>

        <div class="label" data-slot="label">students who complete structured AI modules report <em>strong confidence</em> applying skills immediately</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS LEARNER SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const barEl    = document.getElementById("t1-stat-spec-bar");
      const fillEl   = document.getElementById("t1-stat-spec-fill");
      const markerEl = document.getElementById("t1-stat-spec-marker");
      const tickEl   = document.getElementById("t1-stat-spec-tick");
      const numEl    = document.getElementById("t1-stat-spec-num");
      const pct      = parseFloat(barEl.getAttribute("data-pct")) || 58;

      /* init */
      fillEl.style.width    = "0%";
      markerEl.style.left   = "0%";
      tickEl.style.left     = "0%";

      /* grain flicker */
      tl.fromTo("#t1-stat-spec .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-spec .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-spec .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-spec .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.45)

        /* bar track slides in */
        .from("#t1-stat-spec .bar-track",
          { autoAlpha: 0, scaleX: 0.3, transformOrigin: "0% 50%", duration: 0.9, ease: "expo.out" }, 0.60)

        /* count-up + fill + marker travel */
        .to({ val: 0 }, {
          val: pct, duration: 1.8, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            fillEl.style.width  = v + "%";
            markerEl.style.left = v + "%";
            tickEl.style.left   = v + "%";
            numEl.textContent   = Math.round(v) + "%";
          }
        }, 0.75)

        /* stat number blur-in */
        .from("#t1-stat-spec .stat",
          { autoAlpha: 0, y: -30, duration: 0.9, ease: "back.out(1.4)" }, 0.70)

        /* edge labels */
        .from("#t1-stat-spec .bar-labels",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.5)

        /* label */
        .from("#t1-stat-spec .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.0)

        /* source */
        .from("#t1-stat-spec .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.35)

        /* breathing glow pulse on fill */
        .to("#t1-stat-spec .bar-fill",
          { opacity: 0.60, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-spec"] = tl;
    </script>
  </body>
</html>
