<!doctype html>
<!--
  KALLAWAY · tier1 · stat · BUBBLE
  A proportional glowing bubble scales up to fill the canvas representing the
  value. The stat number lives inside the bubble. Aurora bloom + glass surface
  + deep vignette. The bigger the bubble the bigger the number's presence.
  Knob: data-pct on #t1-stat-bubble-root (default 70) — sizes the bubble.
  Slots: kicker (~28 chars uppercase), stat (number / text inside bubble),
         label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-bubble {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-bubble .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-bubble .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Stage — centred column */
      #t1-stat-bubble .stage {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 52px;
        z-index: 4; padding-bottom: 30px;
      }

      #t1-stat-bubble .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Bubble wrapper — sized by JS from data-pct */
      #t1-stat-bubble .bubble-wrap {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      /* Outer ambient halo — slightly larger than the bubble itself */
      #t1-stat-bubble .bubble-halo {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.22) 0%, transparent 68%);
        pointer-events: none;
      }

      /* The bubble sphere */
      #t1-stat-bubble .bubble {
        border-radius: 50%;
        background:
          radial-gradient(circle at 38% 30%,
            rgba(255,255,255,0.92) 0%,
            rgba(var(--accent-rgb), 0.80) 7%,
            rgba(var(--accent-rgb), 0.38) 34%,
            rgba(var(--accent-rgb), 0.10) 62%,
            rgba(var(--accent-rgb), 0.04) 80%,
            transparent 96%);
        box-shadow:
          0 0 80px 12px rgba(var(--accent-rgb), 0.38),
          0 0 200px 40px rgba(var(--accent-rgb), 0.14),
          inset 0 3px 18px rgba(255,255,255,0.55),
          inset 0 -6px 30px rgba(var(--accent-rgb), 0.25);
        display: flex; align-items: center; justify-content: center;
        position: relative; z-index: 2;
      }

      /* Glassy top-highlight rim */
      #t1-stat-bubble .bubble-rim {
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 1.5px solid transparent;
        background: linear-gradient(160deg, rgba(255,255,255,0.50) 0%, transparent 48%) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out; mask-composite: exclude;
        pointer-events: none; z-index: 3;
      }

      /* Stat number inside the bubble */
      #t1-stat-bubble .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 130px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        color: var(--white);
        text-shadow: var(--textglow);
        position: relative; z-index: 4;
        text-align: center;
      }

      #t1-stat-bubble .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-bubble .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-bubble .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-bubble .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-bubble .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-bubble" data-composition-id="t1-stat-bubble"
         data-pct="70"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="stage">
        <div class="kicker" data-slot="kicker">AI ADOPTION RATE · 2026</div>

        <div class="bubble-wrap" id="t1-stat-bubble-wrap">
          <div class="bubble-halo" id="t1-stat-bubble-halo"></div>
          <div class="bubble" id="t1-stat-bubble-sphere">
            <div class="bubble-rim"></div>
            <div class="stat" id="t1-stat-bubble-num" data-slot="stat">70%</div>
          </div>
        </div>

        <div class="label" data-slot="label">of enterprise teams have <em>deployed at least one AI tool</em> in daily workflows</div>
      </div>

      <div class="source" data-slot="source">SOURCE · MCKINSEY GLOBAL SURVEY 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Read knob */
      const root   = document.getElementById("t1-stat-bubble");
      const pct    = parseFloat(root.getAttribute("data-pct")) || 70;
      /* Map pct (0-100) → bubble diameter (120px – 640px) */
      const minD   = 120, maxD = 640;
      const diam   = minD + (pct / 100) * (maxD - minD);

      const wrap   = document.getElementById("t1-stat-bubble-wrap");
      const halo   = document.getElementById("t1-stat-bubble-halo");
      const sphere = document.getElementById("t1-stat-bubble-sphere");
      const numEl  = document.getElementById("t1-stat-bubble-num");

      /* Set final sizes (JS sets them; animation scales FROM 0) */
      wrap.style.width  = diam + "px";
      wrap.style.height = diam + "px";
      halo.style.width  = (diam + 120) + "px";
      halo.style.height = (diam + 120) + "px";
      halo.style.left   = "-60px";
      halo.style.top    = "-60px";
      halo.style.position = "absolute";
      sphere.style.width  = diam + "px";
      sphere.style.height = diam + "px";

      /* Scale stat font with bubble size */
      const fontSize = Math.max(48, Math.round(diam * 0.26));
      numEl.style.fontSize = fontSize + "px";

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-bubble .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "100px 75px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-bubble .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-bubble .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-bubble .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.45)

        /* halo blooms */
        .from("#t1-stat-bubble-halo",
          { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%", duration: 1.4, ease: "expo.out" }, 0.60)

        /* bubble scales up from zero — spring bounce */
        .from("#t1-stat-bubble-sphere",
          { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 1.2, ease: "back.out(1.4)" }, 0.70)

        /* number counts up inside the bubble */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.6, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            numEl.textContent = Math.round(v) + "%";
          }
        }, 0.85)

        /* label */
        .from("#t1-stat-bubble .label",
          { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.00)

        /* source */
        .from("#t1-stat-bubble .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.30)

        /* slow breathing glow pulse */
        .to("#t1-stat-bubble-halo",
          { opacity: 0.45, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.60)

        /* gentle float drift */
        .to("#t1-stat-bubble-sphere",
          { y: -18, duration: 3.0, ease: "sine.inOut" }, 2.60)

        .set({}, {}, 7);

      window.__timelines["t1-stat-bubble"] = tl;
    </script>
  </body>
</html>
