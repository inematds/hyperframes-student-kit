<!doctype html>
<!--
  KALLAWAY · tier1 · section · SPOTLIGHT-CONE
  Full-screen chapter takeover. A hard-edged conic beam shines from top-center
  downward, its apex at the top edge and its pool of light centered on the title
  area. The canvas is nearly black until the cone draws on; the title is revealed
  inside the lit pool. A dust-mote scatter (hardcoded positions) drifts through
  the beam for depth.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-cone {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas-deep); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Subtle ambient bloom — very faint; cone is the primary light source */
      #t1-sec-cone .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1; opacity: 0.28;
      }
      /* Dot grid */
      #t1-sec-cone .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.30;
        -webkit-mask-image: radial-gradient(110% 90% at 50% 60%, #000 30%, transparent 75%);
                mask-image: radial-gradient(110% 90% at 50% 60%, #000 30%, transparent 75%);
      }

      /* ── CONE ────────────────────────────────────────────────────────── */
      /* Outer wide cone — CSS clip-path triangle from top-center */
      #t1-sec-cone .cone-outer {
        position: absolute;
        left: 50%; top: 0;
        width: 1400px; height: 1080px;
        margin-left: -700px;
        z-index: 3;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 100%);
        filter: blur(14px);
      }
      /* Inner tighter cone — brighter core */
      #t1-sec-cone .cone-inner {
        position: absolute;
        left: 50%; top: 0;
        width: 680px; height: 900px;
        margin-left: -340px;
        z-index: 3;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(var(--accent-rgb), 0.26) 30%,
          rgba(var(--accent-rgb), 0.08) 70%,
          transparent 100%);
        filter: blur(6px);
      }
      /* Pool of light at the bottom of the cone — elliptical bloom on the floor */
      #t1-sec-cone .pool {
        position: absolute;
        left: 50%; bottom: 40px;
        width: 900px; height: 220px;
        margin-left: -450px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.38) 0%,
          rgba(var(--accent-rgb), 0.14) 42%,
          transparent 70%);
        filter: blur(22px);
        z-index: 3;
      }
      /* Source apex flash at top center */
      #t1-sec-cone .apex {
        position: absolute;
        left: 50%; top: 0;
        width: 180px; height: 90px;
        margin-left: -90px;
        border-radius: 0 0 50% 50%;
        background: radial-gradient(ellipse at 50% 0%,
          rgba(255,255,255,0.75) 0%,
          rgba(var(--accent-rgb), 0.55) 28%,
          transparent 65%);
        filter: blur(4px);
        z-index: 4;
      }

      /* ── DUST MOTES (hardcoded positions) ───────────────────────────── */
      #t1-sec-cone .motes {
        position: absolute; inset: 0; z-index: 4; pointer-events: none;
      }
      #t1-sec-cone .mote {
        position: absolute;
        width: 3px; height: 3px; border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.65);
        box-shadow: 0 0 6px 2px rgba(var(--accent-rgb), 0.45);
      }
      /* 10 motes hardcoded */
      #t1-sec-cone .mote:nth-child(1)  { left: 860px;  top: 310px; }
      #t1-sec-cone .mote:nth-child(2)  { left: 940px;  top: 460px; }
      #t1-sec-cone .mote:nth-child(3)  { left: 1020px; top: 380px; }
      #t1-sec-cone .mote:nth-child(4)  { left: 980px;  top: 540px; }
      #t1-sec-cone .mote:nth-child(5)  { left: 900px;  top: 620px; }
      #t1-sec-cone .mote:nth-child(6)  { left: 1060px; top: 490px; }
      #t1-sec-cone .mote:nth-child(7)  { left: 840px;  top: 570px; }
      #t1-sec-cone .mote:nth-child(8)  { left: 1000px; top: 660px; }
      #t1-sec-cone .mote:nth-child(9)  { left: 920px;  top: 700px; }
      #t1-sec-cone .mote:nth-child(10) { left: 960px;  top: 430px; }

      /* ── CONTENT ─────────────────────────────────────────────────────── */
      #t1-sec-cone .content {
        position: absolute; left: 0; right: 0;
        top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 5;
      }
      #t1-sec-cone .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 30px;
      }
      #t1-sec-cone .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1320px; padding: 0 80px;
      }
      #t1-sec-cone .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-cone .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-cone .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-cone" data-composition-id="t1-sec-cone" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="cone-outer"></div>
      <div class="cone-inner"></div>
      <div class="pool"></div>
      <div class="apex"></div>

      <div class="motes">
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
        <div class="mote"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Module 4 —</div>
        <div class="headline" data-slot="headline">Training Data:<br><em>What the Model Really Sees</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-cone .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-cone .bloom",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0)
        .from("#t1-sec-cone .grid",
            { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* Cone draws down from top — starts with height 0, expands */
      tl.from("#t1-sec-cone .cone-outer",
            { scaleY: 0, transformOrigin: "50% 0%", duration: 0.9, ease: "power3.out" }, 0.2);
      tl.from("#t1-sec-cone .cone-inner",
            { scaleY: 0, transformOrigin: "50% 0%", duration: 0.75, ease: "power4.out" }, 0.3);
      tl.from("#t1-sec-cone .apex",
            { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 0%", duration: 0.5, ease: "power2.out" }, 0.2);

      /* Pool blooms into existence at the base */
      tl.from("#t1-sec-cone .pool",
            { autoAlpha: 0, scaleX: 0.3, transformOrigin: "50% 50%", duration: 0.8, ease: "back.out(1.4)" }, 0.75);

      /* Motes drift upward slowly, staggered */
      tl.from("#t1-sec-cone .mote",
            { autoAlpha: 0, y: 30, duration: 1.0, ease: "power2.out", stagger: 0.12 }, 0.9);
      tl.to("#t1-sec-cone .mote",
            { y: -20, duration: 4.0, ease: "sine.inOut", stagger: 0.18 }, 1.5);

      /* Kicker appears */
      tl.from("#t1-sec-cone .kicker",
            { autoAlpha: 0, filter: "blur(10px)", duration: 0.75, ease: "power3.out" }, 0.85);

      /* Headline illuminates from dark — like light hitting it */
      tl.from("#t1-sec-cone .headline",
            { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 1.1);

      /* Cone breathes — subtle pulse */
      tl.to(["#t1-sec-cone .cone-inner", "#t1-sec-cone .pool"],
            { opacity: 0.7, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      /* Slow bloom drift */
      tl.to("#t1-sec-cone .bloom",
            { scale: 1.06, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-cone"] = tl;
    </script>
  </body>
</html>
