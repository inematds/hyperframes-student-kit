<!doctype html>
<!--
  KALLAWAY · tier1 · section · LIQUID
  Full-screen chapter takeover. A liquid-glass blob with an animated border-radius
  morph pulses behind the title — a slowly breathing organic shape glowing with
  the aurora accent. The title glides in above the blob while it morphs through
  5 distinct silhouettes in a finite loop.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-liquid {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-liquid .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-liquid .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.44;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(130% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Liquid blob — morphing border-radius, glass surface */
      #t1-sec-liquid .blob-wrap {
        position: absolute;
        left: 50%; top: 50%;
        width: 960px; height: 720px;
        margin-left: -480px; margin-top: -360px;
        z-index: 2;
      }
      #t1-sec-liquid .blob {
        position: absolute; inset: 0;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        /* inner top highlight */
        box-shadow:
          inset 0 1.5px 0 var(--glass-hi),
          0 0 80px 20px rgba(var(--accent-rgb), 0.22),
          0 0 200px 60px rgba(var(--accent-rgb), 0.10),
          var(--glass-shadow);
        /* initial organic shape */
        border-radius: 60% 40% 55% 45% / 45% 55% 40% 60%;
      }
      /* Bright rim accent around the blob top-edge */
      #t1-sec-liquid .blob-glow {
        position: absolute; inset: -8px;
        border-radius: inherit;
        background: transparent;
        box-shadow: 0 0 38px 8px rgba(var(--accent-rgb), 0.28),
                    0 0 90px 18px rgba(var(--accent-rgb), 0.12);
        filter: blur(2px);
        z-index: -1;
      }

      /* Content — z-index above the blob */
      #t1-sec-liquid .content {
        position: absolute; left: 0; right: 0;
        top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-liquid .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 28px;
      }
      #t1-sec-liquid .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1320px; padding: 0 80px;
      }
      #t1-sec-liquid .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-liquid .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-liquid .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-liquid" data-composition-id="t1-sec-liquid" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="blob-wrap">
        <div class="blob-glow"></div>
        <div class="blob"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Chapter 3 —</div>
        <div class="headline" data-slot="headline">The Model That <em>Learns Like You</em> Do</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-liquid .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers enter */
      tl.from("#t1-sec-liquid .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-liquid .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Blob rises in, starts morphing */
      tl.from("#t1-sec-liquid .blob-wrap",
            { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 1.2, ease: "back.out(1.4)" }, 0.25);

      /* Liquid morph sequence — finite steps through border-radius shapes */
      /* shape 1 → shape 2 */
      tl.to("#t1-sec-liquid .blob",
            { borderRadius: "45% 55% 62% 38% / 58% 42% 60% 40%", duration: 1.6, ease: "sine.inOut" }, 1.0);
      /* shape 2 → shape 3 */
      tl.to("#t1-sec-liquid .blob",
            { borderRadius: "55% 45% 38% 62% / 40% 62% 38% 60%", duration: 1.8, ease: "sine.inOut" }, 2.6);
      /* shape 3 → shape 4 */
      tl.to("#t1-sec-liquid .blob",
            { borderRadius: "38% 62% 50% 50% / 52% 48% 56% 44%", duration: 1.6, ease: "sine.inOut" }, 4.4);

      /* Blob glow outer pulse — finite */
      tl.to("#t1-sec-liquid .blob-glow",
            { opacity: 0.5, duration: 1.3, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      /* Kicker glides in */
      tl.from("#t1-sec-liquid .kicker",
            { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.9);

      /* Headline glides in with focus-pull blur */
      tl.from("#t1-sec-liquid .headline",
            { autoAlpha: 0, y: 36, filter: "blur(18px)", duration: 1.0, ease: "power4.out" }, 1.15);

      /* Slow bloom drift during hold */
      tl.to("#t1-sec-liquid .bloom",
            { scale: 1.08, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-liquid"] = tl;
    </script>
  </body>
</html>
