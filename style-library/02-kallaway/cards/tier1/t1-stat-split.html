<!doctype html>
<!--
  KALLAWAY · tier1 · stat · SPLIT
  A glowing "30% | 70%" split inside a glass pill with a glowing divider line. Both
  halves light up in sequence. Caption and source below.
  Slots: kicker (~28 chars uppercase), statA (e.g. "30%"), statB (e.g. "70%"),
         label (~70 chars, <em> on one phrase), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-split {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-split .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-split .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Center content stack */
      #t1-stat-split .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 52px; padding-bottom: 40px;
      }

      #t1-stat-split .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Glass pill */
      #t1-stat-split .pill {
        display: flex; align-items: stretch;
        border-radius: 60px;
        background: var(--glass-bg);
        border: 1.5px solid var(--glass-border);
        box-shadow: var(--glass-shadow),
                    inset 0 1px 0 var(--glass-hi),
                    0 0 80px rgba(var(--accent-rgb), 0.12);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        overflow: hidden;
        padding: 0;
        width: 1320px; height: 260px;
      }

      /* Each half */
      #t1-stat-split .half {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 10px; padding: 0 60px;
      }
      #t1-stat-split .half-a {
        /* left side — accent glow */
      }
      #t1-stat-split .half-b {
        /* right side — white glow */
      }

      /* Glowing divider */
      #t1-stat-split .divider {
        width: 2px; align-self: stretch; margin: 28px 0;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(var(--accent-rgb), 0.8) 30%,
          rgba(255,255,255,0.9) 50%,
          rgba(var(--accent-rgb), 0.8) 70%,
          transparent 100%);
        box-shadow: 0 0 14px 2px rgba(var(--accent-rgb), 0.6),
                    0 0 30px 6px rgba(var(--accent-rgb), 0.25);
        border-radius: 2px;
        flex-shrink: 0;
      }

      #t1-stat-split .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 140px;
        line-height: 1;
        letter-spacing: var(--track-tight);
      }
      #t1-stat-split .half-a .stat {
        background: linear-gradient(155deg, #ffffff 15%, rgba(var(--accent-rgb),0.8) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.60));
      }
      #t1-stat-split .half-b .stat {
        background: linear-gradient(155deg, rgba(240,238,233,0.95) 20%, rgba(255,255,255,0.65) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 18px rgba(255,255,255,0.40));
      }

      #t1-stat-split .half-label {
        font-family: var(--font-body);
        font-size: 22px;
        font-weight: var(--wt-med);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      /* Caption below the pill */
      #t1-stat-split .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
      }
      #t1-stat-split .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-split .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-split .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-split .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-split" data-composition-id="t1-stat-split" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">HUMAN VS AI · DECISIONS 2026</div>

        <div class="pill">
          <div class="half half-a">
            <div class="stat" data-slot="statA">30%</div>
            <div class="half-label">Intuition</div>
          </div>
          <div class="divider"></div>
          <div class="half half-b">
            <div class="stat" data-slot="statB">70%</div>
            <div class="half-label">Data-Driven</div>
          </div>
        </div>

        <div class="label" data-slot="label">teams that rely on <em>data-driven decisions</em> outperform intuition-only peers by 3×</div>
      </div>

      <div class="source" data-slot="source">SOURCE · HBR ANALYTICS 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-split .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-split .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-split .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-split .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* glass pill springs in */
        .from("#t1-stat-split .pill",
          { autoAlpha: 0, scaleX: 0.72, scaleY: 0.82, transformOrigin: "50% 50%",
            filter: "blur(14px)", duration: 1.0, ease: "back.out(1.4)" }, 0.72)

        /* divider draws up */
        .from("#t1-stat-split .divider",
          { scaleY: 0, transformOrigin: "50% 50%", autoAlpha: 0, duration: 0.55, ease: "power3.out" }, 1.10)

        /* stat A glides in from left */
        .from("#t1-stat-split .half-a .stat",
          { autoAlpha: 0, x: -30, filter: "blur(16px)", duration: 0.9, ease: "power4.out" }, 1.22)
        .from("#t1-stat-split .half-a .half-label",
          { autoAlpha: 0, y: 12, duration: 0.55, ease: "power2.out" }, 1.42)

        /* stat B glides in from right */
        .from("#t1-stat-split .half-b .stat",
          { autoAlpha: 0, x: 30, filter: "blur(16px)", duration: 0.9, ease: "power4.out" }, 1.38)
        .from("#t1-stat-split .half-b .half-label",
          { autoAlpha: 0, y: 12, duration: 0.55, ease: "power2.out" }, 1.58)

        /* label */
        .from("#t1-stat-split .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 1.80)

        /* source */
        .from("#t1-stat-split .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.10)

        /* breathing glow on divider */
        .to("#t1-stat-split .divider",
          { opacity: 0.45, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.50)

        .set({}, {}, 7);

      window.__timelines["t1-stat-split"] = tl;
    </script>
  </body>
</html>
