<!doctype html>
<!--
  KALLAWAY · tier1 · section · CHAPTERCARD
  A frosted glass "Chapter 03" pill/card springs in from below with back.out(1.4)
  overshoot, then the headline text glides upward and settles beside/below it.
  Classic glass-card spring mechanic applied to chapter navigation.
  Slots: chapter (e.g. "Chapter 03"), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-chap {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-chap .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      #t1-sec-chap .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner);
        z-index: 1;
      }
      #t1-sec-chap .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.42;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 55%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 100% at 50% 55%, #000 30%, transparent 78%);
      }

      /* Stage: content centred, chapter card + headline stacked */
      #t1-sec-chap .stage {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column;
        align-items: center; gap: 52px;
        z-index: 4;
      }

      /* Glass chapter pill */
      #t1-sec-chap .chapter-card {
        display: inline-flex; align-items: center; gap: 20px;
        padding: 24px 52px;
        background: var(--glass-bg);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow),
                    0 0 0 var(--stroke) var(--glass-hi) inset,
                    0 0 60px rgba(var(--accent-rgb), 0.18);
      }
      /* top inner highlight hairline */
      #t1-sec-chap .chapter-card::before {
        content: "";
        position: absolute; left: 0; right: 0; top: 0; height: var(--stroke);
        border-radius: var(--radius) var(--radius) 0 0;
        background: var(--glass-hi);
      }
      /* neon accent line on the left edge */
      #t1-sec-chap .chapter-card::after {
        content: "";
        position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px;
        border-radius: 2px;
        background: linear-gradient(to bottom, transparent, var(--accent), transparent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.70);
      }
      #t1-sec-chap .chapter-card { position: relative; }

      #t1-sec-chap .chap-label {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      #t1-sec-chap .chap-num {
        font-family: var(--font-display); font-size: 78px;
        font-weight: var(--wt-black); letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1;
      }

      /* Separator line between card and headline */
      #t1-sec-chap .sep {
        width: 280px; height: var(--stroke);
        background: linear-gradient(to right, transparent, var(--accent), transparent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.50);
      }

      /* Main headline */
      #t1-sec-chap .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 90px; line-height: 1.06;
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1300px;
      }
      #t1-sec-chap .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-chap .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-chap .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-chap" data-composition-id="t1-sec-chap" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <div class="stage">
        <div class="chapter-card">
          <span class="chap-label" data-slot="chapter">Chapter 03</span>
        </div>
        <div class="sep"></div>
        <div class="headline" data-slot="headline">Building Systems That<br><em>Scale Without You</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-chap .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* env in */
      tl.from("#t1-sec-chap .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.2, ease: "expo.out" }, 0)
        .from("#t1-sec-chap .bloom-corner",
          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.3)
        .from("#t1-sec-chap .grid",
          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.25);

      /* chapter card springs in from below — the signature spring */
      tl.from("#t1-sec-chap .chapter-card",
        { autoAlpha: 0, y: 80, scale: 0.88, transformOrigin: "50% 50%",
          duration: 0.85, ease: "back.out(1.4)" }, 0.45);

      /* separator line draws in */
      tl.from("#t1-sec-chap .sep",
        { scaleX: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.out" }, 1.1);

      /* headline glides up */
      tl.from("#t1-sec-chap .headline",
        { autoAlpha: 0, y: 44, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.25);

      /* soft glow pulse on the chapter card */
      tl.to("#t1-sec-chap .chapter-card",
        { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 90px rgba(55,189,248,0.38)",
          duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-chap"] = tl;
    </script>
  </body>
</html>
