<!doctype html>
<!--
  KALLAWAY · tier1 · section · SPLIT PANEL
  Full-screen takeover: headline + kicker on the left half; a frosted glass
  panel with a soft accent-orb / perspective grid lives on the right half.
  The "two hemispheres of one idea" beat.
  Slots: kicker (~16 chars), headline (~52 chars, <em> accent word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-spl {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-spl .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-spl .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 25% 60%, #000 30%, transparent 75%);
                mask-image: radial-gradient(130% 110% at 25% 60%, #000 30%, transparent 75%);
      }

      /* ── LEFT half — text content ─────────────────────────────────────── */
      #t1-sec-spl .left {
        position: absolute; left: 0; top: 0; width: 860px; height: 1080px;
        display: flex; flex-direction: column; justify-content: center;
        padding-left: 110px; padding-right: 60px; z-index: 4;
      }
      #t1-sec-spl .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: 0.18em;
        color: var(--accent); text-shadow: var(--textglow-accent);
        text-transform: uppercase; margin-bottom: 32px;
      }
      #t1-sec-spl .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 80px; line-height: 1.05; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 680px;
      }
      #t1-sec-spl .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }
      /* Hairline vertical divider */
      #t1-sec-spl .divider {
        position: absolute; left: 880px; top: 120px; width: 1.5px; height: 840px;
        background: linear-gradient(to bottom, transparent 0%, rgba(var(--accent-rgb), 0.55) 30%, rgba(var(--accent-rgb), 0.55) 70%, transparent 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.30);
        z-index: 4;
      }

      /* ── RIGHT half — glass visual panel ─────────────────────────────── */
      #t1-sec-spl .right {
        position: absolute; left: 920px; top: 0; width: 1000px; height: 1080px;
        display: flex; align-items: center; justify-content: center; z-index: 3;
      }
      #t1-sec-spl .panel {
        width: 780px; height: 780px;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-lg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), 0 0 80px rgba(var(--accent-rgb), 0.14);
        position: relative; overflow: hidden;
      }
      /* Top highlight edge on the glass */
      #t1-sec-spl .panel::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
        background: var(--glass-hi); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }
      /* Perspective grid lines inside the panel */
      #t1-sec-spl .panel-grid {
        position: absolute; inset: 0; overflow: hidden; border-radius: var(--radius-lg);
        opacity: 0.22;
      }
      #t1-sec-spl .panel-grid svg {
        width: 100%; height: 100%;
      }
      /* Soft accent orb inside the panel */
      #t1-sec-spl .panel-orb {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle at 50% 44%,
          rgba(255,255,255,0.85) 0%,
          rgba(var(--accent-rgb), 0.72) 10%,
          rgba(var(--accent-rgb), 0.28) 40%,
          rgba(var(--accent-rgb), 0.06) 62%,
          transparent 72%);
        box-shadow: 0 0 100px 8px rgba(var(--accent-rgb), 0.32);
      }
      /* Neon rim around the panel */
      #t1-sec-spl .panel-rim {
        position: absolute; inset: -1px;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(var(--accent-rgb), 0.28);
        box-shadow: inset 0 0 30px rgba(var(--accent-rgb), 0.08);
        pointer-events: none;
      }

      /* ── Global chrome ────────────────────────────────────────────────── */
      #t1-sec-spl .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-spl .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-spl"
         data-composition-id="t1-sec-spl"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- LEFT text -->
      <div class="left">
        <div class="kicker" data-slot="kicker">Chapter Two</div>
        <div class="headline" data-slot="headline">The System That <em>Changed</em> Everything</div>
      </div>

      <!-- vertical divider -->
      <div class="divider"></div>

      <!-- RIGHT glass panel -->
      <div class="right">
        <div class="panel">
          <div class="panel-grid">
            <!-- SVG perspective grid (vanishing-point lines) -->
            <svg viewBox="0 0 780 780" xmlns="http://www.w3.org/2000/svg"
                 fill="none" stroke="rgba(55,189,248,0.65)" stroke-width="0.8">
              <!-- Horizontal lines converging toward center-top -->
              <line x1="0"   y1="780" x2="390" y2="300"/>
              <line x1="78"  y1="780" x2="390" y2="300"/>
              <line x1="156" y1="780" x2="390" y2="300"/>
              <line x1="234" y1="780" x2="390" y2="300"/>
              <line x1="312" y1="780" x2="390" y2="300"/>
              <line x1="390" y1="780" x2="390" y2="300"/>
              <line x1="468" y1="780" x2="390" y2="300"/>
              <line x1="546" y1="780" x2="390" y2="300"/>
              <line x1="624" y1="780" x2="390" y2="300"/>
              <line x1="702" y1="780" x2="390" y2="300"/>
              <line x1="780" y1="780" x2="390" y2="300"/>
              <!-- Cross horizontal rings -->
              <line x1="0"   y1="780" x2="780" y2="780"/>
              <line x1="0"   y1="680" x2="780" y2="680"/>
              <line x1="0"   y1="580" x2="780" y2="580"/>
              <line x1="0"   y1="480" x2="780" y2="480"/>
              <line x1="0"   y1="390" x2="780" y2="390"/>
            </svg>
          </div>
          <div class="panel-orb"></div>
          <div class="panel-rim"></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite, deterministic */
      tl.fromTo("#t1-sec-spl .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* ambient: bloom + grid fade in */
      tl.from("#t1-sec-spl .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      tl.from("#t1-sec-spl .grid",
        { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* right panel springs in from right */
      tl.from("#t1-sec-spl .panel",
        { autoAlpha: 0, x: 80, scale: 0.93, transformOrigin: "50% 50%",
          duration: 1.2, ease: "back.out(1.4)" }, 0.3);
      tl.from("#t1-sec-spl .panel-orb",
        { autoAlpha: 0, scale: 0.7, duration: 1.4, ease: "expo.out" }, 0.5);
      tl.from("#t1-sec-spl .panel-grid",
        { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.8);

      /* divider draws down */
      tl.from("#t1-sec-spl .divider",
        { scaleY: 0, transformOrigin: "50% 0%", duration: 0.8, ease: "expo.out" }, 0.6);

      /* left text glides in from left */
      tl.from("#t1-sec-spl .kicker",
        { autoAlpha: 0, x: -28, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.8);
      tl.from("#t1-sec-spl .headline",
        { autoAlpha: 0, x: -40, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.0);

      /* orb breathes softly */
      tl.to("#t1-sec-spl .panel-orb",
        { scale: 1.06, opacity: 0.85, duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      /* slow panel drift */
      tl.to("#t1-sec-spl .panel",
        { y: -12, duration: 4.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-spl"] = tl;
    </script>
  </body>
</html>
