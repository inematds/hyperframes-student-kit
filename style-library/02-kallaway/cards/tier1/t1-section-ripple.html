<!doctype html>
<!--
  KALLAWAY · tier1 · section · RIPPLE
  Full-screen chapter takeover. Concentric glowing rings expand outward from
  a calm central point in a slow ripple sequence (finite). The title text sits
  at the still center as the ripples propagate, giving a "stone dropped in
  water" feel.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-ripple {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-ripple .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-ripple .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.4;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Ripple rings — all centered, all absolutely positioned */
      #t1-sec-ripple .ripple-wrap {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 1px; height: 1px;
        z-index: 2;
      }
      /* Each ring starts at 0 scale and expands; opacity fades as it grows */
      #t1-sec-ripple .ring {
        position: absolute;
        border-radius: 50%;
        border: 1.5px solid rgba(var(--accent-rgb), 0.7);
        box-shadow: 0 0 12px 2px rgba(var(--accent-rgb), 0.35);
        /* JS sets exact size + center-offset each ring individually */
        transform-origin: center center;
        opacity: 0;
      }
      /* The origin dot */
      #t1-sec-ripple .origin {
        position: absolute;
        left: 50%; top: 50%;
        width: 18px; height: 18px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(var(--accent-rgb), 0.8) 60%, transparent 80%);
        box-shadow: 0 0 18px 6px rgba(var(--accent-rgb), 0.70),
                    0 0 50px 14px rgba(var(--accent-rgb), 0.30);
        z-index: 4;
      }

      /* Text at center */
      #t1-sec-ripple .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        z-index: 5;
        gap: 20px;
      }
      #t1-sec-ripple .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 14px;
      }
      #t1-sec-ripple .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1200px; text-align: center; padding: 0 60px;
      }
      #t1-sec-ripple .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-ripple .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-ripple .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-ripple" data-composition-id="t1-sec-ripple" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="ripple-wrap">
        <!-- 5 rings at different starting scales, driven by GSAP -->
        <div class="ring" id="t1-sec-ripple-r1"></div>
        <div class="ring" id="t1-sec-ripple-r2"></div>
        <div class="ring" id="t1-sec-ripple-r3"></div>
        <div class="ring" id="t1-sec-ripple-r4"></div>
        <div class="ring" id="t1-sec-ripple-r5"></div>
        <div class="origin"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Section 4 —</div>
        <div class="headline" data-slot="headline">Every Decision Sends<br><em>Ripples</em> Through Your System</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Set up each ring: positioned as a centered square.
         We animate from a tiny size to a large size while fading out. */
      const rings = [
        { id: "t1-sec-ripple-r1", finalSize: 300, delay: 0.0, dur: 2.4 },
        { id: "t1-sec-ripple-r2", finalSize: 520, delay: 0.4, dur: 2.4 },
        { id: "t1-sec-ripple-r3", finalSize: 760, delay: 0.8, dur: 2.4 },
        { id: "t1-sec-ripple-r4", finalSize: 1020, delay: 1.2, dur: 2.5 },
        { id: "t1-sec-ripple-r5", finalSize: 1340, delay: 1.6, dur: 2.6 },
      ];
      rings.forEach(function(r) {
        const el = document.getElementById(r.id);
        el.style.width  = "1px";
        el.style.height = "1px";
        el.style.left   = "-0.5px";
        el.style.top    = "-0.5px";
      });

      /* grain flicker */
      tl.fromTo("#t1-sec-ripple .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "130px 100px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-ripple .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-ripple .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* origin dot */
      tl.from("#t1-sec-ripple .origin",
        { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%",
          duration: 0.55, ease: "back.out(2)" }, 0.5);

      /* Rings expand outward one after another — finite, each fires once */
      rings.forEach(function(r) {
        const finalS = r.finalSize;
        const half   = finalS / 2;
        tl.fromTo("#" + r.id,
          { width: "1px", height: "1px", left: "-0.5px", top: "-0.5px", autoAlpha: 0.9 },
          { width: finalS + "px", height: finalS + "px",
            left: (-half) + "px", top: (-half) + "px",
            autoAlpha: 0,
            duration: r.dur, ease: "power2.out" },
          0.6 + r.delay
        );
      });

      /* Second wave of rings for a deeper ripple — slightly offset */
      rings.forEach(function(r) {
        const finalS = r.finalSize;
        const half   = finalS / 2;
        tl.fromTo("#" + r.id,
          { width: "1px", height: "1px", left: "-0.5px", top: "-0.5px", autoAlpha: 0.7 },
          { width: finalS + "px", height: finalS + "px",
            left: (-half) + "px", top: (-half) + "px",
            autoAlpha: 0,
            duration: r.dur, ease: "power2.out" },
          3.6 + r.delay
        );
      });

      /* kicker */
      tl.from("#t1-sec-ripple .kicker",
        { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.7);

      /* headline */
      tl.from("#t1-sec-ripple .headline",
        { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.95);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-ripple"] = tl;
    </script>
  </body>
</html>
