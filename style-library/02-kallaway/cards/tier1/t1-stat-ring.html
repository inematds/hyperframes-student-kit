<!doctype html>
<!--
  KALLAWAY · tier1 · stat · RING
  Glowing circular progress ring (SVG stroke-dashoffset animates to value). The
  percentage counts up in the center. Aurora bloom, glass surface, breathing glow.
  Knob: data-pct on .ring-svg (default 68).
  Slots: kicker (~28 chars uppercase), stat (center number e.g. "68%"),
         label (~70 chars, <em> on one phrase), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-ring {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-ring .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-ring .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content stack */
      #t1-stat-ring .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 48px; padding-bottom: 40px;
      }

      #t1-stat-ring .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Ring container */
      #t1-stat-ring .ring-container {
        position: relative;
        width: 480px; height: 480px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      /* Outer glow halo */
      #t1-stat-ring .ring-glow {
        position: absolute; inset: -40px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 65%);
        box-shadow: 0 0 100px 20px rgba(var(--accent-rgb), 0.20);
      }

      /* SVG ring */
      #t1-stat-ring .ring-svg {
        width: 480px; height: 480px;
        position: relative; z-index: 2;
      }

      /* Center text inside ring */
      #t1-stat-ring .ring-center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #t1-stat-ring .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 110px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(160deg, #ffffff 15%, rgba(var(--accent-rgb),0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-ring .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-ring .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-ring .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-ring .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-ring .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-ring" data-composition-id="t1-stat-ring" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">COMPLETION RATE · Q4 2026</div>

        <div class="ring-container">
          <div class="ring-glow"></div>

          <!-- data-pct drives how far the ring fills (0–100) -->
          <svg class="ring-svg" id="t1-stat-ring-svg" data-pct="68"
               viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Track ring -->
            <circle
              cx="240" cy="240" r="210"
              stroke="rgba(255,255,255,0.08)"
              stroke-width="22"
              stroke-linecap="round"
            />
            <!-- Glowing progress arc — starts at top (rotate -90) -->
            <circle
              id="t1-stat-ring-arc"
              cx="240" cy="240" r="210"
              stroke="url(#ringGrad)"
              stroke-width="22"
              stroke-linecap="round"
              fill="none"
              transform="rotate(-90 240 240)"
            />
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#37BDF8" stop-opacity="1"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
              </linearGradient>
              <!-- glow filter for the arc -->
              <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>
            <!-- Bright dot at arc tip -->
            <circle id="t1-stat-ring-tip" cx="240" cy="30" r="14"
              fill="#ffffff"
              style="filter: drop-shadow(0 0 10px rgba(55,189,248,0.9)) drop-shadow(0 0 24px rgba(55,189,248,0.5));"
            />
          </svg>

          <div class="ring-center">
            <div class="stat" id="t1-stat-ring-num" data-slot="stat">68%</div>
          </div>
        </div>

        <div class="label" data-slot="label">learners who reach module 4 go on to <em>complete the full course</em> within 30 days</div>
      </div>

      <div class="source" data-slot="source">SOURCE · PLATFORM DATA 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Read the knob */
      const svgEl  = document.getElementById("t1-stat-ring-svg");
      const pct    = parseFloat(svgEl.getAttribute("data-pct")) || 68;
      const r      = 210;
      const circ   = 2 * Math.PI * r;                   // full circumference
      const arcEl  = document.getElementById("t1-stat-ring-arc");
      const tipEl  = document.getElementById("t1-stat-ring-tip");
      const numEl  = document.getElementById("t1-stat-ring-num");

      /* Init: arc fully hidden */
      arcEl.style.strokeDasharray  = circ;
      arcEl.style.strokeDashoffset = circ;                // 0% filled

      /* Tip position for the angle corresponding to pct */
      function tipCoords(p) {
        const angle = (p / 100) * 2 * Math.PI - Math.PI / 2;  // from top
        return { cx: 240 + 210 * Math.cos(angle), cy: 240 + 210 * Math.sin(angle) };
      }
      /* Init tip at top (0%) */
      tipEl.setAttribute("cx", "240");
      tipEl.setAttribute("cy", "30");

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-ring .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-ring .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-ring .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-ring .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* ring glow blooms in */
        .from("#t1-stat-ring .ring-glow",
          { autoAlpha: 0, scale: 0.5, duration: 1.2, ease: "expo.out" }, 0.65)

        /* ring SVG scale+blur in */
        .from("#t1-stat-ring .ring-svg",
          { autoAlpha: 0, scale: 0.7, filter: "blur(18px)", transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.4)" }, 0.70)

        /* arc fill + count-up + tip travel — all in sync */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            /* arc */
            arcEl.style.strokeDashoffset = circ - (v / 100) * circ;
            /* tip position */
            const pos = tipCoords(v);
            tipEl.setAttribute("cx", pos.cx);
            tipEl.setAttribute("cy", pos.cy);
            /* number */
            numEl.textContent = Math.round(v) + "%";
          }
        }, 1.05)

        /* center number blur-in focus pull */
        .from("#t1-stat-ring .stat",
          { autoAlpha: 0, filter: "blur(20px)", duration: 0.85, ease: "power3.out" }, 1.10)

        /* label */
        .from("#t1-stat-ring .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.00)

        /* source */
        .from("#t1-stat-ring .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.30)

        /* breathing glow on ring */
        .to("#t1-stat-ring .ring-glow",
          { opacity: 0.50, scale: 1.08, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.80)

        .set({}, {}, 7);

      window.__timelines["t1-stat-ring"] = tl;
    </script>
  </body>
</html>
