<!doctype html>
<!--
  KALLAWAY · tier1 · section · TYPE-SCALE
  Full-screen chapter takeover. The headline starts as a tiny pinpoint of text at
  the center of the canvas and scales up dramatically to full display size, while
  simultaneously a CSS filter blur resolves from heavy to sharp — a cinematic focus
  pull. The kicker fades in underneath after the headline settles. A subtle radial
  glow expands in sync with the scale.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-tscale {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-tscale .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-tscale .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.42;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 55%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 55%, #000 35%, transparent 80%);
      }

      /* ── RADIAL EXPANSION GLOW — tracks the scale ──────────────────── */
      #t1-sec-tscale .radial-glow {
        position: absolute; left: 50%; top: 50%;
        width: 600px; height: 300px;
        margin-left: -300px; margin-top: -150px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.35) 0%,
          rgba(var(--accent-rgb), 0.12) 45%,
          transparent 70%);
        filter: blur(30px);
        z-index: 2;
        transform: scale(0.05);
      }

      /* ── HEADLINE (scales from tiny to display) ─────────────────────── */
      /* Content wrapper — centered */
      #t1-sec-tscale .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-tscale .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1440px; padding: 0 60px;
        /* GSAP animates scale from small + blur to 1 + sharp */
        transform-origin: 50% 50%;
      }
      #t1-sec-tscale .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Kicker — appears below headline */
      #t1-sec-tscale .kicker {
        margin-top: 36px;
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
      }

      /* Vignette + grain */
      #t1-sec-tscale .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-tscale .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-tscale" data-composition-id="t1-sec-tscale" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="radial-glow"></div>

      <div class="content">
        <div class="headline" data-slot="headline">From Zero to <em>AI-Fluent</em><br>in 30 Days</div>
        <div class="kicker" data-slot="kicker">— Your Roadmap —</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Grain flicker — deterministic */
      tl.fromTo("#t1-sec-tscale .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Canvas layers */
      tl.from("#t1-sec-tscale .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.5, ease: "expo.out" }, 0)
        .from("#t1-sec-tscale .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* Headline starts invisible at tiny scale + heavy blur */
      tl.set("#t1-sec-tscale .headline", { autoAlpha: 1, scale: 0.06, filter: "blur(28px)" }, 0);

      /* Radial glow starts tiny */
      tl.set("#t1-sec-tscale .radial-glow", { scale: 0.05, autoAlpha: 0 }, 0);

      /* Headline scales up and blur resolves — the focus-pull */
      tl.to("#t1-sec-tscale .headline",
            { scale: 1.0, filter: "blur(0px)", duration: 1.1, ease: "power4.out" }, 0.30);

      /* Radial glow expands in sync */
      tl.to("#t1-sec-tscale .radial-glow",
            { scale: 1.0, autoAlpha: 1, transformOrigin: "50% 50%", duration: 1.1, ease: "power3.out" }, 0.30);

      /* Brief overshoot then settle — scale spring */
      tl.to("#t1-sec-tscale .headline",
            { scale: 1.04, duration: 0.18, ease: "power2.out" }, 1.38);
      tl.to("#t1-sec-tscale .headline",
            { scale: 1.00, duration: 0.40, ease: "back.out(2.2)" }, 1.56);

      /* Kicker fades in below */
      tl.from("#t1-sec-tscale .kicker",
            { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.65, ease: "power3.out" }, 1.60);

      /* Headline glow breathes */
      tl.to("#t1-sec-tscale .headline",
            { textShadow: "0 0 28px rgba(255,255,255,0.60), 0 0 60px rgba(var(--accent-rgb),0.40)",
              duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.3);

      /* Radial glow pulses gently */
      tl.to("#t1-sec-tscale .radial-glow",
            { opacity: 0.60, scale: 1.10, transformOrigin: "50% 50%",
              duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      /* Slow bloom drift */
      tl.to("#t1-sec-tscale .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-tscale"] = tl;
    </script>
  </body>
</html>
