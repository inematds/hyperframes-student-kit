<!doctype html>
<!--
  KALLAWAY · tier1 · overview · KPIROW
  A row of 3 KPI metric tiles. Each: big number counts up + label + small
  color-coded delta caret (up/down). Aurora bloom, glassmorphism, staggered build.
  Slots: title, k1-label, k1-unit, k2-label, k2-unit, k3-label, k3-unit.
  Knobs (on each .kpi-tile):
    data-val   — target number (default 94, 3.2, 12800)
    data-dec   — decimal places (default 0)
    data-delta — signed number shown as delta badge, e.g. "+12" or "-3.4" (default "+12")
    data-dir   — "up" | "down" colors the caret green/red (default "up")
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-kpi {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-kpi .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-kpi .dot-grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.44;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-kpi .title-row {
        position: absolute; left: 0; right: 0; top: 80px;
        text-align: center; z-index: 4;
      }
      #t1-ov-kpi .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-kpi .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* KPI row */
      #t1-ov-kpi .kpi-row {
        position: absolute; left: 120px; right: 120px;
        top: 50%; transform: translateY(-44%);
        display: flex; gap: 36px; z-index: 4;
      }

      /* Individual KPI tile */
      #t1-ov-kpi .kpi-tile {
        flex: 1;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 60px 56px 52px;
        position: relative; overflow: hidden;
        display: flex; flex-direction: column; align-items: flex-start;
      }
      #t1-ov-kpi .kpi-tile::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 20%, var(--glass-hi) 80%, transparent);
      }

      /* Glowing left accent edge */
      #t1-ov-kpi .kpi-tile::after {
        content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
        border-radius: 3px 0 0 3px;
        background: linear-gradient(180deg, transparent, rgba(var(--accent-rgb), 0.70) 40%, rgba(var(--accent-rgb), 0.70) 60%, transparent);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.55);
      }

      /* Label kicker */
      #t1-ov-kpi .kpi-label {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); margin-bottom: 32px;
      }

      /* Big number */
      #t1-ov-kpi .kpi-num {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 130px; line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 15%, rgba(var(--accent-rgb), 0.80) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 26px rgba(var(--accent-rgb), 0.48));
      }

      /* Unit sub-label */
      #t1-ov-kpi .kpi-unit {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        margin-top: 14px; line-height: 1.4;
      }

      /* Delta badge */
      #t1-ov-kpi .kpi-delta {
        position: absolute; top: 52px; right: 48px;
        display: flex; align-items: center; gap: 6px;
        font-family: var(--font-mono); font-size: 26px; font-weight: var(--wt-bold);
        letter-spacing: 0.02em;
        padding: 6px 16px; border-radius: var(--radius-sm);
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
      }
      #t1-ov-kpi .kpi-delta.up   { color: #4ADE80; text-shadow: 0 0 12px rgba(74,222,128,0.60); }
      #t1-ov-kpi .kpi-delta.down { color: var(--alert); text-shadow: 0 0 12px rgba(var(--alert-rgb),0.55); }
      #t1-ov-kpi .caret {
        display: inline-block; font-size: 22px; line-height: 1;
      }

      /* Divider rule under number */
      #t1-ov-kpi .kpi-rule {
        width: 48px; height: 2px; border-radius: 1px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        margin: 20px 0 0;
      }

      /* Vignette + grain */
      #t1-ov-kpi .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-kpi .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-kpi" data-composition-id="t1-ov-kpi" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="dot-grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Key <em>Performance</em> Metrics</div>
      </div>

      <div class="kpi-row">

        <div class="kpi-tile" id="kpi-1" data-val="94" data-dec="0" data-delta="+12%" data-dir="up">
          <div class="kpi-label" data-slot="k1-label">COURSE COMPLETION</div>
          <div class="kpi-delta up" id="kpi-1-delta">
            <span class="caret">▲</span><span id="kpi-1-delta-val">+12%</span>
          </div>
          <div class="kpi-num" id="kpi-1-num">0</div>
          <div class="kpi-rule"></div>
          <div class="kpi-unit" data-slot="k1-unit">percent of starters</div>
        </div>

        <div class="kpi-tile" id="kpi-2" data-val="3.2" data-dec="1" data-delta="+0.4" data-dir="up">
          <div class="kpi-label" data-slot="k2-label">AVG. REVIEW SCORE</div>
          <div class="kpi-delta up" id="kpi-2-delta">
            <span class="caret">▲</span><span id="kpi-2-delta-val">+0.4</span>
          </div>
          <div class="kpi-num" id="kpi-2-num">0.0</div>
          <div class="kpi-rule"></div>
          <div class="kpi-unit" data-slot="k2-unit">out of 4.0</div>
        </div>

        <div class="kpi-tile" id="kpi-3" data-val="12800" data-dec="0" data-delta="+1.2K" data-dir="up">
          <div class="kpi-label" data-slot="k3-label">MONTHLY REVENUE</div>
          <div class="kpi-delta up" id="kpi-3-delta">
            <span class="caret">▲</span><span id="kpi-3-delta-val">+1.2K</span>
          </div>
          <div class="kpi-num" id="kpi-3-num">$0</div>
          <div class="kpi-rule"></div>
          <div class="kpi-unit" data-slot="k3-unit">USD this month</div>
        </div>

      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-kpi .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "95px 72px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-kpi .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-kpi .dot-grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-kpi .title",
          { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.45)

        /* KPI tiles stagger in */
        .from("#kpi-1",
          { autoAlpha: 0, y: 50, scale: 0.92, transformOrigin: "50% 50%",
            filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.0)
        .from("#kpi-2",
          { autoAlpha: 0, y: 50, scale: 0.92, transformOrigin: "50% 50%",
            filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.16)
        .from("#kpi-3",
          { autoAlpha: 0, y: 50, scale: 0.92, transformOrigin: "50% 50%",
            filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.32);

      /* delta badges pop in */
      tl.from("#kpi-1-delta",
          { autoAlpha: 0, scale: 0.7, duration: 0.45, ease: "back.out(2.0)" }, 1.55)
        .from("#kpi-2-delta",
          { autoAlpha: 0, scale: 0.7, duration: 0.45, ease: "back.out(2.0)" }, 1.68)
        .from("#kpi-3-delta",
          { autoAlpha: 0, scale: 0.7, duration: 0.45, ease: "back.out(2.0)" }, 1.81);

      /* count-up for kpi-1 */
      const n1 = document.getElementById("kpi-1-num");
      const t1val = parseFloat(document.getElementById("kpi-1").getAttribute("data-val")) || 94;
      tl.to({ val: 0 }, {
        val: t1val, duration: 1.4, ease: "power2.out",
        onUpdate: function() {
          n1.textContent = Math.round(this.targets()[0].val) + "%";
        }
      }, 1.30);

      /* count-up for kpi-2 */
      const n2 = document.getElementById("kpi-2-num");
      const t2val = parseFloat(document.getElementById("kpi-2").getAttribute("data-val")) || 3.2;
      tl.to({ val: 0 }, {
        val: t2val, duration: 1.4, ease: "power2.out",
        onUpdate: function() {
          n2.textContent = this.targets()[0].val.toFixed(1);
        }
      }, 1.44);

      /* count-up for kpi-3 */
      const n3 = document.getElementById("kpi-3-num");
      const t3val = parseFloat(document.getElementById("kpi-3").getAttribute("data-val")) || 12800;
      tl.to({ val: 0 }, {
        val: t3val, duration: 1.5, ease: "power2.out",
        onUpdate: function() {
          n3.textContent = "$" + Math.round(this.targets()[0].val).toLocaleString();
        }
      }, 1.58);

      /* accent rule glow pulse (autoAlpha+scale on rules — no filter involved) */
      tl.to("#kpi-1 .kpi-rule",
        { width: "72px", boxShadow: "0 0 18px rgba(55,189,248,0.80)",
          duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0);

      /* slow hold drift */
      tl.to("#t1-ov-kpi .kpi-row",
        { y: -10, duration: 5.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);
      window.__timelines["t1-ov-kpi"] = tl;
    </script>
  </body>
</html>
