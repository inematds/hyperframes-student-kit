<!doctype html>
<!--
  KALLAWAY · tier1 · overview · VENN DIAGRAM
  Full-screen takeover. Two large glowing translucent circles overlap in the
  center of the canvas. Circles scale in from center (scale 0→1). Three labels:
  A (left circle), B (right circle), overlap (intersection). Clean SVG circles
  with glass fill and neon stroke.
  Slots: title, label_a, label_a_sub, label_overlap, label_overlap_sub, label_b, label_b_sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-venn {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }

      #t1-ov-venn .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-venn .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 105% at 50% 55%, #000 28%, transparent 76%);
                mask-image: radial-gradient(120% 105% at 50% 55%, #000 28%, transparent 76%);
      }

      /* Title top-center */
      #t1-ov-venn .card-title {
        position: absolute; left: 0; right: 0; top: 58px; z-index: 5;
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow); line-height: 1.1;
      }
      #t1-ov-venn .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /*
        Venn circles — SVG layer, full canvas.
        Canvas center: 960, 540. Circle r=310.
        Left center: 760, 540. Right center: 1160, 540.
        Overlap intersection midpoint: 960, 540.
      */
      #t1-ov-venn .venn-svg {
        position: absolute; inset: 0; z-index: 2;
        pointer-events: none; overflow: visible;
      }
      /* Filled translucent circles */
      #t1-ov-venn .venn-svg .circle-fill {
        fill: rgba(var(--accent-rgb), 0.08);
        stroke: rgba(var(--accent-rgb), 0.60);
        stroke-width: 2;
        filter: drop-shadow(0 0 22px rgba(55,189,248,0.30));
      }
      /* Glow ring overlay (same path, wider stroke, blurred) */
      #t1-ov-venn .venn-svg .circle-glow {
        fill: none;
        stroke: rgba(var(--accent-rgb), 0.22);
        stroke-width: 18;
        filter: blur(8px);
      }

      /* Label text blocks — absolutely positioned */
      #t1-ov-venn .venn-label {
        position: absolute; z-index: 5;
        text-align: center;
      }
      #t1-ov-venn .venn-label .v-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 38px; color: var(--white);
        text-shadow: var(--textglow); letter-spacing: var(--track-snug);
        margin-bottom: 8px;
      }
      #t1-ov-venn .venn-label .v-sub {
        font-family: var(--font-body); font-size: 24px;
        color: var(--text-dim); line-height: 1.4; max-width: 260px; margin: 0 auto;
      }

      /* Overlap label — center, accent */
      #t1-ov-venn .venn-label.overlap .v-title {
        color: var(--accent); text-shadow: var(--textglow-accent); font-size: 34px;
      }

      /*
        Label positions:
          A: left circle exclusive region ~left=460, vertically centered ~top=460
          B: right circle exclusive region ~left=1240, top=460
          Overlap: center ~left=850, top=460
      */
      #t1-ov-venn #vl-a        { left: 420px;  top: 452px; }
      #t1-ov-venn #vl-overlap  { left: 848px;  top: 452px; }
      #t1-ov-venn #vl-b        { left: 1240px; top: 452px; }

      #t1-ov-venn .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-venn .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-venn" data-composition-id="t1-ov-venn" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="card-title" data-slot="title">Where <em>Value</em> Is Created</div>

      <!-- Venn SVG: two circles, r=310, left cx=760 right cx=1160, cy=560 -->
      <svg class="venn-svg" viewBox="0 0 1920 1080" width="1920" height="1080">
        <!-- Glow halos (behind fills) -->
        <circle class="circle-glow" id="ven-glow-a" cx="760"  cy="560" r="310" />
        <circle class="circle-glow" id="ven-glow-b" cx="1160" cy="560" r="310" />
        <!-- Filled circles -->
        <circle class="circle-fill" id="ven-circle-a" cx="760"  cy="560" r="310" />
        <circle class="circle-fill" id="ven-circle-b" cx="1160" cy="560" r="310" />
      </svg>

      <!-- Labels -->
      <div class="venn-label" id="vl-a">
        <div class="v-title" data-slot="label_a">Skills</div>
        <div class="v-sub"   data-slot="label_a_sub">Deep domain expertise you've spent years building</div>
      </div>

      <div class="venn-label overlap" id="vl-overlap">
        <div class="v-title" data-slot="label_overlap">Leverage</div>
        <div class="v-sub"   data-slot="label_overlap_sub">Where rare skill meets market demand</div>
      </div>

      <div class="venn-label" id="vl-b">
        <div class="v-title" data-slot="label_b">Market</div>
        <div class="v-sub"   data-slot="label_b_sub">Urgent problems people will pay to solve</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-venn .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "100px 78px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-venn .bloom", { autoAlpha: 0, scale: 0.89, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-venn .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-venn .card-title", { autoAlpha: 0, y: 26, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.46)

        /* circles scale in from center — left then right, slight stagger */
        .from("#ven-circle-a, #ven-glow-a", { scale: 0, transformOrigin: "760px 560px", autoAlpha: 0, duration: 0.80, ease: "back.out(1.3)" }, 0.90)
        .from("#ven-circle-b, #ven-glow-b", { scale: 0, transformOrigin: "1160px 560px", autoAlpha: 0, duration: 0.80, ease: "back.out(1.3)" }, 1.10)

        /* labels glide in */
        .from("#vl-a",       { autoAlpha: 0, x: -30, filter: "blur(10px)", duration: 0.70, ease: "power3.out" }, 1.55)
        .from("#vl-b",       { autoAlpha: 0, x:  30, filter: "blur(10px)", duration: 0.70, ease: "power3.out" }, 1.70)
        .from("#vl-overlap", { autoAlpha: 0, y:  20, filter: "blur(10px)", duration: 0.70, ease: "power3.out" }, 1.90)

        /* circle glow breathing — finite */
        .to("#ven-circle-a",
          { filter: "drop-shadow(0 0 40px rgba(55,189,248,0.48))",
            duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)
        .to("#ven-circle-b",
          { filter: "drop-shadow(0 0 40px rgba(55,189,248,0.48))",
            duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)

        /* overlap label accent pulse */
        .to("#vl-overlap .v-title",
          { textShadow: "0 0 28px rgba(55,189,248,0.90), 0 0 60px rgba(55,189,248,0.45)",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        /* slow upward drift */
        .to("#t1-ov-venn .venn-svg, #t1-ov-venn #vl-a, #t1-ov-venn #vl-b, #t1-ov-venn #vl-overlap",
          { y: -10, duration: 4.5, ease: "sine.inOut" }, 2.0)

        .set({}, {}, 7);

      window.__timelines["t1-ov-venn"] = tl;
    </script>
  </body>
</html>
