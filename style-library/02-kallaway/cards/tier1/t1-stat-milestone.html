<!doctype html>
<!--
  KALLAWAY · tier1 · stat · MILESTONE
  A glowing horizontal progress track; a lit dot travels from left to the
  milestone marker position. The count-up number sits above the landing dot.
  Track has tick marks at 0, 25, 50, 75, 100. The milestone peg glows bright.
  Knob: data-pct on #t1-stat-mile-track (default 86).
  Slots: kicker, stat (e.g. "86%"), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-mile {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-mile .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-mile .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      #t1-stat-mile .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 50px;
      }

      #t1-stat-mile .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* number above the track */
      #t1-stat-mile .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: var(--size-mega);
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.80) 88%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.55));
      }

      /* track assembly */
      #t1-stat-mile .track-wrap {
        position: relative;
        width: 1200px; height: 80px;
      }

      /* background rail */
      #t1-stat-mile .rail {
        position: absolute; top: 50%; left: 0; right: 0; height: 6px;
        transform: translateY(-50%);
        background: rgba(255,255,255,0.10);
        border-radius: 3px;
      }

      /* lit fill — width driven by JS */
      #t1-stat-mile .rail-fill {
        position: absolute; top: 0; left: 0; height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb),0.40) 0%, var(--accent) 100%);
        box-shadow: 0 0 12px 2px rgba(var(--accent-rgb), 0.45);
      }

      /* tick marks at 0, 25, 50, 75, 100 */
      #t1-stat-mile .tick {
        position: absolute; top: 50%; width: 2px; height: 20px;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.25);
        border-radius: 1px;
      }
      #t1-stat-mile .tick-label {
        position: absolute; top: calc(50% + 22px);
        transform: translateX(-50%);
        font-family: var(--font-mono); font-size: 18px;
        color: var(--text-faint); letter-spacing: 0.08em;
      }

      /* traveling dot */
      #t1-stat-mile .dot {
        position: absolute; top: 50%; width: 28px; height: 28px;
        border-radius: 50%; left: 0;
        transform: translate(-50%, -50%);
        background: #ffffff;
        box-shadow: 0 0 14px 4px rgba(var(--accent-rgb), 0.9),
                    0 0 40px 8px rgba(var(--accent-rgb), 0.50);
      }

      /* milestone peg flag */
      #t1-stat-mile .peg {
        position: absolute; top: 50%; width: 4px; height: 50px;
        transform: translate(-50%, -50%);
        background: var(--accent);
        border-radius: 2px;
        box-shadow: 0 0 10px 2px rgba(var(--accent-rgb), 0.8);
      }

      #t1-stat-mile .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
      }
      #t1-stat-mile .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-mile .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-mile .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-mile .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-mile" data-composition-id="t1-stat-mile" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">MODULE COMPLETION · ACTIVE COHORT</div>

        <div class="stat" id="t1-stat-mile-num" data-slot="stat">0%</div>

        <div class="track-wrap" id="t1-stat-mile-track" data-pct="86">
          <div class="rail">
            <div class="rail-fill" id="t1-stat-mile-fill"></div>
          </div>

          <!-- tick marks -->
          <div class="tick" style="left:0%"><div class="tick-label">0</div></div>
          <div class="tick" style="left:25%"><div class="tick-label">25%</div></div>
          <div class="tick" style="left:50%"><div class="tick-label">50%</div></div>
          <div class="tick" style="left:75%"><div class="tick-label">75%</div></div>
          <div class="tick" style="left:100%"><div class="tick-label">100%</div></div>

          <!-- milestone peg (positioned by JS) -->
          <div class="peg" id="t1-stat-mile-peg"></div>

          <!-- traveling dot -->
          <div class="dot" id="t1-stat-mile-dot"></div>
        </div>

        <div class="label" data-slot="label">of enrolled students reach the <em>capstone project milestone</em> — above the 62% industry average</div>
      </div>

      <div class="source" data-slot="source">SOURCE · PLATFORM ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const trackEl = document.getElementById("t1-stat-mile-track");
      const pct     = parseFloat(trackEl.getAttribute("data-pct")) || 86;
      const fillEl  = document.getElementById("t1-stat-mile-fill");
      const dotEl   = document.getElementById("t1-stat-mile-dot");
      const pegEl   = document.getElementById("t1-stat-mile-peg");
      const numEl   = document.getElementById("t1-stat-mile-num");

      /* position the peg at target pct */
      pegEl.style.left = pct + "%";

      /* init dot at 0 */
      dotEl.style.left = "0%";

      /* grain flicker */
      tl.fromTo("#t1-stat-mile .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-mile .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-mile .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-mile .kicker",
          { autoAlpha: 0, y: 16, duration: 0.7, ease: "power3.out" }, 0.45)

        /* peg drops in */
        .from("#t1-stat-mile .peg",
          { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 50%",
            duration: 0.5, ease: "back.out(1.6)" }, 0.65)

        /* tick marks fade in */
        .from("#t1-stat-mile .tick, #t1-stat-mile .tick-label",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0.70)

        /* dot + fill + count-up travel together */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.8, ease: "power3.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            fillEl.style.width        = v + "%";
            dotEl.style.left          = v + "%";
            numEl.textContent         = Math.round(v) + "%";
          }
        }, 0.85)

        /* label */
        .from("#t1-stat-mile .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.20)

        /* source */
        .from("#t1-stat-mile .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.55)

        /* dot glow pulse at rest */
        .to("#t1-stat-mile .dot",
          { boxShadow: "0 0 24px 8px rgba(55,189,248,0.95), 0 0 60px 16px rgba(55,189,248,0.45)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.85)

        .set({}, {}, 7);

      window.__timelines["t1-stat-mile"] = tl;
    </script>
  </body>
</html>
