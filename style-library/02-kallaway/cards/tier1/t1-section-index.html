<!doctype html>
<!--
  KALLAWAY · tier1 · section · INDEX
  Full-screen chapter takeover. Big chapter index "01 / 05" glows on the left
  in accent blue (kicker carries the index string, e.g. "01 / 05"). A thin
  vertical accent rule draws between the index and the headline, which is
  stacked to the right. Elegant, editorial, magazine-spread feel.
  Slots: kicker (~16 chars, e.g. "01 / 05"), headline (~52 chars, <em> on accent phrase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-idx {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-idx .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-idx .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.44;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
      }

      /* Root layout — horizontal flex, centered vertically */
      #t1-sec-idx .layout {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: row;
        align-items: center; justify-content: center;
        gap: 0; /* rule handles spacing */
        padding: 0 160px;
        z-index: 4;
      }

      /* Left column: big index number */
      #t1-sec-idx .index-col {
        flex: 0 0 auto;
        display: flex; flex-direction: column;
        align-items: flex-end;
        padding-right: 80px;
      }
      #t1-sec-idx .index-label {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase;
        color: rgba(var(--accent-rgb), 0.60); margin-bottom: 16px;
      }
      #t1-sec-idx .index-number {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 200px; line-height: 0.9; letter-spacing: var(--track-tight);
        color: var(--accent); text-shadow: var(--textglow-accent);
      }
      #t1-sec-idx .index-total {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 40px; letter-spacing: 0.08em;
        color: rgba(var(--accent-rgb), 0.45);
        margin-top: 14px; align-self: flex-end;
      }

      /* Center: vertical accent rule that draws in */
      #t1-sec-idx .rule-wrap {
        flex: 0 0 2px; align-self: stretch;
        position: relative; overflow: hidden;
        margin: 80px 0;
      }
      #t1-sec-idx .rule {
        position: absolute; left: 0; right: 0; top: 0;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.80) 15%,
          rgba(var(--accent-rgb), 0.80) 85%,
          transparent 100%);
        box-shadow: 0 0 14px 2px rgba(var(--accent-rgb), 0.40);
        /* GSAP scales scaleY from 0, transform-origin top */
        height: 100%; transform-origin: top center;
      }

      /* Right column: headline */
      #t1-sec-idx .headline-col {
        flex: 1 1 auto;
        display: flex; flex-direction: column;
        justify-content: center;
        padding-left: 80px;
      }
      #t1-sec-idx .sub-label {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 32px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--text-dim); margin-bottom: 32px;
      }
      #t1-sec-idx .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 80px; line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-sec-idx .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-idx .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-idx .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-idx" data-composition-id="t1-sec-idx" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <!-- Left: index -->
        <div class="index-col">
          <div class="index-label">Chapter</div>
          <!-- kicker carries the index e.g. "02" — split visually from total -->
          <div class="index-number" data-slot="kicker">02</div>
          <div class="index-total">/ 05</div>
        </div>

        <!-- Center: vertical rule -->
        <div class="rule-wrap">
          <div class="rule"></div>
        </div>

        <!-- Right: headline -->
        <div class="headline-col">
          <div class="sub-label">Next Up</div>
          <div class="headline" data-slot="headline">From <em>Prototype</em> to Production-Ready</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-idx .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-idx .bloom",
            { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-idx .grid",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2);

      /* index column glides in from left with blur */
      tl.from("#t1-sec-idx .index-col",
            { autoAlpha: 0, x: -48, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.55);

      /* accent rule draws down */
      tl.from("#t1-sec-idx .rule",
            { scaleY: 0, duration: 0.75, ease: "expo.out" }, 0.90);

      /* headline column glides in from right */
      tl.from("#t1-sec-idx .headline-col",
            { autoAlpha: 0, x: 48, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.00);

      /* index number glow pulse */
      tl.to("#t1-sec-idx .index-number",
            { textShadow: "0 0 48px rgba(var(--accent-rgb),0.80), 0 0 100px rgba(var(--accent-rgb),0.44)",
              duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.0);

      /* headline glow breathes */
      tl.to("#t1-sec-idx .headline",
            { textShadow: "0 0 28px rgba(255,255,255,0.55), 0 0 60px rgba(var(--accent-rgb),0.38)",
              duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.3);

      /* slow bloom drift during hold */
      tl.to("#t1-sec-idx .bloom",
            { scale: 1.07, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-idx"] = tl;
    </script>
  </body>
</html>
