<!doctype html>
<!--
  KALLAWAY · tier1 · stat · NODES
  Five glowing nodes connected by thin animated-draw lines converge toward a
  central hero value. Lines draw from left to right, nodes pop with a spring,
  the central stat blooms last. Clean neon-graph aesthetic.
  Slots: kicker (~28 chars), stat (e.g. "4.9×"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-nodes {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-nodes .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-nodes .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── SVG graph layer ── */
      #t1-stat-nodes .node-svg {
        position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 3;
        overflow: visible;
      }

      /* ── content (kicker / stat / label) floats over ── */
      #t1-stat-nodes .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 44px; padding-bottom: 30px;
      }

      #t1-stat-nodes .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* center stat — sits where the hub node is */
      #t1-stat-nodes .stat-wrap {
        display: flex; flex-direction: column; align-items: center;
      }
      #t1-stat-nodes .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb),0.80) 72%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-nodes .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 860px; line-height: 1.45;
      }
      #t1-stat-nodes .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* node-label chips (positioned absolutely via inline style) */
      #t1-stat-nodes .node-label {
        position: absolute; font-family: var(--font-mono); font-size: 20px;
        font-weight: var(--wt-bold); letter-spacing: 0.10em;
        text-transform: uppercase; color: var(--text-dim);
        white-space: nowrap;
      }

      #t1-stat-nodes .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-nodes .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-nodes .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-nodes" data-composition-id="t1-stat-nodes" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- SVG: lines + outer nodes -->
      <svg class="node-svg" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="nd-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
            <feComposite in="SourceGraphic" in2="b" operator="over"/>
          </filter>
          <filter id="nd-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
            <feComposite in="SourceGraphic" in2="b" operator="over"/>
          </filter>
          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(55,189,248,0.18)"/>
            <stop offset="100%" stop-color="rgba(55,189,248,0.72)"/>
          </linearGradient>
        </defs>

        <!-- 5 spoke lines from satellite nodes to center (960,540) -->
        <!-- each given a unique id for dash-draw animation -->
        <line id="nd-l1" x1="310" y1="260" x2="960" y2="540"
              stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="0 800"/>
        <line id="nd-l2" x1="310" y1="820" x2="960" y2="540"
              stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="0 800"/>
        <line id="nd-l3" x1="680" y1="150" x2="960" y2="540"
              stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="0 800"/>
        <line id="nd-l4" x1="1610" y1="260" x2="960" y2="540"
              stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="0 800"/>
        <line id="nd-l5" x1="1610" y1="820" x2="960" y2="540"
              stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="0 800"/>

        <!-- satellite node circles -->
        <circle id="nd-n1" cx="310" cy="260" r="22" fill="rgba(55,189,248,0.14)"
                stroke="rgba(55,189,248,0.65)" stroke-width="1.5" filter="url(#nd-glow-sm)" opacity="0"/>
        <circle id="nd-n2" cx="310" cy="820" r="18" fill="rgba(55,189,248,0.14)"
                stroke="rgba(55,189,248,0.65)" stroke-width="1.5" filter="url(#nd-glow-sm)" opacity="0"/>
        <circle id="nd-n3" cx="680" cy="150" r="26" fill="rgba(55,189,248,0.14)"
                stroke="rgba(55,189,248,0.65)" stroke-width="1.5" filter="url(#nd-glow-sm)" opacity="0"/>
        <circle id="nd-n4" cx="1610" cy="260" r="20" fill="rgba(55,189,248,0.14)"
                stroke="rgba(55,189,248,0.65)" stroke-width="1.5" filter="url(#nd-glow-sm)" opacity="0"/>
        <circle id="nd-n5" cx="1610" cy="820" r="24" fill="rgba(55,189,248,0.14)"
                stroke="rgba(55,189,248,0.65)" stroke-width="1.5" filter="url(#nd-glow-sm)" opacity="0"/>

        <!-- hub glow ring -->
        <circle id="nd-hub-glow" cx="960" cy="540" r="170"
                fill="rgba(55,189,248,0.06)"
                stroke="rgba(55,189,248,0.22)" stroke-width="1" filter="url(#nd-glow)" opacity="0"/>
      </svg>

      <!-- node-label chips -->
      <div class="node-label" id="nd-lbl1" style="left:170px; top:222px; opacity:0" data-slot="">Video</div>
      <div class="node-label" id="nd-lbl2" style="left:170px; top:808px; opacity:0" data-slot="">Audio</div>
      <div class="node-label" id="nd-lbl3" style="left:590px; top:106px; opacity:0" data-slot="">Text</div>
      <div class="node-label" id="nd-lbl4" style="left:1634px; top:222px; opacity:0" data-slot="">Code</div>
      <div class="node-label" id="nd-lbl5" style="left:1634px; top:808px; opacity:0" data-slot="">Data</div>

      <div class="content">
        <div class="kicker" data-slot="kicker">OUTPUT MULTIPLIER · AI STUDENTS</div>
        <div class="stat-wrap">
          <div class="stat" data-slot="stat">4.9×</div>
        </div>
        <div class="label" data-slot="label">AI-trained creators produce across <em>more output formats</em> simultaneously than pre-course</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS COHORT STUDY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* line lengths (approx sqrt of dx²+dy²) */
      const lens = [736, 736, 682, 736, 736];
      const lineIds   = ["nd-l1","nd-l2","nd-l3","nd-l4","nd-l5"];
      const nodeIds   = ["nd-n1","nd-n2","nd-n3","nd-n4","nd-n5"];
      const labelIds  = ["nd-lbl1","nd-lbl2","nd-lbl3","nd-lbl4","nd-lbl5"];

      /* init lines hidden (dasharray = 0 totalLen) */
      lineIds.forEach((id, i) => {
        const el = document.getElementById(id);
        el.setAttribute("stroke-dasharray", "0 " + (lens[i] + 10));
      });

      /* grain flicker */
      tl.fromTo("#t1-stat-nodes .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-nodes .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-nodes .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-nodes .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.40)

        /* satellite nodes pop in with spring */
        .to(["#nd-n1","#nd-n2","#nd-n3","#nd-n4","#nd-n5"],
          { opacity: 1, scale: 1.2, transformOrigin: "center center",
            duration: 0.4, ease: "back.out(1.7)", stagger: 0.12 }, 0.55)
        .to(["#nd-n1","#nd-n2","#nd-n3","#nd-n4","#nd-n5"],
          { scale: 1, duration: 0.3, ease: "sine.out", stagger: 0.12 }, 0.90)

        /* node labels fade */
        .to(["#nd-lbl1","#nd-lbl2","#nd-lbl3","#nd-lbl4","#nd-lbl5"],
          { opacity: 1, duration: 0.4, stagger: 0.12 }, 0.65);

      /* draw lines one by one */
      lineIds.forEach((id, i) => {
        const el  = document.getElementById(id);
        const len = lens[i];
        tl.to({ val: 0 }, {
          val: len, duration: 0.55, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            el.setAttribute("stroke-dasharray", v + " " + (len + 10));
          }
        }, 0.70 + i * 0.10);
      });

      /* hub glow ring */
      tl.to("#nd-hub-glow",
        { opacity: 1, scale: 1.08, transformOrigin: "960px 540px",
          duration: 0.8, ease: "expo.out" }, 1.35)

        /* stat bloom in */
        .from("#t1-stat-nodes .stat",
          { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.4)" }, 1.45)

        /* label */
        .from("#t1-stat-nodes .label",
          { autoAlpha: 0, y: 22, duration: 0.85, ease: "power3.out" }, 2.10)

        /* source */
        .from("#t1-stat-nodes .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.45)

        /* hub breathing pulse */
        .to("#nd-hub-glow",
          { opacity: 0.40, scale: 1.18, transformOrigin: "960px 540px",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-nodes"] = tl;
    </script>
  </body>
</html>
