<!doctype html>
<!--
  KALLAWAY · tier1 · section · TYPED
  Full-screen chapter takeover. Monospace kicker appears like a terminal prompt
  ("> Chapter 03"), then the headline types in character-by-character with a
  blinking block cursor (finite blink). Subtle horizontal scanline glow across
  the type area. Premium dark hacker-editorial aesthetic.
  Slots: kicker (~16 chars), headline (~52 chars, <em> on accent-glow phrase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-type {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom — slightly dimmer for terminal mood */
      #t1-sec-type .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1; opacity: 0.75;
      }
      /* Dot grid */
      #t1-sec-type .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 50%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 100% at 50% 50%, #000 30%, transparent 78%);
      }

      /* Content column — left-aligned with generous left inset */
      #t1-sec-type .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: flex-start; justify-content: center;
        padding-left: 200px;
        z-index: 4;
      }

      /* Prompt kicker: "> LABEL" in Space Mono */
      #t1-sec-type .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-reg);
        font-size: 34px; letter-spacing: 0.08em;
        color: var(--accent); text-shadow: var(--textglow-accent);
        margin-bottom: 40px;
      }
      #t1-sec-type .kicker .prompt-arrow {
        color: rgba(var(--accent-rgb), 0.6);
        margin-right: 16px;
      }

      /* Headline with typing wrapper */
      #t1-sec-type .headline-wrap {
        position: relative;
      }
      #t1-sec-type .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.10;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px;
      }
      #t1-sec-type .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Block cursor */
      #t1-sec-type .cursor {
        display: inline-block;
        width: 10px; height: 88px;
        background: var(--accent);
        box-shadow: var(--glow-accent);
        vertical-align: middle;
        margin-left: 10px;
        /* GSAP flickers this autoAlpha */
      }

      /* Scanline glow — a soft horizontal band across the headline area */
      #t1-sec-type .scanline {
        position: absolute; left: 160px; right: 0; top: 420px;
        height: 180px; z-index: 3; pointer-events: none;
        background: radial-gradient(ellipse 900px 90px at 50% 50%,
          rgba(var(--accent-rgb), 0.10) 0%,
          transparent 100%);
        filter: blur(4px);
      }

      /* Vignette + grain */
      #t1-sec-type .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-type .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-type" data-composition-id="t1-sec-type" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="scanline"></div>

      <div class="content">
        <div class="kicker">
          <span class="prompt-arrow">&gt;</span><span data-slot="kicker">Chapter 03</span>
        </div>
        <div class="headline-wrap">
          <div class="headline" data-slot="headline">What <em>No One</em> Tells You About Scale</div><span class="cursor"></span>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-type .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-type .bloom",
            { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-type .grid",
            { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-sec-type .scanline",
            { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 0.4);

      /* kicker glides in from left */
      tl.from("#t1-sec-type .kicker",
            { autoAlpha: 0, x: -28, filter: "blur(8px)", duration: 0.8, ease: "power3.out" }, 0.6);

      /* headline typewriter: start hidden, reveal via clipPath width 0→100% */
      tl.set("#t1-sec-type .headline",
            { autoAlpha: 1, clipPath: "inset(0 100% 0 0)" }, 1.10)
        .to("#t1-sec-type .headline",
            { clipPath: "inset(0 0% 0 0)", duration: 1.6, ease: "none" }, 1.10);

      /* cursor appears at start of type, blinks finite times, then holds */
      tl.from("#t1-sec-type .cursor",
            { autoAlpha: 0, duration: 0.05, ease: "none" }, 1.05)
        .to("#t1-sec-type .cursor",
            { autoAlpha: 0, duration: 0.28, ease: "none", repeat: 5, yoyo: true }, 2.80)
        /* cursor fades after typing done */
        .to("#t1-sec-type .cursor",
            { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 5.50);

      /* scanline slow drift during hold */
      tl.to("#t1-sec-type .scanline",
            { y: -30, opacity: 0.6, duration: 4.0, ease: "sine.inOut" }, 1.5);

      /* accent glow pulse on headline after fully typed */
      tl.to("#t1-sec-type .headline",
            { textShadow: "0 0 28px rgba(255,255,255,0.50), 0 0 60px rgba(var(--accent-rgb),0.38)",
              duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-type"] = tl;
    </script>
  </body>
</html>
