<!doctype html>
<!--
  KALLAWAY · tier1 · section · COUNTDOWN
  Full-screen chapter takeover. A massive chapter number ticks/counts up from
  0 to the target value (using the mandatory 3-arg proxy .to pattern). After
  settling on the final number, the section headline fades in below it.
  Slots: number (the counting figure; data-target="3"), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-cdown {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-cdown .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-cdown .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Layout */
      #t1-sec-cdown .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        z-index: 4;
        padding-bottom: 60px;
      }

      /* The big chapter number */
      #t1-sec-cdown .number-wrap {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        height: 360px;
      }
      #t1-sec-cdown .number {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 340px; line-height: 1; letter-spacing: -0.04em;
        /* Gradient text: white-to-blue */
        background: linear-gradient(160deg, #ffffff 10%, rgba(var(--accent-rgb), 0.90) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        /* Use drop-shadow, NOT text-shadow, because of gradient clip */
        filter: drop-shadow(0 0 40px rgba(var(--accent-rgb), 0.55))
                drop-shadow(0 0 100px rgba(var(--accent-rgb), 0.28));
        position: relative; z-index: 2;
      }
      /* Ambient glow halo around the number */
      #t1-sec-cdown .number-halo {
        position: absolute; inset: -80px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.20) 0%, transparent 65%);
        box-shadow: 0 0 160px 60px rgba(var(--accent-rgb), 0.18);
        z-index: 1;
      }
      /* Tick marks — decorative ring around number */
      #t1-sec-cdown .tick-ring {
        position: absolute; inset: -50px;
        border-radius: 50%;
        border: 1px solid rgba(var(--accent-rgb), 0.22);
        box-shadow: inset 0 0 30px rgba(var(--accent-rgb), 0.08);
        z-index: 1;
        opacity: 0;
      }

      /* Divider line between number and headline */
      #t1-sec-cdown .divider {
        width: 200px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.70), transparent);
        box-shadow: 0 0 8px 1px rgba(var(--accent-rgb), 0.35);
        margin: 32px 0 36px;
        transform-origin: 50% 50%;
      }

      #t1-sec-cdown .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1280px; text-align: center; padding: 0 60px;
      }
      #t1-sec-cdown .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-cdown .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-cdown .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-cdown" data-composition-id="t1-sec-cdown" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="number-wrap">
          <div class="number-halo"></div>
          <div class="tick-ring" id="t1-sec-cdown-tickring"></div>
          <!-- data-target drives the count-up target -->
          <div class="number" id="t1-sec-cdown-num" data-slot="number" data-target="3">0</div>
        </div>
        <div class="divider" id="t1-sec-cdown-div"></div>
        <div class="headline" data-slot="headline">Frameworks That Actually <em>Work</em> in Practice</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Read the knob */
      const numEl  = document.getElementById("t1-sec-cdown-num");
      const target = parseInt(numEl.getAttribute("data-target"), 10) || 3;

      /* grain flicker */
      tl.fromTo("#t1-sec-cdown .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-cdown .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-cdown .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* number halo blooms */
        .from("#t1-sec-cdown .number-halo",
          { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%",
            duration: 1.2, ease: "expo.out" }, 0.3)

        /* tick ring fades in */
        .to("#t1-sec-cdown-tickring",
          { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%",
            duration: 0.8, ease: "power2.out" }, 0.5)

        /* number starts at 0, counts up using proxy — mandatory 3-arg .to */
        .from("#t1-sec-cdown .number",
          { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 0.55, ease: "back.out(1.8)" }, 0.6)

        .to({ val: 0 }, {
          val: target,
          duration: 1.6,
          ease: "power2.out",
          onUpdate: function () {
            numEl.textContent = Math.round(this.targets()[0].val);
          }
        }, 0.9)

        /* tick ring pulses on each tick — finite */
        .to("#t1-sec-cdown-tickring",
          { scale: 1.08, transformOrigin: "50% 50%",
            duration: 0.2, ease: "power1.out", repeat: target - 1, yoyo: true }, 0.9)

        /* divider draws in after count lands */
        .from("#t1-sec-cdown-div",
          { scaleX: 0, transformOrigin: "50% 50%", duration: 0.65, ease: "power3.out" }, 2.6)

        /* headline glides in */
        .from("#t1-sec-cdown .headline",
          { autoAlpha: 0, y: 30, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 2.85)

        /* breathing glow on the halo — finite */
        .to("#t1-sec-cdown .number-halo",
          { opacity: 0.50, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.2)

        .set({}, {}, 7);

      window.__timelines["t1-sec-cdown"] = tl;
    </script>
  </body>
</html>
