<!doctype html>
<!--
  KALLAWAY · tier1 · overview · STATGRID
  Full-screen takeover. 2x2 grid of 4 mini-stat tiles; each tile = big
  glowing number that counts up + a short label. Count-up uses the
  3-argument tl.to({val:0}, {...}, pos) form (NEVER fromTo with 3 args).
  Tiles spring in staggered; numbers count up after tiles land.
  Slots: title, s1_val, s1_suffix, s1_label, s2_val, s2_suffix, s2_label,
         s3_val, s3_suffix, s3_label, s4_val, s4_suffix, s4_label.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-statgrid {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-ov-statgrid .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-ov-statgrid .grid-bg {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.44;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-statgrid .title-row {
        position: absolute; left: 0; right: 0; top: 80px; text-align: center; z-index: 4;
      }
      #t1-ov-statgrid .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-statgrid .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* 2x2 stat grid */
      #t1-ov-statgrid .stat-grid {
        position: absolute; left: 140px; right: 140px; top: 238px; bottom: 80px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 36px; z-index: 4;
      }

      /* Glass stat tile */
      #t1-ov-statgrid .stat-tile {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow), 0 0 36px rgba(var(--accent-rgb), 0.07);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 48px 40px;
        position: relative; overflow: hidden;
        gap: 16px;
      }
      /* Top hairline highlight */
      #t1-ov-statgrid .stat-tile::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }

      /* Number + suffix row */
      #t1-ov-statgrid .num-row {
        display: flex; align-items: baseline; gap: 4px; line-height: 1;
      }

      /* Big stat number */
      #t1-ov-statgrid .stat-num {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 140px; letter-spacing: var(--track-tight); line-height: 1;
        color: var(--white); text-shadow: var(--textglow);
        /* gradient accent fill */
        background: linear-gradient(160deg, var(--white) 10%, var(--accent) 90%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.45));
      }

      /* Suffix (%, x, K, M, etc.) */
      #t1-ov-statgrid .stat-suffix {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 72px; letter-spacing: var(--track-snug); line-height: 1;
        background: linear-gradient(160deg, var(--white) 0%, var(--accent) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.40));
      }

      /* Label */
      #t1-ov-statgrid .stat-label {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        line-height: 1.3; text-align: center;
      }

      /* Accent rule above label */
      #t1-ov-statgrid .stat-rule {
        width: 36px; height: 2px; border-radius: 1px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
      }

      #t1-ov-statgrid .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-statgrid .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-statgrid" data-composition-id="t1-ov-statgrid" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid-bg"></div>

      <div class="title-row">
        <div class="title" data-slot="title">The Numbers <em>Behind It</em></div>
      </div>

      <div class="stat-grid">

        <!-- Stat 1 -->
        <div class="stat-tile" id="sg-s1">
          <div class="num-row">
            <span class="stat-num" id="sg-n1" data-slot="s1_val">0</span>
            <span class="stat-suffix" data-slot="s1_suffix">%</span>
          </div>
          <div class="stat-rule"></div>
          <div class="stat-label" data-slot="s1_label">Time Saved on Silences</div>
        </div>

        <!-- Stat 2 -->
        <div class="stat-tile" id="sg-s2">
          <div class="num-row">
            <span class="stat-num" id="sg-n2" data-slot="s2_val">0</span>
            <span class="stat-suffix" data-slot="s2_suffix">x</span>
          </div>
          <div class="stat-rule"></div>
          <div class="stat-label" data-slot="s2_label">Faster than Manual Edit</div>
        </div>

        <!-- Stat 3 -->
        <div class="stat-tile" id="sg-s3">
          <div class="num-row">
            <span class="stat-num" id="sg-n3" data-slot="s3_val">0</span>
            <span class="stat-suffix" data-slot="s3_suffix">K</span>
          </div>
          <div class="stat-rule"></div>
          <div class="stat-label" data-slot="s3_label">Words Processed / Min</div>
        </div>

        <!-- Stat 4 -->
        <div class="stat-tile" id="sg-s4">
          <div class="num-row">
            <span class="stat-num" id="sg-n4" data-slot="s4_val">0</span>
            <span class="stat-suffix" data-slot="s4_suffix">s</span>
          </div>
          <div class="stat-rule"></div>
          <div class="stat-label" data-slot="s4_label">Avg. Render Time</div>
        </div>

      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-statgrid .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "98px 72px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-statgrid .bloom",   { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-statgrid .grid-bg", { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title first */
        .from("#t1-ov-statgrid .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.52)

        /* tiles spring in — 0.15s stagger */
        .from("#sg-s1", { autoAlpha: 0, y: 48, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.0)
        .from("#sg-s2", { autoAlpha: 0, y: 48, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.15)
        .from("#sg-s3", { autoAlpha: 0, y: 48, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.30)
        .from("#sg-s4", { autoAlpha: 0, y: 48, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.85, ease: "back.out(1.4)" }, 1.45);

      /* COUNT-UP: 3-arg tl.to({val:0}, {opts}, position) — NEVER 3-arg fromTo */
      const n1obj = { val: 0 };
      tl.to(n1obj, { val: 73, duration: 1.1, ease: "power2.out",
        onUpdate: function() { document.getElementById("sg-n1").textContent = Math.round(n1obj.val); }
      }, 1.75);

      const n2obj = { val: 0 };
      tl.to(n2obj, { val: 8, duration: 1.1, ease: "power2.out",
        onUpdate: function() { document.getElementById("sg-n2").textContent = Math.round(n2obj.val); }
      }, 1.90);

      const n3obj = { val: 0 };
      tl.to(n3obj, { val: 12, duration: 1.1, ease: "power2.out",
        onUpdate: function() { document.getElementById("sg-n3").textContent = Math.round(n3obj.val); }
      }, 2.05);

      const n4obj = { val: 0 };
      tl.to(n4obj, { val: 45, duration: 1.1, ease: "power2.out",
        onUpdate: function() { document.getElementById("sg-n4").textContent = Math.round(n4obj.val); }
      }, 2.20);

      tl
        /* accent rule glow pulses after numbers land — finite */
        .to("#t1-ov-statgrid .stat-rule", {
          boxShadow: "0 0 16px rgba(55,189,248,0.85)", width: "54px",
          duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.12
        }, 3.1)

        /* slow upward drift */
        .to("#t1-ov-statgrid .stat-grid", { y: -10, duration: 5.0, ease: "sine.inOut" }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t1-ov-statgrid"] = tl;
    </script>
  </body>
</html>
