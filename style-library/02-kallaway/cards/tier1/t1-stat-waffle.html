<!doctype html>
<!--
  KALLAWAY · tier1 · stat · WAFFLE
  A 10×10 waffle grid of cells; cells glow on sequentially to represent a
  percentage. Percentage counts up above the grid. Dense, visual, satisfying.
  Knob: data-pct on #t1-stat-waffle-root (default 64).
  Slots: kicker (~28 chars uppercase), stat (big %, e.g. "64%"), label (~70 chars, <em> on one phrase), source (~40 chars uppercase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-waffle {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-waffle .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-waffle .grid-bg {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Main layout: centered column */
      #t1-stat-waffle .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 40px; padding-bottom: 20px;
      }

      #t1-stat-waffle .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Waffle grid wrapper */
      #t1-stat-waffle .waffle-wrap {
        position: relative;
        display: flex; align-items: center; gap: 80px;
      }

      /* The 10x10 grid */
      #t1-stat-waffle .waffle-grid {
        display: grid;
        grid-template-columns: repeat(10, 56px);
        grid-template-rows:    repeat(10, 56px);
        gap: 8px;
      }

      #t1-stat-waffle .cell {
        width: 56px; height: 56px;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        border: 1.5px solid rgba(255,255,255,0.06);
        transition: none; /* GSAP drives this */
      }

      #t1-stat-waffle .cell.on {
        background: rgba(var(--accent-rgb), 0.75);
        border-color: rgba(var(--accent-rgb), 0.5);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.50), 0 0 6px rgba(255,255,255,0.30);
      }

      /* Glow halo behind the waffle */
      #t1-stat-waffle .waffle-glow {
        position: absolute; left: -60px; top: -60px; right: -60px; bottom: -60px;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.14) 0%, transparent 65%);
        pointer-events: none;
      }

      /* Big percentage right of grid */
      #t1-stat-waffle .stat-block {
        display: flex; flex-direction: column; gap: 0; align-items: flex-start;
      }
      #t1-stat-waffle .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 190px;
        line-height: 0.88;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 15%, rgba(var(--accent-rgb), 0.80) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-waffle .stat-unit {
        font-family: var(--font-mono);
        font-size: 36px;
        letter-spacing: 0.12em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-top: 8px;
      }

      #t1-stat-waffle .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 1000px;
        line-height: 1.45;
      }
      #t1-stat-waffle .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-waffle .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-waffle .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-waffle .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-waffle" data-composition-id="t1-stat-waffle"
         data-start="0" data-width="1920" data-height="1080" data-pct="64">

      <div class="bloom"></div>
      <div class="grid-bg"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">COURSE PASS RATE · COHORT 12</div>

        <div class="waffle-wrap">
          <div style="position:relative;">
            <div class="waffle-glow"></div>
            <div class="waffle-grid" id="t1-stat-waffle-grid">
              <!-- 100 cells injected by JS -->
            </div>
          </div>

          <div class="stat-block">
            <div class="stat" id="t1-stat-waffle-num" data-slot="stat">64%</div>
            <div class="stat-unit">PASS RATE</div>
          </div>
        </div>

        <div class="label" data-slot="label">of enrolled students pass with distinction — <em>highest rate ever recorded</em> on this platform</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS COHORT ANALYTICS 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const rootEl  = document.getElementById("t1-stat-waffle");
      const gridEl  = document.getElementById("t1-stat-waffle-grid");
      const numEl   = document.getElementById("t1-stat-waffle-num");
      const pct     = parseFloat(rootEl.getAttribute("data-pct")) || 64;
      const onCount = Math.round(pct); /* cells to light up out of 100 */

      /* Build 100 cells */
      for (let i = 0; i < 100; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.id = "t1-stat-waffle-cell-" + i;
        gridEl.appendChild(cell);
      }

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-waffle .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-waffle .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-waffle .grid-bg",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-waffle .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.5)

        /* waffle wrap slides in */
        .from("#t1-stat-waffle .waffle-wrap",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 50%", duration: 1.0, ease: "back.out(1.4)" }, 0.65)

        /* stat block */
        .from("#t1-stat-waffle .stat-block",
          { autoAlpha: 0, x: 30, duration: 0.8, ease: "power3.out" }, 0.80)

        /* cells light up + count-up */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v   = this.targets()[0].val;
            const lit = Math.round(v);
            /* light up cells left-to-right, top-to-bottom */
            for (let i = 0; i < 100; i++) {
              const el = document.getElementById("t1-stat-waffle-cell-" + i);
              if (el) { el.className = i < lit ? "cell on" : "cell"; }
            }
            numEl.textContent = Math.round(v) + "%";
          }
        }, 1.05)

        /* label */
        .from("#t1-stat-waffle .label",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.2)

        /* source */
        .from("#t1-stat-waffle .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.5)

        /* breathing glow */
        .to("#t1-stat-waffle .waffle-glow",
          { opacity: 0.55, scale: 1.06, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.1)

        .set({}, {}, 7);

      window.__timelines["t1-stat-waffle"] = tl;
    </script>
  </body>
</html>
