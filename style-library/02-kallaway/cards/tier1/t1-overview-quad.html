<!doctype html>
<!--
  KALLAWAY · tier1 · overview · QUAD
  Full-screen takeover. Four glass category tiles in a 2x2 grid, each with an
  icon placeholder and a short label. The fourth tile is styled as a "?" unknown
  with a glowing question mark — perfect for a teaser/reveal beat.
  Tiles build in staggered (top-left → top-right → bottom-left → bottom-right).
  Slots: title, c1, c2, c3, c4.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-quad {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-quad .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-quad .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 55%, #000 30%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 55%, #000 30%, transparent 80%);
      }

      /* Title */
      #t1-ov-quad .title-row {
        position: absolute; left: 0; right: 0; top: 88px; text-align: center; z-index: 4;
      }
      #t1-ov-quad .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-quad .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* 2x2 grid */
      #t1-ov-quad .grid-wrap {
        position: absolute; left: 240px; right: 240px; top: 248px; bottom: 88px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 36px; z-index: 4;
      }

      /* Glass tile */
      #t1-ov-quad .tile {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 28px; position: relative; overflow: hidden;
      }
      /* Top hairline highlight */
      #t1-ov-quad .tile::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }

      /* Icon area */
      #t1-ov-quad .tile-icon {
        width: 96px; height: 96px;
        border-radius: var(--radius-sm);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.48);
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.22);
        background: rgba(var(--accent-rgb), 0.06);
        display: flex; align-items: center; justify-content: center;
      }
      #t1-ov-quad .tile-icon svg {
        width: 48px; height: 48px; stroke: var(--accent); fill: none; stroke-width: 1.8;
        filter: drop-shadow(0 0 7px rgba(var(--accent-rgb), 0.55));
      }

      /* Label */
      #t1-ov-quad .tile-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 38px; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; padding: 0 24px;
      }

      /* Fourth tile — "unknown" / mystery */
      #t1-ov-quad .tile.unknown {
        border-color: rgba(var(--accent-rgb), 0.28);
        box-shadow: var(--glass-shadow), 0 0 50px rgba(var(--accent-rgb), 0.12);
      }
      #t1-ov-quad .tile.unknown .tile-icon {
        border-color: rgba(var(--accent-rgb), 0.70);
        box-shadow: 0 0 28px rgba(var(--accent-rgb), 0.40);
        background: rgba(var(--accent-rgb), 0.10);
      }
      #t1-ov-quad .tile.unknown .tile-label {
        color: var(--text-dim); font-style: italic;
      }
      /* Large glowing ? */
      #t1-ov-quad .q-mark {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 52px; color: var(--accent);
        text-shadow: var(--textglow-accent);
        line-height: 1;
      }

      #t1-ov-quad .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-quad .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-quad" data-composition-id="t1-ov-quad" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">The <em>Four Pillars</em> You Need</div>
      </div>

      <div class="grid-wrap">
        <!-- Tile 1 -->
        <div class="tile" id="quad-c1">
          <div class="tile-icon">
            <svg viewBox="0 0 48 48">
              <rect x="8" y="8" width="32" height="32" rx="4"/>
              <line x1="16" y1="18" x2="32" y2="18"/>
              <line x1="16" y1="24" x2="28" y2="24"/>
              <line x1="16" y1="30" x2="24" y2="30"/>
            </svg>
          </div>
          <div class="tile-label" data-slot="c1">Strategy</div>
        </div>

        <!-- Tile 2 -->
        <div class="tile" id="quad-c2">
          <div class="tile-icon">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="14"/>
              <polyline points="17,24 22,29 31,20"/>
            </svg>
          </div>
          <div class="tile-label" data-slot="c2">Execution</div>
        </div>

        <!-- Tile 3 -->
        <div class="tile" id="quad-c3">
          <div class="tile-icon">
            <svg viewBox="0 0 48 48">
              <polyline points="10,36 20,20 28,28 36,12"/>
              <circle cx="10" cy="36" r="2.5" fill="currentColor" stroke="none" style="color:var(--accent)"/>
              <circle cx="36" cy="12" r="2.5" fill="currentColor" stroke="none" style="color:var(--accent)"/>
            </svg>
          </div>
          <div class="tile-label" data-slot="c3">Measurement</div>
        </div>

        <!-- Tile 4 — unknown -->
        <div class="tile unknown" id="quad-c4">
          <div class="tile-icon">
            <div class="q-mark">?</div>
          </div>
          <div class="tile-label" data-slot="c4">Coming Next…</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-quad .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "90px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-quad .bloom", { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-quad .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title first */
        .from("#t1-ov-quad .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* tiles stagger in — top-left → top-right → bottom-left → bottom-right */
        .from("#quad-c1", { autoAlpha: 0, y: 44, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.85, ease: "back.out(1.4)" }, 1.05)
        .from("#quad-c2", { autoAlpha: 0, y: 44, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.85, ease: "back.out(1.4)" }, 1.20)
        .from("#quad-c3", { autoAlpha: 0, y: 44, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.85, ease: "back.out(1.4)" }, 1.35)
        .from("#quad-c4", { autoAlpha: 0, y: 44, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(10px)", duration: 0.85, ease: "back.out(1.4)" }, 1.50)

        /* unknown tile — glow pulse */
        .to("#quad-c4", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 80px rgba(55,189,248,0.28)",
          duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.5)

        /* slow hold drift */
        .to("#t1-ov-quad .grid-wrap", { y: -10, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-quad"] = tl;
    </script>
  </body>
</html>
