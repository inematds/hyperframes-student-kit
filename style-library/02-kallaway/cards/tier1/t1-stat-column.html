<!doctype html>
<!--
  KALLAWAY · tier1 · stat · COLUMN
  Vertical column chart — 5 glowing bars rising (scaleY) staggered; one column
  accent-highlighted in blue, the others in dimmer glass. Horizontal axis line.
  Knobs: data-h (0..1) on each .col-fill element.
  Slots: kicker (~28 chars uppercase), label (~70 chars, <em>),
         source (~40 chars), c1_l .. c5_l (column axis labels ~12 chars each).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-st-col {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-st-col .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-st-col .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content block */
      #t1-st-col .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 0;
      }

      /* Kicker */
      #t1-st-col .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 56px;
      }

      /* Chart area */
      #t1-st-col .chart-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        width: 1100px;
      }

      /* Columns row */
      #t1-st-col .columns {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 48px;
        height: 440px;
        width: 100%;
        position: relative;
      }

      /* Faint horizontal grid lines */
      #t1-st-col .h-lines {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
      }
      #t1-st-col .h-line {
        width: 100%;
        height: 1px;
        background: rgba(255,255,255,0.06);
      }

      /* Single column */
      #t1-st-col .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        flex: 1;
        position: relative;
      }

      /* Column fill bar — grows upward via scaleY from bottom */
      #t1-st-col .col-fill {
        width: 100%;
        border-radius: 8px 8px 4px 4px;
        transform-origin: bottom center;
        transform: scaleY(0);
        position: relative;
      }

      /* Default column: blue glass */
      #t1-st-col .col-fill {
        background: linear-gradient(180deg,
          rgba(var(--accent-rgb), 0.85) 0%,
          rgba(var(--accent-rgb), 0.35) 100%);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.38), 0 0 36px rgba(var(--accent-rgb), 0.18);
      }

      /* Accent column (column 3 by default — the highlighted one) */
      #t1-st-col .col.is-accent .col-fill {
        background: linear-gradient(180deg, #ffffff 0%, var(--accent) 60%, rgba(var(--accent-rgb),0.40) 100%);
        box-shadow: 0 0 28px rgba(var(--accent-rgb), 0.70), 0 0 70px rgba(var(--accent-rgb), 0.38);
      }

      /* Glow cap on top of each bar */
      #t1-st-col .col-cap {
        position: absolute;
        top: 0; left: 50%; transform: translate(-50%, -6px);
        width: 20px; height: 20px; border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.9);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.9), 0 0 30px rgba(var(--accent-rgb), 0.55);
      }
      #t1-st-col .col.is-accent .col-cap {
        background: #ffffff;
        box-shadow: 0 0 16px rgba(255,255,255,0.9), 0 0 40px rgba(var(--accent-rgb), 0.70);
      }

      /* Value above bar */
      #t1-st-col .col-val {
        position: absolute;
        bottom: calc(100% + 14px);
        width: 100%; text-align: center;
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }
      #t1-st-col .col.is-accent .col-val {
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Axis baseline */
      #t1-st-col .axis-line {
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.14);
        border-radius: 1px;
        margin-top: 0;
      }

      /* Axis labels below baseline */
      #t1-st-col .axis-labels {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 48px;
        width: 1100px;
        margin-top: 16px;
      }
      #t1-st-col .col-label {
        flex: 1;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 20px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        line-height: 1.3;
      }
      #t1-st-col .col.is-accent + .col-label,
      #t1-st-col .axis-labels .accent-lbl {
        color: var(--accent);
      }

      /* Supporting label */
      #t1-st-col .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
        margin-top: 48px;
      }
      #t1-st-col .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* Source */
      #t1-st-col .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-st-col .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-st-col .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-st-col" data-composition-id="t1-st-col" data-start="0"
         data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">WEEKLY ACTIVE LEARNERS</div>

        <div class="chart-wrap">
          <!-- Columns -->
          <div class="columns">
            <!-- Faint guide lines at 25/50/75/100% heights -->
            <div class="h-lines">
              <div class="h-line"></div>
              <div class="h-line"></div>
              <div class="h-line"></div>
              <div class="h-line"></div>
              <div class="h-line"></div>
            </div>

            <!-- col 1 -->
            <div class="col">
              <div class="col-val" id="t1-st-col-v1">0%</div>
              <div class="col-fill" id="t1-st-col-f1" data-h="0.52" style="height:440px;">
                <div class="col-cap"></div>
              </div>
            </div>

            <!-- col 2 -->
            <div class="col">
              <div class="col-val" id="t1-st-col-v2">0%</div>
              <div class="col-fill" id="t1-st-col-f2" data-h="0.67" style="height:440px;">
                <div class="col-cap"></div>
              </div>
            </div>

            <!-- col 3 — accent highlighted -->
            <div class="col is-accent">
              <div class="col-val" id="t1-st-col-v3">0%</div>
              <div class="col-fill" id="t1-st-col-f3" data-h="0.91" style="height:440px;">
                <div class="col-cap"></div>
              </div>
            </div>

            <!-- col 4 -->
            <div class="col">
              <div class="col-val" id="t1-st-col-v4">0%</div>
              <div class="col-fill" id="t1-st-col-f4" data-h="0.78" style="height:440px;">
                <div class="col-cap"></div>
              </div>
            </div>

            <!-- col 5 -->
            <div class="col">
              <div class="col-val" id="t1-st-col-v5">0%</div>
              <div class="col-fill" id="t1-st-col-f5" data-h="0.60" style="height:440px;">
                <div class="col-cap"></div>
              </div>
            </div>
          </div>

          <!-- Axis baseline -->
          <div class="axis-line"></div>

          <!-- Axis labels -->
          <div class="axis-labels">
            <div class="col-label" data-slot="c1_l">Mon</div>
            <div class="col-label" data-slot="c2_l">Tue</div>
            <div class="col-label accent-lbl" data-slot="c3_l">Wed</div>
            <div class="col-label" data-slot="c4_l">Thu</div>
            <div class="col-label" data-slot="c5_l">Fri</div>
          </div>
        </div>

        <div class="label" data-slot="label">mid-week <em>peak engagement</em> — Wednesday drives 91% of weekly completions</div>
      </div>

      <div class="source" data-slot="source">SOURCE · PLATFORM ANALYTICS 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const cols = [
        { fill: document.getElementById("t1-st-col-f1"), val: document.getElementById("t1-st-col-v1") },
        { fill: document.getElementById("t1-st-col-f2"), val: document.getElementById("t1-st-col-v2") },
        { fill: document.getElementById("t1-st-col-f3"), val: document.getElementById("t1-st-col-v3") },
        { fill: document.getElementById("t1-st-col-f4"), val: document.getElementById("t1-st-col-v4") },
        { fill: document.getElementById("t1-st-col-f5"), val: document.getElementById("t1-st-col-v5") },
      ];
      const heights = cols.map(c => parseFloat(c.fill.getAttribute("data-h")) || 0.5);

      /* Grain flicker */
      tl.fromTo("#t1-st-col .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Bloom + grid */
      tl.from("#t1-st-col .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-st-col .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* Kicker */
        .from("#t1-st-col .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.45)

        /* Axis line draws in */
        .from("#t1-st-col .axis-line",
          { scaleX: 0, transformOrigin: "left center", duration: 0.7, ease: "power2.out" }, 0.70)

        /* Guide lines fade in */
        .from("#t1-st-col .h-line",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out", stagger: 0.06 }, 0.75)

        /* Axis labels */
        .from("#t1-st-col .col-label",
          { autoAlpha: 0, y: 10, duration: 0.5, ease: "power2.out", stagger: 0.10 }, 0.90);

      /* Columns rise + count-up — staggered */
      heights.forEach(function(h, i) {
        const startPos = 1.0 + i * 0.12;
        const c = cols[i];

        tl.to(c.fill, {
          scaleY: h,
          transformOrigin: "bottom center",
          duration: 1.2, ease: "power4.out"
        }, startPos);

        tl.to({ val: 0 }, {
          val: h * 100,
          duration: 1.2, ease: "power4.out",
          onUpdate: function() {
            c.val.textContent = Math.round(this.targets()[0].val) + "%";
          }
        }, startPos);
      });

      tl
        /* Label */
        .from("#t1-st-col .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.20)

        /* Source */
        .from("#t1-st-col .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.50)

        /* Breathing glow pulse on accent column */
        .to("#t1-st-col .col.is-accent .col-fill",
          { opacity: 0.72, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.80)

        .set({}, {}, 7);

      window.__timelines["t1-st-col"] = tl;
    </script>
  </body>
</html>
