<!doctype html>
<!--
  KALLAWAY · tier1 · section · CURTAIN
  Full-screen chapter takeover. Two frosted glass curtain panels start
  covering the center; they glide left and right like stage curtains parting
  to reveal the glowing title behind them. A subtle blue bloom fills the
  center gap as the curtains part.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-curtain {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-curtain .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-curtain .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content behind the curtains */
      #t1-sec-curtain .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        z-index: 2; gap: 20px;
      }
      #t1-sec-curtain .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); margin-bottom: 18px;
      }
      #t1-sec-curtain .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1280px; text-align: center; padding: 0 80px;
      }
      #t1-sec-curtain .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Center bloom that appears as curtains part */
      #t1-sec-curtain .reveal-glow {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 800px; height: 600px;
        background: radial-gradient(ellipse, rgba(var(--accent-rgb), 0.20) 0%, transparent 65%);
        filter: blur(40px);
        z-index: 2;
        opacity: 0;
      }

      /* Curtain panels — glass */
      #t1-sec-curtain .curtain-left,
      #t1-sec-curtain .curtain-right {
        position: absolute; top: 0; bottom: 0;
        width: 1000px; /* slightly over half so they fully cover center at start */
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        z-index: 4;
      }
      #t1-sec-curtain .curtain-left {
        right: calc(50% - 10px); /* slightly past center */
        border-right: 1.5px solid var(--glass-border);
        /* Inner highlight on the right edge */
        box-shadow: inset -1px 0 0 var(--glass-hi),
                    4px 0 40px rgba(var(--accent-rgb), 0.12);
      }
      #t1-sec-curtain .curtain-right {
        left: calc(50% - 10px);
        border-left: 1.5px solid var(--glass-border);
        box-shadow: inset 1px 0 0 var(--glass-hi),
                    -4px 0 40px rgba(var(--accent-rgb), 0.12);
      }

      /* Vertical center gap glow line */
      #t1-sec-curtain .gap-glow {
        position: absolute; left: 50%; top: 0; bottom: 0;
        width: 2px; transform: translateX(-50%);
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.7) 30%,
          rgba(var(--accent-rgb), 0.9) 50%,
          rgba(var(--accent-rgb), 0.7) 70%,
          transparent 100%);
        box-shadow: 0 0 18px 4px rgba(var(--accent-rgb), 0.45);
        z-index: 5;
        opacity: 0;
      }

      #t1-sec-curtain .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-curtain .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-curtain" data-composition-id="t1-sec-curtain" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="reveal-glow" id="t1-sec-curtain-rglow"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Chapter 5 —</div>
        <div class="headline" data-slot="headline">What You've Been<br>Missing About <em>Prompt Design</em></div>
      </div>

      <div class="curtain-left" id="t1-sec-curtain-cl"></div>
      <div class="curtain-right" id="t1-sec-curtain-cr"></div>
      <div class="gap-glow" id="t1-sec-curtain-gap"></div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-curtain .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-curtain .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-curtain .grid",
          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* curtains start visible — they fade in very briefly then part */
        .from("#t1-sec-curtain-cl, #t1-sec-curtain-cr",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0.3)

        /* gap glow appears as seam */
        .to("#t1-sec-curtain-gap",
          { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.7)

        /* brief hold, then curtains part */
        /* left curtain slides left, right curtain slides right */
        .to("#t1-sec-curtain-cl",
          { x: -940, duration: 1.4, ease: "power4.inOut" }, 1.1)
        .to("#t1-sec-curtain-cr",
          { x: 940, duration: 1.4, ease: "power4.inOut" }, 1.1)

        /* gap glow fades as curtains leave */
        .to("#t1-sec-curtain-gap",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.5)

        /* reveal glow blooms in center as curtains part */
        .to("#t1-sec-curtain-rglow",
          { autoAlpha: 1, duration: 0.8, ease: "power2.out" }, 1.3)

        /* kicker reveals from blur */
        .from("#t1-sec-curtain .kicker",
          { autoAlpha: 0, scale: 0.92, duration: 0.65, ease: "back.out(1.4)" }, 1.55)

        /* headline sweeps in from blur */
        .from("#t1-sec-curtain .headline",
          { autoAlpha: 0, y: 22, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.75)

        /* breathing glow on reveal */
        .to("#t1-sec-curtain-rglow",
          { opacity: 0.45, scale: 1.12, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)

        .set({}, {}, 7);

      window.__timelines["t1-sec-curtain"] = tl;
    </script>
  </body>
</html>
