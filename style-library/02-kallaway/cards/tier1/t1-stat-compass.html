<!doctype html>
<!--
  KALLAWAY · tier1 · stat · COMPASSTAT
  A compass-style glowing dial ring with a sharp pointer needle that swings from
  the left (0%) to the knob value position on the arc. Tick marks ring the dial;
  the stat count-up plays as the needle swings. The pointer tip glows bright blue.
  Knob: data-pct on #t1-stat-compass-svg (default 73).
  Slots: kicker (~28 chars), stat (e.g. "73%"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-compass {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-compass .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-compass .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── layout ── */
      #t1-stat-compass .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 44px;
        padding-bottom: 20px;
      }

      #t1-stat-compass .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* dial SVG */
      #t1-stat-compass .dial-wrap {
        position: relative; width: 540px; height: 540px;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }

      #t1-stat-compass .dial-svg {
        width: 540px; height: 540px;
        position: relative; z-index: 2;
      }

      /* halo glow behind the dial */
      #t1-stat-compass .dial-glow {
        position: absolute; inset: -60px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb),0.16) 0%, transparent 65%);
        box-shadow: 0 0 120px 30px rgba(var(--accent-rgb),0.14);
      }

      /* center stat */
      #t1-stat-compass .stat-center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
        /* offset slightly upward to sit inside the arc */
        padding-top: 30px;
      }
      #t1-stat-compass .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 116px; line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb),0.82) 72%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.55));
      }

      #t1-stat-compass .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 900px; line-height: 1.45;
      }
      #t1-stat-compass .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-compass .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-compass .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-compass .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-compass" data-composition-id="t1-stat-compass" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">CURRICULUM READINESS · SPRING 2026</div>

        <div class="dial-wrap">
          <div class="dial-glow" id="t1-stat-compass-glow"></div>

          <svg class="dial-svg" id="t1-stat-compass-svg" data-pct="73"
               viewBox="0 0 540 540" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="cp-glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="5" result="b"/>
                <feComposite in="SourceGraphic" in2="b" operator="over"/>
              </filter>
              <filter id="cp-needle-glow" x="-60%" y="-30%" width="220%" height="160%">
                <feGaussianBlur stdDeviation="4" result="b"/>
                <feComposite in="SourceGraphic" in2="b" operator="over"/>
              </filter>
              <linearGradient id="cp-arc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(55,189,248,0.20)"/>
                <stop offset="100%" stop-color="#37BDF8"/>
              </linearGradient>
            </defs>

            <!-- outer track ring (full semicircle, 0 to 180°) -->
            <!-- arc from 180° (left) to 0° (right) = bottom half omitted, top half shown -->
            <!-- Using stroke-dasharray on a full circle: semicircle = half circumference -->
            <!-- r=228, circ=2πr≈1432, half=716 -->
            <circle cx="270" cy="270" r="228"
                    stroke="rgba(255,255,255,0.07)" stroke-width="18"
                    stroke-dasharray="716 716"
                    transform="rotate(180 270 270)"
                    stroke-linecap="round"/>

            <!-- glowing arc fill — animated dashoffset -->
            <circle id="cp-arc" cx="270" cy="270" r="228"
                    stroke="url(#cp-arc-grad)" stroke-width="18"
                    stroke-dasharray="0 1432"
                    transform="rotate(180 270 270)"
                    stroke-linecap="round"
                    filter="url(#cp-glow)"/>

            <!-- tick marks — 11 ticks spaced across 180° (0%,10%,...,100%) -->
            <!-- pre-computed at angles 0°=left(180°) to 180°=right(0°) in SVG coordinates -->
            <!-- tick group rotated around center 270,270 -->
            <!-- ticks at -90° (top), each 18° apart spanning 180° -->
            <g id="cp-ticks" opacity="0.35">
              <!-- 0deg=left=270 angle in our dial: SVG angle=180deg -->
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(180 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(162 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(144 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(126 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(108 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(90 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(72 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(54 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(36 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(18 270 270)"/>
              <line x1="270" y1="42" x2="270" y2="62" stroke="rgba(55,189,248,0.6)" stroke-width="1.5"
                    transform="rotate(0 270 270)"/>
            </g>

            <!-- endpoint dots -->
            <circle cx="42" cy="270" r="7" fill="rgba(55,189,248,0.45)" filter="url(#cp-glow)"/>
            <circle cx="498" cy="270" r="7" fill="rgba(55,189,248,0.45)" filter="url(#cp-glow)"/>
            <text x="30" y="310" fill="rgba(240,238,233,0.40)"
                  font-size="22" font-family="Space Mono, monospace">0</text>
            <text x="486" y="310" fill="rgba(240,238,233,0.40)"
                  font-size="22" font-family="Space Mono, monospace">100</text>

            <!-- needle group — rotates around pivot at 270,270 -->
            <!-- starts at 180° (left side) = rotation -90°; target 73% = 0.73×180=131.4° → rotation=131.4-90=41.4° -->
            <g id="cp-needle" transform="rotate(-90 270 270)">
              <!-- needle shaft -->
              <line x1="270" y1="270" x2="270" y2="80"
                    stroke="rgba(255,255,255,0.85)" stroke-width="2.5"
                    stroke-linecap="round" filter="url(#cp-needle-glow)"/>
              <!-- tip glow dot -->
              <circle cx="270" cy="80" r="10" fill="#ffffff"
                      style="filter: drop-shadow(0 0 10px rgba(55,189,248,0.95)) drop-shadow(0 0 26px rgba(55,189,248,0.5));"/>
              <!-- pivot hub -->
              <circle cx="270" cy="270" r="14" fill="rgba(55,189,248,0.30)"
                      stroke="rgba(55,189,248,0.70)" stroke-width="2" filter="url(#cp-glow)"/>
            </g>
          </svg>

          <div class="stat-center">
            <div class="stat" id="t1-stat-compass-num" data-slot="stat">73%</div>
          </div>
        </div>

        <div class="label" data-slot="label">instructors rated as <em>curriculum-ready</em> after completing the AIS certification track</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS INSTRUCTOR SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const svgEl   = document.getElementById("t1-stat-compass-svg");
      const arcEl   = document.getElementById("cp-arc");
      const needleG = document.getElementById("cp-needle");
      const numEl   = document.getElementById("t1-stat-compass-num");
      const pct     = parseFloat(svgEl.getAttribute("data-pct")) || 73;

      /* arc: semicircle circ = π × r = π × 228 ≈ 716 */
      const arcLen  = Math.PI * 228;
      /* needle rotates from -90° (left) to (-90 + pct/100×180)° */
      const startRot = -90;
      const endRot   = -90 + (pct / 100) * 180;

      /* init */
      arcEl.setAttribute("stroke-dasharray", "0 " + (arcLen * 2));

      /* grain flicker */
      tl.fromTo("#t1-stat-compass .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-compass .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-compass .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-compass .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.40)

        /* dial blooms in */
        .from("#t1-stat-compass-glow",
          { autoAlpha: 0, scale: 0.5, duration: 1.1, ease: "expo.out" }, 0.50)
        .from("#t1-stat-compass .dial-svg",
          { autoAlpha: 0, scale: 0.80, transformOrigin: "50% 50%",
            duration: 0.85, ease: "back.out(1.4)" }, 0.55)
        .from("#cp-ticks", { opacity: 0, duration: 0.5, ease: "power2.out" }, 0.90)

        /* count-up + needle swing + arc fill */
        .to({ val: 0 }, {
          val: pct, duration: 1.8, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            /* needle rotation */
            const rot = -90 + (v / 100) * 180;
            needleG.setAttribute("transform", "rotate(" + rot + " 270 270)");
            /* arc fill: dasharray = (v/100)*arcLen, gap = rest */
            const filled = (v / 100) * arcLen;
            arcEl.setAttribute("stroke-dasharray", filled + " " + (arcLen * 2 - filled));
            /* number */
            numEl.textContent = Math.round(v) + "%";
          }
        }, 1.00)

        /* stat blur-in */
        .from("#t1-stat-compass .stat",
          { autoAlpha: 0, duration: 0.75, ease: "power3.out" }, 1.05)

        /* label */
        .from("#t1-stat-compass .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.05)

        /* source */
        .from("#t1-stat-compass .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.40)

        /* dial glow breathing */
        .to("#t1-stat-compass-glow",
          { opacity: 0.50, scale: 1.10,
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-compass"] = tl;
    </script>
  </body>
</html>
