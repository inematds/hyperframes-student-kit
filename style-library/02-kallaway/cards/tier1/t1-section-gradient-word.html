<!doctype html>
<!--
  KALLAWAY · tier1 · section · GRADIENT WORD
  Full-screen chapter takeover. ONE giant hero word (the <em> phrase from headline)
  rendered as a white→blue gradient fill with a layered glow — the typographic
  eye-magnet. The remainder of the headline sits below it, smaller and secondary.
  Kicker is a small upper-left editorial context line.
  Slots: kicker (~16 chars), headline (~52 chars, <em> wraps the HERO WORD/PHRASE).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-grad {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-grad .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-grad .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Kicker — upper left, editorial */
      #t1-sec-grad .kicker-wrap {
        position: absolute; left: var(--pad); top: var(--pad); z-index: 4;
      }
      #t1-sec-grad .kicker {
        font-family: var(--font-body); font-style: italic; font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
      }

      /* Main content — left-aligned, vertically centred-low */
      #t1-sec-grad .content {
        position: absolute; left: var(--pad); right: var(--pad);
        top: 50%; transform: translateY(-50%);
        z-index: 4;
      }

      /* HERO WORD — massive gradient text */
      #t1-sec-grad .hero-word {
        display: block;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 0.94; letter-spacing: -0.04em;
        /* White core at top-left → accent blue at bottom-right */
        background: linear-gradient(
          125deg,
          #FFFFFF 0%,
          rgba(255,255,255,0.90) 18%,
          var(--accent) 52%,
          rgba(var(--accent-rgb), 0.70) 80%,
          rgba(var(--accent-rgb), 0.40) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Glow: soft white halo + blue bloom behind */
        filter:
          drop-shadow(0 0 30px rgba(255,255,255,0.30))
          drop-shadow(0 0 80px rgba(var(--accent-rgb), 0.50))
          drop-shadow(0 0 180px rgba(var(--accent-rgb), 0.25));
        margin-bottom: 28px;
      }

      /* Supporting text — the rest of the headline, secondary role */
      #t1-sec-grad .support-text {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: var(--size-headline); line-height: 1.10; letter-spacing: var(--track-tight);
        color: var(--text-dim);
        max-width: 1200px;
      }
      /* em inside support-text: revert the gradient trick so it can get white glow */
      #t1-sec-grad .support-text em {
        font-style: normal; color: var(--white);
        text-shadow: var(--textglow);
      }

      /* Soft glow bloom behind the hero word */
      #t1-sec-grad .word-bloom {
        position: absolute; left: calc(var(--pad) - 60px); top: 50%;
        transform: translateY(-50%);
        width: 900px; height: 500px;
        background: radial-gradient(ellipse at 30% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(255,255,255,0.06) 35%,
          transparent 65%);
        filter: blur(50px);
        z-index: 3; pointer-events: none;
      }

      /* Vignette + grain */
      #t1-sec-grad .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-grad .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-grad" data-composition-id="t1-sec-grad" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="word-bloom"></div>

      <div class="kicker-wrap">
        <div class="kicker" data-slot="kicker">Personal Brand</div>
      </div>

      <div class="content">
        <!--
          The headline slot uses a two-part structure:
          <em> wraps the HERO WORD (shown giant) — e.g. <em>AUTHORITY</em>
          everything else becomes the supporting sub-line.
          Slot injector should target the whole .headline data-slot
          and the card's JS splits em vs. plain text automatically.
          For the default preview, we hardcode the split:
        -->
        <span class="hero-word" data-slot="headline"><em>AUTHORITY</em></span>
        <div class="support-text" data-slot="headline">on social media — <em>without a big following</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-grad .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "115px 85px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-grad .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-grad .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* word bloom radiates out */
        .from("#t1-sec-grad .word-bloom",
          { autoAlpha: 0, scale: 0.7, duration: 1.4, ease: "power4.out" }, 0.1)

        /* kicker drops in */
        .from("#t1-sec-grad .kicker-wrap",
          { autoAlpha: 0, x: -20, filter: "blur(6px)", duration: 0.7, ease: "power3.out" }, 0.4)

        /* hero word: scale down from oversized + focus pull — the main event */
        .from("#t1-sec-grad .hero-word",
          { autoAlpha: 0, scale: 1.10, transformOrigin: "0% 50%",
            filter: "blur(24px)", duration: 1.3, ease: "power4.out" }, 0.55)

        /* support text drifts up */
        .from("#t1-sec-grad .support-text",
          { autoAlpha: 0, y: 30, filter: "blur(12px)", duration: 0.9, ease: "power3.out" }, 1.3)

        /* word bloom breathes */
        .to("#t1-sec-grad .word-bloom",
          { opacity: 0.6, scale: 1.10, duration: 1.8, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        /* hero word very slow scale drift */
        .to("#t1-sec-grad .hero-word",
          { scale: 1.015, transformOrigin: "0% 50%", duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-sec-grad"] = tl;
    </script>
  </body>
</html>
