<!doctype html>
<!--
  KALLAWAY · tier1 · stat · DOTGRID
  Isotype dot grid: ~100 small dots arranged in a 10×10 grid; dots up to
  data-pct light up in accent blue, the rest stay dim. A large percentage
  beside the grid counts up. Aurora bloom, glass surface, breathing glow.
  Knob: data-pct on #t1-st-dotg-grid (default 73).
  Slots: kicker (~28 chars), stat (e.g. "73%"), label (~70 chars, <em>),
         source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-st-dotg {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-st-dotg .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-st-dotg .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Center layout: dot grid left | big number right */
      #t1-st-dotg .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 0; padding-bottom: 30px;
      }

      #t1-st-dotg .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 48px;
      }

      /* Two-column row: isotype grid + number */
      #t1-st-dotg .row {
        display: flex; flex-direction: row; align-items: center; gap: 100px;
      }

      /* Dot grid canvas area */
      #t1-st-dotg .dot-area {
        display: flex; flex-direction: column; gap: 14px;
      }
      #t1-st-dotg .dot-row {
        display: flex; flex-direction: row; gap: 14px;
      }
      #t1-st-dotg .dot {
        width: 28px; height: 28px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.10);
        transition: none;
        flex-shrink: 0;
      }
      #t1-st-dotg .dot.on {
        background: var(--accent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.70),
                    0 0 22px rgba(var(--accent-rgb), 0.38);
      }

      /* Big percentage number on the right */
      #t1-st-dotg .stat-side {
        display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
      }
      #t1-st-dotg .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 200px;
        line-height: 0.92;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.82) 78%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.50));
      }
      #t1-st-dotg .of-label {
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      #t1-st-dotg .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
        margin-top: 50px;
      }
      #t1-st-dotg .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-st-dotg .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-st-dotg .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-st-dotg .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-st-dotg" data-composition-id="t1-st-dotg" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">COURSE COMPLETION · 2026</div>

        <div class="row">
          <!-- 10×10 dot grid; JS lights dots 1..pct -->
          <div class="dot-area" id="t1-st-dotg-grid" data-pct="73"></div>

          <div class="stat-side">
            <div class="stat" id="t1-st-dotg-num" data-slot="stat">73%</div>
            <div class="of-label">OF 100</div>
          </div>
        </div>

        <div class="label" data-slot="label">of enrolled students complete the program within <em>90 days of starting</em></div>
      </div>

      <div class="source" data-slot="source">SOURCE · PLATFORM DATA 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Read knob */
      const gridEl = document.getElementById("t1-st-dotg-grid");
      const pct    = parseFloat(gridEl.getAttribute("data-pct")) || 73;
      const numEl  = document.getElementById("t1-st-dotg-num");

      /* Build 10×10 grid of dots */
      const ROWS = 10, COLS = 10, TOTAL = 100;
      const lit = Math.round((pct / 100) * TOTAL);
      /* Fill left-to-right, bottom row first so lit dots "fill up" visually */
      const dotEls = [];
      for (let r = 0; r < ROWS; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "dot-row";
        for (let c = 0; c < COLS; c++) {
          const idx = r * COLS + c;
          const d = document.createElement("div");
          d.className = "dot";
          rowDiv.appendChild(d);
          dotEls.push(d);
        }
        gridEl.appendChild(rowDiv);
      }

      /* All dots start dim; will light up during count-up */
      tl.fromTo("#t1-st-dotg .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-st-dotg .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-st-dotg .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-st-dotg .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* Row: dot-area and stat-side blur-spring in together */
        .from("#t1-st-dotg .dot-area",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.4)" }, 0.80)
        .from("#t1-st-dotg .stat",
          { autoAlpha: 0, filter: "blur(24px)", duration: 0.90, ease: "power4.out" }, 0.85)
        .from("#t1-st-dotg .of-label",
          { autoAlpha: 0, y: 12, duration: 0.65, ease: "power3.out" }, 1.05)

        /* Count-up + light dots simultaneously */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.80, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            numEl.textContent = Math.round(v) + "%";
            /* Light the correct number of dots */
            const litNow = Math.round((v / 100) * TOTAL);
            for (let i = 0; i < TOTAL; i++) {
              if (i < litNow) {
                if (!dotEls[i].classList.contains("on")) dotEls[i].classList.add("on");
              } else {
                dotEls[i].classList.remove("on");
              }
            }
          }
        }, 1.00)

        .from("#t1-st-dotg .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.10)
        .from("#t1-st-dotg .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.40)

        /* Breathing glow on lit dots — animate a shared box-shadow via a proxy */
        .to("#t1-st-dotg .dot.on",
          { opacity: 0.72, duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.00)

        .set({}, {}, 7);

      window.__timelines["t1-st-dotg"] = tl;
    </script>
  </body>
</html>
