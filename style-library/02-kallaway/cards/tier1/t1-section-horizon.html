<!doctype html>
<!--
  KALLAWAY · tier1 · section · HORIZON
  Full-screen chapter takeover. A glowing horizon line sits low in the frame
  with a wide blue-to-transparent sunrise bloom above it. The kicker and
  headline rise up over the horizon as if cresting a hilltop at dawn.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-horizon {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Sky bloom — wide sunrise rising from the horizon band */
      #t1-sec-horizon .sky-bloom {
        position: absolute; left: 0; right: 0;
        bottom: 240px; height: 900px;
        background: radial-gradient(120% 70% at 50% 100%,
          rgba(var(--accent-rgb), 0.42) 0%,
          rgba(var(--accent-rgb), 0.16) 38%,
          transparent 68%);
        z-index: 2;
      }

      /* Deep bloom from the very bottom */
      #t1-sec-horizon .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      /* Dot grid — masked to upper half for "sky" feel */
      #t1-sec-horizon .grid {
        position: absolute; inset: 0; z-index: 2;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 65%);
                mask-image: linear-gradient(to bottom, #000 0%, transparent 65%);
      }

      /* Ground plane — dark gradient from horizon down */
      #t1-sec-horizon .ground {
        position: absolute; left: 0; right: 0; bottom: 0; height: 320px;
        background: linear-gradient(to top, var(--canvas-deep) 0%, rgba(7,18,28,0.70) 60%, transparent 100%);
        z-index: 3;
      }

      /* The glowing horizon line — the signature element */
      #t1-sec-horizon .horizon-line {
        position: absolute; left: 0; right: 0; bottom: 278px;
        height: 2px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.40) 10%,
          rgba(255,255,255,0.90) 30%,
          rgba(255,255,255,1.00) 50%,
          rgba(255,255,255,0.90) 70%,
          rgba(var(--accent-rgb), 0.40) 90%,
          transparent 100%);
        box-shadow:
          0 0 8px  rgba(255,255,255,0.80),
          0 0 24px rgba(var(--accent-rgb), 0.55),
          0 0 70px rgba(var(--accent-rgb), 0.25);
        z-index: 4;
      }

      /* Thin second line just above for double-line effect */
      #t1-sec-horizon .horizon-line-2 {
        position: absolute; left: 180px; right: 180px; bottom: 284px;
        height: 1px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.28) 15%,
          rgba(var(--accent-rgb), 0.55) 50%,
          rgba(var(--accent-rgb), 0.28) 85%,
          transparent 100%);
        z-index: 4;
      }

      /* Perspective grid lines receding from the horizon */
      #t1-sec-horizon .persp-grid {
        position: absolute; left: 0; right: 0; bottom: 0; height: 280px;
        z-index: 3; overflow: hidden; opacity: 0.28;
      }
      #t1-sec-horizon .persp-grid svg {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      }

      /* Content — rises over the horizon */
      #t1-sec-horizon .content {
        position: absolute; left: 0; right: 0; bottom: 380px;
        text-align: center; z-index: 5;
      }
      #t1-sec-horizon .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 28px;
      }
      #t1-sec-horizon .plate {
        position: absolute; left: 50%; top: 72px; transform: translateX(-50%);
        width: 1220px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(255,255,255,0.12), transparent 70%);
        filter: blur(16px); z-index: -1;
      }
      #t1-sec-horizon .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1360px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-horizon .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-horizon .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-horizon .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-horizon" data-composition-id="t1-sec-horizon" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="sky-bloom"></div>
      <div class="grid"></div>
      <div class="ground"></div>

      <!-- Perspective grid lines via SVG -->
      <div class="persp-grid">
        <svg viewBox="0 0 1920 280" preserveAspectRatio="none">
          <!-- Vanishing point lines -->
          <line x1="960" y1="0" x2="0"    y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="240"  y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="480"  y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="720"  y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="960"  y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="1200" y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="1440" y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="1680" y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <line x1="960" y1="0" x2="1920" y2="280" stroke="rgba(55,189,248,0.7)" stroke-width="1"/>
          <!-- Cross lines getting further apart toward bottom -->
          <line x1="840" y1="70"  x2="1080" y2="70"  stroke="rgba(55,189,248,0.5)" stroke-width="1"/>
          <line x1="720" y1="140" x2="1200" y2="140" stroke="rgba(55,189,248,0.5)" stroke-width="1"/>
          <line x1="540" y1="210" x2="1380" y2="210" stroke="rgba(55,189,248,0.5)" stroke-width="1"/>
          <line x1="240" y1="280" x2="1680" y2="280" stroke="rgba(55,189,248,0.5)" stroke-width="1"/>
        </svg>
      </div>

      <div class="horizon-line"></div>
      <div class="horizon-line-2"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 4 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">What Lies <em>Beyond</em> the Training Data</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite, deterministic */
      tl.fromTo("#t1-sec-horizon .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Deep bloom and grid */
      tl.from("#t1-sec-horizon .bloom",     { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0)
        .from("#t1-sec-horizon .grid",      { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)
        .from("#t1-sec-horizon .ground",    { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.1)
        .from("#t1-sec-horizon .persp-grid",{ autoAlpha: 0, y: 40, duration: 1.2, ease: "expo.out" }, 0.2);

      /* Horizon line expands outward from center */
      tl.from("#t1-sec-horizon .horizon-line",   { scaleX: 0, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.3)
        .from("#t1-sec-horizon .horizon-line-2",  { scaleX: 0, transformOrigin: "50% 50%", duration: 1.0, ease: "expo.out" }, 0.5);

      /* Sky bloom rises from horizon */
      tl.from("#t1-sec-horizon .sky-bloom", { autoAlpha: 0, y: 80, scale: 0.90, transformOrigin: "50% 100%", duration: 1.6, ease: "power4.out" }, 0.4);

      /* Content rises upward over the horizon — sunrise cresting effect */
      tl.from("#t1-sec-horizon .kicker",   { autoAlpha: 0, y: 50, filter: "blur(8px)", duration: 0.9, ease: "power4.out" }, 1.0)
        .from("#t1-sec-horizon .plate",    { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 1.2)
        .from("#t1-sec-horizon .headline", { autoAlpha: 0, y: 60, filter: "blur(14px)", duration: 1.1, ease: "power4.out" }, 1.3);

      /* Horizon glow pulse — finite */
      tl.to("#t1-sec-horizon .horizon-line", {
        boxShadow: "0 0 12px rgba(255,255,255,0.95), 0 0 40px rgba(55,189,248,0.80), 0 0 100px rgba(55,189,248,0.35)",
        duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true
      }, 2.2);

      /* Plate pulse */
      tl.to("#t1-sec-horizon .plate", { opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.3);

      /* Slow sky bloom drift upward */
      tl.to("#t1-sec-horizon .sky-bloom", { y: -20, duration: 4.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-horizon"] = tl;
    </script>
  </body>
</html>
