<!doctype html>
<!--
  KALLAWAY · tier1 · section · MESH
  Full-screen chapter takeover. A 3D wireframe mesh plane built with CSS
  perspective tilts in from below; the title floats above it, crisp and
  centered, as the mesh settles into position.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-mesh {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-mesh .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      #t1-sec-mesh .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.35;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 50%);
                mask-image: linear-gradient(to bottom, #000 0%, transparent 50%);
      }

      /* 3D perspective container */
      #t1-sec-mesh .mesh-stage {
        position: absolute; left: 0; right: 0; bottom: -60px; height: 700px;
        z-index: 3;
        perspective: 900px; perspective-origin: 50% 0%;
      }

      /* The mesh plane itself — rotated on X axis to give the perspective tilt */
      #t1-sec-mesh .mesh-plane {
        position: absolute; left: -100px; right: -100px; top: 0; height: 100%;
        transform: rotateX(62deg); transform-origin: 50% 0%;
        transform-style: preserve-3d;
      }

      /* SVG mesh grid drawn on the plane */
      #t1-sec-mesh .mesh-svg {
        position: absolute; inset: 0; width: 100%; height: 100%;
      }

      /* Edge glow reflecting off the horizon of the mesh */
      #t1-sec-mesh .mesh-horizon {
        position: absolute; left: 0; right: 0; top: 0; height: 3px;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.50) 10%,
          rgba(255,255,255,0.88) 50%,
          rgba(var(--accent-rgb), 0.50) 90%,
          transparent 100%);
        box-shadow: 0 0 12px rgba(255,255,255,0.75), 0 0 40px rgba(var(--accent-rgb),0.50);
        z-index: 4;
      }

      /* Glow beneath mesh — under the table surface */
      #t1-sec-mesh .mesh-under-glow {
        position: absolute; left: 50%; top: 60px; transform: translateX(-50%);
        width: 1400px; height: 200px;
        background: radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb), 0.28), transparent 70%);
        z-index: 2;
      }

      /* Content floating above the mesh */
      #t1-sec-mesh .content {
        position: absolute; left: 0; right: 0; top: 200px;
        text-align: center; z-index: 6;
      }
      #t1-sec-mesh .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 28px;
      }
      #t1-sec-mesh .plate {
        position: absolute; left: 50%; top: 82px; transform: translateX(-50%);
        width: 1200px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(255,255,255,0.11), transparent 70%);
        filter: blur(18px); z-index: -1;
      }
      #t1-sec-mesh .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1340px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-mesh .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-mesh .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-mesh .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-mesh" data-composition-id="t1-sec-mesh" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="mesh-stage">
        <div class="mesh-plane">
          <!-- Wireframe mesh as SVG — 12 columns x 8 rows of cells -->
          <svg class="mesh-svg" viewBox="0 0 2120 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="meshGlow">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Gradient fades lines toward far edge (perspective fade) -->
              <linearGradient id="meshFade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="rgba(55,189,248,0.75)"/>
                <stop offset="60%"  stop-color="rgba(55,189,248,0.28)"/>
                <stop offset="100%" stop-color="rgba(55,189,248,0.04)"/>
              </linearGradient>
            </defs>

            <g filter="url(#meshGlow)" stroke="url(#meshFade)" stroke-width="1.2" fill="none">
              <!-- Vertical lines — 14 columns -->
              <line x1="0"    y1="0" x2="0"    y2="700"/>
              <line x1="163"  y1="0" x2="163"  y2="700"/>
              <line x1="326"  y1="0" x2="326"  y2="700"/>
              <line x1="489"  y1="0" x2="489"  y2="700"/>
              <line x1="652"  y1="0" x2="652"  y2="700"/>
              <line x1="815"  y1="0" x2="815"  y2="700"/>
              <line x1="978"  y1="0" x2="978"  y2="700"/>
              <line x1="1060" y1="0" x2="1060" y2="700"/>
              <line x1="1141" y1="0" x2="1141" y2="700"/>
              <line x1="1304" y1="0" x2="1304" y2="700"/>
              <line x1="1467" y1="0" x2="1467" y2="700"/>
              <line x1="1630" y1="0" x2="1630" y2="700"/>
              <line x1="1793" y1="0" x2="1793" y2="700"/>
              <line x1="1957" y1="0" x2="1957" y2="700"/>
              <line x1="2120" y1="0" x2="2120" y2="700"/>
            </g>

            <!-- Horizontal lines with a constant stroke (not perspective-faded) -->
            <g filter="url(#meshGlow)" stroke="rgba(55,189,248,0.55)" stroke-width="1.2" fill="none">
              <line x1="0" y1="0"   x2="2120" y2="0"/>
              <line x1="0" y1="100" x2="2120" y2="100"/>
              <line x1="0" y1="200" x2="2120" y2="200"/>
              <line x1="0" y1="300" x2="2120" y2="300"/>
              <line x1="0" y1="400" x2="2120" y2="400"/>
              <line x1="0" y1="500" x2="2120" y2="500"/>
              <line x1="0" y1="600" x2="2120" y2="600"/>
              <line x1="0" y1="700" x2="2120" y2="700"/>
            </g>
          </svg>
        </div>
        <div class="mesh-horizon"></div>
        <div class="mesh-under-glow"></div>
      </div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 8 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">Building on a <em>Solid Foundation</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-mesh .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-sec-mesh .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-mesh .grid",  { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* Mesh tilts in from below — starts fully below the horizon, rises and settles */
      tl.from("#t1-sec-mesh .mesh-stage", {
        autoAlpha: 0, y: 180, rotationX: -12,
        transformOrigin: "50% 0%", duration: 1.5, ease: "power4.out"
      }, 0.2);

      /* Horizon line slides in from center */
      tl.from("#t1-sec-mesh .mesh-horizon", { scaleX: 0, transformOrigin: "50% 50%", duration: 1.0, ease: "expo.out" }, 0.4);

      /* Under-glow blooms */
      tl.from("#t1-sec-mesh .mesh-under-glow", { autoAlpha: 0, scaleX: 0.4, transformOrigin: "50% 0%", duration: 1.2, ease: "expo.out" }, 0.5);

      /* Text floats down from above mesh */
      tl.from("#t1-sec-mesh .kicker",   { autoAlpha: 0, y: -28, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 1.1)
        .from("#t1-sec-mesh .plate",    { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 1.3)
        .from("#t1-sec-mesh .headline", { autoAlpha: 0, y: -38, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.4);

      /* Plate breathing glow */
      tl.to("#t1-sec-mesh .plate", { opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.4);

      /* Mesh very slow drift — like a floating surface */
      tl.to("#t1-sec-mesh .mesh-stage", { y: -16, duration: 4.2, ease: "sine.inOut" }, 2.0);

      /* Horizon line breathing */
      tl.to("#t1-sec-mesh .mesh-horizon", {
        boxShadow: "0 0 18px rgba(255,255,255,0.95), 0 0 55px rgba(55,189,248,0.70), 0 0 110px rgba(55,189,248,0.30)",
        duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true
      }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-mesh"] = tl;
    </script>
  </body>
</html>
