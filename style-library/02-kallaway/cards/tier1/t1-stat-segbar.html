<!doctype html>
<!--
  KALLAWAY · tier1 · stat · SEGBAR
  A wide segmented horizontal progress bar; individual pill segments light up
  left-to-right to the value. Big number counts up above. Very graphic, horizontal.
  Knob: data-pct on #t1-stat-segbar-root (default 80).
  Slots: kicker (~28 chars uppercase), stat (big number), label (~70 chars, <em> on one phrase), source (~40 chars uppercase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-segbar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-segbar .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-segbar .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Layout: centered column */
      #t1-stat-segbar .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 0; padding: 0 140px;
      }

      #t1-stat-segbar .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 48px;
      }

      /* The big stat number */
      #t1-stat-segbar .stat-row {
        display: flex; align-items: baseline; gap: 20px;
        margin-bottom: 60px;
      }
      #t1-stat-segbar .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: var(--size-mega);
        line-height: 0.9;
        letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 10%, rgba(var(--accent-rgb), 0.80) 88%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-segbar .stat-pct {
        font-family: var(--font-mono);
        font-size: 64px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Segmented bar */
      #t1-stat-segbar .seg-wrap {
        position: relative;
        width: 100%;
        margin-bottom: 56px;
      }
      /* Glow behind bar */
      #t1-stat-segbar .seg-glow {
        position: absolute; left: 0; right: 0; top: -20px; bottom: -20px;
        border-radius: 40px;
        background: radial-gradient(80% 100% at 40% 50%, rgba(var(--accent-rgb), 0.20) 0%, transparent 70%);
        pointer-events: none;
      }
      #t1-stat-segbar .seg-bar {
        display: flex; gap: 10px; align-items: center;
      }
      #t1-stat-segbar .seg {
        flex: 1; height: 56px; border-radius: 10px;
        background: rgba(255,255,255,0.05);
        border: 1.5px solid rgba(255,255,255,0.07);
      }
      #t1-stat-segbar .seg.on {
        background: rgba(var(--accent-rgb), 0.72);
        border-color: rgba(var(--accent-rgb), 0.4);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.55),
                    0 0 6px rgba(255,255,255,0.25);
      }
      /* Last lit segment gets the brightest tip glow */
      #t1-stat-segbar .seg.tip {
        background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.85), #ffffff);
        box-shadow: 0 0 28px rgba(var(--accent-rgb), 0.80),
                    0 0 60px rgba(var(--accent-rgb), 0.40),
                    0 0 8px rgba(255,255,255,0.5);
      }

      /* Value labels below bar: 0% ... 100% */
      #t1-stat-segbar .seg-labels {
        display: flex; justify-content: space-between;
        padding: 0 4px; margin-top: 14px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        color: var(--text-faint); letter-spacing: 0.1em;
      }

      #t1-stat-segbar .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 1100px;
        line-height: 1.45;
      }
      #t1-stat-segbar .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-segbar .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-segbar .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-segbar .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-segbar" data-composition-id="t1-stat-segbar"
         data-start="0" data-width="1920" data-height="1080" data-pct="80">

      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">MODULE COMPLETION · LIVE COHORT</div>

        <div class="stat-row">
          <div class="stat" id="t1-stat-segbar-num" data-slot="stat">80</div>
          <div class="stat-pct">%</div>
        </div>

        <div class="seg-wrap">
          <div class="seg-glow"></div>
          <div class="seg-bar" id="t1-stat-segbar-bar">
            <!-- 20 segments injected by JS = 5% each -->
          </div>
          <div class="seg-labels">
            <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
          </div>
        </div>

        <div class="label" data-slot="label">students completing all core modules — <em>exceeding the target</em> of 70% set at program launch</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS LEARNING DASHBOARD 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const rootEl  = document.getElementById("t1-stat-segbar");
      const barEl   = document.getElementById("t1-stat-segbar-bar");
      const numEl   = document.getElementById("t1-stat-segbar-num");
      const pct     = parseFloat(rootEl.getAttribute("data-pct")) || 80;

      /* 20 segments = 5% each */
      const SEG_COUNT = 20;
      for (let i = 0; i < SEG_COUNT; i++) {
        const seg = document.createElement("div");
        seg.className = "seg";
        seg.id = "t1-stat-segbar-seg-" + i;
        barEl.appendChild(seg);
      }

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-segbar .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-segbar .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-segbar .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-segbar .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.5)

        /* stat row */
        .from("#t1-stat-segbar .stat-row",
          { autoAlpha: 0, scale: 0.85, duration: 0.8, ease: "back.out(1.4)" }, 0.65)

        /* segments light up + count-up */
        .to({ val: 0 }, {
          val: pct,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v   = this.targets()[0].val;
            const lit = Math.round(v / (100 / SEG_COUNT)); /* segments lit */
            for (let i = 0; i < SEG_COUNT; i++) {
              const el = document.getElementById("t1-stat-segbar-seg-" + i);
              if (!el) continue;
              if (i < lit - 1) { el.className = "seg on"; }
              else if (i === lit - 1) { el.className = "seg on tip"; }
              else { el.className = "seg"; }
            }
            numEl.textContent = Math.round(v);
          }
        }, 1.05)

        /* bar wrap slides up */
        .from("#t1-stat-segbar .seg-wrap",
          { autoAlpha: 0, y: 20, duration: 0.7, ease: "power3.out" }, 1.0)

        /* label */
        .from("#t1-stat-segbar .label",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.2)

        /* source */
        .from("#t1-stat-segbar .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.5)

        /* breathing glow on seg-glow */
        .to("#t1-stat-segbar .seg-glow",
          { opacity: 0.5, scale: 1.04, transformOrigin: "40% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.1)

        .set({}, {}, 7);

      window.__timelines["t1-stat-segbar"] = tl;
    </script>
  </body>
</html>
