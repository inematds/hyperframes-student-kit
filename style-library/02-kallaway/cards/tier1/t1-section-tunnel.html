<!doctype html>
<!--
  KALLAWAY · tier1 · section · TUNNEL
  Full-screen chapter takeover. Concentric perspective rings draw inward toward
  a vanishing point at center — a depth tunnel effect. The kicker and headline
  sit at the vanishing center, revealed as the tunnel resolves.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-tunnel {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-tunnel .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }

      /* Center point bloom — depth glow at vanishing point */
      #t1-sec-tunnel .center-bloom {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 600px; height: 600px;
        background: radial-gradient(circle at 50% 50%,
          rgba(var(--accent-rgb), 0.55) 0%,
          rgba(var(--accent-rgb), 0.22) 30%,
          transparent 68%);
        z-index: 2;
      }

      #t1-sec-tunnel .grid {
        position: absolute; inset: 0; z-index: 2;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.30;
        -webkit-mask-image: radial-gradient(40% 40% at 50% 50%, transparent 30%, #000 70%);
                mask-image: radial-gradient(40% 40% at 50% 50%, transparent 30%, #000 70%);
      }

      /* SVG tunnel rings */
      #t1-sec-tunnel .tunnel-svg {
        position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 3;
      }

      /* Content — at the vanishing center */
      #t1-sec-tunnel .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-54%);
        text-align: center; z-index: 6;
      }
      #t1-sec-tunnel .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 24px;
      }
      #t1-sec-tunnel .plate {
        position: absolute; left: 50%; top: 76px; transform: translateX(-50%);
        width: 1100px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(10,14,20,0.80), transparent 70%);
        filter: blur(24px); z-index: -1;
      }
      #t1-sec-tunnel .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1300px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-tunnel .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-tunnel .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: var(--vignette);
      }
      #t1-sec-tunnel .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-tunnel" data-composition-id="t1-sec-tunnel" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="center-bloom"></div>
      <div class="grid"></div>

      <!-- Tunnel rings — concentric rectangles scaled to perspective from a center point (960, 540).
           Each ring gets thinner as it approaches center. 10 rings total. -->
      <svg class="tunnel-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="ringGlow" x="-15%" y="-30%" width="130%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Rings drawn from outer to inner — each slightly more opaque as it nears center -->
        <!-- Outer rings: larger, lower opacity -->
        <rect class="tring" x="80"   y="45"   width="1760" height="990" rx="20"
              fill="none" stroke="rgba(55,189,248,0.18)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="200"  y="110"  width="1520" height="860" rx="18"
              fill="none" stroke="rgba(55,189,248,0.24)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="340"  y="186"  width="1240" height="708" rx="16"
              fill="none" stroke="rgba(55,189,248,0.30)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="480"  y="264"  width="960"  height="552" rx="14"
              fill="none" stroke="rgba(55,189,248,0.38)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="600"  y="330"  width="720"  height="420" rx="12"
              fill="none" stroke="rgba(55,189,248,0.46)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="700"  y="386"  width="520"  height="308" rx="10"
              fill="none" stroke="rgba(55,189,248,0.55)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="780"  y="430"  width="360"  height="220" rx="8"
              fill="none" stroke="rgba(55,189,248,0.64)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="840"  y="464"  width="240"  height="152" rx="6"
              fill="none" stroke="rgba(55,189,248,0.72)" stroke-width="1.2" filter="url(#ringGlow)"/>
        <rect class="tring" x="888"  y="492"  width="144"  height="96"  rx="4"
              fill="none" stroke="rgba(55,189,248,0.82)" stroke-width="1.5" filter="url(#ringGlow)"/>
        <!-- Innermost ring — bright white core -->
        <rect class="tring tring-core" x="928" y="518"  width="64"   height="44"  rx="3"
              fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="2" filter="url(#ringGlow)"/>

        <!-- Diagonal corner-to-center guide lines -->
        <g class="tunnel-diag" stroke="rgba(55,189,248,0.14)" stroke-width="0.8">
          <line x1="0"    y1="0"    x2="960" y2="540"/>
          <line x1="1920" y1="0"    x2="960" y2="540"/>
          <line x1="0"    y1="1080" x2="960" y2="540"/>
          <line x1="1920" y1="1080" x2="960" y2="540"/>
          <line x1="960"  y1="0"    x2="960" y2="540"/>
          <line x1="960"  y1="1080" x2="960" y2="540"/>
          <line x1="0"    y1="540"  x2="960" y2="540"/>
          <line x1="1920" y1="540"  x2="960" y2="540"/>
        </g>
      </svg>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 7 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">Go <em>Deeper</em> Than the Surface Answer</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-tunnel .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-sec-tunnel .bloom",        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-tunnel .grid",         { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)
        .from("#t1-sec-tunnel .tunnel-diag",  { autoAlpha: 0, duration: 0.9, ease: "power2.out" }, 0.1);

      /* Rings materialize from outside in */
      tl.from("#t1-sec-tunnel .tring", {
        autoAlpha: 0, scale: 1.18, transformOrigin: "960px 540px",
        duration: 1.0, ease: "power4.out",
        stagger: { each: 0.07, from: "start" }
      }, 0.15);

      /* Center bloom pulses in */
      tl.from("#t1-sec-tunnel .center-bloom", { autoAlpha: 0, scale: 0.30, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.8);

      /* Text appears from center — emerges through the tunnel */
      tl.from("#t1-sec-tunnel .kicker",   { autoAlpha: 0, scale: 0.80, filter: "blur(14px)", transformOrigin: "50% 50%", duration: 0.9, ease: "power4.out" }, 1.3)
        .from("#t1-sec-tunnel .plate",    { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 1.5)
        .from("#t1-sec-tunnel .headline", { autoAlpha: 0, scale: 0.85, filter: "blur(18px)", transformOrigin: "50% 50%", duration: 1.1, ease: "power4.out" }, 1.6);

      /* Rings slowly push inward — zooming tunnel feel — finite */
      tl.to("#t1-sec-tunnel .tring", {
        scale: 0.94, transformOrigin: "960px 540px",
        duration: 4.5, ease: "sine.inOut"
      }, 2.0);

      /* Center bloom breathe */
      tl.to("#t1-sec-tunnel .center-bloom", { scale: 1.25, opacity: 0.7, transformOrigin: "50% 50%", duration: 1.8, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-tunnel"] = tl;
    </script>
  </body>
</html>
