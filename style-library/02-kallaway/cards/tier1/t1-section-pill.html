<!doctype html>
<!--
  KALLAWAY · tier1 · section · PILL
  Full-screen chapter takeover. The headline sits inside a wide glowing glass
  pill/capsule (generously rounded) floating over the aurora canvas. Kicker
  number sits above on its own small glass chip. Soft bloom radiates behind the
  pill. Clean, boxed, premium.
  Slots: kicker (~16 chars), headline (~52 chars, <em> wraps one phrase for accent).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-pill {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-pill .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-pill .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Full centred layout */
      #t1-sec-pill .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-52%);
        display: flex; flex-direction: column; align-items: center; gap: 0;
        z-index: 4;
      }

      /* Kicker chip — small standalone glass chip */
      #t1-sec-pill .kicker-chip {
        display: inline-flex; align-items: center; padding: 16px 40px;
        background: rgba(var(--accent-rgb), 0.10);
        backdrop-filter: blur(12px) saturate(130%);
        -webkit-backdrop-filter: blur(12px) saturate(130%);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.35);
        border-radius: 40px;
        margin-bottom: 44px;
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.20),
                    0 0 50px rgba(var(--accent-rgb), 0.10);
      }
      #t1-sec-pill .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* The main pill */
      #t1-sec-pill .pill {
        position: relative;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 60px 90px;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: 80px;
        box-shadow:
          var(--glass-shadow),
          0 0 0 1px rgba(255,255,255,0.06) inset,
          0 1px 0 rgba(255,255,255,0.20) inset;
        max-width: 1440px;
        text-align: center;
      }

      /* Accent glow underlay behind the pill */
      #t1-sec-pill .pill-bloom {
        position: absolute; inset: -40px;
        border-radius: 120px;
        background: radial-gradient(ellipse at 50% 55%,
          rgba(var(--accent-rgb), 0.20) 0%,
          transparent 68%);
        filter: blur(30px);
        z-index: -1;
        pointer-events: none;
      }

      /* Top inner highlight rim */
      #t1-sec-pill .pill-rim {
        position: absolute; inset: 0; border-radius: 80px;
        background: linear-gradient(
          180deg,
          rgba(255,255,255,0.12) 0%,
          rgba(255,255,255,0.03) 30%,
          transparent 60%
        );
        pointer-events: none;
      }

      /* Headline text inside pill */
      #t1-sec-pill .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.08; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        position: relative; z-index: 1;
      }
      #t1-sec-pill .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-pill .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-pill .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-pill" data-composition-id="t1-sec-pill" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker-chip">
          <div class="kicker" data-slot="kicker">Part One</div>
        </div>
        <div class="pill">
          <div class="pill-bloom"></div>
          <div class="pill-rim"></div>
          <div class="headline" data-slot="headline">The <em>Framework</em> Everyone Gets Wrong</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-pill .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "130px 95px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-pill .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-pill .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* kicker chip drops in */
        .from("#t1-sec-pill .kicker-chip",
          { autoAlpha: 0, y: -24, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.55)

        /* pill springs in from below — back.out spring overshoot */
        .from("#t1-sec-pill .pill",
          { autoAlpha: 0, y: 60, scale: 0.93, transformOrigin: "50% 50%",
            filter: "blur(18px)", duration: 1.1, ease: "back.out(1.4)" }, 0.85)

        /* pill bloom radiates out */
        .from("#t1-sec-pill .pill-bloom",
          { autoAlpha: 0, scale: 0.7, duration: 1.2, ease: "power4.out" }, 1.0)

        /* headline fades in fractionally after pill */
        .from("#t1-sec-pill .headline",
          { autoAlpha: 0, y: 16, filter: "blur(10px)", duration: 0.8, ease: "power4.out" }, 1.2)

        /* slow breathing: pill bloom pulses softly */
        .to("#t1-sec-pill .pill-bloom",
          { opacity: 0.55, scale: 1.06, duration: 1.6, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.4)

        /* gentle drift: whole pill drifts very slightly up */
        .to("#t1-sec-pill .pill",
          { y: -12, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-sec-pill"] = tl;
    </script>
  </body>
</html>
