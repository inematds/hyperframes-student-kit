<!doctype html>
<!--
  KALLAWAY · tier1 · overview · FLOW
  Left-to-right flow of 4 glass nodes joined by clean connector lines with small
  glowing chevron markers. Nodes spring on, connectors draw between them.
  Slots: title, n1, n2, n3, n4 (node labels).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-flow {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-flow .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-flow .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-flow .title-row {
        position: absolute; left: 0; right: 0; top: 88px; text-align: center; z-index: 4;
      }
      #t1-ov-flow .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1500px; margin: 0 auto;
      }
      #t1-ov-flow .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Flow container — horizontal, perfectly centered */
      #t1-ov-flow .flow-row {
        position: absolute;
        left: 80px; right: 80px; top: 50%; margin-top: -90px;
        z-index: 4;
        display: flex; align-items: center; justify-content: center;
      }

      /* Glass node */
      .flow-node {
        display: flex; flex-direction: column; align-items: center;
        width: 280px; flex-shrink: 0;
      }
      .flow-node .node-glass {
        width: 280px;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        padding: 32px 28px 30px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow),
                    0 0 44px rgba(var(--accent-rgb), 0.10),
                    inset 0 1px 0 var(--glass-hi);
        position: relative; overflow: hidden;
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
      }
      .flow-node .node-glass::before {
        content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }
      /* Accent rim at top */
      .flow-node .node-glass::after {
        content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 80px; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.80), transparent);
        border-radius: 1px;
      }
      /* Step index (Space Mono) */
      .flow-node .node-index {
        font-family: var(--font-mono); font-weight: 700;
        font-size: var(--size-label); color: var(--accent);
        letter-spacing: 0.08em; text-shadow: var(--textglow-accent);
        margin-bottom: 12px;
      }
      /* Glowing dot indicator */
      .flow-node .node-dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.85), 0 0 34px rgba(var(--accent-rgb), 0.45);
        margin-bottom: 14px; flex-shrink: 0;
      }
      .flow-node .node-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 28px; color: var(--white); letter-spacing: var(--track-snug);
        line-height: 1.25;
      }

      /* Connector segment — line + chevron */
      .flow-connector {
        flex: 1; max-width: 140px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        position: relative; height: 20px;
      }
      .flow-connector svg { width: 100%; height: 20px; overflow: visible; }

      #t1-ov-flow .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-flow .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-flow" data-composition-id="t1-ov-flow" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">How the <em>Process Flows</em></div>
      </div>

      <div class="flow-row">
        <!-- Node 1 -->
        <div class="flow-node" id="fn1">
          <div class="node-glass">
            <div class="node-index">01</div>
            <div class="node-dot" id="fdot1"></div>
            <div class="node-label" data-slot="n1">Intake &amp; Scope</div>
          </div>
        </div>

        <!-- Connector A -->
        <div class="flow-connector" id="fconn-a">
          <svg viewBox="0 0 140 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow-fc-a" x="-50%" y="-80%" width="200%" height="360%">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <line id="fl-a" x1="0" y1="10" x2="126" y2="10"
              stroke="rgba(55,189,248,0.50)" stroke-width="1.5" stroke-dasharray="7 5"/>
            <polyline id="fchev-a" points="120,4 132,10 120,16"
              stroke="rgba(55,189,248,0.90)" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round"
              filter="url(#glow-fc-a)"/>
          </svg>
        </div>

        <!-- Node 2 -->
        <div class="flow-node" id="fn2">
          <div class="node-glass">
            <div class="node-index">02</div>
            <div class="node-dot" id="fdot2"></div>
            <div class="node-label" data-slot="n2">Design &amp; Plan</div>
          </div>
        </div>

        <!-- Connector B -->
        <div class="flow-connector" id="fconn-b">
          <svg viewBox="0 0 140 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow-fc-b" x="-50%" y="-80%" width="200%" height="360%">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <line id="fl-b" x1="0" y1="10" x2="126" y2="10"
              stroke="rgba(55,189,248,0.50)" stroke-width="1.5" stroke-dasharray="7 5"/>
            <polyline id="fchev-b" points="120,4 132,10 120,16"
              stroke="rgba(55,189,248,0.90)" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round"
              filter="url(#glow-fc-b)"/>
          </svg>
        </div>

        <!-- Node 3 -->
        <div class="flow-node" id="fn3">
          <div class="node-glass">
            <div class="node-index">03</div>
            <div class="node-dot" id="fdot3"></div>
            <div class="node-label" data-slot="n3">Build &amp; Test</div>
          </div>
        </div>

        <!-- Connector C -->
        <div class="flow-connector" id="fconn-c">
          <svg viewBox="0 0 140 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow-fc-c" x="-50%" y="-80%" width="200%" height="360%">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <line id="fl-c" x1="0" y1="10" x2="126" y2="10"
              stroke="rgba(55,189,248,0.50)" stroke-width="1.5" stroke-dasharray="7 5"/>
            <polyline id="fchev-c" points="120,4 132,10 120,16"
              stroke="rgba(55,189,248,0.90)" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round"
              filter="url(#glow-fc-c)"/>
          </svg>
        </div>

        <!-- Node 4 -->
        <div class="flow-node" id="fn4">
          <div class="node-glass">
            <div class="node-index">04</div>
            <div class="node-dot" id="fdot4"></div>
            <div class="node-label" data-slot="n4">Deploy &amp; Monitor</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-flow .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "100px 75px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-flow .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-flow .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-flow .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 0.9, ease: "power4.out" }, 0.5)

        /* node 1 springs in */
        .from("#fn1", { autoAlpha: 0, x: -30, filter: "blur(10px)", scale: 0.94,
          transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.4)" }, 1.1)

        /* connector A draws */
        .from("#fl-a",   { scaleX: 0, transformOrigin: "left center", duration: 0.38, ease: "power2.out" }, 1.65)
        .from("#fchev-a",{ autoAlpha: 0, x: -10, duration: 0.28, ease: "power2.out" }, 2.00)

        /* node 2 */
        .from("#fn2", { autoAlpha: 0, x: -30, filter: "blur(10px)", scale: 0.94,
          transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.4)" }, 2.10)

        /* connector B draws */
        .from("#fl-b",   { scaleX: 0, transformOrigin: "left center", duration: 0.38, ease: "power2.out" }, 2.65)
        .from("#fchev-b",{ autoAlpha: 0, x: -10, duration: 0.28, ease: "power2.out" }, 3.00)

        /* node 3 */
        .from("#fn3", { autoAlpha: 0, x: -30, filter: "blur(10px)", scale: 0.94,
          transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.4)" }, 3.10)

        /* connector C draws */
        .from("#fl-c",   { scaleX: 0, transformOrigin: "left center", duration: 0.38, ease: "power2.out" }, 3.65)
        .from("#fchev-c",{ autoAlpha: 0, x: -10, duration: 0.28, ease: "power2.out" }, 4.00)

        /* node 4 */
        .from("#fn4", { autoAlpha: 0, x: -30, filter: "blur(10px)", scale: 0.94,
          transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.4)" }, 4.10)

        /* glow pulse on all node dots — finite */
        .to("#fdot1, #fdot2, #fdot3, #fdot4", {
          boxShadow: "0 0 22px rgba(55,189,248,0.98), 0 0 60px rgba(55,189,248,0.55)",
          duration: 1.0, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.20
        }, 5.0)

        /* hold drift */
        .to("#t1-ov-flow .flow-row", { y: -10, duration: 4.5, ease: "sine.inOut" }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-flow"] = tl;
    </script>
  </body>
</html>
