<!doctype html>
<!--
  KALLAWAY · tier1 · section · SPOTLIGHT
  Full-screen chapter takeover. A moving blue glow spotlight cone sweeps from the
  left across the dark canvas and settles centered on the headline, revealing it.
  The headline was invisible in darkness; the spotlight is what makes it readable.
  Premium, dramatic, stage-lighting aesthetic.
  Slots: kicker (~16 chars), headline (~52 chars, <em> on accent-glow phrase).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-spot {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Base aurora bloom — very dim, the spotlight is the real light source */
      #t1-sec-spot .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1; opacity: 0.50;
      }
      /* Dot grid */
      #t1-sec-spot .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.38;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 35%, transparent 78%);
      }

      /* Spotlight cone — a radial gradient that GSAP translates across the frame */
      #t1-sec-spot .spotlight {
        position: absolute;
        /* large enough to cast a wide cone glow */
        width: 1400px; height: 1400px;
        top: 50%; left: 50%;
        margin-top: -700px; margin-left: -700px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(255, 255, 255, 0.12)  0%,
          rgba(var(--accent-rgb), 0.30)  10%,
          rgba(var(--accent-rgb), 0.14)  30%,
          rgba(var(--accent-rgb), 0.04)  55%,
          transparent 72%);
        filter: blur(6px);
        z-index: 3;
        /* GSAP moves translateX; starts off left edge */
        transform: translateX(-1600px);
      }
      /* Second rim of spotlight — tighter bright core */
      #t1-sec-spot .spotlight-core {
        position: absolute;
        width: 560px; height: 560px;
        top: 50%; left: 50%;
        margin-top: -280px; margin-left: -280px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(var(--accent-rgb), 0.45) 20%,
          transparent 65%);
        filter: blur(18px);
        z-index: 3;
        transform: translateX(-1600px);
      }

      /* Content — centered, z-index above spotlight */
      #t1-sec-spot .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4;
      }
      #t1-sec-spot .kicker {
        font-family: var(--font-display); font-style: italic;
        font-weight: var(--wt-semi); font-size: 36px;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: var(--textglow);
        margin-bottom: 32px;
      }
      #t1-sec-spot .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.06;
        letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1360px; padding: 0 80px;
      }
      #t1-sec-spot .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-spot .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-spot .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-spot" data-composition-id="t1-sec-spot" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="spotlight"></div>
      <div class="spotlight-core"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">Part Two</div>
        <div class="headline" data-slot="headline">Why <em>Most Companies</em> Get This Wrong</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-spot .grain",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid fade up (dim) */
      tl.from("#t1-sec-spot .bloom",
            { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0)
        .from("#t1-sec-spot .grid",
            { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* kicker fades in just before spotlight arrives */
      tl.from("#t1-sec-spot .kicker",
            { autoAlpha: 0, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 0.5);

      /* headline starts hidden in the dark */
      tl.set("#t1-sec-spot .headline", { autoAlpha: 0.08 }, 0);

      /* spotlight sweeps in from the left */
      tl.to("#t1-sec-spot .spotlight",
            { x: 0, duration: 1.0, ease: "power3.inOut" }, 0.55);
      tl.to("#t1-sec-spot .spotlight-core",
            { x: 0, duration: 0.9, ease: "power3.inOut" }, 0.65);

      /* as spotlight arrives, headline illuminates */
      tl.to("#t1-sec-spot .headline",
            { autoAlpha: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 1.20);

      /* spotlight settles with a soft pulse */
      tl.to(["#t1-sec-spot .spotlight", "#t1-sec-spot .spotlight-core"],
            { scale: 1.08, transformOrigin: "50% 50%",
              duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.8);

      /* slow bloom drift during hold */
      tl.to("#t1-sec-spot .bloom",
            { scale: 1.06, transformOrigin: "50% 120%", duration: 5.0, ease: "sine.inOut" }, 1.5);

      /* headline glow breathes */
      tl.to("#t1-sec-spot .headline",
            { textShadow: "0 0 28px rgba(255,255,255,0.55), 0 0 60px rgba(var(--accent-rgb),0.40)",
              duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-spot"] = tl;
    </script>
  </body>
</html>
