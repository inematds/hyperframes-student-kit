<!doctype html>
<!--
  KALLAWAY · tier1 · section · DIVIDER
  Full-screen chapter takeover. Editorial, clean. Kicker label sits above, then
  the headline, then a glowing accent UNDERLINE RULE that draws across beneath
  the text like a signature underline. The ruled line is the focal motion beat.
  Slots: kicker (~16 chars), headline (~52 chars, <em> wraps one phrase for accent).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-div {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-div .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-div .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content — left-anchored, vertically centred */
      #t1-sec-div .content {
        position: absolute; left: var(--pad); right: var(--pad);
        top: 50%; transform: translateY(-54%);
        z-index: 4;
      }

      /* Short top rule — horizontal hairline above kicker */
      #t1-sec-div .top-rule {
        width: 0;
        height: 2px;
        background: rgba(255,255,255,0.20);
        border-radius: 1px;
        margin-bottom: 30px;
      }

      /* Kicker */
      #t1-sec-div .kicker {
        font-family: var(--font-body); font-style: italic; font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 28px;
      }

      /* Headline */
      #t1-sec-div .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-display); line-height: 1.00; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1540px;
        margin-bottom: 0;
      }
      #t1-sec-div .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Underline rule group — sits just below the headline */
      #t1-sec-div .rule-group {
        margin-top: 36px;
        display: flex; flex-direction: column; gap: 10px;
      }

      /* Main accent rule — the hero line that draws across */
      #t1-sec-div .rule-main {
        width: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.75) 50%,
          rgba(var(--accent-rgb), 0.0) 100%
        );
        box-shadow:
          0 0 12px rgba(var(--accent-rgb), 0.65),
          0 0 30px rgba(var(--accent-rgb), 0.30),
          0 0 60px rgba(var(--accent-rgb), 0.15);
        border-radius: 2px;
        transform-origin: left center;
      }

      /* Secondary thin rule beneath — slightly shorter, faint */
      #t1-sec-div .rule-thin {
        width: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(255,255,255,0.30) 0%,
          rgba(255,255,255,0.06) 65%,
          transparent 100%
        );
        border-radius: 1px;
        transform-origin: left center;
      }

      /* Vignette + grain */
      #t1-sec-div .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-div .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-div" data-composition-id="t1-sec-div" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="top-rule"></div>
        <div class="kicker" data-slot="kicker">— Section Four —</div>
        <div class="headline" data-slot="headline">The <em>Compounding Effect</em> of Consistent Work</div>
        <div class="rule-group">
          <div class="rule-main"></div>
          <div class="rule-thin"></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-div .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "105px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-div .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-div .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* top rule draws across — short, subtle */
        .to("#t1-sec-div .top-rule",
          { width: 80, duration: 0.55, ease: "power3.out" }, 0.4)

        /* kicker slides in */
        .from("#t1-sec-div .kicker",
          { autoAlpha: 0, x: -20, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.65)

        /* headline glides up + focus pull */
        .from("#t1-sec-div .headline",
          { autoAlpha: 0, y: 40, filter: "blur(18px)", duration: 1.1, ease: "power4.out" }, 0.9)

        /* main underline rule draws across — the signature beat */
        .to("#t1-sec-div .rule-main",
          { width: 1180, duration: 0.90, ease: "power3.out" }, 1.65)

        /* thin rule follows just behind */
        .to("#t1-sec-div .rule-thin",
          { width: 780, duration: 0.70, ease: "power2.out" }, 1.85)

        /* rule glow pulses after landing */
        .to("#t1-sec-div .rule-main",
          { boxShadow: "0 0 20px rgba(55,189,248,0.80), 0 0 50px rgba(55,189,248,0.45), 0 0 100px rgba(55,189,248,0.20)",
            duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.4)

        /* slow leftward drift of headline — parallax hold */
        .to("#t1-sec-div .headline",
          { x: 8, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-sec-div"] = tl;
    </script>
  </body>
</html>
