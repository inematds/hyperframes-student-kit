<!doctype html>
<!--
  KALLAWAY · tier1 · section · RIBBON
  Full-screen takeover. The headline lives on a glowing RIBBON/BANNER that
  unfurls across the screen (scaleX draw-in with a slight skew), with a bright
  accent edge-glow along its top edge. Kicker sits centred above.
  Slots: kicker (~16 chars), headline (~52 chars, <em> accent word).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-rib {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-rib .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-rib .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.4;
        -webkit-mask-image: radial-gradient(140% 120% at 50% 55%, #000 25%, transparent 72%);
                mask-image: radial-gradient(140% 120% at 50% 55%, #000 25%, transparent 72%);
      }

      /* ── Ribbon ────────────────────────────────────────────────────────── */
      #t1-sec-rib .ribbon-wrap {
        position: absolute; left: -60px; right: -60px; top: 50%;
        transform: translateY(-50%);
        z-index: 3;
      }
      #t1-sec-rib .ribbon {
        position: relative;
        height: 200px;
        background: linear-gradient(
          100deg,
          rgba(var(--accent-rgb), 0.04) 0%,
          var(--glass-bg-dark) 18%,
          rgba(16, 22, 34, 0.70) 50%,
          var(--glass-bg-dark) 82%,
          rgba(var(--accent-rgb), 0.04) 100%
        );
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        /* slight parallelogram skew via clip-path */
        clip-path: polygon(0% 8%, 100% 0%, 100% 92%, 0% 100%);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      /* Top neon edge-glow line */
      #t1-sec-rib .ribbon-edge {
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.80) 20%,
          var(--white) 50%,
          rgba(var(--accent-rgb), 0.80) 80%,
          transparent 100%
        );
        box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.60), 0 0 60px rgba(var(--accent-rgb), 0.30);
        z-index: 2;
      }
      /* Bottom edge — dimmer mirror */
      #t1-sec-rib .ribbon-edge-bottom {
        position: absolute; left: 0; right: 0; bottom: 0; height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.35) 30%,
          rgba(var(--accent-rgb), 0.35) 70%,
          transparent 100%
        );
        z-index: 2;
      }
      /* Soft inner bloom inside the ribbon */
      #t1-sec-rib .ribbon-glow {
        position: absolute; left: 50%; top: 0; transform: translateX(-50%);
        width: 1400px; height: 100%;
        background: radial-gradient(50% 120% at 50% -10%, rgba(var(--accent-rgb), 0.22) 0%, transparent 65%);
        filter: blur(6px);
        z-index: 1;
      }

      /* ── Typography ────────────────────────────────────────────────────── */
      #t1-sec-rib .kicker {
        position: absolute; left: 0; right: 0;
        /* positioned above ribbon — JS sets top after ribbon size is known */
        top: calc(50% - 160px);
        text-align: center; z-index: 4;
        font-family: var(--font-display); font-weight: var(--wt-semi); font-style: italic;
        font-size: var(--size-label); letter-spacing: 0.20em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
      }
      #t1-sec-rib .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.04; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; padding: 0 80px;
        position: relative; z-index: 3;
      }
      #t1-sec-rib .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* ── Global chrome ────────────────────────────────────────────────── */
      #t1-sec-rib .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-rib .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-rib"
         data-composition-id="t1-sec-rib"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="kicker" data-slot="kicker">Section Three</div>

      <div class="ribbon-wrap">
        <div class="ribbon">
          <div class="ribbon-edge"></div>
          <div class="ribbon-edge-bottom"></div>
          <div class="ribbon-glow"></div>
          <div class="headline" data-slot="headline">The Model That <em>Redefines</em> the Game</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-rib .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-rib .bloom",
        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      tl.from("#t1-sec-rib .grid",
        { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* ribbon unfurls: scaleX from center, with skewX snap-settle */
      tl.from("#t1-sec-rib .ribbon",
        { scaleX: 0, skewX: -4, transformOrigin: "0% 50%",
          duration: 0.95, ease: "expo.out" }, 0.35);

      /* edge-glow lines draw in after ribbon is placed */
      tl.from("#t1-sec-rib .ribbon-edge",
        { scaleX: 0, transformOrigin: "50% 50%", duration: 0.7, ease: "power3.out" }, 0.75);
      tl.from("#t1-sec-rib .ribbon-edge-bottom",
        { scaleX: 0, transformOrigin: "50% 50%", duration: 0.7, ease: "power3.out" }, 0.85);

      /* inner bloom rises */
      tl.from("#t1-sec-rib .ribbon-glow",
        { autoAlpha: 0, duration: 0.9, ease: "power2.out" }, 0.9);

      /* kicker glides down */
      tl.from("#t1-sec-rib .kicker",
        { autoAlpha: 0, y: -20, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.55);

      /* headline blur-focus in */
      tl.from("#t1-sec-rib .headline",
        { autoAlpha: 0, filter: "blur(18px)", y: 10, duration: 1.0, ease: "power4.out" }, 1.0);

      /* breathing edge-glow pulse — finite */
      tl.to("#t1-sec-rib .ribbon-edge",
        { opacity: 0.5, duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      /* slow ribbon drift */
      tl.to("#t1-sec-rib .ribbon-wrap",
        { y: -10, duration: 4.2, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-rib"] = tl;
    </script>
  </body>
</html>
