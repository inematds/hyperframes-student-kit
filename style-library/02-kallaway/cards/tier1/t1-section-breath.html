<!doctype html>
<!--
  KALLAWAY · tier1 · section · BREATH
  Minimal full-screen takeover. The headline occupies all the space — it breathes
  slowly with a softly pulsing blue halo. Deep vignette, no decoration. Silence
  and weight communicate the idea. Scale pulse is finite and deterministic.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-breath {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }

      /* Deep bloom — subtler than normal, positioned centre */
      #t1-sec-breath .bloom {
        position: absolute; inset: 0;
        background: radial-gradient(70% 70% at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.08) 40%,
          transparent 68%);
        z-index: 1;
      }

      /* Halo disc — large diffuse ring that breathes behind the title */
      #t1-sec-breath .halo-disc {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 900px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.10) 46%,
          transparent 70%);
        filter: blur(38px);
        z-index: 2;
      }

      /* Faint dot grid */
      #t1-sec-breath .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.38;
        -webkit-mask-image: radial-gradient(80% 80% at 50% 50%, #000 20%, transparent 74%);
                mask-image: radial-gradient(80% 80% at 50% 50%, #000 20%, transparent 74%);
      }

      /* Content block */
      #t1-sec-breath .content {
        position: relative; z-index: 4;
        text-align: center;
      }

      #t1-sec-breath .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 36px;
      }

      #t1-sec-breath .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 112px; line-height: 1.04; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1380px; margin: 0 auto;
      }

      #t1-sec-breath .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Deep vignette — very dense edges */
      #t1-sec-breath .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: radial-gradient(110% 110% at 50% 50%, transparent 30%, rgba(0,0,0,0.72) 100%);
      }

      #t1-sec-breath .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-breath" data-composition-id="t1-sec-breath" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="halo-disc"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">Module 04</div>
        <div class="headline" data-slot="headline">Why <em>Attention</em> Changes<br>Everything</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain drift */
      tl.fromTo("#t1-sec-breath .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom fades in */
      tl.from("#t1-sec-breath .bloom",
        { autoAlpha: 0, scale: 0.82, transformOrigin: "50% 50%", duration: 1.6, ease: "expo.out" }, 0);

      tl.from("#t1-sec-breath .grid",
        { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.3);

      /* halo disc grows up */
      tl.from("#t1-sec-breath .halo-disc",
        { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 1.8, ease: "power4.out" }, 0.2);

      /* kicker fades in quietly */
      tl.from("#t1-sec-breath .kicker",
        { autoAlpha: 0, y: 14, duration: 0.9, ease: "power3.out" }, 0.8);

      /* headline scales gently in — the "inhale" */
      tl.from("#t1-sec-breath .headline",
        { autoAlpha: 0, scale: 0.94, transformOrigin: "50% 50%", duration: 1.2, ease: "power4.out" }, 1.05);

      /* slow breathing scale on content — 3 cycles */
      tl.to("#t1-sec-breath .content",
        { scale: 1.018, transformOrigin: "50% 50%", duration: 1.7, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.5);

      /* halo disc breathes brighter in sync */
      tl.to("#t1-sec-breath .halo-disc",
        { opacity: 0.5, duration: 1.7, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-breath"] = tl;
    </script>
  </body>
</html>
