<!doctype html>
<!--
  KALLAWAY · tier1 · overview · STACKED LAYERS
  Full-screen takeover. Four horizontal glass slabs stacked with a slight 3D
  perspective offset (each shifted right and up slightly from the one below)
  to suggest a stack of physical layers. Builds bottom→top; each slab has a
  layer tag + label. The top slab gets the accent glow.
  Slots: title, layer1 (bottom), layer2, layer3, layer4 (top).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-layers {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-layers .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-layers .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(115% 105% at 50% 60%, #000 28%, transparent 78%);
                mask-image: radial-gradient(115% 105% at 50% 60%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-layers .card-title {
        position: absolute; left: 0; right: 0; top: 62px; z-index: 5;
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow); line-height: 1.1;
      }
      #t1-ov-layers .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Stack container — centered, uses perspective for 3D feel */
      #t1-ov-layers .stack-wrap {
        position: absolute; z-index: 4;
        left: 50%; top: 50%;
        transform: translate(-50%, -42%);
        /* The stacking illusion: each slab shifted offset, done per-slab below */
      }

      /* Each slab */
      #t1-ov-layers .slab {
        position: relative;
        width: 1100px; height: 148px;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow);
        display: flex; align-items: center;
        padding: 0 52px;
        overflow: hidden;
        /* stagger offset applied per slab */
      }
      #t1-ov-layers .slab::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }

      /* 3D offset: bottom slab is baseline; each slab above shifts -14px Y, +14px X */
      #t1-ov-layers #slab4 { margin-bottom: 0; transform: translate(0px, 0px); }
      #t1-ov-layers #slab3 { transform: translate(14px, -10px); }
      #t1-ov-layers #slab2 { transform: translate(28px, -20px); }
      #t1-ov-layers #slab1 {
        transform: translate(42px, -30px);
        border-color: rgba(var(--accent-rgb), 0.55);
        box-shadow: var(--glass-shadow), 0 0 60px rgba(var(--accent-rgb), 0.28);
      }

      /* Layer number tag */
      #t1-ov-layers .layer-tag {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        color: rgba(var(--accent-rgb), 0.68);
        text-transform: uppercase; margin-right: 34px; flex-shrink: 0;
        min-width: 110px;
      }
      #t1-ov-layers #slab1 .layer-tag {
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Slab label */
      #t1-ov-layers .slab-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 38px; letter-spacing: var(--track-snug); line-height: 1.2;
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-ov-layers #slab1 .slab-label {
        font-weight: var(--wt-bold); font-size: 42px;
      }

      /* Right-side dim accent line per slab */
      #t1-ov-layers .slab-accent {
        margin-left: auto; padding-left: 36px; flex-shrink: 0;
        font-family: var(--font-mono); font-size: 22px;
        color: var(--text-faint); letter-spacing: 0.06em;
      }

      #t1-ov-layers .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-layers .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-layers" data-composition-id="t1-ov-layers" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="card-title" data-slot="title">The <em>Tech Stack</em> Explained</div>

      <!-- Stack: slab1=top/apex, slab4=bottom. DOM order top→bottom for stagger. -->
      <div class="stack-wrap">
        <!-- Layer 4 = bottom, widest feel; layer 1 = top, accent. Build bottom→top. -->
        <!-- DOM top→bottom so we can do stagger bottom-to-top via tl positions -->
        <div class="slab" id="slab1">
          <div class="layer-tag">Layer 4</div>
          <div class="slab-label" data-slot="layer4">Application</div>
          <div class="slab-accent">UI · API · Logic</div>
        </div>
        <div class="slab" id="slab2">
          <div class="layer-tag">Layer 3</div>
          <div class="slab-label" data-slot="layer3">Platform</div>
          <div class="slab-accent">Cloud · Containers · CI/CD</div>
        </div>
        <div class="slab" id="slab3">
          <div class="layer-tag">Layer 2</div>
          <div class="slab-label" data-slot="layer2">Data</div>
          <div class="slab-accent">Databases · Pipelines · Models</div>
        </div>
        <div class="slab" id="slab4">
          <div class="layer-tag">Layer 1</div>
          <div class="slab-label" data-slot="layer1">Infrastructure</div>
          <div class="slab-accent">Compute · Network · Storage</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-layers .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "98px 76px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-layers .bloom", { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-layers .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-layers .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.46)

        /* slabs spring in bottom-to-top */
        .from("#slab4", { autoAlpha: 0, y: 56, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 0.70)
        .from("#slab3", { autoAlpha: 0, y: 48, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 0.88)
        .from("#slab2", { autoAlpha: 0, y: 40, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.06)
        .from("#slab1", { autoAlpha: 0, y: 32, scale: 0.93, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.24)

        /* top slab accent glow pulse */
        .to("#slab1", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 90px rgba(55,189,248,0.42)",
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        /* gentle float up during hold */
        .to("#t1-ov-layers .stack-wrap", { y: -12, duration: 4.8, ease: "sine.inOut" }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t1-ov-layers"] = tl;
    </script>
  </body>
</html>
