<!doctype html>
<!--
  KALLAWAY · tier1 · overview · PROFILES
  Full-screen takeover. Three profile cards in a row — each with a glowing
  avatar circle, name, and role. Cards spring in staggered; title glides first.
  The avatar circles glow with a blue neon rim. Accent highlights on the
  middle card.
  Slots: title, p1_name, p1_role, p2_name, p2_role, p3_name, p3_role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-prof {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-prof .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-prof .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.42;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 58%, #000 30%, transparent 76%);
                mask-image: radial-gradient(130% 100% at 50% 58%, #000 30%, transparent 76%);
      }

      /* Title */
      #t1-ov-prof .title-row {
        position: absolute; left: 0; right: 0; top: 88px; text-align: center; z-index: 4;
      }
      #t1-ov-prof .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-prof .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Profile card row */
      #t1-ov-prof .cards {
        position: absolute; left: 160px; right: 160px; top: 260px; bottom: 80px;
        display: flex; gap: 60px; align-items: center; justify-content: center; z-index: 4;
      }

      /* Individual profile glass card */
      #t1-ov-prof .pcard {
        flex: 1;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 60px 52px 56px;
        display: flex; flex-direction: column; align-items: center; gap: 0;
        position: relative; overflow: hidden;
        text-align: center;
      }
      /* Top hairline */
      #t1-ov-prof .pcard::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 30%, var(--glass-hi) 70%, transparent);
      }

      /* Featured (middle) card */
      #t1-ov-prof .pcard.featured {
        border-color: rgba(var(--accent-rgb), 0.38);
        box-shadow: var(--glass-shadow), 0 0 80px rgba(var(--accent-rgb), 0.22);
      }

      /* Avatar circle */
      #t1-ov-prof .avatar-ring {
        width: 160px; height: 160px; border-radius: 50%; margin-bottom: 38px; flex-shrink: 0;
        position: relative;
        /* The glow ring */
        box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.50),
                    0 0 28px rgba(var(--accent-rgb), 0.30),
                    0 0 70px rgba(var(--accent-rgb), 0.14);
      }
      #t1-ov-prof .avatar-ring .avatar-fill {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 38% 30%,
          rgba(255,255,255,0.18) 0%,
          rgba(var(--accent-rgb), 0.22) 40%,
          rgba(var(--canvas-deep), 0.85) 100%);
        border: var(--stroke) solid rgba(var(--accent-rgb), 0.45);
        display: flex; align-items: center; justify-content: center;
      }
      #t1-ov-prof .avatar-ring .avatar-fill svg {
        width: 72px; height: 72px; stroke: rgba(var(--accent-rgb), 0.80); fill: none; stroke-width: 1.4;
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.50));
      }

      /* Featured avatar — brighter glow */
      #t1-ov-prof .pcard.featured .avatar-ring {
        box-shadow: 0 0 0 2px var(--accent),
                    0 0 36px rgba(var(--accent-rgb), 0.50),
                    0 0 100px rgba(var(--accent-rgb), 0.24);
      }

      /* Name */
      #t1-ov-prof .pname {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 50px; letter-spacing: var(--track-snug); line-height: 1.1;
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 16px;
      }
      #t1-ov-prof .pcard.featured .pname {
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Role */
      #t1-ov-prof .prole {
        font-family: var(--font-body); font-weight: var(--wt-med);
        font-size: 28px; line-height: 1.5;
        color: var(--text-dim);
        padding: 0 12px;
      }

      /* Divider line between name and role */
      #t1-ov-prof .pdivider {
        width: 52px; height: 2px; border-radius: 2px; margin: 22px auto 22px;
        background: rgba(var(--accent-rgb), 0.50);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.35);
      }

      #t1-ov-prof .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-prof .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-prof" data-composition-id="t1-ov-prof" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Meet the <em>Team</em></div>
      </div>

      <div class="cards">
        <!-- Profile 1 -->
        <div class="pcard" id="prof-c1">
          <div class="avatar-ring">
            <div class="avatar-fill">
              <svg viewBox="0 0 72 72">
                <circle cx="36" cy="28" r="14"/>
                <path d="M10 64 C10 46 62 46 62 64"/>
              </svg>
            </div>
          </div>
          <div class="pname" data-slot="p1_name">Sarah Chen</div>
          <div class="pdivider"></div>
          <div class="prole" data-slot="p1_role">Head of Product Strategy</div>
        </div>

        <!-- Profile 2 — featured -->
        <div class="pcard featured" id="prof-c2">
          <div class="avatar-ring">
            <div class="avatar-fill">
              <svg viewBox="0 0 72 72">
                <circle cx="36" cy="28" r="14"/>
                <path d="M10 64 C10 46 62 46 62 64"/>
              </svg>
            </div>
          </div>
          <div class="pname" data-slot="p2_name">Marcus Reid</div>
          <div class="pdivider"></div>
          <div class="prole" data-slot="p2_role">Founder & CEO</div>
        </div>

        <!-- Profile 3 -->
        <div class="pcard" id="prof-c3">
          <div class="avatar-ring">
            <div class="avatar-fill">
              <svg viewBox="0 0 72 72">
                <circle cx="36" cy="28" r="14"/>
                <path d="M10 64 C10 46 62 46 62 64"/>
              </svg>
            </div>
          </div>
          <div class="pname" data-slot="p3_name">Priya Nair</div>
          <div class="pdivider"></div>
          <div class="prole" data-slot="p3_role">Lead Engineer</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-prof .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "108px 82px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-prof .bloom", { autoAlpha: 0, scale: 0.92, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-prof .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* title glides in first */
        .from("#t1-ov-prof .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.55)

        /* cards spring in staggered */
        .from("#prof-c1", { autoAlpha: 0, y: 52, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.92, ease: "back.out(1.4)" }, 1.05)
        .from("#prof-c2", { autoAlpha: 0, y: 52, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.92, ease: "back.out(1.4)" }, 1.22)
        .from("#prof-c3", { autoAlpha: 0, y: 52, scale: 0.94, transformOrigin: "50% 50%",
          filter: "blur(12px)", duration: 0.92, ease: "back.out(1.4)" }, 1.39)

        /* avatar ring glow breathe on all — staggered finite */
        .to("#prof-c1 .avatar-ring", { boxShadow: "0 0 0 2px rgba(55,189,248,0.70), 0 0 44px rgba(55,189,248,0.42), 0 0 90px rgba(55,189,248,0.18)",
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.4)
        .to("#prof-c2 .avatar-ring", { boxShadow: "0 0 0 2.5px var(--accent), 0 0 56px rgba(55,189,248,0.60), 0 0 120px rgba(55,189,248,0.28)",
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.55)
        .to("#prof-c3 .avatar-ring", { boxShadow: "0 0 0 2px rgba(55,189,248,0.70), 0 0 44px rgba(55,189,248,0.42), 0 0 90px rgba(55,189,248,0.18)",
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.70)

        /* slow hold drift */
        .to("#t1-ov-prof .cards", { y: -10, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-prof"] = tl;
    </script>
  </body>
</html>
