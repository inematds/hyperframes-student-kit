<!doctype html>
<!--
  KALLAWAY · tier1 · stat · CLOCKFACE
  A circular clock-face with 12 tick marks; a glowing sweep arc fills clockwise
  from 12 o'clock to the data value. Count-up number in center. Dense glow aura.
  Knob: data-pct on #clock-svg (default 75).
  Slots: kicker (~28 chars), stat (e.g. "75%"), label (~65 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-clock {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-clock .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-clock .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Full-canvas centred column */
      #t1-stat-clock .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 50px; padding-bottom: 20px;
      }

      #t1-stat-clock .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Clock face container */
      #t1-stat-clock .clock-wrap {
        position: relative; width: 540px; height: 540px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      #t1-stat-clock .clock-glow {
        position: absolute; inset: -50px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.22) 0%, transparent 65%);
        box-shadow: 0 0 120px 30px rgba(var(--accent-rgb), 0.20);
      }
      #t1-stat-clock .clock-svg {
        width: 540px; height: 540px; position: relative; z-index: 2;
      }
      /* Center stat number */
      #t1-stat-clock .clock-center {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px;
      }
      #t1-stat-clock .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 110px; line-height: 0.95; letter-spacing: var(--track-tight);
        background: linear-gradient(155deg, #ffffff 15%, rgba(var(--accent-rgb), 0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-clock .stat-unit {
        font-family: var(--font-mono); font-size: 26px;
        color: var(--accent); letter-spacing: 0.12em;
        text-shadow: var(--textglow-accent);
      }

      /* Label */
      #t1-stat-clock .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 980px; line-height: 1.45;
      }
      #t1-stat-clock .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-clock .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-clock .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-clock .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-clock" data-composition-id="t1-stat-clock" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">TIME-ON-PLATFORM · WEEKLY AVG</div>

        <div class="clock-wrap">
          <div class="clock-glow"></div>

          <!--
            Clock SVG: 540×540, centre (270,270), outer r=240, inner r=215 (track), arc r=215.
            12 ticks around the face at every 30°.
            Progress arc fills clockwise from -90° (top).
          -->
          <svg class="clock-svg" id="clock-svg" data-pct="75"
               viewBox="0 0 540 540" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#37BDF8" stop-opacity="1"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
              </linearGradient>
              <filter id="cGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
                <feComposite in="SourceGraphic" in2="b" operator="over"/>
              </filter>
            </defs>

            <!-- outer face ring -->
            <circle cx="270" cy="270" r="240" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" fill="rgba(255,255,255,0.02)"/>

            <!-- track arc -->
            <circle id="c-track" cx="270" cy="270" r="215"
                    stroke="rgba(255,255,255,0.08)" stroke-width="20"
                    stroke-linecap="round" fill="none"/>

            <!-- progress arc — dashoffset animated -->
            <circle id="c-arc" cx="270" cy="270" r="215"
                    stroke="url(#cGrad)" stroke-width="20"
                    stroke-linecap="round" fill="none"
                    transform="rotate(-90 270 270)"
                    filter="url(#cGlow)"/>

            <!-- 12 tick marks at 30° intervals -->
            <!-- tick length: major (0,3,6,9) = 22px, minor = 12px. Inner edge at r=228 -->
            <!-- Using JS-generated ticks would need Math.sin, so we hardcode all 12 -->
            <!-- r_inner_major=218, r_outer_major=240; r_inner_minor=225, r_outer_major=237 -->
            <!-- 0°(top)=270,30; 30°=377.5,110.5; 60°=454,186.5; 90°=510,270; etc -->

            <!-- 12 o'clock (0°) major -->
            <line x1="270" y1="30"  x2="270" y2="52"  stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
            <!-- 1 o'clock (30°) minor -->
            <line x1="378" y1="55"  x2="371" y2="67"  stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 2 o'clock (60°) minor -->
            <line x1="455" y1="132" x2="446" y2="139" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 3 o'clock (90°) major -->
            <line x1="488" y1="270" x2="510" y2="270" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
            <!-- 4 o'clock (120°) minor -->
            <line x1="455" y1="408" x2="446" y2="401" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 5 o'clock (150°) minor -->
            <line x1="378" y1="485" x2="371" y2="473" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 6 o'clock (180°) major -->
            <line x1="270" y1="510" x2="270" y2="488" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
            <!-- 7 o'clock (210°) minor -->
            <line x1="162" y1="485" x2="169" y2="473" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 8 o'clock (240°) minor -->
            <line x1="85"  y1="408" x2="94"  y2="401" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 9 o'clock (270°) major -->
            <line x1="30"  y1="270" x2="52"  y2="270" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
            <!-- 10 o'clock (300°) minor -->
            <line x1="85"  y1="132" x2="94"  y2="139" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
            <!-- 11 o'clock (330°) minor -->
            <line x1="162" y1="55"  x2="169" y2="67"  stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>

            <!-- glowing tip dot at arc head — starts at top, moves with arc -->
            <circle id="c-tip" cx="270" cy="55" r="13"
                    fill="white"
                    style="filter:drop-shadow(0 0 12px rgba(55,189,248,0.95)) drop-shadow(0 0 28px rgba(55,189,248,0.55));"/>

            <!-- centre hub -->
            <circle cx="270" cy="270" r="10" fill="rgba(55,189,248,0.70)"
                    style="filter:drop-shadow(0 0 10px rgba(55,189,248,0.80));"/>
          </svg>

          <div class="clock-center">
            <div class="stat" id="clock-num" data-slot="stat">75%</div>
            <div class="stat-unit">UTILISED</div>
          </div>
        </div>

        <div class="label" data-slot="label">
          of scheduled weekly learning time actually used by active cohort members — <em>up 18 pts</em> from last quarter
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS ENGAGEMENT DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const svgEl   = document.getElementById("clock-svg");
      const pct     = parseFloat(svgEl.getAttribute("data-pct")) || 75;
      const r       = 215;
      const circ    = 2 * Math.PI * r;
      const arcEl   = document.getElementById("c-arc");
      const tipEl   = document.getElementById("c-tip");
      const numEl   = document.getElementById("clock-num");

      arcEl.style.strokeDasharray  = circ;
      arcEl.style.strokeDashoffset = circ;  /* starts empty */

      function tipCoords(p) {
        const angle = (p / 100) * 2 * Math.PI - Math.PI / 2; /* from top (12 o'clock) */
        return {
          cx: 270 + 215 * Math.cos(angle),
          cy: 270 + 215 * Math.sin(angle)
        };
      }
      /* init tip at 12 o'clock */
      tipEl.setAttribute("cx", "270");
      tipEl.setAttribute("cy", "55");

      /* grain */
      tl.fromTo("#t1-stat-clock .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "107px 83px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-clock .bloom",
          { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-stat-clock .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-clock .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* clock glow */
        .from("#t1-stat-clock .clock-glow",
          { autoAlpha: 0, scale: 0.4, duration: 1.2, ease: "expo.out" }, 0.55)

        /* clock face */
        .from("#t1-stat-clock .clock-svg",
          { autoAlpha: 0, scale: 0.75, filter: "blur(16px)", transformOrigin: "50% 50%",
            duration: 0.95, ease: "back.out(1.4)" }, 0.60)

        /* center number + arc fill + tip travel */
        .from("#t1-stat-clock .stat",
          { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.05)

        .to({ val: 0 }, {
          val: pct,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            arcEl.style.strokeDashoffset = circ - (v / 100) * circ;
            const pos = tipCoords(v);
            tipEl.setAttribute("cx", pos.cx);
            tipEl.setAttribute("cy", pos.cy);
            numEl.textContent = Math.round(v) + "%";
          }
        }, 1.05)

        /* label */
        .from("#t1-stat-clock .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.10)

        /* source */
        .from("#t1-stat-clock .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.40)

        /* breathing glow on clock-glow */
        .to("#t1-stat-clock .clock-glow",
          { opacity: 0.55, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.80)

        .set({}, {}, 7);

      window.__timelines["t1-stat-clock"] = tl;
    </script>
  </body>
</html>
