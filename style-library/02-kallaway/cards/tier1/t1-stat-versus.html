<!doctype html>
<!--
  KALLAWAY · tier1 · stat · VERSUS
  Two glowing figures compared side by side (A vs B). E.g. "INTUITION vs DATA".
  A glass divider with a "VS" badge splits the two halves. Both stats count up
  (or dissolve in if non-numeric). Left side is accent blue, right side is white/warm.
  Aurora bloom, glass surfaces, breathing glow.
  Slots: kicker (~28 chars uppercase), statA (left value), labelA (~28 chars left cap),
         statB (right value), labelB (~28 chars right cap), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-vs {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-vs .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-vs .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content */
      #t1-stat-vs .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 52px; padding-bottom: 40px;
      }

      #t1-stat-vs .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Side-by-side container */
      #t1-stat-vs .versus-row {
        display: flex; align-items: stretch; gap: 0;
        width: 1440px;
      }

      /* Each side */
      #t1-stat-vs .side {
        flex: 1;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 20px;
        padding: 60px 80px;
        border-radius: var(--radius);
        background: var(--glass-bg);
        border: 1.5px solid var(--glass-border);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
      }
      #t1-stat-vs .side-a {
        border-radius: var(--radius) 0 0 var(--radius);
        border-right-width: 0;
        box-shadow: var(--glass-shadow),
                    inset 0 1px 0 var(--glass-hi),
                    0 0 80px rgba(var(--accent-rgb), 0.12);
      }
      #t1-stat-vs .side-b {
        border-radius: 0 var(--radius) var(--radius) 0;
        border-left-width: 0;
        box-shadow: var(--glass-shadow),
                    inset 0 1px 0 var(--glass-hi),
                    0 0 60px rgba(255,255,255,0.06);
      }

      /* VS divider column */
      #t1-stat-vs .vs-divider {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        padding: 0 4px;
        flex-shrink: 0;
        position: relative;
        z-index: 2;
      }
      #t1-stat-vs .vs-line {
        width: 2px; flex: 1;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(var(--accent-rgb), 0.6) 30%,
          rgba(255,255,255,0.9) 50%,
          rgba(var(--accent-rgb), 0.6) 70%,
          transparent 100%);
        box-shadow: 0 0 12px 2px rgba(var(--accent-rgb), 0.50);
      }
      /* VS badge pill */
      #t1-stat-vs .vs-badge {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.08em;
        color: var(--white);
        text-shadow: var(--textglow-accent);
        background: var(--glass-bg-dark);
        border: 1.5px solid rgba(var(--accent-rgb), 0.45);
        border-radius: 50%;
        width: 66px; height: 66px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 20px 4px rgba(var(--accent-rgb), 0.35),
                    inset 0 1px 0 var(--glass-hi);
        flex-shrink: 0;
        margin: 16px 0;
      }

      /* Stat numbers */
      #t1-stat-vs .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 140px;
        line-height: 1;
        letter-spacing: var(--track-tight);
      }
      #t1-stat-vs .side-a .stat {
        background: linear-gradient(160deg, #ffffff 12%, rgba(var(--accent-rgb),0.85) 82%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.60));
      }
      #t1-stat-vs .side-b .stat {
        background: linear-gradient(160deg, rgba(240,238,233,0.95) 15%, rgba(255,255,255,0.70) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 16px rgba(255,255,255,0.38));
      }

      /* Side labels */
      #t1-stat-vs .side-label {
        font-family: var(--font-body);
        font-size: 28px;
        font-weight: var(--wt-semi);
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--text-dim);
        text-align: center;
      }
      #t1-stat-vs .side-a .side-label {
        color: rgba(var(--accent-rgb), 0.80);
      }

      #t1-stat-vs .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-vs .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-vs .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-vs" data-composition-id="t1-stat-vs" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">DECISION QUALITY · 2026</div>

        <div class="versus-row">
          <!-- Side A -->
          <div class="side side-a">
            <div class="side-label" data-slot="labelA">Intuition</div>
            <div class="stat" id="t1-stat-vs-statA" data-slot="statA">54%</div>
          </div>

          <!-- VS divider -->
          <div class="vs-divider">
            <div class="vs-line"></div>
            <div class="vs-badge">VS</div>
            <div class="vs-line"></div>
          </div>

          <!-- Side B -->
          <div class="side side-b">
            <div class="side-label" data-slot="labelB">Data</div>
            <div class="stat" id="t1-stat-vs-statB" data-slot="statB">89%</div>
          </div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · MIT SLOAN STUDY 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Parse both stat slots for count-up */
      function parseStat(el) {
        const raw     = el.textContent.trim();
        const suffix  = raw.replace(/^[+\-]?[\d.,]+/, "");
        const sign    = raw.startsWith("-") ? "-" : (raw.startsWith("+") ? "+" : "");
        const numeric = parseFloat(raw.replace(/,/g, "").replace(/^[+\-]/, "")) || 0;
        const isNum   = numeric > 0;
        return { raw, suffix, sign, numeric, isNum };
      }

      const aEl   = document.getElementById("t1-stat-vs-statA");
      const bEl   = document.getElementById("t1-stat-vs-statB");
      const infoA = parseStat(aEl);
      const infoB = parseStat(bEl);

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-vs .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-vs .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-vs .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-vs .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* Side A springs in from left */
        .from("#t1-stat-vs .side-a",
          { autoAlpha: 0, x: -60, filter: "blur(18px)", duration: 1.0, ease: "power4.out" }, 0.72)

        /* Side B springs in from right */
        .from("#t1-stat-vs .side-b",
          { autoAlpha: 0, x: 60, filter: "blur(18px)", duration: 1.0, ease: "power4.out" }, 0.88)

        /* VS divider draws in */
        .from("#t1-stat-vs .vs-line",
          { scaleY: 0, transformOrigin: "50% 50%", autoAlpha: 0,
            duration: 0.55, ease: "power3.out", stagger: 0.08 }, 1.10)
        .from("#t1-stat-vs .vs-badge",
          { autoAlpha: 0, scale: 0.4, filter: "blur(10px)",
            duration: 0.55, ease: "back.out(1.6)" }, 1.30)

        /* side labels fade */
        .from("#t1-stat-vs .side-label",
          { autoAlpha: 0, y: 10, duration: 0.55, ease: "power2.out", stagger: 0.12 }, 1.10)

        /* stat A count-up */
        ;

      if (infoA.isNum) {
        tl.to({ val: 0 }, { val: infoA.numeric,
          duration: 1.6, ease: "power2.out",
          onUpdate: function() {
            aEl.textContent = infoA.sign + Math.round(this.targets()[0].val) + infoA.suffix;
          }
        }, 1.20)
          .from("#t1-stat-vs .side-a .stat",
            { autoAlpha: 0, filter: "blur(18px)", duration: 0.75, ease: "power3.out" }, 1.20);
      } else {
        tl.from("#t1-stat-vs .side-a .stat",
          { autoAlpha: 0, filter: "blur(18px)", duration: 0.75, ease: "power3.out" }, 1.20);
      }

      /* stat B count-up */
      if (infoB.isNum) {
        tl.to({ val: 0 }, { val: infoB.numeric,
          duration: 1.6, ease: "power2.out",
          onUpdate: function() {
            bEl.textContent = infoB.sign + Math.round(this.targets()[0].val) + infoB.suffix;
          }
        }, 1.36)
          .from("#t1-stat-vs .side-b .stat",
            { autoAlpha: 0, filter: "blur(18px)", duration: 0.75, ease: "power3.out" }, 1.36);
      } else {
        tl.from("#t1-stat-vs .side-b .stat",
          { autoAlpha: 0, filter: "blur(18px)", duration: 0.75, ease: "power3.out" }, 1.36);
      }

      tl
        /* source */
        .from("#t1-stat-vs .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.20)

        /* breathing glow on VS badge */
        .to("#t1-stat-vs .vs-badge",
          { opacity: 0.55, scale: 1.10, transformOrigin: "50% 50%",
            duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.60)

        .set({}, {}, 7);

      window.__timelines["t1-stat-vs"] = tl;
    </script>
  </body>
</html>
