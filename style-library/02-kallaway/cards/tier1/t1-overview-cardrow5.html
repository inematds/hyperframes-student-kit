<!doctype html>
<!--
  KALLAWAY · tier1 · overview · CARDROW5
  Full-screen takeover. A single horizontal row of 5 small glass cards,
  each with a numbered watermark, a glowing accent rule, and a short label.
  Cards spring in from below, staggered left-to-right. Holds with slow drift.
  Slots: title, r1, r2, r3, r4, r5.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-row5 {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-ov-row5 .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-ov-row5 .grid-bg {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.44;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 58%, #000 28%, transparent 78%);
      }

      /* Title */
      #t1-ov-row5 .title-row {
        position: absolute; left: 0; right: 0; top: 200px; text-align: center; z-index: 4;
      }
      #t1-ov-row5 .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-row5 .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Single row of 5 cards */
      #t1-ov-row5 .card-row {
        position: absolute; left: 72px; right: 72px; top: 420px;
        display: flex; gap: 28px; align-items: stretch; z-index: 4;
        height: 380px;
      }

      /* Glass card */
      #t1-ov-row5 .card {
        flex: 1;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow), 0 0 32px rgba(var(--accent-rgb), 0.06);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 40px 44px 36px;
        display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
        position: relative; overflow: hidden;
      }
      /* Top hairline highlight */
      #t1-ov-row5 .card::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 25%, var(--glass-hi) 75%, transparent);
      }

      /* Middle card — accent rim */
      #t1-ov-row5 .card.hero {
        border-color: rgba(var(--accent-rgb), 0.28);
        box-shadow: var(--glass-shadow), 0 0 56px rgba(var(--accent-rgb), 0.16);
      }

      /* Corner number watermark */
      #t1-ov-row5 .card-num {
        position: absolute; top: 24px; right: 30px;
        font-family: var(--font-mono); font-size: var(--size-label);
        color: rgba(var(--accent-rgb), 0.28); font-weight: var(--wt-bold);
        letter-spacing: 0.04em;
      }

      /* Glowing accent rule above label */
      #t1-ov-row5 .card-rule {
        width: 32px; height: 2px; border-radius: 1px;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        margin-bottom: 14px;
      }

      /* Card label */
      #t1-ov-row5 .card-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 34px; letter-spacing: var(--track-snug); line-height: 1.25;
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-ov-row5 .card.hero .card-label {
        color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-ov-row5 .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-row5 .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-row5" data-composition-id="t1-ov-row5" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid-bg"></div>

      <div class="title-row">
        <div class="title" data-slot="title">The Five Stages of <em>the Pipeline</em></div>
      </div>

      <div class="card-row">

        <div class="card" id="cr-r1">
          <div class="card-num">01</div>
          <div class="card-rule"></div>
          <div class="card-label" data-slot="r1">Transcribe</div>
        </div>

        <div class="card" id="cr-r2">
          <div class="card-num">02</div>
          <div class="card-rule"></div>
          <div class="card-label" data-slot="r2">Cut Silences</div>
        </div>

        <div class="card hero" id="cr-r3">
          <div class="card-num">03</div>
          <div class="card-rule"></div>
          <div class="card-label" data-slot="r3">Cut Mistakes</div>
        </div>

        <div class="card" id="cr-r4">
          <div class="card-num">04</div>
          <div class="card-rule"></div>
          <div class="card-label" data-slot="r4">Motion Graphics</div>
        </div>

        <div class="card" id="cr-r5">
          <div class="card-num">05</div>
          <div class="card-rule"></div>
          <div class="card-label" data-slot="r5">Final Render</div>
        </div>

      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite */
      tl.fromTo("#t1-ov-row5 .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "90px 68px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-row5 .bloom",   { autoAlpha: 0, scale: 0.91, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-row5 .grid-bg", { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title glides in */
        .from("#t1-ov-row5 .title", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.52)

        /* 5 cards stagger — 0.12s apart, spring scale + blur-in from below */
        .from("#cr-r1", { autoAlpha: 0, y: 54, scale: 0.92, transformOrigin: "50% 100%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.0)
        .from("#cr-r2", { autoAlpha: 0, y: 54, scale: 0.92, transformOrigin: "50% 100%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.12)
        .from("#cr-r3", { autoAlpha: 0, y: 54, scale: 0.92, transformOrigin: "50% 100%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.24)
        .from("#cr-r4", { autoAlpha: 0, y: 54, scale: 0.92, transformOrigin: "50% 100%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.36)
        .from("#cr-r5", { autoAlpha: 0, y: 54, scale: 0.92, transformOrigin: "50% 100%",
          filter: "blur(12px)", duration: 0.82, ease: "back.out(1.4)" }, 1.48)

        /* hero card (r3) accent rim glow pulse — finite */
        .to("#cr-r3", { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 80px rgba(55,189,248,0.28)",
          duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.3)

        /* sequential accent rule ripple — left to right, finite */
        .to("#cr-r1 .card-rule", { width: "52px", boxShadow: "0 0 16px rgba(55,189,248,0.80)",
          duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 2.5)
        .to("#cr-r2 .card-rule", { width: "52px", boxShadow: "0 0 16px rgba(55,189,248,0.80)",
          duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 2.7)
        .to("#cr-r3 .card-rule", { width: "52px", boxShadow: "0 0 16px rgba(55,189,248,0.80)",
          duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 2.9)
        .to("#cr-r4 .card-rule", { width: "52px", boxShadow: "0 0 16px rgba(55,189,248,0.80)",
          duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 3.1)
        .to("#cr-r5 .card-rule", { width: "52px", boxShadow: "0 0 16px rgba(55,189,248,0.80)",
          duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 3.3)

        /* slow upward drift during hold */
        .to("#t1-ov-row5 .card-row", { y: -12, duration: 5.0, ease: "sine.inOut" }, 1.9)

        .set({}, {}, 7);

      window.__timelines["t1-ov-row5"] = tl;
    </script>
  </body>
</html>
