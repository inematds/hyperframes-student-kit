<!doctype html>
<!--
  KALLAWAY · tier1 · section · CONSTELLATION
  Full-screen chapter takeover. Glowing nodes connected by clean thin lines
  draw in one by one across the canvas — a constellation forming. The kicker
  and headline appear centered over the completed constellation.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-constel {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-constel .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Corner bloom top-right for asymmetry */
      #t1-sec-constel .bloom-corner {
        position: absolute; inset: 0; background: var(--bloom-corner); z-index: 1;
      }

      #t1-sec-constel .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.42;
        -webkit-mask-image: radial-gradient(130% 130% at 50% 50%, #000 40%, transparent 80%);
                mask-image: radial-gradient(130% 130% at 50% 50%, #000 40%, transparent 80%);
      }

      /* SVG canvas for lines and nodes */
      #t1-sec-constel .constel-svg {
        position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 3;
      }

      /* Content centered */
      #t1-sec-constel .content {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-54%);
        text-align: center; z-index: 5;
      }
      #t1-sec-constel .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 24px;
      }
      #t1-sec-constel .plate {
        position: absolute; left: 50%; top: 76px; transform: translateX(-50%);
        width: 1200px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(10,14,20,0.68), transparent 70%);
        filter: blur(22px); z-index: -1;
      }
      #t1-sec-constel .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1340px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-constel .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      #t1-sec-constel .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-constel .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-constel" data-composition-id="t1-sec-constel" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-corner"></div>
      <div class="grid"></div>

      <!-- Constellation drawn as SVG — hardcoded node positions + connecting lines -->
      <svg class="constel-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="lineGlow" x="-10%" y="-100%" width="120%" height="300%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Connection lines (hardcoded, deterministic) -->
        <g class="constel-lines" filter="url(#lineGlow)" stroke="rgba(55,189,248,0.55)" stroke-width="1.2" fill="none">
          <line class="cline" x1="210" y1="180" x2="480" y2="310"/>
          <line class="cline" x1="480" y1="310" x2="720" y2="200"/>
          <line class="cline" x1="720" y1="200" x2="960" y2="290"/>
          <line class="cline" x1="960" y1="290" x2="1200" y2="160"/>
          <line class="cline" x1="1200" y1="160" x2="1440" y2="280"/>
          <line class="cline" x1="1440" y1="280" x2="1700" y2="200"/>
          <line class="cline" x1="480"  y1="310" x2="600" y2="520"/>
          <line class="cline" x1="600"  y1="520" x2="840" y2="620"/>
          <line class="cline" x1="840"  y1="620" x2="960" y2="540"/>
          <line class="cline" x1="960"  y1="540" x2="1140" y2="700"/>
          <line class="cline" x1="1140" y1="700" x2="1320" y2="580"/>
          <line class="cline" x1="1320" y1="580" x2="1440" y2="280"/>
          <line class="cline" x1="720"  y1="200" x2="600"  y2="520"/>
          <line class="cline" x1="960"  y1="290" x2="960"  y2="540"/>
          <line class="cline" x1="1200" y1="160" x2="1320" y2="580"/>
          <line class="cline" x1="300"  y1="750" x2="480"  y2="310"/>
          <line class="cline" x1="300"  y1="750" x2="600"  y2="520"/>
          <line class="cline" x1="1140" y1="700" x2="1480" y2="820"/>
          <line class="cline" x1="1480" y1="820" x2="1700" y2="200"/>
          <line class="cline" x1="840"  y1="620" x2="680"  y2="880"/>
          <line class="cline" x1="680"  y1="880" x2="300"  y2="750"/>
          <line class="cline" x1="1700" y1="200" x2="1820" y2="480"/>
          <line class="cline" x1="1820" y1="480" x2="1480" y2="820"/>
        </g>

        <!-- Node circles — hardcoded positions -->
        <g class="constel-nodes" filter="url(#nodeGlow)">
          <!-- Large primary nodes -->
          <circle class="cnode cnode-large" cx="960"  cy="290" r="8" fill="rgba(255,255,255,0.95)" />
          <circle class="cnode cnode-large" cx="960"  cy="540" r="7" fill="rgba(55,189,248,0.90)" />
          <circle class="cnode cnode-large" cx="1200" cy="160" r="7" fill="rgba(255,255,255,0.90)" />
          <!-- Medium nodes -->
          <circle class="cnode cnode-med" cx="210"  cy="180" r="5" fill="rgba(55,189,248,0.80)" />
          <circle class="cnode cnode-med" cx="480"  cy="310" r="5" fill="rgba(255,255,255,0.85)" />
          <circle class="cnode cnode-med" cx="720"  cy="200" r="5" fill="rgba(55,189,248,0.80)" />
          <circle class="cnode cnode-med" cx="1440" cy="280" r="5" fill="rgba(255,255,255,0.85)" />
          <circle class="cnode cnode-med" cx="1700" cy="200" r="5" fill="rgba(55,189,248,0.80)" />
          <circle class="cnode cnode-med" cx="840"  cy="620" r="5" fill="rgba(55,189,248,0.80)" />
          <circle class="cnode cnode-med" cx="1140" cy="700" r="5" fill="rgba(255,255,255,0.85)" />
          <circle class="cnode cnode-med" cx="1320" cy="580" r="5" fill="rgba(55,189,248,0.80)" />
          <!-- Small nodes -->
          <circle class="cnode cnode-sm" cx="600"  cy="520" r="4" fill="rgba(55,189,248,0.70)" />
          <circle class="cnode cnode-sm" cx="300"  cy="750" r="4" fill="rgba(55,189,248,0.70)" />
          <circle class="cnode cnode-sm" cx="680"  cy="880" r="4" fill="rgba(55,189,248,0.65)" />
          <circle class="cnode cnode-sm" cx="1480" cy="820" r="4" fill="rgba(55,189,248,0.70)" />
          <circle class="cnode cnode-sm" cx="1820" cy="480" r="4" fill="rgba(55,189,248,0.65)" />
        </g>

        <!-- Node halo rings (outer glow rings, slightly larger) -->
        <g class="constel-halos" opacity="0.35">
          <circle cx="960"  cy="290" r="22" fill="none" stroke="rgba(55,189,248,0.60)" stroke-width="1"/>
          <circle cx="960"  cy="540" r="18" fill="none" stroke="rgba(55,189,248,0.50)" stroke-width="1"/>
          <circle cx="1200" cy="160" r="18" fill="none" stroke="rgba(55,189,248,0.50)" stroke-width="1"/>
        </g>
      </svg>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 6 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">Every <em>Connection</em> You Need to See</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-constel .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-sec-constel .bloom",        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-constel .bloom-corner", { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.1)
        .from("#t1-sec-constel .grid",         { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);

      /* Lines draw in via strokeDashoffset — each line draws in sequence */
      /* Set initial dash state in the DOM via inline style so GSAP tweens from known state */
      const lines = document.querySelectorAll("#t1-sec-constel .cline");
      lines.forEach(function(ln) {
        const len = ln.getTotalLength ? ln.getTotalLength() : 500;
        ln.style.strokeDasharray  = len;
        ln.style.strokeDashoffset = len;
      });

      tl.to("#t1-sec-constel .cline", {
        strokeDashoffset: 0, duration: 0.55, ease: "power2.out",
        stagger: { each: 0.07, from: "center" }
      }, 0.3);

      /* Nodes pop in after their connecting lines */
      tl.from("#t1-sec-constel .cnode", {
        scale: 0, autoAlpha: 0, transformOrigin: "center center",
        duration: 0.4, ease: "back.out(1.4)",
        stagger: { each: 0.055, from: "center" }
      }, 0.5);

      tl.from("#t1-sec-constel .constel-halos", { autoAlpha: 0, scale: 0.5, transformOrigin: "center center", duration: 0.9, ease: "expo.out" }, 1.4);

      /* Text slides in */
      tl.from("#t1-sec-constel .kicker",   { autoAlpha: 0, y: 20, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 1.6)
        .from("#t1-sec-constel .plate",    { autoAlpha: 0, duration: 0.9, ease: "power2.out" }, 1.8)
        .from("#t1-sec-constel .headline", { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 1.9);

      /* Node halo breathing pulse — finite */
      tl.to("#t1-sec-constel .constel-halos", { opacity: 0.75, scale: 1.12, transformOrigin: "center center", duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6);

      /* Slow whole-constellation drift */
      tl.to("#t1-sec-constel .constel-svg", { y: -12, duration: 4.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-constel"] = tl;
    </script>
  </body>
</html>
