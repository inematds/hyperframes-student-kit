<!doctype html>
<!--
  KALLAWAY · tier1 · overview · SPECTRUM / SCALE BAR
  Full-screen takeover. Horizontal spectrum bar with two endpoint labels
  and 3 glowing markers positioned along it (each with a label above and
  a value chip below). The bar fills in, then markers bloom on.
  Slots: title, x_lo (left label), x_hi (right label),
         m1_label, m1_val, m1_pos ("0"–"100" percent along bar),
         m2_label, m2_val, m2_pos,
         m3_label, m3_val, m3_pos.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-spectrum {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Ambience */
      #t1-ov-spectrum .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-spectrum .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.40;
        -webkit-mask-image: radial-gradient(130% 100% at 50% 55%, #000 25%, transparent 74%);
                mask-image: radial-gradient(130% 100% at 50% 55%, #000 25%, transparent 74%);
      }

      /* Title */
      #t1-ov-spectrum .title-row {
        position: absolute; left: 0; right: 0; top: 66px; text-align: center; z-index: 4;
      }
      #t1-ov-spectrum .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-spectrum .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Scene — contains bar + markers, centered vertically */
      #t1-ov-spectrum .scene {
        position: absolute; left: 160px; right: 160px; top: 50%; transform: translateY(-50%);
        z-index: 4; margin-top: 30px; /* nudge below title */
      }

      /* Endpoint labels */
      #t1-ov-spectrum .ep-row {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 24px;
      }
      #t1-ov-spectrum .ep-label {
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--text-dim);
      }

      /* Bar track */
      #t1-ov-spectrum .bar-track {
        position: relative; height: 12px; border-radius: 999px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.10);
        overflow: visible;
      }

      /* Bar fill — draws in via scaleX */
      #t1-ov-spectrum .bar-fill {
        position: absolute; inset: 0; border-radius: 999px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.30) 0%,
          rgba(var(--accent-rgb), 0.70) 50%,
          rgba(var(--accent2-rgb), 0.55) 100%);
        box-shadow: 0 0 20px rgba(var(--accent-rgb),0.35), 0 0 50px rgba(var(--accent-rgb),0.15);
        transform: scaleX(0); transform-origin: left center;
      }

      /* Markers — positioned by inline style left:X% */
      #t1-ov-spectrum .marker {
        position: absolute; top: 50%; transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center;
        gap: 0;
      }

      /* Label above the bar (positioned via margin-bottom trick) */
      #t1-ov-spectrum .m-label-wrap {
        position: absolute; bottom: calc(100% + 28px);
        left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        white-space: nowrap;
      }
      #t1-ov-spectrum .m-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 28px; color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
      }
      /* Connector line from label to dot */
      #t1-ov-spectrum .m-connector {
        width: 1.5px; height: 36px;
        background: linear-gradient(180deg, rgba(var(--accent-rgb),0.55), rgba(var(--accent-rgb),0.10));
        transform: scaleY(0); transform-origin: bottom center;
      }

      /* Dot on bar */
      #t1-ov-spectrum .m-dot {
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--canvas-deep);
        border: 2.5px solid var(--accent);
        box-shadow: 0 0 20px rgba(var(--accent-rgb),0.70), 0 0 50px rgba(var(--accent-rgb),0.30);
        z-index: 2; position: relative;
      }

      /* Value chip below the bar */
      #t1-ov-spectrum .m-val-wrap {
        position: absolute; top: calc(100% + 28px);
        left: 50%; transform: translateX(-50%);
        white-space: nowrap;
      }
      #t1-ov-spectrum .m-val {
        background: var(--glass-bg-dark);
        border: var(--stroke) solid rgba(var(--accent-rgb),0.45);
        border-radius: 999px;
        padding: 8px 22px;
        font-family: var(--font-mono); font-size: var(--size-label); font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb),0.25);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        white-space: nowrap;
      }

      /* Variant colors per marker */
      #t1-ov-spectrum #sp-m2 .m-dot {
        border-color: var(--white);
        box-shadow: var(--glow-white);
      }
      #t1-ov-spectrum #sp-m2 .m-val  {
        border-color: rgba(255,255,255,0.35); color: var(--white);
        box-shadow: var(--glow-white-sm, 0 0 10px rgba(255,255,255,0.25));
      }
      #t1-ov-spectrum #sp-m2 .m-connector {
        background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.08));
      }
      #t1-ov-spectrum #sp-m3 .m-dot {
        border-color: var(--accent-2);
        box-shadow: 0 0 20px rgba(var(--accent2-rgb),0.70), 0 0 50px rgba(var(--accent2-rgb),0.30);
      }
      #t1-ov-spectrum #sp-m3 .m-val  {
        border-color: rgba(var(--accent2-rgb),0.50); color: var(--accent-2);
        box-shadow: 0 0 12px rgba(var(--accent2-rgb),0.30);
      }
      #t1-ov-spectrum #sp-m3 .m-connector {
        background: linear-gradient(180deg, rgba(var(--accent2-rgb),0.55), rgba(var(--accent2-rgb),0.08));
      }

      #t1-ov-spectrum .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-spectrum .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-spectrum" data-composition-id="t1-ov-spectrum" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Where Does It <em>Land?</em></div>
      </div>

      <div class="scene" id="sp-scene">
        <!-- Endpoint labels -->
        <div class="ep-row" id="sp-ep">
          <div class="ep-label" data-slot="x_lo">Conservative</div>
          <div class="ep-label" data-slot="x_hi">Aggressive</div>
        </div>

        <!-- Bar -->
        <div class="bar-track" id="sp-track">
          <div class="bar-fill" id="sp-fill"></div>

          <!-- Marker 1 — left ~22% -->
          <div class="marker" id="sp-m1" style="left:22%">
            <div class="m-label-wrap">
              <div class="m-label" data-slot="m1_label">Index Funds</div>
              <div class="m-connector" id="sp-m1-conn"></div>
            </div>
            <div class="m-dot"></div>
            <div class="m-val-wrap">
              <div class="m-val" data-slot="m1_val">Low Risk</div>
            </div>
          </div>

          <!-- Marker 2 — center ~50% -->
          <div class="marker" id="sp-m2" style="left:50%">
            <div class="m-label-wrap">
              <div class="m-label" data-slot="m2_label">Real Estate</div>
              <div class="m-connector" id="sp-m2-conn"></div>
            </div>
            <div class="m-dot"></div>
            <div class="m-val-wrap">
              <div class="m-val" data-slot="m2_val">Moderate</div>
            </div>
          </div>

          <!-- Marker 3 — right ~80% -->
          <div class="marker" id="sp-m3" style="left:80%">
            <div class="m-label-wrap">
              <div class="m-label" data-slot="m3_label">Crypto</div>
              <div class="m-connector" id="sp-m3-conn"></div>
            </div>
            <div class="m-dot"></div>
            <div class="m-val-wrap">
              <div class="m-val" data-slot="m3_val">High Risk</div>
            </div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-spectrum .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "97px 76px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-spectrum .bloom",   { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-spectrum .grid",    { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-spectrum .title",   { autoAlpha: 0, y: 24, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.5)

        /* endpoint labels */
        .from("#sp-ep",                   { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 1.0)

        /* bar track appears */
        .from("#sp-track",                { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 1.1)

        /* bar fill draws in */
        .to("#sp-fill",                   { scaleX: 1, duration: 1.0, ease: "power3.out" }, 1.25)

        /* connectors draw down — staggered */
        .to("#sp-m1-conn",                { scaleY: 1, duration: 0.45, ease: "power2.out" }, 1.8)
        .to("#sp-m2-conn",                { scaleY: 1, duration: 0.45, ease: "power2.out" }, 1.95)
        .to("#sp-m3-conn",                { scaleY: 1, duration: 0.45, ease: "power2.out" }, 2.10)

        /* markers bloom on — label + dot + chip together */
        .from("#sp-m1 .m-dot, #sp-m1 .m-label, #sp-m1 .m-val-wrap",
                                          { autoAlpha: 0, scale: 0.6, filter: "blur(8px)", duration: 0.6, ease: "back.out(1.7)", stagger: 0.05 }, 1.85)
        .from("#sp-m2 .m-dot, #sp-m2 .m-label, #sp-m2 .m-val-wrap",
                                          { autoAlpha: 0, scale: 0.6, filter: "blur(8px)", duration: 0.6, ease: "back.out(1.7)", stagger: 0.05 }, 2.00)
        .from("#sp-m3 .m-dot, #sp-m3 .m-label, #sp-m3 .m-val-wrap",
                                          { autoAlpha: 0, scale: 0.6, filter: "blur(8px)", duration: 0.6, ease: "back.out(1.7)", stagger: 0.05 }, 2.15)

        /* dot glow pulses — finite */
        .to("#sp-m1 .m-dot",              { boxShadow: "0 0 32px rgba(55,189,248,0.90), 0 0 80px rgba(55,189,248,0.40)", duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.8)
        .to("#sp-m3 .m-dot",              { boxShadow: "0 0 32px rgba(245,216,42,0.90), 0 0 80px rgba(245,216,42,0.40)", duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.95)

        /* slow hold drift */
        .to("#sp-scene",                  { y: -10, duration: 5.0, ease: "sine.inOut" }, 2.3)

        .set({}, {}, 7);

      window.__timelines["t1-ov-spectrum"] = tl;
    </script>
  </body>
</html>
