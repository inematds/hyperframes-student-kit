<!doctype html>
<!--
  KALLAWAY · tier1 · section · STACK
  Full-screen takeover. The headline is SPLIT across 2–3 big display lines;
  each line glides in from the left + focus-blur-resolves one after another.
  Kinetic stacked type. Kicker is tiny above.
  Slots: kicker (~16 chars), headline (~52 chars, <em> accent word).
  Note: the headline slot here is rendered as three fixed lines split for the
  stacked kinetic effect. Data-slot="headline" is on the outermost wrapper.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-stk {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-stk .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-stk .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(140% 120% at 50% 60%, #000 30%, transparent 76%);
                mask-image: radial-gradient(140% 120% at 50% 60%, #000 30%, transparent 76%);
      }

      /* ── Content ─────────────────────────────────────────────────────── */
      #t1-sec-stk .content {
        position: absolute; left: 110px; right: 110px; top: 0; bottom: 0;
        display: flex; flex-direction: column;
        justify-content: center;
        z-index: 4;
      }
      #t1-sec-stk .kicker {
        font-family: var(--font-body); font-weight: var(--wt-semi);
        font-size: var(--size-tiny); letter-spacing: 0.26em; text-transform: uppercase;
        color: var(--text-dim); text-shadow: none;
        margin-bottom: 36px;
      }
      /* The stacked headline block */
      #t1-sec-stk .headline-stack {
        display: flex; flex-direction: column; gap: 2px;
      }
      /* Each line is one big block — clips overflow so blur stays contained */
      #t1-sec-stk .line {
        overflow: hidden; line-height: 1.0;
      }
      #t1-sec-stk .line-inner {
        display: block;
        font-family: var(--font-display); font-weight: var(--wt-black);
        letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
      }
      /* Three type sizes: first line biggest, subsequent slightly smaller */
      #t1-sec-stk .line-1 .line-inner { font-size: 160px; }
      #t1-sec-stk .line-2 .line-inner { font-size: 160px; }
      #t1-sec-stk .line-3 .line-inner { font-size: 100px; }

      /* Accent word */
      #t1-sec-stk .line-inner em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Left edge rule — glows blue, draws down */
      #t1-sec-stk .edge-rule {
        position: absolute; left: 76px; top: 240px; width: 2px; height: 0;
        background: linear-gradient(to bottom,
          var(--accent) 0%,
          rgba(var(--accent-rgb), 0.40) 70%,
          transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.45);
        z-index: 3;
      }

      /* ── Global chrome ────────────────────────────────────────────────── */
      #t1-sec-stk .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-stk .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-stk"
         data-composition-id="t1-sec-stk"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="edge-rule"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">The Big Picture</div>

        <!--
          data-slot="headline" sits on the wrapper.
          Lines are split for kinetic stacking; when slotted, editor replaces
          the three .line-inner spans with their own splits.
        -->
        <div class="headline-stack" data-slot="headline">
          <div class="line line-1"><span class="line-inner">Why the Old</span></div>
          <div class="line line-2"><span class="line-inner"><em>Playbook</em> Fails</span></div>
          <div class="line line-3"><span class="line-inner">in a Modern World</span></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-stk .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-stk .bloom",
        { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      tl.from("#t1-sec-stk .grid",
        { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* edge rule draws down */
      tl.to("#t1-sec-stk .edge-rule",
        { height: 560, duration: 0.85, ease: "expo.out" }, 0.30);

      /* kicker fades in */
      tl.from("#t1-sec-stk .kicker",
        { autoAlpha: 0, x: -20, filter: "blur(6px)", duration: 0.60, ease: "power3.out" }, 0.45);

      /* Each line slides + blurs in, staggered — each .line-inner slides up inside .line clip */
      tl.from("#t1-sec-stk .line-1 .line-inner",
        { autoAlpha: 0, y: "100%", filter: "blur(14px)", duration: 0.80, ease: "power4.out" }, 0.55);
      tl.from("#t1-sec-stk .line-2 .line-inner",
        { autoAlpha: 0, y: "100%", filter: "blur(14px)", duration: 0.80, ease: "power4.out" }, 0.73);
      tl.from("#t1-sec-stk .line-3 .line-inner",
        { autoAlpha: 0, y: "100%", filter: "blur(12px)", duration: 0.75, ease: "power4.out" }, 0.91);

      /* subtle continued upward drift on all lines during hold */
      tl.to("#t1-sec-stk .headline-stack",
        { y: -14, duration: 4.5, ease: "sine.inOut" }, 2.0);

      /* edge rule glow pulse */
      tl.to("#t1-sec-stk .edge-rule",
        { opacity: 0.45, duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-stk"] = tl;
    </script>
  </body>
</html>
