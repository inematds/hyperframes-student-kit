<!doctype html>
<!--
  KALLAWAY · tier1 · stat · TRENDLINE
  A line graph drawing up-and-right via SVG stroke-dashoffset. Glowing end-dot
  + floating value label. Faint axis lines. Stat number counts up.
  Aurora bloom, grain, vignette.
  Slots: kicker (~28 chars uppercase), stat (end value e.g. "+247%"),
         label (~70 chars, <em>), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-st-trend {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-st-trend .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-st-trend .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Content block */
      #t1-st-trend .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 4; gap: 0;
        padding-bottom: 30px;
      }

      /* Kicker */
      #t1-st-trend .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 52px;
      }

      /* Chart wrapper */
      #t1-st-trend .chart-wrap {
        position: relative;
        width: 1360px;
        height: 460px;
        flex-shrink: 0;
      }

      /* SVG fills the chart area */
      #t1-st-trend .trend-svg {
        width: 1360px; height: 460px;
        overflow: visible;
      }

      /* Floating value callout at line end */
      #t1-st-trend .end-callout {
        position: absolute;
        top: 12px; right: 60px;    /* near end point of line */
        display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
      }
      #t1-st-trend .end-callout .stat {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 90px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        background: linear-gradient(160deg, #ffffff 15%, rgba(var(--accent-rgb), 0.85) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.65));
      }
      #t1-st-trend .end-callout .stat-chip {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Axis labels */
      #t1-st-trend .x-labels {
        position: absolute;
        bottom: -32px; left: 60px; right: 60px;
        display: flex; justify-content: space-between;
      }
      #t1-st-trend .x-lbl {
        font-family: var(--font-mono);
        font-size: 20px;
        font-weight: var(--wt-bold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      /* Label below chart */
      #t1-st-trend .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
        margin-top: 68px;
      }
      #t1-st-trend .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* Source */
      #t1-st-trend .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-st-trend .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-st-trend .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-st-trend" data-composition-id="t1-st-trend" data-start="0"
         data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">REVENUE GROWTH TRAJECTORY</div>

        <div class="chart-wrap">
          <!--
            Viewport: 1360×460.
            Line points: a gentle upward curve with an accelerating tail.
            Drawn as a polyline / path from left to right.
            Area fill below line for depth.
          -->
          <svg class="trend-svg" viewBox="0 0 1360 460"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.5"/>
                <stop offset="70%" stop-color="#37BDF8" stop-opacity="1"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
              </linearGradient>
              <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#37BDF8" stop-opacity="0"/>
              </linearGradient>
              <filter id="lineGlow" x="-5%" y="-30%" width="110%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
              <!-- Clip path so line draw reveal works cleanly -->
              <clipPath id="lineClip">
                <rect id="line-clip-rect" x="0" y="0" width="0" height="460"/>
              </clipPath>
            </defs>

            <!-- Horizontal axis line -->
            <line id="t1-st-trend-xaxis"
              x1="60" y1="400" x2="1300" y2="400"
              stroke="rgba(255,255,255,0.12)" stroke-width="1.5"
            />

            <!-- Faint vertical grid lines at each data point -->
            <line x1="60"   y1="60"  x2="60"   y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            <line x1="308"  y1="60"  x2="308"  y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            <line x1="556"  y1="60"  x2="556"  y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            <line x1="804"  y1="60"  x2="804"  y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            <line x1="1052" y1="60"  x2="1052" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            <line x1="1300" y1="60"  x2="1300" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

            <!-- Area fill below line (clipped to reveal) -->
            <path id="t1-st-trend-area"
              d="M60,380 C160,370 240,360 308,340 C390,316 460,295 556,265
                 C660,230 740,200 804,170 C880,136 960,108 1052,80 C1140,54 1220,36 1300,20
                 L1300,400 L60,400 Z"
              fill="url(#areaGrad)"
              clip-path="url(#lineClip)"
            />

            <!-- Main trend line (clipped to reveal) -->
            <path id="t1-st-trend-line"
              d="M60,380 C160,370 240,360 308,340 C390,316 460,295 556,265
                 C660,230 740,200 804,170 C880,136 960,108 1052,80 C1140,54 1220,36 1300,20"
              stroke="url(#lineGrad)"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#lineGlow)"
              clip-path="url(#lineClip)"
            />

            <!-- Glowing end dot at (1300,20) — revealed after line draws -->
            <circle id="t1-st-trend-dot" cx="1300" cy="20" r="0"
              fill="#ffffff"
              style="filter: drop-shadow(0 0 14px rgba(55,189,248,0.95)) drop-shadow(0 0 36px rgba(55,189,248,0.60));"
            />

            <!-- Tick marks on x-axis -->
            <line x1="60"   y1="400" x2="60"   y2="410" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
            <line x1="308"  y1="400" x2="308"  y2="410" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
            <line x1="556"  y1="400" x2="556"  y2="410" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
            <line x1="804"  y1="400" x2="804"  y2="410" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
            <line x1="1052" y1="400" x2="1052" y2="410" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
            <line x1="1300" y1="400" x2="1300" y2="410" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
          </svg>

          <!-- Floating value at end of line -->
          <div class="end-callout">
            <div class="stat" id="t1-st-trend-num" data-slot="stat">+247%</div>
            <div class="stat-chip">YoY growth</div>
          </div>

          <!-- X-axis period labels -->
          <div class="x-labels">
            <span class="x-lbl">Q1</span>
            <span class="x-lbl">Q2</span>
            <span class="x-lbl">Q3</span>
            <span class="x-lbl">Q4</span>
            <span class="x-lbl">Q1</span>
            <span class="x-lbl">Q2 ↑</span>
          </div>
        </div>

        <div class="label" data-slot="label">platform revenue doubled every quarter — <em>compounding acceleration</em> across all product lines</div>
      </div>

      <div class="source" data-slot="source">SOURCE · FINANCIAL REPORT 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl    = document.getElementById("t1-st-trend-num");
      const clipRect = document.getElementById("line-clip-rect");
      const dotEl    = document.getElementById("t1-st-trend-dot");

      /* Target stat value (numeric portion) */
      const statTarget = 247;
      const statPrefix = "+";
      const statSuffix = "%";

      /* Total chart width to reveal */
      const chartWidth = 1360;

      /* Grain flicker */
      tl.fromTo("#t1-st-trend .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* Bloom + grid */
      tl.from("#t1-st-trend .bloom",
        { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-st-trend .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* Kicker */
        .from("#t1-st-trend .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.45)

        /* Axes + ticks fade in */
        .from("#t1-st-trend-xaxis",
          { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.7, ease: "power2.out" }, 0.60)
        .from("#t1-st-trend .x-lbl",
          { autoAlpha: 0, y: 8, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.80)

        /* Line draw — reveal by expanding clip rect width */
        .to({ w: 0 }, {
          w: chartWidth,
          duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            clipRect.setAttribute("width", this.targets()[0].w);
          }
        }, 0.90)

        /* End dot pops on when line finishes */
        .to(dotEl, {
          attr: { r: 12 },
          duration: 0.35, ease: "back.out(1.6)"
        }, 2.60)

        /* Count-up for the stat */
        .to({ val: 0 }, {
          val: statTarget,
          duration: 1.6, ease: "power2.out",
          onUpdate: function() {
            numEl.textContent = statPrefix + Math.round(this.targets()[0].val) + statSuffix;
          }
        }, 0.95)

        /* End callout fades in */
        .from("#t1-st-trend .end-callout",
          { autoAlpha: 0, x: 20, filter: "blur(10px)", duration: 0.85, ease: "power3.out" }, 1.00)

        /* Label */
        .from("#t1-st-trend .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.20)

        /* Source */
        .from("#t1-st-trend .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.50)

        /* Breathing glow pulse on end dot */
        .to(dotEl, {
          attr: { r: 16 },
          duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true
        }, 2.80)

        .set({}, {}, 7);

      window.__timelines["t1-st-trend"] = tl;
    </script>
  </body>
</html>
