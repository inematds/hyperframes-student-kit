<!doctype html>
<!--
  KALLAWAY · tier1 · stat · BEFOREAFTER
  A "before" number on the left dims and shrinks while an arrow pulses rightward,
  then the "after" number counts up large and glowing on the right. The count-up
  spans from before → after value (e.g. 24 → 91). The gap is visually enormous.
  Glass divider arrow, aurora bloom, deep vignette.
  Slots: kicker (~28 chars uppercase), before (number e.g. "24%"),
         after (number e.g. "91%"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-baft {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-baft .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-baft .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.42;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Outer stage */
      #t1-stat-baft .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4; gap: 48px;
      }

      #t1-stat-baft .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Main comparison row */
      #t1-stat-baft .compare-row {
        display: flex; align-items: center; justify-content: center;
        gap: 80px;
      }

      /* ---- BEFORE side ---- */
      #t1-stat-baft .side {
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        width: 540px;
      }
      #t1-stat-baft .side-tag {
        font-family: var(--font-mono);
        font-size: 21px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 6px 20px;
        border-radius: 30px;
        border: 1px solid rgba(255,255,255,0.16);
      }
      #t1-stat-baft .before-side .side-tag {
        color: var(--text-faint);
        border-color: rgba(255,255,255,0.10);
      }
      #t1-stat-baft .after-side .side-tag {
        color: var(--accent);
        border-color: rgba(var(--accent-rgb), 0.45);
        text-shadow: var(--textglow-accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.20);
      }

      #t1-stat-baft .before-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 160px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        color: var(--text-faint);
        /* NO gradient clip — stays dim */
        text-align: center;
      }

      #t1-stat-baft .after-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 220px;
        line-height: 1;
        letter-spacing: -0.04em;
        text-align: center;
        background: linear-gradient(145deg, #ffffff 15%, rgba(var(--accent-rgb), 0.85) 75%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(var(--accent-rgb), 0.60))
                drop-shadow(0 0 80px rgba(var(--accent-rgb), 0.25));
      }

      /* ---- ARROW divider ---- */
      #t1-stat-baft .arrow-col {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        flex-shrink: 0;
      }
      #t1-stat-baft .arrow-svg {
        width: 100px; height: 60px;
      }
      #t1-stat-baft .delta-chip {
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: var(--wt-bold);
        color: #37E68C;
        text-shadow: 0 0 14px rgba(55,230,140,0.70), 0 0 36px rgba(55,230,140,0.35);
        letter-spacing: 0.06em;
      }

      /* ---- decorative glow behind after-side ---- */
      #t1-stat-baft .after-glow {
        position: absolute; z-index: 2;
        left: 55%; top: 50%; transform: translate(-20%, -50%);
        width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.14) 0%, transparent 65%);
        pointer-events: none;
      }

      #t1-stat-baft .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 940px;
        line-height: 1.45;
      }
      #t1-stat-baft .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-baft .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-baft .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-baft .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-baft" data-composition-id="t1-stat-baft"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="after-glow" id="t1-stat-baft-glow"></div>

      <div class="stage">
        <div class="kicker" data-slot="kicker">LEARNER PASS RATE · BEFORE VS AFTER AI</div>

        <div class="compare-row">
          <!-- BEFORE -->
          <div class="side before-side">
            <div class="side-tag">BEFORE</div>
            <div class="before-num" id="t1-stat-baft-before" data-slot="before">24%</div>
          </div>

          <!-- ARROW -->
          <div class="arrow-col" id="t1-stat-baft-arrow">
            <svg class="arrow-svg" viewBox="0 0 100 60" fill="none">
              <!-- horizontal shaft -->
              <line x1="4" y1="30" x2="76" y2="30"
                stroke="#37BDF8" stroke-width="3" stroke-linecap="round"/>
              <!-- arrowhead -->
              <path d="M66 16 L90 30 L66 44"
                stroke="#37BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <div class="delta-chip">+67 pts</div>
          </div>

          <!-- AFTER -->
          <div class="side after-side">
            <div class="side-tag">AFTER</div>
            <div class="after-num" id="t1-stat-baft-after" data-slot="after">91%</div>
          </div>
        </div>

        <div class="label" data-slot="label">introducing AI tutoring loops <em>raised the pass rate from 24% to 91%</em> in the same cohort within 8 weeks</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PILOT PROGRAM DATA 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const beforeEl = document.getElementById("t1-stat-baft-before");
      const afterEl  = document.getElementById("t1-stat-baft-after");
      const arrowEl  = document.getElementById("t1-stat-baft-arrow");
      const glowEl   = document.getElementById("t1-stat-baft-glow");

      /* Values — parsed from display text */
      const beforeVal = 24;
      const afterVal  = 91;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-baft .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "98px 76px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-baft .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-baft .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-baft .kicker",
          { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.45)

        /* BEFORE side slides in from left, dim */
        .from("#t1-stat-baft .before-side",
          { autoAlpha: 0, x: -50, duration: 0.8, ease: "power4.out" }, 0.70)
        /* Before number shows the value right away (no count-up needed) */
        /* (beforeEl already has static text "24%") */

        /* arrow draws in */
        .from(arrowEl,
          { autoAlpha: 0, x: -30, duration: 0.55, ease: "power3.out" }, 1.20)

        /* after-glow blooms */
        .from(glowEl,
          { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 1.35)

        /* AFTER side tag */
        .from("#t1-stat-baft .after-side .side-tag",
          { autoAlpha: 0, y: -16, duration: 0.5, ease: "power3.out" }, 1.40)

        /* AFTER number: reveal + count up from beforeVal → afterVal */
        .from(afterEl,
          { autoAlpha: 0, scale: 0.80, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.out" }, 1.50)
        .to({ val: beforeVal }, {
          val: afterVal,
          duration: 1.6, ease: "power2.out",
          onUpdate: function () {
            const v = Math.round(this.targets()[0].val);
            afterEl.textContent = v + "%";
          }
        }, 1.55)

        /* label */
        .from("#t1-stat-baft .label",
          { autoAlpha: 0, y: 22, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 2.80)

        /* source */
        .from("#t1-stat-baft .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 3.10)

        /* glow breathes */
        .to(glowEl,
          { opacity: 0.52, scale: 1.12, transformOrigin: "50% 50%",
            duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.20)

        /* before-side dims further to let after dominate */
        .to("#t1-stat-baft .before-num",
          { color: "rgba(240,238,233,0.20)", duration: 1.0, ease: "power2.out" }, 2.00)

        .set({}, {}, 7);

      window.__timelines["t1-stat-baft"] = tl;
    </script>
  </body>
</html>
