<!doctype html>
<!--
  KALLAWAY · tier1 · stat · GROWTHARROW
  A big glowing number with a clean rising growth arrow: an SVG line draws upward
  diagonally then a sharp arrowhead snaps on; the whole arrow glows blue-white.
  Number counts up to value. Spacious, right-anchored arrow composition.
  Slots: kicker (~28 chars), stat (e.g. "+340%"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-garrow {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-garrow .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-garrow .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Layout: text left, arrow SVG right */
      #t1-stat-garrow .text-block {
        position: absolute; left: 180px; top: 50%; transform: translateY(-52%);
        z-index: 4; display: flex; flex-direction: column; gap: 44px;
        max-width: 840px;
      }
      #t1-stat-garrow .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }
      #t1-stat-garrow .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 0.88; letter-spacing: var(--track-tight);
        background: linear-gradient(145deg, #ffffff 10%, rgba(var(--accent-rgb), 0.88) 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 32px rgba(var(--accent-rgb), 0.55));
      }
      #t1-stat-garrow .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        line-height: 1.45; max-width: 780px;
      }
      #t1-stat-garrow .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      /* Arrow SVG — positioned right */
      #t1-stat-garrow .arrow-wrap {
        position: absolute; right: 120px; top: 50%; transform: translateY(-50%);
        width: 680px; height: 640px; z-index: 3;
      }

      #t1-stat-garrow .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-garrow .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-garrow .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-garrow" data-composition-id="t1-stat-garrow" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="text-block">
        <div class="kicker" data-slot="kicker">COURSE COMPLETION GROWTH</div>
        <div class="stat" id="garrow-num" data-slot="stat">+340%</div>
        <div class="label" data-slot="label">
          year-over-year increase in learners completing <em>full certification paths</em> — driven by cohort accountability features
        </div>
      </div>

      <!--
        Arrow SVG: 680×640, main shaft rises diagonally from bottom-left to top-right.
        Start: (80, 580)  End: (560, 60)
        The line is drawn via stroke-dashoffset animation.
        Arrowhead: triangle at tip (560,60), pointing upper-right.
        A subtle glow dupe line behind for the halo effect.
        A baseline horizontal dashed line adds axis context.
      -->
      <div class="arrow-wrap">
        <svg viewBox="0 0 680 640" fill="none" xmlns="http://www.w3.org/2000/svg"
             width="680" height="640">
          <defs>
            <linearGradient id="agShaft" x1="80" y1="580" x2="560" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#37BDF8" stop-opacity="0.30"/>
              <stop offset="50%" stop-color="#37BDF8" stop-opacity="0.80"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="1.00"/>
            </linearGradient>
            <filter id="agGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
              <feComposite in="SourceGraphic" in2="b" operator="over"/>
            </filter>
            <filter id="agGlowSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b"/>
              <feComposite in="SourceGraphic" in2="b" operator="over"/>
            </filter>
          </defs>

          <!-- baseline dashed axis -->
          <line x1="40" y1="590" x2="640" y2="590" stroke="rgba(255,255,255,0.10)"
                stroke-width="1.5" stroke-dasharray="8 8"/>

          <!-- small tick marks on baseline -->
          <line x1="160" y1="582" x2="160" y2="598" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <line x1="280" y1="582" x2="280" y2="598" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <line x1="400" y1="582" x2="400" y2="598" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <line x1="520" y1="582" x2="520" y2="598" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

          <!-- soft glow duplicate of shaft -->
          <line id="ag-glow" x1="80" y1="580" x2="560" y2="60"
                stroke="url(#agShaft)" stroke-width="24" stroke-linecap="round"
                filter="url(#agGlowSoft)" opacity="0.55"/>

          <!-- main shaft line — drawn via dashoffset -->
          <line id="ag-shaft" x1="80" y1="580" x2="560" y2="60"
                stroke="url(#agShaft)" stroke-width="6" stroke-linecap="round"
                filter="url(#agGlow)"/>

          <!-- arrowhead: equilateral triangle pointing upper-right at (560,60) -->
          <!-- Pointing direction: approx 315° (upper-right diagonal) -->
          <polygon id="ag-head" points="560,60 510,100 550,120"
                   fill="white"
                   style="filter:drop-shadow(0 0 16px rgba(255,255,255,0.90)) drop-shadow(0 0 40px rgba(55,189,248,0.80));"/>

          <!-- bright dot at tip -->
          <circle id="ag-tip" cx="560" cy="60" r="16" fill="white"
                  style="filter:drop-shadow(0 0 18px rgba(255,255,255,0.95)) drop-shadow(0 0 50px rgba(55,189,248,0.80));"/>

          <!-- origin dot -->
          <circle cx="80" cy="580" r="8" fill="rgba(55,189,248,0.50)"
                  style="filter:drop-shadow(0 0 8px rgba(55,189,248,0.60));"/>
        </svg>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PLATFORM ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Compute shaft length for dashoffset animation */
      const shaftEl = document.getElementById("ag-shaft");
      const glowEl  = document.getElementById("ag-glow");
      const headEl  = document.getElementById("ag-head");
      const tipEl   = document.getElementById("ag-tip");
      const shaftLen = Math.hypot(560 - 80, 580 - 60); /* ~735px */

      shaftEl.style.strokeDasharray  = shaftLen;
      shaftEl.style.strokeDashoffset = shaftLen;
      glowEl.style.strokeDasharray   = shaftLen;
      glowEl.style.strokeDashoffset  = shaftLen;

      /* Count-up: stat reads "+340%" — animate the number 0→340, keep prefix/suffix */
      const statEl   = document.getElementById("garrow-num");
      const statTarget = 340;

      /* grain */
      tl.fromTo("#t1-stat-garrow .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 86px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-garrow .bloom",
          { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-stat-garrow .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-garrow .kicker",
          { autoAlpha: 0, y: 18, filter: "blur(8px)", duration: 0.75, ease: "power3.out" }, 0.50)

        /* stat fades in, then count-up */
        .from("#t1-stat-garrow .stat",
          { autoAlpha: 0, y: 30, duration: 0.55, ease: "back.out(1.4)" }, 0.72)

        .to({ val: 0 }, {
          val: statTarget, duration: 1.8, ease: "power2.out",
          onUpdate: function() {
            statEl.textContent = "+" + Math.round(this.targets()[0].val) + "%";
          }
        }, 0.80)

        /* arrow shaft draws upward — animate strokeDashoffset to 0 */
        .to([shaftEl, glowEl], {
          strokeDashoffset: 0,
          duration: 1.2, ease: "power3.out"
        }, 0.80)

        /* arrowhead snaps in after shaft reaches tip */
        .from([headEl, tipEl],
          { autoAlpha: 0, scale: 0.3, transformOrigin: "560px 60px",
            duration: 0.35, ease: "back.out(2.5)" }, 1.90)

        /* tip pulse */
        .to("#ag-tip",
          { attr: { r: 24 }, duration: 0.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.30)

        /* label */
        .from("#t1-stat-garrow .label",
          { autoAlpha: 0, y: 20, filter: "blur(8px)", duration: 0.85, ease: "power3.out" }, 1.80)

        /* source */
        .from("#t1-stat-garrow .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.10)

        .set({}, {}, 7);

      window.__timelines["t1-stat-garrow"] = tl;
    </script>
  </body>
</html>
