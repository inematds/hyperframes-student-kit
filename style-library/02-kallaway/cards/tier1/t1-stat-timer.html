<!doctype html>
<!--
  KALLAWAY · tier1 · stat · TIMER
  Clock-style duration counter: minutes and seconds tick up smoothly to a target
  time value. Colon between digits glows and pulses. Large glow numerals on a
  dark canvas with aurora bloom. The "how long it takes" beat.
  Slots: kicker, stat (placeholder e.g. "14:32"), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-timer {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-timer .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-timer .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* centre column layout */
      #t1-stat-timer .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 44px; padding-bottom: 30px;
      }

      #t1-stat-timer .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* clock plate — subtle glass behind the digits */
      #t1-stat-timer .clock-wrap {
        position: relative;
        display: flex; align-items: center; gap: 0;
      }

      #t1-stat-timer .clock-plate {
        position: absolute;
        inset: -32px -64px;
        border-radius: var(--radius-lg);
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        border-top: var(--stroke) solid var(--glass-hi);
        border-bottom: var(--stroke) solid rgba(255,255,255,0.04);
        box-shadow: var(--glass-shadow),
                    0 0 80px 8px rgba(var(--accent-rgb), 0.12),
                    inset 0 1px 0 var(--glass-hi);
      }

      /* digit blocks */
      #t1-stat-timer .digit-block {
        display: flex; flex-direction: column; align-items: center;
        position: relative; z-index: 2;
      }

      #t1-stat-timer .digit-val {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 220px;
        line-height: 1;
        letter-spacing: -0.04em;
        /* gradient: white top → accent blue bottom */
        background: linear-gradient(170deg, #ffffff 10%, rgba(var(--accent-rgb), 0.80) 90%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
        min-width: 280px; text-align: center;
      }

      #t1-stat-timer .digit-label {
        font-family: var(--font-mono);
        font-size: var(--size-tiny);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--text-faint);
        margin-top: 10px;
      }

      /* colon separator */
      #t1-stat-timer .colon {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 200px;
        line-height: 1;
        color: var(--accent);
        text-shadow: var(--textglow-accent),
                     0 0 60px rgba(var(--accent-rgb), 0.55);
        position: relative; z-index: 2;
        margin: 0 8px;
        padding-bottom: 52px; /* optical align with digits */
      }

      #t1-stat-timer .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 900px;
        line-height: 1.45;
      }
      #t1-stat-timer .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-timer .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-timer .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-timer .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-timer" data-composition-id="t1-stat-timer" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">AVERAGE TIME TO FIRST SALE</div>

        <div class="clock-wrap">
          <div class="clock-plate"></div>
          <div class="digit-block">
            <div class="digit-val" id="t1-stat-timer-min">00</div>
            <div class="digit-label">minutes</div>
          </div>
          <div class="colon" id="t1-stat-timer-colon">:</div>
          <div class="digit-block">
            <div class="digit-val" id="t1-stat-timer-sec">00</div>
            <div class="digit-label">seconds</div>
          </div>
        </div>

        <!-- stat slot holds the target value read by JS -->
        <div style="display:none" data-slot="stat" id="t1-stat-timer-target">14:32</div>

        <div class="label" data-slot="label">students close their <em>first paying client</em> within this time of finishing Module 3</div>
      </div>

      <div class="source" data-slot="source">SOURCE · COHORT SURVEY Q1 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* read target from slot — parse "MM:SS" */
      const targetRaw = document.getElementById("t1-stat-timer-target").textContent.trim();
      const parts     = targetRaw.split(":");
      const targetMin = parseInt(parts[0], 10) || 14;
      const targetSec = parseInt(parts[1], 10) || 32;
      const totalSecs = targetMin * 60 + targetSec;

      const minEl  = document.getElementById("t1-stat-timer-min");
      const secEl  = document.getElementById("t1-stat-timer-sec");
      const colonEl= document.getElementById("t1-stat-timer-colon");

      function pad2(n) { return String(Math.floor(n)).padStart(2, "0"); }

      /* grain flicker — deterministic */
      tl.fromTo("#t1-stat-timer .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-timer .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-timer .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-timer .kicker",
          { autoAlpha: 0, y: 18, duration: 0.75, ease: "power3.out" }, 0.45)

        /* glass plate springs in */
        .from("#t1-stat-timer .clock-plate",
          { autoAlpha: 0, scaleX: 0.6, scaleY: 0.8, transformOrigin: "50% 50%",
            duration: 0.9, ease: "back.out(1.4)" }, 0.6)

        /* digit blocks slide up */
        .from("#t1-stat-timer .digit-block",
          { autoAlpha: 0, y: 40, duration: 0.8, ease: "power4.out", stagger: 0.12 }, 0.72)
        .from("#t1-stat-timer .colon",
          { autoAlpha: 0, scale: 0.5, duration: 0.6, ease: "back.out(1.4)" }, 0.78)

        /* count-up: seconds-total drives both display fields */
        .to({ val: 0 }, {
          val: totalSecs,
          duration: 2.0, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].val;
            minEl.textContent = pad2(v / 60);
            secEl.textContent = pad2(v % 60);
          }
        }, 0.90)

        /* label */
        .from("#t1-stat-timer .label",
          { autoAlpha: 0, y: 20, duration: 0.85, ease: "power3.out" }, 2.20)

        /* source */
        .from("#t1-stat-timer .source",
          { autoAlpha: 0, duration: 0.7, ease: "power2.out" }, 2.55)

        /* colon breathing pulse */
        .to("#t1-stat-timer .colon",
          { opacity: 0.35, duration: 0.55, ease: "sine.inOut", repeat: 3, yoyo: true }, 3.0)

        .set({}, {}, 7);

      window.__timelines["t1-stat-timer"] = tl;
    </script>
  </body>
</html>
