<!doctype html>
<!--
  KALLAWAY · tier1 · section · NUMERAL
  Full-screen chapter takeover. A HUGE faint glowing chapter numeral (from kicker)
  fills the background as a ghost watermark. The headline sits crisply in front,
  sharp and lit, creating strong figure/ground contrast. The numeral is the
  ambient canvas, the headline is the statement.
  Slots: kicker (~16 chars — the numeral or short label), headline (~52 chars, <em>).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-num {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-num .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }
      /* Dot grid */
      #t1-sec-num .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Giant ghost numeral — the background watermark */
      #t1-sec-num .bg-numeral {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -48%);
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 680px; line-height: 1; letter-spacing: -0.06em;
        /* gradient fill + translucent so it recedes */
        background: linear-gradient(
          170deg,
          rgba(var(--accent-rgb), 0.28) 0%,
          rgba(var(--accent-rgb), 0.08) 55%,
          transparent 80%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        /* edge glow so it luminates */
        filter: drop-shadow(0 0 60px rgba(var(--accent-rgb), 0.30))
                drop-shadow(0 0 140px rgba(var(--accent-rgb), 0.14));
        user-select: none;
        pointer-events: none;
        z-index: 2;
      }

      /* Foreground content */
      #t1-sec-num .content {
        position: absolute; left: var(--pad); right: var(--pad);
        bottom: 200px;
        z-index: 4;
      }

      /* Thin ruled line above headline */
      #t1-sec-num .rule {
        width: 0px; height: 2px;
        background: linear-gradient(90deg, var(--accent) 0%, rgba(var(--accent-rgb), 0.0) 100%);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.60);
        border-radius: 1px;
        margin-bottom: 32px;
      }

      /* Kicker — italic label, left-anchored below rule */
      #t1-sec-num .kicker {
        font-family: var(--font-body); font-style: italic; font-weight: var(--wt-med);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--text-dim);
        margin-bottom: 24px;
      }

      /* Headline */
      #t1-sec-num .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-display); line-height: 0.98; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px;
      }
      #t1-sec-num .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-num .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-num .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-num" data-composition-id="t1-sec-num" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- Ghost numeral watermark — shows kicker as giant BG character -->
      <div class="bg-numeral" data-slot="kicker">02</div>

      <div class="content">
        <div class="rule"></div>
        <div class="kicker" data-slot="kicker">Chapter Two</div>
        <div class="headline" data-slot="headline">Building Systems That <em>Actually Scale</em></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-num .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "100px 75px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-num .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-num .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* ghost numeral: rises from nothing, large scale, blurry → sharp */
        .from("#t1-sec-num .bg-numeral",
          { autoAlpha: 0, scale: 1.18, filter: "blur(30px)",
            transformOrigin: "50% 50%", duration: 1.8, ease: "power4.out" }, 0.0)

        /* accent rule draws across */
        .to("#t1-sec-num .rule",
          { width: 160, duration: 0.7, ease: "power3.out" }, 0.9)

        /* kicker slides in */
        .from("#t1-sec-num .kicker",
          { autoAlpha: 0, x: -24, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 1.1)

        /* headline glides up with focus pull */
        .from("#t1-sec-num .headline",
          { autoAlpha: 0, y: 42, filter: "blur(18px)", duration: 1.1, ease: "power4.out" }, 1.3)

        /* ghost numeral breathes very slowly — imperceptible drift */
        .to("#t1-sec-num .bg-numeral",
          { y: -20, scale: 1.02, duration: 5.2, ease: "sine.inOut" }, 1.8)

        /* glow pulse on numeral */
        .to("#t1-sec-num .bg-numeral",
          { opacity: 0.65, duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-sec-num"] = tl;
    </script>
  </body>
</html>
