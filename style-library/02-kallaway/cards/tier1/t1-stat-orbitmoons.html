<!doctype html>
<!--
  KALLAWAY · tier1 · stat · ORBITMOONS
  A large glowing central number is orbited by 2 small satellite "moon" stats on
  subtle elliptical paths. The moons enter with orbital easing and carry short
  supporting stats. Breathes with a gentle orbital drift after entrance.
  Slots: stat (center, e.g. "87%"), moon1 (e.g. "12K students"),
         moon2 (e.g. "94% NPS"), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-moons {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-moons .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-moons .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── orbit SVG (decorative ellipse rings) ── */
      #t1-stat-moons .orbit-svg {
        position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 2;
      }

      /* ── central hub ── */
      #t1-stat-moons .hub {
        position: absolute;
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 440px; height: 440px; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0;
      }

      /* glow halo behind central number */
      #t1-stat-moons .hub-glow {
        position: absolute; inset: -80px; border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb),0.22) 0%, transparent 70%);
        box-shadow: 0 0 140px 30px rgba(var(--accent-rgb),0.20);
      }

      #t1-stat-moons .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-mega); line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb),0.80) 72%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
        position: relative; z-index: 2;
      }
      #t1-stat-moons .stat-sub {
        font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); margin-top: 10px; position: relative; z-index: 2;
      }

      /* ── moon pill cards ── */
      #t1-stat-moons .moon {
        position: absolute; z-index: 5;
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-top-color: var(--glass-hi);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 36px rgba(var(--accent-rgb),0.18);
        padding: 18px 36px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
      }
      #t1-stat-moons .moon-val {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 64px; line-height: 1; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
      }
      #t1-stat-moons .moon-lbl {
        font-family: var(--font-mono); font-size: 18px; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-dim);
      }

      /* moon1 — upper-right */
      #t1-stat-moons .moon1 { left: 1220px; top: 240px; }
      /* moon2 — lower-left */
      #t1-stat-moons .moon2 { left: 280px; top: 640px; }

      #t1-stat-moons .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-moons .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-moons .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-moons" data-composition-id="t1-stat-moons" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- decorative orbit ellipses -->
      <svg class="orbit-svg" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="mn-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feComposite in="SourceGraphic" in2="b" operator="over"/>
          </filter>
        </defs>
        <!-- outer orbit ring -->
        <ellipse id="mn-ring1" cx="960" cy="540" rx="520" ry="310"
                 stroke="rgba(55,189,248,0.12)" stroke-width="1"
                 stroke-dasharray="8 12" opacity="0"/>
        <!-- inner orbit ring -->
        <ellipse id="mn-ring2" cx="960" cy="540" rx="310" ry="190"
                 stroke="rgba(55,189,248,0.08)" stroke-width="1"
                 stroke-dasharray="4 10" opacity="0"/>
        <!-- orbit dot connectors (dashes from moon to center) -->
        <line id="mn-conn1" x1="1290" y1="310" x2="960" y2="540"
              stroke="rgba(55,189,248,0.22)" stroke-width="1"
              stroke-dasharray="6 8" opacity="0"/>
        <line id="mn-conn2" x1="380" y1="700" x2="960" y2="540"
              stroke="rgba(55,189,248,0.22)" stroke-width="1"
              stroke-dasharray="6 8" opacity="0"/>
      </svg>

      <!-- central hub -->
      <div class="hub">
        <div class="hub-glow" id="mn-hub-glow"></div>
        <div class="stat" data-slot="stat">87%</div>
        <div class="stat-sub">course completion</div>
      </div>

      <!-- moon cards -->
      <div class="moon moon1" id="mn-m1">
        <div class="moon-val" id="mn-m1-val" data-slot="moon1">12K</div>
        <div class="moon-lbl">active students</div>
      </div>
      <div class="moon moon2" id="mn-m2">
        <div class="moon-val" id="mn-m2-val" data-slot="moon2">94%</div>
        <div class="moon-lbl">satisfaction score</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS PLATFORM DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-stat-moons .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-moons .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-moons .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* orbit rings draw in */
        .to("#mn-ring1", { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.35)
        .to("#mn-ring2", { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.50)

        /* hub glow blooms */
        .from("#mn-hub-glow",
          { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.55)

        /* central stat */
        .from("#t1-stat-moons .stat",
          { autoAlpha: 0, scale: 0.75, transformOrigin: "50% 50%",
            duration: 1.0, ease: "back.out(1.4)" }, 0.75)
        .from("#t1-stat-moons .stat-sub",
          { autoAlpha: 0, y: 12, duration: 0.65, ease: "power3.out" }, 1.10)

        /* connector dashes */
        .to(["#mn-conn1","#mn-conn2"],
          { opacity: 1, duration: 0.5, stagger: 0.18, ease: "power2.out" }, 1.20)

        /* moon cards orbit in */
        .from("#mn-m1",
          { autoAlpha: 0, x: 90, y: -50, rotation: -8,
            duration: 0.85, ease: "back.out(1.4)" }, 1.35)
        .from("#mn-m2",
          { autoAlpha: 0, x: -90, y: 50, rotation: 8,
            duration: 0.85, ease: "back.out(1.4)" }, 1.52)

        /* source */
        .from("#t1-stat-moons .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.10)

        /* slow orbital drift — moons gently arc */
        .to("#mn-m1", { x: 20, y: -14, duration: 4.0, ease: "sine.inOut" }, 2.5)
        .to("#mn-m2", { x: -20, y: 14, duration: 4.0, ease: "sine.inOut" }, 2.5)

        /* hub breathing */
        .to("#mn-hub-glow",
          { opacity: 0.55, scale: 1.12, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.8)

        .set({}, {}, 7);

      window.__timelines["t1-stat-moons"] = tl;
    </script>
  </body>
</html>
