<!doctype html>
<!--
  KALLAWAY · tier1 · stat · LAYERED
  Three ghost copies of the headline number start offset — one above, one below,
  one in the middle — then parallax into alignment and merge into a single sharp
  glowing figure. The stacked translucent planes give a depth-of-field / hologram
  feel before resolving cleanly.
  Slots: kicker (~28 chars), stat (e.g. "58B"), label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-layer {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-layer .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-layer .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* ── main layout ── */
      #t1-stat-layer .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 52px; padding-bottom: 20px;
      }

      #t1-stat-layer .kicker {
        font-family: var(--font-mono); font-size: var(--size-label);
        font-weight: var(--wt-bold); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* ── layered number stack ── */
      #t1-stat-layer .stat-stack {
        position: relative; height: 360px; width: 1200px;
        display: flex; align-items: center; justify-content: center;
      }

      /* shared number style — all three planes. Solid glowing text (color +
         text-shadow), NOT gradient-clipped: three stacked full-width
         background-clip:text elements fail to clip in render (gradient fills the
         box, transparent glyphs vanish). Solid text is bulletproof and still
         reads as the premium glow figure. */
      #t1-stat-layer .plane {
        position: absolute;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 300px; line-height: 1; letter-spacing: -0.03em;
        text-align: center; width: 100%;
      }

      /* plane A — rear ghost / offset up */
      #t1-stat-layer .plane-a {
        color: rgba(var(--accent-rgb), 0.85);
        text-shadow: 0 0 22px rgba(var(--accent-rgb),0.45);
        opacity: 0.42;
      }
      /* plane B — mid ghost / offset down */
      #t1-stat-layer .plane-b {
        color: rgba(255,255,255,0.85);
        text-shadow: 0 0 26px rgba(var(--accent-rgb),0.50);
        opacity: 0.55;
      }
      /* plane C — front / sharp / final glow */
      #t1-stat-layer .plane-c {
        color: var(--white);
        text-shadow: 0 0 30px rgba(255,255,255,0.50), 0 0 64px rgba(var(--accent-rgb),0.50);
        filter: drop-shadow(0 0 34px rgba(var(--accent-rgb),0.55));
        opacity: 1;
      }

      #t1-stat-layer .label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-med); color: var(--text-dim);
        text-align: center; max-width: 900px; line-height: 1.45;
      }
      #t1-stat-layer .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-layer .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-layer .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-layer .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-layer" data-composition-id="t1-stat-layer" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">AI QUERIES ANSWERED · 2026</div>

        <div class="stat-stack">
          <!-- three planes of the same number -->
          <div class="plane plane-a" id="ly-pa" data-slot="">58B</div>
          <div class="plane plane-b" id="ly-pb" data-slot="">58B</div>
          <div class="plane plane-c" id="ly-pc" data-slot="stat">58B</div>
        </div>

        <div class="label" data-slot="label">AI assistant queries handled by trained AIS graduates in the <em>first year post-certification</em></div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS USAGE REPORT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-stat-layer .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-layer .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-layer .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker */
        .from("#t1-stat-layer .kicker",
          { autoAlpha: 0, y: 18, duration: 0.7, ease: "power3.out" }, 0.40)

        /* planes stagger in at different offsets — then converge to y:0.
           NO filter tween: these are gradient-clipped text; animating blur on a
           background-clip:text element breaks the clip. Depth comes from
           offset + scale + opacity instead (focus-pull via scale, not blur). */
        /* plane A: starts far above, larger (soft rear plane) */
        .from("#ly-pa",
          { autoAlpha: 0, y: -110, scale: 1.10, transformOrigin: "50% 50%", duration: 1.2, ease: "power4.out" }, 0.50)
        /* plane B: starts below, larger */
        .from("#ly-pb",
          { autoAlpha: 0, y: 90, scale: 1.08, transformOrigin: "50% 50%", duration: 1.2, ease: "power4.out" }, 0.60)
        /* plane C: sharp front plane, scales up into focus */
        .from("#ly-pc",
          { autoAlpha: 0, y: -30, scale: 0.92, transformOrigin: "50% 50%", duration: 0.9, ease: "power4.out" }, 0.72)

        /* converge: A and B drift to zero offset + settle scale */
        .to("#ly-pa", { y: 0, scale: 1, opacity: 0.42, duration: 0.9, ease: "expo.out" }, 1.10)
        .to("#ly-pb", { y: 0, scale: 1, opacity: 0.55, duration: 0.9, ease: "expo.out" }, 1.15)

        /* once merged, ghost planes fade out leaving only sharp plane C */
        .to("#ly-pa", { autoAlpha: 0, duration: 0.55, ease: "power2.in" }, 2.00)
        .to("#ly-pb", { autoAlpha: 0, duration: 0.55, ease: "power2.in" }, 2.08)

        /* label */
        .from("#t1-stat-layer .label",
          { autoAlpha: 0, y: 22, duration: 0.85, ease: "power3.out" }, 2.05)

        /* source */
        .from("#t1-stat-layer .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.40)

        /* final glow breathe on plane C — drop-shadow→drop-shadow (same filter
           list, safe to interpolate; matches the ring card's glow technique) */
        .to("#ly-pc",
          { filter: "drop-shadow(0 0 56px rgba(55,189,248,0.80))",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.6)

        .set({}, {}, 7);

      window.__timelines["t1-stat-layer"] = tl;
    </script>
  </body>
</html>
