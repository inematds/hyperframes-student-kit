<!doctype html>
<!--
  KALLAWAY · tier1 · overview · LEGEND
  A Legend/Key panel: 4 rows, each a glowing color swatch + label + value.
  Builds top-to-bottom with spring stagger. Aurora bloom, glass panel.
  Slots: title, r1-label, r1-val, r2-label, r2-val, r3-label, r3-val, r4-label, r4-val.
  Knobs: data-color on each .legend-swatch (hex or rgba string, defaults to accent/warm/yellow/alert).
         data-pct on each .legend-row drives an animated bar fill (0-100, defaults 82,64,48,12).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-legend {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-legend .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-legend .dot-grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.44;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-legend .title-row {
        position: absolute; left: 0; right: 0; top: 80px;
        text-align: center; z-index: 4;
      }
      #t1-ov-legend .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-legend .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Legend glass panel */
      #t1-ov-legend .legend-panel {
        position: absolute; left: 340px; right: 340px;
        top: 236px; bottom: 80px;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--glass-shadow);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        padding: 60px 72px;
        display: flex; flex-direction: column; justify-content: space-between;
        z-index: 4; position: absolute; overflow: hidden;
      }
      #t1-ov-legend .legend-panel::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-hi) 20%, var(--glass-hi) 80%, transparent);
      }

      /* Legend row */
      #t1-ov-legend .legend-row {
        display: flex; align-items: center; gap: 40px;
        padding: 32px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      #t1-ov-legend .legend-row:last-child { border-bottom: none; }

      /* Swatch */
      #t1-ov-legend .legend-swatch {
        width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      }

      /* Label */
      #t1-ov-legend .legend-label {
        font-family: var(--font-body); font-size: var(--size-body);
        font-weight: var(--wt-semi); color: var(--text-dim);
        flex: 1; line-height: 1.3;
      }

      /* Bar track */
      #t1-ov-legend .legend-bar-track {
        width: 360px; height: 10px; border-radius: 5px;
        background: rgba(255,255,255,0.08); overflow: hidden;
        flex-shrink: 0;
      }
      #t1-ov-legend .legend-bar-fill {
        height: 100%; width: 0%; border-radius: 5px;
        transition: none;
      }

      /* Value */
      #t1-ov-legend .legend-val {
        font-family: var(--font-mono); font-size: var(--size-headline);
        font-weight: var(--wt-bold); letter-spacing: var(--track-snug);
        min-width: 160px; text-align: right; flex-shrink: 0;
        filter: drop-shadow(0 0 10px currentColor);
      }

      /* Vignette + grain */
      #t1-ov-legend .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-legend .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-legend" data-composition-id="t1-ov-legend" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="dot-grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">Reading the <em>Results</em></div>
      </div>

      <div class="legend-panel" id="legend-panel">

        <div class="legend-row" id="lr-1" data-pct="82">
          <div class="legend-swatch" id="ls-1" data-color="#37BDF8"
               style="background:#37BDF8;box-shadow:0 0 18px rgba(55,189,248,0.75);"></div>
          <div class="legend-label" data-slot="r1-label">Completed All Modules</div>
          <div class="legend-bar-track">
            <div class="legend-bar-fill" id="lbf-1"
                 style="background:linear-gradient(90deg,#37BDF8,rgba(55,189,248,0.55));
                        box-shadow:0 0 8px rgba(55,189,248,0.55);"></div>
          </div>
          <div class="legend-val" id="lv-1" data-slot="r1-val"
               style="color:#37BDF8;">0%</div>
        </div>

        <div class="legend-row" id="lr-2" data-pct="64">
          <div class="legend-swatch" id="ls-2" data-color="#FF8A5C"
               style="background:#FF8A5C;box-shadow:0 0 18px rgba(255,138,92,0.70);"></div>
          <div class="legend-label" data-slot="r2-label">Reached the Midpoint</div>
          <div class="legend-bar-track">
            <div class="legend-bar-fill" id="lbf-2"
                 style="background:linear-gradient(90deg,#FF8A5C,rgba(255,138,92,0.55));
                        box-shadow:0 0 8px rgba(255,138,92,0.55);"></div>
          </div>
          <div class="legend-val" id="lv-2" data-slot="r2-val"
               style="color:#FF8A5C;">0%</div>
        </div>

        <div class="legend-row" id="lr-3" data-pct="48">
          <div class="legend-swatch" id="ls-3" data-color="#F5D82A"
               style="background:#F5D82A;box-shadow:0 0 18px rgba(245,216,42,0.70);"></div>
          <div class="legend-label" data-slot="r3-label">Watched Less Than Half</div>
          <div class="legend-bar-track">
            <div class="legend-bar-fill" id="lbf-3"
                 style="background:linear-gradient(90deg,#F5D82A,rgba(245,216,42,0.55));
                        box-shadow:0 0 8px rgba(245,216,42,0.55);"></div>
          </div>
          <div class="legend-val" id="lv-3" data-slot="r3-val"
               style="color:#F5D82A;">0%</div>
        </div>

        <div class="legend-row" id="lr-4" data-pct="12">
          <div class="legend-swatch" id="ls-4" data-color="#FF3B30"
               style="background:#FF3B30;box-shadow:0 0 18px rgba(255,59,48,0.70);"></div>
          <div class="legend-label" data-slot="r4-label">Dropped Off in Week 1</div>
          <div class="legend-bar-track">
            <div class="legend-bar-fill" id="lbf-4"
                 style="background:linear-gradient(90deg,#FF3B30,rgba(255,59,48,0.55));
                        box-shadow:0 0 8px rgba(255,59,48,0.55);"></div>
          </div>
          <div class="legend-val" id="lv-4" data-slot="r4-val"
               style="color:#FF3B30;">0%</div>
        </div>

      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* read pct values */
      const rows = [
        { row: "lr-1", fill: "lbf-1", val: "lv-1" },
        { row: "lr-2", fill: "lbf-2", val: "lv-2" },
        { row: "lr-3", fill: "lbf-3", val: "lv-3" },
        { row: "lr-4", fill: "lbf-4", val: "lv-4" },
      ];

      /* grain flicker */
      tl.fromTo("#t1-ov-legend .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "97px 73px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-legend .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-legend .dot-grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-legend .title",
          { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.45)

        /* panel */
        .from("#legend-panel",
          { autoAlpha: 0, scale: 0.96, transformOrigin: "50% 50%",
            filter: "blur(12px)", duration: 1.0, ease: "expo.out" }, 0.85);

      /* rows build in staggered */
      rows.forEach(({ row }, i) => {
        tl.from("#" + row,
          { autoAlpha: 0, x: -30, filter: "blur(8px)",
            duration: 0.70, ease: "power3.out" }, 1.20 + i * 0.18);
      });

      /* bars animate + values count up */
      rows.forEach(({ row, fill, val }, i) => {
        const rowEl = document.getElementById(row);
        const pct = parseFloat(rowEl.getAttribute("data-pct")) || 50;
        const valEl = document.getElementById(val);
        const fillEl = document.getElementById(fill);

        tl.to({ v: 0 }, {
          v: pct,
          duration: 1.0, ease: "power2.out",
          onUpdate: function() {
            const v = this.targets()[0].v;
            fillEl.style.width = v + "%";
            valEl.textContent = Math.round(v) + "%";
          }
        }, 1.50 + i * 0.18);
      });

      /* swatch glow pulse on r1 (box-shadow tweak via gsap — opacity on element) */
      tl.to("#ls-1",
        { opacity: 0.65, scale: 1.12, transformOrigin: "50% 50%",
          duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0);

      /* slow drift */
      tl.to("#legend-panel",
        { y: -8, duration: 5.0, ease: "sine.inOut" }, 2.2);

      tl.set({}, {}, 7);
      window.__timelines["t1-ov-legend"] = tl;
    </script>
  </body>
</html>
