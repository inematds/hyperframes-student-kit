<!doctype html>
<!--
  KALLAWAY · tier1 · stat · SCORE
  Big glowing score out of a total — e.g. "9.2 / 10". The numerator counts up
  to its value; the denominator (" / 10") is dim and small to the right.
  A glass arc behind the number hints at a scale. Aurora bloom, deep vignette.
  Slots: kicker (~28 chars uppercase), stat (numerator value e.g. "9.2"),
         label (~70 chars), source (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-stat-score {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-stat-score .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-stat-score .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Decorative arc behind score — subtle glass ring */
      #t1-stat-score .arc-bg {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -54%);
        width: 760px; height: 760px;
        border-radius: 50%;
        border: 2px solid rgba(var(--accent-rgb), 0.12);
        box-shadow: 0 0 60px 0px rgba(var(--accent-rgb), 0.10);
        z-index: 2;
      }
      /* Glow aura inside */
      #t1-stat-score .arc-glow {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -54%);
        width: 580px; height: 580px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.16) 0%, transparent 65%);
        z-index: 2;
      }

      /* Small marker dots at 0 and 10 on the arc */
      #t1-stat-score .arc-dot {
        position: absolute;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 0 8px 2px rgba(var(--accent-rgb), 0.50);
        z-index: 3;
      }
      /* top-center = max (10) */
      #t1-stat-score .arc-dot.dot-max {
        left: 50%; top: -5px; transform: translateX(-50%);
      }
      /* bottom-center = min (0) — not used visually but anchors the arc logic */

      /* Score display — kicker / score / label column */
      #t1-stat-score .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 4; gap: 36px; padding-bottom: 30px;
      }

      #t1-stat-score .kicker {
        font-family: var(--font-mono);
        font-size: var(--size-label);
        font-weight: var(--wt-bold);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Score number block */
      #t1-stat-score .score-block {
        display: flex; align-items: flex-end; gap: 0;
        line-height: 1;
      }
      #t1-stat-score .score-num {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 220px;
        letter-spacing: -0.04em;
        background: linear-gradient(150deg, #ffffff 15%, rgba(var(--accent-rgb), 0.85) 75%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), 0.55));
        line-height: 1;
      }
      #t1-stat-score .score-denom {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: 72px;
        letter-spacing: var(--track-snug);
        color: var(--text-faint);
        padding-bottom: 28px; /* align to baseline */
        padding-left: 12px;
        line-height: 1;
      }

      /* Stars row */
      #t1-stat-score .stars {
        display: flex; gap: 14px; align-items: center;
        margin-top: -8px;
      }
      #t1-stat-score .star {
        width: 36px; height: 36px;
      }
      #t1-stat-score .star.filled path {
        fill: var(--accent-2);
        filter: drop-shadow(0 0 6px rgba(var(--accent2-rgb),0.70));
      }
      #t1-stat-score .star.dim path {
        fill: rgba(255,255,255,0.12);
      }

      #t1-stat-score .label {
        font-family: var(--font-body);
        font-size: var(--size-body);
        font-weight: var(--wt-med);
        color: var(--text-dim);
        text-align: center;
        max-width: 860px;
        line-height: 1.45;
      }
      #t1-stat-score .label em {
        font-style: normal; color: var(--text); text-shadow: var(--textglow);
      }

      #t1-stat-score .source {
        position: absolute; left: var(--pad); bottom: 44px;
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-reg); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-faint); z-index: 5;
      }

      #t1-stat-score .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-stat-score .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-score" data-composition-id="t1-stat-score"
         data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="arc-bg">
        <div class="arc-dot dot-max"></div>
      </div>
      <div class="arc-glow"></div>

      <div class="stage">
        <div class="kicker" data-slot="kicker">STUDENT SATISFACTION SCORE</div>

        <div class="score-block">
          <div class="score-num" id="t1-stat-score-num" data-slot="stat">9.2</div>
          <div class="score-denom">/ 10</div>
        </div>

        <!-- 9 filled stars + 1 dim -->
        <div class="stars" id="t1-stat-score-stars">
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star filled" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
          <svg class="star dim" viewBox="0 0 36 36"><path d="M18 2l4.5 9.2 10.2 1.5-7.4 7.2 1.8 10.1L18 25.3l-9.1 4.7 1.8-10.1L3.3 12.7l10.2-1.5z"/></svg>
        </div>

        <div class="label" data-slot="label">post-course rating from <em>14,000+ learners</em> across 38 AI training modules in 2026</div>
      </div>

      <div class="source" data-slot="source">SOURCE · AIS LEARNER SURVEY Q4 2026</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl  = document.getElementById("t1-stat-score-num");
      const stars  = document.querySelectorAll("#t1-stat-score-stars .star");
      /* Target: 9.2 (one decimal place) */
      const target = 9.2;

      /* ambient grain flicker */
      tl.fromTo("#t1-stat-score .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "105px 82px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-stat-score .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-stat-score .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* arc rings */
        .from("#t1-stat-score .arc-bg",
          { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 1.1, ease: "power4.out" }, 0.30)
        .from("#t1-stat-score .arc-glow",
          { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%", duration: 1.2, ease: "expo.out" }, 0.35)

        /* kicker */
        .from("#t1-stat-score .kicker",
          { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.55)

        /* denominator appears first (dim anchor) */
        .from("#t1-stat-score .score-denom",
          { autoAlpha: 0, x: -20, duration: 0.6, ease: "power3.out" }, 0.80)

        /* score counts up 0.0 → 9.2 */
        .from("#t1-stat-score .score-num",
          { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 0.82)
        .to({ val: 0 }, {
          val: target,
          duration: 1.5, ease: "power2.out",
          onUpdate: function () {
            const v = this.targets()[0].val;
            numEl.textContent = v.toFixed(1);
          }
        }, 0.85)

        /* stars cascade in */
        .from("#t1-stat-score .star",
          { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%",
            duration: 0.35, ease: "back.out(1.4)", stagger: 0.06 }, 1.80)

        /* label */
        .from("#t1-stat-score .label",
          { autoAlpha: 0, y: 20, filter: "blur(6px)", duration: 0.8, ease: "power3.out" }, 2.50)

        /* source */
        .from("#t1-stat-score .source",
          { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 2.80)

        /* breathing glow on arc */
        .to("#t1-stat-score .arc-glow",
          { opacity: 0.55, scale: 1.12, transformOrigin: "50% 50%",
            duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.00)

        .set({}, {}, 7);

      window.__timelines["t1-stat-score"] = tl;
    </script>
  </body>
</html>
