<!doctype html>
<!--
  KALLAWAY · tier1 · section · UNDERLINE-GROW
  Full-screen chapter takeover. The headline appears first; then a glowing
  blue underline grows from the center outward beneath it, like an accent
  line being drawn in neon light. A soft halo blooms under the word as the
  line completes.
  Slots: kicker (~20 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-ugrow {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-sec-ugrow .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-sec-ugrow .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.40;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
      }

      /* Layout */
      #t1-sec-ugrow .content {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        z-index: 4; gap: 0;
      }

      #t1-sec-ugrow .kicker {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent);
        margin-bottom: 36px;
      }

      /* Headline + underline container */
      #t1-sec-ugrow .headline-block {
        position: relative;
        display: inline-block;
        text-align: center;
        padding: 0 80px;
      }
      #t1-sec-ugrow .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-title); line-height: 1.08; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        display: block;
        max-width: 1340px;
        text-align: center;
      }
      #t1-sec-ugrow .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Underline container — grows from center */
      #t1-sec-ugrow .underline-wrap {
        position: relative;
        height: 20px;
        margin-top: 18px;
        width: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      /* The actual underline — starts at 0 width, grows symmetrically via scaleX */
      #t1-sec-ugrow .underline {
        height: 3px;
        width: 900px;   /* max width; scaleX goes 0→1 */
        transform-origin: 50% 50%;
        transform: scaleX(0);
        border-radius: 3px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(var(--accent-rgb), 0.55) 12%,
          var(--accent) 38%,
          #ffffff 50%,
          var(--accent) 62%,
          rgba(var(--accent-rgb), 0.55) 88%,
          transparent 100%);
        box-shadow: 0 0 14px 3px rgba(var(--accent-rgb), 0.65),
                    0 0 40px 8px rgba(var(--accent-rgb), 0.30);
        position: relative; z-index: 2;
      }
      /* Soft glow bloom beneath the underline */
      #t1-sec-ugrow .underline-glow {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 1200px; height: 120px;
        background: radial-gradient(ellipse, rgba(var(--accent-rgb), 0.18) 0%, transparent 65%);
        filter: blur(28px);
        z-index: 1;
        opacity: 0;
      }

      /* End caps — glowing dots where the underline terminates */
      #t1-sec-ugrow .cap-left,
      #t1-sec-ugrow .cap-right {
        position: absolute;
        top: 50%;
        width: 10px; height: 10px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px 4px rgba(var(--accent-rgb), 0.85);
        z-index: 3;
        opacity: 0;
      }
      #t1-sec-ugrow .cap-left  { left: calc(50% - 450px); }
      #t1-sec-ugrow .cap-right { right: calc(50% - 450px); }

      #t1-sec-ugrow .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-ugrow .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-ugrow" data-composition-id="t1-sec-ugrow" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">— Introduction —</div>
        <div class="headline-block">
          <div class="headline" data-slot="headline">Why <em>Context</em> Is the Most<br>Valuable Thing You Can Give</div>
          <div class="underline-wrap">
            <div class="underline-glow" id="t1-sec-ugrow-glw"></div>
            <div class="underline" id="t1-sec-ugrow-line"></div>
            <div class="cap-left" id="t1-sec-ugrow-cap-l"></div>
            <div class="cap-right" id="t1-sec-ugrow-cap-r"></div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-sec-ugrow .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-ugrow .bloom",
          { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-ugrow .grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* kicker glides in */
        .from("#t1-sec-ugrow .kicker",
          { autoAlpha: 0, y: 16, filter: "blur(8px)", duration: 0.7, ease: "power3.out" }, 0.5)

        /* headline fades in — use autoAlpha + y (no blur on gradient-clipped em text) */
        .from("#t1-sec-ugrow .headline",
          { autoAlpha: 0, y: 28, duration: 0.9, ease: "power4.out" }, 0.75)

        /* underline grows from center outward */
        .to("#t1-sec-ugrow-line",
          { scaleX: 1, duration: 0.9, ease: "power3.out" }, 1.5)

        /* end caps pop into place as the line finishes */
        .to("#t1-sec-ugrow-cap-l, #t1-sec-ugrow-cap-r",
          { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%",
            duration: 0.35, ease: "back.out(2)" }, 2.2)

        /* bloom under the underline */
        .to("#t1-sec-ugrow-glw",
          { autoAlpha: 1, duration: 0.65, ease: "power2.out" }, 1.7)

        /* breathing glow pulse on the underline — finite */
        .to("#t1-sec-ugrow-line",
          { opacity: 0.55, boxShadow: "0 0 24px 6px rgba(55,189,248,0.75), 0 0 70px 14px rgba(55,189,248,0.35)",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.5)

        /* bloom breathes in sync */
        .to("#t1-sec-ugrow-glw",
          { opacity: 0.45, scale: 1.15, transformOrigin: "50% 50%",
            duration: 1.5, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.5)

        .set({}, {}, 7);

      window.__timelines["t1-sec-ugrow"] = tl;
    </script>
  </body>
</html>
