<!doctype html>
<!--
  KALLAWAY · tier1 · section · SPHERE-TOP
  Full-screen chapter takeover. Like the gold orb card but INVERTED: the glowing
  sphere descends from the TOP of the frame, its bright crown entering first.
  The headline and kicker sit in the lower third, lit from above by the sphere's
  light. Creates a sense of something arriving — revelation from above.
  Slots: kicker (~16 chars), headline (~52 chars, <em> wraps one phrase for accent).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-sphere {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Base aurora bloom — still from bottom for ambient canvas warmth */
      #t1-sec-sphere .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }

      /* Secondary bloom emanating DOWNWARD from the top where the sphere is */
      #t1-sec-sphere .bloom-top {
        position: absolute; left: 0; right: 0; top: 0; height: 700px;
        background: radial-gradient(90% 80% at 50% -5%,
          rgba(var(--accent-rgb), 0.38) 0%,
          rgba(var(--accent-rgb), 0.12) 40%,
          transparent 70%);
        z-index: 1; pointer-events: none;
      }

      /* Dot grid */
      #t1-sec-sphere .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 40%, #000 35%, transparent 80%);
                mask-image: radial-gradient(120% 100% at 50% 40%, #000 35%, transparent 80%);
      }

      /* Sphere wrapper — positioned so it descends from the TOP */
      #t1-sec-sphere .orb-wrap {
        position: absolute; left: 50%; top: -680px;
        transform: translateX(-50%);
        width: 1180px; height: 1180px; z-index: 2;
      }

      /* The sphere — same construction as gold card but "bottom-lit" becomes top */
      #t1-sec-sphere .orb {
        position: absolute; inset: 0; border-radius: 50%;
        background:
          radial-gradient(circle at 50% 68%,
            rgba(255,255,255,0.92) 0%,
            rgba(var(--accent-rgb), 0.85) 9%,
            rgba(var(--accent-rgb), 0.34) 38%,
            rgba(var(--accent-rgb), 0.06) 62%,
            transparent 72%);
        box-shadow: 0 0 160px 20px rgba(var(--accent-rgb), 0.40);
      }

      /* Bright horizon rim — now at the BOTTOM of the orb (facing down into the frame) */
      #t1-sec-sphere .rim {
        position: absolute; inset: 0; border-radius: 50%;
        box-shadow: inset 0 -6px 22px rgba(255,255,255,0.65),
                    inset 0 -2px 6px rgba(255,255,255,0.90);
        -webkit-mask-image: radial-gradient(circle at 50% 68%, transparent 60%, #000 64%, transparent 78%);
                mask-image: radial-gradient(circle at 50% 68%, transparent 60%, #000 64%, transparent 78%);
      }

      /* Cast-light panel — the glow the sphere throws down onto the canvas */
      #t1-sec-sphere .cast-light {
        position: absolute; left: 50%; top: 400px; transform: translateX(-50%);
        width: 800px; height: 300px;
        background: radial-gradient(ellipse at 50% 0%,
          rgba(var(--accent-rgb), 0.20) 0%,
          rgba(var(--accent-rgb), 0.06) 50%,
          transparent 80%);
        filter: blur(28px);
        z-index: 3; pointer-events: none;
      }

      /* Content sits in lower third */
      #t1-sec-sphere .content {
        position: absolute; left: 0; right: 0; bottom: 160px;
        text-align: center; z-index: 4;
      }

      /* Kicker */
      #t1-sec-sphere .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 26px;
      }

      /* Soft glow plate behind headline */
      #t1-sec-sphere .plate {
        position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
        width: 1180px; height: 150px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(255,255,255,0.16), transparent 70%);
        filter: blur(14px); z-index: -1;
      }

      /* Headline */
      #t1-sec-sphere .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1320px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-sphere .headline em {
        font-style: normal; color: var(--accent);
        text-shadow: var(--textglow-accent);
      }

      /* Vignette + grain */
      #t1-sec-sphere .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-sphere .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-sphere" data-composition-id="t1-sec-sphere" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="bloom-top"></div>
      <div class="grid"></div>

      <div class="orb-wrap">
        <div class="orb"></div>
        <div class="rim"></div>
      </div>

      <div class="cast-light"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 5 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">The <em>Moment</em> Everything Changes</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient grain flicker */
      tl.fromTo("#t1-sec-sphere .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* base bloom + top bloom */
      tl.from("#t1-sec-sphere .bloom",
        { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.3, ease: "expo.out" }, 0)
        .from("#t1-sec-sphere .bloom-top",
          { autoAlpha: 0, scaleY: 0.6, transformOrigin: "50% 0%", duration: 1.5, ease: "expo.out" }, 0)
        .from("#t1-sec-sphere .grid",
          { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)

        /* sphere DESCENDS from top — starts off-screen above, moves down */
        .from("#t1-sec-sphere .orb-wrap",
          { autoAlpha: 0, y: -180, scale: 0.94, transformOrigin: "50% 50%",
            duration: 1.6, ease: "power4.out" }, 0.15)

        /* cast light blooms as sphere arrives */
        .from("#t1-sec-sphere .cast-light",
          { autoAlpha: 0, scaleX: 0.5, duration: 1.0, ease: "power3.out" }, 1.0)

        /* kicker glides up from below */
        .from("#t1-sec-sphere .kicker",
          { autoAlpha: 0, y: 24, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 0.9)

        /* plate blooms */
        .from("#t1-sec-sphere .plate",
          { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 1.1)

        /* headline glides up + focus pull */
        .from("#t1-sec-sphere .headline",
          { autoAlpha: 0, y: 34, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.15)

        /* plate breathes */
        .to("#t1-sec-sphere .plate",
          { opacity: 0.55, duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.2)

        /* sphere continues to slowly descend during the hold — gravity-settle feel */
        .to("#t1-sec-sphere .orb-wrap",
          { y: 30, duration: 5.0, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-sec-sphere"] = tl;
    </script>
  </body>
</html>
