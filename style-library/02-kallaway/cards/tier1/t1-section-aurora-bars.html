<!doctype html>
<!--
  KALLAWAY · tier1 · section · AURORA-BARS
  Full-screen chapter takeover. Vertical aurora light bars of varying height
  glow blue behind the title; bars rise and scale up in sequence before the
  headline glides in over them.
  Slots: kicker (~16 chars), headline (~52 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-abars {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Deep bloom from the bottom — aurora base ambience */
      #t1-sec-abars .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom);
        z-index: 1;
      }

      /* Dot grid */
      #t1-sec-abars .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(120% 100% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Bar stage — full width, anchored to the bottom */
      #t1-sec-abars .bars-stage {
        position: absolute; left: 0; right: 0; bottom: 0; height: 820px;
        z-index: 2;
        display: flex; align-items: flex-end; justify-content: center;
        gap: 0px; padding: 0 60px;
      }

      /* Individual bar — each has a different height set inline via CSS vars */
      #t1-sec-abars .bar {
        flex: 1; max-width: 68px; border-radius: 6px 6px 0 0;
        background: linear-gradient(
          to top,
          rgba(var(--accent-rgb), 0.85) 0%,
          rgba(var(--accent-rgb), 0.38) 55%,
          rgba(var(--accent-rgb), 0.05) 100%
        );
        box-shadow:
          0 0 18px rgba(var(--accent-rgb), 0.50),
          0 0 60px rgba(var(--accent-rgb), 0.22);
        transform-origin: bottom center;
      }

      /* Content block centred in the upper half */
      #t1-sec-abars .content {
        position: absolute; left: 0; right: 0; top: 268px;
        text-align: center; z-index: 5;
      }
      #t1-sec-abars .kicker {
        font-family: var(--font-display); font-style: italic; font-weight: var(--wt-semi);
        font-size: 40px; letter-spacing: 0.12em; color: var(--white);
        text-shadow: var(--textglow); margin-bottom: 28px;
      }
      /* Soft glow plate */
      #t1-sec-abars .plate {
        position: absolute; left: 50%; top: 82px; transform: translateX(-50%);
        width: 1200px; height: 160px; border-radius: 50%;
        background: radial-gradient(60% 100% at 50% 50%, rgba(255,255,255,0.13), transparent 70%);
        filter: blur(18px); z-index: -1;
      }
      #t1-sec-abars .headline {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: 1.06; letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1340px; margin: 0 auto; padding: 0 60px;
      }
      #t1-sec-abars .headline em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Horizontal rule line beneath bars — neon hairline */
      #t1-sec-abars .floor-line {
        position: absolute; left: 60px; right: 60px; bottom: 0; height: var(--stroke);
        background: linear-gradient(to right,
          transparent 0%,
          rgba(var(--accent-rgb), 0.60) 15%,
          rgba(var(--accent-rgb), 0.90) 50%,
          rgba(var(--accent-rgb), 0.60) 85%,
          transparent 100%);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.50);
        z-index: 3;
      }

      #t1-sec-abars .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-abars .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-abars" data-composition-id="t1-sec-abars" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <!-- 24 bars with hardcoded heights to create a varied waveform profile -->
      <div class="bars-stage">
        <div class="bar" style="height:140px"></div>
        <div class="bar" style="height:220px"></div>
        <div class="bar" style="height:310px"></div>
        <div class="bar" style="height:480px"></div>
        <div class="bar" style="height:390px"></div>
        <div class="bar" style="height:560px"></div>
        <div class="bar" style="height:680px"></div>
        <div class="bar" style="height:720px"></div>
        <div class="bar" style="height:600px"></div>
        <div class="bar" style="height:780px"></div>
        <div class="bar" style="height:820px"></div>
        <div class="bar" style="height:760px"></div>
        <div class="bar" style="height:820px"></div>
        <div class="bar" style="height:790px"></div>
        <div class="bar" style="height:820px"></div>
        <div class="bar" style="height:750px"></div>
        <div class="bar" style="height:700px"></div>
        <div class="bar" style="height:560px"></div>
        <div class="bar" style="height:440px"></div>
        <div class="bar" style="height:360px"></div>
        <div class="bar" style="height:260px"></div>
        <div class="bar" style="height:180px"></div>
        <div class="bar" style="height:110px"></div>
        <div class="bar" style="height:70px"></div>
      </div>

      <div class="floor-line"></div>

      <div class="content">
        <div class="kicker" data-slot="kicker">&mdash; 2 &mdash;</div>
        <div class="plate"></div>
        <div class="headline" data-slot="headline">The <em>Signal</em> Inside the Machine</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker — finite, deterministic */
      tl.fromTo("#t1-sec-abars .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom fades in */
      tl.from("#t1-sec-abars .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-abars .grid",  { autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.2)
        .from("#t1-sec-abars .floor-line", { scaleX: 0, transformOrigin: "50% 50%", duration: 0.8, ease: "expo.out" }, 0.3);

      /* bars rise in sequence from left to right */
      tl.from("#t1-sec-abars .bar", {
        scaleY: 0, autoAlpha: 0,
        duration: 1.1, ease: "expo.out",
        stagger: { each: 0.045, from: "start" },
        transformOrigin: "50% 100%"
      }, 0.25);

      /* kicker + headline glide in */
      tl.from("#t1-sec-abars .kicker",   { autoAlpha: 0, y: 22, filter: "blur(10px)", duration: 0.8, ease: "power3.out" }, 1.0)
        .from("#t1-sec-abars .plate",    { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 1.15)
        .from("#t1-sec-abars .headline", { autoAlpha: 0, y: 32, filter: "blur(16px)", duration: 1.0, ease: "power4.out" }, 1.25);

      /* breathing plate glow — finite pulse */
      tl.to("#t1-sec-abars .plate", { opacity: 0.50, duration: 1.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 2.4);

      /* gentle bar drift — outermost bars drift outward slightly */
      tl.to("#t1-sec-abars .bloom", { scale: 1.04, transformOrigin: "50% 120%", duration: 4.0, ease: "sine.inOut" }, 2.2);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-abars"] = tl;
    </script>
  </body>
</html>
