<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · NUMBER OVER ENGRAVING
  Big number in front of a masked vintage engraving: a duotone/halftone block
  (orange + ink) fills most of the canvas as the image placeholder, with a slow
  camera push for depth. One yellow marker word in the label. Vox archive feel.
  Slots: kicker, stat, label (richtext, <em> = yellow marker), engraving (image), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-engrave {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--ink); color: var(--paper);
        font-family: var(--font-display); overflow: hidden;
      }

      /* engraving stage — pushes slowly */
      #t1-stat-engrave .stage {
        position: absolute; inset: 0; transform-origin: 50% 50%;
      }
      /* engraving image/placeholder — duotone orange-over-ink halftone */
      #t1-stat-engrave .engraving {
        position: absolute; inset: 0;
        background-image: var(--tex-halftone);
        background-size: var(--tex-halftone-size);
        background-color: var(--orange);
        background-blend-mode: multiply;
        /* hard right-edge mask so left column stays dark for text */
        -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 22%, rgba(0,0,0,1) 44%, rgba(0,0,0,1) 100%);
        mask-image:         linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 22%, rgba(0,0,0,1) 44%, rgba(0,0,0,1) 100%);
        opacity: 0.88;
      }
      /* faint horizontal line texture over engraving for engraving feel */
      #t1-stat-engrave .engraving::after {
        content: "";
        position: absolute; inset: 0;
        background-image: repeating-linear-gradient(
          180deg, transparent 0px, transparent 5px,
          rgba(23,19,14,0.14) 5px, rgba(23,19,14,0.14) 6px
        );
        mix-blend-mode: multiply;
      }

      /* ink scrim so left-side text reads cleanly */
      #t1-stat-engrave .scrim {
        position: absolute; inset: 0; z-index: 2;
        background: linear-gradient(
          90deg,
          rgba(23,19,14,0.92) 0%,
          rgba(23,19,14,0.72) 30%,
          rgba(23,19,14,0.10) 58%,
          transparent 100%
        );
      }

      #t1-stat-engrave .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: overlay; opacity: 0.5; pointer-events: none; z-index: 6;
      }

      /* kicker */
      #t1-stat-engrave .kicker {
        position: absolute; left: 130px; top: 220px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--orange);
      }

      /* big stat */
      #t1-stat-engrave .stat {
        position: absolute; left: 110px; top: 50%; transform: translateY(-52%); z-index: 4;
        font-weight: var(--wt-black); font-size: 480px; line-height: 0.85;
        letter-spacing: -0.06em; color: var(--paper);
        font-variant-numeric: tabular-nums;
        text-shadow: 0 12px 48px rgba(23,19,14,0.6);
      }

      /* label */
      #t1-stat-engrave .label {
        position: absolute; left: 130px; right: 860px; bottom: 200px; z-index: 4;
        font-weight: var(--wt-thin); font-size: 60px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--paper);
      }
      #t1-stat-engrave .label em {
        font-style: normal; font-weight: var(--wt-black); color: var(--ink);
        background: var(--yellow); padding: 0 12px;
        box-decoration-break: clone; -webkit-box-decoration-break: clone;
      }

      /* source */
      #t1-stat-engrave .source {
        position: absolute; left: 130px; bottom: 96px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: rgba(239,233,220,0.6);
      }

      /* small decorative orange rule under kicker */
      #t1-stat-engrave .rule {
        position: absolute; left: 130px; top: 256px; width: 80px; height: 4px;
        background: var(--orange); z-index: 4;
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-engrave" data-composition-id="t1-stat-engrave" data-start="0" data-width="1920" data-height="1080">
      <div class="stage">
        <div class="engraving" data-slot="engraving"></div>
      </div>
      <div class="scrim"></div>
      <div class="kicker" data-slot="kicker">ARCHIVE FIGURE</div>
      <div class="rule"></div>
      <div class="stat" data-slot="stat">1.2M</div>
      <div class="label" data-slot="label">subscribers before a single <em>paid ad</em></div>
      <div class="source" data-slot="source">ARCHIVE · 1998</div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // slow camera push on engraving stage
      tl.fromTo("#t1-stat-engrave .stage",
        { scale: 1.0 },
        { scale: 1.09, duration: 6, ease: "none" }, 0);

      // grain flicker
      tl.fromTo("#t1-stat-engrave .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // engraving fades in
      tl.from("#t1-stat-engrave .engraving", { autoAlpha: 0, duration: 0.55 }, 0);

      // kicker + rule
      tl.from("#t1-stat-engrave .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.28);
      tl.from("#t1-stat-engrave .rule",   { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.25, ease: "power2.out" }, 0.5);

      // stat clips upward into view
      tl.from("#t1-stat-engrave .stat", {
        autoAlpha: 0, y: 60, clipPath: "inset(0 0 100% 0)",
        duration: 0.52, ease: "power3.out"
      }, 0.54);

      // label
      tl.from("#t1-stat-engrave .label",  { autoAlpha: 0, y: 22, duration: 0.42, ease: "power3.out" }, 0.94);

      // source
      tl.from("#t1-stat-engrave .source", { autoAlpha: 0, duration: 0.3 }, 1.25);

      tl.set({}, {}, 6);
      window.__timelines["t1-stat-engrave"] = tl;
    </script>
  </body>
</html>
