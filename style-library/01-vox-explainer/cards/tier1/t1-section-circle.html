<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · CIRCLE
  Yellow circle eye-magnet behind a thin+black-italic Fraunces headline, archive
  cutout scrap.
  Slots: kicker, headline (<em> for italic-black emphasis), scrap (image), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-circle {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-circle .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-circle .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none;
      }
      #t1-sec-circle .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(23,19,14,0.16) 100%);
      }
      #t1-sec-circle .stage { position: absolute; inset: 0; transform-origin: 52% 50%; }
      #t1-sec-circle .circle {
        position: absolute; left: 600px; top: 360px; width: 360px; height: 360px;
        border-radius: 50%; background: var(--yellow); z-index: 1;
      }
      #t1-sec-circle .kicker {
        position: absolute; left: 150px; top: 300px; z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
      }
      #t1-sec-circle .kicker::before {
        content: ""; display: inline-block; width: 64px; height: 3px;
        background: var(--red); margin-right: 18px; vertical-align: middle;
      }
      #t1-sec-circle .headline {
        position: absolute; left: 150px; top: 360px; width: 1160px; z-index: 3;
        font-weight: var(--wt-thin); font-size: var(--size-display);
        line-height: 0.96; letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-circle .headline em { font-style: italic; font-weight: var(--wt-black); }
      #t1-sec-circle .scrap {
        position: absolute; right: 150px; top: 250px; width: 470px; height: 560px;
        background-color: var(--paper-2); background-image: var(--tex-halftone);
        background-size: var(--tex-halftone-size);
        outline: 10px solid var(--orange); outline-offset: -10px;
        transform: rotate(2.2deg); z-index: 2; box-shadow: 18px 22px 0 rgba(23,19,14,0.12);
      }
      #t1-sec-circle .scrap::after {
        content: "ARCHIVE"; position: absolute; left: 14px; bottom: 12px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        color: var(--muted); background: var(--yellow); padding: 2px 10px;
      }      #t1-sec-circle .source {
        position: absolute; left: 150px; bottom: 96px; z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-circle" data-composition-id="t1-sec-circle" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="stage">
        <div class="circle"></div>
        <div class="scrap" data-slot="scrap"></div>
        <div class="kicker" data-slot="kicker">CHAPTER 01</div>
        <div class="headline" data-slot="headline">How the internet <em>rewired</em> attention</div>
        <div class="source" data-slot="source">SOURCE · INTERNAL RESEARCH 2026</div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-circle .stage", { scale: 1.0, x: 0 }, { scale: 1.06, x: -14, duration: 6, ease: "none" }, 0);
      tl.fromTo("#t1-sec-circle .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "180px 120px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-circle .scrap", { autoAlpha: 0, x: 80, rotate: 10, duration: 0.5, ease: "back.out(1.8)" }, 0.15)
        .from("#t1-sec-circle .circle", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(2.2)" }, 0.3)
        .from("#t1-sec-circle .kicker", { autoAlpha: 0, x: -30, duration: 0.3, ease: "steps(4)" }, 0.45)
        .from("#t1-sec-circle .headline", { autoAlpha: 0, yPercent: 12, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.55)
        .from("#t1-sec-circle .source", { autoAlpha: 0, duration: 0.3 }, 1.2);
      window.__timelines["t1-sec-circle"] = tl;
    </script>
  </body>
</html>
