<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · MAP
  Title over a vintage map fragment (lat/long grid + static engraved routes),
  a yellow location marker with a crosshair. Geography register.
  Slots: kicker, headline (<em> emphasis), place (marker label).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-map {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper-2); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      /* lat/long graticule */
      #t1-sec-map .geo {
        position: absolute; inset: 0; opacity: 0.5;
        background-image:
          repeating-linear-gradient(0deg, rgba(23,19,14,0.10) 0 1px, transparent 1px 120px),
          repeating-linear-gradient(90deg, rgba(23,19,14,0.10) 0 1px, transparent 1px 120px);
      }
      #t1-sec-map svg.routes { position: absolute; inset: 0; opacity: 0.45; }
      #t1-sec-map svg.routes path { fill: none; stroke: var(--ink); stroke-width: 3; }
      #t1-sec-map svg.routes path.river { stroke: rgba(23,19,14,0.5); stroke-width: 5; }
      #t1-sec-map .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.5; pointer-events: none; z-index: 6;
      }
      #t1-sec-map .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(130% 120% at 40% 45%, transparent 52%, rgba(23,19,14,0.24) 100%);
      }
      /* location marker (yellow dot + ink crosshair) */
      #t1-sec-map .marker { position: absolute; right: 430px; top: 300px; z-index: 4; }
      #t1-sec-map .marker .ring { width: 120px; height: 120px; border: 4px solid var(--ink); border-radius: 50%; }
      #t1-sec-map .marker .dot { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; background: var(--yellow); border: 4px solid var(--ink); border-radius: 50%; }
      #t1-sec-map .marker .cx, #t1-sec-map .marker .cy { position: absolute; background: var(--ink); }
      #t1-sec-map .marker .cx { left: -30px; right: -30px; top: 58px; height: 3px; }
      #t1-sec-map .marker .cy { top: -30px; bottom: -30px; left: 58px; width: 3px; }
      #t1-sec-map .place {
        position: absolute; right: 320px; top: 330px; z-index: 5;
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: 30px;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink);
        background: var(--yellow); padding: 4px 14px; transform: rotate(-2deg);
      }
      #t1-sec-map .kicker {
        position: absolute; left: 150px; bottom: 430px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink); background: var(--paper); padding: 5px 14px;
      }
      #t1-sec-map .headline {
        position: absolute; left: 150px; bottom: 150px; width: 1300px; z-index: 4;
        font-weight: var(--wt-black); font-size: 138px; line-height: 0.94;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-map .headline em { font-style: normal; background: var(--yellow); padding: 0 14px; }
    </style>
  </head>
  <body>
    <div id="t1-sec-map" data-composition-id="t1-sec-map" data-start="0" data-width="1920" data-height="1080">
      <div class="geo"></div>
      <svg class="routes" viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path class="river" d="M-20 240 C 360 300, 520 140, 900 260 S 1500 360, 1960 250" />
        <path d="M200 700 C 500 640, 760 820, 1100 720 S 1700 700, 1960 780" />
        <path d="M1300 80 C 1260 280, 1480 440, 1380 640" />
      </svg>
      <div class="marker"><div class="ring"></div><div class="cx"></div><div class="cy"></div><div class="dot"></div></div>
      <div class="place" data-slot="place">SECTOR 12</div>
      <div class="kicker" data-slot="kicker">WHERE IT HAPPENED</div>
      <div class="headline" data-slot="headline">The <em>border</em> town</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-map .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-map .geo", { autoAlpha: 0, duration: 0.5 }, 0.1)
        .from("#t1-sec-map .routes", { autoAlpha: 0, duration: 0.5 }, 0.25)
        .from("#t1-sec-map .marker", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(2.2)" }, 0.5)
        .from("#t1-sec-map .place", { autoAlpha: 0, x: 20, duration: 0.3, ease: "steps(4)" }, 0.7)
        .from("#t1-sec-map .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.75)
        .from("#t1-sec-map .headline", { autoAlpha: 0, y: 30, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.85)
        .set({}, {}, 6);
      window.__timelines["t1-sec-map"] = tl;
    </script>
  </body>
</html>
