<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · INDEX-CARD SET
  3 index/file cards laid out (slightly overlapping, staggered), each with a RED
  index tab at the top. Each card = a tab label + a topic line + faint ruled lines.
  Cards drop/stagger in. Marker title at top.
  Slots: title, tab1, card1, tab2, card2, tab3, card3, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-index {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-index .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-index .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 9;
      }
      #t1-ov-index .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: radial-gradient(130% 120% at 50% 40%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      /* marker title */
      #t1-ov-index .title {
        position: absolute; top: 62px; left: 50%;
        transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 8px 28px; z-index: 10;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase; white-space: nowrap;
      }
      /* card deck area — centered horizontally */
      #t1-ov-index .cards-wrap {
        position: absolute; left: 0; right: 0; top: 220px; bottom: 140px;
        display: flex; align-items: center; justify-content: center;
        z-index: 3;
      }
      /* individual index card */
      #t1-ov-index .icard {
        position: absolute; width: 520px; height: 620px;
        background: var(--paper-2);
        box-shadow: 6px 10px 0 rgba(23,19,14,0.16), inset 0 0 0 3px var(--ink);
        box-sizing: border-box; overflow: visible;
      }
      /* stagger positions — spread left, center, right */
      #t1-ov-index .icard-1 {
        left: calc(50% - 600px);
        transform: rotate(-2.5deg);
        z-index: 3;
      }
      #t1-ov-index .icard-2 {
        left: calc(50% - 260px);
        transform: rotate(0.5deg);
        z-index: 4;
      }
      #t1-ov-index .icard-3 {
        left: calc(50% + 80px);
        transform: rotate(2deg);
        z-index: 3;
      }
      /* red tab at top of each card */
      #t1-ov-index .tab {
        position: absolute; top: -48px; left: 30px;
        width: 160px; height: 52px;
        background: var(--red);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 0 3px var(--ink);
      }
      #t1-ov-index .tab-label {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--paper);
        text-align: center;
      }
      /* ruled lines inside the card */
      #t1-ov-index .ruled {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        background-image: repeating-linear-gradient(
          180deg,
          transparent 0, transparent 56px,
          rgba(23,19,14,0.10) 56px, rgba(23,19,14,0.10) 57px
        );
        margin: 32px 0 0;
      }
      /* red margin line — classic index card left margin */
      #t1-ov-index .margin-line {
        position: absolute; left: 64px; top: 0; bottom: 0; width: 2px;
        background: var(--red); opacity: 0.3;
      }
      /* topic text on the card */
      #t1-ov-index .card-topic {
        position: absolute; left: 80px; right: 30px; top: 60px;
        font-weight: var(--wt-black); font-size: 58px;
        line-height: 1.1; letter-spacing: var(--track-tight); color: var(--ink);
      }
      /* handwritten note style sub at bottom of card */
      #t1-ov-index .card-note {
        position: absolute; left: 80px; right: 30px; bottom: 40px;
        font-family: var(--font-hand); font-weight: var(--wt-bold);
        font-size: 32px; color: var(--muted); line-height: 1.3;
      }
      /* source */
      #t1-ov-index .source {
        position: absolute; left: 130px; bottom: 60px; z-index: 10;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-index" data-composition-id="t1-ov-index" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="title" data-slot="title">THREE KEY FILES</div>

      <div class="cards-wrap">
        <!-- Card 1 -->
        <div class="icard icard-1" id="ic1">
          <div class="tab">
            <div class="tab-label" data-slot="tab1">FILE 01</div>
          </div>
          <div class="ruled"></div>
          <div class="margin-line"></div>
          <div class="card-topic" data-slot="card1">The Origin</div>
          <div class="card-note">Where it all began...</div>
        </div>
        <!-- Card 2 -->
        <div class="icard icard-2" id="ic2">
          <div class="tab">
            <div class="tab-label" data-slot="tab2">FILE 02</div>
          </div>
          <div class="ruled"></div>
          <div class="margin-line"></div>
          <div class="card-topic" data-slot="card2">The Escalation</div>
          <div class="card-note">Why it kept growing...</div>
        </div>
        <!-- Card 3 -->
        <div class="icard icard-3" id="ic3">
          <div class="tab">
            <div class="tab-label" data-slot="tab3">FILE 03</div>
          </div>
          <div class="ruled"></div>
          <div class="margin-line"></div>
          <div class="card-topic" data-slot="card3">The Reckoning</div>
          <div class="card-note">What happens next...</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker — finite
      tl.fromTo("#t1-ov-index .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "160px 100px", duration: 0.5, ease: "steps(4)", repeat: 13, yoyo: true }, 0);

      // title snaps in
      tl.from("#t1-ov-index .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "center center", duration: 0.4, ease: "power3.out" }, 0.15);

      // cards drop in one at a time — fall from above, settle with slight overshoot
      tl.from("#t1-ov-index #ic1",
        { autoAlpha: 0, y: -120, rotation: -6, duration: 0.5, ease: "back.out(1.5)" }, 0.45);
      tl.from("#t1-ov-index #ic2",
        { autoAlpha: 0, y: -120, rotation: 4, duration: 0.5, ease: "back.out(1.5)" }, 0.72);
      tl.from("#t1-ov-index #ic3",
        { autoAlpha: 0, y: -120, rotation: -3, duration: 0.5, ease: "back.out(1.5)" }, 0.99);

      tl.from("#t1-ov-index .source", { autoAlpha: 0, duration: 0.3 }, 1.35);

      tl.set({}, {}, 7);

      window.__timelines["t1-ov-index"] = tl;
    </script>
  </body>
</html>
