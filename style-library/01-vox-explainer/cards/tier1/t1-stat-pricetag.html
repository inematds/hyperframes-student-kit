<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · PRICE TAG
  An angled price tag (rounded rect with a punched hole circle + a clean
  straight string line to top corner). Big number as the price. Tag swings in
  from a top-pivot via back.out. No scribbles — string is a static SVG line.
  Slots: kicker, stat, unit, label (richtext <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-tag {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-tag .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-tag .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-stat-tag .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-tag .kicker {
        position: absolute; left: 130px; top: 260px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* SVG string — static straight line from tag hole to top-right corner */
      #t1-stat-tag .string-svg {
        position: absolute; left: 0; top: 0;
        width: 1920px; height: 1080px;
        pointer-events: none; z-index: 2;
      }
      /* pivot anchor — the string hangs from here */
      #t1-stat-tag .tag-pivot {
        position: absolute;
        /* pivot point: top of the string, near top-center-right of canvas */
        left: 1050px; top: 150px;
        width: 0; height: 0;
        z-index: 3;
      }
      /* tag wrapper: swings from transform-origin at the top (hole position) */
      #t1-stat-tag .tag-wrap {
        position: absolute;
        left: 900px; top: 190px;
        transform-origin: 108px -80px;  /* pivot = hole center relative to tag */
        transform: rotate(16deg);
        z-index: 3;
      }
      #t1-stat-tag .tag {
        width: 520px; background: var(--paper-2);
        border: 5px solid var(--ink);
        border-radius: 18px 18px 18px 18px;
        /* pointed left end via clip-path */
        clip-path: polygon(10% 0%, 100% 0%, 100% 100%, 10% 100%, 0% 50%);
        box-shadow: 6px 10px 32px rgba(23,19,14,0.30);
        padding: 44px 60px 52px 80px;
        position: relative;
      }
      /* punched hole — white circle near the pointed end */
      #t1-stat-tag .hole {
        position: absolute; left: 56px; top: 50%;
        transform: translate(-50%, -50%);
        width: 36px; height: 36px;
        border-radius: 50%;
        background: var(--paper);
        border: 5px solid var(--ink);
        z-index: 2;
      }
      #t1-stat-tag .tag-kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 28px; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--muted);
        margin-bottom: 10px;
      }
      #t1-stat-tag .tag-price {
        display: flex; align-items: baseline; gap: 12px;
      }
      #t1-stat-tag .tag-stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 200px; line-height: 0.88; color: var(--ink);
        font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
      }
      #t1-stat-tag .tag-unit {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 44px; color: var(--orange); letter-spacing: 0.06em;
        text-transform: uppercase; align-self: flex-end; padding-bottom: 20px;
      }
      #t1-stat-tag .tag-rule {
        height: 3px; background: var(--ink); opacity: 0.25;
        margin: 18px 0 10px;
      }
      #t1-stat-tag .tag-label-inner {
        font-family: var(--font-label); font-size: 24px;
        color: var(--muted); letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      /* main label below the tag area */
      #t1-stat-tag .label {
        position: absolute; left: 130px; right: 130px; bottom: 220px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.1;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-tag .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-tag .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-tag" data-composition-id="t1-stat-tag" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">MARKET VALUE</div>

      <!-- Static straight string line: from tag-pivot to hole position on tag -->
      <svg class="string-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <line x1="1008" y1="148" x2="956" y2="342" stroke="#17130e" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      </svg>

      <!-- Pivot dot at string origin -->
      <div class="tag-pivot"></div>

      <div class="tag-wrap">
        <div class="tag">
          <div class="hole"></div>
          <div class="tag-kicker">retail price</div>
          <div class="tag-price">
            <span class="tag-stat" data-slot="stat">$47</span>
            <span class="tag-unit" data-slot="unit">/ mo</span>
          </div>
          <div class="tag-rule"></div>
          <div class="tag-label-inner">avg. subscription spend</div>
        </div>
      </div>

      <div class="label" data-slot="label">yet <em>two-thirds</em> of those tools go unused after 30 days</div>
      <div class="source" data-slot="source">SOURCE · SPEND REPORT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Grain flicker
      tl.fromTo("#t1-stat-tag .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      // Kicker snaps in
      tl.from("#t1-stat-tag .kicker", { autoAlpha: 0, x: -20, duration: 0.28, ease: "steps(4)" }, 0.15)
        // String fades in first (it's "already there" before tag swings down)
        .from("#t1-stat-tag .string-svg", { autoAlpha: 0, duration: 0.2 }, 0.28)
        // Tag swings in from top pivot — back.out for the pendulum swing
        .from("#t1-stat-tag .tag-wrap", {
          autoAlpha: 0,
          rotation: -65,   /* swings from high left to resting angle */
          transformOrigin: "108px -80px",
          duration: 0.52, ease: "back.out(1.6)"
        }, 0.35)
        // Price number pops after swing lands
        .from("#t1-stat-tag .tag-stat", {
          autoAlpha: 0, scale: 0.75,
          transformOrigin: "left bottom",
          duration: 0.3, ease: "back.out(2.4)"
        }, 0.88)
        .from("#t1-stat-tag .tag-unit", { autoAlpha: 0, x: 14, duration: 0.22, ease: "power2.out" }, 0.98)
        .from("#t1-stat-tag .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.18)
        .from("#t1-stat-tag .source", { autoAlpha: 0, duration: 0.28 }, 1.45)
        .set({}, {}, 6);
      window.__timelines["t1-stat-tag"] = tl;
    </script>
  </body>
</html>
