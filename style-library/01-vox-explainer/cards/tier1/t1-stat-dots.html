<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · DOT-GRID (waffle / pictograph)
  A 10x10 grid of 100 dots; the first N pop in yellow, the rest stay as faint
  ink outlines. "N in 100" made literal. Functional viz as eye-magnet — no circle.
  Slots: kicker, stat (the big number beside the grid), label (richtext), source.
  Knob: data-fill on .dots sets how many dots fill yellow (0..100, default 73).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-dots {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-dots .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-dots .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-dots .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 60% 50%, transparent 54%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-dots .kicker {
        position: absolute; left: 130px; top: 180px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-dots .stat {
        position: absolute; left: 130px; top: 50%; transform: translateY(-50%);
        font-weight: var(--wt-black); font-size: 360px; line-height: 0.86;
        letter-spacing: -0.05em; color: var(--ink); font-variant-numeric: tabular-nums;
      }
      #t1-stat-dots .label {
        position: absolute; left: 130px; bottom: 150px; width: 720px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.06;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-dots .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-dots .dots {
        position: absolute; right: 150px; top: 50%; transform: translateY(-50%);
        display: grid; grid-template-columns: repeat(10, 1fr); gap: 22px; width: 660px;
      }
      #t1-stat-dots .dot {
        width: 44px; height: 44px; border-radius: 50%;
        box-shadow: inset 0 0 0 4px rgba(23,19,14,0.25); background: transparent;
      }
      #t1-stat-dots .dot.on { background: var(--yellow); box-shadow: inset 0 0 0 4px var(--ink); }
      #t1-stat-dots .source {
        position: absolute; left: 130px; bottom: 90px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-dots" data-composition-id="t1-stat-dots" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">OUT OF EVERY HUNDRED</div>
      <div class="stat" data-slot="stat">73</div>
      <div class="dots" data-fill="73" id="dots"></div>
      <div class="label" data-slot="label">say they'd post more with <em>less editing</em></div>
      <div class="source" data-slot="source">SOURCE · CREATOR SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const grid = document.getElementById("dots");
      const fill = Math.max(0, Math.min(100, parseInt(grid.getAttribute("data-fill"), 10) || 73));
      for (let i = 0; i < 100; i++) {
        const d = document.createElement("div");
        d.className = "dot" + (i < fill ? " on" : "");
        grid.appendChild(d);
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-dots .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-dots .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-dots .dot", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.02, ease: "steps(1)", stagger: 0.006 }, 0.35)
        .from("#t1-stat-dots .stat", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(2.4)" }, 0.95)
        .from("#t1-stat-dots .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.15)
        .from("#t1-stat-dots .source", { autoAlpha: 0, duration: 0.3 }, 1.4)
        .set({}, {}, 6);
      window.__timelines["t1-stat-dots"] = tl;
    </script>
  </body>
</html>
