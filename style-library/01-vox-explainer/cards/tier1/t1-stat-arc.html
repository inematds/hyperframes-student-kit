<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · ARC-GAUGE
  A radial gauge: a faint ink track ring with a yellow arc that sweeps
  clockwise to the value via SVG stroke-dashoffset. The number sits in the
  center. Functional arc, not an arrow.
  Slots: kicker, stat (center number), label (richtext), source.
  Knob: data-pct on the svg (0..100, default 73).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-arc {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-arc .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-arc .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-arc .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 36% 50%, transparent 54%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-arc .kicker {
        position: absolute; left: 200px; top: 220px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-arc .gaugewrap {
        position: absolute; left: 200px; top: 50%; transform: translateY(-50%);
        width: 560px; height: 560px;
      }
      #t1-stat-arc svg { width: 560px; height: 560px; transform: rotate(-90deg); }
      #t1-stat-arc .stat {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-weight: var(--wt-black); font-size: 200px; line-height: 1; color: var(--ink);
        font-variant-numeric: tabular-nums; letter-spacing: -0.04em;
      }
      #t1-stat-arc .label {
        position: absolute; right: 150px; top: 50%; transform: translateY(-50%);
        width: 640px; font-weight: var(--wt-thin); font-size: 64px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-arc .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-arc .source {
        position: absolute; left: 200px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-arc" data-composition-id="t1-stat-arc" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">COMPLETION RATE</div>
      <div class="gaugewrap">
        <svg viewBox="0 0 240 240" data-pct="73">
          <circle cx="120" cy="120" r="104" fill="none" stroke="rgba(23,19,14,0.16)" stroke-width="26" />
          <circle class="arc" cx="120" cy="120" r="104" fill="none" stroke="var(--yellow)"
                  stroke-width="26" stroke-linecap="butt" />
        </svg>
        <div class="stat" data-slot="stat">73%</div>
      </div>
      <div class="label" data-slot="label">of viewers who start, <em>watch to the end</em></div>
      <div class="source" data-slot="source">SOURCE · ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const svg = document.querySelector("#t1-stat-arc svg");
      const pct = Math.max(0, Math.min(100, parseInt(svg.getAttribute("data-pct"), 10) || 73));
      const arc = svg.querySelector(".arc");
      const C = 2 * Math.PI * 104;
      arc.style.strokeDasharray = C;
      arc.style.strokeDashoffset = C * (1 - pct / 100);  // final state
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-arc .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-arc .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-arc .gaugewrap", { autoAlpha: 0, scale: 0.85, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.8)" }, 0.32)
        .fromTo(arc, { strokeDashoffset: C }, { strokeDashoffset: C * (1 - pct / 100), duration: 0.7, ease: "steps(9)" }, 0.5)
        .from("#t1-stat-arc .stat", { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.4)" }, 1.0)
        .from("#t1-stat-arc .label", { autoAlpha: 0, x: 30, duration: 0.45, ease: "power3.out" }, 1.1)
        .from("#t1-stat-arc .source", { autoAlpha: 0, duration: 0.3 }, 1.4)
        .set({}, {}, 6);
      window.__timelines["t1-stat-arc"] = tl;
    </script>
  </body>
</html>
