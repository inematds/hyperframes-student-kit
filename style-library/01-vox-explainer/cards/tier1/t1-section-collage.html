<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · COLLAGE
  Title surrounded by scattered floating cutouts, circles, scribbles on crumpled
  paper. The busy hero collage. Pieces pop in choppily from all directions.
  Slots: kicker, line1, line2 (marker word), wordmark, scrap1/2/3 (images).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-collage {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-collage .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-collage .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.5; pointer-events: none;
      }
      #t1-sec-collage .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }
      /* scattered scraps (halftone placeholders) */
      #t1-sec-collage .scrap {
        position: absolute; background-color: var(--paper-2);
        background-image: var(--tex-halftone); background-size: var(--tex-halftone-size);
        box-shadow: 8px 12px 0 rgba(23,19,14,0.12);
      }
      #t1-sec-collage .s1 { left: 120px; top: 150px; width: 300px; height: 220px; outline: 8px solid var(--ink); outline-offset: -8px; transform: rotate(-5deg); }
      #t1-sec-collage .s2 { right: 130px; top: 120px; width: 360px; height: 250px; outline: 8px solid var(--yellow); outline-offset: -8px; transform: rotate(4deg); }
      #t1-sec-collage .s3 { right: 200px; bottom: 130px; width: 280px; height: 330px; outline: 8px solid var(--orange); outline-offset: -8px; transform: rotate(-3deg); }
      /* shapes */
      #t1-sec-collage .ycirc { position: absolute; left: 150px; bottom: 160px; width: 220px; height: 220px; background: var(--yellow); border-radius: 50%; }
      #t1-sec-collage .wordmark {
        position: absolute; left: 188px; bottom: 198px; width: 150px; text-align: center; z-index: 4;
        font-style: italic; font-weight: var(--wt-black); font-size: 70px; color: var(--ink);
      }
      /* title */
      #t1-sec-collage .title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1100px; text-align: center; z-index: 3; }
      #t1-sec-collage .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); margin-bottom: 18px;
      }
      #t1-sec-collage .l1 { display: block; font-weight: var(--wt-black); font-size: 128px; line-height: 0.96; letter-spacing: var(--track-tight); }
      #t1-sec-collage .l2 { display: inline-block; margin-top: 10px; font-weight: var(--wt-black); font-style: italic; font-size: 128px; line-height: 1.0; letter-spacing: var(--track-tight); background: var(--yellow); padding: 0 22px; transform: skewX(var(--marker-skew)); }    </style>
  </head>
  <body>
    <div id="t1-sec-collage" data-composition-id="t1-sec-collage" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="scrap s1" data-slot="scrap1"></div>
      <div class="scrap s2" data-slot="scrap2"></div>
      <div class="scrap s3" data-slot="scrap3"></div>
      <div class="ycirc"></div>
      <div class="wordmark" data-slot="wordmark">Vox</div>
      <div class="title">
        <div class="kicker" data-slot="kicker">HOW IT WORKS</div>
        <span class="l1" data-slot="line1">Create better</span>
        <span class="l2" data-slot="line2">motion graphics</span>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-collage .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "160px 140px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-collage .s1", { autoAlpha: 0, x: -60, y: -30, rotate: -20, duration: 0.4, ease: "back.out(1.8)" }, 0.15)
        .from("#t1-sec-collage .s2", { autoAlpha: 0, x: 70, y: -30, rotate: 18, duration: 0.4, ease: "back.out(1.8)" }, 0.25)
        .from("#t1-sec-collage .s3", { autoAlpha: 0, x: 60, y: 50, rotate: 16, duration: 0.4, ease: "back.out(1.8)" }, 0.35)
        .from("#t1-sec-collage .ycirc", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.2)" }, 0.45)
        .from("#t1-sec-collage .kicker", { autoAlpha: 0, y: -12, duration: 0.26, ease: "steps(4)" }, 0.6)
        .from("#t1-sec-collage .l1", { autoAlpha: 0, y: 26, duration: 0.4, ease: "power3.out" }, 0.68)
        .from("#t1-sec-collage .l2", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.36, ease: "power3.out" }, 0.82)
        .from("#t1-sec-collage .wordmark", { autoAlpha: 0, scale: 0.5, rotate: -20, duration: 0.34, ease: "back.out(2.4)" }, 0.9)
        .set({}, {}, 6.2);
      window.__timelines["t1-sec-collage"] = tl;
    </script>
  </body>
</html>
