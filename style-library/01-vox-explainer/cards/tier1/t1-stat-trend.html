<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · TREND / DELTA
  A change stat. The big number has a sign chip left-aligned above it (+ yellow,
  − red). A static filled triangle wedge serves as the delta glyph (it is a
  functional symbol, not a flying arrow — completely static, no motion path).
  A smaller "UP FROM …" baseline line sits below the main number.
  Number snaps in with back.out; sign chip pops after.
  Slots: kicker, sign (+ or −), stat, baseline (e.g. "up from 41% last year"),
         label (richtext <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-trend {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-trend .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-trend .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-trend .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 44% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-trend .kicker {
        position: absolute; left: 150px; top: 168px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* left column main block */
      #t1-stat-trend .col-left {
        position: absolute; left: 150px; top: 50%; transform: translateY(-50%);
      }
      /* sign chip row */
      #t1-stat-trend .sign-row {
        display: flex; align-items: center; gap: 20px; margin-bottom: 18px;
      }
      /* static triangle wedge — CSS clip-path triangle, purely functional glyph */
      #t1-stat-trend .delta-wedge {
        width: 0; height: 0;
        border-left: 28px solid transparent;
        border-right: 28px solid transparent;
        /* color controlled via JS on init, default up (yellow) */
        border-bottom: 46px solid var(--yellow);
        flex-shrink: 0;
      }
      #t1-stat-trend .delta-wedge.down {
        border-bottom: none;
        border-top: 46px solid var(--red);
      }
      #t1-stat-trend .sign-chip {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 38px; letter-spacing: 0.04em;
        padding: 6px 24px 6px 20px;
        /* chip BG controlled via data-sign */
        background: var(--yellow); color: var(--ink);
        text-transform: uppercase;
      }
      #t1-stat-trend .sign-chip.neg { background: var(--red); color: var(--paper); }
      /* big stat */
      #t1-stat-trend .stat {
        font-weight: var(--wt-black); font-size: 400px; line-height: 0.88;
        letter-spacing: -0.04em; color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      /* baseline "UP FROM …" line */
      #t1-stat-trend .baseline {
        margin-top: 28px; display: flex; align-items: center; gap: 16px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      #t1-stat-trend .baseline-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--muted); flex-shrink: 0;
      }
      /* right column: label */
      #t1-stat-trend .label {
        position: absolute; right: 130px; top: 50%; transform: translateY(-50%);
        width: 660px; font-weight: var(--wt-thin); font-size: 60px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-trend .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-trend .source {
        position: absolute; right: 130px; bottom: 96px; text-align: right;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-trend" data-composition-id="t1-stat-trend" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">AI ADOPTION RATE</div>
      <div class="col-left">
        <div class="sign-row">
          <!-- data-sign="+" or "-" drives chip color + wedge direction -->
          <div class="delta-wedge" data-slot="sign-wedge"></div>
          <div class="sign-chip" data-slot="sign">+</div>
        </div>
        <div class="stat" data-slot="stat">68%</div>
        <div class="baseline">
          <div class="baseline-dot"></div>
          <span data-slot="baseline">up from 41% last year</span>
        </div>
      </div>
      <div class="label" data-slot="label">of creators now use AI tools on <em>every project</em></div>
      <div class="source" data-slot="source">SOURCE · STATE OF CREATORS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      /* Apply sign-driven styling on init (deterministic, runs once) */
      (function () {
        const chip = document.querySelector("#t1-stat-trend .sign-chip");
        const wedge = document.querySelector("#t1-stat-trend .delta-wedge");
        const sign = chip ? chip.textContent.trim() : "+";
        if (sign === "-" || sign === "−") {
          chip.classList.add("neg");
          wedge.classList.add("down");
          /* flip wedge colors for negative */
          wedge.style.borderBottom = "none";
          wedge.style.borderTop = "46px solid var(--red)";
        }
      })();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-trend .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-trend .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-trend .stat", { autoAlpha: 0, scale: 0.6, transformOrigin: "0% 50%", duration: 0.48, ease: "back.out(2.4)" }, 0.35)
        /* sign chip + wedge snap in together after number lands */
        .from("#t1-stat-trend .sign-chip",   { autoAlpha: 0, scale: 0.4, transformOrigin: "0% 50%", duration: 0.35, ease: "back.out(2.2)" }, 0.75)
        .from("#t1-stat-trend .delta-wedge", { autoAlpha: 0, y: 12, duration: 0.3, ease: "power2.out" }, 0.78)
        .from("#t1-stat-trend .baseline", { autoAlpha: 0, x: -16, duration: 0.38, ease: "power3.out" }, 1.0)
        .from("#t1-stat-trend .label",    { autoAlpha: 0, x: 28,  duration: 0.45, ease: "power3.out" }, 0.78)
        .from("#t1-stat-trend .source",   { autoAlpha: 0, duration: 0.3 }, 1.3)
        .set({}, {}, 6);
      window.__timelines["t1-stat-trend"] = tl;
    </script>
  </body>
</html>
