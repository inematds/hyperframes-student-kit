<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · RECEIPT
  A narrow thermal receipt slip centered on the canvas. Zigzag torn top + bottom
  edges via clip-path. Monospace Archivo. Faux line-items, then a thick rule and
  a hero TOTAL line at the bottom. Receipt "prints" via a clip-reveal top→bottom.
  Slots: kicker (store/title), item1l/item1v, item2l/item2v, stat (total), label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-receipt {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-receipt .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-receipt .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.42;
        pointer-events: none; z-index: 6;
      }
      #t1-stat-receipt .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-receipt .kicker {
        position: absolute; left: 130px; top: 260px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* receipt slip wrapper — provides clip-reveal */
      #t1-stat-receipt .receipt-clip {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -48%);
        width: 700px;
        clip-path: inset(0 0 100% 0);  /* will animate to inset(0 0 0% 0) */
      }
      #t1-stat-receipt .receipt {
        background: var(--paper-2);
        width: 100%; box-sizing: border-box;
        box-shadow: 4px 14px 40px rgba(23,19,14,0.28), inset 0 0 0 2px rgba(23,19,14,0.16);
        /* zigzag torn top */
        clip-path: polygon(
          0% 2%, 4% 0%, 8% 2%, 12% 0%, 16% 2%, 20% 0%, 24% 2%,
          28% 0%, 32% 2%, 36% 0%, 40% 2%, 44% 0%, 48% 2%,
          52% 0%, 56% 2%, 60% 0%, 64% 2%, 68% 0%, 72% 2%,
          76% 0%, 80% 2%, 84% 0%, 88% 2%, 92% 0%, 96% 2%, 100% 0%,
          100% 98%, 96% 100%, 92% 98%, 88% 100%, 84% 98%, 80% 100%,
          76% 98%, 72% 100%, 68% 98%, 64% 100%, 60% 98%, 56% 100%,
          52% 98%, 48% 100%, 44% 98%, 40% 100%, 36% 98%, 32% 100%,
          28% 98%, 24% 100%, 20% 98%, 16% 100%, 12% 98%, 8% 100%,
          4% 98%, 0% 100%
        );
        padding: 40px 48px 48px;
        font-family: var(--font-label); font-size: 28px; color: var(--ink);
        letter-spacing: 0.04em;
      }
      #t1-stat-receipt .receipt-store {
        text-align: center; font-weight: var(--wt-black);
        font-size: 34px; letter-spacing: 0.12em;
        text-transform: uppercase;
        border-bottom: 2px dashed rgba(23,19,14,0.3);
        padding-bottom: 18px; margin-bottom: 18px;
      }
      #t1-stat-receipt .receipt-meta {
        font-size: 20px; color: var(--muted); margin-bottom: 22px;
        display: flex; justify-content: space-between;
      }
      #t1-stat-receipt .line-items { margin-bottom: 22px; }
      #t1-stat-receipt .item {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 10px 0; border-bottom: 1px dashed rgba(23,19,14,0.2);
        font-size: 26px;
      }
      #t1-stat-receipt .item .il { color: var(--muted); font-weight: var(--wt-reg); }
      #t1-stat-receipt .item .iv { font-weight: var(--wt-bold); }
      #t1-stat-receipt .total-rule {
        height: 4px;
        background: repeating-linear-gradient(90deg, var(--ink) 0 10px, transparent 10px 14px);
        margin: 14px 0;
      }
      #t1-stat-receipt .total-row {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 8px 0;
      }
      #t1-stat-receipt .total-label {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink);
      }
      #t1-stat-receipt .total-val {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 110px; line-height: 1; color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #t1-stat-receipt .receipt-thank {
        text-align: center; font-size: 20px; color: var(--muted);
        margin-top: 18px; letter-spacing: 0.1em; text-transform: uppercase;
      }
      #t1-stat-receipt .label {
        position: absolute; left: 130px; right: 130px; bottom: 220px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.1;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-receipt .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-receipt .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-receipt" data-composition-id="t1-stat-receipt" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">THE REAL COST</div>
      <div class="receipt-clip">
        <div class="receipt">
          <div class="receipt-store" data-slot="kicker-store">VIDEO STUDIO</div>
          <div class="receipt-meta">
            <span>DATE: 06/03/26</span><span>TXN #0047</span>
          </div>
          <div class="line-items">
            <div class="item">
              <span class="il" data-slot="item1l">Shooting time</span>
              <span class="iv" data-slot="item1v">2 hrs</span>
            </div>
            <div class="item">
              <span class="il" data-slot="item2l">Manual editing</span>
              <span class="iv" data-slot="item2v">9 hrs</span>
            </div>
          </div>
          <div class="total-rule"></div>
          <div class="total-row">
            <span class="total-label">TOTAL</span>
            <span class="total-val" data-slot="stat">$0</span>
          </div>
          <div class="receipt-thank">* THANK YOU *</div>
        </div>
      </div>
      <div class="label" data-slot="label">the <em>hidden hours</em> no tool has solved — until now</div>
      <div class="source" data-slot="source">SOURCE · CREATOR SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Grain flicker
      tl.fromTo("#t1-stat-receipt .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      // Kicker snaps in
      tl.from("#t1-stat-receipt .kicker", { autoAlpha: 0, x: -20, duration: 0.28, ease: "steps(4)" }, 0.15)
        // Receipt prints top → bottom via clip reveal (stepped, like a thermal printer)
        .to("#t1-stat-receipt .receipt-clip", {
          clipPath: "inset(0 0 0% 0)", duration: 0.72, ease: "steps(9)"
        }, 0.35)
        // Total value pops after print finishes
        .from("#t1-stat-receipt .total-val", {
          autoAlpha: 0, scale: 0.7,
          transformOrigin: "right center",
          duration: 0.3, ease: "back.out(2.4)"
        }, 1.12)
        .from("#t1-stat-receipt .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.35)
        .from("#t1-stat-receipt .source", { autoAlpha: 0, duration: 0.28 }, 1.6)
        .set({}, {}, 6);
      window.__timelines["t1-stat-receipt"] = tl;
    </script>
  </body>
</html>
