<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · BIG-TYPE CONTENTS
  Four massive Fraunces topic lines filling the canvas width — one per line.
  Each line clip-reveals in sequence. One word per line gets a yellow marker-box
  highlight (stamped in). A small kicker label at the very top.
  Slots: title (kicker), line1, line2, line3, line4, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-bigtype {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-bigtype .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-bigtype .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 8;
      }
      #t1-ov-bigtype .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 7;
        background: radial-gradient(130% 120% at 50% 50%, transparent 58%, rgba(23,19,14,0.16) 100%);
      }

      /* kicker — small Archivo label at top */
      #t1-ov-bigtype .kicker {
        position: absolute; top: 64px; left: 130px; z-index: 4;
        display: flex; align-items: center; gap: 20px;
      }
      #t1-ov-bigtype .kicker-rule {
        width: 48px; height: 4px; background: var(--red);
      }
      #t1-ov-bigtype .kicker-text {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
      }

      /* type lines container */
      #t1-ov-bigtype .lines {
        position: absolute; top: 150px; left: 80px; right: 80px;
        display: flex; flex-direction: column; gap: 10px; z-index: 4;
      }
      /* each line wrapper — clip overflow for reveal wipe */
      #t1-ov-bigtype .line-wrap {
        overflow: hidden;
        line-height: 1.0;
      }
      #t1-ov-bigtype .line-inner {
        display: block;
        font-weight: var(--wt-black);
        font-size: 150px;
        letter-spacing: -0.045em;
        line-height: 0.98;
        color: var(--ink);
        white-space: nowrap;
      }
      /* yellow marker-box on the highlighted word in each line */
      #t1-ov-bigtype .line-inner mark {
        background: var(--yellow);
        color: var(--ink);
        padding: 0 16px;
        /* paper-cut slightly off-level */
        display: inline-block;
        transform: skewX(var(--marker-skew));
        transform-origin: bottom left;
        /* initial state — GSAP stamps it in */
        opacity: 1;
      }

      #t1-ov-bigtype .source {
        position: absolute; right: 130px; bottom: 72px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-bigtype" data-composition-id="t1-ov-bigtype" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="kicker">
        <div class="kicker-rule"></div>
        <div class="kicker-text" data-slot="title">IN THIS VIDEO</div>
      </div>

      <div class="lines">
        <div class="line-wrap lw1">
          <span class="line-inner l1" data-slot="line1">THE <mark class="mk1">ORIGIN</mark> STORY</span>
        </div>
        <div class="line-wrap lw2">
          <span class="line-inner l2" data-slot="line2">THE <mark class="mk2">TURNING</mark> POINT</span>
        </div>
        <div class="line-wrap lw3">
          <span class="line-inner l3" data-slot="line3">THE <mark class="mk3">HARD</mark> DATA</span>
        </div>
        <div class="line-wrap lw4">
          <span class="line-inner l4" data-slot="line4">WHAT <mark class="mk4">COMES</mark> NEXT</span>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · VIDEO AUTOMATION 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker — finite, deterministic
      tl.fromTo("#t1-ov-bigtype .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "170px 110px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // kicker snaps in from left
      tl.from("#t1-ov-bigtype .kicker",
        { autoAlpha: 0, x: -30, duration: 0.3, ease: "steps(4)" }, 0.1);

      // each line: clip-reveal wipe up (line-inner translates from below its wrapper)
      var lines = [".l1", ".l2", ".l3", ".l4"];
      var marks = [".mk1", ".mk2", ".mk3", ".mk4"];

      for (var i = 0; i < lines.length; i++) {
        var startT = 0.4 + i * 0.32;
        // line wipes up from below the overflow-hidden wrapper
        tl.from("#t1-ov-bigtype " + lines[i],
          { yPercent: 110, duration: 0.42, ease: "power3.out" }, startT);
        // marker-box stamps in with a steps snap shortly after the line lands
        tl.from("#t1-ov-bigtype " + marks[i],
          { scaleX: 0, autoAlpha: 0, transformOrigin: "left center",
            duration: 0.24, ease: "steps(3)" }, startT + 0.22);
      }

      tl.from("#t1-ov-bigtype .source", { autoAlpha: 0, duration: 0.3 }, 1.85);

      // hold at 7s
      tl.set({}, {}, 7);

      window.__timelines["t1-ov-bigtype"] = tl;
    </script>
  </body>
</html>
