<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · CORNER-BLEED
  The number anchored HUGE in the top-right, rotated ~-8deg, bleeding off the top
  + right edges. Label + source anchored bottom-left for a strong diagonal
  negative-space composition. One yellow slab accent. Number clip-reveals diagonally.
  Slots: kicker, stat, label (richtext <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-corner {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* === GRID === */
      #t1-stat-corner .grid {
        position: absolute; inset: -2px; z-index: 0;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }

      /* === YELLOW SLAB — diagonal accent in top-right quadrant === */
      #t1-stat-corner .yellow-slab {
        position: absolute;
        top: -40px; right: -40px;
        width: 780px; height: 560px;
        background: var(--yellow);
        transform: rotate(-8deg);
        transform-origin: top right;
        z-index: 1;
      }

      /* === HUGE NUMBER bleeding off top-right === */
      #t1-stat-corner .stat {
        position: absolute;
        /* Bleed off right + top edges — only left portion visible */
        top: -80px;
        right: -60px;
        z-index: 3;
        font-weight: var(--wt-black);
        font-size: 720px;
        line-height: 0.8;
        letter-spacing: -0.06em;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        transform: rotate(-8deg);
        transform-origin: top right;
        /* Clip to simulate bleeding off the canvas edge — only the left portion shows */
        clip-path: inset(0 0 0 0);
        text-shadow: -6px 12px 0 rgba(23,19,14,0.14);
        white-space: nowrap;
      }

      /* === DIAGONAL NEGATIVE SPACE — ink accent line === */
      #t1-stat-corner .diagonal-rule {
        position: absolute;
        /* A thin line from mid-left to lower-right separating the two zones */
        left: 0; right: 0; top: 0; bottom: 0;
        z-index: 2; pointer-events: none;
        overflow: hidden;
      }
      #t1-stat-corner .diagonal-rule::after {
        content: "";
        position: absolute;
        left: 80px; top: 680px;
        width: 900px; height: 6px;
        background: var(--ink);
        transform: rotate(-8deg);
        transform-origin: left center;
      }

      /* === KICKER === */
      #t1-stat-corner .kicker {
        position: absolute; left: 130px; bottom: 310px; z-index: 5;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }

      /* === LABEL — bottom-left anchor === */
      #t1-stat-corner .label {
        position: absolute; left: 130px; right: 820px; bottom: 158px; z-index: 5;
        font-weight: var(--wt-thin); font-size: 58px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-corner .label em { font-style: italic; font-weight: var(--wt-black); }

      /* === SOURCE === */
      #t1-stat-corner .source {
        position: absolute; left: 130px; bottom: 84px; z-index: 5;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* === TEXTURE === */
      #t1-stat-corner .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.42;
        pointer-events: none; z-index: 8;
      }
      #t1-stat-corner .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 7;
        background: radial-gradient(130% 130% at 20% 70%, transparent 50%, rgba(23,19,14,0.18) 100%);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-corner" data-composition-id="t1-stat-corner" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="yellow-slab"></div>
      <div class="stat" data-slot="stat">38M</div>
      <div class="diagonal-rule"></div>
      <div class="kicker" data-slot="kicker">GLOBAL SCALE</div>
      <div class="label" data-slot="label">creators competing for the<br>same <em>30-second window</em></div>
      <div class="source" data-slot="source">SOURCE · PLATFORM DATA 2025</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Grain flicker
      tl.fromTo("#t1-stat-corner .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true },
        0
      );

      // Yellow slab slides in from off-screen top-right
      tl.from("#t1-stat-corner .yellow-slab",
        { x: 120, y: -80, autoAlpha: 0, duration: 0.4, ease: "power3.out" },
        0.1
      );

      // STAT: diagonal clip-reveal from top-right corner
      tl.fromTo("#t1-stat-corner .stat",
        { clipPath: "inset(0 100% 0 0)", autoAlpha: 1 },
        { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "steps(8)" },
        0.25
      );

      // Diagonal rule snaps in
      tl.from("#t1-stat-corner .diagonal-rule::after",
        { scaleX: 0, duration: 0.35, ease: "power2.out" },
        0.65
      );

      // Kicker
      tl.from("#t1-stat-corner .kicker",
        { autoAlpha: 0, x: -20, duration: 0.28, ease: "steps(4)" },
        0.72
      );

      // Label wipes up
      tl.from("#t1-stat-corner .label",
        { autoAlpha: 0, y: 24, duration: 0.4, ease: "power3.out" },
        0.88
      );

      tl.from("#t1-stat-corner .source",
        { autoAlpha: 0, duration: 0.28 },
        1.18
      );

      tl.set({}, {}, 6);

      window.__timelines["t1-stat-corner"] = tl;
    </script>
  </body>
</html>
