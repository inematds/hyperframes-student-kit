<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · FOOTNOTED FIGURE
  Giant centered Fraunces number with a small yellow superscript dagger (†).
  At the very bottom, an academic footnote: a thin rule then fine-print Archivo
  caveat text. Number clip-reveals from center; footnote fades up last.
  Slots: kicker, stat, label (richtext, what the number means), footnote (fine-print caveat), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-fn {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-fn .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-fn .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-fn .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-fn .kicker {
        position: absolute; left: 50%; top: 164px; transform: translateX(-50%);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red); white-space: nowrap;
      }
      /* centered figure lockup */
      #t1-stat-fn .figure {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%);
        text-align: center;
      }
      #t1-stat-fn .stat-wrap {
        display: inline-block; position: relative;
        clip-path: inset(0 50% 0 50%); /* revealed horizontally from center */
      }
      #t1-stat-fn .stat {
        font-weight: var(--wt-black); font-size: 380px; line-height: 0.88;
        letter-spacing: -0.04em; color: var(--ink); font-variant-numeric: tabular-nums;
      }
      #t1-stat-fn .dagger {
        position: absolute; top: 20px; right: -62px;
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 80px; color: var(--yellow); line-height: 1;
      }
      #t1-stat-fn .label {
        margin-top: 40px; font-weight: var(--wt-thin);
        font-size: 58px; line-height: 1.1; letter-spacing: var(--track-tight);
        color: var(--ink); white-space: nowrap;
      }
      #t1-stat-fn .label em { font-style: italic; font-weight: var(--wt-black); }
      /* footnote block at very bottom */
      #t1-stat-fn .fn-block {
        position: absolute; left: 130px; right: 130px; bottom: 72px;
      }
      #t1-stat-fn .fn-rule {
        height: 2px; background: var(--ink); width: 320px;
        transform: scaleX(0); transform-origin: left center;
        margin-bottom: 10px; opacity: 0.45;
      }
      #t1-stat-fn .fn-text {
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-tiny); letter-spacing: 0.06em; color: var(--muted);
      }
      #t1-stat-fn .fn-text .fn-dagger {
        color: var(--yellow); font-weight: var(--wt-black);
      }
      #t1-stat-fn .source {
        position: absolute; right: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-fn" data-composition-id="t1-stat-fn" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">MEDIAN EDIT TIME</div>
      <div class="figure">
        <div class="stat-wrap">
          <span class="stat" data-slot="stat">47</span>
          <span class="dagger">†</span>
        </div>
        <div class="label" data-slot="label">minutes per <em>finished minute</em> of video</div>
      </div>
      <div class="fn-block">
        <div class="fn-rule"></div>
        <div class="fn-text"><span class="fn-dagger">†</span>&thinsp;<span data-slot="footnote">Includes review rounds; excludes color grade and audio mix. Professional editors only (n=1,240).</span></div>
      </div>
      <div class="source" data-slot="source">SOURCE · CREATOR ECONOMY SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-fn .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-fn .kicker", { autoAlpha: 0, y: -14, duration: 0.3, ease: "steps(4)" }, 0.2)
        .to("#t1-stat-fn .stat-wrap", { clipPath: "inset(0 0% 0 0%)", duration: 0.5, ease: "steps(6)" }, 0.38)
        .from("#t1-stat-fn .dagger", { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 0%", duration: 0.35, ease: "back.out(2.2)" }, 0.78)
        .from("#t1-stat-fn .label", { autoAlpha: 0, y: 18, duration: 0.38, ease: "power3.out" }, 0.92)
        .to("#t1-stat-fn .fn-rule", { scaleX: 1, duration: 0.28, ease: "steps(4)" }, 1.15)
        .from("#t1-stat-fn .fn-text", { autoAlpha: 0, y: 8, duration: 0.35, ease: "power2.out" }, 1.35)
        .from("#t1-stat-fn .source", { autoAlpha: 0, duration: 0.3 }, 1.5)
        .set({}, {}, 6);
      window.__timelines["t1-stat-fn"] = tl;
    </script>
  </body>
</html>
