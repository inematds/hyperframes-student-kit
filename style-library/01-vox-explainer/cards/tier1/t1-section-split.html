<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · SPLIT
  Vertical split: title on paper left, halftone image panel right, ink rule between.
  Slots: kicker, headline (<em> emphasis), panel (image), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-split {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-split .grid {
        position: absolute; left: 0; top: 0; width: 1100px; height: 1080px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-split .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 5;
      }
      /* right image panel */
      #t1-sec-split .panel {
        position: absolute; right: 0; top: 0; width: 760px; height: 1080px;
        background-color: var(--paper-2); background-image: var(--tex-halftone);
        background-size: var(--tex-halftone-size); z-index: 2;
      }
      #t1-sec-split .panel::after {
        content: "ARCHIVE"; position: absolute; left: 24px; bottom: 24px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        color: var(--ink); background: var(--yellow); padding: 3px 12px;
      }
      #t1-sec-split .rule { position: absolute; right: 760px; top: 0; width: 10px; height: 1080px; background: var(--ink); z-index: 3; transform-origin: top center; }
      #t1-sec-split .kicker {
        position: absolute; left: 130px; top: 360px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
      }
      #t1-sec-split .kicker::before { content: ""; display: inline-block; width: 50px; height: 3px; background: var(--red); margin-right: 16px; vertical-align: middle; }
      #t1-sec-split .headline {
        position: absolute; left: 130px; top: 410px; width: 900px; z-index: 4;
        font-weight: var(--wt-black); font-size: 124px; line-height: 0.95;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-split .headline em { font-style: italic; font-weight: var(--wt-thin); }
      #t1-sec-split .source {
        position: absolute; left: 130px; bottom: 110px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-split" data-composition-id="t1-sec-split" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="panel" data-slot="panel"></div>
      <div class="rule"></div>
      <div class="kicker" data-slot="kicker">THE SETUP</div>
      <div class="headline" data-slot="headline">A small town, a <em>big</em> secret</div>
      <div class="source" data-slot="source">A VOX EXPLAINER</div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-split .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-split .panel", { xPercent: 100, duration: 0.6, ease: "power4.out" }, 0.1)
        .from("#t1-sec-split .rule", { scaleY: 0, duration: 0.5, ease: "power3.out" }, 0.5)
        .from("#t1-sec-split .kicker", { autoAlpha: 0, x: -26, duration: 0.3, ease: "steps(4)" }, 0.6)
        .from("#t1-sec-split .headline", { autoAlpha: 0, y: 28, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.7)
        .from("#t1-sec-split .source", { autoAlpha: 0, duration: 0.3 }, 1.05)
        .set({}, {}, 6);
      window.__timelines["t1-sec-split"] = tl;
    </script>
  </body>
</html>
