<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · VERTICAL COLUMN CHART
  5 columns grow from a baseline. Tallest column is yellow (hero); the rest kraft.
  x-axis labels sit under each column; the hero VALUE is big above the tall column.
  Columns scaleY from transform-origin bottom, staggered steps.
  Slots: kicker, c1..c5 (axis labels), stat (hero value), label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-col {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-col .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-col .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-col .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 54%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-col .kicker {
        position: absolute; left: 130px; top: 100px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* chart wrapper */
      #t1-stat-col .chart-wrap {
        position: absolute; left: 200px; right: 200px; top: 160px; bottom: 260px;
        display: flex; align-items: flex-end; justify-content: space-between;
        border-bottom: 5px solid var(--ink);
      }
      /* baseline tick marks */
      #t1-stat-col .chart-wrap::after {
        content: ""; position: absolute; bottom: -5px; left: 0; right: 0; height: 18px;
        background-image: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 20%);
        opacity: 0.3;
      }
      #t1-stat-col .col-group {
        display: flex; flex-direction: column; align-items: center;
        flex: 1; max-width: 220px;
      }
      /* hero value floats above hero column */
      #t1-stat-col .col-group.hero .stat {
        font-weight: var(--wt-black); font-size: 110px; line-height: 1;
        letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
        color: var(--ink); margin-bottom: 12px;
      }
      #t1-stat-col .col-group:not(.hero) .stat { display: none; }
      #t1-stat-col .col {
        width: 100%; transform: scaleY(0); transform-origin: bottom center;
        box-shadow: 0 0 0 3px var(--ink);
      }
      #t1-stat-col .col-group:not(.hero) .col {
        background: var(--paper-2);
      }
      #t1-stat-col .col-group.hero .col {
        background: var(--yellow);
      }
      #t1-stat-col .col-label {
        margin-top: 20px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 26px; letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--ink); text-align: center;
      }
      #t1-stat-col .label {
        position: absolute; left: 130px; right: 130px; bottom: 130px;
        font-weight: var(--wt-thin); font-size: 54px; line-height: 1.06;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-col .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-col .source {
        position: absolute; left: 130px; bottom: 76px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-col" data-composition-id="t1-stat-col" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">WEEKLY POSTS</div>

      <div class="chart-wrap" id="chart">
        <!-- columns defined via JS for deterministic heights -->
      </div>

      <div class="label" data-slot="label">the <em>peak year</em> for short-form content volume</div>
      <div class="source" data-slot="source">SOURCE · PLATFORM DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Deterministic column data — no random, index-driven
      var cols = [
        { label: "2022", heightPx: 220, hero: false },
        { label: "2023", heightPx: 340, hero: false },
        { label: "2024", heightPx: 490, hero: false },
        { label: "2025", heightPx: 600, hero: false },
        { label: "2026", heightPx: 530, hero: true  }
      ];
      var slots = ["c1","c2","c3","c4","c5"];
      var chart = document.getElementById("chart");

      cols.forEach(function(d, i) {
        var group = document.createElement("div");
        group.className = "col-group" + (d.hero ? " hero" : "");

        var stat = document.createElement("div");
        stat.className = "stat";
        stat.setAttribute("data-slot", d.hero ? "stat" : "");
        stat.textContent = d.hero ? "4.7B" : "";
        group.appendChild(stat);

        var col = document.createElement("div");
        col.className = "col";
        col.style.height = d.heightPx + "px";
        group.appendChild(col);

        var lbl = document.createElement("div");
        lbl.className = "col-label";
        lbl.setAttribute("data-slot", slots[i]);
        lbl.textContent = d.label;
        group.appendChild(lbl);

        chart.appendChild(group);
      });

      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#t1-stat-col .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-stat-col .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2);

      // Columns grow from baseline, stepped, staggered
      tl.to("#t1-stat-col .col", { scaleY: 1, duration: 0.5, ease: "steps(6)", stagger: 0.07 }, 0.4);

      // Hero stat number pops in
      tl.from("#t1-stat-col .stat", { autoAlpha: 0, scale: 0.55, transformOrigin: "50% 100%", duration: 0.38, ease: "back.out(2.2)" }, 0.95);

      // Axis labels
      tl.from("#t1-stat-col .col-label", { autoAlpha: 0, y: 14, duration: 0.28, ease: "power2.out", stagger: 0.05 }, 0.7);

      tl.from("#t1-stat-col .label",  { autoAlpha: 0, y: 18, duration: 0.38, ease: "power3.out" }, 1.2);
      tl.from("#t1-stat-col .source", { autoAlpha: 0, duration: 0.28 }, 1.48);

      tl.set({}, {}, 6);
      window.__timelines["t1-stat-col"] = tl;
    </script>
  </body>
</html>
