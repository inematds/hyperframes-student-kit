<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · MARKERBOX
  Title words on stacked yellow highlighter marker boxes, skewed and hand-pasted.
  Slots: kicker, line1, line2, line3 (line3 optional).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-marker {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-marker .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-marker .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none;
      }
      #t1-sec-marker .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(130% 120% at 40% 50%, transparent 58%, rgba(23,19,14,0.15) 100%);
      }
      #t1-sec-marker .stage { position: absolute; left: 150px; top: 300px; transform-origin: left top; }
      #t1-sec-marker .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink); margin-bottom: 26px;
      }
      #t1-sec-marker .line {
        display: inline-block; font-weight: var(--wt-black); font-size: 132px;
        line-height: 1.0; letter-spacing: var(--track-tight); color: var(--ink);
        background: var(--yellow); padding: 2px 26px; margin: 0 0 18px; clear: both; float: left;
        box-shadow: 7px 7px 0 rgba(23,19,14,0.14);
      }
      #t1-sec-marker .l1 { transform: skewX(-1.6deg) rotate(-0.6deg); }
      #t1-sec-marker .l2 { transform: skewX(1.2deg) rotate(0.5deg); background: var(--ink); color: var(--paper); }
      #t1-sec-marker .l3 { transform: skewX(-0.8deg) rotate(-0.3deg); }      #t1-sec-marker .badge {
        position: absolute; right: 150px; bottom: 130px; width: 150px; height: 150px;
        background: var(--red); color: var(--paper); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: 26px;
        letter-spacing: 0.04em; transform: rotate(-8deg); line-height: 1.0;
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-marker" data-composition-id="t1-sec-marker" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="stage">
        <div class="kicker" data-slot="kicker">THE BREAKDOWN</div>
        <div class="line l1" data-slot="line1">Animate</div>
        <div class="line l2" data-slot="line2">like</div>
        <div class="line l3" data-slot="line3">the pros</div>
      </div>
      <div class="badge" data-slot="badge">EP<br/>01</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-marker .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 140px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-marker .kicker", { autoAlpha: 0, y: -18, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-sec-marker .l1", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.36, ease: "power3.out" }, 0.4)
        .from("#t1-sec-marker .l2", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.36, ease: "power3.out" }, 0.58)
        .from("#t1-sec-marker .l3", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.36, ease: "power3.out" }, 0.76)
        .from("#t1-sec-marker .badge", { autoAlpha: 0, scale: 0, rotate: -60, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.4)" }, 0.9)
        .set({}, {}, 6);
      window.__timelines["t1-sec-marker"] = tl;
    </script>
  </body>
</html>
