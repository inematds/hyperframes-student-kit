<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · TICKER TAPE
  A stock-ticker tape band across the middle (ink band, paper monospace Archivo text)
  carrying context items, with the HERO stat as the highlighted symbol/figure in
  yellow on the tape. The tape does a SHORT FINITE stepped slide-in (x from offscreen
  to rest, ease steps — NOT an infinite loop).
  Slots: kicker, stat, tape (context items, ' · ' separated), label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-tape {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }

      /* === GRID === */
      #t1-stat-tape .grid {
        position: absolute; inset: -2px; z-index: 0;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }

      /* === TAPE BAND === */
      #t1-stat-tape .tape-band {
        position: absolute;
        left: -40px; right: -40px;
        top: 50%; transform: translateY(-50%);
        height: 196px;
        background: var(--ink);
        z-index: 3;
        /* Slight top/bottom edge roughness via box-shadow */
        box-shadow:
          0 -3px 0 0 rgba(23,19,14,0.5),
          0 3px 0 0 rgba(23,19,14,0.5),
          0 -8px 0 0 var(--paper-2),
          0 8px 0 0 var(--paper-2);
        overflow: hidden;
      }
      /* Sprocket holes on the tape (like film tape) */
      #t1-stat-tape .sprockets-top,
      #t1-stat-tape .sprockets-bottom {
        position: absolute; left: 0; right: 0; height: 18px;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 36px,
          rgba(239,233,220,0.18) 36px,
          rgba(239,233,220,0.18) 60px
        );
        background-size: 96px 18px;
      }
      #t1-stat-tape .sprockets-top { top: 0; }
      #t1-stat-tape .sprockets-bottom { bottom: 0; }

      /* === TAPE CONTENT ROW — clipped inside band === */
      #t1-stat-tape .tape-content {
        position: absolute;
        left: 0; right: 0; top: 18px; bottom: 18px;
        display: flex; align-items: center;
        padding: 0 80px;
        white-space: nowrap;
        overflow: hidden;
        z-index: 4;
      }
      #t1-stat-tape .tape-items {
        display: flex; align-items: center; gap: 0;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 36px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--paper);
        white-space: nowrap;
      }
      /* Hero stat on tape — highlighted in yellow */
      #t1-stat-tape .tape-hero {
        display: inline-flex; align-items: center;
        background: var(--yellow); color: var(--ink);
        padding: 6px 28px;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 86px; line-height: 1;
        letter-spacing: -0.04em;
        margin: 0 32px;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }
      .tape-sep {
        color: var(--orange); opacity: 0.7; margin: 0 20px; font-size: 28px;
      }

      /* === UPPER CONTENT (kicker + context label) === */
      #t1-stat-tape .kicker {
        position: absolute; left: 130px; top: 120px; z-index: 5;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-tape .headline {
        position: absolute; left: 130px; top: 186px; z-index: 5;
        font-weight: var(--wt-black); font-size: 110px; line-height: 0.9;
        letter-spacing: -0.04em; color: var(--ink);
      }

      /* === LOWER CONTENT (label + source) === */
      #t1-stat-tape .label {
        position: absolute; left: 130px; right: 300px; bottom: 178px; z-index: 5;
        font-weight: var(--wt-thin); font-size: 54px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-tape .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-tape .source {
        position: absolute; left: 130px; bottom: 100px; z-index: 5;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* === TEXTURE === */
      #t1-stat-tape .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.42;
        pointer-events: none; z-index: 9;
      }
      #t1-stat-tape .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(23,19,14,0.18) 100%);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-tape" data-composition-id="t1-stat-tape" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <!-- Tape band -->
      <div class="tape-band">
        <div class="sprockets-top"></div>
        <div class="tape-content">
          <div class="tape-items">
            <span class="tape-sep">·</span>
            <span data-slot="tape">CPM UP 12% · VIEWS DOWN 31% · CTR FLAT · ALGO SHIFT Q2</span>
            <span class="tape-sep">·</span>
            <span class="tape-hero" data-slot="stat">−43%</span>
            <span class="tape-sep">·</span>
            <span>WATCH TIME COLLAPSE · MONETIZATION HIT · Q3 PROJECTIONS REVISED</span>
            <span class="tape-sep">·</span>
          </div>
        </div>
        <div class="sprockets-bottom"></div>
      </div>

      <div class="kicker" data-slot="kicker">REVENUE SIGNAL</div>
      <div class="headline" data-slot="headline-display" style="display:none"></div>
      <div class="label" data-slot="label">ad revenue dropped for creators who<br>skipped the <em>hook rewrite</em></div>
      <div class="source" data-slot="source">SOURCE · CREATOR ECONOMY Q3 2025</div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Grain flicker
      tl.fromTo("#t1-stat-tape .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true },
        0
      );

      // Kicker snaps in
      tl.from("#t1-stat-tape .kicker",
        { autoAlpha: 0, x: -20, duration: 0.28, ease: "steps(4)" },
        0.15
      );

      // Tape band slams down from above
      tl.from("#t1-stat-tape .tape-band",
        { y: -220, autoAlpha: 0, duration: 0.35, ease: "power3.out" },
        0.3
      );

      // Tape content slides in from left — FINITE stepped slide
      tl.from("#t1-stat-tape .tape-content",
        { x: -1400, duration: 0.65, ease: "steps(12)" },
        0.45
      );

      // Hero stat on tape snaps into highlight
      tl.from("#t1-stat-tape .tape-hero",
        { scaleX: 0, autoAlpha: 0, duration: 0.3, ease: "back.out(2.2)" },
        0.9
      );

      // Label wipes up
      tl.from("#t1-stat-tape .label",
        { autoAlpha: 0, y: 24, duration: 0.38, ease: "power3.out" },
        1.0
      );

      tl.from("#t1-stat-tape .source",
        { autoAlpha: 0, duration: 0.28 },
        1.28
      );

      tl.set({}, {}, 6);

      window.__timelines["t1-stat-tape"] = tl;
    </script>
  </body>
</html>
