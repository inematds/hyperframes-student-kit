<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · SEGMENTED PROGRESS
  A segmented bar of 10 rectangular BLOCKS with visible gaps between them;
  N blocks filled yellow (rest kraft outline). Fills light up left→right stepped.
  Big "N/10" value displayed prominently. Built in JS deterministically.
  Distinct from the smooth bar (gaps + rectangles) and dot-grid (square blocks, not circles).
  Slots: kicker, stat, label (richtext <em>), source.
  Knob: data-fill on .segments (0..10, default 7).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-steps {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-steps .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-steps .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-steps .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-steps .kicker {
        position: absolute; left: 130px; top: 180px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* ---- big stat above segments ---- */
      #t1-stat-steps .stat {
        position: absolute; left: 130px; top: 250px;
        font-weight: var(--wt-black); font-size: 280px; line-height: 0.9;
        letter-spacing: -0.04em; color: var(--ink); font-variant-numeric: tabular-nums;
      }
      #t1-stat-steps .stat .denom {
        font-size: 0.45em; font-weight: var(--wt-thin);
        color: var(--muted); letter-spacing: 0; vertical-align: middle;
      }
      /* ---- segment row ---- */
      #t1-stat-steps .segments {
        position: absolute; left: 130px; right: 130px; top: 620px; height: 160px;
        display: flex; gap: 16px;
      }
      #t1-stat-steps .seg {
        flex: 1; height: 100%;
        box-shadow: inset 0 0 0 4px var(--ink);
        background: var(--paper-2);
        position: relative;
      }
      #t1-stat-steps .seg.on { background: var(--yellow); }
      /* index tick below each segment */
      #t1-stat-steps .seg::after {
        content: attr(data-idx);
        position: absolute; bottom: -42px; left: 0; right: 0;
        text-align: center;
        font-family: var(--font-label); font-size: 22px; font-weight: var(--wt-bold);
        color: var(--muted); letter-spacing: 0.05em;
      }
      /* ---- label + source ---- */
      #t1-stat-steps .label {
        position: absolute; left: 130px; right: 130px; top: 840px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-steps .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-steps .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-steps" data-composition-id="t1-stat-steps" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">STEPS COMPLETED</div>
      <div class="stat" data-slot="stat">7<span class="denom">/10</span></div>
      <div class="segments" data-fill="7" id="segments"></div>
      <div class="label" data-slot="label">pipeline stages cleared — <em>3 remain</em></div>
      <div class="source" data-slot="source">SOURCE · PIPELINE AUDIT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const segs = document.getElementById("segments");
      const fill = Math.max(0, Math.min(10, parseInt(segs.getAttribute("data-fill"), 10) || 7));
      for (let i = 0; i < 10; i++) {
        const s = document.createElement("div");
        s.className = "seg" + (i < fill ? " on" : "");
        s.setAttribute("data-idx", i + 1);
        segs.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-steps .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-steps .kicker",    { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-steps .stat",      { autoAlpha: 0, scale: 0.7, duration: 0.45, ease: "back.out(2.2)" }, 0.3)
        .from("#t1-stat-steps .seg",       { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.06, ease: "steps(1)", stagger: 0.06 }, 0.55)
        .from("#t1-stat-steps .label",     { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.3)
        .from("#t1-stat-steps .source",    { autoAlpha: 0, duration: 0.3 }, 1.55)
        .set({}, {}, 6);
      window.__timelines["t1-stat-steps"] = tl;
    </script>
  </body>
</html>
