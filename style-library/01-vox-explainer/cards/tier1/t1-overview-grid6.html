<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · 3x2 TOPIC GRID
  Six numbered tiles (01..06) in a 3-col, 2-row grid. Each tile = a bold number
  + a short topic. Tile 01 is yellow (hero). Tiles stagger in row by row.
  Marker title at top.
  Slots: title, g1, g2, g3, g4, g5, g6, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-grid6 {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-grid6 .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-grid6 .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-ov-grid6 .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 40%, transparent 58%, rgba(23,19,14,0.16) 100%);
      }
      /* marker title */
      #t1-ov-grid6 .title {
        position: absolute; top: 62px; left: 130px;
        background: var(--ink); color: var(--paper);
        padding: 10px 30px; z-index: 3;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase;
        transform: skewX(var(--marker-skew)); white-space: nowrap;
      }
      /* 3x2 tile grid */
      #t1-ov-grid6 .tiles {
        position: absolute; left: 110px; right: 110px; top: 230px; bottom: 110px;
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
        gap: 24px; z-index: 2;
      }
      #t1-ov-grid6 .tile {
        background: var(--paper-2);
        box-shadow: inset 0 0 0 3px var(--ink);
        display: flex; flex-direction: column; justify-content: flex-end;
        padding: 36px 40px; position: relative; overflow: hidden;
      }
      /* hero tile 01 */
      #t1-ov-grid6 .tile.hero {
        background: var(--yellow);
        box-shadow: inset 0 0 0 4px var(--ink), 10px 14px 0 rgba(23,19,14,0.14);
      }
      /* big number sits in corner */
      #t1-ov-grid6 .num {
        position: absolute; top: 24px; left: 32px;
        font-weight: var(--wt-black); font-size: 100px; line-height: 1;
        letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
        color: var(--ink); opacity: 0.12;
      }
      #t1-ov-grid6 .tile.hero .num { opacity: 0.25; }
      #t1-ov-grid6 .label {
        font-weight: var(--wt-black); font-size: 50px;
        line-height: 1.1; letter-spacing: var(--track-tight);
        color: var(--ink); position: relative; z-index: 1;
      }
      /* source */
      #t1-ov-grid6 .source {
        position: absolute; right: 130px; bottom: 50px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-grid6" data-composition-id="t1-ov-grid6" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="title" data-slot="title">SIX THINGS TO KNOW</div>

      <div class="tiles">
        <div class="tile hero g1">
          <div class="num">01</div>
          <div class="label" data-slot="g1">The Shift Nobody Saw Coming</div>
        </div>
        <div class="tile g2">
          <div class="num">02</div>
          <div class="label" data-slot="g2">How We Got Here</div>
        </div>
        <div class="tile g3">
          <div class="num">03</div>
          <div class="label" data-slot="g3">Who Benefits Most</div>
        </div>
        <div class="tile g4">
          <div class="num">04</div>
          <div class="label" data-slot="g4">The Hidden Cost</div>
        </div>
        <div class="tile g5">
          <div class="num">05</div>
          <div class="label" data-slot="g5">What Experts Say</div>
        </div>
        <div class="tile g6">
          <div class="num">06</div>
          <div class="label" data-slot="g6">Where This Goes Next</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker — finite
      tl.fromTo("#t1-ov-grid6 .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "160px 100px", duration: 0.5, ease: "steps(4)", repeat: 13, yoyo: true }, 0);

      // title snaps in
      tl.from("#t1-ov-grid6 .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.out" }, 0.1);

      // row 1 tiles (g1, g2, g3)
      tl.from("#t1-ov-grid6 .g1",
        { autoAlpha: 0, y: 50, duration: 0.4, ease: "back.out(1.6)" }, 0.45);
      tl.from("#t1-ov-grid6 .g2",
        { autoAlpha: 0, y: 50, duration: 0.4, ease: "back.out(1.6)" }, 0.58);
      tl.from("#t1-ov-grid6 .g3",
        { autoAlpha: 0, y: 50, duration: 0.4, ease: "back.out(1.6)" }, 0.71);

      // row 2 tiles (g4, g5, g6)
      tl.from("#t1-ov-grid6 .g4",
        { autoAlpha: 0, y: 50, duration: 0.4, ease: "back.out(1.6)" }, 0.92);
      tl.from("#t1-ov-grid6 .g5",
        { autoAlpha: 0, y: 50, duration: 0.4, ease: "back.out(1.6)" }, 1.05);
      tl.from("#t1-ov-grid6 .g6",
        { autoAlpha: 0, y: 50, duration: 0.4, ease: "back.out(1.6)" }, 1.18);

      tl.from("#t1-ov-grid6 .source", { autoAlpha: 0, duration: 0.3 }, 1.4);

      tl.set({}, {}, 7);

      window.__timelines["t1-ov-grid6"] = tl;
    </script>
  </body>
</html>
