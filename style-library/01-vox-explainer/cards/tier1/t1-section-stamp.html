<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · STAMP
  The title itself as a big distressed red rubber stamp that slams in. Paper.
  Slots: title, date (sub-stamp), kicker.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-stamp {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #t1-sec-stamp .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-stamp .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.45; pointer-events: none;
      }
      #t1-sec-stamp .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 50%, transparent 54%, rgba(23,19,14,0.16) 100%);
      }
      #t1-sec-stamp .stamp {
        position: relative; z-index: 3; transform: rotate(-7deg); text-align: center;
        border: 10px solid var(--red); padding: 28px 64px; color: var(--red); opacity: 0.9;
        box-shadow: 0 0 0 8px rgba(226,59,46,0.0);
      }
      #t1-sec-stamp .stamp::before, #t1-sec-stamp .stamp::after {
        content: ""; position: absolute; left: 14px; right: 14px; height: 4px; background: var(--red);
      }
      #t1-sec-stamp .stamp::before { top: 14px; }
      #t1-sec-stamp .stamp::after { bottom: 14px; }
      #t1-sec-stamp .kick {
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: 30px;
        letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px;
      }
      #t1-sec-stamp .title {
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: 150px;
        letter-spacing: 0.02em; text-transform: uppercase; line-height: 0.92;
      }
      #t1-sec-stamp .date {
        position: absolute; z-index: 3; right: 320px; bottom: 250px;
        border: 5px solid var(--ink); color: var(--ink); padding: 8px 18px; opacity: 0.78;
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: 34px;
        letter-spacing: 0.12em; text-transform: uppercase; transform: rotate(5deg);
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-stamp" data-composition-id="t1-sec-stamp" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="stamp">
        <div class="kick" data-slot="kicker">THE VERDICT</div>
        <div class="title" data-slot="title">Debunked</div>
      </div>
      <div class="date" data-slot="date">FILED 06 · 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-stamp .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 150px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-stamp .stamp", { autoAlpha: 0, scale: 2.4, rotate: -22, transformOrigin: "50% 50%", duration: 0.34, ease: "steps(3)" }, 0.35)
        .from("#t1-sec-stamp .date", { autoAlpha: 0, scale: 2.0, rotate: 22, transformOrigin: "50% 50%", duration: 0.28, ease: "steps(3)" }, 0.8)
        .set({}, {}, 5.5);
      window.__timelines["t1-sec-stamp"] = tl;
    </script>
  </body>
</html>
