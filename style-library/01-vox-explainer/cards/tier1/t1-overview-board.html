<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · DEPARTURES BOARD
  A split-flap departures/arrivals board (dark ink board, paper-colored Archivo
  monospace rows, a horizontal center seam per row). 5 agenda rows each showing
  a topic on the left and a time/code on the right. Rows flip/reveal in sequence
  via a stepped clip-wipe. Board header = title slot.
  Slots: title, row1, time1, row2, time2, row3, time3, row4, time4, row5, time5,
         source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-board {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-board .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-board .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-ov-board .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 46%, transparent 54%, rgba(23,19,14,0.22) 100%);
      }

      /* board outer frame */
      #t1-ov-board .board {
        position: absolute; left: 180px; right: 180px; top: 96px;
        background: var(--ink);
        border: 6px solid var(--ink);
        border-radius: 4px;
        box-shadow: 18px 24px 0 rgba(23,19,14,0.28);
        overflow: hidden;
        z-index: 3;
      }

      /* board header */
      #t1-ov-board .board-header {
        padding: 28px 64px 22px;
        background: var(--ink);
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 4px solid rgba(239,233,220,0.18);
      }
      #t1-ov-board .header-title {
        font-weight: var(--wt-black); font-size: 52px;
        letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--yellow);
      }
      #t1-ov-board .header-col-label {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: rgba(239,233,220,0.36);
      }
      #t1-ov-board .header-cols {
        display: flex; gap: 280px; align-items: center;
      }

      /* row list */
      #t1-ov-board .rows {
        background: var(--ink); padding: 0;
      }

      /* individual row */
      #t1-ov-board .row {
        position: relative; display: flex; align-items: stretch;
        border-bottom: 3px solid rgba(239,233,220,0.12);
        height: 130px; overflow: hidden;
      }
      #t1-ov-board .row:last-child { border-bottom: none; }

      /* split-flap cell background — dark, flat */
      #t1-ov-board .flap {
        position: absolute; inset: 0;
        background: #1f1a12;
      }

      /* the horizontal center seam (split-flap signature) */
      #t1-ov-board .row::after {
        content: ""; position: absolute;
        left: 0; right: 0; top: 50%; height: 3px;
        background: rgba(23,19,14,0.9);
        z-index: 4; pointer-events: none;
      }

      /* row number badge */
      #t1-ov-board .row-num {
        flex-shrink: 0; width: 80px;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); color: rgba(239,233,220,0.28);
        border-right: 3px solid rgba(239,233,220,0.1);
        z-index: 3;
      }

      /* topic */
      #t1-ov-board .row-topic {
        flex: 1; padding: 0 48px;
        display: flex; align-items: center;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 44px; letter-spacing: 0.02em;
        color: var(--paper); z-index: 3;
        /* clip for stepped reveal */
        clip-path: inset(0 100% 0 0);
      }

      /* time/code badge on the right */
      #t1-ov-board .row-time {
        flex-shrink: 0; width: 280px;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 44px; letter-spacing: 0.1em;
        color: var(--yellow);
        border-left: 3px solid rgba(239,233,220,0.1);
        z-index: 3;
        clip-path: inset(0 0 0 100%);
      }

      /* source */
      #t1-ov-board .source {
        position: absolute; left: 180px; bottom: 54px; z-index: 8;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-board" data-composition-id="t1-ov-board" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="board">
        <div class="board-header">
          <div class="header-title" data-slot="title">TODAY'S AGENDA</div>
          <div class="header-cols">
            <div class="header-col-label">TOPIC</div>
            <div class="header-col-label">TIME</div>
          </div>
        </div>

        <div class="rows">

          <div class="row r1">
            <div class="flap"></div>
            <div class="row-num">01</div>
            <div class="row-topic" data-slot="row1">Why this matters</div>
            <div class="row-time" data-slot="time1">0:00</div>
          </div>

          <div class="row r2">
            <div class="flap"></div>
            <div class="row-num">02</div>
            <div class="row-topic" data-slot="row2">The problem, defined</div>
            <div class="row-time" data-slot="time2">2:30</div>
          </div>

          <div class="row r3">
            <div class="flap"></div>
            <div class="row-num">03</div>
            <div class="row-topic" data-slot="row3">Three key findings</div>
            <div class="row-time" data-slot="time3">5:15</div>
          </div>

          <div class="row r4">
            <div class="flap"></div>
            <div class="row-num">04</div>
            <div class="row-topic" data-slot="row4">What the data shows</div>
            <div class="row-time" data-slot="time4">9:40</div>
          </div>

          <div class="row r5">
            <div class="flap"></div>
            <div class="row-num">05</div>
            <div class="row-topic" data-slot="row5">What happens next</div>
            <div class="row-time" data-slot="time5">14:00</div>
          </div>

        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · PROGRAM GUIDE</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker (finite)
      tl.fromTo("#t1-ov-board .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "155px 115px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // board frame drops in from above (stepped)
      tl.from("#t1-ov-board .board",
              { y: -80, autoAlpha: 0, duration: 0.4, ease: "steps(6)" }, 0.15);

      // header title flips in
      tl.from("#t1-ov-board .header-title",
              { clipPath: "inset(0 100% 0 0)", duration: 0.4, ease: "steps(7)" }, 0.42);
      tl.from("#t1-ov-board .header-cols",
              { autoAlpha: 0, duration: 0.25 }, 0.6);

      // rows reveal one at a time via stepped clip-wipe (split-flap effect)
      const rows = [".r1", ".r2", ".r3", ".r4", ".r5"];
      rows.forEach((sel, i) => {
        const t = 0.72 + i * 0.26;
        // flap background snaps visible
        tl.from("#t1-ov-board " + sel + " .flap",
                { autoAlpha: 0, duration: 0.05 }, t);
        // topic wipes in from left with steps (split-flap letter flip feel)
        tl.to("#t1-ov-board " + sel + " .row-topic",
              { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "steps(6)" }, t + 0.04);
        // time wipes in from right
        tl.to("#t1-ov-board " + sel + " .row-time",
              { clipPath: "inset(0 0 0 0%)", duration: 0.22, ease: "steps(5)" }, t + 0.22);
      });

      tl.from("#t1-ov-board .source",
              { autoAlpha: 0, duration: 0.3 }, 2.1);
      tl.set({}, {}, 7);

      window.__timelines["t1-ov-board"] = tl;
    </script>
  </body>
</html>
