<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · VERSUS
  Two numbers compared across a hard seam: a recessed paper "before" panel and a
  yellow "after" panel that lands harder and larger. A small VS mark sits on the
  divide. No arrows — the size + color contrast carries the comparison.
  Slots: kicker, aVal, aLabel (the baseline), bVal, bLabel (the hero), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-vs {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-vs .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-vs .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 58%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-vs .kicker {
        position: absolute; left: 50%; top: 110px; transform: translateX(-50%); z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red); white-space: nowrap;
      }
      #t1-stat-vs .panel {
        position: absolute; top: 220px; bottom: 200px; width: 800px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #t1-stat-vs .panel.a { left: 90px; background: var(--paper-2); box-shadow: inset 0 0 0 4px rgba(23,19,14,0.18); }
      #t1-stat-vs .panel.b { right: 90px; background: var(--yellow); box-shadow: 0 22px 44px rgba(23,19,14,0.28); }
      #t1-stat-vs .val { font-weight: var(--wt-black); line-height: 0.86; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
      #t1-stat-vs .panel.a .val { font-size: 240px; color: var(--muted); }
      #t1-stat-vs .panel.b .val { font-size: 340px; color: var(--ink); }
      #t1-stat-vs .plabel {
        margin-top: 26px; width: 80%; text-align: center;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: var(--track-wide); text-transform: uppercase;
      }
      #t1-stat-vs .panel.a .plabel { color: var(--muted); }
      #t1-stat-vs .panel.b .plabel { color: var(--ink); }
      #t1-stat-vs .vs {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-6deg); z-index: 4;
        width: 130px; height: 130px; border-radius: 50%;
        background: var(--ink); color: var(--paper);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: 52px;
        letter-spacing: 0.04em; box-shadow: 0 12px 26px rgba(23,19,14,0.4);
      }
      #t1-stat-vs .source {
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-vs" data-composition-id="t1-stat-vs" data-start="0" data-width="1920" data-height="1080">
      <div class="kicker" data-slot="kicker">BEFORE / AFTER AUTOMATION</div>
      <div class="panel a">
        <div class="val" data-slot="aVal">9h</div>
        <div class="plabel" data-slot="aLabel">edited by hand</div>
      </div>
      <div class="panel b">
        <div class="val" data-slot="bVal">12m</div>
        <div class="plabel" data-slot="bLabel">with the pipeline</div>
      </div>
      <div class="vs">VS</div>
      <div class="source" data-slot="source">SOURCE · INTERNAL BENCHMARK</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-vs .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-vs .kicker", { autoAlpha: 0, y: -18, duration: 0.3, ease: "steps(4)" }, 0.15)
        .from("#t1-stat-vs .panel.a", { autoAlpha: 0, x: -60, duration: 0.4, ease: "power3.out" }, 0.3)
        .from("#t1-stat-vs .panel.a .val", { autoAlpha: 0, scale: 0.7, duration: 0.35, ease: "back.out(2)" }, 0.45)
        .from("#t1-stat-vs .panel.b", { autoAlpha: 0, x: 60, duration: 0.4, ease: "power3.out" }, 0.6)
        .from("#t1-stat-vs .panel.b .val", { autoAlpha: 0, scale: 0.6, duration: 0.4, ease: "back.out(2.6)" }, 0.78)
        .from("#t1-stat-vs .vs", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2.6)" }, 1.0)
        .from("#t1-stat-vs .plabel", { autoAlpha: 0, y: 16, duration: 0.3, stagger: 0.1 }, 1.05)
        .from("#t1-stat-vs .source", { autoAlpha: 0, duration: 0.3 }, 1.35)
        .set({}, {}, 6);
      window.__timelines["t1-stat-vs"] = tl;
    </script>
  </body>
</html>
