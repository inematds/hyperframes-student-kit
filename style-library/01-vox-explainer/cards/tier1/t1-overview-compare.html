<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · TWO-COLUMN COMPARE
  Canvas split down the center: left = paper, right = kraft with yellow header.
  Each side has a column title + 3 staggered bullet items.
  Slots: title, leftTitle, l1, l2, l3, rightTitle, r1, r2, r3, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; }
      #t1-ov-compare {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      /* texture layers */
      #t1-ov-compare .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-compare .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.42;
        pointer-events: none; z-index: 10;
      }
      #t1-ov-compare .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 9;
        background: radial-gradient(130% 120% at 50% 40%, transparent 58%, rgba(23,19,14,0.16) 100%);
      }

      /* marker title spanning top */
      #t1-ov-compare .marker-title {
        position: absolute; top: 72px; left: 50%; transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 10px 36px; z-index: 5;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase; white-space: nowrap;
      }

      /* hard seam at center */
      #t1-ov-compare .seam {
        position: absolute; left: 50%; top: 0; bottom: 0;
        width: 6px; margin-left: -3px; background: var(--ink); z-index: 4;
      }

      /* two panels */
      #t1-ov-compare .panel {
        position: absolute; top: 0; bottom: 0; width: 960px; overflow: hidden;
      }
      #t1-ov-compare .panel.left  { left: 0;    background: var(--paper); }
      #t1-ov-compare .panel.right { left: 960px; background: var(--paper-2); }

      /* column headers */
      #t1-ov-compare .col-header {
        position: absolute; left: 0; right: 0; top: 224px;
        padding: 0 80px;
      }
      #t1-ov-compare .panel.left .col-header { padding-left: 120px; }
      #t1-ov-compare .panel.right .col-header { padding-left: 80px; }

      #t1-ov-compare .col-header-inner {
        display: inline-block; background: var(--ink);
        padding: 8px 28px; color: var(--paper);
        font-weight: var(--wt-black); font-size: 48px;
        letter-spacing: var(--track-tight); text-transform: uppercase;
      }
      #t1-ov-compare .panel.right .col-header-inner {
        background: var(--yellow); color: var(--ink);
      }

      /* item list */
      #t1-ov-compare .items {
        position: absolute; top: 340px; left: 0; right: 0;
        padding: 0 80px; list-style: none; margin: 0;
      }
      #t1-ov-compare .panel.left .items  { padding-left: 120px; }
      #t1-ov-compare .panel.right .items { padding-left: 80px; }

      #t1-ov-compare .item {
        display: flex; align-items: flex-start; gap: 22px;
        margin-bottom: 52px;
      }
      #t1-ov-compare .dot {
        flex-shrink: 0; width: 20px; height: 20px; margin-top: 14px;
        background: var(--ink); border-radius: 50%;
      }
      #t1-ov-compare .panel.right .dot { background: var(--red); }
      #t1-ov-compare .item-text {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 40px; line-height: 1.25; color: var(--ink);
      }

      /* source */
      #t1-ov-compare .source {
        position: absolute; bottom: 56px; left: 120px; z-index: 6;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-compare" data-composition-id="t1-ov-compare" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="marker-title" data-slot="title">THE COMPARISON</div>

      <!-- left panel -->
      <div class="panel left" id="cmp-left">
        <div class="col-header">
          <div class="col-header-inner" data-slot="leftTitle">OPTION A</div>
        </div>
        <ul class="items">
          <li class="item li1">
            <div class="dot"></div>
            <div class="item-text" data-slot="l1">First point about this side</div>
          </li>
          <li class="item li2">
            <div class="dot"></div>
            <div class="item-text" data-slot="l2">Second point about this side</div>
          </li>
          <li class="item li3">
            <div class="dot"></div>
            <div class="item-text" data-slot="l3">Third point about this side</div>
          </li>
        </ul>
      </div>

      <!-- right panel -->
      <div class="panel right" id="cmp-right">
        <div class="col-header">
          <div class="col-header-inner" data-slot="rightTitle">OPTION B</div>
        </div>
        <ul class="items">
          <li class="item ri1">
            <div class="dot"></div>
            <div class="item-text" data-slot="r1">First point about this side</div>
          </li>
          <li class="item ri2">
            <div class="dot"></div>
            <div class="item-text" data-slot="r2">Second point about this side</div>
          </li>
          <li class="item ri3">
            <div class="dot"></div>
            <div class="item-text" data-slot="r3">Third point about this side</div>
          </li>
        </ul>
      </div>

      <div class="seam"></div>

      <div class="source" data-slot="source">SOURCE · REFERENCE 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // finite grain flicker
      tl.fromTo("#t1-ov-compare .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "160px 90px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // marker title snaps in
      tl.from("#t1-ov-compare .marker-title",
              { autoAlpha: 0, scaleX: 0, transformOrigin: "center center", duration: 0.35, ease: "power3.out" }, 0.15);

      // seam draws down
      tl.from("#t1-ov-compare .seam",
              { scaleY: 0, transformOrigin: "top center", duration: 0.4, ease: "power2.inOut" }, 0.3);

      // left panel slides in from left
      tl.from("#cmp-left",
              { x: -960, duration: 0.5, ease: "power3.out" }, 0.35);

      // right panel slides in from right
      tl.from("#cmp-right",
              { x: 960, duration: 0.5, ease: "power3.out" }, 0.35);

      // column headers stamp in
      tl.from("#t1-ov-compare .col-header",
              { autoAlpha: 0, y: -20, duration: 0.3, ease: "back.out(1.6)", stagger: 0.1 }, 0.7);

      // left items stagger
      tl.from("#cmp-left .item",
              { autoAlpha: 0, x: -30, duration: 0.32, ease: "back.out(1.6)", stagger: 0.14 }, 0.9);

      // right items stagger (slight offset)
      tl.from("#cmp-right .item",
              { autoAlpha: 0, x: 30, duration: 0.32, ease: "back.out(1.6)", stagger: 0.14 }, 1.05);

      tl.from("#t1-ov-compare .source", { autoAlpha: 0, duration: 0.3 }, 1.7);

      tl.set({}, {}, 7);

      window.__timelines["t1-ov-compare"] = tl;
    </script>
  </body>
</html>
