<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · TORNSTRIP
  Title on a torn newspaper strip laid diagonally over faint newsprint columns.
  Slots: kicker, headline (<em> marker emphasis), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-torn {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      /* faint newsprint columns behind */
      #t1-sec-torn .news {
        position: absolute; inset: 70px;
        column-count: 4; column-gap: 60px; opacity: 0.16; overflow: hidden;
      }
      #t1-sec-torn .news .ln {
        height: 14px; margin: 0 0 16px; background: var(--ink); border-radius: 2px;
        background-image: repeating-linear-gradient(90deg, var(--ink) 0 40px, transparent 40px 52px);
      }
      #t1-sec-torn .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.42; pointer-events: none; z-index: 5;
      }
      #t1-sec-torn .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(130% 120% at 50% 50%, transparent 54%, rgba(23,19,14,0.18) 100%);
      }
      /* the torn strip */
      #t1-sec-torn .strip {
        position: absolute; left: -40px; right: -40px; top: 380px; padding: 60px 120px;
        background: var(--paper-2); z-index: 3; transform: rotate(-3.4deg);
        box-shadow: 0 26px 50px rgba(23,19,14,0.32);
        clip-path: polygon(0 14%, 6% 6%, 14% 12%, 23% 4%, 33% 13%, 44% 5%, 55% 14%, 66% 6%, 77% 13%, 87% 5%, 95% 12%, 100% 6%,
                           100% 84%, 94% 94%, 85% 87%, 75% 96%, 64% 86%, 54% 95%, 43% 86%, 33% 96%, 23% 87%, 13% 95%, 5% 87%, 0 94%);
      }
      #t1-sec-torn .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red); margin-bottom: 14px;
      }
      #t1-sec-torn .headline {
        font-weight: var(--wt-black); font-size: 132px; line-height: 0.95;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-torn .headline em { font-style: normal; background: var(--yellow); padding: 0 14px; }
      #t1-sec-torn .source {
        position: absolute; left: 150px; bottom: 80px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-torn" data-composition-id="t1-sec-torn" data-start="0" data-width="1920" data-height="1080">
      <div class="news" id="news"></div>
      <div class="strip">
        <div class="kicker" data-slot="kicker">FROM THE ARCHIVE</div>
        <div class="headline" data-slot="headline">The story they <em>buried</em></div>
      </div>
      <div class="source" data-slot="source">RECOVERED · 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      // fill faux newsprint lines (deterministic counts, no randomness)
      const news = document.getElementById("news");
      for (let i = 0; i < 40; i++) { const d = document.createElement("div"); d.className = "ln";
        d.style.width = (60 + ((i * 37) % 40)) + "%"; news.appendChild(d); }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-torn .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "160px 120px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-torn .news", { autoAlpha: 0, duration: 0.4 }, 0.1)
        .from("#t1-sec-torn .strip", { autoAlpha: 0, x: -80, y: 40, rotate: -8, duration: 0.5, ease: "back.out(1.5)" }, 0.2)
        .from("#t1-sec-torn .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.5)
        .from("#t1-sec-torn .headline", { autoAlpha: 0, y: 24, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.58)
        .from("#t1-sec-torn .source", { autoAlpha: 0, duration: 0.3 }, 0.9)
        .set({}, {}, 6);
      window.__timelines["t1-sec-torn"] = tl;
    </script>
  </body>
</html>
