<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · CUTOUT-PORTRAIT
  Big title left, masked halftone portrait right (yellow sticker outline), a red
  dashed arrow connecting a Vox circle to the subject, scattered scraps.
  Slots: kicker, headline (<em> emphasis), subject (image), wordmark.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-cutout {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-cutout .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-cutout .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.42; pointer-events: none;
      }
      #t1-sec-cutout .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(130% 120% at 35% 50%, transparent 58%, rgba(23,19,14,0.16) 100%);
      }
      #t1-sec-cutout .kicker {
        position: absolute; left: 150px; top: 250px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink); background: var(--yellow); padding: 5px 16px;
        transform: skewX(var(--marker-skew));
      }
      #t1-sec-cutout .headline {
        position: absolute; left: 150px; top: 330px; width: 880px; z-index: 4;
        font-weight: var(--wt-black); font-size: 124px; line-height: 0.95;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-cutout .headline em { font-style: italic; font-weight: var(--wt-thin); }
      /* the masked subject cutout */
      #t1-sec-cutout .subject {
        position: absolute; right: 120px; top: 150px; width: 620px; height: 820px;
        background-color: var(--paper-2); background-image: var(--tex-halftone);
        background-size: var(--tex-halftone-size); z-index: 2;
        outline: 12px solid var(--yellow); outline-offset: -12px; transform: rotate(1.5deg);
        box-shadow: -16px 20px 0 rgba(23,19,14,0.14);
      }
      #t1-sec-cutout .wordmark {
        position: absolute; left: 980px; top: 760px; width: 200px; height: 200px;
        background: var(--yellow); border-radius: 50%; z-index: 5;
        display: flex; align-items: center; justify-content: center;
        font-weight: var(--wt-black); font-style: italic; font-size: 64px; color: var(--ink);
        transform: rotate(-5deg);
      }    </style>
  </head>
  <body>
    <div id="t1-sec-cutout" data-composition-id="t1-sec-cutout" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="subject" data-slot="subject"></div>
      <div class="kicker" data-slot="kicker">PROFILE</div>
      <div class="headline" data-slot="headline">The mind that <em>broke</em> the rules</div>
      <div class="wordmark" data-slot="wordmark">Vox</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-cutout .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "160px 120px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-cutout .subject", { autoAlpha: 0, x: 120, rotate: 8, duration: 0.5, ease: "back.out(1.7)" }, 0.15)
        .from("#t1-sec-cutout .kicker", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.3, ease: "power3.out" }, 0.4)
        .from("#t1-sec-cutout .headline", { autoAlpha: 0, y: 30, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.5)
        .from("#t1-sec-cutout .wordmark", { autoAlpha: 0, scale: 0, rotate: -40, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.2)" }, 0.85)
        .set({}, {}, 6.2);
      window.__timelines["t1-sec-cutout"] = tl;
    </script>
  </body>
</html>
