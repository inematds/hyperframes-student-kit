<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · NUMERAL
  Giant ghost chapter number (outline) fills the frame; title overlaid.
  Slots: number, kicker, headline (<em> emphasis).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-num {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-num .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-num .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 5;
      }
      #t1-sec-num .ghost {
        position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
        font-weight: var(--wt-black); font-style: italic; font-size: 1280px; line-height: 0.7;
        color: transparent; -webkit-text-stroke: 5px rgba(23,19,14,0.16);
        z-index: 1; user-select: none;
      }
      #t1-sec-num .kicker {
        position: absolute; left: 150px; top: 360px; z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
      }
      #t1-sec-num .kicker::before { content: ""; display: inline-block; width: 56px; height: 3px; background: var(--red); margin-right: 16px; vertical-align: middle; }
      #t1-sec-num .headline {
        position: absolute; left: 150px; top: 410px; width: 1180px; z-index: 3;
        font-weight: var(--wt-black); font-size: 138px; line-height: 0.95;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-num .headline em { font-style: italic; font-weight: var(--wt-thin); }
      #t1-sec-num .underline { position: absolute; left: 154px; top: 720px; width: 0; height: 8px; background: var(--yellow); z-index: 2; }
    </style>
  </head>
  <body>
    <div id="t1-sec-num" data-composition-id="t1-sec-num" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="ghost" data-slot="number">3</div>
      <div class="underline"></div>
      <div class="kicker" data-slot="kicker">CHAPTER THREE</div>
      <div class="headline" data-slot="headline">When the <em>money</em> moved</div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-num .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-num .ghost", { autoAlpha: 0, scale: 1.25, x: 120, transformOrigin: "70% 50%", duration: 0.7, ease: "power3.out" }, 0.1)
        .from("#t1-sec-num .kicker", { autoAlpha: 0, x: -26, duration: 0.3, ease: "steps(4)" }, 0.5)
        .from("#t1-sec-num .headline", { autoAlpha: 0, y: 28, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.6)
        .to("#t1-sec-num .underline", { width: 420, duration: 0.5, ease: "power2.out" }, 0.95)
        .set({}, {}, 6);
      window.__timelines["t1-sec-num"] = tl;
    </script>
  </body>
</html>
