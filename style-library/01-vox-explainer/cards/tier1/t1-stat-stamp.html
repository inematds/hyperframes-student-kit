<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · STAMP
  A red rubber-stamp rectangle slams in rotated ~-7deg, double-rule border,
  slightly distressed opacity. The stat lives inside the stamp. A stamp word
  (VERIFIED, APPROVED, etc.) sits above the number. Functional prop — no circles.
  Slots: kicker, stampWord (e.g. VERIFIED), stat, label (richtext <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-stamp {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-stamp .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-stamp .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-stat-stamp .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.18) 100%);
      }
      /* kicker — top left editorial label */
      #t1-stat-stamp .kicker {
        position: absolute; left: 130px; top: 270px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      /* stamp body — the red rectangle prop */
      #t1-stat-stamp .stamp-wrap {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -48%) rotate(-7deg);
        transform-origin: center center;
      }
      #t1-stat-stamp .stamp {
        /* double-rule border via outline + border */
        border: 6px solid var(--red);
        outline: 3px solid var(--red);
        outline-offset: 8px;
        padding: 44px 80px 52px;
        opacity: 0.85;
        background: transparent;
        display: flex; flex-direction: column; align-items: center; gap: 0;
        /* slight bleed / distress effect on border via box-shadow */
        box-shadow:
          inset 0 0 0 3px rgba(226,59,46,0.18),
          0 0 0 1px rgba(226,59,46,0.3),
          4px 6px 20px rgba(226,59,46,0.22);
      }
      #t1-stat-stamp .stamp-word {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 54px; letter-spacing: 0.28em;
        text-transform: uppercase; color: var(--red);
        line-height: 1;
        /* stepped distress: slightly uneven letter spacing */
        text-shadow: 1px 0 0 rgba(226,59,46,0.3);
      }
      #t1-stat-stamp .stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 300px; line-height: 0.9;
        color: var(--red); font-variant-numeric: tabular-nums;
        /* distress the edges a touch */
        text-shadow: 2px 2px 0 rgba(226,59,46,0.2), -1px -1px 0 rgba(226,59,46,0.15);
      }
      #t1-stat-stamp .stamp-rule {
        width: 100%; height: 4px;
        background: var(--red);
        opacity: 0.7; margin: 10px 0 14px;
      }
      /* label below the stamp */
      #t1-stat-stamp .label {
        position: absolute; left: 130px; right: 130px; bottom: 220px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.1;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-stamp .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-stamp .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-stamp" data-composition-id="t1-stat-stamp" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">FINAL VERDICT</div>
      <div class="stamp-wrap">
        <div class="stamp">
          <div class="stamp-word" data-slot="stampWord">VERIFIED</div>
          <div class="stamp-rule"></div>
          <div class="stat" data-slot="stat">73%</div>
        </div>
      </div>
      <div class="label" data-slot="label">of creators report <em>measurable growth</em> within 90 days</div>
      <div class="source" data-slot="source">SOURCE · CREATOR SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Grain flicker — finite stepped, not infinite
      tl.fromTo("#t1-stat-stamp .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      // Kicker snaps in
      tl.from("#t1-stat-stamp .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.15)
        // Stamp SLAMS in — scale up from 1.6, rotate exaggerated then settles
        .from("#t1-stat-stamp .stamp-wrap", {
          autoAlpha: 0, scale: 1.6, rotation: 14,
          transformOrigin: "50% 50%",
          duration: 0.38, ease: "steps(5)"
        }, 0.35)
        // Slight settle bounce after slam
        .to("#t1-stat-stamp .stamp-wrap", {
          rotation: -7, scale: 1,
          duration: 0.22, ease: "back.out(2.2)"
        }, 0.73)
        // stamp-word flickers on
        .from("#t1-stat-stamp .stamp-word", { autoAlpha: 0, duration: 0.22, ease: "steps(3)" }, 0.78)
        // stat number pops
        .from("#t1-stat-stamp .stat", {
          autoAlpha: 0, scale: 0.7,
          transformOrigin: "50% 50%",
          duration: 0.28, ease: "back.out(2.4)"
        }, 0.9)
        .from("#t1-stat-stamp .label", { autoAlpha: 0, y: 22, duration: 0.4, ease: "power3.out" }, 1.15)
        .from("#t1-stat-stamp .source", { autoAlpha: 0, duration: 0.3 }, 1.45)
        .set({}, {}, 6);
      window.__timelines["t1-stat-stamp"] = tl;
    </script>
  </body>
</html>
