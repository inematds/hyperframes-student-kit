<!doctype html>
<!--
  VOX EXPLAINER · tier1 · section · BRACKET
  Title framed by big editorial brackets, centered, with a yellow underline sweep.
  Slots: kicker, headline (<em> emphasis), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-bracket {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #t1-sec-bracket .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
        opacity: 0.6;
      }
      #t1-sec-bracket .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 5;
      }
      #t1-sec-bracket .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.14) 100%);
      }
      #t1-sec-bracket .wrap { position: relative; z-index: 3; display: flex; align-items: center; gap: 50px; }
      #t1-sec-bracket .br { font-weight: var(--wt-thin); font-size: 540px; line-height: 0.7; color: var(--ink); }
      #t1-sec-bracket .center { text-align: center; max-width: 960px; }
      #t1-sec-bracket .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); margin-bottom: 22px;
      }
      #t1-sec-bracket .headline {
        font-weight: var(--wt-black); font-size: 116px; line-height: 0.98; letter-spacing: var(--track-tight);
      }
      #t1-sec-bracket .headline em { font-style: italic; font-weight: var(--wt-thin); }
      #t1-sec-bracket .underline { margin: 26px auto 0; width: 0; height: 8px; background: var(--yellow); }
      #t1-sec-bracket .source {
        position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-sec-bracket" data-composition-id="t1-sec-bracket" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="wrap">
        <div class="br bl">[</div>
        <div class="center">
          <div class="kicker" data-slot="kicker">IN CONTEXT</div>
          <div class="headline" data-slot="headline">What we <em>missed</em></div>
          <div class="underline"></div>
        </div>
        <div class="br brk">]</div>
      </div>
      <div class="source" data-slot="source">A VOX EXPLAINER</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-bracket .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 150px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-bracket .bl", { autoAlpha: 0, x: 60, duration: 0.42, ease: "back.out(1.6)" }, 0.2)
        .from("#t1-sec-bracket .brk", { autoAlpha: 0, x: -60, duration: 0.42, ease: "back.out(1.6)" }, 0.2)
        .from("#t1-sec-bracket .kicker", { autoAlpha: 0, y: -12, duration: 0.28, ease: "steps(4)" }, 0.5)
        .from("#t1-sec-bracket .headline", { autoAlpha: 0, y: 20, duration: 0.45, ease: "power3.out" }, 0.6)
        .to("#t1-sec-bracket .underline", { width: 360, duration: 0.5, ease: "power2.out" }, 0.9)
        .from("#t1-sec-bracket .source", { autoAlpha: 0, duration: 0.3 }, 1.1)
        .set({}, {}, 6);
      window.__timelines["t1-sec-bracket"] = tl;
    </script>
  </body>
</html>
