<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · BRACKETED NUMBER
  The stat centered inside GIANT editorial square brackets [ 73% ]. The two bracket
  characters are rendered as separate absolutely-positioned elements that slide in
  from off-screen (left bracket from left, right bracket from right). A thin yellow
  rule sits under the number. Number clip-reveals after brackets land.
  Distinct from callout: no rules above/below number — brackets ARE the frame.
  Slots: kicker, stat, label (richtext <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-bracket {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-bracket .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-bracket .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-bracket .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-bracket .kicker {
        position: absolute; left: 50%; top: 148px; transform: translateX(-50%);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red); white-space: nowrap;
      }
      /* bracket lockup — centered on canvas */
      #t1-stat-bracket .lockup {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%);
        display: flex; align-items: center; gap: 0;
      }
      #t1-stat-bracket .bracket {
        font-weight: var(--wt-black); font-size: 440px; line-height: 0.88;
        color: var(--ink); font-family: var(--font-display);
        /* slightly condensed bracket characters feel more editorial */
        letter-spacing: -0.06em;
      }
      #t1-stat-bracket .bracket.left  { margin-right: 20px; }
      #t1-stat-bracket .bracket.right { margin-left: 20px; }
      /* inner number */
      #t1-stat-bracket .inner {
        text-align: center; position: relative;
      }
      #t1-stat-bracket .stat {
        display: block; font-weight: var(--wt-black); font-size: 340px;
        line-height: 0.9; letter-spacing: -0.04em; color: var(--ink);
        font-variant-numeric: tabular-nums;
        clip-path: inset(0 0 0 0);
      }
      #t1-stat-bracket .yellow-rule {
        height: 7px; background: var(--yellow);
        width: 100%; margin-top: 10px;
        transform: scaleX(0); transform-origin: center;
      }
      /* label below */
      #t1-stat-bracket .label {
        position: absolute; left: 50%; bottom: 192px; transform: translateX(-50%);
        width: 1300px; text-align: center;
        font-weight: var(--wt-thin); font-size: 58px; line-height: 1.1;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-bracket .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-bracket .source {
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        white-space: nowrap;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-bracket" data-composition-id="t1-stat-bracket" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">THE RETENTION CLIFF</div>
      <div class="lockup">
        <span class="bracket left">[</span>
        <div class="inner">
          <span class="stat" data-slot="stat">73%</span>
          <div class="yellow-rule"></div>
        </div>
        <span class="bracket right">]</span>
      </div>
      <div class="label" data-slot="label">of viewers <em>drop off</em> before the two-minute mark</div>
      <div class="source" data-slot="source">SOURCE · PLATFORM ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-bracket .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-bracket .kicker", { autoAlpha: 0, y: -14, duration: 0.3, ease: "steps(4)" }, 0.2)
        /* brackets slide in simultaneously from opposite sides */
        .from("#t1-stat-bracket .bracket.left",  { x: -340, autoAlpha: 0, duration: 0.42, ease: "power3.out" }, 0.35)
        .from("#t1-stat-bracket .bracket.right", { x:  340, autoAlpha: 0, duration: 0.42, ease: "power3.out" }, 0.35)
        /* number snaps in after brackets land */
        .from("#t1-stat-bracket .stat", { autoAlpha: 0, scale: 0.65, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.2)" }, 0.72)
        .to("#t1-stat-bracket .yellow-rule", { scaleX: 1, duration: 0.3, ease: "steps(5)" }, 1.02)
        .from("#t1-stat-bracket .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.15)
        .from("#t1-stat-bracket .source", { autoAlpha: 0, duration: 0.3 }, 1.4)
        .set({}, {}, 6);
      window.__timelines["t1-stat-bracket"] = tl;
    </script>
  </body>
</html>
