<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · LINEAR METER w/ SCALE
  A horizontal meter with MIN and MAX labels at the ends + tick marks along it,
  and a notch/marker block sitting at the value position with the big number in
  a callout above the notch; the filled portion up to the notch is yellow.
  Distinct from the plain bar: labeled scale + positioned notch + callout.
  Slots: kicker, stat, minLabel, maxLabel, label (richtext <em>), source.
  Knob: data-pct on .track (0..100, default 73) sets notch position + fill.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-meter {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-meter .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-meter .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-meter .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-meter .kicker {
        position: absolute; left: 130px; top: 200px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* ---- scale: min/max labels ---- */
      #t1-stat-meter .scale-labels {
        position: absolute; left: 130px; right: 130px; top: 640px;
        display: flex; justify-content: space-between;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      /* ---- tick strip ---- */
      #t1-stat-meter .ticks {
        position: absolute; left: 130px; right: 130px; top: 605px; height: 30px;
        background-image: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 10%);
        opacity: 0.28;
      }
      /* ---- track ---- */
      #t1-stat-meter .track {
        position: absolute; left: 130px; right: 130px; top: 480px; height: 120px;
        background: var(--paper-2); box-shadow: inset 0 0 0 4px var(--ink);
      }
      #t1-stat-meter .fill {
        position: absolute; inset: 0; width: 73%;
        background: var(--yellow); transform: scaleX(0); transform-origin: left center;
      }
      /* ---- notch (the vertical marker block) ---- */
      #t1-stat-meter .notch-wrap {
        position: absolute; top: 0; bottom: 0; width: 0; left: 73%;
      }
      #t1-stat-meter .notch {
        position: absolute; top: -10px; bottom: -10px; left: -18px; width: 36px;
        background: var(--ink); z-index: 4;
      }
      /* ---- callout box above notch ---- */
      #t1-stat-meter .callout {
        position: absolute; top: -230px; left: 50%; transform: translateX(-50%);
        background: var(--ink); color: var(--yellow);
        padding: 18px 32px 14px;
        font-weight: var(--wt-black); font-size: 110px;
        font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
        z-index: 4;
      }
      /* stem connecting callout to notch */
      #t1-stat-meter .callout::after {
        content: "";
        position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
        width: 8px; height: 28px; background: var(--ink);
      }
      /* ---- label + source ---- */
      #t1-stat-meter .label {
        position: absolute; left: 130px; right: 130px; top: 720px;
        font-weight: var(--wt-thin); font-size: 58px; line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-meter .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-meter .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-meter" data-composition-id="t1-stat-meter" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">CONFIDENCE LEVEL</div>
      <div class="track" data-pct="73">
        <div class="fill"></div>
        <div class="notch-wrap">
          <div class="notch">
            <div class="callout" data-slot="stat">73%</div>
          </div>
        </div>
      </div>
      <div class="ticks"></div>
      <div class="scale-labels">
        <span data-slot="minLabel">0%</span>
        <span data-slot="maxLabel">100%</span>
      </div>
      <div class="label" data-slot="label">respondents rated the claim as <em>highly credible</em></div>
      <div class="source" data-slot="source">SOURCE · TRUST INDEX 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const track = document.querySelector("#t1-stat-meter .track");
      const pct = Math.max(0, Math.min(100, parseFloat(track.getAttribute("data-pct")) || 73));
      const fill = track.querySelector(".fill");
      const notchWrap = track.querySelector(".notch-wrap");
      fill.style.width = pct + "%";
      notchWrap.style.left = pct + "%";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-meter .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-meter .kicker",       { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-meter .track",         { autoAlpha: 0, y: 24, duration: 0.3, ease: "power2.out" }, 0.3)
        .from("#t1-stat-meter .ticks",         { autoAlpha: 0, duration: 0.25 }, 0.38)
        .from("#t1-stat-meter .scale-labels",  { autoAlpha: 0, duration: 0.25 }, 0.4)
        .to("#t1-stat-meter .fill",            { scaleX: 1, duration: 0.65, ease: "steps(8)" }, 0.5)
        .from("#t1-stat-meter .notch",         { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 100%", duration: 0.3, ease: "back.out(2.2)" }, 1.0)
        .from("#t1-stat-meter .callout",       { autoAlpha: 0, y: 20, duration: 0.35, ease: "back.out(2.4)" }, 1.1)
        .from("#t1-stat-meter .label",         { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.3)
        .from("#t1-stat-meter .source",        { autoAlpha: 0, duration: 0.3 }, 1.55)
        .set({}, {}, 6);
      window.__timelines["t1-stat-meter"] = tl;
    </script>
  </body>
</html>
