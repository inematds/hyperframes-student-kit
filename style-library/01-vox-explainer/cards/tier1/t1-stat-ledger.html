<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · LEDGER
  An accounting ledger: ruled rows on kraft paper, a column of line items, and
  one HERO row whose value cell wipes yellow. The stat is the bottom-line total.
  Slots: kicker (ledger title), row1l/row1v, row2l/row2v (faint context rows),
         heroLabel, stat (hero value), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-ledger {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper-2); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-ledger .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.46; pointer-events: none; z-index: 6;
      }
      #t1-stat-ledger .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.2) 100%);
      }
      #t1-stat-ledger .book {
        position: absolute; left: 160px; right: 160px; top: 170px; bottom: 170px;
        background: var(--paper);
        box-shadow: 0 26px 50px rgba(23,19,14,0.28); padding: 0 70px;
        /* the red left margin rule of a ledger */
        border-left: 5px solid var(--red);
      }
      #t1-stat-ledger .title {
        position: absolute; left: 70px; top: 36px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      #t1-stat-ledger .rows { position: absolute; left: 70px; right: 70px; top: 150px; }
      #t1-stat-ledger .row {
        display: flex; align-items: baseline; justify-content: space-between;
        border-bottom: 2px solid rgba(23,19,14,0.16); padding: 22px 0;
      }
      #t1-stat-ledger .row .l {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 40px; letter-spacing: 0.02em; color: var(--muted);
      }
      #t1-stat-ledger .row .v {
        font-weight: var(--wt-bold); font-size: 56px; color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #t1-stat-ledger .row.hero { border-bottom: 5px solid var(--ink); padding-top: 40px; }
      #t1-stat-ledger .row.hero .l { color: var(--ink); font-size: 48px; }
      #t1-stat-ledger .row.hero .v {
        position: relative; font-weight: var(--wt-black); font-size: 150px;
        color: var(--ink); line-height: 1; padding: 0 16px;
      }
      #t1-stat-ledger .row.hero .v .cell {
        position: absolute; inset: 6px -6px; background: var(--yellow); z-index: -1;
        transform: scaleX(0); transform-origin: right center;
      }
      #t1-stat-ledger .source {
        position: absolute; left: 70px; bottom: 32px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-ledger" data-composition-id="t1-stat-ledger" data-start="0" data-width="1920" data-height="1080">
      <div class="book">
        <div class="title" data-slot="kicker">THE TIME LEDGER</div>
        <div class="rows">
          <div class="row"><span class="l" data-slot="row1l">Shooting</span><span class="v" data-slot="row1v">2 hrs</span></div>
          <div class="row"><span class="l" data-slot="row2l">Editing, by hand</span><span class="v" data-slot="row2v">9 hrs</span></div>
          <div class="row hero">
            <span class="l" data-slot="heroLabel">Total, per video</span>
            <span class="v"><span class="cell"></span><span data-slot="stat">11 hrs</span></span>
          </div>
        </div>
        <div class="source" data-slot="source">SOURCE · CREATOR SURVEY 2026</div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-ledger .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-ledger .book", { autoAlpha: 0, y: 30, duration: 0.4, ease: "power2.out" }, 0.1)
        .from("#t1-stat-ledger .title", { autoAlpha: 0, x: -16, duration: 0.3, ease: "steps(4)" }, 0.25)
        .from("#t1-stat-ledger .row", { autoAlpha: 0, x: -24, duration: 0.32, ease: "power2.out", stagger: 0.16 }, 0.4)
        .to("#t1-stat-ledger .row.hero .v .cell", { scaleX: 1, duration: 0.34, ease: "steps(5)" }, 1.05)
        .from("#t1-stat-ledger .row.hero .v", { scale: 0.8, transformOrigin: "right center", duration: 0.3, ease: "back.out(2.2)" }, 1.1)
        .from("#t1-stat-ledger .source", { autoAlpha: 0, duration: 0.3 }, 1.4)
        .set({}, {}, 6);
      window.__timelines["t1-stat-ledger"] = tl;
    </script>
  </body>
</html>
