<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · PULL-QUOTE STAT
  An oversized opening quotation mark (yellow, Fraunces, top-left) anchors the
  card. The stat reads as the pulled figure of a pull-quote — large, italic — with
  a supporting richtext line below and an attribution kicker under a short rule.
  Quote mark pops in with back.out overshoot; figure clip-reveals left-to-right.
  Slots: kicker (attribution), stat, label (richtext, the quote line), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-quote {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-quote .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-quote .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-quote .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      /* oversized quotation mark */
      #t1-stat-quote .quote-mark {
        position: absolute; left: 100px; top: 60px;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 480px; line-height: 1; color: var(--yellow);
        user-select: none; pointer-events: none;
      }
      /* main content block, left-aligned with generous gutter */
      #t1-stat-quote .body {
        position: absolute; left: 180px; right: 130px; top: 290px;
      }
      #t1-stat-quote .stat {
        font-weight: var(--wt-black); font-style: italic;
        font-size: 260px; line-height: 0.9; letter-spacing: -0.04em;
        color: var(--ink); font-variant-numeric: tabular-nums;
        clip-path: inset(0 100% 0 0); /* revealed by GSAP */
      }
      #t1-stat-quote .label {
        margin-top: 36px; font-weight: var(--wt-thin); font-style: italic;
        font-size: 64px; line-height: 1.1; letter-spacing: var(--track-tight);
        color: var(--ink); max-width: 1300px;
      }
      #t1-stat-quote .label em { font-style: normal; font-weight: var(--wt-black); }
      /* attribution row — short ink rule then kicker text */
      #t1-stat-quote .attr {
        position: absolute; left: 180px; bottom: 140px;
        display: flex; align-items: center; gap: 28px;
      }
      #t1-stat-quote .attr-rule {
        width: 80px; height: 4px; background: var(--ink);
        transform: scaleX(0); transform-origin: left center;
      }
      #t1-stat-quote .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-quote .source {
        position: absolute; left: 180px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-quote" data-composition-id="t1-stat-quote" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="quote-mark">&ldquo;</div>
      <div class="body">
        <div class="stat" data-slot="stat">4 hours</div>
        <div class="label" data-slot="label">of daily screen time is <em>passively consumed</em> without intent</div>
      </div>
      <div class="attr">
        <div class="attr-rule"></div>
        <div class="kicker" data-slot="kicker">DIGITAL WELLBEING REPORT 2026</div>
      </div>
      <div class="source" data-slot="source">SOURCE · JOURNAL OF MEDIA RESEARCH</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-quote .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-quote .quote-mark", { autoAlpha: 0, scale: 0.4, transformOrigin: "0% 0%", duration: 0.45, ease: "back.out(2.2)" }, 0.1)
        .to("#t1-stat-quote .stat", { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "steps(7)" }, 0.42)
        .from("#t1-stat-quote .label", { autoAlpha: 0, y: 22, duration: 0.4, ease: "power3.out" }, 0.9)
        .to("#t1-stat-quote .attr-rule", { scaleX: 1, duration: 0.28, ease: "steps(4)" }, 1.15)
        .from("#t1-stat-quote .kicker", { autoAlpha: 0, x: -16, duration: 0.3, ease: "steps(4)" }, 1.3)
        .from("#t1-stat-quote .source", { autoAlpha: 0, duration: 0.3 }, 1.5)
        .set({}, {}, 6);
      window.__timelines["t1-stat-quote"] = tl;
    </script>
  </body>
</html>
