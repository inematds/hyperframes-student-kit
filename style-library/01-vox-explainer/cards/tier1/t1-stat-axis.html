<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · NUMBER-LINE / TIMELINE POINT
  A horizontal axis with labeled ticks at the ends (start + end), and a single
  highlighted POINT marker at the value position with the big number in a callout
  above it connected by a short STATIC STEM line (not an arrow). The axis draws
  in (scaleX), the point pops in with back.out. Fully functional data-viz.
  Slots: kicker, stat, axisStart, axisEnd, pointLabel, label (richtext), source.
  Knob: data-pos on .axis-track (0..1, default 0.62) sets point position.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-axis {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-axis .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-axis .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-axis .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-axis .kicker {
        position: absolute; left: 130px; top: 180px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* ---- axis track container ---- */
      #t1-stat-axis .axis-track {
        position: absolute; left: 130px; right: 130px; top: 540px; height: 10px;
        background: var(--ink); transform: scaleX(0); transform-origin: left center;
      }
      /* end-cap ticks */
      #t1-stat-axis .axis-track::before,
      #t1-stat-axis .axis-track::after {
        content: ""; position: absolute; top: -30px;
        width: 8px; height: 70px; background: var(--ink);
      }
      #t1-stat-axis .axis-track::before { left: 0; }
      #t1-stat-axis .axis-track::after  { right: 0; }
      /* ---- end-point labels ---- */
      #t1-stat-axis .axis-start-label,
      #t1-stat-axis .axis-end-label {
        position: absolute; top: 600px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      #t1-stat-axis .axis-start-label { left: 130px; }
      #t1-stat-axis .axis-end-label   { right: 130px; text-align: right; }
      /* ---- point + callout group — positioned by JS ---- */
      #t1-stat-axis .point-group {
        position: absolute; top: 440px;
        transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center;
        z-index: 3;
      }
      #t1-stat-axis .callout-box {
        background: var(--yellow); color: var(--ink);
        padding: 14px 30px 10px;
        box-shadow: inset 0 0 0 5px var(--ink);
      }
      #t1-stat-axis .callout-box .stat {
        font-weight: var(--wt-black); font-size: 120px;
        font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
        display: block;
      }
      #t1-stat-axis .callout-box .point-label {
        display: block;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
        text-align: center; margin-top: 4px;
      }
      /* short static stem below the callout box */
      #t1-stat-axis .stem {
        width: 8px; height: 40px; background: var(--ink);
        flex-shrink: 0;
      }
      /* the dot marker on the axis */
      #t1-stat-axis .dot-marker {
        width: 32px; height: 32px; border-radius: 50%;
        background: var(--yellow); box-shadow: inset 0 0 0 5px var(--ink);
        flex-shrink: 0;
        margin-top: -16px; /* overlap with axis line */
      }
      /* ---- label + source ---- */
      #t1-stat-axis .label {
        position: absolute; left: 130px; right: 130px; top: 700px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-axis .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-axis .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-axis" data-composition-id="t1-stat-axis" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">ADOPTION TIMELINE</div>
      <div class="axis-track" data-pos="0.62" id="axis-track"></div>
      <div class="axis-start-label" data-slot="axisStart">2018</div>
      <div class="axis-end-label"   data-slot="axisEnd">2030</div>
      <div class="point-group" id="point-group">
        <div class="callout-box">
          <span class="stat" data-slot="stat">2026</span>
          <span class="point-label" data-slot="pointLabel">NOW</span>
        </div>
        <div class="stem"></div>
        <div class="dot-marker"></div>
      </div>
      <div class="label" data-slot="label">we're at <em>peak acceleration</em> — halfway through</div>
      <div class="source" data-slot="source">SOURCE · TRENDS REPORT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Position the point group on the axis
      const axisTrack = document.getElementById("axis-track");
      const pos = Math.max(0, Math.min(1, parseFloat(axisTrack.getAttribute("data-pos")) || 0.62));
      // axis spans from left:130px to right:130px → usable width = 1920 - 260 = 1660px
      const AXIS_LEFT = 130;
      const AXIS_WIDTH = 1920 - 260;
      const pointGroup = document.getElementById("point-group");
      pointGroup.style.left = (AXIS_LEFT + pos * AXIS_WIDTH) + "px";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-axis .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-axis .kicker",           { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .to("#t1-stat-axis .axis-track",          { scaleX: 1, duration: 0.55, ease: "steps(8)" }, 0.35)
        .from("#t1-stat-axis .axis-start-label",  { autoAlpha: 0, duration: 0.25 }, 0.7)
        .from("#t1-stat-axis .axis-end-label",    { autoAlpha: 0, duration: 0.25 }, 0.75)
        .from("#t1-stat-axis .point-group",       { autoAlpha: 0, y: -24, scale: 0.7, transformOrigin: "50% 100%", duration: 0.4, ease: "back.out(2.4)" }, 0.9)
        .from("#t1-stat-axis .label",             { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.2)
        .from("#t1-stat-axis .source",            { autoAlpha: 0, duration: 0.3 }, 1.5)
        .set({}, {}, 6);
      window.__timelines["t1-stat-axis"] = tl;
    </script>
  </body>
</html>
