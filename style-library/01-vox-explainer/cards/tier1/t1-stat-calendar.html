<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · CALENDAR DAY
  A tear-off desk calendar: RED header band (month/label), two binding rings
  at the top, big number as the day/figure on the white page below. Frames
  time-based stats. Page drops/flips in via a perspective scale + y translate.
  Slots: kicker (month band text), stat (the number), label (richtext <em>),
         source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-cal {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-cal .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-cal .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-stat-cal .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-cal .kicker {
        position: absolute; left: 130px; top: 260px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      /* calendar block centered on canvas */
      #t1-stat-cal .cal-wrap {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        perspective: 1200px;
      }
      #t1-stat-cal .cal {
        width: 580px;
        box-shadow: 8px 20px 60px rgba(23,19,14,0.34);
        border-radius: 8px; overflow: hidden;
        background: var(--paper);
        transform-origin: top center;
      }
      /* binding rings row — two rings at top of calendar */
      #t1-stat-cal .rings {
        position: relative; height: 44px;
        background: var(--paper-2);
        display: flex; align-items: center; justify-content: space-around;
        padding: 0 80px; z-index: 2;
        /* top horizontal bar of the binder */
        border-bottom: 3px solid rgba(23,19,14,0.25);
      }
      #t1-stat-cal .ring {
        width: 48px; height: 48px;
        border-radius: 50%;
        border: 7px solid var(--ink);
        background: var(--paper);
        margin-top: -14px;   /* straddle the top edge */
        box-shadow: 0 2px 8px rgba(23,19,14,0.22);
      }
      /* red header band */
      #t1-stat-cal .header {
        background: var(--red); color: var(--paper);
        padding: 22px 48px 26px;
        text-align: center;
      }
      #t1-stat-cal .month {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 44px; letter-spacing: 0.22em;
        text-transform: uppercase; line-height: 1;
      }
      #t1-stat-cal .day-label {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 22px; letter-spacing: 0.14em;
        text-transform: uppercase; opacity: 0.8; margin-top: 6px;
      }
      /* white page body */
      #t1-stat-cal .page {
        background: #fff;
        padding: 24px 48px 40px;
        display: flex; flex-direction: column;
        align-items: center;
        border-top: 4px solid var(--red);
      }
      /* tiny ruled lines for texture */
      #t1-stat-cal .page-rules {
        position: absolute; inset: 140px 0 0 0;
        background-image: repeating-linear-gradient(
          0deg, transparent 0, transparent 70px,
          rgba(23,19,14,0.06) 70px, rgba(23,19,14,0.06) 72px
        );
        pointer-events: none;
      }
      #t1-stat-cal .cal-stat {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 280px; line-height: 0.88; color: var(--ink);
        font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
        text-align: center; position: relative; z-index: 2;
      }
      #t1-stat-cal .cal-sub {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--muted); margin-top: 10px; text-align: center;
        position: relative; z-index: 2;
      }
      /* tear edge at bottom — jagged paper clip-path */
      #t1-stat-cal .page::after {
        content: "";
        display: block; width: calc(100% + 96px); height: 18px;
        margin: 20px -48px -40px;
        background: var(--paper);
        clip-path: polygon(
          0% 100%, 2% 30%, 4% 100%, 6% 20%, 8% 100%, 10% 35%,
          12% 100%, 14% 25%, 16% 100%, 18% 40%, 20% 100%, 22% 20%,
          24% 100%, 26% 35%, 28% 100%, 30% 15%, 32% 100%, 34% 30%,
          36% 100%, 38% 25%, 40% 100%, 42% 40%, 44% 100%, 46% 20%,
          48% 100%, 50% 30%, 52% 100%, 54% 25%, 56% 100%, 58% 35%,
          60% 100%, 62% 15%, 64% 100%, 66% 30%, 68% 100%, 70% 20%,
          72% 100%, 74% 40%, 76% 100%, 78% 25%, 80% 100%, 82% 35%,
          84% 100%, 86% 20%, 88% 100%, 90% 30%, 92% 100%, 94% 25%,
          96% 100%, 98% 35%, 100% 100%
        );
      }
      /* label and source below the calendar */
      #t1-stat-cal .label {
        position: absolute; left: 130px; right: 130px; bottom: 220px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.1;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-cal .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-cal .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-cal" data-composition-id="t1-stat-cal" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">TIME TO RESULT</div>

      <div class="cal-wrap">
        <div class="cal">
          <div class="rings">
            <div class="ring"></div>
            <div class="ring"></div>
          </div>
          <div class="header">
            <div class="month" data-slot="kicker-month">DAYS</div>
            <div class="day-label">average turnaround</div>
          </div>
          <div class="page">
            <div class="page-rules"></div>
            <div class="cal-stat" data-slot="stat">21</div>
            <div class="cal-sub">days from draft to publish</div>
          </div>
        </div>
      </div>

      <div class="label" data-slot="label">editors spend <em>three weeks</em> on a single video, on average</div>
      <div class="source" data-slot="source">SOURCE · CREATOR BENCHMARK 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Grain flicker
      tl.fromTo("#t1-stat-cal .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      // Kicker
      tl.from("#t1-stat-cal .kicker", { autoAlpha: 0, x: -20, duration: 0.28, ease: "steps(4)" }, 0.15)
        // Rings drop in first (the binding is "always there")
        .from("#t1-stat-cal .cal", {
          autoAlpha: 0,
          rotationX: -75,
          transformOrigin: "top center",
          duration: 0.42, ease: "steps(6)"
        }, 0.3)
        // Settle into place
        .to("#t1-stat-cal .cal", {
          rotationX: 0,
          duration: 0.26, ease: "back.out(1.8)"
        }, 0.72)
        // Month header band wipes in
        .from("#t1-stat-cal .header", {
          autoAlpha: 0, scaleY: 0,
          transformOrigin: "top center",
          duration: 0.22, ease: "power2.out"
        }, 0.82)
        // Big stat number drops onto the page
        .from("#t1-stat-cal .cal-stat", {
          autoAlpha: 0, y: -40, scale: 0.7,
          transformOrigin: "50% 50%",
          duration: 0.34, ease: "back.out(2.2)"
        }, 0.96)
        .from("#t1-stat-cal .cal-sub", { autoAlpha: 0, duration: 0.22, ease: "steps(3)" }, 1.2)
        .from("#t1-stat-cal .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.32)
        .from("#t1-stat-cal .source", { autoAlpha: 0, duration: 0.28 }, 1.58)
        .set({}, {}, 6);
      window.__timelines["t1-stat-cal"] = tl;
    </script>
  </body>
</html>
