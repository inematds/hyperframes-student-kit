<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · GIANT-LEFT
  Huge numeral flush-left, bleeding off the bottom-left edge. Label stacked in a
  right column. No circle — the scale of the number IS the eye-magnet; one yellow
  slab under the unit anchors the accent.
  Slots: kicker, stat (the number), unit (small trailing unit, e.g. %), label (richtext, <em> emphasis), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-left {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-left .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-left .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-left .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 30% 60%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-left .kicker {
        position: absolute; left: 120px; top: 150px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-left .numwrap {
        position: absolute; left: -40px; bottom: -120px; z-index: 2;
        display: flex; align-items: flex-end;
      }
      #t1-stat-left .stat {
        font-weight: var(--wt-black); font-size: 760px; line-height: 0.74;
        letter-spacing: -0.05em; color: var(--ink); font-variant-numeric: tabular-nums;
      }
      #t1-stat-left .unit {
        position: relative; font-weight: var(--wt-black); font-size: 200px; line-height: 1;
        margin: 0 0 120px 8px; color: var(--ink);
      }
      #t1-stat-left .unit .slab {
        position: absolute; left: -6px; right: -10px; bottom: 22px; height: 60px;
        background: var(--yellow); z-index: -1; transform: scaleX(0); transform-origin: left center;
      }
      #t1-stat-left .label {
        position: absolute; right: 120px; top: 50%; transform: translateY(-50%);
        width: 620px; z-index: 4; text-align: left;
        font-weight: var(--wt-thin); font-size: 64px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-left .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-left .rule {
        position: absolute; right: 120px; top: calc(50% - 150px); width: 620px; height: 5px;
        background: var(--ink); transform: scaleX(0); transform-origin: right center; z-index: 4;
      }
      #t1-stat-left .source {
        position: absolute; right: 120px; bottom: 96px; z-index: 4; text-align: right;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-left" data-composition-id="t1-stat-left" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">BY THE NUMBERS</div>
      <div class="numwrap">
        <div class="stat" data-slot="stat">9</div>
        <div class="unit"><span class="slab"></span><span data-slot="unit">out of 10</span></div>
      </div>
      <div class="rule"></div>
      <div class="label" data-slot="label">creators never finish their <em>second video</em></div>
      <div class="source" data-slot="source">SOURCE · ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-left .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-left .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.15)
        .from("#t1-stat-left .stat", { autoAlpha: 0, y: 120, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.3)
        .from("#t1-stat-left .unit", { autoAlpha: 0, y: 40, duration: 0.35, ease: "back.out(2)" }, 0.6)
        .to("#t1-stat-left .unit .slab", { scaleX: 1, duration: 0.32, ease: "steps(4)" }, 0.78)
        .to("#t1-stat-left .rule", { scaleX: 1, duration: 0.35, ease: "steps(5)" }, 0.7)
        .from("#t1-stat-left .label", { autoAlpha: 0, x: 30, duration: 0.45, ease: "power3.out" }, 0.85)
        .from("#t1-stat-left .source", { autoAlpha: 0, duration: 0.3 }, 1.15)
        .set({}, {}, 6);
      window.__timelines["t1-stat-left"] = tl;
    </script>
  </body>
</html>
