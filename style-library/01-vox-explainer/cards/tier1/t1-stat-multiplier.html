<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · MULTIPLIER
  A huge "N×" lockup where the "×" is set in yellow to separate the magnitude from
  the unit. A small "1×" baseline reference is set below-right in a paper-2 chip,
  communicating "N times more than this". Caption label below the number.
  Big number pops in with back.out; baseline reference fades in after.
  Slots: kicker, stat (the multiplier, e.g. 12), baselineLabel (e.g. "vs editing by hand"),
         label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-mult {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-mult .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-mult .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-mult .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 42% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-mult .kicker {
        position: absolute; left: 140px; top: 172px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* left column: main stat + baseline chip */
      #t1-stat-mult .col-left {
        position: absolute; left: 140px; top: 50%; transform: translateY(-54%);
      }
      #t1-stat-mult .lockup {
        display: flex; align-items: baseline; line-height: 0.88;
      }
      #t1-stat-mult .stat {
        font-weight: var(--wt-black); font-size: 420px;
        letter-spacing: -0.04em; color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #t1-stat-mult .times {
        font-weight: var(--wt-black); font-size: 420px;
        letter-spacing: -0.04em; color: var(--yellow);
        font-variant-numeric: tabular-nums;
      }
      /* baseline reference chip */
      #t1-stat-mult .baseline-row {
        display: flex; align-items: center; gap: 18px; margin-top: 32px;
      }
      #t1-stat-mult .baseline-chip {
        background: var(--paper-2); border: 3px solid var(--ink);
        padding: 6px 22px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 34px; letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
        display: flex; align-items: baseline; gap: 8px;
      }
      #t1-stat-mult .baseline-chip .one { font-size: 44px; font-family: var(--font-display); font-weight: var(--wt-black); }
      #t1-stat-mult .baseline-chip .bx  { font-size: 44px; font-family: var(--font-display); font-weight: var(--wt-black); color: var(--muted); }
      #t1-stat-mult .baseline-label {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 30px; letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      /* right column: richtext label */
      #t1-stat-mult .label {
        position: absolute; right: 130px; top: 50%; transform: translateY(-50%);
        width: 680px; font-weight: var(--wt-thin); font-size: 60px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-mult .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-mult .source {
        position: absolute; right: 130px; bottom: 96px; text-align: right;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-mult" data-composition-id="t1-stat-mult" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">SPEED GAIN</div>
      <div class="col-left">
        <div class="lockup">
          <span class="stat" data-slot="stat">12</span><span class="times">&times;</span>
        </div>
        <div class="baseline-row">
          <div class="baseline-chip">
            <span class="one">1</span><span class="bx">&times;</span>
          </div>
          <div class="baseline-label" data-slot="baselineLabel">vs editing by hand</div>
        </div>
      </div>
      <div class="label" data-slot="label">faster than a human editor on a <em>first-pass cut</em></div>
      <div class="source" data-slot="source">SOURCE · INTERNAL BENCHMARK 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-mult .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-mult .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        /* number + × pop together */
        .from("#t1-stat-mult .stat",  { autoAlpha: 0, scale: 0.55, transformOrigin: "0% 50%", duration: 0.48, ease: "back.out(2.2)" }, 0.38)
        .from("#t1-stat-mult .times", { autoAlpha: 0, scale: 0.55, transformOrigin: "0% 50%", duration: 0.48, ease: "back.out(2.2)" }, 0.44)
        /* baseline chip fades in after */
        .from("#t1-stat-mult .baseline-chip",  { autoAlpha: 0, x: -18, duration: 0.35, ease: "power2.out" }, 0.92)
        .from("#t1-stat-mult .baseline-label", { autoAlpha: 0, x: -12, duration: 0.3, ease: "power2.out" }, 1.05)
        .from("#t1-stat-mult .label", { autoAlpha: 0, x: 28, duration: 0.45, ease: "power3.out" }, 0.78)
        .from("#t1-stat-mult .source", { autoAlpha: 0, duration: 0.3 }, 1.3)
        .set({}, {}, 6);
      window.__timelines["t1-stat-mult"] = tl;
    </script>
  </body>
</html>
