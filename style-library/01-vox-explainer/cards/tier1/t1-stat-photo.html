<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · OVER-PHOTO
  Number huge over a full-bleed halftone archive photo, with an ink scrim so the
  type reads. The photo slowly pushes (ken-burns). One yellow marker word in the
  label. No circle.
  Slots: kicker, stat, label (richtext, <em> = yellow marker), photo (image), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-photo {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--ink); color: var(--paper);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-photo .stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #t1-stat-photo .photo {
        position: absolute; inset: 0;
        /* halftone placeholder until a real image is dropped in */
        background-image: var(--tex-halftone); background-size: var(--tex-halftone-size);
        background-color: #7d756a; background-blend-mode: multiply;
      }
      #t1-stat-photo .scrim {
        position: absolute; inset: 0; z-index: 2;
        background: linear-gradient(180deg, rgba(23,19,14,0.30) 0%, rgba(23,19,14,0.10) 40%, rgba(23,19,14,0.74) 100%);
      }
      #t1-stat-photo .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: overlay; opacity: 0.5; pointer-events: none; z-index: 6;
      }
      #t1-stat-photo .kicker {
        position: absolute; left: 130px; top: 150px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--yellow);
      }
      #t1-stat-photo .stat {
        position: absolute; left: 120px; top: 38%; transform: translateY(-50%); z-index: 4;
        font-weight: var(--wt-black); font-size: 480px; line-height: 0.8;
        letter-spacing: -0.05em; color: var(--paper); font-variant-numeric: tabular-nums;
        text-shadow: 0 14px 40px rgba(0,0,0,0.45);
      }
      #t1-stat-photo .label {
        position: absolute; left: 130px; right: 130px; bottom: 170px; z-index: 4;
        font-weight: var(--wt-thin); font-size: 70px; line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--paper);
      }
      #t1-stat-photo .label em {
        font-style: normal; font-weight: var(--wt-black); color: var(--ink);
        background: var(--yellow); padding: 0 14px;
        box-decoration-break: clone; -webkit-box-decoration-break: clone;
      }
      #t1-stat-photo .source {
        position: absolute; left: 130px; bottom: 96px; z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: rgba(239,233,220,0.7);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-photo" data-composition-id="t1-stat-photo" data-start="0" data-width="1920" data-height="1080">
      <div class="stage">
        <div class="photo" data-slot="photo"></div>
      </div>
      <div class="scrim"></div>
      <div class="kicker" data-slot="kicker">THE REALITY</div>
      <div class="stat" data-slot="stat">2.4M</div>
      <div class="label" data-slot="label">people watched before a single <em>human edit</em></div>
      <div class="source" data-slot="source">ARCHIVE · 1974</div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-photo .stage", { scale: 1.0 }, { scale: 1.08, duration: 6, ease: "none" }, 0);
      tl.fromTo("#t1-stat-photo .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-photo .photo", { autoAlpha: 0, duration: 0.5 }, 0)
        .from("#t1-stat-photo .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.3)
        .from("#t1-stat-photo .stat", { autoAlpha: 0, y: 60, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.45)
        .from("#t1-stat-photo .label", { autoAlpha: 0, y: 24, duration: 0.45, ease: "power3.out" }, 0.85)
        .from("#t1-stat-photo .source", { autoAlpha: 0, duration: 0.3 }, 1.15);
      window.__timelines["t1-stat-photo"] = tl;
    </script>
  </body>
</html>
