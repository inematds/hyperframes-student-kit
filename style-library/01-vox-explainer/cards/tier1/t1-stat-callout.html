<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · CALLOUT (editorial pull-stat)
  The number set like a magazine pull-quote: centered between two heavy rules
  that draw outward, an oversized leading symbol, and an italic Fraunces caption.
  Restrained — type and rules only, one yellow underline on the unit. No circle.
  Slots: kicker, stat, unit (small trailing unit), label (richtext, <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-callout {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-callout .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-callout .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-callout .stack {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 1300px; text-align: center;
      }
      #t1-stat-callout .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red); margin-bottom: 30px;
      }
      #t1-stat-callout .rule { height: 6px; background: var(--ink); margin: 0 auto; transform: scaleX(0); }
      #t1-stat-callout .rule.top { transform-origin: center; width: 760px; }
      #t1-stat-callout .rule.bot { transform-origin: center; width: 760px; margin-top: 6px; }
      #t1-stat-callout .figure { padding: 40px 0; }
      #t1-stat-callout .stat {
        font-weight: var(--wt-black); font-size: 300px; line-height: 0.9;
        letter-spacing: -0.04em; color: var(--ink); font-variant-numeric: tabular-nums;
      }
      #t1-stat-callout .stat .u {
        position: relative; font-size: 110px; font-weight: var(--wt-black); margin-left: 10px;
      }
      #t1-stat-callout .stat .u .slab {
        position: absolute; left: -4px; right: -6px; bottom: 14px; height: 26px;
        background: var(--yellow); z-index: -1; transform: scaleX(0); transform-origin: left center;
      }
      #t1-stat-callout .label {
        margin-top: 28px; font-style: italic; font-weight: var(--wt-thin);
        font-size: 60px; line-height: 1.1; letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-callout .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-callout .source {
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-callout" data-composition-id="t1-stat-callout" data-start="0" data-width="1920" data-height="1080">
      <div class="stack">
        <div class="kicker" data-slot="kicker">WORTH SITTING WITH</div>
        <div class="rule top"></div>
        <div class="figure">
          <span class="stat"><span data-slot="stat">8</span><span class="u"><span class="slab"></span><span data-slot="unit">seconds</span></span></span>
        </div>
        <div class="rule bot"></div>
        <div class="label" data-slot="label">is all you get before they <em>scroll past</em></div>
      </div>
      <div class="source" data-slot="source">SOURCE · ATTENTION STUDY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-callout .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-callout .kicker", { autoAlpha: 0, y: -16, duration: 0.3, ease: "steps(4)" }, 0.2)
        .to("#t1-stat-callout .rule.top", { scaleX: 1, duration: 0.38, ease: "power3.out" }, 0.32)
        .from("#t1-stat-callout .stat", { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2.4)" }, 0.5)
        .to("#t1-stat-callout .stat .u .slab", { scaleX: 1, duration: 0.3, ease: "steps(4)" }, 0.9)
        .to("#t1-stat-callout .rule.bot", { scaleX: 1, duration: 0.38, ease: "power3.out" }, 0.7)
        .from("#t1-stat-callout .label", { autoAlpha: 0, y: 20, duration: 0.45, ease: "power3.out" }, 1.0)
        .from("#t1-stat-callout .source", { autoAlpha: 0, duration: 0.3 }, 1.3)
        .set({}, {}, 6);
      window.__timelines["t1-stat-callout"] = tl;
    </script>
  </body>
</html>
