<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · POSTAGE STAMP
  A perforated postage stamp: notch-dot perforated edge via repeating
  radial-gradient, halftone engraving fill behind the number, big denomination
  center, and a DIAGONAL-BARS cancellation postmark (NOT a circle — bands of
  parallel diagonal lines crossing the stamp). Stamp pops in with a scale snap.
  Slots: kicker, stat, country (small label), label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-postage {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-postage .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-postage .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-stat-postage .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-postage .kicker {
        position: absolute; left: 130px; top: 260px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* outer stamp container — positions stamp on canvas */
      #t1-stat-postage .stamp-outer {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%) rotate(2deg);
      }
      /* perforation border: a repeating radial-gradient creates notch dots
         on all four sides. We use a pseudo-element or background technique.
         Approach: outer div has var(--paper) bg + radial-gradient pattern,
         then an inset inner panel is the actual stamp face. */
      #t1-stat-postage .stamp-perf {
        width: 560px; height: 620px;
        background:
          /* top row of notch dots */
          radial-gradient(circle at center, var(--paper) 6px, transparent 6px)
            0px -6px / 22px 22px repeat-x,
          /* bottom row */
          radial-gradient(circle at center, var(--paper) 6px, transparent 6px)
            0px calc(100% + 6px) / 22px 22px repeat-x,
          /* left column */
          radial-gradient(circle at center, var(--paper) 6px, transparent 6px)
            -6px 0px / 22px 22px repeat-y,
          /* right column */
          radial-gradient(circle at center, var(--paper) 6px, transparent 6px)
            calc(100% + 6px) 0px / 22px 22px repeat-y,
          /* stamp face background */
          var(--orange);
        box-shadow: 4px 8px 40px rgba(23,19,14,0.38);
        position: relative;
        padding: 20px;
      }
      /* inner stamp face */
      #t1-stat-postage .stamp-face {
        position: absolute; inset: 20px;
        background: var(--orange);
        overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      /* halftone engraving layer behind the number */
      #t1-stat-postage .stamp-halftone {
        position: absolute; inset: 0;
        background-image: var(--tex-halftone);
        background-size: var(--tex-halftone-size);
        opacity: 0.22;
        mix-blend-mode: multiply;
      }
      #t1-stat-postage .stamp-country {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: 22px; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--paper);
        opacity: 0.9; z-index: 2; margin-bottom: 4px;
      }
      #t1-stat-postage .stamp-denom {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 200px; line-height: 0.88; color: var(--paper);
        font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
        z-index: 2; text-shadow: 0 2px 8px rgba(23,19,14,0.22);
      }
      #t1-stat-postage .stamp-sublabel {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 22px; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--paper);
        opacity: 0.8; z-index: 2; margin-top: 8px;
      }
      /* cancellation postmark — diagonal bars, NOT a circle */
      #t1-stat-postage .cancel {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        /* parallel diagonal bars across the stamp */
        background-image: repeating-linear-gradient(
          -42deg,
          rgba(23,19,14,0.60) 0px,
          rgba(23,19,14,0.60) 6px,
          transparent 6px,
          transparent 22px
        );
        opacity: 0.45;
      }
      /* label below */
      #t1-stat-postage .label {
        position: absolute; left: 130px; right: 130px; bottom: 220px;
        font-weight: var(--wt-thin); font-size: 56px; line-height: 1.1;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-postage .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-postage .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-postage" data-composition-id="t1-stat-postage" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">STAMPED · CERTIFIED</div>

      <div class="stamp-outer">
        <div class="stamp-perf">
          <div class="stamp-face">
            <div class="stamp-halftone"></div>
            <div class="stamp-country" data-slot="country">DATA BUREAU</div>
            <div class="stamp-denom" data-slot="stat">82%</div>
            <div class="stamp-sublabel">of total</div>
            <div class="cancel"></div>
          </div>
        </div>
      </div>

      <div class="label" data-slot="label"><em>four in five</em> videos never reach the right audience</div>
      <div class="source" data-slot="source">SOURCE · DISTRIBUTION INDEX 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Grain flicker
      tl.fromTo("#t1-stat-postage .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      // Kicker snaps in
      tl.from("#t1-stat-postage .kicker", { autoAlpha: 0, x: -20, duration: 0.28, ease: "steps(4)" }, 0.15)
        // Stamp pops in from slightly above, snaps to position
        .from("#t1-stat-postage .stamp-outer", {
          autoAlpha: 0, scale: 0.55, y: -60,
          transformOrigin: "50% 50%",
          duration: 0.35, ease: "steps(5)"
        }, 0.32)
        // settle with back.out bounce
        .to("#t1-stat-postage .stamp-outer", {
          scale: 1, y: 0,
          duration: 0.28, ease: "back.out(2.2)"
        }, 0.67)
        // denomination number slams in
        .from("#t1-stat-postage .stamp-denom", {
          autoAlpha: 0, scale: 0.6,
          transformOrigin: "50% 50%",
          duration: 0.28, ease: "back.out(2.6)"
        }, 0.82)
        // cancellation bars wipe across
        .from("#t1-stat-postage .cancel", { autoAlpha: 0, duration: 0.22, ease: "steps(3)" }, 1.05)
        .from("#t1-stat-postage .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.22)
        .from("#t1-stat-postage .source", { autoAlpha: 0, duration: 0.28 }, 1.5)
        .set({}, {}, 6);
      window.__timelines["t1-stat-postage"] = tl;
    </script>
  </body>
</html>
