<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat  (full-paper takeover: one big number)
  Opaque paper. The yellow circle is the eye-magnet; the number sits on it.
  Slots: kicker, stat (the number, e.g. "73%"), label (what it means), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none;
      }
      #t1-stat .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat .stage { position: absolute; inset: 0; transform-origin: 50% 48%; }

      #t1-stat .circle {
        position: absolute; left: 50%; top: 48%; width: 720px; height: 720px;
        margin: -360px 0 0 -360px; border-radius: 50%; background: var(--yellow); z-index: 1;
      }
      #t1-stat .stat {
        position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
        z-index: 3; font-weight: var(--wt-black); font-size: var(--size-mega);
        line-height: 0.9; letter-spacing: -0.04em; color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #t1-stat .kicker {
        position: absolute; left: 50%; top: 200px; transform: translateX(-50%); z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink); white-space: nowrap;
      }
      #t1-stat .label {
        position: absolute; left: 50%; bottom: 180px; transform: translateX(-50%);
        width: 1100px; text-align: center; z-index: 3;
        font-weight: var(--wt-thin); font-size: var(--size-headline);
        line-height: 1.05; letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat .source {
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat" data-composition-id="t1-stat" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="stage">
        <div class="circle"></div>
        <div class="kicker" data-slot="kicker">BY THE NUMBERS</div>
        <div class="stat" data-slot="stat">73%</div>
        <div class="label" data-slot="label">of viewers drop off in the <em>first ten seconds</em></div>
        <div class="source" data-slot="source">SOURCE · ANALYTICS 2026</div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#t1-stat .stage", { scale: 1.0 }, { scale: 1.05, duration: 6, ease: "none" }, 0);
      tl.fromTo("#t1-stat .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 150px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-stat .kicker", { autoAlpha: 0, y: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat .circle", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2.2)" }, 0.3)
        .from("#t1-stat .stat", { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(2.6)" }, 0.55)
        .from("#t1-stat .label", { autoAlpha: 0, y: 24, clipPath: "inset(0 0 100% 0)", duration: 0.45, ease: "power3.out" }, 0.95)
        .from("#t1-stat .source", { autoAlpha: 0, duration: 0.3 }, 1.2);

      window.__timelines["t1-stat"] = tl;
    </script>
  </body>
</html>
