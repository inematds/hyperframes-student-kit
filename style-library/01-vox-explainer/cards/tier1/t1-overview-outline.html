<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · OUTLINE / NOTES
  Lecture-notes paper: ruled lines, a heading, 3 top-level square-bullet points
  each with one indented sub-point.
  Bullets reveal top-to-bottom staggered.
  Slots: title, b1, sub1, b2, sub2, b3, sub3, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; }
      #t1-ov-outline {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-outline .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.44;
        pointer-events: none; z-index: 10;
      }
      #t1-ov-outline .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 9;
        background: radial-gradient(130% 120% at 50% 40%, transparent 55%, rgba(23,19,14,0.18) 100%);
      }

      /* ruled lines across the full canvas — lecture paper */
      #t1-ov-outline .ruled {
        position: absolute; inset: 0;
        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 72px,
          rgba(23,19,14,0.12) 72px,
          rgba(23,19,14,0.12) 74px
        );
      }
      /* three-hole punch — optional visual detail, non-animated */
      #t1-ov-outline .holes {
        position: absolute; left: 44px; top: 0; bottom: 0;
        display: flex; flex-direction: column; justify-content: space-around;
        padding: 140px 0; z-index: 2;
      }
      #t1-ov-outline .hole {
        width: 32px; height: 32px; border-radius: 50%;
        background: rgba(23,19,14,0.15); border: 2px solid rgba(23,19,14,0.2);
      }

      /* marker title */
      #t1-ov-outline .marker-title {
        position: absolute; top: 72px; left: 280px;
        transform: skewX(var(--marker-skew));
        background: var(--yellow); padding: 10px 36px; z-index: 5;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase; white-space: nowrap;
        display: inline-block;
      }

      /* content area — right of the margin rule */
      #t1-ov-outline .notes {
        position: absolute; left: 280px; right: 140px; top: 220px;
        z-index: 3;
      }

      /* top-level bullet */
      #t1-ov-outline .bullet-row {
        display: flex; align-items: flex-start; gap: 22px;
        margin-bottom: 16px;
      }
      #t1-ov-outline .sq {
        flex-shrink: 0;
        width: 22px; height: 22px; margin-top: 10px;
        background: var(--ink); border-radius: 2px;
      }
      #t1-ov-outline .b-text {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 52px; line-height: 1.2; color: var(--ink);
      }

      /* sub-point — indented */
      #t1-ov-outline .sub-row {
        display: flex; align-items: flex-start; gap: 22px;
        margin-left: 80px; margin-bottom: 40px;
      }
      #t1-ov-outline .sub-dash {
        flex-shrink: 0; width: 20px; height: 3px;
        background: var(--muted); margin-top: 22px;
      }
      #t1-ov-outline .sub-text {
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: 36px; line-height: 1.3; color: var(--muted);
        font-style: italic;
      }
      /* source */
      #t1-ov-outline .source {
        position: absolute; left: 280px; bottom: 46px; z-index: 6;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-outline" data-composition-id="t1-ov-outline" data-start="0" data-width="1920" data-height="1080">
      <div class="ruled"></div>
      <div class="holes">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
      </div>

      <div class="marker-title" data-slot="title">TODAY'S AGENDA</div>

      <div class="notes">
        <!-- bullet 1 -->
        <div class="bullet-row b1-row">
          <div class="sq"></div>
          <div class="b-text" data-slot="b1">The problem we're solving</div>
        </div>
        <div class="sub-row sub1-row">
          <div class="sub-dash"></div>
          <div class="sub-text" data-slot="sub1">why the old approach no longer works</div>
        </div>

        <!-- bullet 2 -->
        <div class="bullet-row b2-row">
          <div class="sq"></div>
          <div class="b-text" data-slot="b2">The mechanism behind the shift</div>
        </div>
        <div class="sub-row sub2-row">
          <div class="sub-dash"></div>
          <div class="sub-text" data-slot="sub2">three forces driving the change</div>
        </div>

        <!-- bullet 3 -->
        <div class="bullet-row b3-row">
          <div class="sq"></div>
          <div class="b-text" data-slot="b3">What happens next</div>
        </div>
        <div class="sub-row sub3-row">
          <div class="sub-dash"></div>
          <div class="sub-text" data-slot="sub3">the timeline and what to watch</div>
        </div>
      </div>


      <div class="source" data-slot="source">SOURCE · REFERENCE 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // finite grain flicker
      tl.fromTo("#t1-ov-outline .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "145px 120px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // margin rule draws down

      // title snaps in
      tl.from("#t1-ov-outline .marker-title",
              { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.35, ease: "power3.out" }, 0.2);

      // bullets build top-to-bottom — bullet + sub as a unit
      tl.from("#t1-ov-outline .b1-row",
              { autoAlpha: 0, x: -28, duration: 0.3, ease: "back.out(1.6)" }, 0.5);
      tl.from("#t1-ov-outline .sub1-row",
              { autoAlpha: 0, x: -18, duration: 0.28, ease: "power2.out" }, 0.66);

      tl.from("#t1-ov-outline .b2-row",
              { autoAlpha: 0, x: -28, duration: 0.3, ease: "back.out(1.6)" }, 0.82);
      tl.from("#t1-ov-outline .sub2-row",
              { autoAlpha: 0, x: -18, duration: 0.28, ease: "power2.out" }, 0.98);

      tl.from("#t1-ov-outline .b3-row",
              { autoAlpha: 0, x: -28, duration: 0.3, ease: "back.out(1.6)" }, 1.14);
      tl.from("#t1-ov-outline .sub3-row",
              { autoAlpha: 0, x: -18, duration: 0.28, ease: "power2.out" }, 1.30);


      tl.from("#t1-ov-outline .source", { autoAlpha: 0, duration: 0.3 }, 1.75);

      tl.set({}, {}, 7);

      window.__timelines["t1-ov-outline"] = tl;
    </script>
  </body>
</html>
