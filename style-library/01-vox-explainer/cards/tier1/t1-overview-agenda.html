<!doctype html>
<!--
  VOX EXPLAINER · tier1 · overview · STACKED CHAPTER BARS
  4 full-width horizontal bars stacked vertically like a segmented agenda.
  Each bar: number chip left + chapter title. TOP/active bar is yellow, rest kraft.
  Bars wipe/slide in stacked — each from a different edge direction.
  Slots: title, item1, item2, item3, item4, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-agenda {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-agenda .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-agenda .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-ov-agenda .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }

      /* small marker title at top — left aligned, thinner bar */
      #t1-ov-agenda .title-bar {
        position: absolute; top: 64px; left: 130px; z-index: 3;
        display: flex; align-items: center; gap: 20px;
      }
      #t1-ov-agenda .title-accent {
        width: 10px; height: 72px; background: var(--red);
      }
      #t1-ov-agenda .title {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
      }

      /* stacked bars */
      #t1-ov-agenda .bars {
        position: absolute; top: 190px; left: 130px; right: 130px;
        display: flex; flex-direction: column; gap: 12px; z-index: 3;
      }
      #t1-ov-agenda .bar {
        display: flex; align-items: center; gap: 0;
        height: 168px;
        background: var(--paper-2);
        border: 4px solid var(--ink);
        box-shadow: 6px 8px 0 rgba(23,19,14,0.12);
        overflow: hidden;
      }
      /* active / top bar is yellow */
      #t1-ov-agenda .bar.active {
        background: var(--yellow);
        box-shadow: 8px 10px 0 rgba(23,19,14,0.18);
      }

      /* number chip */
      #t1-ov-agenda .chip {
        flex: 0 0 150px; height: 100%;
        display: flex; align-items: center; justify-content: center;
        border-right: 4px solid var(--ink);
        font-weight: var(--wt-black); font-size: 96px;
        line-height: 1; letter-spacing: var(--track-tight);
        font-variant-numeric: tabular-nums;
        background: var(--ink); color: var(--paper);
      }
      #t1-ov-agenda .bar.active .chip {
        background: var(--ink); color: var(--yellow);
      }

      /* chapter title */
      #t1-ov-agenda .chapter {
        flex: 1; padding: 0 48px;
        font-weight: var(--wt-black); font-size: 68px;
        letter-spacing: var(--track-tight); line-height: 1.05; color: var(--ink);
      }

      /* NOW indicator on active bar */
      #t1-ov-agenda .now-badge {
        flex: 0 0 auto; margin-right: 40px;
        background: var(--ink); color: var(--yellow);
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; padding: 10px 20px;
      }

      #t1-ov-agenda .source {
        position: absolute; left: 130px; bottom: 88px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-agenda" data-composition-id="t1-ov-agenda" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="title-bar">
        <div class="title-accent"></div>
        <div class="title" data-slot="title">TODAY'S AGENDA</div>
      </div>

      <div class="bars">
        <!-- active bar first -->
        <div class="bar b1 active">
          <div class="chip">1</div>
          <div class="chapter" data-slot="item1">The Big Picture</div>
          <div class="now-badge">NOW</div>
        </div>
        <div class="bar b2">
          <div class="chip">2</div>
          <div class="chapter" data-slot="item2">How It Breaks Down</div>
        </div>
        <div class="bar b3">
          <div class="chip">3</div>
          <div class="chapter" data-slot="item3">The Real Numbers</div>
        </div>
        <div class="bar b4">
          <div class="chip">4</div>
          <div class="chapter" data-slot="item4">What You Do Next</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · VIDEO AUTOMATION 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker — finite
      tl.fromTo("#t1-ov-agenda .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "130px 100px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // title slides in from left
      tl.from("#t1-ov-agenda .title-bar",
        { autoAlpha: 0, x: -50, duration: 0.35, ease: "power3.out" }, 0.1);

      // active bar wipes in from left — clips across
      tl.from("#t1-ov-agenda .b1",
        { clipPath: "inset(0 100% 0 0)", autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 0.38);

      // subsequent bars wipe in with slight stagger — alternating sides for variety
      tl.from("#t1-ov-agenda .b2",
        { clipPath: "inset(0 0 0 100%)", autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.62);
      tl.from("#t1-ov-agenda .b3",
        { clipPath: "inset(0 100% 0 0)", autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.80);
      tl.from("#t1-ov-agenda .b4",
        { clipPath: "inset(0 0 0 100%)", autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.98);

      // NOW badge pops in after bar 1 lands
      tl.from("#t1-ov-agenda .now-badge",
        { scale: 0, autoAlpha: 0, duration: 0.22, ease: "back.out(2.4)" }, 0.72);

      tl.from("#t1-ov-agenda .source", { autoAlpha: 0, duration: 0.3 }, 1.5);

      // hold at 7s
      tl.set({}, {}, 7);

      window.__timelines["t1-ov-agenda"] = tl;
    </script>
  </body>
</html>
