<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · FRACTION
  A ratio set as an editorial fraction: big ink numerator over a ghosted,
  outline denominator, divided by a heavy rule. Reads as "N of every D".
  Slots: kicker, num (numerator), den (denominator), label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-frac {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-frac .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-frac .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-frac .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 38% 50%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-frac .kicker {
        position: absolute; left: 150px; top: 200px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-frac .frac {
        position: absolute; left: 150px; top: 50%; transform: translateY(-50%);
        text-align: center; line-height: 0.82;
      }
      #t1-stat-frac .num {
        display: block; font-weight: var(--wt-black); font-size: 360px;
        color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.04em;
      }
      #t1-stat-frac .bar {
        width: 460px; height: 12px; background: var(--yellow); margin: 18px auto;
        transform: scaleX(0); transform-origin: center;
      }
      #t1-stat-frac .den {
        display: block; font-weight: var(--wt-black); font-size: 220px;
        color: transparent; -webkit-text-stroke: 4px var(--ink);
        font-variant-numeric: tabular-nums; letter-spacing: -0.04em;
      }
      #t1-stat-frac .label {
        position: absolute; right: 130px; top: 50%; transform: translateY(-50%);
        width: 700px; font-weight: var(--wt-thin); font-size: 64px; line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-frac .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-frac .source {
        position: absolute; right: 130px; bottom: 96px; text-align: right;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-frac" data-composition-id="t1-stat-frac" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">THE ODDS</div>
      <div class="frac">
        <span class="num" data-slot="num">1</span>
        <div class="bar"></div>
        <span class="den" data-slot="den">200</span>
      </div>
      <div class="label" data-slot="label">videos ever crosses <em>a million views</em></div>
      <div class="source" data-slot="source">SOURCE · ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-frac .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-frac .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-frac .num", { autoAlpha: 0, scale: 0.6, duration: 0.45, ease: "back.out(2.4)" }, 0.35)
        .to("#t1-stat-frac .bar", { scaleX: 1, duration: 0.3, ease: "steps(5)" }, 0.7)
        .from("#t1-stat-frac .den", { autoAlpha: 0, y: 30, duration: 0.4, ease: "power3.out" }, 0.8)
        .from("#t1-stat-frac .label", { autoAlpha: 0, x: 30, duration: 0.45, ease: "power3.out" }, 0.95)
        .from("#t1-stat-frac .source", { autoAlpha: 0, duration: 0.3 }, 1.25)
        .set({}, {}, 6);
      window.__timelines["t1-stat-frac"] = tl;
    </script>
  </body>
</html>
