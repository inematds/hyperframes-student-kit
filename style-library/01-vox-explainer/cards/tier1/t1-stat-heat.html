<!doctype html>
<!--
  VOX EXPLAINER · tier1 · stat · HEAT STRIP
  A row of 7 graded intensity cells from pale paper → yellow → red (severity
  scale). The hero cell is called out by a thick outline + elevated label;
  big hero value. Cells built in JS deterministically, color interpolated from
  token-like RGB stops. data-level (1..7, default 5) marks the hero.
  Slots: kicker, stat, lowLabel, highLabel, label (richtext), source.
  Knob: data-level on .heat-row (1..7, default 5).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-heat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-heat .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-heat .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-heat .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-heat .kicker {
        position: absolute; left: 130px; top: 180px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* ---- scale end labels ---- */
      #t1-stat-heat .scale-labels {
        position: absolute; left: 130px; right: 130px; top: 680px;
        display: flex; justify-content: space-between;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      /* ---- heat strip ---- */
      #t1-stat-heat .heat-row {
        position: absolute; left: 130px; right: 130px; top: 430px;
        display: flex; gap: 20px; height: 220px;
      }
      #t1-stat-heat .cell {
        flex: 1; box-shadow: inset 0 0 0 3px var(--ink);
        position: relative; transition: none;
      }
      /* hero outline: thick yellow border + slight lift */
      #t1-stat-heat .cell.hero {
        box-shadow: inset 0 0 0 8px var(--ink), 0 0 0 6px var(--yellow);
        z-index: 2;
      }
      /* hero callout (big number above the cell) */
      #t1-stat-heat .hero-callout {
        position: absolute; left: 50%; bottom: 100%;
        transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center;
      }
      #t1-stat-heat .hero-callout .stat {
        background: var(--ink); color: var(--yellow);
        padding: 10px 28px 8px;
        font-weight: var(--wt-black); font-size: 120px;
        font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
        margin-bottom: 0;
      }
      #t1-stat-heat .hero-callout .stem {
        width: 8px; height: 28px; background: var(--ink);
      }
      /* cell index label inside each cell */
      #t1-stat-heat .cell-num {
        position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); color: rgba(23,19,14,0.5);
      }
      #t1-stat-heat .cell.hero .cell-num { color: var(--ink); font-weight: var(--wt-black); }
      /* ---- label + source ---- */
      #t1-stat-heat .label {
        position: absolute; left: 130px; right: 130px; top: 740px;
        font-weight: var(--wt-thin); font-size: 58px; line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-heat .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-heat .source {
        position: absolute; left: 130px; bottom: 96px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-heat" data-composition-id="t1-stat-heat" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">RISK SEVERITY</div>
      <div class="heat-row" data-level="5" id="heat-row"></div>
      <div class="scale-labels">
        <span data-slot="lowLabel">LOW</span>
        <span data-slot="highLabel">CRITICAL</span>
      </div>
      <div class="label" data-slot="label">ranked <em>high-severity</em> by independent auditors</div>
      <div class="source" data-slot="source">SOURCE · RISK REPORT 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const row = document.getElementById("heat-row");
      const COUNT = 7;
      const heroLevel = Math.max(1, Math.min(COUNT, parseInt(row.getAttribute("data-level"), 10) || 5));

      // Color ramp: paper-2 (#e6dcc4) → AIS blue (#37BDF8) → orange (#f26a1b) → red (#e23b2e)
      // 7 stops spread deterministically
      function lerpColor(a, b, t) {
        return [
          Math.round(a[0] + (b[0] - a[0]) * t),
          Math.round(a[1] + (b[1] - a[1]) * t),
          Math.round(a[2] + (b[2] - a[2]) * t)
        ];
      }
      const stops = [
        [230, 220, 196],  // paper-2
        [55, 189, 248],   // AIS blue
        [55, 189, 248],   // AIS blue (hold)
        [242, 106, 27],   // orange
        [242, 106, 27],   // orange (hold)
        [226, 59, 46],    // red
        [226, 59, 46]     // red
      ];

      for (let i = 0; i < COUNT; i++) {
        const cell = document.createElement("div");
        cell.className = "cell" + (i + 1 === heroLevel ? " hero" : "");
        const c = stops[i];
        cell.style.background = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";

        // hero gets callout
        if (i + 1 === heroLevel) {
          const callout = document.createElement("div");
          callout.className = "hero-callout";
          callout.innerHTML =
            '<div class="stat" data-slot="stat">5</div>' +
            '<div class="stem"></div>';
          cell.appendChild(callout);
        }

        const num = document.createElement("div");
        num.className = "cell-num";
        num.textContent = i + 1;
        cell.appendChild(num);
        row.appendChild(cell);
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-heat .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-heat .kicker",       { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-heat .cell",          { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 100%", duration: 0.06, ease: "steps(1)", stagger: 0.07 }, 0.35)
        .from("#t1-stat-heat .scale-labels",  { autoAlpha: 0, duration: 0.25 }, 0.85)
        .from("#t1-stat-heat .hero-callout",  { autoAlpha: 0, y: 24, duration: 0.4, ease: "back.out(2.2)" }, 1.0)
        .from("#t1-stat-heat .label",         { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.2)
        .from("#t1-stat-heat .source",        { autoAlpha: 0, duration: 0.3 }, 1.45)
        .set({}, {}, 6);
      window.__timelines["t1-stat-heat"] = tl;
    </script>
  </body>
</html>
