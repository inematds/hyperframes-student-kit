<!doctype html>
<!--
  VOX EXPLAINER · tier2 · stacked blocks lower-third
  Two offset paper-cut BLOCKS stacked:
    - Yellow block (top, slightly skewed right) holds the `name` (big, ink text).
    - Cream block (below, slightly skewed left, overlapping yellow) holds the `role`.
  Each block has a hard offset drop shadow (paper-cutout look).
  `tag` is a tiny ink kicker above the yellow block.
  Blocks pop in one after another with back.out.
  TRANSPARENT OVERLAY — only the two blocks paint.
  Slots: tag (kicker above), name (Fraunces on yellow), role (Archivo on cream).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lt-stack {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
        overflow: hidden;
      }

      /* Main wrapper, lower-left */
      #t2-lt-stack .wrap {
        position: absolute;
        left: 100px;
        bottom: 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
      }

      /* Tiny kicker tag above the yellow block */
      #t2-lt-stack .tag {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-tiny);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 10px;
        transform-origin: left center;
      }

      /* Yellow block — name, skewed slightly right */
      #t2-lt-stack .name-block {
        background: var(--yellow);
        padding: 16px 32px 16px 28px;
        /* Hard offset drop shadow */
        box-shadow: 7px 7px 0 var(--ink), 10px 10px 0 rgba(23,19,14,0.22);
        transform: skewX(-2deg) translateX(8px);
        transform-origin: left bottom;
        position: relative;
        z-index: 2;
      }

      #t2-lt-stack .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 80px;
        line-height: 0.95;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        white-space: nowrap;
        /* counter-skew text so it reads straight */
        display: inline-block;
        transform: skewX(2deg);
      }

      /* Cream block — role, skewed slightly the other way, overlaps yellow at top */
      #t2-lt-stack .role-block {
        background: var(--paper);
        padding: 14px 32px 14px 28px;
        /* Hard offset drop shadow */
        box-shadow: 7px 7px 0 var(--ink), 10px 10px 0 rgba(23,19,14,0.22);
        transform: skewX(1.5deg) translateX(0px);
        transform-origin: left top;
        margin-top: -6px;   /* overlap the yellow block slightly */
        position: relative;
        z-index: 1;
      }

      #t2-lt-stack .role {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-label);
        letter-spacing: 0.04em;
        color: var(--ink);
        white-space: nowrap;
        /* counter-skew */
        display: inline-block;
        transform: skewX(-1.5deg);
      }

      /* Orange accent bar at the left edge of the name block */
      #t2-lt-stack .accent-bar {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 8px;
        background: var(--orange);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-stack" data-composition-id="t2-lt-stack" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="tag" data-slot="tag">IN THE FIELD</div>
        <div class="name-block">
          <div class="accent-bar"></div>
          <div class="name" data-slot="name">Theo Vasquez</div>
        </div>
        <div class="role-block">
          <div class="role" data-slot="role">Climate &amp; Energy Reporter · Vox</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Tag wipes in scaleX from left
      tl.from("#t2-lt-stack .tag", { scaleX: 0, autoAlpha: 0, transformOrigin: "left center", duration: 0.26, ease: "power3.out" }, 0.0)
        // Yellow name block pops in with back.out overshoot
        .from("#t2-lt-stack .name-block", { scaleX: 0, transformOrigin: "left center", duration: 0.36, ease: "back.out(2.0)" }, 0.18)
        // Accent bar slaps in
        .from("#t2-lt-stack .accent-bar", { scaleY: 0, transformOrigin: "top center", duration: 0.22, ease: "power3.out" }, 0.28)
        // Name snaps in with back.out
        .from("#t2-lt-stack .name", { autoAlpha: 0, x: -20, duration: 0.32, ease: "back.out(1.5)" }, 0.38)
        // Cream role block pops in slightly after, from bottom
        .from("#t2-lt-stack .role-block", { scaleX: 0, transformOrigin: "left center", duration: 0.32, ease: "back.out(1.9)" }, 0.52)
        // Role text steps in
        .from("#t2-lt-stack .role", { autoAlpha: 0, y: 10, duration: 0.26, ease: "steps(4)" }, 0.68)
        .set({}, {}, 7);

      window.__timelines["t2-lt-stack"] = tl;
    </script>
  </body>
</html>
