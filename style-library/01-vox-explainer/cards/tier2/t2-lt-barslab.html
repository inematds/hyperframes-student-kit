<!doctype html>
<!--
  VOX EXPLAINER · tier2 · bar-slab lower-third
  Full-width solid INK bar pinned across the bottom of the frame.
  Name in --paper on the left; role on the right; yellow square accent far-left.
  TRANSPARENT OVERLAY — only the bar paints.
  Slots: tag (small kicker above bar), name (big Fraunces, left), role (Archivo, right).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lt-bar {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
        overflow: hidden;
      }

      /* Yellow accent square, far left of bar */
      #t2-lt-bar .accent-sq {
        position: absolute;
        left: 0; bottom: 60px;
        width: 72px; height: 100px;
        background: var(--yellow);
      }

      /* Tag kicker — sits just above the bar */
      #t2-lt-bar .tag {
        position: absolute;
        left: 80px; bottom: 170px;
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-label);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--yellow);
        transform-origin: left center;
      }

      /* Full-width ink bar — wipes up from bottom */
      #t2-lt-bar .bar {
        position: absolute;
        left: 0; bottom: 60px;
        width: 1920px; height: 100px;
        background: var(--ink);
        display: flex;
        align-items: center;
        transform-origin: bottom center;
      }

      /* Name — big Fraunces on the left of the bar */
      #t2-lt-bar .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 68px;
        line-height: 1;
        letter-spacing: var(--track-tight);
        color: var(--paper);
        margin-left: 88px;
        white-space: nowrap;
      }

      /* Divider */
      #t2-lt-bar .divider {
        flex: 1;
      }

      /* Role — Archivo on the right side of bar */
      #t2-lt-bar .role {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-body);
        letter-spacing: 0.04em;
        color: var(--paper-2);
        margin-right: 64px;
        white-space: nowrap;
        transform-origin: right center;
      }

      /* Red tick accent — a short vertical bar at the border between name and role */
      #t2-lt-bar .tick {
        width: 4px;
        height: 56px;
        background: var(--red);
        margin: 0 40px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-bar" data-composition-id="t2-lt-bar" data-start="0" data-width="1920" data-height="1080">
      <div class="tag" data-slot="tag">CORRESPONDENT</div>
      <div class="accent-sq"></div>
      <div class="bar">
        <div class="name" data-slot="name">Marcus Okafor</div>
        <div class="divider"></div>
        <div class="tick"></div>
        <div class="role" data-slot="role">Senior Policy Correspondent · Vox</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Bar wipes up from the bottom edge
      tl.from("#t2-lt-bar .bar", { yPercent: 100, duration: 0.35, ease: "power3.out" }, 0.0)
        // Yellow accent square wipes up slightly earlier
        .from("#t2-lt-bar .accent-sq", { yPercent: 100, duration: 0.3, ease: "power3.out" }, 0.0)
        // Tag snaps in with scaleX wipe
        .from("#t2-lt-bar .tag", { scaleX: 0, autoAlpha: 0, transformOrigin: "left center", duration: 0.28, ease: "power2.out" }, 0.2)
        // Name slides in from left with back.out overshoot
        .from("#t2-lt-bar .name", { autoAlpha: 0, x: -60, duration: 0.38, ease: "back.out(1.7)" }, 0.3)
        // Tick slaps in
        .from("#t2-lt-bar .tick", { scaleY: 0, transformOrigin: "top center", duration: 0.2, ease: "power3.out" }, 0.52)
        // Role steps in choppy
        .from("#t2-lt-bar .role", { autoAlpha: 0, x: 40, duration: 0.32, ease: "steps(5)" }, 0.6)
        .set({}, {}, 7);

      window.__timelines["t2-lt-bar"] = tl;
    </script>
  </body>
</html>
