<!doctype html>
<!--
  VOX EXPLAINER · tier2 · label — MAGNIFIER LENS  (t2-lb-mag)
  TRANSPARENT OVERLAY. A circular ink-ring lens with a rounded-rect handle
  (rotated, at lower-right of the circle — NOT an arrow). The `term` appears
  enlarged "through" the lens (inside the circle, ink Fraunces). `detail`
  beneath the lens. Lens scales in from small with
  back.out; term sharpens inside.
  Slots: term (~22 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-mag {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
      }

      /* ── OUTER WRAP ──────────────────────────────────────────────────── */
      #t2-lb-mag .wrap {
        position: absolute; left: 150px; top: 310px; width: 760px;
      }
      /* ── LENS ASSEMBLY ────────────────────────────────────────────────
         Lens = circle (ink ring) + handle (rounded rect, rotated) stacked
         in a relative container so the whole thing scales as a unit.       */
      #t2-lb-mag .lens-assy {
        position: relative;
        /* width/height sized to hold circle + handle protrusion */
        width: 340px;
        height: 380px;
        transform-origin: center center;
      }

      /* Circular lens ring — pure border circle, transparent fill so the
         page behind shows through. Yellow paper tint inside to hint "glass". */
      #t2-lb-mag .lens-ring {
        position: absolute;
        top: 0; left: 0;
        width: 300px; height: 300px;
        border-radius: 50%;
        border: 7px solid var(--ink);
        /* subtle warm glass tint inside */
        background: rgba(239, 233, 220, 0.78);
        box-sizing: border-box;
        overflow: hidden; /* clip the term text to the circle */
        display: flex; align-items: center; justify-content: center;
        /* slight yellow highlight rim for the "lens" effect */
        box-shadow:
          0 0 0 3px rgba(55, 189, 248, 0.55),
          inset 0 2px 18px rgba(55, 189, 248, 0.20);
      }

      /* Term text — enlarged, inside the lens */
      #t2-lb-mag .term {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 48px;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        text-align: center;
        line-height: 1.1;
        padding: 0 18px;
      }

      /* Handle — a rounded rect, rotated ~42deg, positioned at lower-right
         of the circle. NOT an arrowhead — just a bar. */
      #t2-lb-mag .lens-handle {
        position: absolute;
        /* bottom-right of the 300×300 circle; offset to make it protrude */
        top: 238px; left: 238px;
        width: 110px; height: 18px;
        border-radius: 9px;
        background: var(--ink);
        transform: rotate(42deg);
        transform-origin: left center;
      }

      /* ── DETAIL ──────────────────────────────────────────────────────── */
      #t2-lb-mag .detail {
        margin-top: 20px;
        font-family: var(--font-label);
        font-weight: var(--wt-reg);
        font-size: var(--size-body);
        line-height: 1.4;
        color: var(--ink);
        background: rgba(239, 233, 220, 0.92);
        padding: 10px 16px;
        display: inline-block;
        max-width: 620px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-mag"
         data-composition-id="t2-lb-mag"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="wrap">

        <div class="lens-assy">
          <div class="lens-ring">
            <div class="term" data-slot="term">feedback loop</div>
          </div>
          <div class="lens-handle"></div>
        </div>

        <div class="detail" data-slot="detail">Output becomes input — the system amplifies itself until an external brake kicks in.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });


      tl

      /* 2 — whole lens assembly scales in from small (back.out like zooming) */
      .from("#t2-lb-mag .lens-assy", {
        scale: 0.12, autoAlpha: 0,
        transformOrigin: "center center",
        duration: 0.44, ease: "back.out(2.2)"
      }, 0.18)

      /* 3 — term inside lens sharpens (autoAlpha, slight scale) */
      .from("#t2-lb-mag .term", {
        autoAlpha: 0, scale: 0.7,
        transformOrigin: "center center",
        duration: 0.26, ease: "power2.out"
      }, 0.46)

      /* 4 — handle flicks in with a quick rotate */
      .from("#t2-lb-mag .lens-handle", {
        autoAlpha: 0, scaleX: 0,
        transformOrigin: "left center",
        duration: 0.22, ease: "steps(3)"
      }, 0.54)

      /* 5 — detail snaps in */
      .from("#t2-lb-mag .detail", {
        autoAlpha: 0, y: 14, duration: 0.30, ease: "steps(4)"
      }, 0.72)

      .set({}, {}, 7);

      window.__timelines["t2-lb-mag"] = tl;
    </script>
  </body>
</html>
