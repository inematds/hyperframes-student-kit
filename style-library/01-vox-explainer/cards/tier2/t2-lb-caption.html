<!doctype html>
<!--
  VOX EXPLAINER · tier2 · label-caption  (overlay: lower caption bar)
  TRANSPARENT. A cream/paper bar anchored at the bottom of the frame.
  Yellow left-edge tick. Term bold in ink + detail continuing in Archivo
  on the same bar.
  Slots: term (~22 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-cap {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }

      /* Caption bar — sits at the bottom, left-anchored, spans most of the width */
      #t2-lb-cap .bar-wrap {
        position: absolute;
        bottom: 72px;
        left: 0;
        width: 1480px;
        transform-origin: left center;
      }
      /* The bar itself */
      #t2-lb-cap .bar {
        position: relative;
        background: var(--paper);
        border-top: 3px solid var(--ink);
        border-bottom: 3px solid var(--ink);
        padding: 18px 40px 18px 24px;
        display: flex; align-items: baseline; gap: 0;
        transform-origin: left center;
        overflow: hidden;
      }

      /* Yellow left-edge tick */
      #t2-lb-cap .tick {
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 12px;
        background: var(--yellow);
        transform-origin: center top;
      }

      /* Term — bold Fraunces */
      #t2-lb-cap .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 48px; letter-spacing: var(--track-tight); color: var(--ink);
        white-space: nowrap;
        padding-left: 26px; /* clearance past the tick */
        flex-shrink: 0;
      }

      /* Separator dot between term and detail */
      #t2-lb-cap .sep {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: 48px; color: var(--yellow);
        padding: 0 16px;
        flex-shrink: 0;
        line-height: 1;
        /* ink outline */
        text-shadow:
          1px 1px 0 var(--ink),
         -1px -1px 0 var(--ink);
      }

      /* Detail — Archivo following on the same bar */
      #t2-lb-cap .detail {
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.3; color: var(--ink);
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-cap" data-composition-id="t2-lb-cap" data-start="0" data-width="1920" data-height="1080">
      <div class="bar-wrap">
        <div class="bar">
          <div class="tick"></div>
          <div class="term" data-slot="term">Overton window</div>
          <div class="sep">—</div>
          <div class="detail" data-slot="detail">The range of policies the public will accept shifts over time.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Bar wipes up from the bottom (translateY + scaleX reveal) */
      tl.from("#t2-lb-cap .bar", {
            autoAlpha: 0, scaleX: 0,
            transformOrigin: "left center",
            duration: 0.40, ease: "power3.out"
          }, 0.0)
        /* Yellow tick pops in with back.out */
        .from("#t2-lb-cap .tick", {
            scaleY: 0, transformOrigin: "center top",
            duration: 0.26, ease: "back.out(2.8)"
          }, 0.28)
        /* Term wipes in */
        .from("#t2-lb-cap .term", {
            autoAlpha: 0, scaleX: 0,
            transformOrigin: "left center",
            duration: 0.28, ease: "power3.out"
          }, 0.36)
        /* Separator pops */
        .from("#t2-lb-cap .sep", {
            autoAlpha: 0, scale: 0.4,
            duration: 0.20, ease: "back.out(2.2)",
            transformOrigin: "center center"
          }, 0.52)
        /* Detail steps in */
        .from("#t2-lb-cap .detail", {
            autoAlpha: 0, x: 20,
            duration: 0.30, ease: "steps(5)"
          }, 0.58)
        .set({}, {}, 7);

      window.__timelines["t2-lb-cap"] = tl;
    </script>
  </body>
</html>
