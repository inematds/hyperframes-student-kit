<!doctype html>
<!--
  VOX EXPLAINER · tier2 · label — PULL-QUOTE  (t2-lb-pull)
  TRANSPARENT OVERLAY. Giant yellow opening quotation mark (Fraunces) top-left;
  `term` set as a short quote line in ink Fraunces; `note` as attribution line
  ("— Source") in Archivo; `detail` as a smaller supporting line.
  Slots: term (~22 chars quote), detail (~70 chars context), note (~16 chars attribution).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-pull {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
      }

      /* ── OUTER WRAP ──────────────────────────────────────────────────── */
      #t2-lb-pull .wrap {
        position: absolute; left: 150px; top: 310px; width: 740px;
      }

      /* ── GIANT OPENING QUOTE MARK ────────────────────────────────────── */
      #t2-lb-pull .q-mark {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 220px;
        color: var(--yellow);
        line-height: 0.75;
        display: block;
        /* nudge left so the quote text aligns with text below */
        margin-left: -18px;
        margin-bottom: -24px;
        letter-spacing: 0;
        /* subtle ink shadow to separate from any background */
        text-shadow: 4px 4px 0 rgba(23, 19, 14, 0.18);
        user-select: none;
      }

      /* ── QUOTE TEXT (term slot) ───────────────────────────────────────── */
      #t2-lb-pull .term {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 66px;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        line-height: 1.1;
        display: inline-block;
        max-width: 660px;
        background: rgba(239, 233, 220, 0.94);
        padding: 4px 16px;
        border-radius: 2px;
      }

      /* ── ATTRIBUTION LINE (note slot) ────────────────────────────────── */
      #t2-lb-pull .note {
        display: block;
        margin-top: 18px;
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-label);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ── SUPPORTING DETAIL LINE ──────────────────────────────────────── */
      #t2-lb-pull .detail {
        display: block;
        margin-top: 20px;
        font-family: var(--font-label);
        font-weight: var(--wt-reg);
        font-size: var(--size-body);
        line-height: 1.4;
        color: var(--ink);
        background: rgba(239, 233, 220, 0.90);
        padding: 10px 16px;
        max-width: 640px;
        border-left: 4px solid var(--yellow);
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-pull"
         data-composition-id="t2-lb-pull"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="wrap">
        <div class="q-mark">&ldquo;</div>
        <div class="term" data-slot="term">the system was never designed for this</div>
        <div class="note" data-slot="note">— Dr. Reyes, 2023</div>
        <div class="detail" data-slot="detail">Experts warned of structural gaps a decade before the first visible cracks appeared.</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* 1 — quote mark drops in big with back.out overshoot */
      tl.from("#t2-lb-pull .q-mark", {
        autoAlpha: 0, scale: 0.35, y: -40,
        transformOrigin: "left top",
        duration: 0.40, ease: "back.out(2.8)"
      }, 0.0)

      /* 2 — first line of quote text wipes in */
      .from("#t2-lb-pull .term", {
        autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
        duration: 0.36, ease: "power3.out"
      }, 0.30)

      /* 3 — attribution snaps in with step ease */
      .from("#t2-lb-pull .note", {
        autoAlpha: 0, x: -12, duration: 0.26, ease: "steps(4)"
      }, 0.56)

      /* 4 — detail slides up */
      .from("#t2-lb-pull .detail", {
        autoAlpha: 0, y: 16, duration: 0.30, ease: "steps(4)"
      }, 0.72)

      .set({}, {}, 7);

      window.__timelines["t2-lb-pull"] = tl;
    </script>
  </body>
</html>
