<!doctype html>
<!--
  VOX EXPLAINER · tier2 · lower-third bracket
  TRANSPARENT — only the bracket frame paints. Lower-left safe zone.
  Slots: tag (kicker above), name (Fraunces, framed by L-brackets), role (cream chip beneath).
  Motion: top-left bracket snaps in from top-left, bottom-right bracket from bottom-right,
  name reveals between them, role chip drops in.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-brkt {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }

      #t2-lt-brkt .wrap {
        position: absolute; left: 110px; bottom: 110px;
      }

      /* tiny kicker above the frame */
      #t2-lt-brkt .tag {
        display: inline-block;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink); background: var(--yellow);
        padding: 4px 14px;
        transform: skewX(var(--marker-skew));
        margin-bottom: 10px;
      }

      /* bracket frame container — exactly wraps the name */
      #t2-lt-brkt .frame {
        position: relative;
        display: inline-block;
        padding: 14px 22px;
      }

      /* L-bracket top-left: two thick ink bars forming an ┌ */
      #t2-lt-brkt .brkt-tl,
      #t2-lt-brkt .brkt-br {
        position: absolute;
        --b: 6px;       /* bar thickness */
        --arm: 44px;    /* arm length */
      }

      /* top-left bracket */
      #t2-lt-brkt .brkt-tl {
        top: 0; left: 0;
        width: var(--arm); height: var(--arm);
        border-top: var(--b) solid var(--ink);
        border-left: var(--b) solid var(--ink);
      }

      /* bottom-right bracket */
      #t2-lt-brkt .brkt-br {
        bottom: 0; right: 0;
        width: var(--arm); height: var(--arm);
        border-bottom: var(--b) solid var(--ink);
        border-right: var(--b) solid var(--ink);
      }

      /* the big name between the brackets */
      #t2-lt-brkt .name {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 88px; line-height: 0.95;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        white-space: nowrap;
        display: inline-block;
        background: rgba(239, 233, 220, 0.94);
        padding: 4px 16px;
        border-radius: 2px;
      }

      /* cream role chip beneath the frame */
      #t2-lt-brkt .role {
        display: inline-block;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-body); letter-spacing: 0.04em;
        color: var(--ink); background: var(--paper);
        padding: 6px 16px;
        box-shadow: 5px 5px 0 rgba(23,19,14,0.25);
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-brkt" data-composition-id="t2-lt-brkt" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="tag" data-slot="tag">EXPERT VOICE</div>
        <div class="frame">
          <div class="brkt-tl"></div>
          <div class="brkt-br"></div>
          <div class="name" data-slot="name">Marcus Okafor</div>
        </div>
        <div class="role" data-slot="role">Director of Policy Research · Brookings</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // tag kicker snaps in from left
      tl.from("#t2-lt-brkt .tag", {
        autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
        duration: 0.3, ease: "power3.out"
      }, 0.0)

      // top-left bracket snaps in: arrives from top-left (x: -30, y: -30)
      .from("#t2-lt-brkt .brkt-tl", {
        autoAlpha: 0, x: -30, y: -30,
        duration: 0.28, ease: "back.out(2.2)"
      }, 0.28)

      // bottom-right bracket snaps in from opposite corner
      .from("#t2-lt-brkt .brkt-br", {
        autoAlpha: 0, x: 30, y: 30,
        duration: 0.28, ease: "back.out(2.2)"
      }, 0.28)

      // name slices in via scaleX wipe after brackets are in place
      .from("#t2-lt-brkt .name", {
        autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
        duration: 0.36, ease: "power3.out"
      }, 0.58)

      // role chip drops in with steps() snap
      .from("#t2-lt-brkt .role", {
        autoAlpha: 0, y: 18,
        duration: 0.3, ease: "steps(4)"
      }, 0.82)

      .set({}, {}, 7);

      window.__timelines["t2-lt-brkt"] = tl;
    </script>
  </body>
</html>
