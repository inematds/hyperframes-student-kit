<!doctype html>
<!--
  VOX EXPLAINER · tier2 · lower-third clapper / film slate
  TRANSPARENT — only the component paints. Sits lower-left so it never
  covers a centered speaker.
  Slots: tag (slate label kicker), name (main slate line in Fraunces cream),
         role (secondary slate line in Archivo).
  Motion: striped clapper top snaps closed (rotate from hinge), then board
          text reveals line by line.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lt-clap {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }
      #t2-lt-clap .wrap {
        position: absolute; left: 110px; bottom: 130px;
        width: 520px;
      }
      /* ---- clapper top bar (striped diagonal) ---- */
      #t2-lt-clap .clapper-top {
        height: 38px;
        background: repeating-linear-gradient(
          -50deg,
          var(--ink)     0px,
          var(--ink)     18px,
          var(--paper)   18px,
          var(--paper)   36px
        );
        border: 3px solid var(--ink);
        border-bottom: none;
        transform-origin: top left;
        /* rotated open, then snapped closed */
      }
      /* ---- main slate board ---- */
      #t2-lt-clap .board {
        background: var(--ink);
        border: 3px solid var(--ink);
        padding: 18px 24px 20px;
      }
      #t2-lt-clap .tag {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-tiny);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--yellow);
        margin-bottom: 6px;
        display: block;
      }
      /* Thin separator rule between tag and name */
      #t2-lt-clap .rule {
        height: 2px;
        background: rgba(239,233,220,0.25);
        margin-bottom: 10px;
      }
      #t2-lt-clap .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 76px;
        line-height: 0.95;
        letter-spacing: var(--track-tight);
        color: var(--paper);
        white-space: nowrap;
        display: block;
      }
      /* Second rule between name and role */
      #t2-lt-clap .rule-2 {
        height: 2px;
        background: rgba(239,233,220,0.18);
        margin: 10px 0 8px;
      }
      #t2-lt-clap .role {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-label);
        letter-spacing: 0.06em;
        color: var(--paper-2);
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-clap" data-composition-id="t2-lt-clap" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="clapper-top"></div>
        <div class="board">
          <span class="tag" data-slot="tag">SUBJECT</span>
          <div class="rule"></div>
          <span class="name" data-slot="name">Priya Nambiar</span>
          <div class="rule-2"></div>
          <span class="role" data-slot="role">Climate Investigative Unit</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Board slams in from below first (the clapperboard "slides up")
      tl.from("#t2-lt-clap .wrap", {
          y: 30, autoAlpha: 0,
          duration: 0.25, ease: "power3.out"
        }, 0.0)
        // Clapper top is open (rotated back) then SNAPS shut (fast rotate to 0)
        .from("#t2-lt-clap .clapper-top", {
          rotationZ: -28, transformOrigin: "top left",
          duration: 0.22, ease: "power4.out"
        }, 0.1)
        // A "clap" snap: slight overshoot then settle
        .to("#t2-lt-clap .clapper-top", {
          rotationZ: 3, duration: 0.06, ease: "power1.out"
        }, 0.32)
        .to("#t2-lt-clap .clapper-top", {
          rotationZ: 0, duration: 0.1, ease: "power2.inOut"
        }, 0.38)
        // tag reveals (scaleX wipe from left)
        .from("#t2-lt-clap .tag", {
          scaleX: 0, transformOrigin: "left center",
          autoAlpha: 0, duration: 0.28, ease: "power3.out"
        }, 0.46)
        // name snaps in with back.out
        .from("#t2-lt-clap .name", {
          autoAlpha: 0, x: -30,
          duration: 0.35, ease: "back.out(1.7)"
        }, 0.6)
        // role steps in
        .from("#t2-lt-clap .role", {
          autoAlpha: 0, y: 10,
          duration: 0.28, ease: "steps(4)"
        }, 0.82)
        .set({}, {}, 7);

      window.__timelines["t2-lt-clap"] = tl;
    </script>
  </body>
</html>
