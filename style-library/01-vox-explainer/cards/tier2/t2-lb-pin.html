<!doctype html>
<!--
  VOX EXPLAINER · tier2 · label-pin  (overlay: map-pin diamond callout)
  TRANSPARENT. A yellow rotated-square diamond pin anchors the annotation.
  The term sits beside it in ink Fraunces; detail beneath.
  Slots: term (~22 chars), detail (~70 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-pin {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }

      #t2-lb-pin .wrap {
        position: absolute; left: 150px; top: 360px; width: 780px;
      }
      /* Pin row: diamond + term side by side */
      #t2-lb-pin .pin-row {
        display: flex; align-items: center; gap: 22px;
      }

      /* Yellow rotated-square diamond — functional location marker */
      #t2-lb-pin .diamond {
        width: 52px; height: 52px; flex-shrink: 0;
        background: var(--yellow);
        border: 3px solid var(--ink);
        transform: rotate(45deg);
        box-shadow: 3px 3px 0 rgba(23,19,14,0.3);
      }

      #t2-lb-pin .term {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 68px; letter-spacing: var(--track-tight); color: var(--ink);
        line-height: 1;
        display: inline-block;
        background: rgba(239, 233, 220, 0.94);
        padding: 4px 16px;
        border-radius: 2px;
      }

      /* Detail line beneath */
      #t2-lb-pin .detail {
        margin-top: 20px; margin-left: 74px;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4; color: var(--ink);
        background: rgba(239,233,220,0.92); padding: 10px 18px;
        display: inline-block; max-width: 620px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-pin" data-composition-id="t2-lb-pin" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="pin-row">
          <div class="diamond"></div>
          <div class="term" data-slot="term">confirmation bias</div>
        </div>
        <div class="detail" data-slot="detail">We seek evidence that matches what we already believe.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Pin drops from above with back.out bounce — settles like it's pinned */
      tl.from("#t2-lb-pin .diamond", {
            y: -80, autoAlpha: 0, rotate: 45,
            duration: 0.5, ease: "back.out(3.0)",
            transformOrigin: "center center"
          }, 0.0)
        /* Term wipes in beside the pin */
        .from("#t2-lb-pin .term", {
            autoAlpha: 0, scaleX: 0,
            transformOrigin: "left center",
            duration: 0.36, ease: "power3.out"
          }, 0.22)
        /* Detail steps up beneath */
        .from("#t2-lb-pin .detail", {
            autoAlpha: 0, y: 14,
            duration: 0.30, ease: "steps(4)"
          }, 0.48)
        .set({}, {}, 7);

      window.__timelines["t2-lb-pin"] = tl;
    </script>
  </body>
</html>
