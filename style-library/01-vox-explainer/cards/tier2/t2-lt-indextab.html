<!doctype html>
<!--
  VOX EXPLAINER · tier2 · index-tab lower-third
  A RED filing-index tab protruding from the LEFT edge of the screen (lower-left).
  `tag` printed small on the tab (rotated 90deg, reading upward).
  `name` on a cream paper card to the right of the tab with hard drop shadow.
  `role` as a smaller line beneath the name.
  TRANSPARENT OVERLAY — only the tab + card paint.
  Slots: tag (on the tab), name (big Fraunces on card), role (Archivo beneath name).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lt-tab {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
        overflow: hidden;
      }

      /* Outer wrapper, positioned lower-left */
      #t2-lt-tab .assembly {
        position: absolute;
        left: 0;
        bottom: 120px;
        display: flex;
        align-items: stretch;
      }

      /* The red filing tab — narrow vertical stripe with rotated text */
      #t2-lt-tab .tab {
        width: 52px;
        min-height: 180px;
        background: var(--red);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        /* hard ink edge shadow so it reads against any background */
        box-shadow: 3px 0 0 var(--ink);
      }

      #t2-lt-tab .tab-label {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-tiny);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--paper);
        transform: rotate(-90deg);
        white-space: nowrap;
      }

      /* The cream paper card to the right of the tab */
      #t2-lt-tab .card {
        background: var(--paper);
        padding: 22px 36px 22px 32px;
        /* Hard ink drop shadow — paper cutout feel */
        box-shadow: 8px 8px 0 var(--ink), 12px 12px 0 rgba(23,19,14,0.18);
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 560px;
      }

      /* Name — big Fraunces */
      #t2-lt-tab .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 80px;
        line-height: 0.95;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        white-space: nowrap;
      }

      /* Thin yellow underline beneath name */
      #t2-lt-tab .name-rule {
        width: 100%;
        height: 5px;
        background: var(--yellow);
        margin: 10px 0 10px;
        transform-origin: left center;
      }

      /* Role — Archivo */
      #t2-lt-tab .role {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-label);
        letter-spacing: 0.04em;
        color: var(--ink);
        opacity: 0.75;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-tab" data-composition-id="t2-lt-tab" data-start="0" data-width="1920" data-height="1080">
      <div class="assembly">
        <div class="tab">
          <div class="tab-label" data-slot="tag">ANALYSIS</div>
        </div>
        <div class="card">
          <div class="name" data-slot="name">Priya Subramaniam</div>
          <div class="name-rule"></div>
          <div class="role" data-slot="role">Investigative Reporter · Vox</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Full assembly starts off-screen left, tab slides in first
      tl.from("#t2-lt-tab .assembly", { x: -640, duration: 0.38, ease: "power3.out" }, 0.0)
        // Card pops from slight overshoot after tab lands
        .from("#t2-lt-tab .card", { scaleX: 0, transformOrigin: "left center", duration: 0.32, ease: "back.out(1.9)" }, 0.28)
        // Name snaps in with back.out
        .from("#t2-lt-tab .name", { autoAlpha: 0, x: -30, duration: 0.35, ease: "back.out(1.5)" }, 0.42)
        // Yellow rule wipes left-to-right
        .from("#t2-lt-tab .name-rule", { scaleX: 0, transformOrigin: "left center", duration: 0.28, ease: "power2.out" }, 0.58)
        // Role steps in choppy
        .from("#t2-lt-tab .role", { autoAlpha: 0, y: 12, duration: 0.28, ease: "steps(4)" }, 0.72)
        .set({}, {}, 7);

      window.__timelines["t2-lt-tab"] = tl;
    </script>
  </body>
</html>
