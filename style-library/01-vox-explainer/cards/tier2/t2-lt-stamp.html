<!doctype html>
<!--
  VOX EXPLAINER · tier2 · lower-third stamp
  TRANSPARENT — only the rubber-stamp graphic paints. Lower-left safe zone.
  Slots: tag (inside top of stamp), name (big ink Fraunces inside stamp),
         role (cream chip beneath the stamp).
  Motion: stamp slams down — scale from 1.4 + autoAlpha back.out, then role drops in.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-stamp {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }

      #t2-lt-stamp .wrap {
        position: absolute; left: 110px; bottom: 100px;
      }

      /* the tilted rubber stamp frame */
      #t2-lt-stamp .stamp {
        display: inline-block;
        transform: rotate(-4deg);
        transform-origin: center center;
        padding: 18px 32px 14px;
        border: 7px solid var(--ink);   /* outer thick border */
        box-shadow:
          inset 0 0 0 4px var(--ink);   /* inner thin border (inset = double border) */
        background: var(--paper);
        opacity: 0.9;                   /* slight ink-bleed distress */
        position: relative;
      }

      /* tag sits at top of stamp, small uppercase */
      #t2-lt-stamp .tag {
        display: block;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink);
        text-align: center;
        margin-bottom: 6px;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 6px;
      }

      /* name in big Fraunces, ink on paper plate, inside the stamp */
      #t2-lt-stamp .name {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 80px; line-height: 0.92;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        white-space: nowrap;
        display: inline-block;
        text-align: center;
        background: rgba(239, 233, 220, 0.94);
        padding: 4px 16px;
        border-radius: 2px;
      }

      /* role chip sits beneath the stamp (outside, unrotated) */
      #t2-lt-stamp .role-wrap {
        display: block;
        /* counter-rotate the role wrap so it sits level beneath the tilted stamp */
        padding-top: 18px;
      }

      #t2-lt-stamp .role {
        display: inline-block;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-body); letter-spacing: 0.04em;
        color: var(--ink); background: var(--paper);
        padding: 6px 16px;
        box-shadow: 5px 5px 0 rgba(23,19,14,0.25);
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-stamp" data-composition-id="t2-lt-stamp" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="stamp">
          <span class="tag" data-slot="tag">ON RECORD</span>
          <span class="name" data-slot="name">Priya Nair</span>
        </div>
        <div class="role-wrap">
          <div class="role" data-slot="role">Chief Economist · IMF Research Div.</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // stamp slams down: oversized scale collapses to 1.0 with back.out overshoot
      tl.from("#t2-lt-stamp .stamp", {
        autoAlpha: 0,
        scale: 1.45,
        transformOrigin: "center center",
        duration: 0.38, ease: "back.out(2.2)"
      }, 0.0)

      // a quick contents snap: tag and name already visible inside, but fade in
      // half a beat later so the "slam" reads first
      .from("#t2-lt-stamp .tag", {
        autoAlpha: 0,
        duration: 0.2, ease: "power2.out"
      }, 0.24)

      .from("#t2-lt-stamp .name", {
        autoAlpha: 0, scaleX: 0,
        transformOrigin: "center center",
        duration: 0.3, ease: "power3.out"
      }, 0.3)

      // role chip snaps in below with steps() choppy feel
      .from("#t2-lt-stamp .role", {
        autoAlpha: 0, y: 14,
        duration: 0.3, ease: "steps(4)"
      }, 0.65)

      .set({}, {}, 7);

      window.__timelines["t2-lt-stamp"] = tl;
    </script>
  </body>
</html>
