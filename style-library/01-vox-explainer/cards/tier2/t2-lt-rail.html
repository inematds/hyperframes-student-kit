<!doctype html>
<!--
  VOX EXPLAINER · tier2 · lower-third rail
  TRANSPARENT — only the component paints. Sits lower-left so it never
  covers a centered speaker.
  Slots: tag (kicker above name), name (Fraunces big), role (Archivo beneath).
  Motion: yellow rail wipes up (scaleY), text slides in from rail right edge.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lt-rail {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }
      #t2-lt-rail .wrap {
        position: absolute; left: 110px; bottom: 130px;
        display: flex; flex-direction: row; align-items: flex-end; gap: 0;
      }
      /* Tall yellow vertical rail on the far left */
      #t2-lt-rail .rail {
        width: 14px;
        height: 190px;
        background: var(--yellow);
        flex-shrink: 0;
        transform-origin: bottom center;
        /* scaleY animated in */
      }
      /* Text block sits right of the rail with a small gap */
      #t2-lt-rail .text-block {
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      #t2-lt-rail .tag {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-label);
        letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 8px;
        display: inline-block;
      }
      #t2-lt-rail .name {
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 88px;
        line-height: 0.95;
        letter-spacing: var(--track-tight);
        color: var(--paper);
        text-shadow: 0 4px 0 rgba(23,19,14,0.9), 6px 6px 0 rgba(23,19,14,0.35);
        white-space: nowrap;
      }
      #t2-lt-rail .role {
        font-family: var(--font-label);
        font-weight: var(--wt-bold);
        font-size: var(--size-body);
        letter-spacing: 0.04em;
        color: var(--ink);
        background: var(--paper);
        display: inline-block;
        padding: 5px 14px;
        margin-top: 12px;
        box-shadow: 4px 4px 0 rgba(23,19,14,0.22);
        transform: skewX(var(--marker-skew));
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-rail" data-composition-id="t2-lt-rail" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="rail"></div>
        <div class="text-block">
          <div class="tag" data-slot="tag">CORRESPONDENT</div>
          <div class="name" data-slot="name">Marcus Oyelaran</div>
          <div class="role" data-slot="role">Foreign Policy Desk · The Brief</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Rail wipes upward from bottom
      tl.from("#t2-lt-rail .rail", {
          scaleY: 0, transformOrigin: "bottom center",
          duration: 0.3, ease: "power3.out"
        }, 0.0)
        // tag snaps in from left (clips to rail edge)
        .from("#t2-lt-rail .tag", {
          autoAlpha: 0, x: -32,
          duration: 0.28, ease: "back.out(2.2)"
        }, 0.22)
        // name slides in from rail with slight overshoot
        .from("#t2-lt-rail .name", {
          autoAlpha: 0, x: -50,
          duration: 0.38, ease: "back.out(1.7)"
        }, 0.32)
        // role chips in with steps ease
        .from("#t2-lt-rail .role", {
          autoAlpha: 0, y: 12,
          duration: 0.3, ease: "steps(4)"
        }, 0.58)
        .set({}, {}, 7);

      window.__timelines["t2-lt-rail"] = tl;
    </script>
  </body>
</html>
