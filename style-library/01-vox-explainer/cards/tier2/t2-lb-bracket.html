<!doctype html>
<!--
  VOX EXPLAINER · tier2 · label-bracket (overlay: term framed by heavy ink brackets)
  TRANSPARENT. Two thick editorial square brackets flank the term like a dictionary
  entry. Brackets snap in from outside; term wipes in between them.
  Slots: term, detail.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lb-brkt {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-display);
      }
      #t2-lb-brkt .wrap { position: absolute; left: 150px; top: 355px; width: 820px; }
      /* bracket row */
      #t2-lb-brkt .bracket-row {
        display: flex; align-items: center; gap: 0;
      }
      /* Each bracket is a pair of border lines (top + bottom + side) drawn via borders */
      #t2-lb-brkt .brk {
        width: 22px; height: 92px;
        border-top: 8px solid var(--ink);
        border-bottom: 8px solid var(--ink);
        flex-shrink: 0;
      }
      #t2-lb-brkt .brk-left {
        border-left: 8px solid var(--ink);
        border-right: none;
        margin-right: 18px;
      }
      #t2-lb-brkt .brk-right {
        border-right: 8px solid var(--ink);
        border-left: none;
        margin-left: 18px;
      }

      /* term between the brackets */
      #t2-lb-brkt .term {
        display: inline-block; overflow: hidden;
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: 72px;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        white-space: nowrap;
        line-height: 1;
        background: rgba(239, 233, 220, 0.94);
        padding: 4px 16px;
        border-radius: 2px;
      }

      /* detail beneath, cream chip */
      #t2-lb-brkt .detail {
        margin-top: 26px; max-width: 640px;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4; color: var(--ink);
        background: rgba(239,233,220,0.92); padding: 10px 16px; display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="t2-lb-brkt" data-composition-id="t2-lb-brkt" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="bracket-row">
          <div class="brk brk-left"></div>
          <div class="term" data-slot="term">regulatory capture</div>
          <div class="brk brk-right"></div>
        </div>
        <div class="detail" data-slot="detail">When the agency meant to police an industry starts serving it.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Left bracket slides in from the left */
      tl.from("#t2-lb-brkt .brk-left", {
          x: -60, autoAlpha: 0, duration: 0.28, ease: "power3.out"
        }, 0.0)
      /* Right bracket slides in from the right */
        .from("#t2-lb-brkt .brk-right", {
          x: 60, autoAlpha: 0, duration: 0.28, ease: "power3.out"
        }, 0.0)
      /* Term wipes in from left between the brackets */
        .from("#t2-lb-brkt .term", {
          autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
          duration: 0.36, ease: "back.out(1.4)"
        }, 0.22)
      /* Detail steps in beneath */
        .from("#t2-lb-brkt .detail", {
          autoAlpha: 0, y: 14, duration: 0.30, ease: "steps(4)"
        }, 0.56)
        .set({}, {}, 7);

      window.__timelines["t2-lb-brkt"] = tl;
    </script>
  </body>
</html>
