<!doctype html>
<!--
  VOX EXPLAINER · tier2 · lower-third typecard
  TRANSPARENT — only the paper card paints. Lower-left safe zone.
  Slots: tag (tiny uppercase label at card top), name (big Fraunces),
         role (Archivo byline typed in via steps() ease).
  Motion: card slides up from below + settles with back.out, then
          role types in character-by-character via clip + steps().
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-type {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent;
      }

      #t2-lt-type .wrap {
        position: absolute; left: 110px; bottom: 100px;
      }

      /* the paper card itself */
      #t2-lt-type .card {
        display: inline-block;
        background: var(--paper);
        border: 2px solid var(--ink);         /* hairline ink border */
        box-shadow: 8px 8px 0 rgba(23,19,14,0.85); /* hard drop shadow — editorial feel */
        padding: 20px 32px 22px;
        position: relative;
        min-width: 480px;
      }

      /* tag: tiny all-caps at very top of card */
      #t2-lt-type .tag {
        display: block;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      /* thin divider beneath tag */
      #t2-lt-type .divider {
        display: block;
        width: 100%; height: 1px;
        background: var(--ink); opacity: 0.25;
        margin-bottom: 10px;
      }

      /* name in big Fraunces, ink on paper */
      #t2-lt-type .name {
        display: block;
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: 84px; line-height: 0.93;
        letter-spacing: var(--track-tight);
        color: var(--ink);
        white-space: nowrap;
      }

      /* role: typewriter byline — Archivo, wide tracking, revealed via clip */
      #t2-lt-type .role-outer {
        display: block;
        overflow: hidden;   /* clip used for typewriter reveal */
        width: 0;           /* GSAP animates width to full */
        white-space: nowrap;
        margin-top: 10px;
      }

      #t2-lt-type .role {
        display: inline-block;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-label); letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-type" data-composition-id="t2-lt-type" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="card">
          <span class="tag" data-slot="tag">CORRESPONDENT</span>
          <span class="divider"></span>
          <span class="name" data-slot="name">James Ochieng</span>
          <div class="role-outer">
            <span class="role" data-slot="role">Foreign Affairs Editor · The Atlantic</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // card slides up from below with back.out overshoot (settles in place)
      tl.from("#t2-lt-type .card", {
        autoAlpha: 0, y: 60,
        duration: 0.42, ease: "back.out(1.8)"
      }, 0.0)

      // tag and divider fade in after card lands
      .from("#t2-lt-type .tag", {
        autoAlpha: 0,
        duration: 0.22, ease: "power2.out"
      }, 0.36)

      .from("#t2-lt-type .divider", {
        scaleX: 0, transformOrigin: "left center",
        duration: 0.22, ease: "power2.out"
      }, 0.42)

      // name wipes in via scaleX from left
      .from("#t2-lt-type .name", {
        autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
        duration: 0.32, ease: "power3.out"
      }, 0.5)

      // role types in: animate the clip-width with steps() for typewriter feel
      .to("#t2-lt-type .role-outer", {
        width: 600,
        duration: 0.75, ease: "steps(24)"
      }, 0.9)

      .set({}, {}, 7);

      window.__timelines["t2-lt-type"] = tl;
    </script>
  </body>
</html>
